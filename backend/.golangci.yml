# golangci-lint v2 configuration. Run from backend/: `golangci-lint run`.
# Docs: https://golangci-lint.run/docs/configuration/file/
version: "2"

linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose # HTTP response bodies must be closed (leaks connections)
    - errorlint # compare/unwrap errors with errors.Is/As, wrap with %w
    - gosec # common security mistakes
    - misspell # typos in comments and strings
    - nilerr # returning nil when an error was just checked
    - noctx # HTTP requests and SQL queries must carry a context
    - revive # style: naming, doc comments on exported identifiers
    - rowserrcheck # rows.Err() must be checked after iterating
    - sqlclosecheck # sql.Rows / sql.Stmt must be closed
    - unconvert # unnecessary type conversions
    - usestdlibvars # http.MethodGet instead of "GET", etc.
    # Added 07/10/2026 (audit G8) with a ratchet: CI fails only on issues a
    # change introduces (see the Makefile and backend.yml); `make lint-all`
    # shows the whole backlog.
    - sloglint # log calls: static message, snake_case keys, no mixed args
    - nolintlint # every //nolint names its linter and says why
    - thelper # test helpers call t.Helper() and name the param t/b/tb
    - tparallel # t.Parallel in a subtest only with a parallel parent
    - usetesting # t.TempDir, t.Setenv, t.Context instead of the os/context ones
    - copyloopvar # no more `x := x` in loops (Go 1.22+)
    - intrange # for i := range n
    - errname # ErrFoo for sentinels, FooError for types
    - gocritic # a few bug-prone and readability checks (see settings)
    - forcetypeassert # x.(T) without the comma-ok form can panic
    - gocyclo # branches per function
    - gocognit # how hard a function is to read (nesting counts)
    # Added 16/10/2026, with the lower complexity limits below.
    - maintidx # maintainability index: size, branches and operators together
    - mnd # magic numbers
    - goconst # the same string repeated
    - godot # comments end with a period
  settings:
    misspell:
      locale: US
      # "teatro da mente" is the combat mode's name in the API (ADR-0017): a
      # combat on a map is `grid`, a combat without one is `theatre`.
      ignore-rules:
        - theatre
    sloglint:
      no-mixed-args: true
      context: scope
      static-msg: true
      key-naming-case: snake
    thelper:
      # dbtest and friends take `t testing.TB`: naming it t is as clear as
      # tb, and renaming 23 signatures would be churn for a convention.
      tb:
        name: false
    nolintlint:
      require-explanation: true
      require-specific: true
    gocritic:
      # The default checks (ifElseChain, appendAssign, exitAfterDefer...)
      # plus the tags that find real bugs and wasted work. The "style",
      # "opinionated" and "experimental" tags stay off.
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        # Copying a 100-byte struct in a range loop is not our bottleneck.
        - rangeValCopy
        - hugeParam
    # Limits for new code (16/10/2026): cyclomatic complexity at most 15,
    # cognitive complexity at most 20 and a maintainability index of at least
    # 20 (0 to 100). The ratchet (--new-from-merge-base, --new-from-rev)
    # reports an issue only when its line changed, and these three linters
    # report on the line with `func`. So a new function, and an old one whose
    # `func` line changes (its name, receiver or first parameters) or moves in
    # the diff, must meet the limits; a change to the body of an old function
    # does not trigger them. The bodies are held by the totals gate instead
    # (.github/scripts/go-complexity.sh, same limits): no function over a
    # limit may appear or get worse. The functions over them today are in
    # .github/go-complexity-baseline.txt; `make lint-all` lists them too.
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    maintidx:
      under: 20
    mnd:
      # Argument and operation contexts are the noisy ones; the checks left
      # (assign, case, condition, return) catch real magic numbers.
      checks:
        - assign
        - case
        - condition
        - return
      ignored-numbers:
        - "0o600" # file modes
        - "0o644"
        - "0o700"
        - "0o750"
        - "0o755"
        - "1000" # ms per s, bytes per kB
        - "1024"
      ignored-functions:
        - "^time\\."
        - "^context\\.With"
        - "^strconv\\.(Parse|Format|Append)"
        - "^make$"
        - "^math\\."
    goconst:
      min-len: 5
      min-occurrences: 5
      ignore-string-values:
        - "^[a-z_]+$" # snake_case identifiers: reasons, columns, enum names
    godot:
      scope: declarations
      period: true
    revive:
      rules:
        # The defaults, listed explicitly so they are easy to discover.
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    # Code generated by buf (backend/gen) is not ours to fix.
    generated: strict
    paths:
      - ^gen/
    rules:
      # Tests are full of literals on purpose: a table of cases is the
      # point. Magic-value checks and complexity are for production code.
      - path: _test\.go
        linters:
          - mnd
          - goconst
          - gocyclo
          - gocognit
          - maintidx
          - forcetypeassert
    presets:
      - std-error-handling # e.g. unchecked errors from Close/Fprintln
      - common-false-positives

formatters:
  enable:
    - gofumpt # a stricter gofmt
    - goimports # groups imports: standard library, third party, this module
  settings:
    goimports:
      local-prefixes:
        - github.com/PuraFome/meuRPG/backend
  exclusions:
    generated: strict
    paths:
      - ^gen/
