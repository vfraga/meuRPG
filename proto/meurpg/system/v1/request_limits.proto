syntax = "proto3";

package meurpg.system.v1;

// RequestRefusedReason says which request size limit a field went over.
enum RequestRefusedReason {
  REQUEST_REFUSED_REASON_UNSPECIFIED = 0;
  // A repeated or map field has more items than it accepts.
  REQUEST_REFUSED_REASON_LIST_TOO_LONG = 1;
  // A string or bytes field is longer than it accepts.
  REQUEST_REFUSED_REASON_TEXT_TOO_LONG = 2;
}

// RequestRefused is the error detail of the `invalid_argument` the server
// answers when a field of the request is over its size limit, on any RPC
// (docs/architecture/api.md#request-size-limits). The handler never ran.
message RequestRefused {
  RequestRefusedReason reason = 1;
  // Path of the first field over its limit, in proto field names, with list
  // positions and map keys left out: "party.members.notes".
  string field = 2;
}
