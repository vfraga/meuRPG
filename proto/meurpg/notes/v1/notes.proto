syntax = "proto3";

// Package meurpg.notes.v1 is about the players' private notes (MR-030): what
// each player writes down during the campaign, tagged with a scene the group
// discovered, next to the clues the master revealed to them.
package meurpg.notes.v1;

import "google/protobuf/timestamp.proto";

// NotesService keeps each player's private notes (MR-030, RN-20).
//
// A note belongs to the player who wrote it, and to nobody else: the master
// does not read it (question 60, answered by default as "no"), and neither
// does another player. Every call below works on the caller's own notes, for
// an active player of the campaign only. A call by the campaign's master
// answers `not_found`, exactly as a note that is not there: the master has no
// notes, and learns nothing about the players'. A note of another player is
// `not_found` too, by ID or any other way.
//
// What a player reads here is their own notes and the clues the master
// revealed to them (meurpg.maps.v1.MapService.RevealSceneClue), as one list.
// A clue is the master's text: it cannot be edited or deleted, and it does
// not count toward the 300-note limit.
//
// A note may carry a scene tag. A scene can be tagged only once the group
// has "discovered" it (question 61): the master revealed its point on the
// map, or opened it in a session, even while the point was hidden. The name
// of any other scene never reaches a player through this service: a tag on a
// scene that is not discovered is refused exactly as a tag on a scene that
// does not exist.
//
// Text fields. Lengths count characters (Unicode code points), after the
// server trims spaces at both ends. A note is 1 to 2,000 characters and may
// have line breaks and tabs, but no other control characters. A note is
// fiction the player writes: do not write real people's data in it, and the
// server never logs it (docs/privacy.md). Deleting the account deletes
// the notes.
//
// Every method needs a valid session cookie and fails with `unauthenticated`
// without one. For a campaign the caller is not a member of (a pending member
// neither, RN-15), methods answer `not_found`, exactly as for a campaign that
// does not exist. An ID that is not a UUID is answered like an ID that does
// not exist.
//
// Errors every method can return, besides those listed on each method:
//   - `unauthenticated`: no valid session cookie.
//   - `invalid_argument`: a field breaks its documented rules. The message
//     names the field, never its value.
//   - `unavailable`: the database did not answer; the app may try again.
//   - `aborted`: the database kept reporting a conflicting transaction after
//     the server's retries; the app may try again.
//
// Responses carry `Cache-Control: no-store`. Every request carries a campaign
// ID, so reads are IDEMPOTENT and POST-only: a GET would put the ID in the URL,
// and URLs end up in the platform's request logs (docs/privacy.md).
service NotesService {
  // ListNotes returns the caller's notes and the clues revealed to them,
  // newest first (a note by when it was last written, a clue by when it
  // arrived). With scene_point_id set, only the entries tagged with that
  // scene. The list is not paged: it holds at most 300 notes plus the
  // revealed clues.
  //
  // A clue is tagged with its scene only once the group discovered it; until
  // then it has no tag and no scene name.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not an
  //     active member of it, or is its master.
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // CreateNote writes a new note, with an optional scene tag.
  //
  // Errors:
  //   - `invalid_argument`: text is empty or longer than 2,000 characters;
  //     scene_point_id is not a scene the group discovered (the same answer
  //     for a scene that does not exist or is not discovered).
  //   - `not_found`: as ListNotes.
  //   - `resource_exhausted`: the caller already has 300 notes in this
  //     campaign (revealed clues do not count).
  //
  // Safe to retry when the request carries an idempotency_key: a second call with the same key and
  // the same request returns what the first one made and makes nothing; the same key with another
  // request is `invalid_argument`. Without a key the call is not deduplicated.
  rpc CreateNote(CreateNoteRequest) returns (CreateNoteResponse);

  // UpdateNote changes the caller's own note: each field set replaces the
  // current value, and unset fields stay as they are. At least one must be
  // set.
  //
  // Errors:
  //   - `invalid_argument`: nothing to change; a field breaks the rules
  //     CreateNote lists.
  //   - `not_found`: as ListNotes; or the note is not the caller's (or is a
  //     clue, or does not exist).
  rpc UpdateNote(UpdateNoteRequest) returns (UpdateNoteResponse);

  // DeleteNote deletes the caller's own note, for good. A clue cannot be
  // deleted: its ID is `not_found` here.
  //
  // Errors:
  //   - `not_found`: as UpdateNote.
  rpc DeleteNote(DeleteNoteRequest) returns (DeleteNoteResponse);

  // ListNoteScenes returns the scenes the caller may tag a note with: only
  // the ones the group discovered, with their names, oldest discovery first.
  // It is the tag picker. A scene the group did not discover is not here, nor is one
  // on a map the players cannot open (not revealed, not the session's current one),
  // and its name never reaches a player.
  //
  // Errors:
  //   - `not_found`: as ListNotes.
  rpc ListNoteScenes(ListNoteScenesRequest) returns (ListNoteScenesResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// NoteKind says whose text an entry of the list is.
enum NoteKind {
  NOTE_KIND_UNSPECIFIED = 0;
  // The player's own note: editable and deletable.
  NOTE_KIND_NOTE = 1;
  // A clue the master revealed ("Pista do mestre"): read-only, not
  // deletable, and not counted in the 300-note limit.
  NOTE_KIND_CLUE = 2;
}

// Note is one entry of the player's list: their own note, or a clue the
// master revealed to them.
message Note {
  // The entry's ID (a UUID). A clue's ID is not accepted by UpdateNote and
  // DeleteNote.
  string id = 1;
  NoteKind kind = 2;
  // The text: the player's, 1 to 2,000 characters, or the master's clue as it
  // was when revealed, 1 to 500 characters (a later edit or removal of the
  // clue does not change it).
  string text = 3;
  // The scene the entry is tagged with (a UUID); empty for none. Always a
  // discovered scene.
  string scene_point_id = 4;
  // The tagged scene's current name; empty when there is no tag.
  string scene_name = 5;
  // When the note was written, or the clue arrived.
  google.protobuf.Timestamp created_at = 6;
  // When the note was last changed; the same as created_at for a clue.
  google.protobuf.Timestamp updated_at = 7;
}

// ListNotesRequest names the campaign, and optionally a scene to filter by.
message ListNotesRequest {
  string campaign_id = 1;
  // Only the entries tagged with this scene (a UUID). Empty for all. A scene
  // the group did not discover has no entries, as any unknown ID.
  string scene_point_id = 2;
}

// ListNotesResponse is the caller's list.
message ListNotesResponse {
  // The entries, newest first.
  repeated Note notes = 1;
  // How many notes the caller has in the campaign (all of them, whatever the
  // filter): a clue is not counted.
  int32 note_count = 2;
  // The most notes a player may have: 300.
  int32 max_notes = 3;
}

// CreateNoteRequest carries the new note.
message CreateNoteRequest {
  string campaign_id = 1;
  // Required: 1 to 2,000 characters, with line breaks.
  string text = 2;
  // The scene tag (a UUID), one the group discovered; empty for none.
  string scene_point_id = 3;
  // Optional. 1 to 64 characters, chosen once by the app for this action: a retry with the
  // same key and the same request returns what the first call made instead of making another.
  // The key is unique for a player in the campaign; the same key with another request is `invalid_argument`.
  // Empty: the call is not deduplicated.
  string idempotency_key = 4;
}

// CreateNoteResponse returns the new note.
message CreateNoteResponse {
  Note note = 1;
}

// UpdateNoteRequest carries the fields to change.
message UpdateNoteRequest {
  string campaign_id = 1;
  string note_id = 2;
  // The new text, 1 to 2,000 characters.
  optional string text = 3;
  // The new scene tag, as CreateNoteRequest's; empty removes it.
  optional string scene_point_id = 4;
}

// UpdateNoteResponse returns the note as saved.
message UpdateNoteResponse {
  Note note = 1;
}

// DeleteNoteRequest names the note to delete.
message DeleteNoteRequest {
  string campaign_id = 1;
  string note_id = 2;
}

// DeleteNoteResponse is empty: the note is gone.
message DeleteNoteResponse {}

// ListNoteScenesRequest names the campaign.
message ListNoteScenesRequest {
  string campaign_id = 1;
}

// ListNoteScenesResponse lists the discovered scenes.
message ListNoteScenesResponse {
  repeated NoteScene scenes = 1;
}

// NoteScene is a scene the group discovered.
message NoteScene {
  // The scene's map point (a UUID).
  string id = 1;
  // The point's current name.
  string name = 2;
}
