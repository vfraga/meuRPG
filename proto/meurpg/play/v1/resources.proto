message AnswerLuckyRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  // The held roll (a UUID), from RollAttackResponse.lucky_offer.
  string hold_id = 3;
  // True: roll the die that shows the 1 again, and the new roll stands. False: keep the 1.
  bool reroll = 4;
  // How the new d20 comes (RN-18) when `reroll` is true: the app rolls it, or the player
  // typed the face of a real die (1 to 20). Required then.
  oneof roll {
    bool roll_in_app = 5;
    int32 typed_face = 6;
  }
  string idempotency_key = 7;
}

message AnswerLuckyResponse {
  // The attack as RollAttack answers it: resolved, with the die rolled again in
  // `roll.d20.rerolled`; or, when the attacker holds a Bardic Inspiration die, still held,
  // with `inspiration_offer` on the new roll.
  RollAttackResponse attack = 1;
}

message GetOutsideInspirationRequest {
  string campaign_id = 1;
}

// OutsideInspirationDie is a die a character holds out of a combat.
message OutsideInspirationDie {
  string character_id = 1;
  string character_name = 2;
  int32 sides = 3;
  // The bard that gave it, by name.
  string from_name = 4;
  // The game time the die has left, in seconds (it only moves when the master moves game
  // time).
  int32 seconds_left = 5;
}

// BardicInspirationTarget is a character the bard may give the die to.
message BardicInspirationTarget {
  string character_id = 1;
  string name = 2;
  // Why the die cannot go to this character, in Portuguese; empty when it can.
  string disabled_reason_pt = 3;
}

message GetOutsideInspirationResponse {
  // The caller's own character's die, unset when it holds none. The master gets none here.
  OutsideInspirationDie mine = 1;
  // The caller is a bard: the die they give, the uses left and the most, and the party.
  bool is_bard = 2;
  int32 sides = 3;
  int32 uses_left = 4;
  int32 uses_max = 5;
  repeated BardicInspirationTarget targets = 6;
  // The master reads every die held.
  repeated OutsideInspirationDie held = 7;
  // The caller's rolls that wait for an answer about the die, in a combat too (the die is
  // then on the combatant and `mine` is unset). A roll whose Lucky question waits is in
  // `lucky_offers` instead, until it is answered.
  // Deprecated (E4-9): the question is `held_roll_offer` (answered with AnswerHeldRoll). This field is still served, for a
  // tab opened before the one question existed; it will go with the old answer RPCs.
  repeated OutsideInspirationOffer offers = 8 [deprecated = true];
  // A combat is open: the bard gives in it.
  bool combat_open = 9;
  // The caller's rolls that wait for the halfling's Lucky question ("Tirou 1: rolar de novo?",
  // AnswerOutsideLucky), in a combat too, whether or not the character holds a die: a reload
  // asks again. `attack_key` and `target_id` are empty (they are a weapon attack's).
  // Deprecated (E4-9): the question is `held_roll_offer` (answered with AnswerHeldRoll). This field is still served, for a
  // tab opened before the one question existed; it will go with the old answer RPCs.
  repeated LuckyOffer lucky_offers = 10 [deprecated = true];
}

message GiveBardicInspirationOutsideRequest {
  string campaign_id = 1;
  // The character that gets the die (a UUID).
  string target_character_id = 2;
  string idempotency_key = 3;
}

message GiveBardicInspirationOutsideResponse {
  CharacterVitals vitals = 1;
  OutsideInspirationDie die = 2;
}

message AnswerOutsideInspirationRequest {
  string campaign_id = 1;
  // The held roll (a UUID), from the offer.
  string hold_id = 2;
  // True: roll the die and add it to the total. False: keep the die.
  bool use = 3;
  // How the die comes when `use` is true (RN-18): the app rolls it, or the player typed the
  // face. Required then.
  oneof roll {
    bool roll_in_app = 4;
    int32 typed_face = 5;
  }
  string idempotency_key = 6;
}

message AnswerOutsideInspirationResponse {
  // The path of the held roll answers as it does: the scene check, the group check, the trap
  // search, the puzzle hint try, the spell cast, the effect's saving throw or the concentration
  // save.
  oneof result {
    RollSceneCheckResponse scene_check = 1;
    RollGroupCheckResponse group_check = 2;
    SearchForTrapsResponse trap_search = 3;
    TryPuzzleHintResponse hint_try = 4;
    CastSpellResponse spell_cast = 5;
    RollEffectSaveResponse effect_save = 6;
    ResolveConcentrationSaveResponse concentration_save = 7;
  }
}

message AnswerOutsideLuckyRequest {
  string campaign_id = 1;
  // The held roll (a UUID), from the response's `lucky_offer` or GetOutsideInspiration's
  // `lucky_offers`.
  string hold_id = 2;
  // True: roll the die that shows the 1 again, and the new roll stands. False: keep the 1.
  bool reroll = 3;
  // How the new d20 comes (RN-18) when `reroll` is true: the app rolls it, or the player typed
  // the face of a real die (1 to 20). Required then.
  oneof roll {
    bool roll_in_app = 4;
    int32 typed_face = 5;
  }
  string idempotency_key = 6;
}

message AnswerOutsideLuckyResponse {
  // The path of the held roll answers as it does, as in AnswerOutsideInspirationResponse: the
  // roll written, with the die rolled again in its `rerolled`; or, when the character holds a
  // Bardic Inspiration die, the path's `inspiration_offer` on the new roll.
  oneof result {
    RollSceneCheckResponse scene_check = 1;
    RollGroupCheckResponse group_check = 2;
    SearchForTrapsResponse trap_search = 3;
    TryPuzzleHintResponse hint_try = 4;
    CastSpellResponse spell_cast = 5;
    RollEffectSaveResponse effect_save = 6;
    ResolveConcentrationSaveResponse concentration_save = 7;
  }
}

message AnswerHeldRollRequest {
  string campaign_id = 1;
  // The held roll (a UUID), from the response's `held_roll_offer`, `Combatant.held_roll_offer` or ListHeldRolls.
  string hold_id = 2;
  string idempotency_key = 3;
  // The answer to the question that waits.
  oneof answer {
    LuckyAnswer lucky = 4;
    DieAnswer die = 5;
    IndomitableAnswer indomitable = 6;
    StrokeOfLuckAnswer stroke_of_luck = 7;
  }
}

// LuckyAnswer answers the halfling's question (SRD 5.1, Halfling, Lucky).
message LuckyAnswer {
  // True: roll the die that shows the 1 again, and the new roll stands. False: keep the 1.
  bool reroll = 1;
  // How the new d20 comes (RN-18) when `reroll` is true: the app rolls it, or the player typed the face of a
  // real die (1 to 20). Required then.
  oneof roll {
    bool roll_in_app = 2;
    int32 typed_face = 3;
  }
}

// DieAnswer answers the Bardic Inspiration question (SRD 5.1).
message DieAnswer {
  // True: roll the die and add it to the roll. False: keep it.
  bool use = 1;
  // How the die comes (RN-18) when `use` is true: the app rolls it, or the player typed the face of a real die.
  // Required then.
  oneof roll {
    bool roll_in_app = 2;
    int32 typed_face = 3;
  }
}

// IndomitableAnswer answers the fighter's question after a saving throw that failed (SRD 5.1, Fighter,
// Indomitable): roll the saving throw again and use the new roll, even when it is worse.
message IndomitableAnswer {
  // True: roll the saving throw again, spending one use of Indomitable. False: keep the roll.
  bool reroll = 1;
  // How the new d20 comes (RN-18) when `reroll` is true: the app rolls it, or the player typed the face of a real
  // die (1 to 20). Required then, one way or the other. With advantage or disadvantage on the save the new roll
  // takes both dice: type them in `typed_faces`, in the order rolled, instead of `typed_face`.
  oneof roll {
    bool roll_in_app = 2;
    int32 typed_face = 3;
  }
  repeated int32 typed_faces = 4;
}

// StrokeOfLuckAnswer answers the rogue's question after an attack that missed or an ability check that failed (SRD 5.1,
// Rogue 20, Stroke of Luck): turn the miss into a hit, or count the d20 as 20. Nothing is rolled, so there is no way
// of rolling to choose (RN-18).
message StrokeOfLuckAnswer {
  // True: use the feature, spending its one use (it comes back on a short or long rest). False: keep the roll.
  bool use = 1;
}

message AnswerHeldRollResponse {
  // The path of the held roll answers as it does: the roll written, or, when the roll waits for its next
  // question, the response with its offer.
  oneof result {
    RollAttackResponse attack = 1;
    CastSpellResponse spell_cast = 2;
    RollEffectSaveResponse effect_save = 3;
    ResolveConcentrationSaveResponse concentration_save = 4;
    RollSceneCheckResponse scene_check = 5;
    RollGroupCheckResponse group_check = 6;
    SearchForTrapsResponse trap_search = 7;
    TryPuzzleHintResponse hint_try = 8;
    RollDeathSaveResponse death_save = 9;
    StartContestResponse contest = 11;
    RespondContestResponse contest_answer = 12;
    HideResponse hide = 13;
    AnswerReactionResponse counterspell_check = 14;
    SubmitInitiativeResponse initiative = 10;
  }
  // The next question of the same roll, copied out of the result, when the roll still waits: the d20 Lucky
  // rolled again is asked about the die next. Unset when the roll was written.
  HeldRollOffer next = 20;
}

message ListHeldRollsRequest {
  string campaign_id = 1;
}

message ListHeldRollsResponse {
  // The questions that wait and the caller may answer, oldest first.
  repeated HeldRollOffer offers = 1;
}
