syntax = "proto3";

// Puzzles (MR-038, RN-27, Etapa 10, slice 10.7a): the master makes a puzzle for the
// campaign, shows it to the players of an open session, and they solve it live in the
// app. It has six kinds: "Apagar as luzes" (a board of lights; pressing one toggles it
// and its four neighbours), the combination lock (wheels of digits, letters or our own
// runes), the turning symbols (pillars of our own glyphs, which may turn together), the
// riddle (the player types an answer), the sequence (the master plays a row of bells
// and the players repeat it) and the cipher (a message swapped letter by letter, whose
// key is a clue the group finds in the adventure). Slice 10.7b added the last three, the
// hints won by a skill check, the split information (each player reads their own part
// of a clue) and the consequences of a wrong move ("Ao errar"): a trap fires, an attempt
// is spent, or a limit of moves or of time stops the puzzle.
//
// Every move is relative (press a cell, turn a wheel or a pillar by one), so two
// players' moves made at the same time both count, whichever the server takes first.
// The server decides when a puzzle is solved, in the same transaction as the winning
// move, and runs the master's "Ao resolver" action there. A solved run is frozen.
//
// What a player never receives (RN-10, RN-27), in any response or stream event: the
// solution of a lock, the minimum number of moves and a way to make them, a hint the
// master has not released, the "Ao resolver" action and its target, and any puzzle
// that is not shown, a riddle's accepted answers, a sequence before it is played, a
// cipher's plain message and key, the DC of a hint's skill check, and the parts of the
// split information that are other players'. A puzzle that is unknown or not shown
// answers `not_found`, as for a puzzle that does not exist. A player reads the state, the master's clue, the
// released hints, who moved last (the character's name), whether it is solved and, once
// it is, what happened ("A porta da Capela se abriu."). The goal is not a secret where
// the challenge is the moves, so the players of the turning symbols also read the mural
// they must copy and how the pillars turn together (the artboard E10-06, state 7); the
// lights' goal (every light off) is implicit, and a lock's solution is never sent.
package meurpg.play.v1;

import "google/protobuf/timestamp.proto";
import "meurpg/play/v1/combat.proto";

// PuzzleKind is the kind of a puzzle.
enum PuzzleKind {
  PUZZLE_KIND_UNSPECIFIED = 0;
  // "Apagar as luzes": a board of 3 to 7 lights a side.
  PUZZLE_KIND_LIGHTS = 1;
  // The combination lock: 2 to 6 wheels.
  PUZZLE_KIND_LOCK = 2;
  // The turning symbols: 3 to 6 pillars of 3 to 6 glyphs.
  PUZZLE_KIND_PILLARS = 3;
  // The riddle: the master writes it and the answers he accepts; a player types an
  // answer.
  PUZZLE_KIND_RIDDLE = 4;
  // The sequence: 3 to 8 bells and 3 to 12 steps. The master plays it; the players
  // repeat it bell by bell.
  PUZZLE_KIND_SEQUENCE = 5;
  // The cipher: a message the server swaps letter by letter. A player types the
  // plain message.
  PUZZLE_KIND_CIPHER = 6;
}

// PuzzleAlphabet is what the wheels of a lock show.
enum PuzzleAlphabet {
  PUZZLE_ALPHABET_UNSPECIFIED = 0;
  // The digits 0 to 9.
  PUZZLE_ALPHABET_DIGITS = 1;
  // The letters A to Z.
  PUZZLE_ALPHABET_LETTERS = 2;
  // Our own eight runes (Lua, Chama, Onda, Raiz, Olho, Estrela, Pedra, Folha).
  PUZZLE_ALPHABET_RUNES = 3;
}

// PuzzleSolveAction is what happens when the players solve the puzzle ("Ao
// resolver"). The master is always told, whatever the action. The app rolls no dice.
enum PuzzleSolveAction {
  // Same as NOTIFY.
  PUZZLE_SOLVE_ACTION_UNSPECIFIED = 0;
  // Only tell the master (the default).
  PUZZLE_SOLVE_ACTION_NOTIFY = 1;
  // Open a door of a map (RN-26): whatever its state (closed, locked, barred or
  // secret). The target is a PuzzleDoorTarget.
  PUZZLE_SOLVE_ACTION_OPEN_DOOR = 2;
  // Reveal a point of a map to the players (the same as MapService.
  // SetMapPointRevealed). The target is a PuzzlePointTarget; a light is refused, since
  // the players never see one.
  PUZZLE_SOLVE_ACTION_REVEAL_POINT = 3;
  // Reveal a scene clue (MR-029) to the character whose move solved the puzzle,
  // and to nobody else. The target is a PuzzleClueTarget.
  PUZZLE_SOLVE_ACTION_REVEAL_CLUE = 4;
}

// PuzzleSolveOutcome is what the server did when a puzzle was solved, as the master
// reads it.
enum PuzzleSolveOutcome {
  // The puzzle is not solved yet.
  PUZZLE_SOLVE_OUTCOME_UNSPECIFIED = 0;
  // Only the master was told.
  PUZZLE_SOLVE_OUTCOME_NOTIFIED = 1;
  // The door was opened.
  PUZZLE_SOLVE_OUTCOME_DOOR_OPENED = 2;
  // The door was open already, or is gone.
  PUZZLE_SOLVE_OUTCOME_DOOR_NOT_CLOSED = 3;
  // The point was revealed.
  PUZZLE_SOLVE_OUTCOME_POINT_REVEALED = 4;
  // The point was revealed already.
  PUZZLE_SOLVE_OUTCOME_POINT_ALREADY_REVEALED = 5;
  // The clue went to the solver's player.
  PUZZLE_SOLVE_OUTCOME_CLUE_REVEALED = 6;
  // The solver's player had the clue already.
  PUZZLE_SOLVE_OUTCOME_CLUE_ALREADY_HAD = 7;
  // The action could not run: the point or the clue was deleted since the puzzle was
  // made, the map is gone, or the solver has no player. The puzzle is solved all the
  // same. (A door painted away reads DOOR_NOT_CLOSED.)
  PUZZLE_SOLVE_OUTCOME_TARGET_GONE = 8;
}

// PuzzleRunStatus is where a puzzle stands in the open session, for the master.
enum PuzzleRunStatus {
  PUZZLE_RUN_STATUS_UNSPECIFIED = 0;
  // Not shown in this session (yet).
  PUZZLE_RUN_STATUS_NOT_SHOWN = 1;
  // The players see it and play.
  PUZZLE_RUN_STATUS_SHOWN = 2;
  // Solved: the state is frozen and the players see "Resolvido".
  PUZZLE_RUN_STATUS_SOLVED = 3;
  // The master closed it: the players no longer see it. Showing it again opens it
  // at its start.
  PUZZLE_RUN_STATUS_CLOSED = 4;
}

// PuzzleSymbol is one face of a wheel or a pillar: a stable key the app draws a
// picture for, and its Portuguese name, which is always written beside the picture.
message PuzzleSymbol {
  // The key, such as "moon" or "owl". For the digits and letters it is the character.
  string key = 1;
  // The Portuguese name, such as "Lua" or "Coruja".
  string name_pt = 2;
}

// PuzzleConfig is what a puzzle is made of, apart from its answer: one message per
// kind. A player gets it too.
message PuzzleConfig {
  oneof kind {
    LightsConfig lights = 1;
    LockConfig lock = 2;
    PillarsConfig pillars = 3;
    RiddleConfig riddle = 4;
    SequenceConfig sequence = 5;
    CipherConfig cipher = 6;
  }
}

// LightsConfig is the board of "Apagar as luzes".
message LightsConfig {
  // Lights a side, 3 to 7. The board is square.
  int32 size = 1;
}

// LockConfig is the combination lock.
message LockConfig {
  // The number of wheels, 2 to 6.
  int32 wheels = 1;
  // What the wheels show. Required.
  PuzzleAlphabet alphabet = 2;
}

// PillarsConfig is the turning symbols.
message PillarsConfig {
  // The number of pillars, 3 to 6.
  int32 pillars = 1;
  // The number of symbols each pillar turns through, 3 to 6: the first ones of the
  // table's six glyphs (Corvo, Lobo, Serpente, Coruja, Cervo, Peixe).
  int32 symbols = 2;
  // Links: links[i] lists the other pillars that turn with pillar i, by the same
  // step. It may be shorter than the number of pillars. Players read it too: it is
  // the rule "Girar um pilar gira também o da esquerda e o da direita".
  repeated PillarLinks links = 3;
}

// PillarLinks lists the pillars one pillar turns with it.
message PillarLinks {
  // Pillar numbers from 0, never the pillar itself and none twice.
  repeated int32 also_turns = 1;
}

// RiddleConfig is the riddle. A player reads it.
message RiddleConfig {
  // What the players read: the riddle itself, 1 to 500 characters.
  string text = 1;
}

// SequenceConfig is the sequence's shape. The sequence itself is the solution.
message SequenceConfig {
  // The number of bells, 3 to 8: the first ones of the table's eight (Sino redondo,
  // alto, largo, pequeno, rachado, fino, torto, grave), in `symbols`.
  int32 bells = 1;
  // The number of steps, 3 to 12. The players read it ("passo 3 de 6"), not which bell
  // each one is.
  int32 steps = 2;
}

// CipherConfig is the cipher. A player reads the ciphered message.
message CipherConfig {
  // The ciphered message as the players read it: the letters A to Z swapped, upper
  // case, with the spaces and the punctuation where they were. Set by the server from
  // the solution; what the master sends is ignored.
  string ciphertext = 1;
  // The scene clue (a UUID of a clue of the campaign) that says how the letters are
  // swapped: the group finds it in the adventure. Optional. The master's alone: a
  // player reads PuzzleRun.has_key_clue and, once their character has found the clue,
  // PuzzleRun.key_clue_id; the clue's text is the notes' (MR-029), never this puzzle's.
  string key_clue_id = 2;
}

// PuzzleSolution is the answer. It is the master's alone (RN-10). "Apagar as luzes"
// has none to store: its goal is every light off, and the minimum is worked out.
message PuzzleSolution {
  oneof kind {
    LockSolution lock = 2;
    PillarsSolution pillars = 3;
    RiddleSolution riddle = 4;
    SequenceSolution sequence = 5;
    CipherSolution cipher = 6;
  }
}

// RiddleSolution is the answers a riddle accepts.
message RiddleSolution {
  // 1 to 10 answers, each 1 to 80 characters. A typed answer is right when it equals
  // one of them ignoring case, accents, punctuation and the spaces around and between
  // the words ("  A Sombra! " is "a sombra").
  repeated string answers = 1;
}

// SequenceSolution is the sequence, in order.
message SequenceSolution {
  // The bell of each step, from 0: 3 to 12 steps, at least two different bells.
  repeated int32 steps = 1;
}

// CipherSolution is the message and how it is swapped.
message CipherSolution {
  // The plain message, 1 to 300 characters, with at least one letter.
  string message = 1;
  // How the letters are swapped: exactly one of the two.
  oneof method {
    // Every letter moves this many places on, 1 to 25 (3: A becomes D).
    int32 shift = 2;
    // A keyword of 3 to 26 distinct letters: the cipher alphabet starts with them (once
    // each, in order) and goes on with the others. "LUA" turns A into L, B into U, C into A.
    string keyword = 3;
  }
}

// LockSolution is what the wheels must show.
message LockSolution {
  // The position of each wheel in the alphabet, from 0, one per wheel.
  repeated int32 wheels = 1;
}

// PillarsSolution is the mural: what the pillars must show.
message PillarsSolution {
  // The position of each pillar among the symbols, from 0, one per pillar.
  repeated int32 pillars = 1;
}

// PuzzleState is where the pieces stand now, per kind.
message PuzzleState {
  oneof kind {
    LightsState lights = 1;
    LockState lock = 2;
    PillarsState pillars = 3;
    RiddleState riddle = 4;
    SequenceState sequence = 5;
    CipherState cipher = 6;
  }
}

// LightsState is the board, row by row from the top left.
message LightsState {
  // True for a lit light. size x size values.
  repeated bool lit = 1;
}

// LockState is the wheels.
message LockState {
  // The position of each wheel in the alphabet, from 0.
  repeated int32 wheels = 1;
}

// PillarsState is the pillars.
message PillarsState {
  // The position of each pillar among the symbols, from 0.
  repeated int32 pillars = 1;
}

// RiddleState is the riddle's state: nothing moves but the answer, so it is empty.
message RiddleState {}

// SequenceState is where the players are in the sequence.
message SequenceState {
  // How many steps the attempt has right so far, from 0. A wrong bell sends it back
  // to 0. Players read it ("Passos certos 0 de 6").
  int32 progress = 1;
}

// CipherState is the cipher's state: nothing moves but the answer, so it is empty.
message CipherState {}

// PuzzleMove is one move, per kind. It is relative: it says what to do to the state,
// never what the state becomes.
message PuzzleMove {
  oneof kind {
    LightsMove lights = 1;
    LockMove lock = 2;
    PillarsMove pillars = 3;
    RiddleMove riddle = 4;
    SequenceMove sequence = 5;
    CipherMove cipher = 6;
  }
}

// LightsMove presses a light: it and its four neighbours toggle.
message LightsMove {
  // The row, from 0 at the top.
  int32 row = 1;
  // The column, from 0 at the left.
  int32 col = 2;
}

// LockMove turns a wheel by one position, wrapping around the alphabet.
message LockMove {
  // The wheel, from 0.
  int32 wheel = 1;
  // +1 or -1.
  int32 delta = 2;
}

// PillarsMove turns a pillar by one symbol, and the pillars linked to it with it.
message PillarsMove {
  // The pillar, from 0.
  int32 pillar = 1;
  // +1 or -1.
  int32 delta = 2;
}

// RiddleMove is an answer. It is judged, not applied: a wrong one changes nothing
// but the consequences ("Ao errar"). The text is the player's own data (typed by them);
// the other players never read it.
message RiddleMove {
  // What the player typed, 1 to 600 characters.
  string answer = 1;
}

// SequenceMove strikes a bell. The sequence must have been played at least once, and
// not be playing now.
message SequenceMove {
  // The bell, from 0.
  int32 bell = 1;
}

// CipherMove is the message the player typed, deciphered. Judged like a riddle's answer.
message CipherMove {
  // What the player typed, 1 to 600 characters.
  string text = 1;
}

// PuzzleOnSolve is "Ao resolver": an action and what it acts on.
message PuzzleOnSolve {
  // The action; UNSPECIFIED is NOTIFY.
  PuzzleSolveAction action = 1;
  // Optional text the players read once it is solved ("A porta da Capela se abriu."),
  // up to 200 characters. Empty: the players read a generic line for the action.
  string message = 5;
  // What it acts on: required for OPEN_DOOR, REVEAL_POINT and REVEAL_CLUE, refused
  // for NOTIFY.
  oneof target {
    PuzzleDoorTarget door = 2;
    PuzzlePointTarget point = 3;
    PuzzleClueTarget clue = 4;
  }
}

// PuzzleDoorTarget is a door: a square of a map of the campaign that has a door.
message PuzzleDoorTarget {
  // The map (a UUID).
  string map_id = 1;
  // The square, from 0, from the top left of the map's grid.
  int32 col = 2;
  int32 row = 3;
}

// PuzzlePointTarget is a point of a map of the campaign.
message PuzzlePointTarget {
  // The map (a UUID).
  string map_id = 1;
  // The point (a UUID).
  string point_id = 2;
}

// PuzzleClueTarget is a clue of a scene point of the campaign.
message PuzzleClueTarget {
  // The clue (a UUID).
  string clue_id = 1;
}

// PuzzleMinimum is the fewest moves from the state to the solution, and one way to
// make them. It is the master's alone (RN-10).
message PuzzleMinimum {
  // False when no sequence of moves reaches the solution (the links can make it so).
  bool solvable = 1;
  // The fewest moves. 0 when solved.
  int32 moves = 2;
  // One shortest way: the moves in order. For the lights, the cells to press (the
  // hint ring); for a lock, each wheel's turns the short way round; for a sequence,
  // the bells still to strike. A riddle and a cipher have one move (the answer) and
  // no path.
  repeated PuzzleMove path = 3;
}

// Puzzle is a puzzle as the master keeps it: the master's alone, with the answer.
message Puzzle {
  // A UUID.
  string id = 1;
  // The campaign (a UUID).
  string campaign_id = 2;
  // The kind.
  PuzzleKind kind = 3;
  // The name, 1 to 80 characters, such as "O selo da Capela".
  string name = 4;
  // What it is made of.
  PuzzleConfig config = 5;
  // The answer (a lock's, the pillars'). Unset for the lights.
  PuzzleSolution solution = 6;
  // Where it starts: the lights and the pillars' start was generated from a seed, the
  // lock's was chosen by the master.
  PuzzleState start = 7;
  // The fewest moves from the start.
  PuzzleMinimum minimum = 8;
  // The faces of the lock's alphabet or of the pillars' glyphs, in the order they turn.
  // Empty for the lights.
  repeated PuzzleSymbol symbols = 9;
  // The master's clue for the players, 0 to 500 characters.
  string clue = 10;
  // The hints, in the order the master releases them: 0 to 10, each 1 to 300
  // characters.
  repeated string hints = 11;
  // "Ao resolver".
  PuzzleOnSolve on_solve = 12;
  // True once the master archived it: it is out of the lists and cannot be shown.
  bool archived = 13;
  // True once it was shown in any session: from then on it cannot be edited.
  bool shown = 14;
  // When it was made and last edited.
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  // The skill check that wins a player the next hint (a skill and a DC). Unset: hints
  // come only from the master's release. The master's alone: no player reads the DC.
  PuzzleHintCheck hint_check = 17;
  // The split information: parts of a clue, each given to one player's character, up
  // to 8. Every player reads only their own (PuzzleRun.my_part).
  repeated PuzzlePart parts = 18;
  // "Ao errar": what a wrong answer or bell does. Unset: nothing.
  PuzzleOnWrong on_wrong = 19;
}

// PuzzleHintCheck is the skill check that wins the next hint.
message PuzzleHintCheck {
  // The skill, as a scene check's key: "skill:investigation", "skill:arcana"... Any
  // of the SRD's 18 skills (the Portuguese name is MapService's scene check name).
  string skill_key = 1;
  // The DC, 1 to 30. The master's alone.
  int32 dc = 2;
}

// PuzzlePart is a part of the clue a player reads in the split information.
message PuzzlePart {
  // The player's character that gets it (a UUID of a living player character of the
  // campaign), or empty for a part with no owner yet ("Sem dono": no player reads it).
  string character_id = 1;
  // What that player reads, 1 to 300 characters.
  string text = 2;
  // Set by the server on the master's reads: the part has an owner who is not a living
  // player character of the active party any more (it died, or left), so nobody reads
  // it ("Parte de um personagem morto"). False for a part with no owner.
  bool owner_unavailable = 3;
}

// PuzzleOnWrong is "Ao errar": what a wrong answer or a wrong bell does, and the limits
// every kind's moves count toward. All of it is optional and they combine; the app's form
// shows one option at a time. A trap and the attempts apply only to the kinds that judge
// a move (the riddle, the sequence and the cipher); the limits apply to all six.
message PuzzleOnWrong {
  // A trap point of a map of the campaign that fires on a wrong move (MR-035). The
  // point fires once: the master arms it again (MapService.UpdateMapPoint with
  // TrapSpec.state = ARMED) to have it fire again. The master decides what the trap does,
  // as with any trap fired by hand. While a combat without a map runs (RN-25) it fires
  // nothing, and the wrong move still counts. While a combat runs on the trap's map the
  // firing is that combat's (a combat change, with its log line), so the master may
  // extend it to the creatures it catches (PlayService.FireTrap with extend_firing_id).
  PuzzleTrapTarget trap = 1;
  // How many wrong moves each player may make in a round, 1 to 10. 0: no limit. A
  // wrong move spends one; with none left, the player's moves are refused
  // (NO_ATTEMPTS_LEFT). "Recomeçar" gives them back.
  int32 attempts_per_player = 2;
  // The limit of moves in a round, 1 to 200: every move counts, right or wrong. Reaching
  // it stops the puzzle, unless that move solved it. 0: no limit.
  int32 max_moves = 3;
  // The time limit of a round in seconds, 10 to 14400 (4 hours), counted from when the
  // puzzle is shown or restarted; for a sequence, from its first play in the round, so
  // the clock never runs out before anyone may play. 0: no limit. When it runs out the
  // puzzle stops.
  int32 time_limit_seconds = 4;
}

// PuzzleTrapTarget is a trap point of a map.
message PuzzleTrapTarget {
  // The map (a UUID).
  string map_id = 1;
  // The point, which must be a trap (a UUID).
  string point_id = 2;
}

// PuzzleLastMove is the last move of a run, as a player reads it.
message PuzzleLastMove {
  // The name of the character that made it.
  string character_name = 1;
  // The move. For a player it is unset for the riddle, the sequence and the cipher: a
  // typed answer is its author's, and which bell was struck would give the sequence
  // away. The master's own read has them (MasterPuzzleRun.last_move).
  PuzzleMove move = 2;
  // What changed: the lights (row-major cells), the wheel, or the pillars that turned.
  repeated int32 changed = 3;
  // When it was made.
  google.protobuf.Timestamp at = 4;
  // True when the move was wrong: a wrong answer, or a wrong bell.
  bool wrong = 5;
  // For a sequence, the number of the step (from 1) the bell was struck for: "Errou o
  // passo 4". 0 for the other kinds.
  int32 step = 6;
  // The name the master gave the trap point, when this wrong move fired a trap
  // ("A armadilha disparou: Dardos envenenados"). Empty otherwise, and for a player who
  // does not see the trap's point (its map is not on their screen, or a fog map hides
  // the square from them): they read nothing, not an empty name. A trap that fired is
  // public to who sees it (MR-035); its DCs and effect never are.
  string trap_name = 7;
}

// PuzzleRun is a puzzle in the open session as a player reads it, and nothing more
// (RN-10, RN-27): no lock solution, no minimum, only the hints the master released.
message PuzzleRun {
  // The puzzle (a UUID).
  string puzzle_id = 1;
  // The name.
  string name = 2;
  // The kind.
  PuzzleKind kind = 3;
  // What it is made of, with the pillars' links (the rule of how they turn together).
  PuzzleConfig config = 4;
  // The faces of the wheels or the pillars, in the order they turn. Empty for the lights.
  repeated PuzzleSymbol symbols = 5;
  // Where the pieces stand now.
  PuzzleState state = 6;
  // The master's clue.
  string clue = 7;
  // The hints released so far, in order.
  repeated string hints = 8;
  // Counts every change of the run (a move, a reset, a hint, a new start). Apply a read
  // only if its revision is larger than the one on screen.
  int32 revision = 9;
  // True once the puzzle is solved: nothing moves any more.
  bool solved = 10;
  // When it was solved, and the name of the character whose move solved it.
  google.protobuf.Timestamp solved_at = 11;
  string solved_by_name = 12;
  // The last move, unset before the first (and after a reset).
  PuzzleLastMove last_move = 13;
  // The mural the pillars must show, for the turning symbols only (the artboard
  // E10-06 shows the players the goal they copy). Unset for the other kinds: the
  // lights' goal is implicit and a lock's solution is never sent.
  PillarsSolution mural = 14;
  // What happened when the puzzle was solved, as the players read it: the master's
  // own text of "Ao resolver" or, without one, a generic line for what the action
  // did ("Uma porta se abriu.", "Salão do trono apareceu no mapa.", "Você ganhou uma
  // pista."). A point the players do not see (its map is hidden from them) is not named:
  // "Algo apareceu no mapa.". Empty until solved, and when the action did nothing and the master wrote
  // no text.
  string solved_message = 15;
  // The limits of this puzzle: this player's attempts left, the moves and the time.
  // Unset when the puzzle has none.
  PuzzleLimits limits = 16;
  // True once a limit stopped the puzzle (moves or time) and it is not solved: nothing
  // moves until the master restarts or closes it. The players read it neutrally.
  bool stopped = 17;
  // The neutral line for a stopped puzzle ("O quebra-cabeça parou. Ninguém joga mais
  // até o mestre recomeçar ou fechar."). Empty when it is not stopped.
  string stopped_message = 18;
  // This player's own part of the clue (split information). Empty for a puzzle with no
  // parts, or when no part is theirs.
  string my_part = 19;
  // The names of the other characters that have a part: who to talk to, never what
  // they read.
  repeated string part_holders = 20;
  // True when a skill check can win hints in this puzzle: the master set one.
  bool hint_by_check = 21;
  // The skill of that check, such as "skill:investigation": "Tentar uma dica ·
  // Investigação". The DC is never sent.
  string hint_skill_key = 22;
  // True when this player may try for the next hint now: the puzzle has a check, the
  // player has a living character, the next hint exists, they did not try for it yet,
  // and the puzzle is not solved or stopped. A failed try for a hint cannot be repeated
  // for the same hint: the player waits for the master to release it (another player
  // passing gives that player their own hint, not this one back).
  bool can_try_hint = 23;
  // How many of `hints` the master released (everyone reads them); the ones after are
  // this player's own, won by a check ("Esta dica é só sua").
  int32 shared_hints = 24;
  // The sequence's playback, for a sequence only: what has been revealed so far.
  SequencePlayback sequence = 25;
  // For a cipher: true when the master linked a scene clue with the key.
  bool has_key_clue = 26;
  // The clue with the key (a UUID), only when this player has found it: its text is in
  // the player's notes (MR-029). Never set before they find it.
  string key_clue_id = 27;
}

// PuzzleLimits is the limits of "Ao errar" as a player reads them: the counters that
// stay on screen. A limit that is not set is 0.
message PuzzleLimits {
  // The wrong moves this player may make in the round, and how many are left.
  int32 attempts_per_player = 1;
  int32 attempts_left = 2;
  // The limit of moves in the round and how many were made (right or wrong).
  int32 max_moves = 3;
  int32 moves_made = 4;
  // The time limit in seconds, how many seconds are left (0 when it ran out) and the
  // moment it runs out. The seconds are worked out when the run is read: tick locally
  // from `deadline`.
  int32 time_limit_seconds = 5;
  int32 seconds_left = 6;
  google.protobuf.Timestamp deadline = 7;
}

// SequencePlayback is what a player has seen of a sequence being played, and where the
// attempt stands. The server reveals the sequence step by step as the play happens (the
// first step at once, the next one SequencePlayback.step_ms later, and so on) and never
// sends a step ahead of its time, and never again once the play ends: to see it again
// the master plays it again. A player that missed it asks the master.
message SequencePlayback {
  // The number of steps (3 to 12).
  int32 total_steps = 1;
  // How many times the master has played it. 0: not yet, and moves are refused
  // (SEQUENCE_NOT_PLAYED).
  int32 plays = 2;
  // True while a play runs: moves are refused (SEQUENCE_PLAYING).
  bool playing = 3;
  // The bells revealed so far in the play that runs, in order. Empty when no play runs.
  repeated int32 shown = 4;
  // How long each step is shown, in milliseconds.
  int32 step_ms = 5;
  // Milliseconds until the next step is revealed or the play ends; 0 when no play runs.
  // Read again then: the stream also sends puzzle_changed at each step.
  int32 next_in_ms = 6;
}

// PuzzleHintTry is one try for a hint by a skill check, as the master reads it.
message PuzzleHintTry {
  // The name of the character that rolled.
  string character_name = 1;
  // The number of the hint it was for, from 1.
  int32 hint = 2;
  // True when the roll reached the DC.
  bool passed = 3;
  // The roll: the d20 and the total with the skill's bonus.
  DiceRoll roll = 4;
  // When.
  google.protobuf.Timestamp at = 5;
}

// PuzzleAttempts is a player's wrong moves in the round, as the master reads them.
message PuzzleAttempts {
  // The name of the player's character.
  string character_name = 1;
  // The wrong moves made in the round, and how many are left (0 without a limit).
  int32 wrong = 2;
  int32 left = 3;
}

// PuzzleStopReason is why a limit stopped a puzzle.
enum PuzzleStopReason {
  PUZZLE_STOP_REASON_UNSPECIFIED = 0;
  // The limit of moves was reached.
  PUZZLE_STOP_REASON_MOVES = 1;
  // The time limit ran out.
  PUZZLE_STOP_REASON_TIME = 2;
}

// PuzzleSummary is a shown puzzle in the list a player reads.
message PuzzleSummary {
  // The puzzle (a UUID).
  string puzzle_id = 1;
  // The name.
  string name = 2;
  // The kind.
  PuzzleKind kind = 3;
  // True once solved.
  bool solved = 4;
  // True while a limit of moves or of time stopped the puzzle (it is not solved and
  // nothing moves): it does not look open in the list.
  bool stopped = 5;
}

// MasterPuzzleRun is a puzzle in the open session as the master reads it: what the
// players read, and what only the master may know.
message MasterPuzzleRun {
  // The puzzle, with its answer and every hint.
  Puzzle puzzle = 1;
  // Where it stands in this session.
  PuzzleRunStatus status = 2;
  // What the players read. Unset while the status is NOT_SHOWN.
  PuzzleRun run = 3;
  // Where this run started (a new start changes it).
  PuzzleState start = 4;
  // The fewest moves from where the pieces are now. Unset only while the puzzle has no
  // run in this session; a run prepared by ReseedPuzzle (NOT_SHOWN) has it.
  PuzzleMinimum minimum = 5;
  // The fewest moves from the run's start.
  PuzzleMinimum minimum_from_start = 6;
  // How many hints are released, of puzzle.hints.
  int32 released_hints = 7;
  // How many moves were made in this run (a reset does not erase them: the history stays).
  int32 moves_made = 8;
  // What the server did when it was solved. UNSPECIFIED until then.
  PuzzleSolveOutcome outcome = 9;
  // The last move as the master reads it, with the typed answer or the bell. Unset
  // before the first move.
  PuzzleLastMove last_move = 10;
  // Why a limit stopped the puzzle: MOVES or TIME. UNSPECIFIED when it is not stopped.
  // The players read only `stopped`.
  PuzzleStopReason stop_reason = 11;
  // The tries for a hint by a skill check in this run, oldest first (at most 50, the
  // newest).
  repeated PuzzleHintTry hint_tries = 12;
  // Each living player character's wrong moves in the round, in the party's order, for
  // a puzzle with "Ao errar"; empty otherwise.
  repeated PuzzleAttempts attempts = 13;
}

// PuzzleBlocked is the detail of a `failed_precondition` of PuzzleService.
message PuzzleBlocked {
  PuzzleBlockedReason reason = 1;
}

// PuzzleBlockedReason is why a puzzle call was refused with `failed_precondition`.
enum PuzzleBlockedReason {
  PUZZLE_BLOCKED_REASON_UNSPECIFIED = 0;
  // The campaign has no open session.
  PUZZLE_BLOCKED_REASON_NO_OPEN_SESSION = 1;
  // The puzzle was solved: the state is frozen. Only the master's reset, a new start or
  // close change it.
  PUZZLE_BLOCKED_REASON_SOLVED = 2;
  // The puzzle was shown in a session already, so it cannot be edited.
  PUZZLE_BLOCKED_REASON_ALREADY_SHOWN = 3;
  // The puzzle is archived: it cannot be shown.
  PUZZLE_BLOCKED_REASON_ARCHIVED = 4;
  // The puzzle is not shown in the open session (the master's calls that need a run).
  PUZZLE_BLOCKED_REASON_NOT_SHOWN = 5;
  // The caller has no living character in the campaign to move as.
  PUZZLE_BLOCKED_REASON_NO_CHARACTER = 6;
  // Every hint is released already.
  PUZZLE_BLOCKED_REASON_NO_MORE_HINTS = 7;
  // The kind has no generated start (a lock's start is the master's choice).
  PUZZLE_BLOCKED_REASON_NO_GENERATED_START = 8;
  // The player has no wrong moves left in this round ("Você não tem mais tentativas").
  // The master's restart gives them back.
  PUZZLE_BLOCKED_REASON_NO_ATTEMPTS_LEFT = 9;
  // A limit of moves or of time stopped the puzzle: nothing moves until the master
  // restarts or closes it.
  PUZZLE_BLOCKED_REASON_STOPPED = 10;
  // The sequence was not played yet: the master plays it first (PlayPuzzleSequence).
  PUZZLE_BLOCKED_REASON_SEQUENCE_NOT_PLAYED = 11;
  // The sequence is being played: wait for it to end.
  PUZZLE_BLOCKED_REASON_SEQUENCE_PLAYING = 12;
  // PlayPuzzleSequence on a puzzle that is not a sequence.
  PUZZLE_BLOCKED_REASON_NOT_A_SEQUENCE = 13;
  // TryPuzzleHint on a puzzle with no skill check for hints.
  PUZZLE_BLOCKED_REASON_NO_HINT_CHECK = 14;
  // The player tried for the next hint already: another player may try, or the master
  // releases it.
  PUZZLE_BLOCKED_REASON_HINT_ALREADY_TRIED = 15;
  // The campaign has the players roll their dice the other way (RN-18): in the app, or
  // typed from real dice.
  PUZZLE_BLOCKED_REASON_WRONG_DICE_MODE = 16;
  // The caller's character has no numbers for the hint's skill.
  PUZZLE_BLOCKED_REASON_NO_SKILL = 17;
  // The master's change names a revision of the run that is not the run's any more
  // (expected_revision): it was made already, or a player moved since the master read it.
  PUZZLE_BLOCKED_REASON_STALE_REVISION = 18;
}

// PuzzleInvalid is the detail of an `invalid_argument` of PuzzleService.
message PuzzleInvalid {
  PuzzleInvalidReason reason = 1;
  // The request field that is wrong, such as "config.lights.size". Never the value.
  string field = 2;
}

// PuzzleInvalidReason is why a puzzle request was refused as invalid.
enum PuzzleInvalidReason {
  PUZZLE_INVALID_REASON_UNSPECIFIED = 0;
  // The name is empty or longer than 80 characters.
  PUZZLE_INVALID_REASON_NAME = 1;
  // The clue or a hint is too long or empty, or there are more than 10 hints.
  PUZZLE_INVALID_REASON_TEXT = 2;
  // The kind is missing, or the config, solution, start or move is not of the same kind.
  PUZZLE_INVALID_REASON_KIND = 3;
  // The board, the wheels or the pillars are out of their range.
  PUZZLE_INVALID_REASON_SIZE = 4;
  // A symbol or position is out of range, or a list has the wrong length.
  PUZZLE_INVALID_REASON_SYMBOLS = 5;
  // A pillar's links are not valid.
  PUZZLE_INVALID_REASON_LINKS = 6;
  // The lock's start is already its solution.
  PUZZLE_INVALID_REASON_START_SOLVED = 7;
  // The pillars' mural cannot be reached from where they start.
  PUZZLE_INVALID_REASON_UNSOLVABLE = 8;
  // "Ao resolver" has no target when it needs one, or one it does not use, or the
  // target is not of this campaign.
  PUZZLE_INVALID_REASON_TARGET = 9;
  // The move is not valid for this puzzle (a cell or a wheel that is not there, a turn
  // that is not +1 or -1).
  PUZZLE_INVALID_REASON_MOVE = 10;
  // The riddle's answers are not valid: none, more than 10, empty, too long, or the same
  // twice.
  PUZZLE_INVALID_REASON_ANSWERS = 11;
  // The cipher's message or key is not valid, or the key clue is not a clue of the
  // campaign.
  PUZZLE_INVALID_REASON_CIPHER = 12;
  // The hint check's skill is not one of the 18, or its DC is out of 1 to 30.
  PUZZLE_INVALID_REASON_HINT_CHECK = 13;
  // The split information's parts are not valid: too many, empty or long text, or a
  // character that is not a living player character of the campaign.
  PUZZLE_INVALID_REASON_PARTS = 14;
  // "Ao errar" is not valid: a limit out of range, a trap that is not a trap point of
  // the campaign, or a trap or attempts on a kind that judges no moves.
  PUZZLE_INVALID_REASON_ON_WRONG = 15;
}

// PuzzleService makes puzzles in the campaign (the master's), shows them in the open
// game session, and lets the players solve them live (MR-038, RN-27).
//
// Who may call what:
//   - The master: every method but GetPuzzleRun, ListShownPuzzles and MakePuzzleMove,
//     which are the players'. GetPuzzleRun and ListShownPuzzles also answer the master,
//     with exactly what a player reads. MakePuzzleMove is for players only.
//   - Errors every method can return: `unauthenticated`; `not_found` for a campaign
//     the caller is not an active member of (a pending member neither) and for a puzzle
//     that is not the campaign's; `unavailable`; `aborted` (the database kept
//     reporting a conflict; the app may try again). A failed_precondition carries a
//     PuzzleBlocked detail, an invalid_argument a PuzzleInvalid one.
//
// Responses carry `Cache-Control: no-store`. Every read that takes IDs is IDEMPOTENT
// and POST-only, so IDs stay out of URLs. The live changes of a puzzle travel on
// PlayService.WatchGameSession as the content-free `puzzle_changed` hint.
service PuzzleService {
  // CreatePuzzle makes a puzzle in the campaign. Master only.
  //
  // The server checks the config and the answer, generates the start of the lights
  // and of the pillars from the seed (a start that is already solved is never given:
  // it is drawn again from the same seed), and works out the fewest moves. A lock's
  // start is the one in the request. The "Ao resolver" target must be a door, point
  // or clue of this campaign.
  //
  // Errors: `permission_denied` for a player; `invalid_argument` (PuzzleInvalid).
  //
  // Safe to retry when the request carries an idempotency_key: a second call with the same key and
  // the same request returns what the first one made and makes nothing; the same key with another
  // request is `invalid_argument`. Without a key the call is not deduplicated.
  rpc CreatePuzzle(CreatePuzzleRequest) returns (CreatePuzzleResponse);

  // UpdatePuzzle replaces everything the master wrote about a puzzle (the same fields
  // as CreatePuzzle), as long as the puzzle was never shown in a session. Master only.
  //
  // Errors: `permission_denied`; `invalid_argument`; `failed_precondition`
  // (ALREADY_SHOWN).
  rpc UpdatePuzzle(UpdatePuzzleRequest) returns (UpdatePuzzleResponse);

  // PreviewPuzzleStart draws a start for the form, with the fewest moves from it,
  // and stores nothing: "Gerar outro começo" in the create form. The same seed and
  // config always give the same start, so sending the seed back to CreatePuzzle
  // creates exactly that start. Master only. Lights and pillars only.
  //
  // Errors: `permission_denied`; `invalid_argument`; `failed_precondition`
  // (NO_GENERATED_START for a lock).
  rpc PreviewPuzzleStart(PreviewPuzzleStartRequest) returns (PreviewPuzzleStartResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListPuzzles lists the campaign's puzzles, newest first, with their answers. Master
  // only. Archived ones only when asked.
  rpc ListPuzzles(ListPuzzlesRequest) returns (ListPuzzlesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // GetPuzzle reads one puzzle, archived or not. Master only.
  rpc GetPuzzle(GetPuzzleRequest) returns (GetPuzzleResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ArchivePuzzle takes a puzzle out of the lists and from the session's menu; what
  // happened in past sessions stays. Archiving an archived puzzle changes nothing.
  // Master only.
  rpc ArchivePuzzle(ArchivePuzzleRequest) returns (ArchivePuzzleResponse);

  // UnarchivePuzzle brings an archived puzzle back. Master only.
  rpc UnarchivePuzzle(UnarchivePuzzleRequest) returns (UnarchivePuzzleResponse);

  // ListSessionPuzzles lists the campaign's puzzles that are not archived, each with
  // where it stands in the open session: the master's menu. Master only.
  //
  // Errors: `failed_precondition` (NO_OPEN_SESSION).
  rpc ListSessionPuzzles(ListSessionPuzzlesRequest) returns (ListSessionPuzzlesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ShowPuzzle shows the puzzle to every player of the open session ("Mostrar aos
  // jogadores"): the run is made at the puzzle's start. Showing a shown one changes
  // nothing; showing a closed one opens it again at its start; showing a solved one
  // changes nothing. Master only.
  //
  // Writes the session event `puzzle_shown` and sends `puzzle_changed` to everyone.
  //
  // Errors: `failed_precondition` (NO_OPEN_SESSION, ARCHIVED).
  rpc ShowPuzzle(ShowPuzzleRequest) returns (ShowPuzzleResponse);

  // ResetPuzzle ("Recomeçar") puts the run back at the same start it had, for every
  // player, solved or not: the state, the last move and the solved mark go; the hints
  // released and the history of moves stay. Master only.
  //
  // Writes `puzzle_reset`.
  //
  // Errors: `failed_precondition` (NO_OPEN_SESSION, STALE_REVISION, NOT_SHOWN).
  rpc ResetPuzzle(ResetPuzzleRequest) returns (ResetPuzzleResponse);

  // ReseedPuzzle ("Gerar outro começo") draws a new seed and a new start for the run,
  // never already solved, and puts the run at it, as ResetPuzzle does. Lights and
  // pillars only. The puzzle's own start is not changed: Recomeçar of a later session
  // starts from it. Master only. Allowed before and after the puzzle is shown (before,
  // the run is prepared at the new start and the players see nothing until ShowPuzzle).
  //
  // Writes `puzzle_reset`.
  //
  // Errors: `failed_precondition` (NO_OPEN_SESSION, STALE_REVISION, NO_GENERATED_START).
  rpc ReseedPuzzle(ReseedPuzzleRequest) returns (ReseedPuzzleResponse);

  // ClosePuzzle ("Fechar") hides the puzzle from the players. Closing a closed one
  // changes nothing. Master only.
  //
  // Writes `puzzle_closed`.
  //
  // Errors: `failed_precondition` (NO_OPEN_SESSION, NOT_SHOWN).
  rpc ClosePuzzle(ClosePuzzleRequest) returns (ClosePuzzleResponse);

  // ReleaseNextPuzzleHint ("Mostrar a próxima dica") releases the next hint to the
  // players. Master only.
  //
  // Errors: `failed_precondition` (NO_OPEN_SESSION, STALE_REVISION, NOT_SHOWN, NO_MORE_HINTS).
  rpc ReleaseNextPuzzleHint(ReleaseNextPuzzleHintRequest) returns (ReleaseNextPuzzleHintResponse);

  // PreviewPuzzleCipher ciphers a message for the form, as the players will read it
  // ("Como os jogadores a veem"), and stores nothing. Master only.
  //
  // Errors: `permission_denied`; `invalid_argument` (PuzzleInvalid CIPHER).
  rpc PreviewPuzzleCipher(PreviewPuzzleCipherRequest) returns (PreviewPuzzleCipherResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // PlayPuzzleSequence ("Tocar a sequência") plays the sequence for the players. Master
  // only. The server reveals it step by step, one every SequencePlayback.step_ms, never
  // a step before its time: each app reads the run again at every puzzle_changed and
  // when `next_in_ms` runs out. A play that runs when the master plays again starts over.
  // Counts one more play (SequencePlayback.plays) and does not touch the attempt's
  // progress or the counters of "Ao errar".
  //
  // Sends `puzzle_changed` now and at each step. Writes no session event.
  //
  // Errors: `failed_precondition` (NO_OPEN_SESSION, STALE_REVISION, NOT_SHOWN, NOT_A_SEQUENCE,
  // SOLVED, STOPPED).
  rpc PlayPuzzleSequence(PlayPuzzleSequenceRequest) returns (PlayPuzzleSequenceResponse);

  // GetMasterPuzzleRun is the master's live view of a puzzle of the open session: what
  // the players read, and the answer, the fewest moves left and the hints. Master only.
  //
  // Errors: `failed_precondition` (NO_OPEN_SESSION).
  rpc GetMasterPuzzleRun(GetMasterPuzzleRunRequest) returns (GetMasterPuzzleRunResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListShownPuzzles lists the puzzles the open session shows: shown, not closed,
  // solved or not. Any member may call it, and gets what a player gets.
  //
  // Errors: `failed_precondition` (NO_OPEN_SESSION).
  rpc ListShownPuzzles(ListShownPuzzlesRequest) returns (ListShownPuzzlesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // GetPuzzleRun reads a shown puzzle as a player reads it (RN-10, RN-27). Any member
  // may call it. A puzzle that does not exist, is not shown or was closed answers
  // `not_found`.
  //
  // Errors: `not_found`; `failed_precondition` (NO_OPEN_SESSION).
  rpc GetPuzzleRun(GetPuzzleRunRequest) returns (GetPuzzleRunResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // TryPuzzleHint ("Tentar uma dica · Investigação") rolls the puzzle's skill check for
  // the next hint, as the caller's living character. Players only (RN-18: the app
  // rolls the d20, or the player types the face of a real one; the campaign may force
  // one way). A pass gives that player, and only them, the next hint they do not read
  // yet (the first one the master did not release, or after the ones they won). A
  // fail gives nothing, and the same player cannot try again for the same hint until the
  // master releases it. (Another player passing does not free it: a pass gives that
  // player their own hint.) The DC is never sent. The answer is the run
  // as the player reads it now, and the roll.
  //
  // Each try is kept (puzzle_hint_tries) and counts one revision of the run; it writes
  // no session event and sends `puzzle_changed`. A try with an idempotency_key already
  // used is not rolled again.
  //
  // Errors: `permission_denied` for the master; `not_found` (unknown or unshown puzzle);
  // `invalid_argument`; `failed_precondition` (NO_OPEN_SESSION, SOLVED, STOPPED,
  // NO_CHARACTER, NO_HINT_CHECK, NO_MORE_HINTS, HINT_ALREADY_TRIED, WRONG_DICE_MODE,
  // NO_SKILL).
  rpc TryPuzzleHint(TryPuzzleHintRequest) returns (TryPuzzleHintResponse);

  // MakePuzzleMove makes one move as the caller's living character. Players only.
  //
  // The server applies the move to the latest state, so two players moving at once
  // both count. When the move solves the puzzle, in the same transaction the run is
  // frozen, `puzzle_solved` is written and the master's "Ao resolver" action runs. A
  // move with an idempotency_key already used is not applied again: the answer is
  // the run as it is now (it may carry other players' moves made since, not the
  // first answer), with replayed = true.
  //
  // Writes the move in the puzzle's own history (not in the session's events, which
  // keep only the shown, solved, reset and closed of a puzzle) and sends
  // `puzzle_changed` to everyone.
  //
  // A riddle's or a cipher's answer and a sequence's bell are judged, not applied: a
  // wrong one changes nothing in the state (a wrong bell sends the attempt back to the
  // first step), is marked `wrong` in the history, and does what "Ao errar" says, all
  // in the transaction of the move: it spends the player's attempt, counts toward the
  // limits, and fires the trap point (once; the move's key makes a retry fire nothing).
  // The move that reaches a limit of moves stops the puzzle (unless it solves it). A time
  // limit stops it with no move at all: it is worked out from the clock, so the first
  // move after the time ran out is refused with STOPPED, and every read says `stopped`
  // from the moment it ran out.
  //
  // Errors: `not_found` (unknown or unshown puzzle); `permission_denied` for the master;
  // `invalid_argument` (PuzzleInvalid MOVE or KIND; a key that is not a UUID or was used
  // for another change carries no PuzzleInvalid detail); `failed_precondition` (NO_OPEN_SESSION,
  // SOLVED, STOPPED, NO_CHARACTER, NO_ATTEMPTS_LEFT, SEQUENCE_NOT_PLAYED, SEQUENCE_PLAYING).
  rpc MakePuzzleMove(MakePuzzleMoveRequest) returns (MakePuzzleMoveResponse);
}

// CreatePuzzleRequest is the master's puzzle.
message CreatePuzzleRequest {
  string campaign_id = 1;
  // The name, 1 to 80 characters.
  string name = 2;
  // What it is made of. Required; its kind is the puzzle's.
  PuzzleConfig config = 3;
  // The answer: required for a lock and for the pillars, none for the lights.
  PuzzleSolution solution = 4;
  // Where the lock starts (required for a lock, one position per wheel, not the
  // solution). Ignored for the others, whose start is generated.
  PuzzleState start = 5;
  // The seed of the generated start, for the lights and the pillars; 0 asks the server
  // to draw one. A seed from PreviewPuzzleStart gives that start again.
  int64 seed = 6;
  // The clue for the players, up to 500 characters.
  string clue = 7;
  // The hints, in release order: up to 10, 1 to 300 characters each.
  repeated string hints = 8;
  // "Ao resolver". Unset is NOTIFY.
  PuzzleOnSolve on_solve = 9;
  // The skill check that wins the next hint (needs hints). Unset: none.
  PuzzleHintCheck hint_check = 10;
  // The split information: up to 8 parts, each for a player's character.
  repeated PuzzlePart parts = 11;
  // "Ao errar". Unset: nothing.
  PuzzleOnWrong on_wrong = 12;
  // Optional. 1 to 64 characters, chosen once by the app for this action: a retry with the
  // same key and the same request returns what the first call made instead of making another.
  // The key is unique in the campaign; the same key with another request is `invalid_argument`.
  // Empty: the call is not deduplicated.
  string idempotency_key = 13;
}

// CreatePuzzleResponse carries the new puzzle.
message CreatePuzzleResponse {
  Puzzle puzzle = 1;
}

// UpdatePuzzleRequest replaces what CreatePuzzleRequest set. The kind cannot change.
message UpdatePuzzleRequest {
  string campaign_id = 1;
  string puzzle_id = 2;
  // As in CreatePuzzleRequest.
  string name = 3;
  PuzzleConfig config = 4;
  PuzzleSolution solution = 5;
  PuzzleState start = 6;
  // For the lights and the pillars: the seed of the start; 0 keeps the puzzle's
  // current start when the config and the answer still fit it, and draws a new one
  // otherwise.
  int64 seed = 7;
  string clue = 8;
  repeated string hints = 9;
  PuzzleOnSolve on_solve = 10;
  PuzzleHintCheck hint_check = 11;
  repeated PuzzlePart parts = 12;
  PuzzleOnWrong on_wrong = 13;
}

// UpdatePuzzleResponse carries the edited puzzle.
message UpdatePuzzleResponse {
  Puzzle puzzle = 1;
}

// PreviewPuzzleStartRequest asks for a start to look at.
message PreviewPuzzleStartRequest {
  string campaign_id = 1;
  // The config (lights or pillars) and, for the pillars, the mural in `solution`.
  PuzzleConfig config = 2;
  PuzzleSolution solution = 3;
  // 0 draws a new seed.
  int64 seed = 4;
}

// PreviewPuzzleStartResponse is a start that CreatePuzzle can reproduce.
message PreviewPuzzleStartResponse {
  // The seed that gives this start.
  int64 seed = 1;
  // The start.
  PuzzleState start = 2;
  // The fewest moves from it.
  PuzzleMinimum minimum = 3;
}

// ListPuzzlesRequest asks for the campaign's puzzles.
message ListPuzzlesRequest {
  string campaign_id = 1;
  // True to list the archived ones too.
  bool include_archived = 2;
}

// ListPuzzlesResponse lists them.
message ListPuzzlesResponse {
  repeated Puzzle puzzles = 1;
}

// GetPuzzleRequest names a puzzle.
message GetPuzzleRequest {
  string campaign_id = 1;
  string puzzle_id = 2;
}

// GetPuzzleResponse carries it.
message GetPuzzleResponse {
  Puzzle puzzle = 1;
}

// ArchivePuzzleRequest names a puzzle.
message ArchivePuzzleRequest {
  string campaign_id = 1;
  string puzzle_id = 2;
}

// ArchivePuzzleResponse carries the puzzle, archived.
message ArchivePuzzleResponse {
  Puzzle puzzle = 1;
}

// UnarchivePuzzleRequest names a puzzle.
message UnarchivePuzzleRequest {
  string campaign_id = 1;
  string puzzle_id = 2;
}

// UnarchivePuzzleResponse carries the puzzle, back.
message UnarchivePuzzleResponse {
  Puzzle puzzle = 1;
}

// ListSessionPuzzlesRequest asks for the master's menu.
message ListSessionPuzzlesRequest {
  string campaign_id = 1;
}

// ListSessionPuzzlesResponse is the master's menu of the open session.
message ListSessionPuzzlesResponse {
  // The puzzles that are not archived, newest first, each with its status in the open
  // session (run, minimum and the rest are filled as in GetMasterPuzzleRun).
  repeated MasterPuzzleRun puzzles = 1;
}

// ShowPuzzleRequest names a puzzle.
message ShowPuzzleRequest {
  string campaign_id = 1;
  string puzzle_id = 2;
}

// ShowPuzzleResponse carries the puzzle as the master now sees it.
message ShowPuzzleResponse {
  MasterPuzzleRun run = 1;
}

// ResetPuzzleRequest names a puzzle.
message ResetPuzzleRequest {
  string campaign_id = 1;
  string puzzle_id = 2;
  // The revision of the run that the master's screen shows (PuzzleRun.revision). When it is
  // set and the run has moved on (a player moved, tried for a hint, or this very change was
  // made already by a call whose answer was lost), the call changes nothing and fails with
  // STALE_REVISION: the master reads the run and chooses again. 0 makes no check.
  int32 expected_revision = 3;
}

// ResetPuzzleResponse carries the puzzle as the master now sees it.
message ResetPuzzleResponse {
  MasterPuzzleRun run = 1;
}

// ReseedPuzzleRequest names a puzzle.
message ReseedPuzzleRequest {
