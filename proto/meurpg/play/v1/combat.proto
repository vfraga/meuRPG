syntax = "proto3";

// This file is the combat's API (MR-012, MR-013, MR-014): the
// encounter, who fights, the initiative, the order of turns, the movement on
// the map's grid, what a turn can do, the attacks and their damage, the
// spells (slots, saving throws, healing, concentration), the reactions
// (Escudo, the opportunity attack), the death saves, the conditions, the
// class features, the standard actions, the NPCs' hit points, the undo and the
// combat log. It is in the same package as play.proto because the live events
// of a combat travel on the same stream (WatchGameSession).
package meurpg.play.v1;

import "google/protobuf/timestamp.proto";
import "meurpg/play/v1/combat_rolls.proto";
import "meurpg/play/v1/contest_types.proto";
import "meurpg/play/v1/lasting_effects.proto";
import "meurpg/rules/v1/rules.proto";

// CombatService runs a combat (an "encounter") inside the campaign's open
// game session: the master picks who fights and starts it, everybody rolls
// initiative, and the turns go round the table until the master ends it.
//
// A combat has three states: SETUP (the participants and their initiatives
// are being decided), ACTIVE (turns run) and ENDED. A session has at most one
// that is not ended. Ending the session ends its combat too.
//
// Who sees what (RN-10, RN-20) is decided on the server, and a player never
// receives what the master keeps from them, not even its ID:
//   - A hidden combatant (a new NPC starts hidden) is not in the player's
//     order, not on their map, and its turn shows as "Vez do mestre":
//     `current_combatant_id` is empty and `master_turn` is true.
//   - A player never gets an NPC's hit points as numbers, its armor class,
//     or the initiative the app rolled for it: only a state word
//     (CombatantState). The order itself tells who goes first.
//   - A player sees the other players' combatants, but not their hit
//     points (the vitals of their own character come from
//     PlayService.GetLiveSession).
//   - A character's creatures (MR-037, kind CREATURE) fight on the party's
//     side and are played by their owner's player. Their hit points are
//     numbers only to that player and the master; every other player gets
//     the state word, as for an NPC. A creature's owner, kind and initiative
//     are public (the party knows whose it is).
//   - A player never gets the armor class of anyone, the d20 and the
//     damage dice of the master's NPCs, nor the combat log entries that
//     involve a hidden combatant (CombatLogEntry).
//   - A player sees a joint turn (see "Joint turns" below) only when its
//     group holds a player's character. A group of NPCs alone stays the
//     master's: the player gets no box and no total for it, and is only told
//     who acts ("Vez dos Goblins"), never one of them picked.
//   - The master sees everything.
//
// Joint turns (MR-013, RN-19, RN-20). RN-20 note: a player member's economy
// (action, bonus action, reaction, movement) reaches the master, that player and
// the other players in the same group, never a player outside it. Combatants that are adjacent in the turn
// order with the same initiative total form a group, players and NPCs alike
// (a combatant alone on its total is a group of one, and works as it always
// did). A group takes ONE turn together: when the turn reaches it, the start of
// the turn happens for every member at once (movement, action, bonus action,
// dash, reaction, the Escudo bonus and the death save due all reset, each
// member with its own economy). Defeated members are left out. Each member's
// player ends their own part with EndTurn, and the master may end anyone's.
// The turn passes to the next group when the last member who acts has ended;
// there is no "end the group's turn", and a part that ended is never reopened.
// The group is worked out from the order and the totals when its turn starts
// and stays as it was until that turn passes, so these cases never change a
// turn already running:
//   - SetInitiativeOrder reorders a tie: the combatants stay one group (a
//     group depends on the total alone, not on the order inside it).
//   - AddCombatants adds an NPC with the same total as the group on turn: it
//     is in the group's box from the group's next turn, not now (it is not in
//     `turn_group_ids` and does not act in the turn that is running).
//   - RemoveCombatant, a confirmed death or a defeated member: it leaves the
//     turn; if nobody who acts is left, the turn passes at once.
//   - SetCombatantHidden hides a member: the turn goes on as it was, and the
//     players are never sent the hidden one (they see the master's part as
//     "Falta o mestre", without a name).
//
// Every method needs a valid session cookie and fails with `unauthenticated`
// without one. For a campaign the caller is not a member of (a pending member
// neither, RN-15), methods answer `not_found`, exactly as for a campaign that
// does not exist. A player calling a method only the master may call gets
// `permission_denied`; a player acting on a combatant that is not theirs gets
// `permission_denied` too, except for a combatant they may not see, which is
// `not_found`. An ID that is not a UUID is answered like an ID that does not
// exist.
//
// Every write takes an idempotency_key, a UUID the app generates once for the
// action and sends again on a retry: a second call with the same key changes
// nothing and answers with the combat as it is now. Every write is also a
// session_events row, written in the same transaction (ADR-0007).
//
// Errors every method can return, besides those listed on each method:
//   - `unauthenticated`: no valid session cookie.
//   - `failed_precondition`: the campaign has no open session
//     (GameSessionBlocked, NO_OPEN_SESSION) or the combat is not in the state
//     the call needs (EncounterBlocked, with the reason).
//   - `invalid_argument`: a field breaks its documented rules. The message
//     names the field, never its value.
//   - `unavailable`: the database did not answer; the app may try again.
//   - `aborted`: the database kept reporting a conflicting transaction after
//     the server's retries; the app may try again.
//
// Responses carry `Cache-Control: no-store`. Every request carries a campaign
// ID, so reads are IDEMPOTENT and POST-only: a GET would put the ID in the URL,
// and URLs end up in the platform's request logs (docs/privacy.md).
service CombatService {
  // StartEncounter creates the campaign's combat, in the SETUP state. Only
  // the campaign's master may call it, and only while the campaign has an
  // open session.
  //
  // The mode (`mode`, RN-25, ADR-0017) is chosen here and never changes. GRID
  // is the fight on a map: it is on the session's current map, which must have a
  // grid (MapService.SetMapGrid). When map_point_id names a BATTLE point that
  // leads to a map, that map becomes the session's current map (and is
  // revealed to the players, as PlayService.SetCurrentMap does) and must
  // have the grid instead. THEATRE is the fight without a map, the "teatro da
  // mente": it needs no map, no combatant ever has a square, the server never
  // checks a player's reach, range or distance (the master judges), and there is
  // no fog, no trap, no door and no placement of summoned creatures. Movement is
  // spent by number (SpendMovement) and the opportunity attack is offered by the
  // master (OfferOpportunity). Left UNSPECIFIED, the mode is the table's rule
  // "combate com mapa" (RN-24): GRID when the table starts its combats with a
  // map (the default), THEATRE otherwise.
  //
  // Who fights: the player characters listed in participants, and copies of
  // the NPCs listed, each NPC with a count: "Goblin" x 3 makes "Goblin 1",
  // "Goblin 2" and "Goblin 3" (a count of 1 keeps the plain name). Without
  // any player character in participants, the whole party joins: every
  // living player character of the campaign's active members. A new NPC
  // starts hidden unless the request says otherwise (question 31).
  //
  // Each combatant starts on the square of its character's token on the
  // map, if it has one (snapped to a square), and unplaced otherwise: the
  // master places it (MoveCombatant). Every NPC's initiative is rolled at
  // once by the app, one roll for each copy (RN-19). The players roll
  // theirs (SubmitInitiative).
  //
  // With `monsters` ("Começar este combate", MR-043), the monsters of those SRD
  // creatures join in the same transaction, through the same code as AddMonsters,
  // under this request's idempotency key (a retry rolls and adds nothing). The
  // master's line of their hit points is written as AddMonsters writes it. `participants`
  // may then be empty. The app reads the encounter a battle point keeps
  // (EncounterService.GetBattleEncounter), lets the master change it, and sends it
  // here; a combat without a map (THEATRE) takes the monsters too, with no point.
  //
  // Every WatchGameSession stream of the campaign gets `encounter_changed`.
  //
  // Errors:
  //   - `not_found`: the campaign or the BATTLE point does not exist, or the
  //     caller is not a member; a participant is not a living character of
  //     the campaign.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION); the session already has a combat that is not
  //     ended (EncounterBlocked, ENCOUNTER_ALREADY_OPEN); in GRID mode, there is
  //     no current map (NO_CURRENT_MAP) or the map has no grid (MAP_HAS_NO_GRID,
  //     with its map_id, so the app offers to set one); in THEATRE mode, a
  //     map_point_id (THEATRE_HAS_NO_MAP); the combatants and monsters, with
  //     the party's own creatures, would pass 40 (TOO_MANY_COMBATANTS).
  //   - `invalid_argument`: no participants, a
  //     participant listed twice, a count outside 1 to 10 (a player
  //     character: 1), a name that breaks its rules, or a `mode` that is not one;
  //     a monster group that is not an SRD creature, listed twice or with a count
  //     outside 1 to 40, a `monster_hit_points` that is not a mode, more than 20 groups.
  rpc StartEncounter(StartEncounterRequest) returns (StartEncounterResponse);

  // GetStartRoster says who would enter a combat started now and where each would
  // stand, so the master chooses the party before the start (plan B, B2): the map is the
  // one StartEncounter would fight on (the destination map of the battle point `map_point_id`
  // names, else the session's current map), and each of the party's living player characters is
  // listed with whether it has a token on that map and the square that token gives it. It
  // changes nothing: StartEncounter still puts each combatant on its token's square when nobody
  // stands there. Only the campaign's master may call it.
  //
  // Errors:
  //   - `not_found`: the campaign or the BATTLE point does not exist, or the caller is not a
  //     member.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: no open session (GameSessionBlocked, NO_OPEN_SESSION).
  rpc GetStartRoster(GetStartRosterRequest) returns (GetStartRosterResponse);

  // GetEncounter returns the combat of the campaign's open session as the
  // caller may see it: the latest one, so the app can also show the end of
  // a combat that just ended. It answers with no encounter when the session
  // has none yet. Any member may call it. The app reads it after every
  // `encounter_changed` and after every reconnection.
  //
  // On a map with the fog of war on (MR-036), a player gets only the NPC
  // combatants their character sees now (with "Visão do grupo", the party): an
  // NPC they do not see is, for them, like a hidden one (not in the order, no
  // name, no state, no square; its turn reads "Vez do mestre"), and naming it in
  // any call is `not_found`. Players' characters and their creatures are never
  // hidden. The master sees everyone.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a
  //     member of it.
  rpc GetEncounter(GetEncounterRequest) returns (GetEncounterResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // SubmitInitiative sets a combatant's initiative: a d20 plus the
  // combatant's initiative bonus (RN-19). The combatant's player may roll
  // for their own character, and the master for anyone. Only while the combat
  // is in SETUP. A character that holds a Bardic Inspiration die, or a halfling whose d20 shows a 1, is asked first
  // (`held_roll_offer`).
  //
  // The roll is either rolled by the app (roll_in_app), or a face typed from
  // a physical die (d20_face, 1 to 20). With the campaign's dice setting
  // "each player chooses" (RN-18) the player picks on every roll, and their
  // saved preference is only the default the screen offers; a mode the master
  // forced binds them: with "everybody rolls in the app" a typed face is
  // refused, and with "everybody rolls their own dice" the app's roll is
  // (WRONG_DICE_MODE). The master may do either for anyone, and may set a
  // value again; a player sets theirs once, so nobody rolls again until the
  // result is good.
  //
  // Every stream gets `encounter_changed`.
  //
  // Errors:
  //   - `not_found`: the combatant is not in this combat, or the caller is a
  //     player and may not see it.
  //   - `permission_denied`: the caller is a player and the combatant is not
  //     their character.
  //   - `failed_precondition`: the combat is not in SETUP (EncounterBlocked,
  //     NOT_IN_SETUP); the player's initiative is already set
  //     (INITIATIVE_ALREADY_SET); the master forced the other way of rolling
  //     (WRONG_DICE_MODE).
  //   - `invalid_argument`: neither roll_in_app nor d20_face is set, or the
  //     face is not 1 to 20.
  rpc SubmitInitiative(SubmitInitiativeRequest) returns (SubmitInitiativeResponse);

  // SetInitiativeOrder decides the order of combatants tied on the same
  // initiative total and the same bonus (RN-19): combatant_ids lists them in
  // the order they will play, and they keep the places they hold together.
  // Combatants with a higher bonus already go first without it. Only the
  // master may call it, and only while the combat is in SETUP or ACTIVE.
  //
  // Since joint turns, the order inside a tie only decides how the group is
  // listed (and which member is `current_combatant_id` while it acts): the
  // tied combatants act in the same turn, and they stay one group after the
  // master orders them.
  //
  // Errors:
  //   - `not_found`: a combatant is not in this combat.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: fewer than two combatants, a repeated one, or
  //     they are not all tied (different total or bonus, or no initiative).
  //   - `failed_precondition`: the combat is ended (EncounterBlocked,
  //     ENCOUNTER_ENDED).
  rpc SetInitiativeOrder(SetInitiativeOrderRequest) returns (SetInitiativeOrderResponse);

  // BeginCombat starts the turns: the combat becomes ACTIVE, in round 1,
  // with the first group of the order on turn (every member of it acts). Only the master may call
  // it, and only while the combat is in SETUP. Every combatant must have an
  // initiative: otherwise the call fails with `failed_precondition`
  // (EncounterBlocked, INITIATIVE_MISSING) and names who is missing. Ties
  // need not be ordered: the order stays as it is.
  //
  // Every stream gets `encounter_changed` and `turn_changed`.
  //
  // Errors:
  //   - `not_found`: the combat is not this campaign's.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: not in SETUP (NOT_IN_SETUP); an initiative is
  //     missing (INITIATIVE_MISSING, with combatant_ids).
  rpc BeginCombat(BeginCombatRequest) returns (BeginCombatResponse);

  // EndTurn ends one member's part of the turn that is running: the whole
  // turn when the member is alone in its group, and, in a joint turn, only the
  // member's own part (the member is marked turn_part_ended and writes a
  // `turn_part_ended` event). The turn passes to the next group, the next one
  // that is not defeated, when the last member who acts ends; after the last
  // group, the round goes up by one. At the start of the new group's turn,
  // every member's movement, action, bonus action, dash and reaction are reset.
  // A member's player may end that member's part, and the master anyone's (also
  // the part of a player who is away). A player cannot end another member's
  // part. A part that ended cannot be ended again, nor reopened.
  //
  // expected_combatant_id is the member whose part the caller thinks it ends
  // (a member that still acts). If that member's part already ended, or the
  // turn passed to another group (a double tap, a stale screen), the call
  // changes nothing and fails with `aborted`, so one tap never ends two parts
  // or two turns.
  //
  // Nobody may be acting: the members who acted left the fight (the master
  // removed the last one who could act, or its character was deleted), and
  // `current_combatant_id` is empty while the combat is ACTIVE. Then only the
  // master may call it, with expected_combatant_id empty, and the turns start
  // again from the top of the order, in the same round.
  //
  // Every stream gets `encounter_changed`; when the turn passes, also
  // `turn_changed` (each audience its own copy: a player sees a hidden
  // combatant's turn as the master's).
  //
  // Errors:
  //   - `not_found`: the combat is not this campaign's, or the caller is a
  //     player and may not see the combatant (an NPC they do not see is not
  //     found here either, as `expected_combatant_id`).
  //   - `permission_denied`: the caller is a player and the member is not
  //     their character, or nobody is acting.
  //   - `failed_precondition`: the combat is not ACTIVE, or nobody in it can
  //     take a turn (NOT_ACTIVE); the member has a damage that waits to be
  //     rolled, applied or for a reaction (PENDING_DAMAGE, see
  //     discard_pending_damage); the player's character is down and its death
  //     save is due (DEATH_SAVE_DUE: roll it first; the master rolls it for the
  //     character, and the part ends after it).
  //   - `aborted`: expected_combatant_id is not a member who still acts.
  rpc EndTurn(EndTurnRequest) returns (EndTurnResponse);

  // MoveCombatant puts a combatant on a square of the grid (RN-21).
  //
  // The master moves anyone anywhere in the grid, at any time, and no
  // movement is spent: the master has the last word. A player moves only
  // their own character, only during its turn, and only as far as the
  // movement it has left: the speed (doubled after the Dash action) minus
  // what it already walked this turn, at 1.5 m (5 ft) per square, diagonals
  // included (a king's move). A move too far changes nothing and fails with
  // `failed_precondition` (EncounterBlocked, TOO_FAR, with missing_ft); so
  // does a visible combatant's square (SQUARE_OCCUPIED).
  //
  // The master's move reaches every stream as `combatant_moved`; a player's
  // stream only gets it for a combatant they may see.
  //
  // Errors:
  //   - `not_found`: the combatant is not in this combat, or the caller is a
  //     player and may not see it.
  //   - `permission_denied`: the caller is a player and the combatant is not
  //     their character.
  //   - `invalid_argument`: the square is outside the grid.
  //   - `failed_precondition`: the combat is ended (ENCOUNTER_ENDED), or it
  //     is not ACTIVE and the caller is a player (NOT_ACTIVE); the combatant
  //     is not acting now: its group is not on turn, or its part of the joint
  //     turn ended (NOT_YOUR_TURN); the character is at 0 hit points, for a
  //     player (COMBATANT_DOWN); the combatant is not on the map yet (NOT_PLACED);
  //     the square is too far (TOO_FAR: `missing_dft` says by how much, and for a
  //     jump the limit is the jump's), a wall, a column or a squeeze between two
  //     blocks the line (MOVE_BLOCKED), an enemy that cannot be passed stands on
  //     it (ENEMY_IN_THE_WAY), or another creature holds the destination
  //     (SQUARE_OCCUPIED); a player's combatant waits for an opportunity
  //     attack's answer (OPPORTUNITY_PENDING).
  //
  // Opportunity attacks (MR-034, RN-21): a move (on foot or a long jump) that
  // leaves the reach (5 ft, or the reach of its melee weapon on its sheet) of a combatant hostile to the mover that sees it, has its reaction
  // and is not incapacitated, unless the mover took the Disengage action this
  // turn, lands at once and gives that combatant an opportunity offer
  // (Encounter.opportunity_offers; the event `opportunity_offered`). The
  // master's placement out of turn and the move back of the 0 hit points rule
  // offer nothing. A long jump is a move that spends movement, so it provokes; a
  // high jump moves no square and does not; `forced` (the master) never does.
  // The mover's turn then waits (OPPORTUNITY_PENDING for its
  // player) until each offer is answered: RollAttack with `opportunity_offer_id`,
  // DeclineOpportunity, or the master's SkipOpportunity.
  //
  // The move is a straight line from the combatant's square to the chosen one
  // (RN-21, the SRD's "breaking up your move": to go around something, move in
  // parts). A player pays the exact length of the line, in tenths of a foot
  // (`movement_used_dft`): 5 ft for a square straight on, 7.1 ft for a diagonal
  // one, plus 5 ft for each square of difficult terrain it enters and for each
  // square holding another creature (once per square). A wall, a three-quarters
  // cover square or a squeeze between two of them blocks the line; an enemy
  // blocks it too, unless the two are two sizes apart; nobody ends in another
  // creature's square (only Tiny with Tiny). A creature with a fly speed moves as
  // a flier: difficult terrain costs it nothing. Swimming and climbing are not
  // modelled. The master moves anyone anywhere for free, except an NPC he drags on its own turn:
  // that is a plain walk like a player's (it pays its way, spends the NPC's movement and stops for
  // walls, creatures and squares marked "Não dá para passar"), and one past the movement left is
  // refused (TOO_FAR) unless `forced`. Out of its turn, and for a player's character, it stays free.
  //
  // `jump` turns it into a jump (D3): LONG goes to the square without paying for
  // difficult terrain on the way (it cannot cross a wall or land on a creature),
  // and costs its length in movement; HIGH spends `jump_height_dft` of movement
  // and moves nobody. The limits come from the sheet (GetTurnOptions,
  // options.jumps) and a running start needs a move of 10 ft or more on foot
  // right before. A move clears the master's manual cover mark of the combatant
  // (SetCombatantCover).
  //
  // Only in GRID mode: in THEATRE mode there are no squares, so every move, jump
  // and placement is refused with `failed_precondition` (EncounterBlocked,
  // NEEDS_A_MAP). Spend the movement with SpendMovement instead.
  rpc MoveCombatant(MoveCombatantRequest) returns (MoveCombatantResponse);

  // GetMoveOptions says where a combatant can go in one straight move: every
  // square it reaches with its movement left, with what the move costs, and, for
  // the squares inside the circle that it cannot go to, why. The app only draws
  // it, so it never computes a distance or a cost of its own (the browser does no
  // rules math). The caller's own combatant, on its turn, for a player; any
  // combatant for the master (who moves for free, but sees the circle).
  //
  // The reasons never name what the caller does not see: on a map with the fog
  // of war a player's reach is planned on what the mover knows (the squares it
  // sees now or remembers; the rest is plain floor), so it may offer a square that
  // is really a wall, and the real move is then cut short at the last square it
  // can reach (MoveCombatantResponse.stopped_early).
  //
  // Errors:
  //   - `not_found`: the combat or the combatant is not in the open session.
  //   - `permission_denied`: the caller is a player and the combatant is not
  //     their character.
  //   - `failed_precondition`: the combat is not ACTIVE (NOT_ACTIVE) or it is not
  //     the combatant's turn (NOT_YOUR_TURN), for a player; the combatant is not
  //     on the map (NOT_PLACED).
  //
  // In THEATRE mode the answer is valid and empty: no square is reachable or
  // refused, and `movement_left_dft` is what SpendMovement can still spend.
  rpc GetMoveOptions(GetMoveOptionsRequest) returns (GetMoveOptionsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // SpendMovement spends movement by number, for a combat in THEATRE mode (RN-25,
  // ADR-0017): "Gastar movimento", in whole feet (the app steps by 5 ft, 1.5 m).
  // It adds to the combatant's movement used this turn (`movement_used_dft`, the
  // same field MoveCombatant uses, kept in tenths of a foot) and never passes the
  // movement the turn has: its speed (the better of walking and flying), twice
  // after the Dash action. The server does not judge the path or the distance:
  // the master does. The caller's own combatant on its turn, for a player (and for
  // the creatures of their character); any combatant for the master, who is
  // held to the same limit. It is the combatant's movement in the combat log
  // ("gastou 6,0 m de movimento") when it is the combatant's turn, and the
  // master can undo it (UndoLastAction). It provokes nothing: the master offers
  // the opportunity attack (OfferOpportunity).
  //
  // The answer tells what is left (`movement_left_dft`), so the screen says
  // "Restam 3,0 m". Every stream gets `encounter_changed`.
  //
  // Errors:
  //   - `not_found`: the combat or the combatant is not in the open session (a
  //     hidden NPC is not found for a player).
  //   - `permission_denied`: the caller is a player and the combatant is not
  //     theirs.
  //   - `invalid_argument`: `distance_ft` is not 1 to 600.
  //   - `failed_precondition`: the combat is a GRID one (THEATRE_ONLY); it is
  //     ended (ENCOUNTER_ENDED) or not ACTIVE (NOT_ACTIVE); for a player, it is not
  //     the combatant's turn (NOT_YOUR_TURN) or an opportunity attack on it waits
  //     for its answer (OPPORTUNITY_PENDING); the distance is more than the
  //     movement left (TOO_FAR, with missing_ft and missing_dft).
  rpc SpendMovement(SpendMovementRequest) returns (SpendMovementResponse);

  // StandUp is "Levantar-se": the combatant stands up from Prone (SRD 5.1, "Being
  // Prone": standing up takes an amount of movement equal to half your speed, and you
  // cannot stand up if you do not have enough movement left, or if your speed is 0).
  // The cost is half the speed the combatant has this turn without the Dash (the
  // Dash gives more movement, not a faster speed), rounded down to a tenth of a foot,
  // and it is added to the movement used (`movement_used_dft`, as a move does). It takes
  // the Prone condition off. It works on a map and in THEATRE mode (RN-25) alike: no
  // square is involved. The caller's own combatant on its turn, for a player (and for
  // the creatures of their character); any combatant on its turn for the master. It is a
  // line of the combat log for everyone who sees the combatant ("Brisa se levantou"),
  // and the master can undo it (UndoLastAction): the condition and the movement come
  // back. The cost the screen shows is `Combatant.stand_up_cost_dft`.
  //
  // The answer tells what is left (`movement_left_dft`). Every stream gets
  // `encounter_changed`.
  //
  // Errors:
  //   - `not_found`: the combat or the combatant is not in the open session (a hidden
  //     NPC is not found for a player).
  //   - `permission_denied`: the caller is a player and the combatant is not theirs.
  //   - `failed_precondition`: the combat is ended (ENCOUNTER_ENDED) or not ACTIVE
  //     (NOT_ACTIVE); it is not the combatant's turn (NOT_YOUR_TURN); an opportunity
  //     attack waits for an answer (OPPORTUNITY_PENDING); the combatant is not Prone
  //     (NOT_PRONE); its speed is 0 (CANNOT_STAND_UP: grappled, restrained, a Velocidade
  //     that ended, and the like; the message never names the cause to a player); it has
  //     less movement left than the cost (TOO_FAR, with missing_ft and missing_dft).
  rpc StandUp(StandUpRequest) returns (StandUpResponse);

  // OfferOpportunity is the master's "Oferecer ataque de oportunidade", for a
  // combat in THEATRE mode (RN-25, ADR-0017): the combatant on turn (the mover)
  // left the reach of another, the reactor, which the master chooses. In THEATRE
  // mode the server never finds out by itself that anyone left a reach. It makes
  // the same offer a move makes in GRID mode (OpportunityOffer, with no square):
  // the reactor's player gets the prompt (Encounter.opportunity_offers) and
  // answers with RollAttack (`opportunity_offer_id`) or DeclineOpportunity; the
  // master answers for an NPC's reaction (he attacks by hand) or skips the offer
  // (SkipOpportunity); and the mover's turn waits for the answer for a player's
  // character. The reaction rules are the move's: one reaction a round, and a
  // reactor that cannot react now cannot be offered. Only the master.
  //
  // The offer stays pending until it is answered, skipped or taken back
  // (WithdrawOpportunity). It is a session event, `opportunity_offered`; it
  // cannot be undone, but it can be withdrawn. The reactor's player, the mover's
  // player and the master get `encounter_changed`; no other player gets any hint.
  //
  // Errors:
  //   - `not_found`: the combat, the mover or the reactor is not in the open
  //     session.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: the combat is a GRID one (THEATRE_ONLY); it is
  //     ended (ENCOUNTER_ENDED) or not ACTIVE (NOT_ACTIVE); the mover is not on
  //     turn (NOT_YOUR_TURN); the reactor used its reaction (REACTION_USED); the
  //     reactor cannot make the attack now, or is on the mover's side, or has no
  //     melee attack, or the mover is defeated, hidden or took the Disengage
  //     action, or the same offer already waits (NO_OPPORTUNITY).
  rpc OfferOpportunity(OfferOpportunityRequest) returns (OfferOpportunityResponse);

  // WithdrawOpportunity is the master's "Retirar a oferta": he takes back an
  // opportunity offer that nobody answered (he offered it by mistake). The offer
  // goes away, the reactor keeps its reaction and the mover's turn stops waiting.
  // The master can undo it (UndoLastAction): the offer waits again. Only the
  // master.
  //
  // Every stream gets `encounter_changed`.
  //
  // Errors: as SkipOpportunity.
  rpc WithdrawOpportunity(WithdrawOpportunityRequest) returns (WithdrawOpportunityResponse);

  // SetCombatantSide says whose side an NPC fights on (Q69): ENEMY, the default,
  // or PARTY, "Aliado". It decides who may pass whom (an enemy cannot be passed
  // and provokes an opportunity attack; an ally can be passed) and is never
  // secret. A player's character is always PARTY. Only the master may call it.
  // It is a session event, `side_set`.
  //
  // Errors:
  //   - `not_found`: the combatant is not in this combat.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: the combatant is a player's character, or `side` is
  //     unspecified.
  //   - `failed_precondition`: the combat is ended (ENCOUNTER_ENDED).
  rpc SetCombatantSide(SetCombatantSideRequest) returns (SetCombatantSideResponse);

  // SetCombatantCover marks the cover a combatant has that the map does not show
  // (D4): none, half (+2 to AC and Dexterity saves), three-quarters (+5) or
  // total (it cannot be targeted). It adds to the cover the map gives against
  // each attack: the larger applies, never the sum. The mark clears when the
  // combatant moves. Only the master may call it. It is a session event,
  // `cover_set`.
  //
  // Errors:
  //   - `not_found`: the combatant is not in this combat.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: `cover` is unspecified.
  //   - `failed_precondition`: the combat is ended (ENCOUNTER_ENDED).
  rpc SetCombatantCover(SetCombatantCoverRequest) returns (SetCombatantCoverResponse);

  // SetCombatantHidden hides an NPC combatant from the players, or shows it
  // (RN-10): a hidden combatant is not in their order, not on their map, and
  // its turn shows as the master's. Only the master may call it. Player
  // combatants are never hidden. Hiding a member of a joint turn changes
  // nothing for the turn: the players simply stop being sent that member.
  //
  // Errors:
  //   - `not_found`: the combatant is not in this combat.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: the combatant is a player's.
  //   - `failed_precondition`: the combat is ended (ENCOUNTER_ENDED).
  rpc SetCombatantHidden(SetCombatantHiddenRequest) returns (SetCombatantHiddenResponse);

  // AddCombatants brings reinforcements into the combat: copies of NPCs, as
  // in StartEncounter. Only the master may call it, while the combat is in
  // SETUP or ACTIVE. Each new NPC rolls its initiative at once and takes its
  // place in the order; during an ACTIVE combat the turn does not change: an NPC that ties with the
  // group on turn is in its box from the group's next turn, not now.
  // Player characters can be added only in SETUP.
  //
  // Errors:
  //   - `not_found`: a participant is not a living character of the campaign.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: no participants, more than 40 combatants in all,
  //     a player character already in the combat or added during ACTIVE, or
  //     a count outside 1 to 10.
  //   - `failed_precondition`: the combat is ended (ENCOUNTER_ENDED).
  rpc AddCombatants(AddCombatantsRequest) returns (AddCombatantsResponse);

  // AddMonsters puts N monsters of one SRD creature into the combat ("Pôr no
  // combate", MR-042, RN-29). Only the master may call it, while the combat is
  // in SETUP or ACTIVE, as AddCombatants. The monsters are copies, in the
  // combat, of one hidden NPC the app keeps for the creature (one per campaign
  // and creature, made on the first add and reused, `BasicSheet.combat_only`;
  // never in the master's list), so the hidden state, the initiative (rolled at
  // once for each copy, with the creature's Dexterity modifier), the players'
  // state words, the attacks and the XP by enemies work as for any NPC. They
  // are named "<name> 1" to "<name> N" (a single one keeps the plain name when
  // no other has it), start hidden unless the request says otherwise, and on a
  // grid start without a square, for the master to place. The hit points are
  // the creature's average, or rolled from its hit dice, for each monster; the
  // master's log line says what was rolled. The idempotency key covers the
  // whole add: a retry with the same parameters answers with the same ids,
  // and with other parameters, or on a key another change used (an
  // AddCombatants), it is `invalid_argument`.
  //
  // Errors:
  //   - `not_found`: the combat is not in the open session.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: creature_key is not an SRD creature, count is
  //     outside 1 to 10, the name is not 1 to 30 characters on one line, the
  //     hit-point mode is unknown, or the idempotency key was used for another
  //     change.
  //   - `failed_precondition`: the combat is ended (ENCOUNTER_ENDED); the combat
  //     would pass 40 combatants, counting every combatant it has (EncounterBlocked,
  //     TOO_MANY_COMBATANTS).
  rpc AddMonsters(AddMonstersRequest) returns (AddMonstersResponse);

  // RemoveCombatant takes a combatant out of the combat. Only the master may
  // call it. If it is acting in an ACTIVE combat, it leaves the turn first: the
  // turn passes to the next group when nobody who acts is left in its group. A player's combatant can be removed only in SETUP.
  //
  // Errors:
  //   - `not_found`: the combatant is not in this combat.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: the combat is ended (ENCOUNTER_ENDED), or
  //     the combatant is a player's and the combat is ACTIVE
  //     (PLAYER_IN_COMBAT), or a damage the combatant attacked with, or
  //     took, is still to roll or to apply (PENDING_DAMAGE): the master
  //     settles it first.
  rpc RemoveCombatant(RemoveCombatantRequest) returns (RemoveCombatantResponse);

  // EndEncounter ends the combat, from SETUP or ACTIVE. Only the master may
  // call it. The player characters' tokens move to the squares where they
  // ended (MapService tokens), so the map shows them where they stand.
  // Ending the game session ends its combat the same way. Ending a combat
  // that already ended is not an error: it returns it as it is.
  //
  // Every stream gets `encounter_changed`, and `map_changed` for the map.
  //
  // Errors:
  //   - `not_found`: the combat is not this campaign's.
  //   - `permission_denied`: the caller is a player.
  rpc EndEncounter(EndEncounterRequest) returns (EndEncounterResponse);

  // GetTurnOptions says what a combatant can do now: "Sua vez" (MR-014). The
  // combatant's player may read their own character's, and the master any
  // combatant's (an NPC's come from its sheet: a full sheet or a basic one
  // with its attacks).
  //
  // It answers also when the combatant is not on turn, or the combat is not
  // running: then every option is disabled with the reason
  // (NOT_YOUR_TURN, COMBAT_NOT_ACTIVE, COMBATANT_DOWN, COMBATANT_DEFEATED),
  // so the app can show "fora da vez". Besides the options the rules engine
  // works out (economy, attacks, spells, actions), it lists, for each attack
  // that rolls to hit, the targets the caller sees with the distance (the squares
  // between the centres, rounded down, 5 ft a square: RN-21), the cover each has
  // against this combatant's attack and whether each is too far, and the
  // damage this combatant still has to roll or that waits for the master. For
  // each spell that can be cast, it lists the targets the caller sees, with the
  // distance and whether each is too far for the spell (spell_targets), and
  // how many attacks of the Attack action are left (Extra Attack:
  // options.economy.attacks_left). attack_targets is filled also when the
  // combatant is off turn, so the app can offer an opportunity attack
  // (RollAttack, as_reaction) while the reaction is unused.
  //
  // A player never gets a hidden combatant among the targets, nor anyone's
  // armor class.
  //
  // Errors:
  //   - `not_found`: the combat or the combatant is not in this campaign's
  //     open session, or the caller is a player and may not see it.
  //   - `permission_denied`: the caller is a player and the combatant is not
  //     their character.
  rpc GetTurnOptions(GetTurnOptionsRequest) returns (GetTurnOptionsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RollAttack is the first step of an attack: the attack roll. The
  // combatant on turn attacks one target with one of its attacks (a weapon
  // or a damaging cantrip; GetTurnOptions lists them). The combatant's
  // player may attack with their own character, and the master with any
  // combatant on turn (an NPC's attack, or on a player's behalf).
  //
  // The roll is rolled by the app (roll_in_app) or a physical d20's face is
  // typed (d20_face, 1 to 20). The campaign's dice setting (RN-18) is checked
  // as in SubmitInitiative: the player chooses on each roll unless the master
  // forced a mode (WRONG_DICE_MODE). An NPC's roll is the master's: either way.
  //
  // The attack spends the action. A cantrip (a spell attack of options.attacks)
  // takes the whole action and never counts for Extra Attack, which belongs to
  // weapon attacks: after a weapon attack a cantrip is ACTION_USED, and the other
  // way round. With Extra Attack the first weapon attack spends
  // it and the next ones of the same Attack action (2 at level 5) are allowed
  // while options.economy.attacks_left is above 0 (ATTACKS_USED after; a
  // single-attack combatant gets ACTION_USED). An NPC's multiattack is the
  // master's, who may attack again. With as_reaction the attack is an
  // opportunity attack: a melee attack off turn that spends the reaction
  // instead of the action. Without an opportunity_offer_id the server does not
  // check the trigger: any target within reach, an ally included, is accepted,
  // because the master rules on what provoked it at the table. The server compares the total with the target's armor
  // class (plus the +5 of an active Escudo): a
  // natural 20 hits and is a critical hit, a natural 1 misses, any other
  // roll hits when the total reaches the armor class. A halfling (Lucky, SRD 5.1)
  // whose d20 shows a 1 is asked first: the roll is held with `lucky_offer` and
  // resolved by AnswerLucky, with the new d20 when the player rolls it again; an
  // attacker that holds a Bardic Inspiration die is held the same way, with
  // `inspiration_offer` (AnswerBardicInspiration). A second roll of the combatant while
  // a question waits is refused with a ResourceBlocked detail (LUCKY_PENDING or
  // INSPIRATION_PENDING). The answer carries the
  // roll as numbers and the outcome, never the armor class. A hit opens a
  // pending damage (stored, so a retry or a reload finds it) for RollDamage;
  // a miss ends the attack. When the hit lands on a player's character that
  // can still cast Escudo (prepared, a free slot, reaction unused, not a
  // critical hit), the pending damage waits for the reaction instead
  // (AWAITING_REACTION, see UseReaction): the attacker sees "waiting for the
  // reaction", never why.
  //
  // A player must be in reach: the target at most the attack's range (a
  // melee attack: its reach, 5 ft unless the weapon says more) from them.
  // Disadvantage at long range or next to an enemy is not applied yet. The
  // master is never held to the reach.
  //
  // Every stream gets `encounter_changed`; the master's, and a player's when
  // no hidden combatant is involved, `combat_log_changed`.
  //
  // Errors:
  //   - `not_found`: the combat, the attacker or the target is not in this
  //     campaign's open session, or the caller is a player and may not see it.
  //   - `permission_denied`: the caller is a player and the attacker is not
  //     their character.
  //   - `invalid_argument`: neither roll_in_app nor d20_face is set, the face
  //     is not 1 to 20, the attack_key is not one of the attacker's attacks
  //     or asks for a saving throw (that is CastSpell, with no slot for a
  //     cantrip such as Chama Sagrada), the attacker is the target, or
  //     as_reaction is set for an attack that is not melee or on the
  //     attacker's own turn.
  //   - `failed_precondition` (EncounterBlocked): NOT_ACTIVE, NOT_YOUR_TURN
  //     (the attacker is not on turn; not for as_reaction), ACTION_USED or
  //     ATTACKS_USED (a player), ATTACKS_USED (the master's NPC made as many
  //     attacks as its creature's Multiattack has; other NPCs are not held to a
  //     count), REACTION_USED (as_reaction, a player),
  //     COMBATANT_DOWN,
  //     TARGET_DEFEATED, NOT_PLACED (a player without a square, or a target
  //     without one), TARGET_OUT_OF_REACH (with missing_ft) and WRONG_DICE_MODE.
  rpc RollAttack(RollAttackRequest) returns (RollAttackResponse);

  // RollDamage is the second step of an attack that hit: it rolls the damage
  // of the pending damage with the attack's dice (a critical hit follows the
  // table's rule, PendingDamage.critical_rule: doubled dice, or the dice once
  // with their maximum kept; the modifier is added once) and its damage type. The attacker's player
  // may roll for their own attack, and the master for any.
  //
  // The roll follows the same rules as RollAttack (the player chooses on each
  // roll unless the master forced a mode, RN-18): roll_in_app, or typed_sum,
  // the sum of the physical dice without the modifier (the app adds it),
  // between the number of dice and the number of dice times their faces
  // (Q38). A damage without dice (a flat number) needs no roll: either field
  // works.
  //
  // When the target is an NPC the damage is applied at once: temporary hit
  // points first, then the hit points; at 0 the NPC is defeated ("Derrotado")
  // and the turns skip it. When the target is a player's character the
  // damage waits for the master (status ROLLED) until ApplyPendingDamage or
  // DiscardPendingDamage (RN-02).
  //
  // A pending damage that comes from a spell has more to it. The pending
  // damages of one cast share a cast_id, and an area spell's damage is one
  // roll for the whole cast (SRD): rolling any of them rolls once and settles
  // all the others of the cast, in full or, for a target that saved, in half
  // (rounded down); the rest come back in cast_pending_damages. A healing
  // spell's pending is a heal: the roll plus the caster's spellcasting
  // modifier (the SRD's "+ MOD") heals the target at once, up to its maximum,
  // for an NPC and for a player's character alike (a character healed from 0
  // gets up and its death saves reset). Magic Missile's pending damages are
  // one for each target, with its darts.
  //
  // Errors:
  //   - `not_found`: the pending damage is not in this combat, or the caller
  //     is a player and may not see the attacker.
  //   - `permission_denied`: the caller is a player and the attacker is not
  //     their character.
  //   - `invalid_argument`: neither roll_in_app nor typed_sum is set, or the
  //     sum is out of range for the dice.
  //   - `failed_precondition` (EncounterBlocked): ENCOUNTER_ENDED,
  //     DAMAGE_ALREADY_ROLLED, DAMAGE_RESOLVED, REACTION_PENDING (the hit still
  //     waits for the target's reaction) and WRONG_DICE_MODE.
  rpc RollDamage(RollDamageRequest) returns (RollDamageResponse);

  // ApplyPendingDamage applies a rolled damage to a player's character: the
  // damage goes through the character's vitals (RN-02): temporary hit points
  // first, then hit points, never below 0. At 0 the character is down
  // ("Caído") and makes death saves (RollDeathSave). A damage that hits a
  // character already at 0 does not lower anything: it is a death save
  // failure, two for a critical hit (RN-03). When the target is concentrating
  // on a spell, the answer carries the Constitution save DC to keep it
  // (PendingDamage.concentration_dc, RN-22): the table rolls it, the app only
  // reminds.
  //
  // amount is the master's last word (RN-02): when set (0 to 9,999) he applies
  // that number instead of the rolled one, because of a save he overrules, a
  // resistance or a table decision. The log keeps both numbers for him; the
  // character's player only sees what they took. Only the master may call it,
  // and only for a damage in ROLLED.
  //
  // Every stream gets `encounter_changed`, and the character's player and the
  // master `vitals_changed`.
  //
  // Errors:
  //   - `not_found`: the pending damage is not in this combat.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: amount is outside 0 to 9,999.
  //   - `failed_precondition` (EncounterBlocked): ENCOUNTER_ENDED,
  //     DAMAGE_NOT_ROLLED, DAMAGE_RESOLVED and REACTION_PENDING.
  rpc ApplyPendingDamage(ApplyPendingDamageRequest) returns (ApplyPendingDamageResponse);

  // DiscardPendingDamage drops a damage without applying it ("Não aplicar"),
  // rolled or not. Only the master may call it.
  //
  // Errors: as ApplyPendingDamage, except that a damage not yet rolled, or
  // waiting for a reaction, may be discarded (no DAMAGE_NOT_ROLLED, no
  // REACTION_PENDING), and there is no amount.
  rpc DiscardPendingDamage(DiscardPendingDamageRequest) returns (DiscardPendingDamageResponse);

  // TakeAction takes one of the standard actions that only spend the action
  // economy: Dash, Disengage, Dodge, Help, Hide, Ready, Search and Use an
  // Object (the keys of rules.v1.TurnOptions.standard_actions, such as
  // "standard:dash"), or a feature action of the character's class or race
  // (rules.v1.TurnOptions.feature_actions, such as "feature:second-wind").
  // Attack and Cast a Spell are not taken here: RollAttack and CastSpell. Dash
  // doubles the speed for the rest of the turn (RN-21). The rest only spend
  // the action and go to the log: the app reminds the table of their effects.
  //
  // A feature action also spends one use of its resource (Retomar o fôlego,
  // Surto de ação, Fúria...; the character's vitals keep the uses, and the
  // master corrects them: rests come later). Only two change numbers.
  // Retomar o fôlego (feature:second-wind) heals 1d10 plus the fighter's level
  // through the vitals path, rolled like a damage (roll_in_app, or typed_sum of
  // the d10); the answer says how much. Surto de ação
  // (feature:action-surge-1-use) makes the action available again, with the
  // attacks of the Attack action. A feature that is a pool (Cura pelas mãos)
  // spends the action and no points: the master keeps the pool.
  //
  // The combatant must be on turn. Its player may act for their own
  // character, and the master for any (the master may act again with the
  // action used).
  //
  // Errors:
  //   - `not_found`: the combat or the combatant is not in this campaign's
  //     open session, or the caller is a player and may not see it.
  //   - `permission_denied`: the caller is a player and the combatant is not
  //     their character.
  //   - `invalid_argument`: the action_key is not one of those listed above,
  //     or the roll is missing or out of range for an action that rolls.
  //   - `failed_precondition` (EncounterBlocked): NOT_ACTIVE, NOT_YOUR_TURN,
  //     ACTION_USED, BONUS_ACTION_USED or REACTION_USED (a player: the economy
  //     the action costs), NO_USES (the resource is spent; recharge says when it
  //     comes back), WRONG_DICE_MODE and COMBATANT_DOWN.
  rpc TakeAction(TakeActionRequest) returns (TakeActionResponse);

  // AdjustCombatantHitPoints is the master's hand on an NPC's hit points:
  // "Dano/Cura" (MR-012). One of damage (temporary hit points first), heal
  // (up to the maximum) or hit_points (an exact value), and, apart or
  // together, new temporary hit points. A defeated NPC healed above 0 comes
  // back into the turn order; one that reaches 0 is defeated. A player's
  // character keeps AdjustCharacterVitals (RN-02).
  //
  // Errors:
  //   - `not_found`: the combat or the combatant is not in this combat.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: nothing to change, more than one of damage, heal
  //     and hit_points, a value out of range (damage and heal 0 to 9,999,
  //     hit_points 0 to the maximum, temporary 0 to 999), or the combatant
  //     is a player's character.
  //   - `failed_precondition`: the combat is ended (ENCOUNTER_ENDED).
  rpc AdjustCombatantHitPoints(AdjustCombatantHitPointsRequest) returns (AdjustCombatantHitPointsResponse);

  // UndoLastAction takes back the last action, one step ("Desfazer"): an
  // attack roll, a damage roll, an applied or discarded damage, a standard or
  // feature action, a spell cast, a reaction used or declined, a death save,
  // the conditions or the concentration marked, or an NPC's hit point change.
  // It restores the hit points, the vitals (spell slots, class resources,
  // hit points), the economy, the Escudo bonus, the concentration, the death
  // save counts, the defeated flag and the pending damage exactly as they
  // were, and writes a compensating event: the history keeps both. The undone
  // entry leaves the combat log. ConfirmDeath is never undone: the character
  // is dead in the characters module by then, and bringing a character back
  // is the master's (AdjustCharacterVitals and the characters' own service),
  // not a step back.
  //
  // Only the master may call it. expected_event_id is the event the master
  // sees as the last action (ListCombatLog.undoable_event_id): if another is
  // the last now, the call changes nothing and fails with `aborted`, so two
  // masters never undo two things. Only the very last change of the session
  // can be undone: any later event (a turn passing, a move, a correction of
  // the vitals) leaves nothing to undo (NOTHING_TO_UNDO).
  //
  // Errors:
  //   - `not_found`: the combat is not this campaign's.
  //   - `permission_denied`: the caller is a player.
  //   - `aborted`: expected_event_id is not the last action.
  //   - `failed_precondition` (EncounterBlocked): ENCOUNTER_ENDED or
  //     NOTHING_TO_UNDO.
  rpc UndoLastAction(UndoLastActionRequest) returns (UndoLastActionResponse);

  // CastSpell casts a spell (MR-014, RN-02): the caster's player may cast for
  // their own character on its turn, and the master for any combatant on turn
  // (an NPC with a full sheet casts from its sheet; an NPC's spell slots are
  // not counted, only a player's character's are).
  //
  // spell_key is one of the spells GetTurnOptions lists (options.spells), or a
  // cantrip of options.attacks that asks for a saving throw (Chama Sagrada);
  // an attack-roll cantrip such as Raio de Fogo stays on RollAttack. slot is
  // the slot it is cast with: unset for a cantrip, and for a spell at least the
  // spell's level, with a free slot (a SlotChoice of the spell's options).
  //
  // The cast spends the slot and the action or bonus action at once, in the same
  // transaction (MR-014): a retry with the same idempotency_key spends nothing,
  // and a spell that does nothing the table cannot see is still spent. A
  // reaction spell (Escudo) is not cast here: UseReaction.
  //
  // An area spell placed on the map (a spell whose area comes out of the caster
  // or is centered on a point, in a combat with a grid: SpellTargets.placement is
  // not UNSPECIFIED, see PreviewSpellArea) is cast with `area`, the point or the
  // direction the caster chose. The server decides who is inside, and each one's
  // cover from the point of origin: `targets` is ignored. Everyone inside is
  // affected, allies and the caster included, hidden creatures too (the table
  // rule TableRules.hidden_area_hits only decides whether a hit reveals them), and
  // an area with nobody in it is still cast and spends the slot and the action.
  // A cast with `area` for a spell that has none, or without it for one that
  // needs it, is `invalid_argument`. Without a grid (THEATRE) the caster lists
  // `targets` as before, and the master judges what is inside and the cover.
  //
  // reveal_hidden (the master only) says whether the hidden creatures the area
  // hits appear to the players; without it the table rule decides. A player who
  // sends it is `permission_denied`, before anything else is checked. When a
  // player casts and the rule is ASK, the cast holds the turn until the master
  // answers (ResolveHiddenReveal): while a question is open the server refuses
  // MoveCombatant, RollAttack, TakeAction, CastSpell, EndTurn and the master's
  // turn passing with EncounterBlocked HIDDEN_REVEAL_PENDING.
  //
  // targets are who it touches, as the caller sees them, in range (the spell's
  // range from the caster, a king's move at 5 ft a square; Self is the caster
  // alone, Touch is 5 ft; the master is never held to the range, and the caster
  // may target itself). A spell that targets one creature takes one; one with
  // "an additional creature" per slot level takes one more for each level above
  // the spell's; an area spell takes any number, even none. A spell with no
  // target but the caster (Self) takes none. A cast takes at most 10 targets, the
  // master's too (what each target did must fit the cast's session event). Magic
  // Missile is cast with `darts`
  // in each target: 3 darts, and one more for each slot level above the 1st, shared
  // out as the caster wants, at least one for each target listed. Scorching Ray
  // shares its rays the same way (3, and one more for each slot level above the
  // 2nd), but `darts` is the rays of that target (none counts as one), the rays
  // need not use the whole number, and several may go to one target.
  //
  // What the cast does depends on the spell:
  //   - A spell attack (Guiding Bolt): one d20 for each target (roll_in_app, or
  //     d20_face for a single target, RN-18), against the target's armor class as
  //     in RollAttack: a hit opens a pending damage (critical on a natural 20).
  //   - A saving throw (Mãos Flamejantes, Onda Trovejante): the server rolls the
  //     save of every target. An NPC with a full sheet uses its saving throw
  //     bonus; a basic sheet has none, so it rolls d20 + 0 and the log says the
  //     bonus is not known. A player's character's save is rolled by the app too,
  //     with its sheet's bonus; the master has the last word through the amount
  //     of ApplyPendingDamage. A target that saves takes half of the damage when
  //     the spell says so (rounded down), and nothing when it says none. The
  //     damage is one roll for the whole cast, rolled by RollDamage.
  //   - Magic Missile: a pending damage for each target, 1d4 + 1 for each dart at
  //     any slot level,
  //     with no roll to hit.
  //   - Healing (Curar Ferimentos): a pending heal for each target, rolled by
  //     RollDamage, with the caster's spellcasting modifier.
  //   - A spell that reads hit points (Sono, Leque Cromático, Palavra de Poder:
  //     Atordoar and Matar, Estabilizar, Cura Completa; effect_kind of
  //     the answer): the server reads each target's current hit points (an NPC's
  //     from the combat, a player's character's from its vitals) and applies the
  //     effect at once, in the same transaction. A pool (Sono, Leque Cromático)
  //     is rolled by the server (roll_in_app) or typed from physical dice
  //     (pool_sum), RN-18; it goes through the targets in ascending order of
  //     current hit points, skips the unconscious and those at 0, and gives the
  //     condition to each one whose hit points fit in what is left. A threshold
  //     (Palavra de Poder) affects a target at or below the limit: a condition,
  //     or death (an NPC is defeated; a player's character drops to 0 hit points
  //     with three death save failures, and the master confirms the death with
  //     ConfirmDeath). Estabilizar makes a player's character at 0 hit
  //     points stable. Cura Completa heals and ends blindness and deafness. The
  //     caster's player gets their own pool roll and who was affected, never a
  //     target's hit points; the master gets the pool, each target's hit points
  //     and the order; the other players only see who was affected (RN-20).
  //     UndoLastAction puts everything the cast changed back.
  //   - Anything else (Teia, Passo Nebuloso...): it spends and goes to the
  //     log; the effect is the table's, and the master marks the conditions
  //     (SetCombatantConditions).
  //
  // A concentration spell sets the caster's concentration_spell; a second one
  // replaces the first, and the log says the first ended (RN-22).
  //
  // Every stream gets `encounter_changed`; the master's, and a player's when no
  // hidden combatant is involved, `combat_log_changed`; the caster's player and
  // the master `vitals_changed` (the slot).
  //
  // Errors:
  //   - `not_found`: the combat, the caster or a target is not in this
  //     campaign's open session, or the caller is a player and may not see it.
  //   - `permission_denied`: the caller is a player and the caster is not their
  //     character.
  //   - `invalid_argument`: more than 10 targets, no roll for a spell attack, a face out of 1 to 20 or
  //     d20_face with more than one target, neither roll_in_app nor pool_sum for a
  //     pool spell (or a pool_sum out of range, or a d20_face), a spell that is not one of the
  //     caster's or cannot be cast now (a reaction, a casting time too long), a
  //     slot that does not fit, a wrong number of targets or darts, or the same
  //     target twice.
  //   - `failed_precondition` (EncounterBlocked): NOT_ACTIVE, NOT_YOUR_TURN,
  //     COMBATANT_DOWN, ACTION_USED or BONUS_ACTION_USED (a player),
  //     NO_SLOT (with min_level), NOT_PLACED and TARGET_OUT_OF_REACH (with
  //     missing_ft; a player), TARGET_DEFEATED and WRONG_DICE_MODE.
  rpc CastSpell(CastSpellRequest) returns (CastSpellResponse);

  // PreviewSpellArea says who an area spell reaches when it is placed at a point
  // or in a direction, and the cover each one has, without spending anything: the
  // second step of "Conjurar" on a map ("Quem está na área"). CastSpell works it
  // all out again and trusts nothing of this answer.
  //
  // The point of origin (SRD 5.1, "Areas of Effect"): a sphere or a cylinder is
  // centered on a point within the spell's range (`origin`); a cone, a line and a
  // cube come out of the caster, who points a direction (`direction`), and the
  // caster's own square is not inside; a sphere or a cylinder that is itself Self
  // ("a 15-foot radius around you") is centered on the caster and needs neither.
  // A location is outside the area when no unblocked straight line runs from the
  // origin to it, and only total cover (a wall, a closed door) blocks; a spell
  // that "spreads around corners" (Fireball) reaches the part of its shape
  // connected to the origin instead. A point the caster does not see because a wall
  // is in the way comes into being on the near side of the wall (SRD, "Targets"):
  // `origin` of the answer is the effective one (the master is not held to this,
  // and nor to the range).
  //
  // The cover of each target is measured from the point of origin, not from the
  // caster, and counts only when the spell's saving throw is a Dexterity one
  // (`cover_counts`; SRD, "Cover": +2 or +5 to Dexterity saving throws): a spell
  // with another save (Onda Trovejante, Constitution) gives no bonus. A creature
  // reached only around a corner gets no cover bonus of its own: the master marks
  // it (SetCombatantCover).
  //
  // The answer lists only what the caller sees (RN-10, RN-20): a hidden creature
  // is not in `targets` for a player, nor counted anywhere, and an area drawn by
  // the map the player knows leaves the walls they do not know out. The master
  // gets everyone, the hidden ones marked.
  //
  // Errors:
  //   - `not_found`: the combat or the caster is not in this campaign's open
  //     session, or the caller is a player and may not see it.
  //   - `permission_denied`: the caller is a player and the caster is not their
  //     character.
  //   - `invalid_argument`: the spell is not one of the caster's, is no placed area,
  //     the slot does not fit, both or neither of origin and direction for a spell
  //     that needs one, a point off the map, or a direction with both numbers 0.
  //   - `failed_precondition` (EncounterBlocked): NOT_ACTIVE, NOT_PLACED (the
  //     caster has no square), and, for a player, TARGET_OUT_OF_REACH (with
  //     missing_ft) for an origin beyond the spell's range.
  rpc PreviewSpellArea(PreviewSpellAreaRequest) returns (PreviewSpellAreaResponse);

  // MoveSpellZone moves the area a spell keeps on the map, for the spells that allow it
  // (Moonbeam: its caster uses an action on a later turn to move the beam up to 60 feet).
  // It costs the caster's action, and the creatures the zone now covers and had not
  // reached before are hit as the spell says. The master moves any zone without the
  // action or the distance.
  //
  // Errors:
  //   - `invalid_argument`: the zone is not one that moves by an action, or the square
  //     is off the map or a wall.
  //   - `not_found`: the zone is not in the combat (also for one a player does not see).
  //   - `failed_precondition` (EncounterBlocked): NOT_ACTIVE, NOT_YOUR_TURN, ACTION_USED
  //     (the action is spent), TARGET_OUT_OF_REACH (with missing_ft) beyond the 60 feet.
  //   - `permission_denied`: the caller does not play the caster.
  rpc MoveSpellZone(MoveSpellZoneRequest) returns (MoveSpellZoneResponse);

  // EndSpellZone ends the area a spell keeps on the map, at the master's word (the caster's
  // concentration ended outside the app). Only the master may call it. The log tells that the
  // zone ended and the master ended it.
  //
  // Errors:
  //   - `permission_denied`: the caller is not the master.
  //   - `not_found`: the zone is not in the combat.
  rpc EndSpellZone(EndSpellZoneRequest) returns (EndSpellZoneResponse);

  // ResolveHiddenReveal answers the question a player's area spell opened when it
  // hit hidden creatures and the table rule is "Perguntar a cada vez" (Encounter.
  // pending_hidden_reveals): `reveal` true makes them appear to the players, as
  // SetCombatantHidden does; false keeps them hidden. It lets the turn go on when
  // the last question is answered. Questions are answered in the order they were
  // opened, the oldest first.
  //
  // Only the master may answer. A player gets `permission_denied` for any
  // pending_reveal_id, existing or not, checked before the id is looked up: a
  // different answer would tell the player whether a question is open, and so
  // whether the spell hit a hidden creature (RN-10). Answering the same way twice
  // is not an error (the answer is the same); the other way, after the first
  // answer, is `failed_precondition`, and answering a question while an older one
  // waits is `failed_precondition` too. Ending the combat drops the questions.
  //
  // Errors:
  //   - `permission_denied`: the caller is not the master.
  //   - `invalid_argument`: a malformed id.
  //   - `not_found`: the combat is not in this campaign, or the question does not
  //     exist.
  //   - `failed_precondition`: answered the other way already, or an older question
  //     is open.
  rpc ResolveHiddenReveal(ResolveHiddenRevealRequest) returns (ResolveHiddenRevealResponse);

  // UseReaction casts Escudo (the spell) when a hit lands on a player's
  // character: the hit's pending damage waits in AWAITING_REACTION, and the
  // target's player and the master see a prompt (Encounter.reaction_prompts).
  // The target's player may call it for their own character, and the master for
  // any. It spends the slot (at least 1st level, with a free slot: slot is one
  // of the prompt's) and the reaction, and gives the combatant +5 armor class
  // until the start of its next turn: every attack meanwhile uses it. The
  // server then compares the attack again: a total below the new armor class
  // is a MISS (the log says Escudo stopped it) and the pending damage is
  // discarded; a total that still reaches it goes on to AWAITING_ROLL. The
  // answer never carries the attack's total or the armor class: the player
  // decides without them, as at a table.
  //
  // Every stream gets `encounter_changed`; the master's, and a player's when no
  // hidden combatant is involved, `combat_log_changed`; the target's player and
  // the master `vitals_changed`.
  //
  // Errors:
  //   - `not_found`: the pending damage is not in this combat, or the caller is
  //     a player and may not see its target.
  //   - `permission_denied`: the caller is a player and the target is not their
  //     character.
  //   - `invalid_argument`: the slot does not fit Escudo (below the 1st level, or
  //     not one of the character's).
  //   - `failed_precondition` (EncounterBlocked): ENCOUNTER_ENDED,
  //     NOT_AWAITING_REACTION, NO_SLOT (with min_level) and REACTION_USED.
  rpc UseReaction(UseReactionRequest) returns (UseReactionResponse);

  // DeclineReaction lets the hit go ("Não usar"): the pending damage goes on to
  // AWAITING_ROLL. The target's player may call it for their own character, and
  // the master for any (when the player does not answer).
  //
  // Every stream gets `encounter_changed`.
  //
  // Errors: as UseReaction, without the slot errors.
  rpc DeclineReaction(DeclineReactionRequest) returns (DeclineReactionResponse);

  // DeclineOpportunity turns an opportunity offer down ("Não atacar"): the offer
  // is answered, and the mover's turn stops waiting for it. The reactor's
  // controller may call it (the player of a character or of its creature, the
  // master for an NPC), and the master for any offer.
  //
  // Every stream gets `encounter_changed`.
  //
  // Errors:
  //   - `not_found`: the combat is not in the open session, or the caller may not
  //     see the reactor.
  //   - `permission_denied`: the caller is a player and the reactor is not theirs.
  //   - `aborted`: the offer is gone (the move was undone, or the combat's
  //     turn passed) or was answered already. The screen reads the combat again.
  //   - `failed_precondition`: the combat is ended (ENCOUNTER_ENDED).
  rpc DeclineOpportunity(DeclineOpportunityRequest) returns (DeclineOpportunityResponse);

  // SkipOpportunity is the master's "Seguir sem esperar": it passes over an
  // opportunity offer whose player does not answer (offline), so the mover's
  // turn goes on. Only the master.
  //
  // Every stream gets `encounter_changed`.
  //
  // Errors: as DeclineOpportunity, and `permission_denied` for a player.
  rpc SkipOpportunity(SkipOpportunityRequest) returns (SkipOpportunityResponse);

  // RollDeathSave rolls a death save for a player's character at 0 hit points
  // (RN-03): its turn starts with one due (Combatant.death_save_due). The
  // character's player may roll for their own, and the master for any, with the
  // d20 rolled by the app (roll_in_app) or typed from a physical die (d20_face,
  // 1 to 20; RN-18 per roll). 10 or more is a success, less a failure, a natural
  // 1 two failures; a natural 20 brings the character back with 1 hit point
  // (through the vitals; it may act, and both counts reset). Three successes
  // make it stable: it stops rolling and stays at 0 ("Estável"). Three failures
  // make it dying: the master confirms the death (ConfirmDeath); the engine
  // never kills a character by itself. The counts stay on the combatant until the
  // combat ends, and a new combat starts at 0 and 0.
  //
  // Any healing above 0 resets both counts (a spell, Retomar o fôlego, the
  // master's AdjustCharacterVitals). A damage that hits a character at 0 is a
  // failure (ApplyPendingDamage).
  //
  // Every stream gets `encounter_changed`; the master's, and a player's when no
  // hidden combatant is involved, `combat_log_changed`; the character's player
  // and the master `vitals_changed` on a natural 20.
  //
  // Errors:
  //   - `not_found`: the combatant is not in this combat, or the caller is a
  //     player and may not see it.
  //   - `permission_denied`: the caller is a player and the combatant is not
  //     their character.
  //   - `invalid_argument`: no roll, or a face out of 1 to 20, or the combatant is
  //     an NPC.
  //   - `failed_precondition` (EncounterBlocked): NOT_ACTIVE, NOT_YOUR_TURN,
  //     DEATH_SAVE_NOT_DUE (the character is not down, already rolled this
  //     turn, is stable or dying) and WRONG_DICE_MODE.
  rpc RollDeathSave(RollDeathSaveRequest) returns (RollDeathSaveResponse);

  // ConfirmDeath is the master's word that a player's character who failed
  // three death saves is dead (RN-03, question 39): it marks the character dead
  // (CharacterService.MarkCharacterDead's effect: the player may create
  // another), takes it out of the order and logs it. Until then the character
  // is "Morrendo" to the master and "Caído" to the players, and the app never
  // says it died. Only the master may call it, and only for a character with
  // three failures. It cannot be undone (UndoLastAction).
  //
  // Every stream gets `encounter_changed` and `turn_changed`; the master's, and
  // a player's, `combat_log_changed`.
  //
  // Errors:
  //   - `not_found`: the combatant is not in this combat.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: the combatant is an NPC.
  //   - `failed_precondition` (EncounterBlocked): ENCOUNTER_ENDED and NOT_DYING
  //     (fewer than three failures, or already confirmed).
  rpc ConfirmDeath(ConfirmDeathRequest) returns (ConfirmDeathResponse);

  // SetCombatantConditions sets the condition labels of a combatant and clears
  // its concentration (RN-22): labels only, the app reminds the table and
  // applies no effect. The master may do both for anyone; a player may only end
  // their own character's concentration. A condition is a key of the SRD's
  // ("condition:poisoned"); the set replaces the old one. A concentration
  // spell is set by CastSpell, never here.
  //
  // Every stream gets `encounter_changed`; `combat_log_changed` for the
  // master's, and for a player's when no hidden combatant is involved.
  //
  // Errors:
  //   - `not_found`: the combatant is not in this combat, or the caller is a
  //     player and may not see it.
  //   - `permission_denied`: the caller is a player and the combatant is not
  //     their character, or the caller is a player and sets conditions.
  //   - `invalid_argument`: nothing to change, a key that is not a condition, a
  //     condition twice, or more than 20.
  //   - `failed_precondition`: the combat is ended (ENCOUNTER_ENDED).
  rpc SetCombatantConditions(SetCombatantConditionsRequest) returns (SetCombatantConditionsResponse);

  // EndConcentration ends the caster's concentration (RN-22) and dismisses the
  // creatures of the casting that depended on it (Conjurar Animais, MR-037):
  // each one leaves the combat and the character's list, with a
  // `creature_dismissed` event per creature. The master for anyone; a player
  // for their own character. The same thing happens when the caster casts
  // another concentration spell, and SetCombatantConditions with
  // `end_concentration` ends it the same way; this one has no other job. A
  // combatant that does not concentrate changes nothing.
  //
  // Every stream gets `encounter_changed`, `combat_log_changed` as for
  // SetCombatantConditions, and the owner and the master `creatures_changed`
  // after the combat.
  //
  // Errors:
  //   - `not_found`: the combatant is not in this combat, or the caller is a
  //     player and may not see it.
  //   - `permission_denied`: the caller is a player and the combatant is not
  //     their character.
  //   - `invalid_argument`: the combatant is not a player's character or an NPC
  //     (a creature does not concentrate).
  //   - `failed_precondition`: the combat is ended (ENCOUNTER_ENDED).
  rpc EndConcentration(EndConcentrationRequest) returns (EndConcentrationResponse);

  // EndCombatEffect ends Ajuda on a combatant (the master only): the hit point bonus
  // goes away, the maximum falls back, and the current hit points lose only what
  // is above the new maximum (SRD 5.1: hit points never go above the maximum). The
  // target never drops to 0 because of it, so a target woken by Ajuda stays awake. A
  // player's character's bonus is kept in its vitals, an NPC's or a creature's on its
  // combatant. Ajuda has no clock (the app does not count the 8 hours): it ends here, or at
  // a long rest. Ending an Ajuda the combatant does not have changes nothing and is not an
  // error. The same key with another request is `invalid_argument`.
  //
  // Every stream gets `encounter_changed` and, for a player's character,
  // `vitals_changed`; the combat log gets an EFFECT_ENDED line.
  //
  // Errors:
  //   - `not_found`: the combatant is not in this combat.
  //   - `permission_denied`: the caller is not the master.
  //   - `invalid_argument`: the effect is not AID.
  //   - `failed_precondition`: the combat is ended (ENCOUNTER_ENDED).
  rpc EndCombatEffect(EndCombatEffectRequest) returns (EndCombatEffectResponse);

  // AnswerReaction answers a reaction window (PM-04): "Usar ..." or "Deixar
  // passar". One window serves the seven reactions (Shield, Uncanny Dodge, Hellish
  // Rebuke, Counterspell, Cutting Words, Deflect Missiles, Feather Fall), and the
  // master's "Sem reação" check of the table rule "Reações dos inimigos". The
  // action that opened the window (an attack, a spell, a fall) stays waiting
  // (AWAITING_REACTION) until every window of it is answered, and goes on by
  // itself then. The reactor's player answers theirs; the master answers any
  // (`by_master` in the log). A window is answered in the order of
  // `Encounter.reaction_windows`.
  //
  // Every stream gets `encounter_changed`; the reactor and the master also get
  // `reaction_window_opened` and `reaction_window_closed`.
  //
  // Errors:
  //   - `not_found`: the combat is not in the open session, or the window is not
  //     in it.
  //   - `permission_denied`: the caller is a player and the window is not theirs
  //     to answer: the same answer for a real and for an invented window_id (RN-10).
  //   - `invalid_argument`: the slot, the creatures or the roll do not fit what the
  //     window offers.
  //   - `failed_precondition` (EncounterBlocked): ENCOUNTER_ENDED,
  //     NOT_YOUR_TURN_TO_ANSWER (out of order, or already answered or closed),
  //     NO_SLOT (with min_level), REACTION_USED, REACTION_NEEDS_ROLL,
  //     WRONG_DICE_MODE.
  rpc AnswerReaction(AnswerReactionRequest) returns (AnswerReactionResponse);

  // MarkReactionRolling says the reactor's player is using an optional reaction and
  // is rolling its die now (a physical die takes a while to type). It sets
  // `ReactionWindow.rolling`, which the master's screen reads: the 30 s automatic
  // pass then waits a longer, still bounded time (the screen's clock; the master can
  // always pass it by hand). It changes nothing else, writes no log line, and is
  // idempotent: marking a window twice is the same as once.
  //
  // Only the reactor's player may call it: the master is refused (`permission_denied`),
  // and so is a player for a window that is not theirs, the same answer for a real
  // and an invented window_id (RN-10).
  //
  // The reactor and the master get `encounter_changed`.
  //
  // Errors:
  //   - `not_found`: the combat is not in the open session.
  //   - `permission_denied`: as above.
  //   - `failed_precondition` (EncounterBlocked): ENCOUNTER_ENDED, NOT_YOUR_TURN_TO_ANSWER
  //     (out of order, or already answered or closed).
  rpc MarkReactionRolling(MarkReactionRollingRequest) returns (MarkReactionRollingResponse);

  // ResolveConcentrationSave settles a concentration window (SRD, Duration): the
  // owner's Constitution saving throw against the DC the window carries, rolled in
  // the app or typed from a physical d20, or handed to the master ("Deixar o
  // mestre rolar por mim"). The master rolls or keeps the concentration for an
  // NPC, and for a player who does not answer. On a failure the concentration ends,
  // and the spell with it. The action that dealt the damage goes on after it.
  //
  // Errors: as AnswerReaction.
  rpc ResolveConcentrationSave(ResolveConcentrationSaveRequest) returns (ResolveConcentrationSaveResponse);

  // ListCombatLog returns the combat log ("Registro do combate"), latest
  // first, grouped by round. Every entry is structured: the app writes the
  // sentence. A player only gets the entries about what they see: nothing
  // from a hidden combatant (not even that it waits hidden), no hit points
  // of an NPC, no armor class, and the dice only of their own character;
  // when the master reveals a combatant, only new entries appear. The master
  // gets everything, with `hidden` set on the entries the players do not get.
  //
  // Any member may call it. The app reads it after every
  // `combat_log_changed` and after every reconnection.
  //
  // Errors:
  //   - `not_found`: the combat is not in this campaign's open session, or
  //     the caller is not a member.
  rpc ListCombatLog(ListCombatLogRequest) returns (ListCombatLogResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // GetCombatHighlights tells how the party did in a combat that ended: "Destaques
  // do combate" (MR-032, D8). Per player's character that fought it counts the
  // damage dealt to NPCs, the healing done, the damage taken, the final blows
  // and the critical hits, and names the winner of each category (Mais dano
  // causado, Mais cura, Tanque, Golpe final, Acertos críticos). Ties name
  // everyone tied; a category where everybody has 0 is left out.
  //
  // The numbers are what really changed (applied hit points): damage past 0
  // hit points does not count, nor does damage nobody applied (discarded, or
  // a player's character's still waiting for the master), nor an action the
  // master undid. A defeated NPC's last hit counts as a final blow for who
  // landed it; the master's own hand on an NPC's hit points (AdjustCombatantHitPoints)
  // counts for nobody.
  //
  // What each one gets (RN-20): no NPC is ever named, and damage to an NPC the
  // master still hides counts as a number like any other. Every member gets
  // the categories with their winners and numbers. `characters`, the table
  // with every number of each character, is the master's; a player gets of it
  // only the row of their own character, zeros included ("Seu resultado"),
  // never anyone else's.
  //
  // Any member may call it, after the combat ended; the app reads it after
  // `encounter_changed` shows the combat ended. The combat must be in the
  // campaign's open session, as for ListCombatLog.
  //
  // Errors:
  //   - `not_found`: the combat is not in this campaign's open session, or the
  //     caller is not a member.
  //   - `failed_precondition`: the combat is not ended (EncounterBlocked,
  //     NOT_ENDED); or no open session.
  rpc GetCombatHighlights(GetCombatHighlightsRequest) returns (GetCombatHighlightsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RequestRollMode asks the master for a better mode than the one the server
  // suggested for an attack (SRD 5.1, "Advantage and Disadvantage": the master
  // decides what circumstances do to a roll). A player may roll the suggested mode,
  // or disadvantage, with no one's leave (RollAttack.roll_mode with a reason); advantage
  // the server did not suggest, or normal where it suggested disadvantage, needs the
  // master: this creates the request the master sees in his queue (Encounter.
  // roll_mode_requests), and the attack waits for the answer. The player rolls it
  // with RollAttack.roll_mode_request_id once it is ANSWERED. A second request of the
  // same combatant replaces the first. The master does not use it: he sets any mode on
  // the roll itself.
  //
  // Errors:
  //   - `not_found`: the combat, the attacker or the target is not in this campaign's
  //     open session, or the caller is a player and may not see it.
  //   - `permission_denied`: the caller is a player and the attacker is not their
  //     character, or the caller is the master (he sets the mode on the roll).
  //   - `invalid_argument`: the reason is not 1 to 120 characters on one line, the mode
  //     is unspecified, the attack is not one of the attacker's, or the mode asked for
  //     is not better than the suggestion (then no request is needed).
  //   - `failed_precondition` (EncounterBlocked): NOT_ACTIVE, NOT_YOUR_TURN.
  rpc RequestRollMode(RequestRollModeRequest) returns (RequestRollModeResponse);

  // AnswerRollModeRequest is the master's answer to a request for a better mode:
  // he decides the mode the attack rolls with, advantage if he approves, the
  // suggested one if he refuses, or any other. Only the master. The answer is idempotent
  // for the same mode and a different one on an answered request is
  // `failed_precondition` (ROLL_MODE_REQUEST_CLOSED).
  //
  // Errors:
  //   - `not_found`: no such request in the combat.
  //   - `permission_denied`: the caller is not the master.
  //   - `invalid_argument`: the mode is unspecified.
  //   - `failed_precondition` (EncounterBlocked): ROLL_MODE_REQUEST_CLOSED.
  rpc AnswerRollModeRequest(AnswerRollModeRequestRequest) returns (AnswerRollModeRequestResponse);

  // CancelRollModeRequest takes a request back: the player's own, or any, for the
  // master. The attack rolls with the suggested mode afterwards.
  rpc CancelRollModeRequest(CancelRollModeRequestRequest) returns (CancelRollModeRequestResponse);

  // RemoveDamagePart takes an extra out of a damage that was rolled, with a reason
  // (1 to 120 characters): the master's correction, when an extra does not hold
  // (Sneak Attack without an ally near the target in a combat with no map). The total
  // drops by that part; for an NPC that already took the damage the difference is given
  // back, up to its maximum. It cannot be undone: the damage would have to be rolled
  // again. Only the master, only for an extra (never the weapon or an automatic line),
  // and only while the damage is ROLLED or APPLIED.
  //
  // Errors:
  //   - `not_found`: no such pending damage or part.
  //   - `permission_denied`: the caller is not the master.
  //   - `invalid_argument`: the reason is not 1 to 120 characters on one line.
  //   - `failed_precondition` (EncounterBlocked): DAMAGE_NOT_ROLLED, DAMAGE_PART_NOT_REMOVABLE.
  rpc RemoveDamagePart(RemoveDamagePartRequest) returns (RemoveDamagePartResponse);

  // AnswerRageEnd answers the question EndTurn asks a raging barbarian whose turn
  // ends without an attack on a hostile creature and without damage taken (SRD 5.1,
  // Barbarian, Rage): end_rage true lets the rage end and ends the turn; false drops
  // the question and the turn goes on (the player attacks). The barbarian's player or
  // the master.
  //
  // Errors:
  //   - `not_found`, `permission_denied`: as EndTurn.
  //   - `failed_precondition` (EncounterBlocked): RAGE_END_NOT_PENDING.
  rpc AnswerRageEnd(AnswerRageEndRequest) returns (AnswerRageEndResponse);

  // EndRage ends a rage with a bonus action on the barbarian's own turn (SRD 5.1,
  // Barbarian, Rage). The barbarian's player or the master.
  //
  // Errors:
  //   - `not_found`, `permission_denied`: as TakeAction.
  //   - `failed_precondition` (EncounterBlocked): NOT_YOUR_TURN, BONUS_ACTION_USED,
  //     NOT_RAGING.
  rpc EndRage(EndRageRequest) returns (EndRageResponse);

  // UseHitRider answers a monk's offer after a hit (Encounter.hit_riders): the Open Hand
  // technique on a Flurry of Blows hit (knock prone, push, or no reactions) or Stunning
  // Strike (1 ki point) on a melee hit. The server rolls the target's saving throw against
  // the ki save DC (for an NPC and a player's character alike, as a spell's save), applies
  // what a failure does and writes the line. The monk's player or the master.
  //
  // Errors:
  //   - `not_found`, `permission_denied`: as TakeAction.
  //   - `failed_precondition`: the offer was already answered, or its round is over; or,
  //     for Stunning Strike, there is no ki point left.
  //   - `invalid_argument`: the choice is not one the offer has.
  rpc UseHitRider(UseHitRiderRequest) returns (UseHitRiderResponse);

  // UseCreatureAction has the master use one action of an NPC's stat block that is no attack roll,
  // from the NPC's turn (SRD 5.1, Monsters): a breath weapon or any other action that asks a saving
  // throw ("Fire Breath", "Enslave", "Frightful Presence"), or an action with no roll at all (the
  // table's reminder). The server rolls each target's saving throw against the action's DC, as a
  // spell's save, opens the damage the save governs as pending damage (half for a target that saves
  // when the action says so; roll them with RollDamage) and gives the condition to a target that
  // fails. An action with no roll spends the action and writes the line, nothing else. The action
  // is spent, as a spell's is. The master alone: the stat block's numbers never reach a player,
  // who reads the save they made and the damage they take (RN-20).
  //
  // On a map, an action with an area (a cone, a line, a sphere) is placed with `origin` or
  // `direction` as CastSpell places a spell, and the server takes who is inside; without a map the
  // master names the `target_ids`. An action with no area takes the `target_ids` it lists.
  //
  // Errors:
  //   - `not_found`, `permission_denied`: as TakeAction. A player gets `permission_denied`.
  //   - `invalid_argument`: no action key, a target repeated or too many, or an area chosen for an
  //     action that has none (or none for one that needs it).
  //   - `failed_precondition` (EncounterBlocked): NOT_YOUR_TURN, ACTION_USED, INCAPACITATED,
  //     TARGET_DEFEATED, and CREATURE_ACTION_UNAVAILABLE (the combatant is no NPC, its stat block
  //     has no such action, or the action is an attack roll or a Multiattack: those are made with
  //     TakeAction).
  rpc UseCreatureAction(UseCreatureActionRequest) returns (UseCreatureActionResponse);
}

// EncounterMode is how a combat is played (RN-25, ADR-0017): chosen when it
// starts, never changed.
enum EncounterMode {
  ENCOUNTER_MODE_UNSPECIFIED = 0;
  // On a map with a grid: positions, reach, range, cover from the map, the fog,
  // the traps and the doors all count. What every combat was before RN-25.
  ENCOUNTER_MODE_GRID = 1;
  // Without a map, the "teatro da mente": no combatant has a square, the server
  // never checks reach, range or distance (the master judges), movement is spent
  // by number (SpendMovement), the opportunity attack is offered by the master
  // (OfferOpportunity), cover is what the master marks (SetCombatantCover), and
  // there is no fog, no trap and no placement of summoned creatures. Everything
  // else works the same: initiative, turns, actions, attacks, spells, damage,
  // reactions, conditions, death saves, the log, the undo and the XP.
  ENCOUNTER_MODE_THEATRE = 2;
}

// EncounterStatus is where a combat is.
enum EncounterStatus {
  ENCOUNTER_STATUS_UNSPECIFIED = 0;
  // Choosing who fights and rolling initiative.
  ENCOUNTER_STATUS_SETUP = 1;
  // The turns are running.
  ENCOUNTER_STATUS_ACTIVE = 2;
  // Over.
  ENCOUNTER_STATUS_ENDED = 3;
}

// CombatantKind is whose combatant it is.
enum CombatantKind {
  COMBATANT_KIND_UNSPECIFIED = 0;
  // A player's character.
  COMBATANT_KIND_PLAYER = 1;
  // A copy of an NPC.
  COMBATANT_KIND_NPC = 2;
  // One of a character's creatures (MR-037): a familiar, summoned
  // animals or undead, a creature the master gave. It belongs to a player's
  // character (`owner_character_id`), is controlled by that character's player
  // and by the master, fights on the party's side and keeps its hit points on
  // the combatant, like an NPC. Its hit points are numbers only to its owner's
  // player and the master; everyone else gets the state word. It never has
  // `mine` set: that is only for the caller's own character
  // (`controlled_by_me` covers both).
  COMBATANT_KIND_CREATURE = 3;
}

// CreatureAttack is what a creature may do on its own turn, from the spell
// that brought it (rules.SummonAttack*).
enum CreatureAttack {
  CREATURE_ATTACK_UNSPECIFIED = 0;
  // It can't take the Attack action (a familiar); it moves and takes the
  // other standard actions.
  CREATURE_ATTACK_NONE = 1;
  // It attacks only with its reaction (the familiar of a warlock with the Pact
  // of the Chain).
  CREATURE_ATTACK_REACTION = 2;
  // It acts as any creature.
  CREATURE_ATTACK_FULL = 3;
}

// CombatantSide is who a combatant fights for (Q69). It decides who is hostile
// to whom when moving through a crowd: a hostile creature's square cannot be
// passed (unless two sizes apart) and leaving its reach provokes an opportunity
// attack; a friendly one's can be passed, at the cost of difficult terrain.
enum CombatantSide {
  COMBATANT_SIDE_UNSPECIFIED = 0;
  // The party: the players' characters and, later, their creatures. An NPC the
  // master marks "Aliado" is here too.
  COMBATANT_SIDE_PARTY = 1;
  // The enemies: the NPCs, unless the master marks one "Aliado".
  COMBATANT_SIDE_ENEMY = 2;
}

// CoverDegree is how much a combatant is covered against an attack (SRD 5.1,
// D4): half gives +2 to armor class and Dexterity saves, three-quarters +5, and
// a target with total cover cannot be targeted by an attack or a single-target
// spell. UNSPECIFIED is "not worked out" (for example a combatant with no
// square): read it as NONE.
enum CoverDegree {
  COVER_DEGREE_UNSPECIFIED = 0;
  COVER_DEGREE_NONE = 1;
  COVER_DEGREE_HALF = 2;
  COVER_DEGREE_THREE_QUARTERS = 3;
  COVER_DEGREE_TOTAL = 4;
}

// CoverSource says where a cover comes from, for the target list ("Meia
// cobertura, do mapa" / "marcada pelo mestre").
enum CoverSource {
  COVER_SOURCE_UNSPECIFIED = 0;
  // The map: a painted cover square or a creature on the line, or a wall.
  COVER_SOURCE_MAP = 1;
  // The master's manual mark on the target (SetCombatantCover).
  COVER_SOURCE_MARK = 2;
}

// JumpKind is the kind of jump of a move (D3, SRD 5.1).
enum JumpKind {
  // Not a jump: an ordinary move.
  JUMP_KIND_UNSPECIFIED = 0;
  // A long jump to a square.
  JUMP_KIND_LONG = 1;
  // A high jump: the combatant stays on its square.
  JUMP_KIND_HIGH = 2;
}

// MoveRefusal is why a square inside the circle of GetMoveOptions cannot be
// moved to.
enum MoveRefusal {
  MOVE_REFUSAL_UNSPECIFIED = 0;
  // A wall, a column (three-quarters cover) or a squeeze between two of them is
  // on the line, or the square itself is one.
  MOVE_REFUSAL_WALL = 1;
  // An enemy that cannot be passed is on the line.
  MOVE_REFUSAL_ENEMY = 2;
  // Another creature holds the square and the mover cannot share it.
  MOVE_REFUSAL_OCCUPIED = 3;
  // Nothing blocks the line, but it costs more than the movement left (difficult
  // terrain, creatures to pass).
  MOVE_REFUSAL_TOO_COSTLY = 4;
  // The mover drags the creature it holds, and the square behind the path is taken or
  // blocked: there is nowhere to leave it.
  MOVE_REFUSAL_NO_ROOM_TO_DRAG = 20;
}

// CombatantState is how hurt a combatant is, as a word (RN-20): what a
// player sees of an NPC, instead of its hit points, and whether a player's
// character is down.
enum CombatantState {
  COMBATANT_STATE_UNSPECIFIED = 0;
  // Full hit points: "Ileso".
  COMBATANT_STATE_UNHURT = 1;
  // Hurt, with more than half of its hit points: "Ferido".
  COMBATANT_STATE_HURT = 2;
  // Half of its hit points or fewer: "Muito ferido".
  COMBATANT_STATE_BADLY_HURT = 3;
  // Out of the fight: "Derrotado".
  COMBATANT_STATE_DEFEATED = 4;
  // A player's character at 0 hit points that is still making death saves:
  // "Caído". It is not the prone condition ("condition:prone"),
  // which the master marks as a label. The word is for everyone who sees the
  // combatant, never its numbers.
  COMBATANT_STATE_DOWN = 5;
  // A player's character at 0 hit points with three death save failures, waiting
  // for the master to confirm the death: "Morrendo". Only the master gets it; a
  // player gets DOWN (whatever the table's rule about the death saves, the app
  // never claims a death before the master confirms it).
  COMBATANT_STATE_DYING = 6;
  // A player's character at 0 hit points with three death save successes:
  // "Estável". Everyone who sees the combatant gets it, also when the table hides
  // the death saves (RN-24): that the character is stable is a result, not the road
  // to it.
  COMBATANT_STATE_STABLE = 7;
  // A player's character whose death the master confirmed (ConfirmDeath):
  // "Morto". It stays in the list, out of the order.
  COMBATANT_STATE_DEAD = 8;
}

// EncounterBlockedReason says why CombatService refused a call with
// `failed_precondition` (besides GameSessionBlocked's NO_OPEN_SESSION).
enum EncounterBlockedReason {
  ENCOUNTER_BLOCKED_REASON_UNSPECIFIED = 0;
  // StartEncounter: the session already has a combat that is not ended.
  ENCOUNTER_BLOCKED_REASON_ENCOUNTER_ALREADY_OPEN = 1;
  // StartEncounter: the session has no current map to fight on.
  ENCOUNTER_BLOCKED_REASON_NO_CURRENT_MAP = 2;
  // StartEncounter: the map has no grid. map_id names it.
  ENCOUNTER_BLOCKED_REASON_MAP_HAS_NO_GRID = 3;
  // The call needs a combat in SETUP.
  ENCOUNTER_BLOCKED_REASON_NOT_IN_SETUP = 4;
  // The call needs an ACTIVE combat.
  ENCOUNTER_BLOCKED_REASON_NOT_ACTIVE = 5;
  // The combat is ended and cannot change.
  ENCOUNTER_BLOCKED_REASON_ENCOUNTER_ENDED = 6;
  // BeginCombat: some combatants have no initiative yet. combatant_ids names
  // them.
  ENCOUNTER_BLOCKED_REASON_INITIATIVE_MISSING = 7;
  // SubmitInitiative: the player's initiative is already set.
  ENCOUNTER_BLOCKED_REASON_INITIATIVE_ALREADY_SET = 8;
  // SubmitInitiative, RollAttack, RollDamage: the master forced the other way
  // of rolling (RN-18): the app's roll when everybody rolls their own dice, a
  // typed value when everybody rolls in the app.
  ENCOUNTER_BLOCKED_REASON_WRONG_DICE_MODE = 9;
  // MoveCombatant: it is not the combatant's turn.
  ENCOUNTER_BLOCKED_REASON_NOT_YOUR_TURN = 10;
  // MoveCombatant: the combatant has no square on the grid yet.
  ENCOUNTER_BLOCKED_REASON_NOT_PLACED = 11;
  // MoveCombatant: the square is farther than the movement left. missing_ft
  // says by how much.
  ENCOUNTER_BLOCKED_REASON_TOO_FAR = 12;
  // MoveCombatant: another combatant stands on the square.
  ENCOUNTER_BLOCKED_REASON_SQUARE_OCCUPIED = 13;
  // RemoveCombatant: a player's combatant cannot leave an ACTIVE combat.
  ENCOUNTER_BLOCKED_REASON_PLAYER_IN_COMBAT = 14;
  // RollAttack, TakeAction: the action of this turn is already used.
  ENCOUNTER_BLOCKED_REASON_ACTION_USED = 15;
  // RollAttack: the target is beyond the attack's range. missing_ft says by
  // how much.
  ENCOUNTER_BLOCKED_REASON_TARGET_OUT_OF_REACH = 16;
  // RollAttack: the target is defeated.
  ENCOUNTER_BLOCKED_REASON_TARGET_DEFEATED = 17;
  // EndTurn: a damage still waits to be rolled or applied. Only the master
  // may pass the turn anyway (discard_pending_damage).
  ENCOUNTER_BLOCKED_REASON_PENDING_DAMAGE = 18;
  // RollDamage: the damage was rolled already.
  ENCOUNTER_BLOCKED_REASON_DAMAGE_ALREADY_ROLLED = 19;
  // ApplyPendingDamage: the damage was not rolled yet.
  ENCOUNTER_BLOCKED_REASON_DAMAGE_NOT_ROLLED = 20;
  // RollDamage, ApplyPendingDamage, DiscardPendingDamage: the damage was
  // applied or discarded already.
  ENCOUNTER_BLOCKED_REASON_DAMAGE_RESOLVED = 21;
  // UndoLastAction: the last change of the session is not an action that can
  // be undone, or there is none.
  ENCOUNTER_BLOCKED_REASON_NOTHING_TO_UNDO = 22;
  // RollAttack, TakeAction: a player's character at 0 hit points does not
  // act (the death saves come with the next slice).
  ENCOUNTER_BLOCKED_REASON_COMBATANT_DOWN = 23;
  // RollDamage, ApplyPendingDamage: the hit still waits for the target's reaction
  // (UseReaction or DeclineReaction; the master may also discard it).
  ENCOUNTER_BLOCKED_REASON_REACTION_PENDING = 24;
  // CastSpell, UseReaction: no free slot of that level or above. min_level says
  // the lowest level that would do.
  ENCOUNTER_BLOCKED_REASON_NO_SLOT = 25;
  // CastSpell, TakeAction: the bonus action of this turn is already used.
  ENCOUNTER_BLOCKED_REASON_BONUS_ACTION_USED = 26;
  // UseReaction, RollAttack (as_reaction), TakeAction: the reaction is already
  // used (it comes back at the start of the combatant's turn).
  ENCOUNTER_BLOCKED_REASON_REACTION_USED = 27;
  // RollAttack: the Attack action made all its attacks (Extra Attack).
  ENCOUNTER_BLOCKED_REASON_ATTACKS_USED = 28;
  // EndTurn: the combatant's death save is due; roll it first. The master may
  // pass the turn anyway.
  ENCOUNTER_BLOCKED_REASON_DEATH_SAVE_DUE = 29;
  // RollDeathSave: the combatant has no death save to roll now.
  ENCOUNTER_BLOCKED_REASON_DEATH_SAVE_NOT_DUE = 30;
  // ConfirmDeath: the character has not failed three death saves, or its death
  // was confirmed already.
  ENCOUNTER_BLOCKED_REASON_NOT_DYING = 31;
  // UseReaction, DeclineReaction: the pending damage does not wait for a
  // reaction.
  ENCOUNTER_BLOCKED_REASON_NOT_AWAITING_REACTION = 32;
  // TakeAction: the feature's uses are spent. recharge says when they come back.
  ENCOUNTER_BLOCKED_REASON_NO_USES = 33;
  // GetCombatHighlights: the combat has not ended.
  ENCOUNTER_BLOCKED_REASON_NOT_ENDED = 34;
  // MoveCombatant: a wall, a three-quarters cover square (a column) or a squeeze
  // between two of them is on the straight line. The player moves in parts.
  ENCOUNTER_BLOCKED_REASON_MOVE_BLOCKED = 35;
  // MoveCombatant: an enemy that cannot be passed stands on the line (only a
  // creature two sizes apart can be passed).
  ENCOUNTER_BLOCKED_REASON_ENEMY_IN_THE_WAY = 36;
  // RollAttack, CastSpell: the target has total cover against the attacker, from
  // a wall on the line or the master's mark, so it cannot be targeted.
  ENCOUNTER_BLOCKED_REASON_TARGET_COVER_TOTAL = 37;
  // CastSpell, CastSummon: the spell takes longer than the place it is cast
  // allows ("Leva 1 hora: conjure fora do combate"). In a combat only a spell
  // that takes an action, a bonus action or a reaction is cast.
  ENCOUNTER_BLOCKED_REASON_CASTING_TIME_TOO_LONG = 40;
  // CastSpell, CastSummon: the option or the creatures chosen are not what the
  // spell allows with this slot and this character (wrong number, a creature
  // of another type or above the challenge rating, a form the character does
  // not have).
  ENCOUNTER_BLOCKED_REASON_SUMMON_CHOICE_INVALID = 41;
  // CastSpell: a summoning spell cast in a combat needs the group's initiative
  // roll (roll_in_app or d20_face).
  ENCOUNTER_BLOCKED_REASON_SUMMON_NEEDS_INITIATIVE = 42;
  // RollAttack: the creature may not take the Attack action (a familiar), or
  // may attack only with its reaction.
  ENCOUNTER_BLOCKED_REASON_CREATURE_CANNOT_ATTACK = 43;
  // CastSummon: the caster is a combatant of a combat that is not ended: the
  // spell is cast there, with CastSpell.
  ENCOUNTER_BLOCKED_REASON_SUMMON_IN_COMBAT = 44;
  // CastSpell: the combat has no room for the creatures a summoning spell
  // brings (a combat holds 40 combatants). Nothing is spent. ("Não cabem mais
  // combatentes neste combate".)
  ENCOUNTER_BLOCKED_REASON_TOO_MANY_COMBATANTS = 45;
  // MoveCombatant, RollAttack, TakeAction, CastSpell, EndTurn: the turn waits
  // for an opportunity attack. For a player, an offer on the combatant (or on a
  // member of the same player's turn group) is not answered yet, or the attack
  // an answered offer made still has its damage to roll, apply or discard
  // ("Esperando a reação do mestre"). The master never gets it. The screen reads
  // Encounter.opportunity_offers to say who it waits for. (RollAttack with
  // `opportunity_offer_id` refuses a used reaction with REACTION_USED, and a
  // defeated or down reactor with the usual reasons.)
  ENCOUNTER_BLOCKED_REASON_OPPORTUNITY_PENDING = 46;
  // MoveCombatant, RollAttack, TakeAction, CastSpell, EndTurn: the turn waits for
  // the master to answer a question (Encounter.pending_hidden_reveals), and the
  // master's own EndTurn waits too. The turn is held for everyone alike, so a
  // player's screen says only "Esperando o mestre" (Encounter.turn_held) and
  // nothing in the answer says why: the reason is the same as a wait for an
  // opportunity attack to the player's eyes, and the master reads the question.
  ENCOUNTER_BLOCKED_REASON_HIDDEN_REVEAL_PENDING = 47;
  // The traps (MR-035, PlayService.SearchForTraps and FireTrap). The first three
  // are 9.8's; 53 and 54 are free.
  //
  // SearchForTraps: the caller's character has no square on the map of the
  // session's current map (or of its combat), or the map has no grid.
  ENCOUNTER_BLOCKED_REASON_TRAP_NOT_ON_MAP = 50;
  // FireTrap: the trap is not armed (it fired already, or it is disarmed). The
  // master arms it again with UpdateMapPoint.
  ENCOUNTER_BLOCKED_REASON_TRAP_NOT_ARMED = 51;
  // SearchForTraps: the character is a combatant in a combat that is not active
  // yet or already ended; searching during a fight is for the character's own turn.
  ENCOUNTER_BLOCKED_REASON_TRAP_SEARCH_NOT_NOW = 52;
  // SearchForTraps with Perception on a typed die: a square the character sees within
  // 3 m is lightly obscured (dim light, or darkness seen through darkvision), so the
  // roll has disadvantage and needs a second die (`d20_face_2`). The screen knows from
  // GetMapVision.
  ENCOUNTER_BLOCKED_REASON_SEARCH_NEEDS_TWO_DICE = 53;
  // AssumeWildShape: the beast is not one the character's Wild Shape allows (its
  // level, the fly and swim limits, a creature that is not a beast), or the
  // character has no Wild Shape (MR-037).
  ENCOUNTER_BLOCKED_REASON_WILD_SHAPE_BEAST_NOT_ALLOWED = 55;
  // AssumeWildShape: the character is in a beast form already.
  ENCOUNTER_BLOCKED_REASON_ALREADY_IN_WILD_SHAPE = 56;
  // LeaveWildShape: the character is in its own shape.
  ENCOUNTER_BLOCKED_REASON_NOT_IN_WILD_SHAPE = 57;
  // CastSpell, CastSummon: a druid in a beast form cannot cast spells. Nothing is
  // spent.
  ENCOUNTER_BLOCKED_REASON_WILD_SHAPE_NO_SPELLS = 58;
  // StartFamiliarSight, StopFamiliarSight: see `familiar_sight_reason`.
  ENCOUNTER_BLOCKED_REASON_FAMILIAR_SIGHT_BLOCKED = 59;
  // MoveCombatant: the first square of the move is a locked door (RN-26), so the
  // combatant cannot take a step: "A porta está trancada." Nothing is spent. A
  // move that gets some squares before the locked door is no refusal: it ends
  // before the door (MoveCombatantResponse.locked_door).
  ENCOUNTER_BLOCKED_REASON_DOOR_LOCKED = 60;
  // SpendMovement, OfferOpportunity: the combat is a GRID one, where movement is
  // a move on the map and the server finds the opportunity attacks itself. Both
  // are for a THEATRE combat (RN-25).
  ENCOUNTER_BLOCKED_REASON_THEATRE_ONLY = 61;
  // MoveCombatant (a move, a jump, a placement), FireTrap, SearchForTraps and
  // what else needs squares: the combat is a THEATRE one (RN-25), which has no
  // map, no positions, no traps and no placement. "Sem mapa, isso não existe."
  ENCOUNTER_BLOCKED_REASON_NEEDS_A_MAP = 62;
  // StartEncounter: a THEATRE combat takes no map point (it needs no map).
  ENCOUNTER_BLOCKED_REASON_THEATRE_HAS_NO_MAP = 63;
  // OfferOpportunity: the opportunity attack cannot be offered now: the reactor
  // cannot make it (defeated, down, incapacitated, blinded, no melee attack) or is
  // on the mover's side, the mover is defeated, hidden or took the Disengage
  // action, or the same offer already waits. (The reactor's reaction being used is
  // REACTION_USED.)
  ENCOUNTER_BLOCKED_REASON_NO_OPPORTUNITY = 64;
  // TakeAction: a feature that can be used once per turn (Action Surge) was
  // already used in this turn. The master may use it again (he corrects the
  // economy).
  ENCOUNTER_BLOCKED_REASON_ALREADY_USED_THIS_TURN = 65;
  // CastSpell: the caster cast a spell with a bonus action this turn, or this
  // spell is cast with a bonus action and another spell was cast: the turn allows
  // nothing more than a cantrip with a casting time of 1 action. The master may
  // cast it anyway (they correct the economy).
  ENCOUNTER_BLOCKED_REASON_BONUS_ACTION_SPELL_LIMIT = 66;
  // TakeAction (Flurry of Blows): it comes right after the Attack action, taken
  // with a weapon or an unarmed strike, and that action has not been taken yet
  // this turn. GetTurnOptions says it before, as ATTACK_ACTION_FIRST.
  ENCOUNTER_BLOCKED_REASON_ATTACK_ACTION_FIRST = 67;
  // MoveCombatant: the master asked for a square that is a wall. Nobody stands in
  // a wall, and a creature in one is seen by no player.
  ENCOUNTER_BLOCKED_REASON_WALL_ON_SQUARE = 68;
  // CastSpell, TakeAction: a healing aimed at a character that died, or that has
  // failed three death saves. A dead creature regains no hit points (SRD 5.1,
  // "Dropping to 0 Hit Points"), so nothing is spent.
  ENCOUNTER_BLOCKED_REASON_TARGET_DEAD = 69;
  // MoveCombatant with `place`: the map has no free square a creature can stand
  // on, so the server found none to place the combatant on.
  ENCOUNTER_BLOCKED_REASON_NO_FREE_SQUARE = 70;
  // MoveCombatant, RollAttack, CastSpell, TakeAction, EndTurn: a damage to a
  // concentrating combatant waits for its Constitution save (a reaction window of
  // kind CONCENTRATION_SAVE is open). The screen reads Encounter.reaction_wait.
  // (REACTION_PENDING, 24, is the same wait for any other reaction window.)
  ENCOUNTER_BLOCKED_REASON_CONCENTRATION_SAVE_PENDING = 71;
  // AnswerReaction, ResolveConcentrationSave: the window is not the first one
  // open for its reactor in the order (a window waits for the ones before it), or
  // it was answered or closed already.
  ENCOUNTER_BLOCKED_REASON_NOT_YOUR_TURN_TO_ANSWER = 72;
  // AnswerReaction: the answer needs a roll (Counterspell's check, Cutting Words'
  // die, Deflect Missiles' die, a saving throw) and none came.
  ENCOUNTER_BLOCKED_REASON_REACTION_NEEDS_ROLL = 73;
  // RollAttack: the player asked for a mode better than the suggestion (advantage
  // the server did not suggest) and the master has not approved it. RequestRollMode
  // asks him.
  ENCOUNTER_BLOCKED_REASON_ROLL_MODE_NEEDS_APPROVAL = 74;
  // RollAttack with roll_mode_request_id: the request still waits for the master.
  ENCOUNTER_BLOCKED_REASON_ROLL_MODE_REQUEST_PENDING = 75;
  // AnswerRollModeRequest, RollAttack with roll_mode_request_id: the request is
  // answered, taken back or used already.
  ENCOUNTER_BLOCKED_REASON_ROLL_MODE_REQUEST_CLOSED = 76;
  // EndTurn: the barbarian is raging and the turn ends with no attack on a hostile
  // creature and no damage taken since its last turn, so the rage would end: the
  // player is asked (AnswerRageEnd) before the turn passes.
  ENCOUNTER_BLOCKED_REASON_RAGE_END_PENDING = 77;
  // AnswerRageEnd: no question waits.
  ENCOUNTER_BLOCKED_REASON_RAGE_END_NOT_PENDING = 78;
  // CastSpell: a raging character casts no spell and keeps no concentration (SRD 5.1,
  // Barbarian, Rage).
  ENCOUNTER_BLOCKED_REASON_RAGING_CANNOT_CAST = 79;
  // EndRage: the combatant is not raging.
  ENCOUNTER_BLOCKED_REASON_NOT_RAGING = 80;
  // RollDamage: a marked extra does not hold (its condition fails, or its slot is not
  // free). The attack's sheet reads the reason from PendingDamage.parts.
  ENCOUNTER_BLOCKED_REASON_EXTRA_NOT_AVAILABLE = 81;
  // RemoveDamagePart: the part is the weapon's or an automatic line, which cannot be
  // taken out, or it was taken out already.
  ENCOUNTER_BLOCKED_REASON_DAMAGE_PART_NOT_REMOVABLE = 82;
  // TakeAction (Reckless Attack): it is declared with the first attack of the turn,
  // and an attack was made.
  ENCOUNTER_BLOCKED_REASON_RECKLESS_TOO_LATE = 83;
  // StartEncounter: a participant is a reserved character (imported, not claimed by a
  // player yet), which cannot fight until someone owns it.
  ENCOUNTER_BLOCKED_REASON_CHARACTER_RESERVED = 84;
  // The combatant cannot act now because of an effect or a condition (RN-22): it is
  // incapacitated (Paralisado, Atordoado, Inconsciente, Petrificado, Incapacitado) or the
  // lethargy of a Velocidade holds it. The message never names the cause to a player.
  ENCOUNTER_BLOCKED_REASON_CANNOT_ACT = 100;
  // The extra action an effect gives (Velocidade) is not there, or was spent.
  ENCOUNTER_BLOCKED_REASON_EXTRA_ACTION_UNAVAILABLE = 101;
  // StandUp: the combatant is not Prone.
  ENCOUNTER_BLOCKED_REASON_NOT_PRONE = 102;
  // StandUp: the combatant's speed is 0 (SRD 5.1, "Being Prone"), so it cannot stand up
  // whatever the cost: Grappled, Restrained, the lethargy of a Velocidade, and the like.
  ENCOUNTER_BLOCKED_REASON_CANNOT_STAND_UP = 103;
  // TakeAction (Fúria, with `frenzy`): the combatant has no Frenzy, which is the level 3
  // feature of the Path of the Berserker (SRD 5.1, Barbarian). Any other barbarian, and
  // anyone else, rages without it.
  ENCOUNTER_BLOCKED_REASON_FRENZY_UNAVAILABLE = 104;
  // A table maneuver that starts a grapple after a hit: the character made no melee
  // weapon hit this turn.
  ENCOUNTER_BLOCKED_REASON_NO_MELEE_HIT = 105;
  // CastSpell (a teleport with `destination`): the square is farther than the spell
  // reaches.
  ENCOUNTER_BLOCKED_REASON_TELEPORT_TOO_FAR = 106;
  // CastSpell (a teleport with `destination`), for a player: the square cannot be used.
  // It may be out of the caster's sight, a wall or taken by a creature; the answer
  // never says which, so it cannot name a creature the player does not see (RN-10).
  ENCOUNTER_BLOCKED_REASON_DESTINATION_UNAVAILABLE = 107;
  // CastSpell (a teleport on a map with a grid), for a player's character: the cast came
  // without `destination`. The player picks the square; only the master may leave it out.
  ENCOUNTER_BLOCKED_REASON_DESTINATION_REQUIRED = 108;
  // Preserve Life (TakeActionRequest.preserve_life): a creature that is not in the combat, is more than
  // 30 ft from the cleric, or is an undead or a construct.
  ENCOUNTER_BLOCKED_REASON_CHANNEL_DIVINITY_TARGET = 109;
  // Preserve Life: the hit points asked add up to more than five times the cleric's level.
  ENCOUNTER_BLOCKED_REASON_CHANNEL_DIVINITY_TOO_MUCH = 110;
  // CastSpell, CastSummon, RollAttack (a spell attack): the character wears armor or a
  // shield it is not proficient with, and cannot cast spells (SRD 5.1, "Armor"). Nothing
  // is spent.
  ENCOUNTER_BLOCKED_REASON_ARMOR_NOT_PROFICIENT = 111;
  // AnswerReaction: the window was answered already, by the player or by the master (the first answer wins).
  ENCOUNTER_BLOCKED_REASON_REACTION_ALREADY_ANSWERED = 112;
  // UseCreatureAction: the combatant is no NPC, its stat block has no such action, or the action is
  // an attack roll or a Multiattack (those are made with TakeAction). Nothing is spent.
  ENCOUNTER_BLOCKED_REASON_CREATURE_ACTION_UNAVAILABLE = 113;
  // TakeAction: the action starts a temporary state (a table feature's state effect) that is
  // already on for the character. Nothing is spent.
  ENCOUNTER_BLOCKED_REASON_STATE_ALREADY_ON = 114;
  // TakeAction with end_state: the state the action would end is not on. Nothing changes.
  ENCOUNTER_BLOCKED_REASON_STATE_NOT_ON = 115;
}

// FamiliarSightBlockedReason says why "Ver pelos olhos do familiar" was refused
// (EncounterBlocked.familiar_sight_reason).
enum FamiliarSightBlockedReason {
  FAMILIAR_SIGHT_BLOCKED_REASON_UNSPECIFIED = 0;
  // The character has no familiar with it (none was summoned, or it was
  // dismissed).
  FAMILIAR_SIGHT_BLOCKED_REASON_NO_FAMILIAR = 1;
  // The character or the familiar is not on a map with a grid: on the combat's
  // map, or, out of a combat, on the session's current map with their tokens.
  FAMILIAR_SIGHT_BLOCKED_REASON_NOT_ON_MAP = 2;
  // The familiar is more than 30 m (20 squares) from the character.
  FAMILIAR_SIGHT_BLOCKED_REASON_TOO_FAR = 3;
  // StartFamiliarSight: the player is looking through the familiar's eyes
  // already.
  FAMILIAR_SIGHT_BLOCKED_REASON_ALREADY_SEEING = 4;
  // StopFamiliarSight: the player is not looking through the familiar's eyes.
  FAMILIAR_SIGHT_BLOCKED_REASON_NOT_SEEING = 5;
  // StartFamiliarSight: the character is a combatant of a combat that has not begun
  // (in SETUP). The sight is an action of a turn there, and one that was on is ended
  // when the character joins the combat or the combat begins.
  FAMILIAR_SIGHT_BLOCKED_REASON_COMBAT_NOT_BEGUN = 6;
  // StartFamiliarSight: the character is a combatant of a combat without a map
  // (THEATRE mode, RN-25). The familiar's eyes are the map's vision, and there is
  // no map to see through them.
  FAMILIAR_SIGHT_BLOCKED_REASON_NO_MAP = 7;
}

// EncounterBlocked is the error detail of CombatService's
// `failed_precondition`, so the app can show a clear message.
message EncounterBlocked {
  EncounterBlockedReason reason = 1;
  // TOO_FAR, TARGET_OUT_OF_REACH: how many feet the square is beyond the
  // movement left, or the target beyond the range (5 ft is one square, 1.5 m).
  int32 missing_ft = 2;
  // MAP_HAS_NO_GRID: the map that needs a grid (a UUID).
  string map_id = 3;
  // INITIATIVE_MISSING: the combatants that have no initiative (UUIDs).
  repeated string combatant_ids = 4;
  // NO_SLOT: the lowest slot level that would do.
  int32 min_level = 5;
  // NO_USES: when the uses come back.
  meurpg.rules.v1.Recharge recharge = 6;
  // TOO_FAR: how many tenths of a foot the move costs more than the movement
  // left, or the jump is longer than the limit (RN-21: 71 is one diagonal
  // square). `missing_ft` is this rounded up.
  int32 missing_dft = 7;
  // TOO_FAR on a jump: the limit that applied, in tenths of a foot.
  int32 jump_limit_dft = 8;
  // TOO_FAR on a jump: whether the limit was the one with a running start.
  bool jump_running_start = 9;
  // FAMILIAR_SIGHT_BLOCKED: the cause.
  FamiliarSightBlockedReason familiar_sight_reason = 20;
}

// Encounter is a combat as the caller may see it.
message Encounter {
  // Stable encounter ID (a UUID).
  string id = 1;
  // What the master calls it, 1 to 80 characters ("Emboscada na estrada").
  string name = 2;
  EncounterStatus status = 3;
  // The round, counting from 1; 0 in SETUP.
  int32 round = 4;
  // The map the fight is on (a UUID; MapService.GetMap reads it). Empty if
  // the master deleted it meanwhile, and always empty in THEATRE mode.
  string map_id = 5;
  // The BATTLE point the master started it from. Only the master gets it. Always
  // empty in THEATRE mode.
  string map_point_id = 6;
  // The grid the fight uses, copied from the map when it started: squares of
  // 1.5 m (5 ft) across and down. A combatant's square is col 0 to
  // grid_columns - 1 and row 0 to grid_rows - 1, from the top left. Both are 0 in
  // THEATRE mode: there is no grid, and no combatant has a square.
  int32 grid_columns = 7;
  int32 grid_rows = 8;
  // Whose turn it is (a combatant ID): the first member of the group on turn
  // (in the order) that still acts, so a group of one works as it always did.
  // Empty in SETUP, when ENDED, and when nobody acts. For a player it is also
  // empty when every member who acts is hidden from them (then master_turn is
  // true) and when the group on turn is NPCs alone with two or more members
  // they see: no member is picked at random, `turn_group_ids` lists them and
  // the app says "Vez dos Goblins".
  string current_combatant_id = 9;
  // True when everyone who acts in the turn is a combatant the caller may not
  // see: the app shows "Vez do mestre" (or "Falta o mestre" when a visible
  // member already ended). Always false for the master.
  bool master_turn = 10;
  // The combatants the caller sees, in turn order: by initiative, highest
  // first; combatants without an initiative yet come last.
  repeated Combatant combatants = 11;
  // Goes up by one on every change. Of two copies of the same combat, the
  // one with the larger revision is newer. On a map with the fog of war a
  // player gets their own number instead: how many events of the combat they
  // could see, which never goes down and does not go up for what happens out
  // of their sight (so they cannot count moves in the dark).
  int32 revision = 12;
  // When the combat began (BeginCombat). Unset in SETUP.
  google.protobuf.Timestamp started_at = 13;
  // When it ended. Unset until then.
  google.protobuf.Timestamp ended_at = 14;
  // The hits that wait for a reaction (Escudo), for the caller: the master gets
  // all of them, a player only the ones on their own character. Empty when
  // nothing waits. The app opens its prompt from this after each
  // `encounter_changed`.
  repeated ReactionPrompt reaction_prompts = 15;
  // The combatants on turn, in the order: the members of the group whose turn
  // it is, the ones who still act and the ones whose part ended
  // (Combatant.turn_part_ended). Empty in SETUP, when ENDED and when nobody is
  // on turn. A group of one has one id.
  //   - The master gets every member.
  //   - A player gets it only for a group that holds a player's character,
  //     without any member hidden from them, and for a group of NPCs alone
  //     only the members they see: it is how the app says "Vez dos Goblins"
  //     (RN-20: the player gets no total and no box for that group).
  repeated string turn_group_ids = 16;
  // The groups of two or more NPCs that tie on the initiative total and are
  // adjacent in the order, as lists of ids, in the order, without a hidden or
  // defeated one. Only a player gets it, and only so that the app can name a
  // group by its plural ("Depois de você: os Goblins"): it comes with no
  // total, and the app never draws a box for it (RN-20). The master works the
  // groups out from the totals he already has; this is empty for him.
  repeated NpcGroup npc_only_groups = 17;
  // The opportunity offers that wait (MR-034), as the caller may see them: the
  // master all; a player the ones whose reactor they control (to answer) and the
  // ones on a combatant of theirs (the turn waits; the reactor is named only when
  // they see it). Nobody else gets any. Empty when nothing waits. The app opens
  // its prompt from this after each `encounter_changed`.
  repeated OpportunityOffer opportunity_offers = 18;
  // How the combat is played (RN-25): GRID draws the map, THEATRE draws a list
  // (no map, no positions, movement by number). Chosen when the combat started;
  // it never changes, so a screen can trust it for the whole combat. Never
  // UNSPECIFIED.
  EncounterMode mode = 19;
  // The reaction windows that are open, in the order they are answered (the
  // reactors' initiative order), as the caller may see them: the master all; a
  // player only the ones they answer (`for_you`). Nobody gets a window they do not
  // answer: what the others read is `reaction_wait`. Empty when nothing waits. The
  // app opens its prompt from this after each `encounter_changed`. The window
  // lives on the server: a reload gives it back.
  repeated ReactionWindow reaction_windows = 22;
  // What the combat waits for, as the caller may read it (PM-04a): unset when
  // nothing waits. It says "Esperando o mestre" for a reactor that is an NPC or
  // that the caller does not see, and "Esperando a reação de Sálvia" only for a
  // player's character the caller sees; never which NPC, and never why.
  ReactionWait reaction_wait = 23;
  // True when the turn waits for the master to answer something the caller is not
  // told (the master reads `pending_hidden_reveals`): the app says "Esperando o
  // mestre" and offers no move, attack, action, spell or end of turn. A player
  // gets the same value for any reason the turn waits for the master that is not
  // an opportunity offer (those have their own list), so it says nothing of why.
  bool turn_held = 20;
  // The questions the master has still to answer, oldest first (a player's area
  // spell hit hidden creatures and the table rule asks): only the master gets
  // them, empty for a player. The app opens its card from this after each
  // `encounter_changed`, also after a reload.
  repeated HiddenRevealQuestion pending_hidden_reveals = 21;
  // The requests for a better mode that wait or were answered and not used yet
  // (RollModeRequest), for the caller: the master all, a player the ones of their own
  // characters. The master's queue opens from this after each `encounter_changed`.
  repeated RollModeRequest roll_mode_requests = 24;
  // The raging barbarian the turn waits for (EndTurn asked whether the rage ends), a
  // combatant ID; empty when nothing waits. Everyone who sees the combatant gets it:
  // the turn reads "Esperando a decisão de Ragna sobre a fúria".
  string rage_pending_combatant_id = 25;
  // The creatures that died in this combat, in the order they died: a player's
  // character the master confirmed dead (ConfirmDeath) and an NPC taken to 0 hit
  // points, until they are revived or the combat ends. The master gets all of them,
  // with the window of Revivify and his switch; a player gets only their own
  // character, with the round and no more; for the others the list does not exist
  // (RN-10, RN-03).
  repeated CombatDeath deaths = 26;
  // The offers of the monk's riders after a hit (UseHitRider): the master gets all of
  // them, a player the ones of their own character. Open until answered or the round ends.
  repeated HitRiderOffer hit_riders = 30;
  // The areas that spells keep on the map (SpellZone), as the caller may see them: the
  // master all of them (the ones of a hidden caster marked MASTER_ONLY), a player only
  // the ones whose caster they see. Empty in THEATRE mode and when no spell keeps one.
  repeated SpellZone zones = 31;
}

// SpellZone is a lingering area a spell keeps on the map for a while (Moonbeam, Spirit
// Guardians, Cloudkill, Web): a creature that enters it for the first time on a turn,
// or starts its turn in it, is hit by what the spell says. The server decides who is
// hit and when; the map only draws the squares.
message SpellZone {
  // Stable ID of the zone (a UUID); MoveSpellZone takes it.
  string id = 1;
  // The spell that keeps it ("spell:moonbeam").
  string spell_key = 2;
  // The spell's name in Portuguese.
  string spell_name_pt = 3;
  // The combatant that cast it (a combatant ID the caller sees; see `visibility`).
  string owner_combatant_id = 4;
  // The shape and size of the area as the spell gives them: sphere, cylinder or cube.
  meurpg.rules.v1.SpellAreaShape shape = 5;
  // The radius of a sphere or a cylinder, the side of a cube, in feet.
  int32 size_ft = 6;
  // The point of origin, a square of the grid.
  SpellOrigin origin = 7;
  // The squares it covers now, after the walls cut it, from the top left of the grid.
  repeated SpellOrigin squares = 8;
  // True when the spell lasts while its caster concentrates.
  bool concentration = 9;
  // The rounds the zone still has, counted to the start of the caster's turn; 0 when
  // no round count applies (it lasts until the concentration ends or it is dismissed).
  int32 rounds_left = 10;
  // How the area moves, if it does.
  SpellZoneMovement movement = 11;
  // Who reads the zone.
  SpellZoneVisibility visibility = 12;
  // The caster's label ("Bartolo"), for "Concentração de Bartolo". Always a combatant the
  // caller sees.
  string owner_label = 13;
  // True when the caller reads no numbers of the zone: a player reading the zone of a
  // caster that is not theirs. The fields from `save_ability` to `moves_per_turn_ft` and
  // `rounds_left` are then empty (RN-10: the DC, the dice and the time of an NPC's spell are
  // the master's).
  bool details_hidden = 14;
  // The saving throw ("wis") and its Portuguese name; empty for a zone with no saving
  // throw (the damage just lands).
  string save_ability = 15;
  string save_ability_name_pt = 16;
  // The DC.
  optional int32 save_dc = 17;
  // The damage at the slot of the cast ("3d8"), its type key and Portuguese name; empty for
  // a zone with no damage (Web).
  string damage_dice = 18;
  string damage_type_key = 19;
  string damage_type_name_pt = 20;
  // True when a passed save halves the damage.
  bool half_on_save = 21;
  // How far the area goes by itself at the start of each of the caster's turns, in feet
  // (Cloudkill 10); 0 for one that stays or is moved by hand.
  int32 moves_per_turn_ft = 22;
  // What else the zone does, as keys: "speed_halved" (a creature that starts its turn in
  // it or comes in moves at half speed that turn), "difficult_terrain" and "restrains".
  repeated string notes = 23;
  // The combatants standing in the area now that the caller sees ("Aqui: Tor, Jabuti").
  repeated string occupant_ids = 24;
}

// SpellZoneMovement says how a zone changes place while it lasts.
enum SpellZoneMovement {
  SPELL_ZONE_MOVEMENT_UNSPECIFIED = 0;
  // It stays where the spell put it.
  SPELL_ZONE_MOVEMENT_FIXED = 1;
  // The caster moves it with an action on later turns (MoveSpellZone; Moonbeam).
  SPELL_ZONE_MOVEMENT_ACTION = 2;
  // It is centered on the caster and goes where the caster goes (Spirit Guardians).
  SPELL_ZONE_MOVEMENT_FOLLOWS_CASTER = 3;
  // It moves by itself at the start of each of the caster's turns (Cloudkill).
  SPELL_ZONE_MOVEMENT_DRIFTS = 4;
}

// SpellZoneVisibility says who reads a zone (RN-10).
enum SpellZoneVisibility {
  SPELL_ZONE_VISIBILITY_UNSPECIFIED = 0;
  // Everyone at the table who sees the caster.
  SPELL_ZONE_VISIBILITY_EVERYONE = 1;
  // The master alone: the caster is hidden from the players. A player never gets such
  // a zone, so this value only reaches the master.
  SPELL_ZONE_VISIBILITY_MASTER_ONLY = 2;
}

// HitRiderKind is which rider a hit offers.
enum HitRiderKind {
  HIT_RIDER_KIND_UNSPECIFIED = 0;
  // Open Hand technique (Monk 3, Way of the Open Hand): on a Flurry of Blows hit.
  HIT_RIDER_KIND_OPEN_HAND = 1;
  // Stunning Strike (Monk 5): on a melee hit, 1 ki point.
  HIT_RIDER_KIND_STUNNING_STRIKE = 2;
  // A rider of a creature's attack: its save with a condition or extra damage, or the condition
  // of a grapple (the attack's plan in the stat block). Offered to the master alone.
  HIT_RIDER_KIND_CREATURE = 3;
}

// HitRiderChoice is what the monk picks.
enum HitRiderChoice {
  HIT_RIDER_CHOICE_UNSPECIFIED = 0;
  // Open Hand: Dexterity save or knocked prone.
  HIT_RIDER_CHOICE_PRONE = 1;
  // Open Hand: Strength save or pushed up to 15 ft (4,5 m). The master places the token.
  HIT_RIDER_CHOICE_PUSH = 2;
  // Open Hand: no reactions until the end of the monk's next turn (no save).
  HIT_RIDER_CHOICE_NO_REACTIONS = 3;
  // Stunning Strike: Constitution save or stunned until the end of the monk's next turn.
  HIT_RIDER_CHOICE_STUN = 4;
  // Declines the offer.
  HIT_RIDER_CHOICE_DECLINE = 5;
  // A creature's rider: apply it (the target's save, then the condition or the extra damage; or the
  // grapple's condition). DECLINE skips it.
  HIT_RIDER_CHOICE_APPLY = 6;
}

// HitRiderOffer is one open offer (Encounter.hit_riders).
message HitRiderOffer {
  string id = 1;
  HitRiderKind kind = 2;
  string attacker_id = 3;
  string target_id = 4;
  // The ki save DC. Only the master and the monk's player get it (RN-20).
  int32 save_dc = 5;
  // Ki points left, for Stunning Strike.
  int32 ki_left = 6;
  // A creature's rider (kind CREATURE; the master alone gets it): the attack's action key
  // ("monster:ghoul#claws") and its name, the condition it gives and the escape DC of a grapple
  // (0 when the rider is a save: `save_dc` is then its DC).
  string action_key = 7;
  string action_name_pt = 8;
  string condition_key = 9;
  string condition_name_pt = 10;
  int32 escape_dc = 11;
}

// UseHitRiderRequest answers an offer.
message UseHitRiderRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string rider_id = 3;
  HitRiderChoice choice = 4;
  string idempotency_key = 5;
}

// UseHitRiderResponse returns the combat.
message UseHitRiderResponse {
  Encounter encounter = 1;
}

// UseCreatureActionRequest has the master use an action of an NPC's stat block that is no attack
// roll (UseCreatureAction).
message UseCreatureActionRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  // The NPC that acts (a UUID): its turn, with its action not spent.
  string combatant_id = 3;
  // The action's key in the stat block, "monster:hell-hound#fire-breath" (the key of its
  // CreatureAction/CreatureSave).
  string action_key = 4;
  // The creatures it affects (UUIDs). Empty for an action with no roll, and for an area on a map
  // (the server takes who is inside).
  repeated string target_ids = 5;
  // The area on a map, as CastSpellRequest chooses it: a point (sphere, cylinder) or a
  // direction (cone, line, cube). Neither for an action centered on the creature.
  oneof area {
    SpellOrigin origin = 6;
    SpellDirection direction = 7;
  }
  string idempotency_key = 8;
}

// CreatureActionTarget is what an action did to one creature it affected.
message CreatureActionTarget {
  string combatant_id = 1;
  // The creature's saving throw. The roll and the result are the master's and the target's own
  // player's; `dc` is the master's alone (a stat block's number never reaches a player).
  SaveResult save = 2;
  // The pending damages the action opened for it (roll them with RollDamage): the first and the
  // others, as SpellTargetResult has them. Only the master.
  string pending_damage_id = 3;
  repeated string more_pending_damage_ids = 4;
  // The condition the action gave it (the failed save's); false when it saved, was immune or the
  // action gives none.
  bool condition_applied = 5;
}

// CreatureActionResult is what an action did.
message CreatureActionResult {
  // Stable ID of the use (a UUID): the cast_id of its pending damages.
  string cast_id = 1;
  string action_key = 2;
  // The action rolls nothing: a logged reminder that spent the action.
  bool reminder = 3;
  // The condition a failed save gives ("condition:frightened") and its Portuguese name; empty for none.
  string condition_key = 4;
  string condition_name_pt = 5;
  // The stat block's words for how long it lasts ("1 minute"), and whether the target repeats
  // the save at the end of its turns: notes for the master, nothing counts the time.
  string duration_text = 6;
  bool repeat_save = 7;
  repeated CreatureActionTarget targets = 8;
  // The pending damages the action opened. Only the master.
  repeated PendingDamage pending_damages = 9;
}

// UseCreatureActionResponse returns the combat and what the action did.
message UseCreatureActionResponse {
  Encounter encounter = 1;
  CreatureActionResult result = 2;
  // An area placed on the map: where it landed. Unset for the others.
  SpellArea area = 3;
}

// CombatLogCreatureAction is the line of a creature's action (CombatLogKind SPELL_CAST with
// `creature_action` set: `spell.targets` has each creature's save and damage). The stat block's
// numbers are not in it for a player.
message CombatLogCreatureAction {
  string action_key = 1;
  string action_name_pt = 2;
  // The action rolls nothing: the table's reminder.
  bool reminder = 3;
  // The condition a failed save gives, and the creatures that got it (UUIDs).
  string condition_key = 4;
  string condition_name_pt = 5;
  repeated string condition_target_ids = 6;
  // How long the stat block says it lasts, and whether the save repeats.
  string duration_text = 7;
  bool repeat_save = 8;
  // The SRD's text of the action, in English. Only the master.
  string text = 9;
}

// HitRiderLogResult is how an answered rider ended.
enum HitRiderLogResult {
  HIT_RIDER_LOG_RESULT_UNSPECIFIED = 0;
  HIT_RIDER_LOG_RESULT_SAVED = 1;
  HIT_RIDER_LOG_RESULT_FAILED = 2;
  // No save (no reactions) or declined.
  HIT_RIDER_LOG_RESULT_APPLIED = 3;
  HIT_RIDER_LOG_RESULT_DECLINED = 4;
}

// CombatLogHitRider is the line of an answered rider (CombatLogKind HIT_RIDER).
message CombatLogHitRider {
  HitRiderChoice choice = 1;
  HitRiderLogResult result = 2;
  // The target's roll and the DC: the master's line, and the target's player's when the target
  // is a player's character. The monk's player reads only the result: an NPC's roll never
  // reaches a player (RN-20).
  int32 d20 = 3;
  int32 save_total = 4;
  int32 dc = 5;
  bool numbers = 6;
  // A failed Strength save pushed the target this many feet away from the monk. 0 when
  // it was not pushed, or could not move (then `push_stopped` says a wall or a creature
  // was in the way).
  int32 pushed_ft = 7;
  // The save was failed but the combat has no map (theatre of the mind), so the push is
  // the table's to imagine.
  bool push_no_map = 8;
  // A creature's rider (UseHitRider on a CREATURE offer): the attack's action key (the master's;
  // a player reads the name), the name, the condition given (set when it was: a grapple, or a
  // failed save; a player reads it only for a target they own or a condition with an outward
  // sign), the grapple's escape DC (the master's), the duration the stat block words ("1
  // minute", or empty) and whether the target repeats the save at the end of its turns. For a
  // creature's rider the DC is the master's alone; the d20 and the save total are the master's and
  // the target's player's, as for a spell's save: the save is the one that player's character makes.
  string action_key = 9;
  string action_name_pt = 10;
  string condition_key = 11;
  string condition_name_pt = 12;
  int32 escape_dc = 13;
  string duration_text = 14;
  bool repeat_save = 15;
  // The damage the rider's save governs (a ghoul's poison), as the viewer gets it: the same message a
  // cast's target carries, AWAITING_ROLL until the damage is rolled, then rolled and applied. The first
  // damage type, then the others in more_damages. Unset when the rider opened none. A player reads it as
  // they read a cast's damage: the amount as rolled unless the target is theirs, never the stat block.
  CombatLogDamage damage = 16;
  repeated CombatLogDamage more_damages = 17;
  // The push of `pushed_ft` ended before its whole distance: a wall, a door, the edge of the
  // grid or another creature stopped it.
  bool push_stopped = 18;
}

// HiddenRevealQuestion is one question the master has to answer: the area spell
// of a player hit hidden creatures, and the table asks whether they appear.
message HiddenRevealQuestion {
  // Stable ID (a UUID): what ResolveHiddenReveal names.
  string id = 1;
  // The combatant that cast (a UUID) and the spell (rules.v1.Spell.key).
  string caster_id = 2;
  string spell_key = 3;
  // The hidden creatures the area hit (UUIDs), in the combat's order.
  repeated string combatant_ids = 4;
  // The area of the cast, so that the map can draw it: the point of origin and the
  // squares inside.
  SpellArea area = 5;
}

// CombatDeath is a creature that died in this combat (Encounter.deaths; Revivify is in revivify.proto): a player's
// character the master confirmed dead, or an NPC taken to 0 hit points.
message CombatDeath {
  // The combatant (a UUID).
  string combatant_id = 1;
  string name = 2;
  // The round it died in.
  int32 death_round = 3;
  // Whether the spell still fits in time (the window of 10 rounds). Only the master.
  optional bool fits_revivify = 4;
  // The master's switch "Revivificar não funciona nesta morte". Only the master.
  optional bool revivify_blocked = 5;
  // True for a player's character (it has "Reviver"), false for an NPC.
  bool is_player_character = 6;
  // The character (a UUID) of a player's character, so the app can link to it and call
  // ReviveCharacter. Empty for an NPC.
  string character_id = 7;
}

// OpportunityOffer is the attack a combatant may make on an enemy that left its
// reach (SRD "opportunity attack", RN-21): the mover's move already landed, and
// its turn waits for the answer. Answer with RollAttack
// (`opportunity_offer_id`), DeclineOpportunity or, for the master,
// SkipOpportunity.
message OpportunityOffer {
  // Stable offer ID (a UUID): what the answers name.
  string id = 1;
  // The combatant that moved (a UUID). The caller sees it.
  string mover_id = 2;
  string mover_label = 3;
  // The combatant that may attack (a UUID) and its label ("Goblin 2"). Empty for
  // the mover's player when the reactor is hidden from them (RN-10): the screen
  // then says only "Esperando o mestre".
  string reactor_id = 4;
  string reactor_label = 5;
  // True when the caller may answer: the reactor's controller, and the master.
  bool for_you = 6;
  // The square of the move's line where the mover left the reach: where it goes
  // back to if the attack drops it to 0 hit points. Only for whoever answers. 0
  // in THEATRE mode, where the master offered the attack and nobody has a square:
  // see `by_hand`.
  int32 left_col = 7;
  int32 left_row = 8;
  // The reactor's melee attacks (opportunity attacks are melee), as
  // GetTurnOptions names them, for whoever answers: the screen offers "Atacar com
  // Espada longa". Empty for the mover's player.
  repeated OpportunityAttack attacks = 9;
  // Sent to whoever receives the offer (the master, the reactor's player and the
  // mover's player). True when the master offered it (OfferOpportunity, THEATRE mode) instead of
  // the server finding it on a move: there is no square (`left_col` and `left_row`
  // are 0 and mean nothing), and a hit never takes the mover back anywhere.
  bool by_hand = 10;
  // The mover left the reach by a long jump, not a walk: the master's panel says
  // "saltou" instead of "saiu". UNSPECIFIED for a walk (and for an offer made by
  // hand). Sent to whoever receives the offer.
  JumpKind jump = 11;
}

// OpportunityAttack is one melee attack of an offer's reactor.
message OpportunityAttack {
  // The attack key RollAttack takes.
  string key = 1;
  // Its Portuguese name ("Espada longa").
  string name_pt = 2;
}

// NpcGroup is a group of NPCs that act together, for a player to name (see
// Encounter.npc_only_groups).
message NpcGroup {
  // The combatants (UUIDs), in the order.
  repeated string combatant_ids = 1;
}

// ReactionPrompt is a hit that waits for its target's reaction: "Você foi
// atingido: usar Escudo?" (UseReaction, DeclineReaction). It never carries the
// attack's total or the armor class, and a player does not get who attacked.
message ReactionPrompt {
  // The pending damage of the hit (a UUID): what UseReaction and
  // DeclineReaction name.
  string pending_damage_id = 1;
  // The combatant that was hit (a UUID).
  string target_id = 2;
  // The attacker (a UUID). Only the master.
  string attacker_id = 3;
  // The reaction spell, "spell:shield".
  string spell_key = 4;
  // The slots it can be cast with: at least the 1st level, with a free slot.
  repeated meurpg.rules.v1.SlotChoice slots = 5;
  // Who attacked ("Capitão Goblin") and with which attack ("Cimitarra", its
  // Portuguese name): for the master, and for the target's player only when the
  // attacker is not hidden from them (RN-20). Both are empty for a player when
  // the attacker is hidden.
  string attacker_label = 6;
  string attack_name_pt = 7;
  // The reaction spell's Portuguese name ("Escudo Arcano"), for everyone who
  // gets the prompt.
  string spell_name_pt = 8;
}

// Combatant is one who fights, as the caller may see it. Fields marked "only
// the master" are left out for a player (zero or unset), and a hidden
// combatant is not sent to a player at all.
message Combatant {
  // Stable combatant ID (a UUID), for this combat only.
  string id = 1;
  // What the table calls it: a character's name, or "Goblin 2".
  string label = 2;
  CombatantKind kind = 3;
  // Whether it is the caller's own character. Never true for a creature, not
  // even one of the caller's: `controlled_by_me` covers both.
  bool mine = 4;
  // The character it stands for (a UUID). For a player's character, everyone
  // gets it; for an NPC, only the master (several copies share it). Empty for
  // a creature: `owner_character_id` says whose it is.
  string character_id = 5;
  // Whether the master hides it from the players. Only the master gets it;
  // for a player it is always false (a hidden one is not sent).
  bool hidden = 6;
  // The initiative total (d20 + bonus). Unset until rolled. A player gets it
  // for player combatants only, never an NPC's roll (RN-20).
  optional int32 initiative = 7;
  // The bonus added to the d20, and the d20 itself. Only the master and the
  // combatant's own player get them.
  optional int32 initiative_bonus = 8;
  optional int32 initiative_face = 9;
  // Only the master: it is tied with another combatant on the same total and
  // bonus, and the master has not ordered them yet (SetInitiativeOrder). It is
  // now only a display order: tied combatants take one joint turn whatever
  // their order, and this flag no longer decides who acts first. It keeps
  // telling the master the list holds a tie he has not looked at.
  bool tie_unresolved = 10;
  // Whether it has a square on the grid. A combatant without one is not on
  // the map yet; the master places it (MoveCombatant).
  bool placed = 11;
  // Its square, from 0, from the top left. Only meaningful when placed.
  int32 col = 12;
  int32 row = 13;
  // Walking speed in feet (5 ft is one square, 1.5 m); the feet walked this
  // turn; and the feet left (twice the speed after the Dash action, minus
  // the feet walked). Only the master and the combatant's own player, and the
  // other players of the same joint turn (see `dashed`).
  int32 speed_ft = 14;
  int32 movement_used_ft = 15;
  int32 movement_left_ft = 16;
  // The turn's economy. Only the master and the combatant's own player; and,
  // in a joint turn, the other players in the same group, who act together
  // and tell each other what is left (a player outside the group never gets
  // them). Also the `movement` fields above.
  bool dashed = 17;
  bool action_used = 18;
  bool bonus_action_used = 19;
  bool reaction_used = 20;
  // How hurt an NPC or a creature is, as a word (RN-20). Unspecified for a
  // player's character.
  CombatantState state = 21;
  // An NPC's hit points, as numbers. Only the master gets them; for a player's
  // character, they come from its vitals (the master's copy is filled here
  // too). A creature's are also the numbers of its owner's player (and of no
  // other player).
  optional int32 hit_points_current = 22;
  optional int32 hit_points_max = 23;
  optional int32 hit_points_temporary = 24;
  // Out of the fight (an NPC at 0 hit points). The turn skips it.
  bool defeated = 25;
  // A player's character's death saves, 0 to 3 each. Everyone sees them, unless
  // the table hides them (RN-24, "só o dono e o mestre"): then only the
  // character's owner and the master get them, and everybody else gets 0 and 0
  // and the state word alone ("Caído"; "Estável" and "Morto" are results the
  // table sees).
  int32 death_successes = 26;
  int32 death_failures = 27;
  // The conditions the master marked ("caído", "envenenado"; RN-22), and the
  // spell it is concentrating on, if any.
  repeated string conditions = 28;
  string concentration_spell = 29;
  // The armor class from its sheet ("CA 15"). Only the master gets it: a
  // player never learns an armor class (RN-20). Unset for a player, and for
  // a character whose sheet is gone.
  optional int32 armor_class = 30;
  // The armor class the combatant has on top of its sheet's, until the start of
  // its next turn: 5 with Escudo, 0 otherwise. Only the master and the
  // combatant's own player; never an armor class itself.
  int32 armor_class_bonus = 31;
  // A player's character at 0 hit points whose turn it is, still making death
  // saves and not yet rolled this turn: RollDeathSave is due, and EndTurn waits
  // for it. A character that drops to 0 during its own turn owes nothing until
  // its next turn starts (SRD 5.1). Only the master and the character's own player.
  bool death_save_due = 32;
  // The conditions' Portuguese names, in the same order as `conditions`.
  repeated string condition_names_pt = 33;
  // The Portuguese name of `concentration_spell` ("Teia"); empty when the
  // combatant is not concentrating. Filled for everyone who sees the combatant,
  // like `condition_names_pt`.
  string concentration_spell_name_pt = 34;
  // The XP the NPC gives when defeated (the sheet's xp_value, copied when it
  // joined the fight): the end-of-combat summary adds up the defeated ones.
  // Only the master gets it, and only for an NPC; for a player (RN-20) and for
  // a player's character it is 0.
  int32 xp_value = 35;
  // The portrait of the NPC's sheet, as a URL ("/images/<id>"; the thumbnail
  // is that plus "/thumb"), for the master's NPC card (MR-031). Empty when the
  // NPC has none (the app draws its initials), for a player's character, and
  // for a player: only the master gets it. A player sees a portrait only on
  // the stage (StageNpc).
  string portrait_url = 36;
  // In the group on turn (Encounter.turn_group_ids), this member's part of the
  // turn already ended: it acts no more until its group's next turn. False for
  // a member who still acts, for one not on turn and in SETUP. The master gets
  // it for every member. A player gets it for a member they see in a group that
  // holds a player's character ("Encerrou" / "Ainda age"), and never for the
  // members of an NPC-only group. A member's economy fields (above) stay the
  // master's and the owner's.
  bool turn_part_ended = 37;
  // Who it fights for (SetCombatantSide). Everyone who sees the combatant gets it.
  CombatantSide side = 38;
  // Its size (rules.v1.CreatureSize); everyone who sees the combatant gets it.
  meurpg.rules.v1.CreatureSize size = 39;
  // The movement in tenths of a foot, which is what the server keeps (RN-21): the
  // speed for the turn (twice after the Dash action; a creature with a fly speed
  // takes the better of its speeds), what was walked and what is left. The `_ft`
  // fields above are these rounded down. Same audience as `speed_ft`.
  int32 speed_dft = 40;
  int32 movement_used_dft = 41;
  int32 movement_left_dft = 42;
  // The cover the master marked on it (SetCombatantCover): NONE or UNSPECIFIED
  // when there is none. It is no armor class and everyone who sees the combatant
  // gets it. A move that takes it off also sends `encounter_changed`, since
  // `combatant_moved` carries only the square. The cover from the map depends on who attacks, so it is on
  // TargetInReach, never here.
  CoverDegree cover_mark = 43;
  // A fly speed in feet, 0 for none. Same audience as `speed_ft`.
  int32 speed_fly_ft = 44;
  // It took the Disengage action this turn (like `dashed`): leaving a hostile
  // creature's reach provokes no opportunity attack. Same audience as `dashed`.
  bool disengaged = 45;
  // Whether the caller's player plays this combatant: their own character, or
  // one of its creatures. Always false for the master. `mine` stays true only
  // for the player's own character, so a screen that finds "my" combatant with
  // it never picks a creature; this field is for the screens that list every
  // combatant the player controls (MR-037).
  bool controlled_by_me = 46;
  // A creature's own ID, the one CharacterService.ListCharacterCreatures lists
  // (a UUID). Only for a creature, and only for the master and its owner's
  // player.
  string creature_id = 47;
  // The player's character the creature belongs to (a UUID). Only for a
  // creature, and for everyone who sees it: the party knows whose it is.
  // `character_id` stays empty for a creature.
  string owner_character_id = 48;
  // The creature's kind, "monster:wolf", and its Portuguese name, "Lobo": the
  // stat block is ContentService.GetCreature. Only for a creature, for everyone
  // who sees it.
  string monster_key = 49;
  string monster_name_pt = 50;
  // What the creature may do on its own (from the spell that brought it). Only
  // for a creature, and only for the master and its owner's player. Where it
  // came from (a familiar, summoned animals, a gift) is on the creature itself:
  // CharacterService.ListCharacterCreatures. Number 52 is free.
  CreatureAttack creature_attack = 51;
  // The casting the creature came from (a UUID): creatures of one casting share
  // it and share one initiative roll. Only for a creature, and only for the
  // master and its owner's player.
  string summon_group_id = 53;
  // The beast a druid is in, for a player's character in Wild Shape (MR-037):
  // its content key ("monster:wolf") and Portuguese name. Everyone who sees the
  // combatant gets them: the party sees the wolf. Empty in the character's own
  // shape. The combatant's speed, fly speed, size and jumps are the beast's while
  // the form lasts.
  string wild_shape_beast_key = 60;
  string wild_shape_beast_name_pt = 61;
  // The beast's hit points, a pool of its own. Only the master and the
  // character's own player get them (RN-20); unset for everyone else, and when
  // there is no form.
  optional int32 wild_shape_hit_points_current = 62;
  optional int32 wild_shape_hit_points_max = 63;
  // The familiar the player is looking through (a creature ID), for a character
  // whose player looks through its familiar's eyes (MR-036): the combatant has
  // the blinded and deafened conditions meanwhile. Only the master and the
  // character's own player get it.
  string familiar_sight_creature_id = 64;
  // Only the master, for an NPC that is a monster of the bestiary (RN-29): the
  // SRD creature it is a copy of ("monster:bandit") and its challenge rating
  // ("1/8"), for the stat block and "ND 1/8". A player never gets them (RN-20).
  string bestiary_creature_key = 65;
  string challenge_rating = 66;
  // The hit points Ajuda adds to the maximum (5, 10, 15...; 0 without it). The
  // maximum above (`hit_points_max`) already counts them, so the screen writes "31 de
  // 43" with "+5 Ajuda" beside it. Only the master gets it, like the numbers it
  // belongs to; for a creature, also its owner's player. A player's character's own
  // numbers are CharacterVitals.hit_points_max_bonus.
  int32 hit_points_max_bonus = 67;
  // The Bardic Inspiration die the combatant holds, if any. Only the master and the
  // combatant's own player get it; the other players see the bard spend a use
  // and nothing more.
  InspirationDie inspiration_die = 70;
  // The attack roll of this combatant that waits for the answer about the die, if any
  // (it is answered with AnswerBardicInspiration). Only the master and the combatant's
  // own player get it, so the question is still there when the screen is read again.
  // Deprecated (E4-9): the question is `held_roll_offer` (answered with AnswerHeldRoll). This field is still served, for a
  // tab opened before the one question existed; it will go with the old answer RPCs.
  InspirationOffer inspiration_offer = 71 [deprecated = true];
  // The attack roll of this combatant that waits for the halfling's Lucky answer, if any
  // (it is answered with AnswerLucky). Only the master and the combatant's own player get
  // it, like `inspiration_offer`, which is unset while this question waits (one question at
  // a time: the Lucky question comes first, then the die's, on the new roll).
  // Deprecated (E4-9): the question is `held_roll_offer` (answered with AnswerHeldRoll). This field is still served, for a
  // tab opened before the one question existed; it will go with the old answer RPCs.
  LuckyOffer lucky_offer = 74 [deprecated = true];
  // The states the combatant is in (a rage, a dodge, Reckless Attack, a Hunter's
  // Mark on it), for everyone who sees it, except the mark, which only the master
  // and the ranger's player get. An NPC's states are the public chips alone.
  repeated CombatantEffect states = 73;
  // Where the conditions in `conditions` that come from something (Stunned by a
  // Stunning Strike) come from and when they end. The condition itself is in
  // `conditions` as always.
  repeated ConditionSource condition_sources = 68;
  // Since its last turn: it attacked a hostile creature, and it took damage. They
  // decide whether a rage ends (SRD 5.1, Barbarian, Rage). Only the master and the
  // combatant's own player.
  bool attacked_hostile_since_last_turn = 69;
  bool took_damage_since_last_turn = 72;
  // The effects the caller reads on this combatant, as cards: the master all of them; the
  // player of the combatant the ones they may read, never the DC of an NPC's effect; the
  // others none (see `effect_labels`).
  repeated LastingEffect effects = 100;
  // The labels the caller reads for the effects on this combatant, for the order and the
  // map: "Paralisado", "Preso numa teia", or the master's free label. A player reads only
  // the ones the master leaves visible; the master reads all.
  repeated EffectLabel effect_labels = 101;
  // The level of exhaustion, 0 to 6. The master and the owner read it; the others 0.
  int32 exhaustion_level = 102;
  // What standing up costs, in tenths of a foot, while the combatant is Prone: half its
  // speed of the turn without the Dash (SRD 5.1, "Being Prone"), rounded down. 0 when it
  // is not Prone or its speed is 0 (it cannot stand up then). Same audience as `speed_dft`.
  int32 stand_up_cost_dft = 103;

  // The roll of this combatant that waits for an answer, if any: the question it asks now, whichever roll it
  // is (a weapon attack, a spell attack, a save, a check), in the one shape every held roll has
  // (AnswerHeldRoll answers it). Only the master and the combatant's own player get it; the other players read
  // nothing, not even that a roll waits. It carries the d20 and the bonus the player already sees, never a DC,
  // an armor class or an NPC's number (RN-10, RN-20). the deprecated `inspiration_offer` and `lucky_offer` say the same for a
  // weapon attack.
  HeldRollOffer held_roll_offer = 104;
}

// Participant is who joins a combat: a character of the campaign.
message Participant {
  // A living character of the campaign (a UUID): a player's or an NPC.
  string character_id = 1;
  // How many copies of an NPC fight, 1 to 10; unset means 1. For a player's
  // character it must be 1 (or unset).
  int32 count = 2;
  // Whether the copies start hidden from the players. Unset: an NPC starts
  // hidden (question 31), a player's character never is.
  optional bool hidden = 3;
}

// StartEncounterRequest creates the combat.
message StartEncounterRequest {
  string campaign_id = 1;
  // A UUID the app generates once for this start and sends again on a retry.
  string idempotency_key = 2;
  // What to call the combat: 1 to 80 characters, one line.
  string name = 3;
  // A BATTLE point of the campaign the master started it from (a UUID), or
  // empty.
  string map_point_id = 4;
  // Who fights. Without a player's character here, the whole party joins.
  repeated Participant participants = 5;
  // How the combat is played, for good (RN-25). UNSPECIFIED takes the table's
  // rule "combate com mapa" (RN-24): GRID when it starts with a map, THEATRE
  // when it starts without. THEATRE refuses `map_point_id`.
  EncounterMode mode = 6;
  // The monsters of the encounter, from the bestiary: "Começar este combate" sends the ones a battle
  // point keeps (EncounterService.GetBattleEncounter), and the master may change them first.
  // They join as AddMonsters puts them, in the same transaction as the start, under the same
  // idempotency key: NPCs with the creature's key, numbered together, each rolling its own initiative.
  // At most 20 groups; a creature may appear once; a group has 1 to 40 monsters. With monsters, `participants`
  // may be empty (the whole party joins). The monsters and the party together are at most 40
  // combatants. In THEATRE mode they have no square, as in any combat without a map.
  repeated MonsterGroup monsters = 7;
  // How the monsters' hit points are chosen; unset is the average. Applies to every group.
  MonsterHitPoints monster_hit_points = 8;
  // Whether the monsters start hidden from the players; unset: hidden.
  optional bool monsters_hidden = 9;
}

// MonsterGroup is the monsters of one creature, as a start of a combat or a saved encounter lists
// them: the same fields as AddMonstersRequest's.
message MonsterGroup {
  // The SRD creature, such as "monster:bandit".
  string creature_key = 1;
  // How many monsters: 1 to 40; unset means 1.
  int32 count = 2;
  // The base name, 1 to 30 characters on one line; empty takes the creature's Portuguese name.
  string name = 3;
}

// GetStartRosterRequest names the campaign and, optionally, the battle point to start from.
message GetStartRosterRequest {
  string campaign_id = 1;
  // A BATTLE point of the campaign (a UUID), or empty to fight on the current map.
  string map_point_id = 2;
}

// StartRosterEntry is one living player character of the party and where a combat started now
// would put it.
message StartRosterEntry {
  string character_id = 1;
  // Whether the character has a token on the map of the fight.
  bool on_map = 2;
  // The square its token is on, from 0, when on_map.
  int32 col = 3;
  int32 row = 4;
  // True when a character earlier in the list stands on the same square: this one would start
  // with no square, for the master to place.
  bool shares_square = 5;
}

// GetStartRosterResponse is the party of a combat about to start.
message GetStartRosterResponse {
  // The map of the fight; empty when there is no current map or it has no grid, and then no
  // entry is on the map.
  string map_id = 1;
  repeated StartRosterEntry party = 2;
}

// StartEncounterResponse returns the new combat in SETUP.
message StartEncounterResponse {
  Encounter encounter = 1;
}

// GetEncounterRequest names the campaign.
message GetEncounterRequest {
  string campaign_id = 1;
}

// GetEncounterResponse is the open session's latest combat.
message GetEncounterResponse {
  // Unset while the session has had no combat.
  Encounter encounter = 1;
}

// SubmitInitiativeRequest rolls a combatant's initiative.
message SubmitInitiativeRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  string idempotency_key = 4;
  // How the d20 comes: exactly one.
  oneof roll {
    // True: the app rolls the d20 on the server (RN-18).
    bool roll_in_app = 5;
    // The face of a physical d20, 1 to 20.
    int32 d20_face = 6;
  }
  // A table maneuver (a superiority_die effect of applies "initiative") the player adds to the
  // initiative: its key. The die is rolled in the app, or with physical dice its face is
  // `maneuver_face` (1 to its sides, required then). One use of its resource is spent when the
  // initiative is set. The refusals are those of RollSceneCheckRequest.maneuver_key.
  string maneuver_key = 7;
  int32 maneuver_face = 8;
}

// SubmitInitiativeResponse returns the combat after the roll.
message SubmitInitiativeResponse {
  Encounter encounter = 1;
  // Set when the roll waits for a question (the halfling's Lucky about a 1, or the Bardic Inspiration die the character
  // holds; AnswerHeldRoll answers it): the d20 was rolled and kept, and the initiative stays unset. `encounter` is the
  // combat as it is. The master is asked too when he rolls for the player, and answers after the player's first 10 s.
  HeldRollOffer held_roll_offer = 2;
}

// SetInitiativeOrderRequest orders a tie.
message SetInitiativeOrderRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string idempotency_key = 3;
  // The combatants tied on the same total and bonus (two or more), in the
  // order they will play.
  repeated string combatant_ids = 4;
}

// SetInitiativeOrderResponse returns the combat after the new order.
message SetInitiativeOrderResponse {
  Encounter encounter = 1;
}

// BeginCombatRequest starts the turns.
message BeginCombatRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string idempotency_key = 3;
}

// BeginCombatResponse returns the ACTIVE combat.
message BeginCombatResponse {
  Encounter encounter = 1;
}

// EndTurnRequest ends the turn of the current combatant.
message EndTurnRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string idempotency_key = 3;
  // The member whose part the caller thinks it ends (a UUID): one that still
  // acts in the turn; empty only when nobody is acting (see EndTurn).
  string expected_combatant_id = 4;
  // True: pass the turn although the combatant has a damage still waiting
  // (to be rolled or applied), discarding it. Only the master's call counts;
  // without it, that is `failed_precondition` (PENDING_DAMAGE).
  bool discard_pending_damage = 5;
  // The round the caller's screen is in (optional; 0 means do not check). If
  // it differs from the combat's round the call changes nothing and fails with
  // `aborted`: when a group is the only one, its last part ending starts the
  // next round with the same members acting, and a late second tap must not
  // end a part of the new round.
  int32 expected_round = 6;
}

// EndTurnResponse returns the combat after the turn passed.
message EndTurnResponse {
  Encounter encounter = 1;
}

// MoveCombatantRequest puts a combatant on a square.
message MoveCombatantRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  string idempotency_key = 4;
  // The square, from 0, from the top left of the grid. Ignored for a high jump.
  int32 col = 5;
  int32 row = 6;
  // A jump instead of a walk (D3). UNSPECIFIED is a plain move.
  JumpKind jump = 7;
  // A high jump: how high, in tenths of a foot, 1 up to the limit; it costs that
  // much movement. Ignored for any other move.
  int32 jump_height_dft = 8;
  // Only the master: a forced move, a teleport (Passo Nebuloso) or a token put
  // right. It never provokes an opportunity attack. A player sending it gets
  // `permission_denied`. Without it, the master's move of the combatant that is
  // on turn is a move like any, and provokes.
  bool forced = 9;
  // Only the master: the server picks the square of a combatant that has none
  // ("Colocar no mapa"), by the same rule that places the NPCs when the combat
  // begins. col and row are ignored. A player sending it gets `permission_denied`,
  // and a combatant already on the map is refused with `invalid_argument`.
  bool place = 10;
}

// MoveCombatantResponse returns the combat after the move.
message MoveCombatantResponse {
  Encounter encounter = 1;
  // True when the move ended before the chosen square because something the
  // player does not see stood in the way (a hidden creature): the screen says
  // "Algo bloqueia o caminho", never what it was (RN-10, D1). The movement spent
  // is the real cost up to where the combatant stopped.
  bool stopped_early = 2;
  // True when the move left an enemy's reach and so made at least one
  // opportunity offer: the turn now waits (Encounter.opportunity_offers has the
  // ones the caller may see). It is true even when every reactor is hidden from
  // the caller (the wait itself is a hint, accepted).
  bool provoked = 3;
  // True when the move ended before a locked door that stopped it (RN-26): the
  // screen says "A porta está trancada." The movement spent is the real cost up
  // to where the combatant stopped. A player only gets it for a door they know
  // (see or remember); otherwise the move reads as stopped_early.
  bool locked_door = 4;
}

// SpendMovementRequest spends movement by number, in a THEATRE combat.
message SpendMovementRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  string idempotency_key = 4;
  // How far, in whole feet: 1 to 600 (the app steps by 5 ft, 1.5 m). Never more
  // than the movement the combatant has left this turn.
  int32 distance_ft = 5;
}

// StandUpRequest stands a Prone combatant up, on its turn.
message StandUpRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  string idempotency_key = 4;
}

// StandUpResponse returns the combat and what the combatant has left.
message StandUpResponse {
  Encounter encounter = 1;
  // The movement left this turn, in tenths of a foot, after the cost.
  int32 movement_left_dft = 2;
}

// SpendMovementResponse returns the combat and what the combatant has left.
message SpendMovementResponse {
  Encounter encounter = 1;
  // The movement left this turn, in tenths of a foot: "Restam 3,0 m" is 100 (10 ft).
  // The same number the combatant carries
  // (Combatant.movement_left_dft), for whoever reads only the answer.
  int32 movement_left_dft = 2;
}

// OfferOpportunityRequest offers an opportunity attack, in a THEATRE combat.
message OfferOpportunityRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string idempotency_key = 3;
  // The combatant that left someone's reach: the one on turn (a UUID).
  string mover_id = 4;
  // The combatant whose reach it left, who may attack (a UUID): the one the
  // master chose ("Saiu do alcance de: Toren").
  string reactor_id = 5;
}

// OfferOpportunityResponse returns the combat with the offer in it
// (Encounter.opportunity_offers).
message OfferOpportunityResponse {
  Encounter encounter = 1;
  // The offer made (a UUID): what DeclineOpportunity, SkipOpportunity,
  // WithdrawOpportunity and RollAttack name.
  string opportunity_offer_id = 2;
}

// WithdrawOpportunityRequest takes back an offer nobody answered.
message WithdrawOpportunityRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string opportunity_offer_id = 3;
  string idempotency_key = 4;
}

// WithdrawOpportunityResponse returns the combat without the offer.
message WithdrawOpportunityResponse {
  Encounter encounter = 1;
}

// GetMoveOptionsRequest names a combatant.
message GetMoveOptionsRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  // LONG describes the squares a long jump can land on instead of a walk, and
  // `provokes_reactor_ids` warns about the opportunity attacks of that jump, as it does
  // for a walk (a jump is movement and leaves a reach the same way). UNSPECIFIED is the
  // walk. HIGH is refused (`invalid_argument`): a high jump changes no square, so it
  // provokes nothing.
  JumpKind jump = 4;
  // For a LONG jump: the screen's guess that the combatant ran 10 ft first (the 3 m
  // of a running start in metric). The squares always follow the running start the
  // server counted from what the combatant really walked just before (the distance is
  // the whole Strength score with it, half without), so the preview never offers a
  // square MoveCombatant would refuse. Ignored without a jump.
  bool jump_running_start = 5;
}

// GetMoveOptionsResponse is where the combatant can go in one straight move.
message GetMoveOptionsResponse {
  // The movement left, in tenths of a foot: the circle's radius.
  int32 movement_left_dft = 1;
  // Every square it can go to, in reading order (row by row). The start is not
  // in it.
  repeated ReachableSquare reachable = 2;
  // The squares inside the circle that it cannot go to, with the reason, in the
  // same order.
  repeated RefusedSquare refused = 3;
  // True when the mover moves as a flier: difficult terrain costs it nothing.
  bool flier = 4;
  // The creature the mover drags along: it holds it grappled, and a creature that
  // is not two or more sizes smaller than the mover halves its speed while it moves
  // (SRD 5.1, "Moving a Grappled Creature"). `movement_left_dft` and the costs of
  // `reachable` already count the halving: the movement left is the path that fits. Empty
  // when the mover drags nobody.
  string dragging_combatant_id = 20;
  // True when the dragged creature halves the speed.
  bool dragging_halved = 21;
}

// DraggedSquare is the square a dragged creature ends on: the one the grappler left
// just before the last square of its path, worked out by the server.
message DraggedSquare {
  int32 col = 1;
  int32 row = 2;
}

// ReachableSquare is a square a combatant can go to, and what the move costs.
message ReachableSquare {
  int32 col = 1;
  int32 row = 2;
  // The cost in tenths of a foot: the length of the line plus 50 for each square
  // of difficult terrain or holding another creature that it enters.
  int32 cost_dft = 3;
  // The combatants this move would let attack with an opportunity attack (UUIDs):
  // only ones the caller sees, never a hidden one (RN-10). Empty when the move
  // provokes nothing, or the mover took Disengage. For a player it is a warning
  // worked out from what they see (hostile, visible, not defeated, its visible
  // conditions, a 5 ft reach): it may name a reactor whose reaction is already
  // spent, or that has no melee attack, so the screen says "pode provocar". The
  // master's list is exact. The screen warns before confirming ("Sair do alcance
  // do Goblin 2 pode provocar um ataque de oportunidade").
  repeated string provokes_reactor_ids = 4;
  // The armed trap this square is inside, when the caller's character knows it
  // (it noticed or found it, the master revealed it to the character or to
  // everyone, or it fired before): the app asks "Isso entra no Fosso escondido.
  // Mover assim mesmo?" before the move. Never set for a trap the character does
  // not know (RN-10). Fields 4 to 6 are slice 9.6b's.
  string known_trap_point_id = 7;
  // That trap's name ("Fosso escondido").
  string known_trap_name = 8;
  // The square the dragged creature (GetMoveOptionsResponse.dragging_combatant_id)
  // ends on if the mover goes here. Unset when it drags nobody.
  DraggedSquare dragged_to = 20;
}

// RefusedSquare is a square inside the circle that the combatant cannot go to.
message RefusedSquare {
  int32 col = 1;
  int32 row = 2;
  MoveRefusal reason = 3;
}

// SetCombatantSideRequest marks an NPC "Aliado", or back as an enemy.
message SetCombatantSideRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  // An NPC combatant (a UUID).
  string combatant_id = 3;
  string idempotency_key = 4;
  // PARTY or ENEMY.
  CombatantSide side = 5;
}

// SetCombatantSideResponse returns the combat after the change.
message SetCombatantSideResponse {
  Encounter encounter = 1;
}

// SetCombatantCoverRequest marks the cover a combatant has that the map does not
// show.
message SetCombatantCoverRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  string idempotency_key = 4;
  // NONE, HALF, THREE_QUARTERS or TOTAL.
  CoverDegree cover = 5;
}

// SetCombatantCoverResponse returns the combat after the change.
message SetCombatantCoverResponse {
  Encounter encounter = 1;
}

// SetCombatantHiddenRequest hides an NPC from the players, or shows it.
message SetCombatantHiddenRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  string idempotency_key = 4;
  // True hides the combatant; false shows it.
  bool hidden = 5;
}

// SetCombatantHiddenResponse returns the combat after the change.
message SetCombatantHiddenResponse {
  Encounter encounter = 1;
}

// AddCombatantsRequest brings reinforcements.
message AddCombatantsRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string idempotency_key = 3;
  repeated Participant participants = 4;
}

// AddCombatantsResponse returns the combat with the new combatants.
message AddCombatantsResponse {
  Encounter encounter = 1;
}

// MonsterHitPoints is how the hit points of added monsters are chosen.
enum MonsterHitPoints {
  // Same as AVERAGE (question 81).
  MONSTER_HIT_POINTS_UNSPECIFIED = 0;
  // The creature's average hit points, the same for every monster.
  MONSTER_HIT_POINTS_AVERAGE = 1;
  // Each monster rolls the creature's hit dice, in the app (at least 1).
  MONSTER_HIT_POINTS_ROLLED = 2;
}

// AddMonstersRequest puts monsters of one creature into the combat.
message AddMonstersRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  // A UUID the app generates once for this add and sends again on a retry.
  string idempotency_key = 3;
  // The SRD creature, such as "monster:bandit" (the bestiary's `key`).
  string creature_key = 4;
  // How many monsters, 1 to 10; unset means 1.
  int32 count = 5;
  // The base name, 1 to 30 characters on one line; empty takes the creature's
  // Portuguese name. The bestiary is the public SRD: a player who knows the
  // creature can look its numbers up, and the app never tells the players
  // which creature a monster is beyond this name. A master who wants it secret
  // gives another name (RN-20).
  string name = 6;
  // How the hit points are chosen; unset is the average.
  MonsterHitPoints hit_points = 7;
  // Whether the monsters start hidden from the players; unset: hidden.
  optional bool hidden = 8;
}

// AddMonstersResponse returns the combat with the new combatants.
message AddMonstersResponse {
  Encounter encounter = 1;
  // The new combatants, in the order of their names. A retry of an add that
  // was already made returns the same ids.
  repeated string combatant_ids = 2;
}

// RemoveCombatantRequest takes a combatant out.
message RemoveCombatantRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  string idempotency_key = 4;
}

// RemoveCombatantResponse returns the combat without the combatant.
message RemoveCombatantResponse {
  Encounter encounter = 1;
}

// EndEncounterRequest ends the combat.
message EndEncounterRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string idempotency_key = 3;
}

// EndEncounterResponse returns the ended combat.
message EndEncounterResponse {
  Encounter encounter = 1;
}

// DiceRoll is a roll as numbers: the dice, what they showed, the modifier and
// the total. The app writes it as `1d20 (13) + 6 = 19`; a physical roll as
// `16 + 5 = 21` with the note "dado físico".
message DiceRoll {
  // How many dice, and how many faces each: 1d20 is 1 and 20. Zero dice is a
  // flat number.
  int32 dice_count = 1;
  int32 dice_sides = 2;
  // The faces the app rolled, one per die. Empty for a physical damage roll:
  // the player typed the sum. A physical d20 carries the face that was typed.
  repeated int32 faces = 3;
  // The number added to the dice.
  int32 modifier = 4;
  // The dice (or the typed sum) plus the modifier. For damage never below 0.
  int32 total = 5;
  // True when the player rolled real dice and typed the sum (RN-18).
  bool physical = 6;
  // A d20 of an ability check that a feature made count as another number
  // (Talento Confiável: a 9 or lower counts as 10): the number it counted as.
  // `faces` keeps what came up, `total` uses this one. Unset when the feature did not
  // change the roll, even when the character has it: a 14 is never marked. For a roll
  // with two d20 (disadvantage) the field belongs to the die that counted.
  optional int32 treated_as = 7;
  // The feature that did it, as a content key ("feature:reliable-talent"); its
  // Portuguese name is in the content's names. Empty when `treated_as` is unset.
  string treated_as_source = 8;
  // A d20 rolled with advantage or disadvantage has two faces: the index of the one
  // that counts (the higher with advantage, the lower with disadvantage). 0 for any
  // other roll.
  int32 counted_index = 9;
  // The dice a feature rolled again: a fighting style's damage dice (Great Weapon
  // Fighting), or the halfling's Lucky on a d20 that showed a 1 (`source_key`
  // "trait:lucky", from 1 to the new face): an attack roll, an ability check or a saving
  // throw. `faces` holds the faces that count.
  repeated Reroll rerolled = 10;
  // The dice an effect added to (sign 1) or took from (sign -1) the roll: Bênção and
  // Perdição's d4 on attack rolls and saving throws. `total` already has them. For a
  // player, on an effect the master hides, `source_name_pt` is "Outra fonte" and the
  // key is empty.
  repeated ExtraDie extra_dice = 100;
}

// CriticalDamageRule is what a critical hit does to the damage dice: the table's
// rule "Acertos críticos" (RN-24, MR-025), applied by the server to every
// critical hit of the combat: weapon attacks, spell attacks, a creature's and an
// NPC's. The browser does no dice math: it shows the hint the rule gives and
// types what the player rolled (RN-18).
enum CriticalDamageRule {
  CRITICAL_DAMAGE_RULE_UNSPECIFIED = 0;
  // The SRD's, and what the app did before the rule existed: every damage die is
  // rolled twice (PendingDamage.dice_count is already doubled), the modifier
  // once. The hint: "role os dados duas vezes".
  CRITICAL_DAMAGE_RULE_DOUBLED_DICE = 1;
  // The dice count as their maximum, and then one normal roll of them is added
  // (PendingDamage.dice_count is the dice to roll, not doubled, and
  // PendingDamage.critical_max the maximum that comes without rolling), the
  // modifier once. The hint: "o máximo mais uma rolagem".
  CRITICAL_DAMAGE_RULE_MAX_PLUS_ROLL = 2;
}

// AttackOutcome is what an attack roll did against the target's armor class.
enum AttackOutcome {
  ATTACK_OUTCOME_UNSPECIFIED = 0;
  // The total reached the armor class: "Acertou".
  ATTACK_OUTCOME_HIT = 1;
  // A natural 20: it hits and the damage follows the table's critical rule (the
  // dice double, or the maximum plus a roll): "Crítico".
  ATTACK_OUTCOME_CRITICAL_HIT = 2;
  // A natural 1, or a total below the armor class: "Errou".
  ATTACK_OUTCOME_MISS = 3;
}

// PendingDamageStatus is where the damage of a hit is.
enum PendingDamageStatus {
  PENDING_DAMAGE_STATUS_UNSPECIFIED = 0;
  // The attack hit and the damage is not rolled yet (RollDamage).
  PENDING_DAMAGE_STATUS_AWAITING_ROLL = 1;
  // Rolled, for a player's character: waits for the master
  // (ApplyPendingDamage or DiscardPendingDamage).
  PENDING_DAMAGE_STATUS_ROLLED = 2;
  // Applied to the target: at once for an NPC (or a heal), by the master for a
  // player's character.
  PENDING_DAMAGE_STATUS_APPLIED = 3;
  // Dropped by the master without applying, or stopped by Escudo.
  PENDING_DAMAGE_STATUS_DISCARDED = 4;
  // The attack hit a player's character that may cast Escudo: the hit waits for
  // the target's reaction (UseReaction or DeclineReaction) before its damage
  // can be rolled.
  PENDING_DAMAGE_STATUS_AWAITING_REACTION = 5;
}

// PendingDamage is the damage of an attack that hit: stored, so a retry or a
// reload finds it. Only the master and the attacker's player get it.
message PendingDamage {
  // Stable ID (a UUID).
  string id = 1;
  // The attacker and the target (combatant IDs).
  string attacker_id = 2;
  string target_id = 3;
  // The attack, as in rules.v1.Attack.key.
  string attack_key = 4;
  PendingDamageStatus status = 5;
  // True for a critical hit: the damage follows the table's critical rule
  // (critical_rule).
  bool critical = 6;
  // The damage to roll: the dice and the modifier. For a critical hit the dice
  // are already doubled under DOUBLED_DICE; under MAX_PLUS_ROLL they are the
  // dice of the attack, rolled once, and critical_max comes on top of them.
  int32 dice_count = 7;
  int32 dice_sides = 8;
  int32 bonus = 9;
  // The kind of damage: a key such as "damage-type:fire" and its Portuguese
  // name ("fogo").
  string damage_type_key = 10;
  string damage_type_pt = 11;
  // The roll and the damage it made. Set from ROLLED on.
  DiceRoll roll = 12;
  int32 amount = 13;
  // APPLIED to an NPC: it reached 0 and is defeated.
  bool target_defeated = 14;
  // The spell's cast, when the damage comes from one (a UUID): the pending
  // damages of one cast share it, and an area spell's damage is one roll for
  // all of them (RollDamage).
  string cast_id = 15;
  // A heal, not a damage: RollDamage heals the target at once. The dice already
  // hold the caster's spellcasting modifier in `bonus`.
  bool healing = 16;
  // The target saved and the spell halves the damage: `amount` is half of the
  // roll, rounded down.
  bool half = 17;
  // The damage the master applied when it is not the rolled one
  // (ApplyPendingDamage.amount). Unset otherwise.
  optional int32 applied_amount = 18;
  // APPLIED to a target that is concentrating on a spell: the Constitution save
  // DC to keep it, 10 or half of the damage taken, whichever is higher (RN-22).
  // The table rolls it. Only the master, and the target's own player when the
  // table rule "Os jogadores veem a CD dos testes de resistência" is on.
  optional int32 concentration_dc = 19;
  // APPLIED to a player's character that was already at 0 hit points: the
  // death save failures the damage caused (1, or 2 for a critical hit) instead
  // of hit points. When the table hides the death saves (RN-24) only the master
  // and the target's own player get it; everybody else gets 0.
  int32 death_failures_added = 20;
  // The damage comes from a trap (MR-035): the trap's point (a UUID), and its
  // name. attacker_id is empty then, attack_key is "trap" and the damage was
  // rolled when the trap fired, so it is ROLLED (a player's character: it waits
  // for the master, who may change the amount, RN-02) or APPLIED (an NPC or a
  // creature, which takes it at once). Only the master and the target's own
  // player get these rows; a trap that fired is public.
  string trap_point_id = 21;
  string trap_name = 22;
  // The critical rule this damage was made under (the table's when the attack hit,
  // so a change of the rules mid-combat applies from the next attack on):
  // UNSPECIFIED for a hit that is not a critical one. It tells the screen which
  // hint to show next to the dice, and which numbers to ask a player who rolls
  // physical dice for (RollDamageRequest.typed_sum).
  CriticalDamageRule critical_rule = 23;
  // MAX_PLUS_ROLL: the maximum of the dice, which is added to the roll without
  // rolling anything (the dice's count times their faces; the modifier is
  // `bonus`, apart). 0 under any other rule. It is part of `roll.modifier` once
  // the damage is rolled, so `dice (faces) + modifier = total` still holds.
  int32 critical_max = 24;
  // The parts of the damage: the weapon, the extras the player may add (always listed,
  // disabled with the reason when their condition fails) and the automatic lines.
  // Empty for a damage that is one roll (a spell's, a trap's). When there are parts,
  // dice_count, dice_sides and bonus are the weapon's part alone.
  repeated DamagePart parts = 27;
  // The steps that resistance, vulnerability and immunity take the damage through,
  // once it is rolled. Only the master and the owner of a player's character that
  // takes it; empty for everyone else, an NPC's included (RN-20).
  repeated DamageStep steps = 28;
  // What each part rolled, once the damage is. The extras a player must not learn
  // the reason of (Divine Smite's extra die) are listed only when they count.
  repeated DamagePartRoll part_rolls = 29;
  // The damage after the steps (what ApplyPendingDamage applies unless the master
  // sets another number). Unset when no step changed it. Same audience as `steps`.
  optional int32 amount_after_steps = 30;
  // The weapon damage dice a feature adds to a critical hit of a melee attack, on top of
  // `dice_count`: 1, 2 or 3 for a barbarian's Crítico Brutal (levels 9, 13 and 17), same
  // faces as the attack's. 0 for any other hit: a ranged attack, a spell, a creature, an
  // NPC and the master never have them. They are always rolled, whatever the critical rule
  // is (`critical_max` never counts them), so a player with physical dice rolls
  // `dice_count + extra_dice_count` dice and types their sum (RollDamageRequest.typed_sum).
  // In the rolled `roll`, the faces of the `dice_count` dice come first and the extra
  // ones last.
  int32 extra_dice_count = 25;
  // The feature's Portuguese name for those dice ("Crítico Brutal"); empty when
  // `extra_dice_count` is 0.
  string extra_dice_name_pt = 26;
  // The damage an effect dealt to who started the turn under it (the web that burns): the
  // effect's Portuguese name ("Teia em chamas"). It has no attacker.
  string effect_source_name_pt = 100;
}

// GetTurnOptionsRequest names a combatant.
message GetTurnOptionsRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
}

// GetTurnOptionsResponse is what the combatant can do now.
message GetTurnOptionsResponse {
  // The economy (action, bonus action, reaction and the movement in feet:
  // 5 ft is 1.5 m), the attacks, the spells and the actions, each enabled or
  // disabled with a reason.
  meurpg.rules.v1.TurnOptions options = 1;
  // True when the combatant is the one on turn.
  bool your_turn = 2;
  // For each attack of options.attacks that rolls to hit, who it can target.
  repeated AttackTargets attack_targets = 3;
  // The damage this combatant still has to roll, or that waits for the
  // master to apply. Only the master and the combatant's player get it.
  repeated PendingDamage pending_damages = 4;
  // For each spell of options.spells, and each save cantrip of options.attacks,
  // who it can target, as the caller sees them: the caster itself and the other
  // combatants that are not defeated (a combatant at 0 hit points can be
  // healed), with the distance and whether the spell cannot reach it.
  repeated SpellTargets spell_targets = 5;
  // The table's critical rule (RN-24), read now: what a critical hit of this
  // combatant's attacks and spells will do to the damage dice, so the screen can
  // say it before the roll. DOUBLED_DICE or MAX_PLUS_ROLL, never UNSPECIFIED.
  CriticalDamageRule critical_rule = 6;
  // The special attacks that replace one attack of the Attack action (SRD 5.1,
  // "Grappling" and "Shoving a Creature"), with their targets: GRAPPLE and SHOVE.
  // Empty when the combatant cannot grapple or shove now.
  repeated ContestAttackOption contest_attack_options = 40;
  // The contest facts of this combatant's turn: grappled, holding, hidden, surprised.
  ContestTurnState contest_state = 41;
  // For each feature action of options.feature_actions that picks a creature
  // (Cura pelas Mãos, Inspiração de Bardo), who it can pick.
  repeated ResourceTargets resource_targets = 30;
  // What the effects on the combatant take away this turn, in words the caller may read
  // ("Você está Paralisada. Não age nem se move neste turno."); empty when nothing does.
  repeated EffectNote effect_notes = 100;
  // The extra action an effect gives (Velocidade); unset when there is none.
  ExtraActionOption extra_action = 101;
}

// ResourceTargets lists the creatures a feature action that picks one can choose.
message ResourceTargets {
  // The feature action, as in rules.v1.Action.key ("feature:lay-on-hands",
  // "feature:bardic-inspiration-d6").
  string action_key = 1;
  // The combatants the caller sees, in turn order: for Lay on Hands the touch's
  // reach (5 ft, `too_far` beyond it), for Bardic Inspiration the 60 ft of the bard's
  // voice. The paladin itself is listed for Lay on Hands, the bard never is.
  repeated ResourceTarget targets = 2;
}

// ResourceTarget is one creature a feature action may pick.
message ResourceTarget {
  TargetInReach target = 1;
  // Set when the creature cannot be picked: Bardic Inspiration's "Já tem um dado",
  // "Não ouve você". Empty when it can. Never a creature's type (RN-10).
  string disabled_reason_pt = 2;
}

// SpellTargets lists the targets one spell can choose.
message SpellTargets {
  // The spell, as in rules.v1.Spell.key.
  string spell_key = 1;
  // The combatants the caller sees, in turn order. `too_far` is for the spell's
  // range: Self reaches only the caster (or any target for a spell that comes
  // out of the caster, such as a cone), Touch 5 ft.
  repeated TargetInReach targets = 2;
  // How many targets the spell takes at its own level; 0 means any number (an
  // area), and no target at all for a spell that targets the caster only.
  int32 max_targets = 3;
  // True when the spell takes one more target for each slot level above its own.
  bool extra_target_per_level = 4;
  // Magic Missile: how many darts each slot level makes (3 at the 1st, one more
  // for each level above). Scorching Ray: how many rays (3 at the 2nd, one more
  // for each level above). Empty for any other spell.
  repeated DartsAtSlot darts = 5;
  // How many more targets the spell takes for each slot level above its own: 1 for
  // an SRD spell that says "one additional creature", the master's number for a
  // table spell ("três criaturas, duas a mais por nível"). 1 for Magic Missile
  // (a dart more) and Scorching Ray (a ray more): with `max_targets`, the targets
  // at a slot level are `max_targets + targets_per_level * (slot level - the
  // spell's level)`. 0 when it takes no more. `extra_target_per_level` is true
  // when this is above 0.
  int32 targets_per_level = 6;
  // How the spell is placed on a map with a grid; UNSPECIFIED for a spell that is
  // not a placed area (it takes `targets` as before, and in a combat without a map
  // every area spell does). The screen draws the placement picker for the others.
  AreaPlacement placement = 7;
  // The area's form and size, for the picker's outline: the radius of a sphere or
  // a cylinder, the length of a cone or a line, the side of a cube, in feet; and a
  // line's width in feet. Only with a `placement`.
  meurpg.rules.v1.SpellAreaShape area_shape = 8;
  int32 area_size_ft = 9;
  int32 area_width_ft = 10;
  // How far the point of origin may be from the caster, in feet, for POINT; 0 for
  // the others. The master is not held to it.
  int32 range_ft = 11;
  // A teleport spell (Passo Nebuloso) on a map with a grid: how far it takes the
  // caster, in feet. The screen asks the player for the square (CastSpellRequest.
  // destination) within it. 0 for any other spell, and in a combat without a map.
  int32 teleport_range_ft = 12;
}

// AreaPlacement is how a spell's area is set on a map with a grid (SRD 5.1,
// "Areas of Effect" and "Spell Range").
enum AreaPlacement {
  AREA_PLACEMENT_UNSPECIFIED = 0;
  // A sphere or a cylinder centered on a point the caster chooses within range.
  AREA_PLACEMENT_POINT = 1;
  // A cone, a line or a cube that comes out of the caster (range Self): the
  // caster picks one of eight directions.
  AREA_PLACEMENT_DIRECTION = 2;
  // A sphere or a cylinder that is Self: centered on the caster, nothing to
  // choose.
  AREA_PLACEMENT_CASTER = 3;
}

// DartsAtSlot is how many darts (Magic Missile) or rays (Scorching Ray) a slot
// level makes.
message DartsAtSlot {
  int32 slot_level = 1;
  int32 darts = 2;
}

// AttackTargets lists the targets one attack can choose.
message AttackTargets {
  // The attack, as in rules.v1.Attack.key.
  string attack_key = 1;
  // The combatants the caller sees, except the attacker and the defeated, in
  // turn order.
  repeated TargetInReach targets = 2;
}

// TargetInReach is a possible target of an attack.
message TargetInReach {
  string combatant_id = 1;
  string label = 2;
  // How hurt it is, as a word: never hit points.
  CombatantState state = 3;
  // The distance in feet: the squares between the centres, rounded down, times
  // 5 ft (RN-21), so a diagonal neighbour is 5 ft away. Unset when either of them
  // has no square on the grid, and always unset in THEATRE mode.
  optional int32 distance_ft = 4;
  // True when the attack cannot reach it: the distance is beyond its range,
  // or unknown for a player (RollAttack refuses it). Never true for the
  // master when the distance is unknown: the master is not held to the reach.
  // Always false in THEATRE mode, where the server never checks the reach: the
  // master judges, and the list holds every target the rules allow.
  bool too_far = 5;
  // The cover it has against this attacker (D4): the larger of what the map
  // gives along the line (a painted cover square, a creature in between, a wall)
  // and the master's mark. TOTAL means it cannot be targeted (RollAttack and
  // CastSpell refuse a player with TARGET_COVER_TOTAL); for an area spell it is
  // only a note. Never an armor class: a player never gets one (RN-20).
  CoverDegree cover = 6;
  // Where `cover` comes from. Unset when there is none.
  CoverSource cover_source = 7;
  // True when this caller cannot target it: total cover against the attacker
  // (an attack, or a single-target spell). The app offers it as no target, with
  // the reason, and does no cover math of its own. Never true for the master,
  // who has the last word, and never for an area spell.
  bool untargetable = 8;
  // The mode the attack rolls with against this target, worked out by the server
  // (SRD 5.1, "Advantage and Disadvantage"), and the circumstances behind it as the
  // caller may read them: a source that rests on something the master hides is
  // counted in the mode and not listed (RN-10). NORMAL when the combat has no
  // circumstance, never UNSPECIFIED.
  RollMode roll_mode = 9;
  repeated AdvantageSource sources = 10;
  // A hit on this target is a critical hit: it is paralyzed or unconscious and the
  // attacker is within 5 ft (SRD 5.1, Conditions).
  bool critical_on_hit = 11;
  // Only for the master reading the turn options of a player's character: the character's player does not see this
  // creature (the master hid it, or it is in the dark of a fog map), so the master acting for the character cannot pick
  // it. It is listed so the screen can dim it ("Pensantus não vê este alvo"); `untargetable` is true too. The server
  // refuses it in RollAttack and CastSpell with `not_found`. Never set for a player.
  bool not_seen = 12;
}

// RollAttackRequest rolls an attack.
message RollAttackRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  // The combatant that attacks (a UUID).
  string attacker_id = 3;
  // The attack, one of GetTurnOptions' options.attacks keys.
  string attack_key = 4;
  // The target (a UUID).
  string target_id = 5;
  string idempotency_key = 6;
  // How the d20 comes: exactly one.
  oneof roll {
    // True: the app rolls the d20 on the server (RN-18).
    bool roll_in_app = 7;
    // The face of a physical d20, 1 to 20.
    int32 d20_face = 8;
  }
  // True: an opportunity attack. A melee attack off the attacker's turn that
  // spends its reaction instead of its action (a player: the reaction must be
  // unused; the master may for anyone). Other reaction spells stay the
  // table's.
  bool as_reaction = 9;
  // Answers an opportunity offer (Encounter.opportunity_offers) with this attack:
  // the attacker must be the offer's reactor and the target its mover. It
  // implies `as_reaction`, ignores the reach (the attack comes right before the
  // mover leaves) and spends the reactor's reaction. Errors for it: a malformed id is
  // `invalid_argument`, and so is an attacker or target that is not the offer's
  // reactor and mover, or an attack that is not melee; an offer that is gone
  // (the move was undone, the turn passed, nobody can answer it any more) or
  // answered is `aborted`; the wrong player `permission_denied`; a used reaction
  // is `failed_precondition` (REACTION_USED). The cover is measured with the
  // mover on the square it left the reach at, not where it stands now.
  string opportunity_offer_id = 10;
  // Deflect Missiles' throw back: the reaction window (kind DEFLECT_MISSILES, at its
  // throw-back step) that caught the missile. It implies `as_reaction`, spends the
  // monk's ki (1 point) and is part of the same reaction, so it opens no window.
  string catch_window_id = 11;
  // The mode the caller wants to roll with instead of the server's suggestion, with
  // the reason (1 to 120 characters on one line, required when it differs). A
  // player may roll disadvantage freely; a mode better than the suggestion needs the
  // master: ask with RequestRollMode and roll with `roll_mode_request_id`
  // (otherwise `failed_precondition`, ROLL_MODE_NEEDS_APPROVAL). The master may set
  // any mode. Unset takes the server's. The server works the suggestion out again
  // and never trusts the one the screen showed.
  RollMode roll_mode = 12;
  string mode_reason = 13;
  // An answered request (RollModeRequest.id) whose decided mode this roll uses.
  string roll_mode_request_id = 14;
  // Physical dice: the faces of the d20 pair (one face for a normal roll, two for
  // advantage or disadvantage, 1 to 20 each), instead of `roll` (then `d20_face` is
  // not set). The number must match the mode the server resolves, else
  // `invalid_argument`.
  repeated int32 d20_faces = 15;
  // The faces of the dice an effect adds to the roll (Bênção, Perdição), in the order of
  // the effects, when the player rolls physical dice (`d20_face`): one for each, 1 to the
  // die's faces. With the app's dice the server rolls them.
  repeated int32 extra_die_faces = 100;
  // True: the attack is the weapon attack of the extra action an effect gives
  // (Velocidade): it spends that action, not the Attack action, and it is one weapon attack.
  bool use_extra_action = 101;
}

// AttackRoll is the attack roll and what it did.
message AttackRoll {
  string attacker_id = 1;
  string target_id = 2;
  string attack_key = 3;
  // The d20 with the attack bonus as the modifier.
  DiceRoll d20 = 4;
  AttackOutcome outcome = 5;
  // The target's armor class that the total was compared with ("Acertou
  // contra CA 18"). Only the master gets it; never a player (RN-20).
  optional int32 target_armor_class = 6;
  // The cover the target had against the attacker, and where it came from (D4).
  // Everyone who gets the roll gets them; the armor class stays the master's.
  CoverDegree cover = 7;
  CoverSource cover_source = 8;
  // The table's critical rule, for the screen's hint when the outcome is
  // CRITICAL_HIT ("role os dados duas vezes" or "o máximo mais uma rolagem"). Set
  // on every roll: the damage itself is PendingDamage (critical_rule).
  CriticalDamageRule critical_rule = 9;
  // The die added to the d20 after it was rolled (Bardic Inspiration), when the
  // player answered. The d20's total already has it.
  repeated BonusDie bonus_dice = 30;
  // True when a reaction window holds the roll (Cutting Words): the d20 is rolled
  // and the action spent, but the result is not told yet, so `outcome` is
  // UNSPECIFIED. The result comes with the next `encounter_changed`, when the
  // window is answered.
  bool held_for_reaction = 10;
  // The mode the roll had and the mode the server suggested; they differ when the
  // caller changed it (then `mode_reason` says why). Only the master and the
  // attacker's player: a player never learns how an NPC rolled (RN-20).
  RollMode mode = 11;
  RollMode suggested_mode = 12;
  string mode_reason = 13;
  // The circumstances behind `suggested_mode`, as the caller may read them.
  repeated AdvantageSource sources = 14;
  // A hit is a critical hit by the condition of the target, not by the die.
  bool critical_on_hit = 15;
}

// InspirationDie is a Bardic Inspiration die a combatant holds (SRD 5.1, Bard): one
// at a time, for 10 minutes.
message InspirationDie {
  // The size of the die: 6, 8, 10 or 12.
  int32 sides = 1;
  // The bard that gave it (a combatant's ID) and its name, "Orla".
  string from_combatant_id = 2;
  string from_label = 3;
  // The round the die runs out in: it lasts 100 rounds (10 minutes of 6 seconds).
  int32 expires_at_round = 4;
}

// InspirationOffer asks the player of a held roll whether to add the Bardic
// Inspiration die: RollAttack answered it instead of the outcome. The attack
// is only resolved by AnswerBardicInspiration.
message InspirationOffer {
  // The held roll (a UUID).
  string hold_id = 1;
  // The die the character holds, and who gave it.
  InspirationDie die = 2;
  // The d20 of the held roll, with the attack's bonus as the modifier: what the player
  // rolled, before the result is told.
  DiceRoll d20 = 3;
  // The attack and its target.
  string attack_key = 4;
  string target_id = 5;
}

// LuckyOffer asks the player of a held roll whether to roll again a d20 that shows a 1 (SRD
// 5.1, Halfling, Lucky: the new roll must be used): RollAttack answered it instead of the
// outcome, and the attack is only resolved after AnswerLucky. The other rolls that wait for a
// Bardic Inspiration die (a scene check, a group check, a trap search, a puzzle hint try, and,
// in a combat, a spell attack against one target, an effect's saving throw or a concentration
// save) answer it the same way instead of their result, with `attack_key` and `target_id`
// empty, and AnswerOutsideLucky settles them. Only the roller's player gets it (and, for a
// weapon attack, the master): it carries the d20 and the bonus the player already sees, never a
// DC, an armor class or an NPC's number (RN-10, RN-20).
message LuckyOffer {
  // The held roll (a UUID).
  string hold_id = 1;
  // The d20 of the held roll, with the roll's bonus as the modifier: both dice with
  // advantage or disadvantage, the one that counts marked (`counted_index`).
  DiceRoll d20 = 2;
  // The die that shows the 1, as an index into `d20.faces`: the one AnswerLucky rolls again
  // (0 for a single d20; with both dice on 1, the first).
  int32 lucky_index = 3;
  // The attack and its target; empty for a roll that is not a weapon attack.
  string attack_key = 4;
  string target_id = 5;
}

// BonusDie is a die added to a roll after it was rolled (Bardic Inspiration).
message BonusDie {
  // The feature it came from ("feature:bardic-inspiration-d6").
  string source_key = 1;
  int32 sides = 2;
  // The face rolled, 0 for a die the player did not use.
  int32 face = 3;
  // Whether the die was added to the total.
  bool used = 4;
}

// OutsideInspirationOffer asks the player of a d20 roll that is not a weapon attack (a scene
// check, a group check, a trap search, a puzzle hint try, and, in a combat, a spell attack, an
// effect's saving throw or a concentration save) whether to add the Bardic Inspiration die the
// character holds, wherever the die is kept (on the character out of a combat, on its
// combatant in one): the roll answered it instead of the result. The result is only written
// by AnswerOutsideInspiration (SRD 5.1: the creature can wait until after it rolls the d20 and
// must decide before the GM says whether the roll succeeds). Only the roller's player gets it
// (and the master reads the dice held, never an offer): it carries the d20 and the bonus the
// player already sees, never a DC, an armor class or an NPC's number (RN-10, RN-20). A halfling's
// roll whose d20 shows a 1 asks the Lucky question first (LuckyOffer, AnswerOutsideLucky); this
// one comes after it, on the new roll.
message OutsideInspirationOffer {
  // The held roll (a UUID).
  string hold_id = 1;
  // The size of the die the character holds, and the name of the bard that gave it.
  int32 sides = 2;
  string from_name = 3;
  // The d20 (or both, with advantage or disadvantage) with the bonus the check adds, before
  // the die: what the player rolled, before the result is told.
  DiceRoll d20 = 4;
}

// HeldRollKind is the roll that waits for a question.
enum HeldRollKind {
  HELD_ROLL_KIND_UNSPECIFIED = 0;
  HELD_ROLL_KIND_WEAPON_ATTACK = 1;
  HELD_ROLL_KIND_SPELL_ATTACK = 2;
  HELD_ROLL_KIND_EFFECT_SAVE = 3;
  HELD_ROLL_KIND_CONCENTRATION_SAVE = 4;
  HELD_ROLL_KIND_SCENE_CHECK = 5;
  HELD_ROLL_KIND_GROUP_CHECK = 6;
  HELD_ROLL_KIND_TRAP_SEARCH = 7;
  HELD_ROLL_KIND_HINT_TRY = 8;
  // The death saving throw of a character at 0 hit points (RollDeathSave), asked about Lucky's reroll of a 1 and about
  // a Bardic Inspiration die like any other saving throw (SRD 5.1).
  HELD_ROLL_KIND_DEATH_SAVE = 9;
  // A roll of a contest, an ability check (SRD 5.1): the initiator's (StartContest: a grapple, a shove, an escape) before
  // the contest is opened, or the defender's (RespondContest) before it is settled. Lucky's reroll of a 1 and a Bardic
  // Inspiration die are asked about before anything is spent or written.
  HELD_ROLL_KIND_CONTEST = 11;
  // The initiative of a character in SETUP (SubmitInitiative): a Dexterity check (SRD 5.1), so Lucky's reroll of a 1 and
  // a Bardic Inspiration die the character holds are asked about before the total is set.
  HELD_ROLL_KIND_INITIATIVE = 10;
  // The Stealth check of a Hide (SRD 5.1): Lucky's reroll of a 1 and a Bardic Inspiration die are asked about before the
  // attempt is kept for the master.
  HELD_ROLL_KIND_HIDE = 12;
  // The ability check of a Counterspell above the slot's level (AnswerReaction), made with the spellcasting ability (SRD 5.1):
  // Lucky's reroll of a 1 and a Bardic Inspiration die are asked about before the spell is countered or not.
  HELD_ROLL_KIND_COUNTERSPELL_CHECK = 13;
}

// LuckyQuestion is the halfling's "Tirou 1: rolar de novo?" (SRD 5.1, Halfling, Lucky).
message LuckyQuestion {
  // The die that shows the 1, as an index into `HeldRollOffer.d20.faces`: the one the answer rolls
  // again (0 for a single d20; with both dice on 1, the first).
  int32 lucky_index = 1;
}

// DieQuestion is the Bardic Inspiration die the roller may add (SRD 5.1).
message DieQuestion {
  // The size of the die the roller holds.
  int32 sides = 1;
  // The name of the bard that gave it.
  string from_name = 2;
}

// IndomitableQuestion is the fighter's "Falhou na salvaguarda. Usar Indomitável para rolar de novo?" (SRD 5.1,
// Fighter, Indomitable). It comes after the Lucky and the die's questions, on the saving throw as they left it:
// `HeldRollOffer.d20.total` counts the die the roller added.
message IndomitableQuestion {
  // True when the saving throw failed. Set only when the roller may know it (the table shows the DC of a
  // save, or it is a death save, whose result the owner always sees); otherwise the question comes on every
  // save the roller could use Indomitable on, and says nothing about the result.
  bool failed = 1;
}

// StrokeOfLuckQuestion is the rogue's "Errou o ataque. Usar Golpe de Sorte para acertar?" or "Falhou no teste. Usar
// Golpe de Sorte para contar o d20 como 20?" (SRD 5.1, Rogue 20, Stroke of Luck). It comes after the Lucky and the
// die's questions, on the attack or the ability check as they left it: `HeldRollOffer.d20.total` counts the die the
// roller added. `HeldRollOffer.kind` says whether it is an attack (a miss becomes a hit) or a check (the d20 counts
// as 20).
message StrokeOfLuckQuestion {
  // True when the attack missed or the check failed. Set only when the roller may know it (the armor class of an
  // attack stays on the server but the player is told the hit; a check against a DC the table shows); otherwise
  // the question comes on every attack or check the roller could use Stroke of Luck on, and says nothing about
  // the result.
  bool failed = 1;
}

// HeldRollOffer is the question a roll that waits asks, whichever roll it is: the d20 was rolled and
// kept, nothing was resolved or written, and the roller decides before the result is told (SRD 5.1:
// the creature can wait until after it rolls the d20 and must decide before the GM says whether the roll
// succeeds). The Lucky question comes first; the die's comes after it, on the new roll, and Indomitable's or Stroke of Luck's after the die's (a save and an attack or check never meet, so only one of them comes). It carries
// what the roller already sees (the d20, the bonus, the die's size and giver), never a DC, an armor
// class or an NPC's number. Only whoever may answer it gets it: the roller's player and the master
// (RN-10, RN-20).
message HeldRollOffer {
  // The held roll (a UUID).
  string hold_id = 1;
  HeldRollKind kind = 2;
  // The roller in a combat (a combatant's ID); empty out of a combat.
  string combatant_id = 3;
  // The roller's character, for a player's character only; empty for an NPC and a creature.
  string character_id = 4;
  // The roller's name as this viewer reads it (the master's list names who rolled).
  string roller_label = 5;
  // The d20 (or both, with advantage or disadvantage), with the roll's bonus as the modifier: the
  // die that counts marked (`counted_index`), and the die Lucky rolled again once it was.
  DiceRoll d20 = 6;
  // The question that waits.
  oneof question {
    LuckyQuestion lucky = 7;
    DieQuestion die = 8;
    IndomitableQuestion indomitable = 12;
    StrokeOfLuckQuestion stroke_of_luck = 13;
  }
  // The attack and its target; empty for a roll that is not a weapon attack.
  string attack_key = 9;
  string target_id = 10;
  // When the roll was held (the master's controls wait for the roller's own answer a while after it).
  google.protobuf.Timestamp created_at = 11;
}

// RollAttackResponse returns the roll and the combat after it.
message RollAttackResponse {
  // The combat as the caller sees it: the action is spent.
  Encounter encounter = 1;
  AttackRoll roll = 2;
  // Set when the attack hit: the damage to roll. For the master and the
  // attacker's player only.
  PendingDamage pending_damage = 3;
  // Set instead of the outcome (`roll.outcome` is unspecified, no action is spent
  // and there is no pending damage) when the attacker holds a Bardic Inspiration
  // die: the d20 is rolled, and the player decides whether to add the die before the
  // result is told (AnswerBardicInspiration). Unset while `lucky_offer` waits.
  // Deprecated (E4-9): the question is `held_roll_offer` (answered with AnswerHeldRoll). This field is still served, for a
  // tab opened before the one question existed; it will go with the old answer RPCs.
  InspirationOffer inspiration_offer = 30 [deprecated = true];
  // Set instead of the outcome, like `inspiration_offer`, when the attacker is a
  // halfling and a d20 shows a 1: the player decides whether to roll it again before
  // the result is told (AnswerLucky). The Lucky question comes first; the die's, when
  // the attacker holds one, comes after it, on the new roll.
  // Deprecated (E4-9): the question is `held_roll_offer` (answered with AnswerHeldRoll). This field is still served, for a
  // tab opened before the one question existed; it will go with the old answer RPCs.
  LuckyOffer lucky_offer = 31 [deprecated = true];

  // The question the roll asks now, in the one shape every held roll has (HeldRollOffer), set beside
  // the deprecated `inspiration_offer` and `lucky_offer`: set instead of the result, when the
  // roll waits for an answer (AnswerHeldRoll). Whoever may answer gets it; nobody else does (RN-10).
  HeldRollOffer held_roll_offer = 32;
}

// RollDamageRequest rolls the damage of a hit.
message RollDamageRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string pending_damage_id = 3;
  string idempotency_key = 4;
  // How the damage comes: exactly one.
  oneof roll {
    // True: the app rolls the dice on the server.
    bool roll_in_app = 5;
    // The sum of the physical dice, without the modifier and without
    // PendingDamage.critical_max: between the number of dice to roll
    // (PendingDamage.dice_count, doubled or not by the critical rule) and that
    // number times their faces. With PendingDamage.extra_dice_count, those dice
    // count in both numbers.
    int32 typed_sum = 6;
  }
  // The extras the player marked (PendingDamage.parts with `choosable`), with the slot
  // of Divine Smite. The server checks each condition again and refuses a marked extra
  // that does not hold (EXTRA_NOT_AVAILABLE). Unset marks the ones that come marked
  // (`selected`), so a client that knows nothing of extras gets the same damage as
  // a player who changes nothing.
  repeated SelectedExtra selected_extras = 7;
  // True when `selected_extras` is the whole choice, even if empty.
  bool extras_chosen = 8;
  // Physical dice: one sum for each group of dice (the weapon and each extra with
  // dice), instead of `typed_sum`, which stays for a damage of one group. The sum of
  // each is between its dice and its dice times their faces.
  repeated TypedPart typed_parts = 9;
}

// RollDamageResponse returns the damage after the roll.
message RollDamageResponse {
  Encounter encounter = 1;
  // APPLIED for an NPC target or a heal; ROLLED, waiting for the master, for a
  // player's character.
  PendingDamage pending_damage = 2;
  // The other pending damages of the same cast that this roll settled too
  // (an area spell's damage is one roll for all), as the caller may see them.
  repeated PendingDamage cast_pending_damages = 3;
}

// ApplyPendingDamageRequest applies a rolled damage.
message ApplyPendingDamageRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string pending_damage_id = 3;
  string idempotency_key = 4;
  // The damage to apply instead of the rolled one, 0 to 9,999: the master's last
  // word. Unset applies what was rolled.
  optional int32 amount = 5;
  // The sources of the steps (PendingDamage.steps) to leave out, only the master's:
  // the table decides the damage is not halved. Ignored when `amount` is set.
  repeated string ignore_modifiers = 6;
}

// ApplyPendingDamageResponse returns the damage, APPLIED.
message ApplyPendingDamageResponse {
  Encounter encounter = 1;
  PendingDamage pending_damage = 2;
}

// DiscardPendingDamageRequest drops a damage.
message DiscardPendingDamageRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string pending_damage_id = 3;
  string idempotency_key = 4;
}

// DiscardPendingDamageResponse returns the damage, DISCARDED.
message DiscardPendingDamageResponse {
  Encounter encounter = 1;
  PendingDamage pending_damage = 2;
}

// TakeActionRequest takes a standard action.
message TakeActionRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  // The action, as in rules.v1.Action.key: "standard:dash", "standard:dodge",
  // "feature:second-wind"...
  string action_key = 4;
  string idempotency_key = 5;
  // How the dice come, for an action that rolls (Retomar o fôlego: a d10);
  // ignored by the others.
  oneof roll {
    // True: the app rolls the dice on the server.
    bool roll_in_app = 6;
    // The sum of the physical dice, without the modifier: 1 to 10 for the d10
    // of Retomar o fôlego.
    int32 typed_sum = 7;
  }
  // True: the action is the extra action an effect gives (Velocidade): Disparada,
  // Desengajar, Esconder or Usar um objeto spend that action instead of the Action.
  bool use_extra_action = 100;
  // True: the action is "feature:rage" and the barbarian goes into a frenzy for this rage
  // (SRD 5.1, Barbarian, Path of the Berserker, Frenzy). Each of its later turns offers one
  // melee weapon attack as a bonus action, and when the rage ends it gains one level of
  // exhaustion. Only a barbarian with the Frenzy feature may ask; any other combatant is
  // refused with `failed_precondition` (EncounterBlocked FRENZY_UNAVAILABLE). Ignored by an
  // action that is not "feature:rage"; false is a plain rage.
  bool frenzy = 101;
  // "feature:channel-divinity-preserve-life" (Canalizar Divindade: Preservar a Vida, SRD 5.1, Life Domain): the
  // hit points to restore to each creature within 30 ft of the cleric. Their total is at most five times the
  // cleric's level; each creature is restored to no more than half of its hit point maximum (what would pass it is
  // not spent), and an undead or a construct cannot be restored. A creature more than 30 ft away or an undead or
  // construct is refused with `failed_precondition` (EncounterBlocked CHANNEL_DIVINITY_TARGET), and so is a total
  // above the limit (CHANNEL_DIVINITY_TOO_MUCH). With no entry the points go to the cleric's side, the creature
  // hurt the most in proportion first, each as far as half its maximum. Ignored by any other action.
  repeated PreserveLifeHeal preserve_life = 102;
  // A feature action of the table's content that spends several points of its resource and lets the player choose
  // (Action.cost_max above Action.cost): how many to spend, from `cost` to `cost_max` or what is left. 0 takes the
  // cost, the least. The server reads the points left in the same transaction as the use and refuses a number outside
  // the range with `invalid_argument` (nothing is spent); it never trusts the client with more than this number.
  // Ignored by an action whose cost is fixed. An action that spends a spell slot (Action.spends_slot) reads it as the
  // level of the slot, 1 to 9: a level with no free slot is refused with `failed_precondition` (ResourceBlocked
  // NO_FREE_SLOT, nothing is spent) and a level outside 1 to 9 with `invalid_argument`.
  int32 spend = 103;
  // A feature action of the table's content that heals or gives temporary hit points (Action.heal, Action.temp_hp):
  // the combatant that gets them, the actor itself or one ally (another player's character). Empty: the actor. An NPC,
  // a creature or a combatant the caller does not see is refused with `invalid_argument`; a dead target with
  // `failed_precondition` (EncounterBlocked TARGET_DEAD), and then nothing is spent. Ignored by any other action.
  string heal_target_combatant_id = 104;
  // True: the action is the card of a temporary state (a table feature's state effect,
  // rules.v1.Action.state_key) and the player ends the state that is on ("Encerrar");
  // false starts it ("Ativar"), spending the action's economy and the use of its resource.
  // Starting a state that is on is refused with `failed_precondition` (EncounterBlocked
  // STATE_ALREADY_ON), and so is ending one that is not (STATE_NOT_ON); nothing is spent.
  // Ignored by an action that is not a state's.
  bool end_state = 105;
}

// PreserveLifeHeal is the hit points the cleric gives one creature with Preserve Life.
message PreserveLifeHeal {
  string combatant_id = 1;
  // 1 to 9,999 (the total is checked against five times the cleric's level).
  int32 hit_points = 2;
}

// TakeActionResponse returns the combat after the action.
message TakeActionResponse {
  Encounter encounter = 1;
  // The roll of an action that rolls, for the master and the combatant's
  // player. Unset for the others.
  DiceRoll roll = 2;
  // Retomar o fôlego: the hit points healed (up to the maximum). Unset for the
  // others.
  optional int32 healed = 3;
  // What Canalizar Divindade did, for the master and the combatant's player: the hit points each creature got
  // (Preserve Life) or each undead's saving throw and whether it was turned (Turn Undead). Unset for any other
  // action.
  ChannelDivinityResult channel_divinity = 4;
  // A feature action of the table's content: the points of its resource the use spent (the `spend` picked, or the
  // cost). Unset for any other action.
  optional int32 spent = 5;
  // A feature action that gives temporary hit points: how many the target gained (they do not stack: the larger
  // number is kept, so it can be less than the action gives, or 0). Unset when the action gives none. For the master
  // and the combatant's player, like `healed`.
  optional int32 temp_hp_gained = 6;
}

// HookResult is what an on_event hook of the character did (a rest, a failed death save, dropping to 0 hit points):
// the feature that has it and what it gave. The numbers follow the audience of the line that carries it; the name does
// too.
message HookResult {
  // The feature, trait or feat that has the hook, in Portuguese. Empty where the line cannot name it: `source` is its key.
  string source_name_pt = 1;
  // The hit points regained (up to the maximum) and the temporary hit points gained.
  int32 healed = 2;
  int32 temp_hp_gained = 3;
  // The resource the hook spent and how many uses, and the one it restored and how many came back.
  string spent_resource = 4;
  int32 spent = 5;
  string restored_resource = 6;
  int32 restored = 7;
  // The content key of the feature that has the hook ("feat:..."), for the clients that name it themselves.
  string source = 8;
}

// ChannelDivinityResult is what a Channel Divinity action did, creature by creature.
message ChannelDivinityResult {
  // Preserve Life: the hit points each creature regained (after the half-maximum limit), in the order asked.
  repeated ChannelDivinityHeal heals = 1;
  // Turn Undead: each undead that had to save, in the order of the combat.
  repeated ChannelDivinityTurn turns = 2;
  // Turn Undead: the cleric's save DC.
  int32 save_dc = 3;
}

// ChannelDivinityHeal is what Preserve Life gave one creature.
message ChannelDivinityHeal {
  string combatant_id = 1;
  string label = 2;
  // Asked is what the cleric asked for; Healed what the creature regained after the limit of half its maximum.
  int32 asked = 3;
  int32 healed = 4;
  int32 hit_points_after = 5;
}

// ChannelDivinityTurn is the Wisdom saving throw of one undead against Turn Undead.
message ChannelDivinityTurn {
  string combatant_id = 1;
  string label = 2;
  // The d20 that counted, the bonus, the total and the DC it was compared with.
  int32 d20 = 3;
  int32 modifier = 4;
  int32 total = 5;
  // True: it failed and is turned for one minute (a lasting effect on it).
  bool turned = 6;
}

// AdjustCombatantHitPointsRequest is the master's correction of an NPC.
message AdjustCombatantHitPointsRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  string idempotency_key = 4;
  // At most one of these.
  oneof change {
    // Damage taken: 0 to 9,999. Temporary hit points go first.
    int32 damage = 5;
    // Hit points healed: 0 to 9,999, up to the maximum.
    int32 heal = 6;
    // The exact hit points: 0 to the maximum.
    int32 hit_points = 7;
  }
  // The new temporary hit points: 0 to 999. Set after the change above, if
  // there is one.
  optional int32 hit_points_temporary = 8;
}

// AdjustCombatantHitPointsResponse returns the combat after the change.
message AdjustCombatantHitPointsResponse {
  Encounter encounter = 1;
}

// UndoLastActionRequest takes back the last action.
message UndoLastActionRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  // The event the caller sees as the last action (a UUID): the
  // undoable_event_id of ListCombatLog.
  string expected_event_id = 3;
  string idempotency_key = 4;
}

// UndoLastActionResponse returns the combat after the undo.
message UndoLastActionResponse {
  Encounter encounter = 1;
}

// SpellSlot is the slot a spell is cast with.
message SpellSlot {
  // The slot level, 1 to 9.
  int32 level = 1;
  // True for a Warlock's pact magic slot (level is then its level).
  bool pact = 2;
}

// SpellTarget is one target of a spell.
message SpellTarget {
  // The combatant (a UUID).
  string combatant_id = 1;
  // Magic Missile: the darts that go to this target, at least 1. Scorching Ray:
  // the rays that go to this target (0 counts as 1); each ray is its own spell
  // attack.
  int32 darts = 2;
  // Revivify only: the dead creature the spell touches, a combatant of the combat
  // (PreviewRevivify offers them). It replaces combatant_id, which stays empty. The
  // server checks it again: dead, within touch, within the 10 rounds of the window,
  // seen by the caster and not marked by the master. A target that is not valid is
  // `failed_precondition` with no reason, or `not_found` for a combatant the caller may
  // not see, and nothing is spent.
  string dead_target_id = 3;
}

// CastSpellRequest casts a spell.
message CastSpellRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  // The combatant that casts (a UUID).
  string caster_id = 3;
  // The spell, one of GetTurnOptions' options.spells keys, or a save cantrip of
  // options.attacks.
  string spell_key = 4;
  // The slot. Unset for a cantrip.
  SpellSlot slot = 5;
  // Who it touches. Empty for a spell that stays on the caster, and for an area
  // that meets nobody.
  repeated SpellTarget targets = 6;
  string idempotency_key = 7;
  // How the d20 of a spell attack comes: exactly one for a spell with an attack
  // roll, ignored by the others. roll_in_app rolls one d20 for each target;
  // d20_face is the face of a physical die and fits a single target.
  oneof roll {
    // True: the app rolls the d20 on the server (RN-18).
    bool roll_in_app = 8;
    // The face of a physical d20, 1 to 20.
    int32 d20_face = 9;
    // A spell that rolls a pool of dice (Sono, Leque Cromático: effect_kind
    // SPELL_EFFECT_KIND_POOL): the sum of the physical dice, from the number of
    // dice to the most they can show, without a modifier (the spell's dice are
    // in the answer). The pool is rolled by the server with roll_in_app, and one
    // of the two is required for such a spell. The campaign's dice setting binds
    // a player here as on every roll (RN-18).
    int32 pool_sum = 10;
  }
  // What a summoning spell (Conjurar Animais) brings, the creatures that join
  // the combat. Required for such a spell and refused for any other. The d20 of
  // `roll_in_app` or `d20_face` is then the initiative roll of the whole group
  // (RN-18, one roll for the creatures of a casting); the spell rolls nothing
  // else. The campaign's dice setting binds a player here as on every roll.
  SummonChoice summon = 11;
  // The damage type the caster picks, for a spell whose damage types are a
  // choice (SpellDetails.damage_choice): a content key such as
  // "damage-type:radiant", one of the spell's own. Empty takes the first. Refused
  // with `invalid_argument` for a spell with nothing to pick or a type that is
  // not one of its types.
  string damage_type_key = 12;
  // The Metamagic the sorcerer uses on this casting (SRD 5.1, Sorcerer): one
  // option, or Empowered Spell with one other. Each must be an option the
  // character knows and the spell takes at this slot (SpellOption.metamagic_options);
  // otherwise `invalid_argument` with the reason. The cost is spent from the sorcery
  // points with the slot.
  repeated MetamagicChoice metamagic = 30;
  // Where an area spell is placed, for a spell that has a placement on a map with
  // a grid (see CastSpell and PreviewSpellArea). At most one is set: a point for a
  // sphere or a cylinder, a direction for a cone, a line and a cube. A sphere or
  // a cylinder that is Self takes neither.
  oneof area {
    SpellOrigin origin = 13;
    SpellDirection direction = 14;
  }
  // The master only: whether the hidden creatures the area hits appear to the
  // players, for this cast. Without it the table rule decides. A player who sends
  // it gets `permission_denied`, before anything else is checked.
  optional bool reveal_hidden = 15;
  // The mode of a spell attack's d20, instead of the server's suggestion, with the
  // reason, and the physical d20 pair; as in RollAttackRequest. They count for every
  // target the cast attacks. A player may roll the suggestion or disadvantage; a
  // better mode is the master's to set (RequestRollMode asks for the attacks of the
  // sheet, the weapons and the attack cantrips, which RollAttack rolls).
  RollMode roll_mode = 16;
  string mode_reason = 17;
  repeated int32 d20_faces = 18;
  // Revivify only: the caster confirmed having the diamonds (worth 300 gp, which the
  // spell consumes). The app keeps no inventory, so this is a reminder, and the log says
  // it was spent. Required for Revivify and refused for any other spell.
  bool material_confirmed = 19;
  // Enhance Ability only: the ability the target is enhanced in ("str", "dex", "con", "int",
  // "wis" or "cha"; SRD 5.1: Bull's Strength, Cat's Grace, Bear's Endurance, Fox's Cunning,
  // Owl's Wisdom, Eagle's Splendor). Required for that spell, `invalid_argument` otherwise
  // missing or unknown; ignored by every other spell.
  string ability_key = 20;
  // Sculpt Spells (SRD 5.1, School of Evocation wizard, level 2): the creatures of the
  // area the caster spares, an evocation spell that affects other creatures the caster
  // can see. Each one succeeds on its saving throw by itself (no roll; its save result
  // has `sculpted`) and takes no damage when the spell would deal half on a success.
  // At most 1 + the level the spell is cast at (0 for a cantrip, so 1); each must be a
  // creature the spell reaches and the caller sees, never the caster. Refused with
  // `invalid_argument` for a caster without the feature (SpellOption.sculpt_spells is
  // false), a spell that is not of evocation, a creature that is not among the targets
  // or is the caster, a repeated one and too many. Empty is a cast without it.
  repeated string sculpted_ids = 31;
  // A teleport spell on a map with a grid (Passo Nebuloso): the square the caster
  // lands on, chosen by the caster's player (or by the master, for an NPC or on a
  // player's behalf). A player's character must give it (DESTINATION_REQUIRED); without
  // it, for the master, the spell changes nothing on the map and the master moves the
  // token. The server checks it before anything is spent: a
  // square of the grid (otherwise `invalid_argument`), within the spell's reach
  // (30 ft, 6 squares, by the grid's own distance; otherwise `failed_precondition`
  // with TELEPORT_TOO_FAR), free of any creature and of walls and, for a player,
  // seen by the caster (otherwise `failed_precondition` with DESTINATION_UNAVAILABLE,
  // which never says whether a creature the player does not see is the reason, RN-10).
  // The master is not held to sight and gets SQUARE_OCCUPIED or WALL_ON_SQUARE. The
  // teleport provokes no opportunity attack and spends no movement; the undo puts the
  // caster back. It is `invalid_argument` for any other spell, and in a combat
  // without a map.
  SpellOrigin destination = 32;
  // The trait, feat or feature whose granted_spell effect casts the spell (the
  // `grant.source_key` of the turn option): the cast takes no slot, spends a use of the
  // grant's resource unless it is at will, the spell is cast at its own level and the spell
  // attack and the save DC are the grant's. With a `slot` it casts through the slot instead
  // (when the grant allows it). Empty for a spell of the character's classes.
  string granted_by = 33;
  // The cast options of the character's table features the caster ticked
  // (SpellOption.table_options that are not always on). Each must be an option the
  // spell takes at this slot, with a use left when it names a resource; otherwise
  // `invalid_argument` or, with no use left, `failed_precondition` with NO_USES. The
  // always-on ones apply without being named. The uses are spent with the slot.
  repeated SpellOptionChoice spell_options = 34;
}

// SpellOptionChoice is a table cast option ticked on a casting.
message SpellOptionChoice {
  // The option's feature key.
  string key = 1;
  // damage_type_swap: the new damage type, one of the option's damage_type_keys.
  string damage_type_key = 2;
}

// MetamagicChoice is one Metamagic option on a casting.
message MetamagicChoice {
  // The option, "feature:metamagic-twinned-spell".
  string key = 1;
  // Twinned Spell: the second target (a combatant's ID); the first is the cast's
  // target.
  repeated string target_ids = 2;
  // Careful Spell: the creatures that pass the saving throw on their own, up to
  // the Charisma modifier (at least one).
  repeated string careful_ids = 3;
  // Heightened Spell: the target with disadvantage on its first saving throw.
  string heightened_id = 4;
}

// SpellOrigin is a square of the grid the caster chose as the point of origin of an
// area: col 0 to grid_columns - 1 and row 0 to grid_rows - 1, from the top left.
message SpellOrigin {
  int32 col = 1;
  int32 row = 2;
}

// SpellDirection is one of the eight directions a cone, a line or a cube points
// (every 45 degrees): `dx` is -1 (west), 0 or 1 (east), `dy` is -1 (north), 0 or 1
// (south), and never both 0.
message SpellDirection {
  int32 dx = 1;
  int32 dy = 2;
}

// SpellArea is where an area spell landed: the point of origin it really had (the
// caster's square for a cone, a line and a cube) and the squares it covers, after
// the line of effect cut it (walls and doors cut it; cover does not).
message SpellArea {
  SpellOrigin origin = 1;
  repeated SpellOrigin squares = 2;
}

// MoveSpellZoneRequest moves a zone.
message MoveSpellZoneRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  // The zone (Encounter.zones.id).
  string zone_id = 3;
  // The new point of origin.
  SpellOrigin origin = 4;
  // Makes a retry harmless.
  string idempotency_key = 5;
}

// EndSpellZoneRequest ends a zone.
message EndSpellZoneRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  // The zone (Encounter.zones.id).
  string zone_id = 3;
  // Makes a retry harmless.
  string idempotency_key = 4;
}

// EndSpellZoneResponse returns the combat after the end.
message EndSpellZoneResponse {
  Encounter encounter = 1;
}

// MoveSpellZoneResponse returns the combat after the move.
message MoveSpellZoneResponse {
  Encounter encounter = 1;
}

// PreviewSpellAreaRequest places an area spell for the preview.
message PreviewSpellAreaRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  // The combatant that casts (a UUID).
  string caster_id = 3;
  // The spell, one of GetTurnOptions' options.spells keys.
  string spell_key = 4;
  // The slot, as in CastSpellRequest. Unset for a cantrip.
  SpellSlot slot = 5;
  // Where it is placed: as in CastSpellRequest.
  oneof area {
    SpellOrigin origin = 6;
    SpellDirection direction = 7;
  }
  // As CastSpellRequest.granted_by: the grant the spell would be cast through ("" for a spell of the classes).
  string granted_by = 8;
}

// PreviewSpellAreaResponse is who an area reaches.
message PreviewSpellAreaResponse {
  // The point of origin the area really has: the one asked for, or the near side
  // of a wall for a player's point behind it; the caster's square for a cone, a
  // line and a cube.
  SpellOrigin origin = 1;
  // The squares inside, in rows from the top.
  repeated SpellOrigin squares = 2;
  // The creatures inside, as the caller sees them, in the combat's order: the
  // caster too, when inside.
  repeated AreaTarget targets = 3;
  // True when the spell's saving throw is a Dexterity one, the only save cover
  // helps (SRD, "Cover"); with another ability each target's `cover` is NONE and
  // the screen says the spell gets no cover bonus.
  bool cover_counts = 4;
  // The most the area can reach from the caster, in feet: the spell's range for a
  // sphere or a cylinder, 0 for a spell that comes out of the caster. The screen
  // dims the squares beyond it.
  int32 range_ft = 5;
  // True when the point of origin is not the one asked for (a wall was in the
  // way).
  bool moved = 6;
}

// AreaTarget is a creature inside a placed area.
message AreaTarget {
  string combatant_id = 1;
  string label = 2;
  // How hurt it is, as a word: never hit points (RN-20). Unset for a player's
  // character, as in the order: its hit points are on the table and the app reads
  // them from the combatant.
  CombatantState state = 3;
  // The cover it has against the point of origin (D4), where it comes from, and
  // only when the save is Dexterity (see `cover_counts`), NONE when it has none
  // and unset when the save gets none; never TOTAL: a creature with total cover is not
  // inside.
  CoverDegree cover = 4;
  CoverSource cover_source = 5;
  // True for a creature on the caster's side: a player's character or creature
  // for a player caster, an NPC for the master's. The caster itself has `self`.
  bool ally = 6;
  bool self = 7;
  // The distance in feet from the point of origin, the squares between the
  // centers rounded down times 5 ft (RN-21).
  int32 distance_ft = 8;
  // Only the master gets it: the creature is hidden from the players.
  bool hidden = 9;
}

// ResolveHiddenRevealRequest answers a question of Encounter.pending_hidden_reveals.
message ResolveHiddenRevealRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  // The question (a UUID).
  string pending_reveal_id = 3;
  // True: the hidden creatures appear to the players. False: they stay hidden.
  bool reveal = 4;
  string idempotency_key = 5;
}

// ResolveHiddenRevealResponse returns the combat as it is now.
message ResolveHiddenRevealResponse {
  Encounter encounter = 1;
}

// SummonChoice is what a casting of a summoning spell brings: one of the
// spell's options and the creatures, chosen from what rules.SummonOptions
// offers for the slot and the character.
message SummonChoice {
  // The index of the option, from 0 (Conjurar Animais has four: one creature of
  // challenge rating 2, two of 1, four of 1/2, eight of 1/4; Convocar Familiar
  // and Animar Mortos have one).
  int32 option = 1;
  // One content key per creature ("monster:dire-wolf"; a key repeats for
  // several of one kind), exactly the number the option and the slot allow.
  repeated string creature_keys = 2;
  // What to call each creature, in the same order, 1 to 40 characters, one line
  // (free text by a player: "Nanquim"). Empty, or one for each creature; a
  // blank name takes the creature's Portuguese name, numbered when several
  // share it.
  repeated string names = 3;
}

// SaveOutcome is what a target's saving throw did.
enum SaveOutcome {
  SAVE_OUTCOME_UNSPECIFIED = 0;
  // The total reached the spell's DC.
  SAVE_OUTCOME_SAVED = 1;
  // The total fell short.
  SAVE_OUTCOME_FAILED = 2;
}

// SaveResult is a target's saving throw against a spell.
message SaveResult {
  SaveOutcome outcome = 1;
  // The d20 plus the target's saving throw bonus. Only the master and the
  // target's own player; everyone else gets the outcome as a word (an NPC's dice
  // never reach a player, RN-20).
  DiceRoll roll = 2;
  // False when the target is a basic-sheet NPC, which has no saving throw bonus:
  // the roll is d20 + 0 and the master may overrule it. Only the master.
  bool bonus_known = 3;
  // The spell's save DC. Only the master and the caster's player.
  int32 dc = 4;
  // The mode the target rolled the save with and why, as the caller may read it
  // (the target's player, the master; an NPC's never reach a player, RN-20). A
  // stunned, paralyzed, unconscious or petrified target fails a Strength or
  // Dexterity save without rolling: `auto_failed` is true and there is no roll.
  RollMode mode = 5;
  repeated AdvantageSource sources = 6;
  bool auto_failed = 7;
  // The target failed by itself, with no d20: a Strength or Dexterity saving throw of a
  // Paralisado, Atordoado, Inconsciente or Petrificado creature (SRD, Conditions).
  bool auto_fail = 100;
  // The target was spared by the caster's Sculpt Spells: it succeeded without a roll
  // (`outcome` is SAVED, `roll` is unset) and took no damage if the spell halves.
  bool sculpted = 101;
}

// SpellTargetResult is what a cast did to one target.
message SpellTargetResult {
  string combatant_id = 1;
  // Magic Missile: the darts that went to it.
  int32 darts = 2;
  // A spell attack: what the roll did. Unspecified for the others.
  AttackOutcome outcome = 3;
  // A spell attack: the d20. Only the master and the caster's player.
  DiceRoll attack_roll = 4;
  // A saving throw spell: the target's save.
  SaveResult save = 5;
  // The pending damage (or heal) the cast opened for this target, to roll with
  // RollDamage; empty when none (a miss, a save that avoids it, a spell with no
  // damage). Only for the master and the caster's player.
  string pending_damage_id = 6;
  // A spell that reads hit points (Sono, Palavra de Poder...): what it did to
  // this target. Unset for any other spell.
  SpellEffectResult effect = 7;
  // The cover the target had against the caster for a spell attack or a
  // Dexterity save (D4), and where it came from.
  CoverDegree cover = 8;
  CoverSource cover_source = 9;
  // The other pending damages the cast opened for this target when the spell
  // deals more than one damage type (Tempestade de Gelo: pancada and frio), in the
  // spell's order after `pending_damage_id`. Same rules as `pending_damage_id`.
  repeated string more_pending_damage_ids = 10;
  // A spell attack: the mode the d20 rolled with, the circumstances as the caller may
  // read them, and whether a hit was a critical hit by the target's condition.
  RollMode attack_mode = 11;
  repeated AdvantageSource attack_sources = 12;
  // A spell that leaves an effect that lasts (Bênção, Perdição, Imobilizar Pessoa,
  // Velocidade, Teia, Fogo das Fadas): whether it took hold on this target.
  // Unspecified for the other spells.
  LastingEffectOutcome lasting_effect = 100;
  // Only the master: why a spell had no effect ("alvo não é humanoide"). A player
  // reads only "A magia não teve efeito." (RN-20).
  string no_effect_reason_master = 101;
  // A spell attack: the Bardic Inspiration die the player added after the d20, already in
  // the total of `attack_roll`.
  repeated BonusDie bonus_dice = 13;
}

// SpellEffectKind is how a spell that reads hit points works. The same four kinds
// as effects/spells.json.
enum SpellEffectKind {
  SPELL_EFFECT_KIND_UNSPECIFIED = 0;
  // A pool of dice is rolled and the creatures are affected in ascending order of
  // current hit points, each one that fits in what is left (Sono, Borrifo de
  // Cores).
  SPELL_EFFECT_KIND_POOL = 1;
  // A creature at or below a number of hit points is affected (Palavra de Poder:
  // Atordoar, Matar).
  SPELL_EFFECT_KIND_THRESHOLD = 2;
  // Works only on a creature at 0 hit points (Estabilizar).
  SPELL_EFFECT_KIND_ZERO_HP = 3;
  // A fixed heal that also ends conditions (Cura Completa).
  SPELL_EFFECT_KIND_FLAT_HEAL = 4;
  // The targets gain temporary hit points, not healing (Vitalidade Falsa). The
  // roll is the pool_roll of the cast; `healed` of a target is what it gained.
  SPELL_EFFECT_KIND_TEMP_HP = 5;
  // The targets' maximum and current hit points both rise (Ajuda): the bonus is kept
  // on the target (`hit_points_max_bonus`), `healed` of a target is how much it rose,
  // and a target at 0 hit points wakes up. Two Ajudas never add up: the stronger one
  // stands (a weaker one on top of it changes nothing, `healed` is 0).
  SPELL_EFFECT_KIND_MAX_HP = 6;
  // The target was dead and lives again with 1 hit point (Revivificar, revivify.proto).
  // `hit_points_before` (0) and `hit_points_after` and `revived_character_id` say it; the
  // dead creature is `SpellTarget.dead_target_id` and the result's combatant_id.
  SPELL_EFFECT_KIND_REVIVE = 7;
}

// SpellEffectOutcome is whether a spell that reads hit points reached a target.
// Everyone who sees the entry gets it, as a word: it never says how many hit
// points the target had (RN-20).
enum SpellEffectOutcome {
  SPELL_EFFECT_OUTCOME_UNSPECIFIED = 0;
  // The condition was given, the creature died or dropped to 0 (Matar), became
  // stable, or was healed.
  SPELL_EFFECT_OUTCOME_AFFECTED = 1;
  // "Não foi afetado": whatever the reason.
  SPELL_EFFECT_OUTCOME_NOT_AFFECTED = 2;
}

// SpellEffectReason is why a target was not affected. Only the master gets it.
enum SpellEffectReason {
  SPELL_EFFECT_REASON_UNSPECIFIED = 0;
  // A pool: its hit points were more than what was left of the pool.
  SPELL_EFFECT_REASON_ABOVE_POOL = 1;
  // A threshold: its hit points were above the limit.
  SPELL_EFFECT_REASON_ABOVE_LIMIT = 2;
  // A pool: it was unconscious already, or at 0 hit points, and the pool went
  // past it.
  SPELL_EFFECT_REASON_SKIPPED = 3;
  // A zero-hit-point spell: the target was not at 0.
  SPELL_EFFECT_REASON_NOT_AT_ZERO = 4;
}

// SpellEffectResult is what a spell that reads hit points did to one target.
message SpellEffectResult {
  SpellEffectOutcome outcome = 1;
  // Why it was not affected. Only the master.
  SpellEffectReason reason = 2;
  // The target's hit points when the spell reached it. Only the master: a
  // player never gets an enemy's hit points. (A player's character's hit points
  // are on the table anyway, but the cast does not repeat them.)
  optional int32 hit_points_before = 3;
  // A pool: what was left of it after this target, and the target's place in the
  // order the pool went through the creatures (1 is the lowest hit points). Only
  // the master: the order of the targets in the list is the caster's, and the
  // order here would tell the others who has fewer hit points.
  optional int32 pool_left = 4;
  optional int32 pool_order = 5;
  // A heal: how many hit points the target regained, up to its maximum. Only the
  // master and the target's own player: on an NPC the amount would tell the
  // caster how many hit points it lacked.
  optional int32 healed = 6;
  // For Aid (SPELL_EFFECT_KIND_MAX_HP): what the target got. Everyone gets it: it
  // only says which of two public cases applied (the target stood; it was at 0 hit
  // points and woke up).
  SpellEffectGain gain = 7;
  // For Aid and Revivify: the target's hit points after it, so the result reads "PV 0 → 5
  // de 45" (Revivify: 1). Only the master and the target's own player, as `healed` and
  // `hit_points_before`.
  optional int32 hit_points_after = 8;
  // For Aid: the target's maximum after it.
  optional int32 hit_points_max_after = 9;
  // Revivify, for a player's character: the character that lives again (a UUID), so the app
  // can read it again. Empty for an NPC. Everyone who gets the entry: it is a name the table
  // already knows.
  string revived_character_id = 10;
}

// SpellEffectGain is what Aid gave one target.
enum SpellEffectGain {
  SPELL_EFFECT_GAIN_UNSPECIFIED = 0;
  // The target stood: its maximum and current hit points both rose.
  SPELL_EFFECT_GAIN_MAXIMUM = 1;
  // No longer produced: Ajuda gives no temporary hit points (they would not wake
  // anyone, and the spell says the maximum rises).
  SPELL_EFFECT_GAIN_TEMPORARY = 2;
  // The target was at 0 hit points: the maximum rose too, and the current hit points
  // woke it up (a player's character wakes with its death saves cleared).
  SPELL_EFFECT_GAIN_CURRENT = 3;
}

// CastSpellResponse returns the combat and what the cast did.
message CastSpellResponse {
  Encounter encounter = 1;
  SpellCast cast = 2;
  // A summoning spell: the combatants (UUIDs) that joined the combat, in the
  // order of `summon.creature_keys`. They share one initiative total, so they
  // take a joint turn. Empty for any other spell.
  repeated string summoned_combatant_ids = 3;
  // An area spell placed on the map: where it landed (the master's, the caster's
  // player's: the map as the caller knows it). Unset for any other cast.
  SpellArea area = 4;
  // The hidden creatures the area hit (UUIDs). Only the master gets them: empty
  // for a player, who is told nothing that names or counts a hidden creature
  // (RN-10).
  repeated string hidden_hits = 5;
  // The question this cast opened for the master (Encounter.pending_hidden_reveals),
  // when the table rule is "Perguntar a cada vez" and a player cast. Only the master
  // gets it.
  string pending_reveal_id = 6;
  // Set instead of `cast` when the caster's player holds a Bardic Inspiration die and the
  // spell is an attack roll against a single target: the d20 is rolled and kept, nothing is
  // spent or written (no slot, no action, no hit, no damage), and
  // ResourceService.AnswerOutsideInspiration settles the cast (SRD 5.1: the die may be
  // added after the d20, before the result is told). A cast with several targets, a
  // cantrip's attack (RollAttack holds those) and a cast that waited for a reaction window
  // do not ask.
  // Deprecated (E4-9): the question is `held_roll_offer` (answered with AnswerHeldRoll). This field is still served, for a
  // tab opened before the one question existed; it will go with the old answer RPCs.
  OutsideInspirationOffer inspiration_offer = 7 [deprecated = true];
  // Set instead of `cast`, like `inspiration_offer`, when the caster is the player's own
  // halfling and a d20 of that spell attack shows a 1: the player decides whether to roll it
  // again before the result is told (ResourceService.AnswerOutsideLucky). The Lucky question
  // comes first; the die's, when the caster holds one, comes after it, on the new roll.
  // Deprecated (E4-9): the question is `held_roll_offer` (answered with AnswerHeldRoll). This field is still served, for a
  // tab opened before the one question existed; it will go with the old answer RPCs.
  LuckyOffer lucky_offer = 8 [deprecated = true];

  // The question the roll asks now, in the one shape every held roll has (HeldRollOffer), set beside
  // the deprecated `inspiration_offer` and `lucky_offer`: set instead of the result, when the
  // roll waits for an answer (AnswerHeldRoll). Whoever may answer gets it; nobody else does (RN-10).
  HeldRollOffer held_roll_offer = 9;
}

// SpellCast is a cast, as the caller may see it.
message SpellCast {
  // Stable ID of the cast (a UUID): the cast_id of its pending damages.
  string cast_id = 1;
  string spell_key = 2;
  // The slot spent. Unset for a cantrip.
  SpellSlot slot = 3;
  repeated SpellTargetResult targets = 4;
  // True when the spell needs concentration: the caster is concentrating on it now.
  bool concentrating = 5;
  // The spell the caster stopped concentrating on to cast this one (RN-22).
  string concentration_ended_spell_key = 6;
  // The pending damages and heals the cast opened, for the master and the
  // caster's player only.
  repeated PendingDamage pending_damages = 7;
  // A spell that reads hit points: how it works. Unspecified for any other spell.
  SpellEffectKind effect_kind = 8;
  // A pool: the caster's roll of it, `5d8 (2, 4, 1, 5, 3) = 15`, with the faces
  // empty for a physical die (pool_sum). Only the master and the caster's player;
  // nobody else sees the pool (RN-20).
  DiceRoll pool_roll = 9;
  // The condition the spell gives the creatures it affects ("condition:
  // unconscious"), a public tag. Empty when it gives none: a threshold spell that
  // kills (Palavra de Poder Matar), a zero-hit-point spell, a heal.
  string effect_condition_key = 10;
  // A threshold: the most hit points a creature may have to be affected (150,
  // 100). Only the master.
  optional int32 effect_threshold = 11;
  // The Metamagic options the casting used and the sorcery points they took
  // (everyone who gets the cast gets them: they are the caster's choice, not a
  // secret).
  repeated string metamagic_keys = 30;
  int32 sorcery_points_spent = 31;
}

// UseReactionRequest casts Escudo against a hit.
message UseReactionRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  // The hit (a UUID), from the ReactionPrompt.
  string pending_damage_id = 3;
  // The slot Escudo is cast with: one of the prompt's.
  SpellSlot slot = 4;
  string idempotency_key = 5;
}

// ReactionOutcome is what Escudo did to the hit.
enum ReactionOutcome {
  REACTION_OUTCOME_UNSPECIFIED = 0;
  // The new armor class made the attack miss: no damage.
  REACTION_OUTCOME_STOPPED = 1;
  // The attack still hits: its damage goes on.
  REACTION_OUTCOME_STILL_HIT = 2;
}

// UseReactionResponse returns the combat and what the reaction did.
message UseReactionResponse {
  Encounter encounter = 1;
  ReactionOutcome outcome = 2;
  // The hit's pending damage after it (DISCARDED when stopped, AWAITING_ROLL when
  // it still hits). Only for the master.
  PendingDamage pending_damage = 3;
}

// DeclineReactionRequest lets a hit go.
message DeclineReactionRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string pending_damage_id = 3;
  string idempotency_key = 4;
}

// DeclineReactionResponse returns the combat after the hit went on.
message DeclineReactionResponse {
  Encounter encounter = 1;
}

// DeclineOpportunityRequest turns an opportunity offer down.
message DeclineOpportunityRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  // The offer (OpportunityOffer.id).
  string opportunity_offer_id = 3;
  string idempotency_key = 4;
}

// DeclineOpportunityResponse returns the combat after the offer was declined.
message DeclineOpportunityResponse {
  Encounter encounter = 1;
}

// SkipOpportunityRequest passes over an opportunity offer (the master).
message SkipOpportunityRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string opportunity_offer_id = 3;
  string idempotency_key = 4;
}

// SkipOpportunityResponse returns the combat after the offer was passed over.
message SkipOpportunityResponse {
  Encounter encounter = 1;
}

// DeathSaveOutcome is what a death save did.
enum DeathSaveOutcome {
  DEATH_SAVE_OUTCOME_UNSPECIFIED = 0;
  // 10 or more: one success.
  DEATH_SAVE_OUTCOME_SUCCESS = 1;
  // Less than 10: one failure.
  DEATH_SAVE_OUTCOME_FAILURE = 2;
  // A natural 1: two failures.
  DEATH_SAVE_OUTCOME_CRITICAL_FAILURE = 3;
  // A natural 20: back with 1 hit point, both counts reset.
  DEATH_SAVE_OUTCOME_REVIVED = 4;
}

// RollDeathSaveRequest rolls a death save.
message RollDeathSaveRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  string idempotency_key = 4;
  // How the d20 comes: exactly one.
  oneof roll {
    // True: the app rolls the d20 on the server (RN-18).
    bool roll_in_app = 5;
    // The face of a physical d20, 1 to 20.
    int32 d20_face = 6;
  }
}

// DeathSave is a death save and where it left the character.
message DeathSave {
  // The d20, with the Bardic Inspiration die the player added as the modifier (0 without one), and the d20 the
  // halfling's Lucky rolled again in `rerolled`.
  DiceRoll roll = 1;
  DeathSaveOutcome outcome = 2;
  // The counts after it, 0 to 3 each.
  int32 successes = 3;
  int32 failures = 4;
  // Three successes: it stays at 0 hit points and stops rolling.
  bool stable = 5;
  // Three failures: the master confirms the death. Only the master gets it; a
  // player only sees the counts.
  bool dying = 6;
  // The Bardic Inspiration die the player added to the d20 (SRD 5.1), when one was used: it moves the total, never the
  // natural 1 (two failures) or the natural 20 (back with 1 hit point).
  repeated BonusDie bonus_dice = 7;
  // The hook that ran on this failed save (an on_event "death_save_failed" effect of the character), or unset. A hook that
  // stands the character up leaves the counts at 0 and the failure is not added. For the master and the character's own
  // player.
  HookResult hook = 8;
}

// RollDeathSaveResponse returns the combat and the save.
message RollDeathSaveResponse {
  Encounter encounter = 1;
  DeathSave death_save = 2;
  // Set instead of `death_save` when the roll waits for a question: the halfling's Lucky about a 1, or the Bardic
  // Inspiration die the combatant holds (AnswerHeldRoll answers it). The d20 was rolled and kept and nothing is
  // written, the counts included. The master is asked too when he rolls for the player, and answers after the
  // player's first 10 s.
  HeldRollOffer held_roll_offer = 3;
}

// ConfirmDeathRequest confirms a death.
message ConfirmDeathRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  string idempotency_key = 4;
}

// ConfirmDeathResponse returns the combat after the death.
message ConfirmDeathResponse {
  Encounter encounter = 1;
}

// ConditionList is a set of condition labels.
message ConditionList {
  // Keys of the SRD's conditions, such as "condition:poisoned": at most 20, each
  // once.
  repeated string keys = 1;
}

// SetCombatantConditionsRequest sets labels on a combatant.
message SetCombatantConditionsRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  string idempotency_key = 4;
  // The new set of conditions, replacing the old one; empty clears them. Unset
  // leaves them as they are. Only the master.
  optional ConditionList conditions = 5;
  // True: the combatant stops concentrating. The master for anyone; a player for
  // their own character.
  bool end_concentration = 6;
}

// SetCombatantConditionsResponse returns the combat after the change.
message SetCombatantConditionsResponse {
  Encounter encounter = 1;
}

// EndConcentrationRequest ends a combatant's concentration.
message EndConcentrationRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  // The caster (a UUID).
  string combatant_id = 3;
  string idempotency_key = 4;
}

// EndConcentrationResponse returns the combat after the change.
message EndConcentrationResponse {
  Encounter encounter = 1;
}

// EndCombatEffectRequest ends a lasting effect on a combatant.
message EndCombatEffectRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  // The effect to end. Only AID: Escudo ends by itself.
  CombatEffect effect = 4;
  string idempotency_key = 5;
}

// EndCombatEffectResponse returns the combat after the change.
message EndCombatEffectResponse {
  Encounter encounter = 1;
}

// ListCombatLogRequest names the combat.
message ListCombatLogRequest {
  string campaign_id = 1;
  string encounter_id = 2;
}

// ListCombatLogResponse is the combat log.
message ListCombatLogResponse {
  // The rounds, the latest first. Round 0 never appears: the log starts when
  // the combat begins.
  repeated CombatLogRound rounds = 1;
  // The event UndoLastAction would take back now (a UUID), if any. Only the
  // master gets it; the entry it belongs to has `undoable` set.
  string undoable_event_id = 2;
}

// CombatLogRound is the entries of one round, the latest first.
message CombatLogRound {
  int32 round = 1;
  repeated CombatLogEntry entries = 2;
}

// CombatLogKind is what a combat log entry tells.
enum CombatLogKind {
  COMBAT_LOG_KIND_UNSPECIFIED = 0;
  // A class resource flow (Lay on Hands, Flexible Casting, Bardic Inspiration): the
  // actor, the target and `resource`.
  COMBAT_LOG_KIND_RESOURCE = 90;
  // The combat began (round 1).
  COMBAT_LOG_KIND_COMBAT_BEGUN = 1;
  // An attack: the attacker, the target, the roll, the outcome and, once
  // rolled, the damage (`damage`). One entry for the whole attack: the
  // damage lands in the entry of the attack that caused it.
  COMBAT_LOG_KIND_ATTACK = 2;
  // A standard action: the actor and `key`.
  COMBAT_LOG_KIND_ACTION = 3;
  // A combatant moved on its turn: the actor and `distance_ft`.
  COMBAT_LOG_KIND_MOVED = 4;
  // The master changed an NPC's hit points by hand. Master only.
  COMBAT_LOG_KIND_HIT_POINTS_ADJUSTED = 5;
  // The master hid or revealed a combatant (`now_hidden`). Master only.
  COMBAT_LOG_KIND_REVEAL_CHANGED = 6;
  // The combat ended.
  COMBAT_LOG_KIND_COMBAT_ENDED = 7;
  // A spell was cast: the caster, the slot and, in `spell`, what it did to each
  // target (the roll, the save, the damage once rolled).
  COMBAT_LOG_KIND_SPELL_CAST = 8;
  // A reaction was used: the actor and the spell (`key`, `spell`). When it
  // stopped an attack, that attack's entry says so (stopped_by_reaction).
  COMBAT_LOG_KIND_REACTION = 9;
  // A death save: the actor and `death_save`.
  COMBAT_LOG_KIND_DEATH_SAVE = 10;
  // The master confirmed a character's death: the target.
  COMBAT_LOG_KIND_DEATH_CONFIRMED = 11;
  // The conditions or the concentration of a combatant changed: the target,
  // `conditions` and `concentration_ended_key`.
  COMBAT_LOG_KIND_CONDITIONS_CHANGED = 12;
  // A member of a joint turn ended their part and the turn goes on ("Brisa
  // encerrou a parte dela"): the actor. The last part to end is not a line:
  // the turn passes. A line with a hidden member never reaches a player.
  COMBAT_LOG_KIND_TURN_PART_ENDED = 13;
  // A trap fired (MR-035): the trap's name (it is public now) and `trap`, with what
  // happened to each creature it caught. A fired trap is never a secret of
  // the master's, so every player gets the line; the dice of the other creatures
  // and every DC stay with the master (RN-10, RN-20).
  COMBAT_LOG_KIND_TRAP_TRIGGERED = 20;
  // A druid took a beast form or left it (MR-037): the actor and `wild_shape`.
  // Everyone who sees the actor gets the line; the damage the beast's fall carried
  // over to the druid is the druid's player's and the master's alone (RN-20).
  COMBAT_LOG_KIND_WILD_SHAPE = 21;
  // A move opened a closed door (RN-26, "Toren abriu a porta"): the actor and
  // `door`. On a map without the fog everyone gets the line; with the fog, the players whose character saw or remembers the door when it opened, and the mover's player (RN-10). Any combatant's move can open a door. The
  // master's undo of the move does not close the door, so the line stays.
  COMBAT_LOG_KIND_DOOR_OPENED = 22;
  // The master offered an opportunity attack in a combat without a map (RN-25,
  // OfferOpportunity): "Goblin 1 saiu do alcance de Toren", the mover as the actor
  // and the reactor as the target. Only the master, the reactor's player and the
  // mover's player get the line, as they get the offer (RN-10: a hidden combatant
  // in it keeps it from every player). The offer's answer (declined, skipped,
  // withdrawn) belongs to this line, so the master can undo it from here
  // (`undoable`); the attack of an answer is its own ATTACK line.
  COMBAT_LOG_KIND_OPPORTUNITY_OFFERED = 23;
  // The master put monsters in the combat (AddMonsters, RN-29): `monsters`, with
  // the hit points of each and the dice when they were rolled ("Bandido 1: 9 PV
  // (2d8 + 2: 3, 4)"). Only the master gets the line, and it also comes from
  // before the combat begins (round 0).
  COMBAT_LOG_KIND_MONSTERS_ADDED = 24;
  // A contest or a special action (SRD 5.1, "Contests", "Hide", "Help", "Surprise"): the
  // actor, the target and `contest`, which says what happened. Never a total (RN-20).
  COMBAT_LOG_KIND_CONTEST = 50;
  // An effect that lasts began, changed or ended, a saving throw of an effect was rolled,
  // or an effect dealt damage (RN-22): `effect`. An effect the master hides from the
  // players is a line for the master alone, and no count of them reaches a player.
  COMBAT_LOG_KIND_EFFECT = 100;
  // The level of exhaustion of a combatant changed (`effect.exhaustion_level`).
  COMBAT_LOG_KIND_EXHAUSTION = 101;
  // A reaction window was answered or closed (PM-04): `reaction_text_pt` is the
  // line, written on the server for who reads it (the master's has the NPC
  // numbers, the players' has none and never names a reactor they do not see).
  COMBAT_LOG_KIND_REACTION_WINDOW = 25;
  // A lasting effect on a combatant ended: `effect_end`. Escudo (it ends by itself, at
  // the start of the caster's turn) and Ajuda (the master ended it).
  COMBAT_LOG_KIND_EFFECT_ENDED = 26;
  // The master took an extra out of a damage with a reason ("o mestre tirou o
  // Ataque Furtivo"): the actor is the attacker, the target the target, `key` the
  // part's key and `key_name_pt` its name; the reason is `reason`, for the master
  // and the attacker's player.
  COMBAT_LOG_KIND_DAMAGE_PART_REMOVED = 31;
  // A state began or ended (a rage, a dodge): `state`.
  COMBAT_LOG_KIND_STATE_CHANGED = 32;
  // A player asked for a better mode and the master answered ("Brisa pediu
  // Vantagem; o mestre aprovou"): `mode_change`.
  COMBAT_LOG_KIND_ROLL_MODE_ANSWERED = 33;
  // The master brought a dead player's character back (ReviveCharacter): "O mestre
  // reviveu Toren". The revived combatant is `target_id`; no actor. Everyone sees it,
  // unless the combatant is hidden.
  COMBAT_LOG_KIND_CHARACTER_REVIVED = 34;
  // A monk's rider answered (UseHitRider): the Open Hand technique or Stunning Strike,
  // the actor the monk and the target the creature hit. `hit_rider` has the result.
  COMBAT_LOG_KIND_HIT_RIDER = 40;
}

// CombatLogStateChange is a state that began or ended.
message CombatLogStateChange {
  // COMBATANT_STATE_KIND_TABLE for a temporary state a table feature defines; `key` and
  // `name_pt` then say which.
  CombatantStateKind kind = 2;
  // True when it began.
  bool started = 3;
  // Why it ended (empty when it began): the combatant's own text key, one of
  // "no_attack" (the turn ended with no attack on a hostile creature or damage taken),
  // "unconscious", "by_choice", "duration" or "left" (the source's concentration or
  // the combat ended). A table state also ends for "incapacitated" (hit points at 0 or a
  // condition) and "master" (his correction). In a combat every start and every end of a
  // table state writes a line; outside a combat there is no combat log, so a rest or a
  // correction made there writes none.
  string reason = 4;
  // For a table state: its key (rules.v1.DerivedState.key) and the Portuguese name of
  // the feature that defines it.
  string key = 5;
  string name_pt = 6;
}

// CombatLogModeChange is a roll whose mode is not the server's suggestion.
message CombatLogModeChange {
  RollMode suggested_mode = 2;
  RollMode mode = 3;
  // The master changed it (instead of a player's request).
  bool by_master = 4;
  // A player's request the master approved or refused.
  bool requested = 5;
  bool approved = 6;
  // The reason, for the master and the player of the attacker (never for the others).
  string reason = 7;
}

// WildShapeEndReason says why a druid's beast form ended.
enum WildShapeEndReason {
  WILD_SHAPE_END_REASON_UNSPECIFIED = 0;
  // The druid chose to ("Voltar à forma normal").
  WILD_SHAPE_END_REASON_LEFT = 1;
  // The beast fell to 0 hit points: the damage left over went to the druid.
  WILD_SHAPE_END_REASON_DAMAGE = 2;
  // The master's correction took the beast to 0 hit points.
  WILD_SHAPE_END_REASON_MASTER = 3;
  // The druid itself fell to 0 hit points.
  WILD_SHAPE_END_REASON_ZERO_HP = 4;
  // The druid fell unconscious (a sleep spell, the master's hand).
  WILD_SHAPE_END_REASON_UNCONSCIOUS = 5;
}

// CombatLogWildShape is a druid's change of form, in the combat log.
message CombatLogWildShape {
  // The beast's content key ("monster:wolf") and Portuguese name ("Lobo").
  string beast_key = 1;
  string beast_name_pt = 2;
  // True when the druid became the beast; false when the form ended.
  bool started = 3;
  // Why it ended. Unspecified when `started`.
  WildShapeEndReason end_reason = 4;
  // The damage that passed from the beast's fall to the druid (DAMAGE only).
  // Only the master and the druid's own player; 0 for everyone else, who read
  // that the druid is back in its own shape and no number (RN-20).
  int32 carried_damage = 5;
}

// CombatLogEntry is one line of the combat log, as the caller may see it.
// Fields marked "only the master" are left out for a player.
message CombatLogEntry {
  // The event's ID (a UUID). For an attack, the attack roll's event.
  string id = 1;
  CombatLogKind kind = 2;
  google.protobuf.Timestamp at = 3;
  int32 round = 4;
  // Who did it, and to whom. The label is the combatant's, "Goblin 2". Empty
  // when the combatant left the combat meanwhile.
  string actor_id = 5;
  string actor_label = 6;
  string target_id = 7;
  string target_label = 8;
  // The attack or action: its key, and its Portuguese name when the actor's
  // sheet still has it ("Cimitarra", "Disparada").
  string key = 9;
  string key_name_pt = 10;
  // ATTACK: what the roll did.
  AttackOutcome outcome = 11;
  // ATTACK: the d20. Only the master and the actor's player get the dice;
  // everyone else only the outcome (the master's rolls are not the players').
  DiceRoll attack_roll = 12;
  // ATTACK: the damage, once the attack hit and it was rolled.
  CombatLogDamage damage = 13;
  // MOVED: how far, in feet (5 ft is one square, 1.5 m).
  int32 distance_ft = 14;
  // REVEAL_CHANGED: whether the combatant is hidden now.
  bool now_hidden = 15;
  // HIT_POINTS_ADJUSTED: the change, negative for damage. Only the master.
  int32 hit_points_delta = 16;
  // The target's hit points after the change. Only the master, and only for
  // ATTACK entries whose damage is APPLIED and HIT_POINTS_ADJUSTED.
  optional int32 hit_points_after = 17;
  // Only the master: the players do not get this entry ("Só o mestre vê").
  bool hidden = 18;
  // Only the master: this entry holds the last action, the one
  // UndoLastAction would take back.
  bool undoable = 19;
  // SPELL_CAST and REACTION: the spell (its key is `key`, its name `key_name_pt`).
  CombatLogSpell spell = 20;
  // DEATH_SAVE: the save.
  CombatLogDeathSave death_save = 21;
  // CONDITIONS_CHANGED: the combatant's conditions now (keys of the SRD's), and
  // the spell it stopped concentrating on, if it did.
  repeated string conditions = 22;
  string concentration_ended_key = 23;
  // ATTACK: Escudo stopped the hit; `outcome` is MISS and there is no damage.
  bool stopped_by_reaction = 24;
  // ATTACK: an opportunity attack, with the reaction.
  bool as_reaction = 25;
  // ATTACK: the cover the target had against the attacker, and where it came
  // from. Everyone who gets the entry gets them.
  CoverDegree cover = 26;
  CoverSource cover_source = 27;
  // ATTACK, only the master: the armor class the total was compared with ("CA
  // 17") and how much of it is the cover ("15 + 2 de meia cobertura").
  optional int32 target_armor_class = 28;
  int32 cover_bonus = 29;
  // MOVED: how far in tenths of a foot (`distance_ft` is it rounded down), and the
  // jump, if the move was one (a high jump: `jump_height_dft`).
  int32 distance_dft = 30;
  JumpKind jump = 31;
  int32 jump_height_dft = 32;
  // MOVED by a long jump: the combatant had walked 10 ft just before, so the jump
  // counted with a running start. Everyone who gets the line.
  bool jump_running_start = 45;
  // MOVED on foot: the movement the walk spent, in tenths of a foot, when it is not the
  // distance: the path's cost (a square of another creature or of difficult terrain
  // costs double), doubled again by a drag (`move_dragging`) or a crawl
  // (`move_crawling`). Zero when the move spent nothing (the master's free move) or
  // the event is older; then the line says only the distance. Everyone who gets the line.
  int32 spent_dft = 48;
  bool move_dragging = 49;
  bool move_crawling = 50;
  // MOVED by a long jump, only the master: it landed in difficult terrain, so the
  // line says "Acrobacia CD 10 ou cai Derrubado" (the app rolls nothing).
  bool landing_difficult = 33;
  // ATTACK, an opportunity attack whose damage dropped the mover to 0 hit points:
  // it went back to the square where it left the reach.
  bool returned_to_reach = 34;
  // Only the master: the same, but that square was taken, so the mover stayed
  // where it was.
  bool return_blocked = 35;
  // TRAP_TRIGGERED: what the trap did.
  TrapFiring trap = 40;
  // WILD_SHAPE: the form change. The actor is the druid.
  CombatLogWildShape wild_shape = 41;
  // CONTEST: what happened.
  CombatLogContest contest = 60;
  // DOOR_OPENED: where the door is. The actor is who opened it.
  CombatLogDoor door = 42;
  // MONSTERS_ADDED: the new monsters, in the order of their names.
  repeated CombatLogMonster monsters = 43;
  // RESOURCE: what the class resource did.
  CombatLogResource resource = 90;
  // ATTACK: the die added to the d20 after it was rolled (Bardic Inspiration). Only
  // the master and the attacker's player get it, like the d20.
  repeated BonusDie bonus_dice = 91;
  // REACTION_WINDOW: the line, already filtered for the caller.
  string reaction_text_pt = 44;
  // STATE_CHANGED: the state.
  CombatLogStateChange state = 93;
  // ATTACK, ROLL_MODE_ANSWERED: the mode, when it is not the server's suggestion.
  // The d20 pair of the attack is in `attack_roll`.
  CombatLogModeChange mode_change = 92;
  // DAMAGE_PART_REMOVED: the master's reason. Same audience as `mode_change.reason`.
  string reason = 47;
  // EFFECT_ENDED: which effect, on the actor.
  CombatLogEffectEnd effect_end = 46;
  // EFFECT and EXHAUSTION: what happened.
  CombatLogEffect effect = 100;
  // HIT_RIDER: how the rider ended.
  CombatLogHitRider hit_rider = 110;
  // What a Channel Divinity action did (Preserve Life, Turn Undead): for the master and the cleric's player.
  ChannelDivinityResult channel_divinity = 111;
  // The master did this for a player's character (the line reads "(pelo mestre)"): an attack, a spell, a death save,
  // a move, a feature, a Wild Shape or the end of the turn made through the master's hand, not the player's. Everyone
  // who gets the line gets the flag, the player too when they are back.
  bool by_master = 112;
  // SPELL_CAST of a creature's action (UseCreatureAction): which action, the condition a failed
  // save gave and the table's reminder. `spell.targets` has the saves and the damage; the spell
  // key is the action's.
  CombatLogCreatureAction creature_action = 113;
}

// CombatLogEffectEnd is an effect that ended, in the combat log.
message CombatLogEffectEnd {
  CombatEffect effect = 1;
  // AID: the hit points and the maximum before and after. Only the master (RN-20);
  // zero for everyone else.
  int32 hit_points_before = 2;
  int32 hit_points_after = 3;
  int32 hit_points_max_before = 4;
  int32 hit_points_max_after = 5;
}

// CombatEffect is a lasting effect on a combatant that the table can end.
enum CombatEffect {
  COMBAT_EFFECT_UNSPECIFIED = 0;
  // Escudo's +5 armor class. It ends by itself and has no action to end it.
  COMBAT_EFFECT_SHIELD = 1;
  // Ajuda's bonus to the maximum hit points.
  COMBAT_EFFECT_AID = 2;
}

// CombatLogResource is a Lay on Hands, a Flexible Casting or a Bardic Inspiration
// line of the log.
message CombatLogResource {
  // The flow, "feature:lay-on-hands", "feature:flexible-casting-creating-spell-slots",
  // "feature:flexible-casting-converting-spell-slot" or "feature:bardic-inspiration".
  string key = 1;
  // The points or uses spent from the resource (a Lay on Hands amount or cure,
  // sorcery points of a created slot, 1 use of Bardic Inspiration).
  int32 spent = 2;
  // Flexible Casting: the spell slot level created or expended, and the sorcery
  // points gained by converting one.
  int32 slot_level = 3;
  int32 gained = 4;
  // Lay on Hands: the hit points the target regained, and the cure. Only the
  // master and the target's player get `healed`; a disease or a poison is public.
  optional int32 healed = 5;
  meurpg.play.v1.LayOnHandsCureKind cure = 6;
  // The touch did nothing; the reason (undead or construct) is the master's alone.
  bool nothing_happened = 7;
  optional string nothing_reason = 8;
  // Bardic Inspiration: the die given (its size) and the round it runs out in.
  int32 die_sides = 9;
  int32 expires_at_round = 10;
}

// LayOnHandsCureKind is what a Lay on Hands cure fixed.
enum LayOnHandsCureKind {
  LAY_ON_HANDS_CURE_KIND_UNSPECIFIED = 0;
  LAY_ON_HANDS_CURE_KIND_DISEASE = 1;
  LAY_ON_HANDS_CURE_KIND_POISON = 2;
}

// CombatLogEffect is what an EFFECT or EXHAUSTION line says.
message CombatLogEffect {
  // The effect's key and Portuguese name ("spell:hold-person", "Imobilizar Pessoa").
  string source_key = 1;
  string source_name_pt = 2;
  CombatLogEffectChange change = 3;
  // The combatants it concerns, by label ("Brisa", "Goblin 2").
  repeated string target_labels = 4;
  // SAVED and SAVE_FAILED: the ability, and for the master the roll and the DC; a player
  // reads only whether it passed.
  string ability = 5;
  string ability_name_pt = 6;
  optional int32 d20 = 7;
  optional int32 total = 8;
  optional int32 dc = 9;
  // SAVED and SAVE_FAILED, with the roll: the d20 the halfling's Lucky rolled again after it
  // showed a 1 (`source_key` "trait:lucky"); `d20` is the new face.
  repeated Reroll rerolled = 15;
  // DAMAGE: the damage type's Portuguese name and the amount rolled.
  string damage_type_pt = 10;
  int32 amount = 11;
  // EXHAUSTION: the level now, and the level before.
  int32 exhaustion_level = 12;
  int32 exhaustion_before = 13;
  // ENDED: why ("duration", "ended_by_master", "concentration", "saved", "caster_left").
  // EXHAUSTION: "frenzy" when the level came from the end of a Berserker's frenzied rage.
  string reason = 14;
}

// CombatLogEffectChange is what an effect did.
enum CombatLogEffectChange {
  COMBAT_LOG_EFFECT_CHANGE_UNSPECIFIED = 0;
  COMBAT_LOG_EFFECT_CHANGE_ADDED = 1;
  COMBAT_LOG_EFFECT_CHANGE_ENDED = 2;
  COMBAT_LOG_EFFECT_CHANGE_DURATION_CHANGED = 3;
  COMBAT_LOG_EFFECT_CHANGE_SAVED = 4;
  COMBAT_LOG_EFFECT_CHANGE_SAVE_FAILED = 5;
  COMBAT_LOG_EFFECT_CHANGE_DAMAGE = 6;
  COMBAT_LOG_EFFECT_CHANGE_SAVE_SKIPPED = 7;
  // The effect gave the target temporary hit points (Heroísmo, at the start of its turn); `amount`.
  COMBAT_LOG_EFFECT_CHANGE_TEMP_HP = 8;
  // A spell's area moved (Moonbeam moved by its caster, Cloudkill drifting). A creature the
  // area catches (it came in, or began its turn there) is a SAVED or SAVE_FAILED line with
  // `reason` zone_enter, zone_start, zone_cast or zone_end, the roll, and the damage in `amount`.
  COMBAT_LOG_EFFECT_CHANGE_ZONE_MOVED = 9;
}

// CombatLogMonster is a monster of a MONSTERS_ADDED line, only the master's.
message CombatLogMonster {
  string combatant_id = 1;
  string label = 2;
  // Its hit points.
  int32 hit_points = 3;
  // Whether they were rolled; then `dice` is the creature's hit dice with the
  // bonus ("2d8+2"), `faces` the rolled dice and `modifier` the bonus.
  bool rolled = 4;
  string dice = 5;
  repeated int32 faces = 6;
  int32 modifier = 7;
}

// CombatLogDoor is a door a move opened, in the combat log.
message CombatLogDoor {
  // The door's square: col counts from the left edge and row from the top.
  int32 col = 1;
  int32 row = 2;
}

// CombatLogSpell is a spell in the combat log: the cast, or a reaction.
message CombatLogSpell {
  // The slot spent. Unset for a cantrip.
  SpellSlot slot = 1;
  // What it did to each target, in the order they were listed. Empty for
  // Escudo.
  repeated CombatLogSpellTarget targets = 2;
  // The spell needs concentration.
  bool concentrating = 3;
  // The spell the caster stopped concentrating on to cast this one.
  string concentration_ended_key = 4;
  // The same four as SpellCast, with the same visibility: effect_kind and the
  // condition for everyone who gets the entry, the pool roll for the master and
  // the caster's player, the threshold for the master.
  SpellEffectKind effect_kind = 5;
  DiceRoll pool_roll = 6;
  string effect_condition_key = 7;
  optional int32 effect_threshold = 8;
  // Revivify (effect_kind REVIVE): the diamonds worth 300 gp were spent ("Ilaria gastou
  // diamantes de 300 PO"). Only the master and the caster's player.
  bool material_spent = 9;
  // Revivify: the round the revived creature died in ("morreu na rodada 3"). Only the
  // master.
  optional int32 revived_death_round = 10;
  // The Metamagic the casting used, and the sorcery points it spent.
  repeated string metamagic_keys = 30;
  int32 sorcery_points_spent = 31;
}

// CombatLogSpellTarget is what a cast did to one target, in the log. Its fields
// follow the same visibility as SpellTargetResult and CombatLogDamage.
message CombatLogSpellTarget {
  string target_id = 1;
  string target_label = 2;
  int32 darts = 3;
  AttackOutcome outcome = 4;
  // The d20 of a spell attack. Only the master and the caster's player.
  DiceRoll attack_roll = 5;
  SaveResult save = 6;
  // The damage or the heal, once it was rolled.
  CombatLogDamage damage = 7;
  // A spell that reads hit points: what it did to this target, as in
  // SpellTargetResult.effect.
  SpellEffectResult effect = 8;
  // The cover the target had for a spell attack or a Dexterity save, and where it
  // came from; for an attack, only the master also gets the armor class and
  // how much of it is cover.
  CoverDegree cover = 9;
  CoverSource cover_source = 10;
  optional int32 target_armor_class = 11;
  int32 cover_bonus = 12;
  // The damage of the cast's other damage types, once rolled, in the spell's
  // order after `damage`.
  repeated CombatLogDamage more_damages = 13;
  // Only the master: the creature was hidden from the players when the spell hit
  // it. A player's entry never has such a target (RN-10).
  bool hidden = 14;
  // A failed save pushed the creature this many feet away from the caster (5 ft a
  // square). 0 when it was not pushed, or could not move (then `push_stopped` says
  // a wall or a creature was in the way).
  int32 pushed_ft = 15;
  // The save was failed but the combat has no map (theatre of the mind), so the push is
  // the table's to imagine.
  bool push_no_map = 16;
  // The push of `pushed_ft` ended before its whole distance: a wall, a door, the edge of the
  // grid or another creature stopped it.
  bool push_stopped = 17;
}

// CombatLogDeathSave is a death save in the log. When the table hides the death
// saves (RN-24, "só o dono e o mestre") the owner and the master get the entry
// whole; everybody else gets no entry for a save that went on (a success, a
// failure, a revival), and for the save that made the character stable only
// `stable`, with no roll, no outcome and zero counts: "Brisa estabilizou" is a
// result the table sees, the road to it is not. The dead are announced by
// COMBAT_LOG_KIND_DEATH_CONFIRMED.
message CombatLogDeathSave {
  // The d20. Only the master and the character's own player.
  DiceRoll roll = 1;
  DeathSaveOutcome outcome = 2;
  // The counts after it.
  int32 successes = 3;
  int32 failures = 4;
  bool stable = 5;
  // Only the master.
  bool dying = 6;
  // The hook that ran on this failed save, as in DeathSave. Only the master and the character's own player.
  HookResult hook = 7;
}

// CombatLogDamage is the damage of an attack, in the log.
message CombatLogDamage {
  // AWAITING_ROLL (hit, not rolled yet), ROLLED (waits for the master),
  // APPLIED or DISCARDED.
  PendingDamageStatus status = 1;
  // The dice. Only the master and the actor's player get them.
  DiceRoll roll = 2;
  // The damage (for the target's player, the damage they take). Zero until
  // rolled.
  int32 amount = 3;
  string damage_type_key = 4;
  string damage_type_pt = 5;
  // APPLIED to an NPC that reached 0: defeated.
  bool target_defeated = 6;
  // APPLIED to a player's character that reached 0: down.
  bool target_down = 7;
  // The target saved and the spell halves the damage: `amount` is half.
  bool half = 8;
  // A heal: `amount` is how much the target regained, up to its maximum, for
  // the master and the target's own player; everyone else gets the roll, since
  // the capped number would tell how many hit points the target lacked (RN-20).
  bool healing = 9;
  // The rolled damage when the master applied another number
  // (ApplyPendingDamage.amount): `amount` is what was applied. Only the master.
  optional int32 rolled_amount = 10;
  // The Constitution save DC to keep a concentration the damage threatened
  // (RN-22). Only the master, and the target's own player when the table rule
  // "Os jogadores veem a CD dos testes de resistência" is on.
  optional int32 concentration_dc = 11;
  // APPLIED to a character already at 0: the death save failures it caused. When
  // the table hides the death saves (RN-24) only the master and the target's own
  // player get it.
  int32 death_failures_added = 12;
  // As in PendingDamage: the critical rule the damage was made under, and the
  // maximum of the dice that came without rolling (already part of `roll.modifier`).
  CriticalDamageRule critical_rule = 13;
  int32 critical_max = 14;
  // As in PendingDamage: the extra dice of a critical hit and the feature's name. The
  // last `extra_dice_count` faces of `roll` are theirs.
  int32 extra_dice_count = 15;
  string extra_dice_name_pt = 16;
  // What each part rolled, with the same audience as `roll`; and, only for the
  // master and the target's own player, the steps resistance took. The log of the
  // players never prints an NPC's resistances: "caiu pela metade" is not a line they
  // get, only the final damage.
  repeated DamagePartRoll parts = 17;
  repeated DamageStep steps = 18;
  // APPLIED to a player's character that the half-orc's Relentless Endurance (SRD 5.1)
  // kept on 1 hit point instead of 0: the line reads "Resistência Implacável: fica com
  // 1 PV". Everyone who gets the line gets this.
  bool relentless_endurance = 19;
  // A feature action of the table's content that gives temporary hit points: how many the target gained. Only the master and
  // the actor's player, like `amount` of a heal.
  int32 temp_hp_gained = 20;
  // APPLIED to a player's character with an on_event "drop_to_zero" hook that ran: the damage did not drop the character to 0
  // (the hook healed it). Only the master and the target's own player.
  HookResult hook = 21;
}

// GetCombatHighlightsRequest names the combat.
message GetCombatHighlightsRequest {
  string campaign_id = 1;
  // An ended combat of the campaign's open session (a UUID).
  string encounter_id = 2;
}

// HighlightKind is a category of the combat highlights, in the order the app
// shows them.
enum HighlightKind {
  HIGHLIGHT_KIND_UNSPECIFIED = 0;
  // "Mais dano causado": applied damage to NPCs.
  HIGHLIGHT_KIND_MOST_DAMAGE = 1;
  // "Mais cura": applied healing, to anyone.
  HIGHLIGHT_KIND_MOST_HEALING = 2;
  // "Tanque": applied damage taken.
  HIGHLIGHT_KIND_TANK = 3;
  // "Golpe final": NPCs brought to 0 hit points by the character's hit.
  HIGHLIGHT_KIND_FINAL_BLOW = 4;
  // "Acertos críticos": critical hits.
  HIGHLIGHT_KIND_CRITICAL_HITS = 5;
  // "Mais testes passados fora do combate": the checks passed in scenes that
  // showed their DC. Only GetSessionSummary returns it; a combat's highlights
  // never do.
  HIGHLIGHT_KIND_CHECKS_PASSED = 6;
  // "Mais tesouro encontrado" (MR-041): the PO found in the session, per
  // character; a treasure found by two splits its value between them, rounded
  // down. Only GetSessionSummary returns it; a combat's highlights never do.
  HIGHLIGHT_KIND_TREASURE_FOUND = 7;
}

// HighlightWinner is a player's character that won a category.
message HighlightWinner {
  // The character's ID (a UUID): everyone knows the players' characters.
  string character_id = 1;
  // The character's name.
  string name = 2;
}

// HighlightCategory is one category of the highlights with its winners.
message HighlightCategory {
  HighlightKind kind = 1;
  // The winners' number in the category: hit points of damage, of healing, of
  // damage taken, or a count. Always above 0.
  int32 value = 2;
  // Who has that number: one character, or everyone tied, in the combat's
  // order (the turn order).
  repeated HighlightWinner winners = 3;
}

// CharacterHighlights is every number of one player's character in the combat.
message CharacterHighlights {
  string character_id = 1;
  string name = 2;
  // Applied damage dealt to NPCs, past 0 hit points not counted.
  int32 damage_dealt = 3;
  // Applied healing done, to anyone.
  int32 healing_done = 4;
  // Applied damage taken, from anyone.
  int32 damage_taken = 5;
  // NPCs the character's hit brought to 0 hit points.
  int32 final_blows = 6;
  // Critical hits, with weapons and spell attacks.
  int32 critical_hits = 7;
}

// GetCombatHighlightsResponse is the highlights of a combat that ended.
message GetCombatHighlightsResponse {
  // The categories that have a winner, in the order of HighlightKind. A
  // category where everybody has 0 is not here: the list is empty for a combat
  // nobody hurt or healed in.
  repeated HighlightCategory categories = 1;
  // The table of every player's character that fought, in the combat's order
  // (the turn order), zeros included ("Números de cada jogador"). The master
  // gets every row; a player gets exactly one, their own character's (empty if
  // they had none in the combat), and never another player's (RN-20).
  repeated CharacterHighlights characters = 2;
}

// TrapFiring is what a fired trap did to each creature it caught. The master
// gets all of it. The players read the same event only through the combat log
// (CombatLogEntry.trap), with the dice of their own characters and "passou" or
// "falhou" for the rest.
message TrapFiring {
  // The trap's point (a UUID) and its name; a trap that fired is public.
  string point_id = 1;
  string name = 2;
  repeated TrapCaught caught = 3;
  // The firing's ID (a UUID): what FireTrapRequest.extend_firing_id asks for. In the
  // combat log it is the entry's ID.
  string id = 4;
}

// TrapCaught is what one creature suffered.
message TrapCaught {
  // The combatant (in a combat) or the character (outside one): a UUID. A creature of
  // a character (a familiar, a summon) is its own target: outside a combat its ID is the
  // creature's, with `character_id` the owner's.
  string target_id = 1;
  string target_label = 2;
  // The character the target stands for (a UUID): the player's character, for the
  // master and for the players; an NPC's only for the master (an NPC's character is
  // the master's secret).
  string character_id = 3;
  // The trap's attacks that were made against it, in order.
  repeated TrapAttackRoll attacks = 4;
  // Its saving throw, when the trap asked one of it.
  TrapSaveRoll save = 5;
  // The damage it takes, a row for each damage part.
  repeated TrapDamageDone damages = 6;
  // Every saving throw it made, in order: a trap that asks the save of each creature
  // hit (applies_to HIT) asks it once per hit. `save` is the first.
  repeated TrapSaveRoll saves = 8;
  // The conditions the trap gave it (keys of the SRD's, "condition:restrained").
  // In a combat they are on the combatant; outside one they are a reminder for
  // the master's log.
  repeated string condition_keys = 7;
}

// TrapAttackRoll is one attack of a trap.
message TrapAttackRoll {
  // The d20 plus the trap's attack bonus.
  DiceRoll roll = 1;
  AttackOutcome outcome = 2;
  // The target's armor class the total was compared with. Only the master.
  int32 target_armor_class = 3;
  // The mode the trap's d20 rolled with: the target's conditions count (an attack
  // against a prone, restrained, stunned... creature has advantage). Same audience
  // as `roll`.
  RollMode mode = 4;
  repeated AdvantageSource sources = 5;
}

// TrapSaveRoll is the saving throw a creature made against a trap.
message TrapSaveRoll {
  SaveOutcome outcome = 1;
  // The d20 plus the creature's bonus. Only the master and the creature's own
  // player; everyone else gets the outcome as a word.
  DiceRoll roll = 2;
  // The trap's save DC. Only the master.
  int32 dc = 3;
  // False for a basic-sheet NPC with no saving throw bonus (d20 + 0). Only the master.
  bool bonus_known = 4;
  // The mode the save rolled with, and why; a creature that fails a Strength or
  // Dexterity save without rolling (stunned, paralyzed, unconscious, petrified) has
  // `auto_failed` and no roll. Same audience as `roll`. A fired trap is public, but
  // a Danger Sense source is named only to the creature's player and the master, and
  // only for a trap the creature had found (RN-10).
  RollMode mode = 5;
  repeated AdvantageSource sources = 6;
  bool auto_failed = 7;
}

// TrapDamageDone is the damage of one part of the trap's effect, rolled.
message TrapDamageDone {
  // The row that holds it: pending_damages.id in a combat (apply it with
  // CombatService.ApplyPendingDamage) or trap_damages.id outside one (ApplyTrapDamage).
  string damage_id = 1;
  // ROLLED: a player's character, waits for the master. APPLIED: an NPC or a
  // creature took it at once.
  PendingDamageStatus status = 2;
  DiceRoll roll = 3;
  // What lands: half the roll for a creature that passed a save that halves.
  int32 amount = 4;
  string damage_type_key = 5;
  string damage_type_pt = 6;
  bool half = 7;
  bool critical = 8;
  // APPLIED to an NPC that reached 0: defeated.
  bool target_defeated = 9;
}

// ---- The reaction window (PM-04) ----

// ReactionKind is what a reaction window asks.
enum ReactionKind {
  REACTION_KIND_UNSPECIFIED = 0;
  // Escudo Arcano: +5 on the armor class until the start of the caster's next
  // turn, against an attack that hit it or a Magic Missile that targets it (SRD,
  // Shield).
  REACTION_KIND_SHIELD = 1;
  // Esquiva Sobrenatural: half the damage of an attack that hit and whose
  // attacker the rogue sees (SRD, Rogue 5).
  REACTION_KIND_UNCANNY_DODGE = 2;
  // Repreensão Infernal: the creature that damaged the caster, within 60 ft and
  // seen, makes a Dexterity saving throw (SRD, Hellish Rebuke).
  REACTION_KIND_HELLISH_REBUKE = 3;
  // Contramágica: a creature within 60 ft that the caster sees casts a spell (SRD,
  // Counterspell).
  REACTION_KIND_COUNTERSPELL = 4;
  // Palavras de Interrupção: a creature within 60 ft that the bard sees makes an
  // attack roll, an ability check or a damage roll (SRD, College of Lore).
  REACTION_KIND_CUTTING_WORDS = 5;
  // Defletir Projéteis: a ranged weapon attack hit the monk (SRD, Monk 3).
  REACTION_KIND_DEFLECT_MISSILES = 6;
  // Queda Suave: the caster or a creature within 60 ft falls (SRD, Feather Fall).
  REACTION_KIND_FEATHER_FALL = 7;
  // The opportunity attack (RN-21): the same offer as Encounter.opportunity_offers,
  // answered with RollAttack, DeclineOpportunity or SkipOpportunity. AnswerReaction
  // may only pass it.
  REACTION_KIND_OPPORTUNITY = 8;
  // Reserved: the hidden creatures an area spell hits (the question joins the
  // window when it lands).
  REACTION_KIND_HIDDEN_REVEAL = 9;
  // The Constitution saving throw of a concentrating combatant that took damage
  // (SRD, Duration).
  REACTION_KIND_CONCENTRATION_SAVE = 10;
  // The master's one-tap check of the table rule "Reações dos inimigos: Sempre":
  // an action of a player against an enemy waits for "Sem reação" so that the
  // pause says nothing to the players.
  REACTION_KIND_MASTER_CHECK = 11;
  // A contest (grapple, shove, escape) that waits for its defender's roll or its
  // winner's choice; it is answered with RespondContest / ResolveShove, not with
  // AnswerReaction.
  REACTION_KIND_CONTEST = 13;
  // The saving throw an effect that lasts asks at the end or the start of its target's
  // turn (Imobilizar Pessoa, Teia): answered with CombatEffectService.RollEffectSave.
  REACTION_KIND_EFFECT_SAVE = 12;
  // A table maneuver that reduces the damage of a melee hit by a die and an ability
  // modifier (superiority_die, applies reduce_melee_damage).
  REACTION_KIND_MANEUVER_REDUCE = 14;
  // Protection fighting style: a creature the reactor sees attacks someone else
  // within 5 ft of the reactor, who wields a shield; the reaction gives the attack
  // roll disadvantage. It waits before the d20 is rolled.
  REACTION_KIND_PROTECTION = 15;
}

enum ReactionWindowStatus {
  REACTION_WINDOW_STATUS_UNSPECIFIED = 0;
  REACTION_WINDOW_STATUS_OPEN = 1;
  REACTION_WINDOW_STATUS_ANSWERED = 2;
  REACTION_WINDOW_STATUS_CLOSED_BY_ITSELF = 3;
}

// ReactionClosedReason says why a window closed by itself: the server looks at
// the open windows again at every change of hit points, conditions or order.
enum ReactionClosedReason {
  REACTION_CLOSED_REASON_UNSPECIFIED = 0;
  // The same reactor already used its reaction (one a round, SRD, Reactions).
  REACTION_CLOSED_REASON_REACTION_SPENT = 1;
  // The reactor is incapacitated, unconscious or dead (SRD, Incapacitated).
  REACTION_CLOSED_REASON_REACTOR_INCAPACITATED = 2;
  // What triggered it is gone (the spell was countered, the attacker died, the
  // creature left the 60 ft, the concentration ended).
  REACTION_CLOSED_REASON_TRIGGER_GONE = 3;
  // An effect's saving throw whose effect ended meanwhile (the master ended it, or its
  // time ran out).
  REACTION_CLOSED_REASON_EFFECT_ENDED = 4;
  // An effect's saving throw whose caster lost the concentration meanwhile.
  REACTION_CLOSED_REASON_CASTER_LOST_CONCENTRATION = 5;
}

enum ReactionChoice {
  REACTION_CHOICE_UNSPECIFIED = 0;
  REACTION_CHOICE_USE = 1;
  REACTION_CHOICE_PASS = 2;
}

// What the table decides with "Reações dos inimigos" is TableRules.enemy_reactions.

// ReactionWait is the line "Esperando ..." the combat shows while a window is
// open, written for the caller (PM-04a).
message ReactionWait {
  // "Esperando o mestre", "Esperando a reação de Sálvia" or both ("Esperando o
  // mestre e a reação de Sálvia"); for a concentration save of a visible player,
  // "Esperando o teste de Constituição de Sálvia".
  string title_pt = 1;
  // What waits, without a number and without an NPC: "O resultado do seu ataque
  // sai quando ele responder.", "A queda no Fosso só é resolvida quando ele
  // responder.", "A sua conjuração se resolve quando ele responder." or "O turno
  // continua quando ele responder.".
  string detail_pt = 2;
}

// ReactionWindow is a question to a reactor: may it react? Its fields follow
// who asks: the master reads all of it; the reactor's player reads only what the
// reactor sees (RN-10, RN-20: no total, no armor class, no NPC, no spell name for
// a Counterspell); nobody else gets the window at all.
message ReactionWindow {
  // Stable id (a UUID): what AnswerReaction names.
  string id = 1;
  ReactionKind kind = 2;
  ReactionWindowStatus status = 3;
  ReactionClosedReason closed_reason = 4;
  // The trigger the window belongs to: windows of one action share it (the master
  // reads "Reações a uma magia" and "Reações a um ataque" as two queues).
  string group_id = 5;
  // The reactor (a combatant UUID) and its label; empty for MASTER_CHECK.
  string reactor_id = 6;
  string reactor_label = 7;
  // The reactor is a player's character (the master's "Respondendo no celular").
  bool reactor_is_player = 8;
  // True when the caller may answer it now: the reactor's player, and the master.
  bool for_you = 9;
  // Only the master: this is the window to answer now (the first of the order);
  // the others read "Depois do Mago 1".
  bool answer_now = 10;
  // Only the master: what happened, with the numbers that are the master's.
  ReactionTrigger trigger = 11;
  // The step of the window: false the first question; true the second one, after
  // an answer that asks one more thing (Hellish Rebuke's saving throw, the
  // monk's throw back). A second step is answered like the first.
  bool second_step = 12;
  // The reactor's player said they are using the reaction and rolling now
  // (MarkReactionRolling). The master reads "Rolando…" and the automatic pass waits
  // longer; the player reads their own mark back. Never sent for a window nobody
  // marked.
  bool rolling = 13;
  // Only the master: the reactor is a player's character and nobody answered in the first 10 s, so the question has come
  // to the master ("10 s sem resposta"). The player may still answer; the first answer wins and the other reads
  // REACTION_ALREADY_ANSWERED.
  bool unanswered = 14;
  // Only whoever answers: the question, by kind.
  oneof prompt {
    ShieldPrompt shield = 20;
    UncannyDodgePrompt uncanny_dodge = 21;
    HellishRebukePrompt hellish_rebuke = 22;
    CounterspellPrompt counterspell = 23;
    CuttingWordsPrompt cutting_words = 24;
    DeflectMissilesPrompt deflect_missiles = 25;
    FeatherFallPrompt feather_fall = 26;
    ConcentrationSavePrompt concentration_save = 27;
    MasterCheckPrompt master_check = 28;
    HellishRebukeSavePrompt hellish_rebuke_save = 29;
    DeflectMissilesThrowPrompt deflect_throw = 30;
    ContestPrompt contest = 31;
    ManeuverReducePrompt maneuver_reduce = 41;
    ProtectionPrompt protection = 42;
    // The saving throw an effect asks at a turn (RN-22).
    EffectSavePrompt effect_save = 40;
  }
}

// ReactionTrigger is what happened, for the master (RN-20: the numbers of NPCs
// are the master's).
message ReactionTrigger {
  string actor_id = 1;
  string actor_label = 2;
  string target_id = 3;
  string target_label = 4;
  // The attack or the spell: its key and Portuguese name.
  string action_key = 5;
  string action_name_pt = 6;
  // The distance between the reactor and the actor (or the fall), when on a map.
  optional int32 distance_ft = 7;
  // An attack that hit: the total and the armor class it was compared with.
  optional int32 attack_total = 8;
  optional int32 target_armor_class = 9;
  // A damage that waits: the amount rolled.
  optional int32 damage = 10;
  // A spell (Counterspell): its key and level. Never sent to a player.
  string spell_key = 11;
  int32 spell_level = 12;
  // Shield: the armor class after it, to read "17 contra 15 viraria erro".
  optional int32 armor_class_with_shield = 13;
  // Concentration: the spell and the damage that threatens it.
  string concentration_spell_key = 14;
  int32 damage_taken = 15;
  // Cutting Words: what is rolled.
  ReactionRollKind roll_kind = 16;
  // The slot the master may use for an NPC reactor, and what each slot does
  // (Counterspell: "anula sem teste" or "teste de Inteligência CD 13").
  repeated SlotEffect slot_effects = 17;
  // The saving throw of a Hellish Rebuke's aggressor (the master's roll) and its bonus.
  optional int32 save_dc = 18;
  optional int32 save_bonus = 19;
}

// SlotEffect is what a slot does to a Counterspell, read by the master.
message SlotEffect {
  meurpg.rules.v1.SlotChoice slot = 1;
  // True: the spell fails with no check.
  bool no_check = 2;
  // The DC of the check when there is one (10 + the spell's level).
  int32 check_dc = 3;
  // The reactor's bonus on the check.
  int32 check_bonus = 4;
}

enum ReactionRollKind {
  REACTION_ROLL_KIND_UNSPECIFIED = 0;
  REACTION_ROLL_KIND_ATTACK = 1;
  REACTION_ROLL_KIND_TEST = 2;
  REACTION_ROLL_KIND_DAMAGE = 3;
}

// ShieldPrompt: "Você foi atingido: usar Escudo Arcano?" (no total, no armor class).
message ShieldPrompt {
  // The pending damage the hit opened (the old Shield calls name it).
  string pending_damage_id = 1;
  // Who attacked and with what, only when the reactor sees the attacker.
  string attacker_label = 2;
  string attack_name_pt = 3;
  // True for a Magic Missile that targets the reactor ("você é alvo de Mísseis
  // Mágicos"): Shield then takes all the damage away.
  bool magic_missile = 4;
  repeated meurpg.rules.v1.SlotChoice slots = 5;
  string spell_name_pt = 6;
}

message UncannyDodgePrompt {
  string attacker_label = 1;
  string attack_name_pt = 2;
  // The damage the attack would do to the reactor, and what is left halved
  // (rounded down).
  int32 damage = 3;
  int32 halved = 4;
}

message HellishRebukePrompt {
  string aggressor_label = 1;
  string attack_name_pt = 2;
  optional int32 distance_ft = 3;
  // The saving throw DC: the caster's (8 + proficiency + Charisma).
  int32 save_dc = 4;
  // The ways to pay, in the order the sheet offers them.
  repeated HellishRebukeOption options = 5;
}

message HellishRebukeOption {
  // The tiefling's Infernal Legacy: once per long rest, as a 2nd-level spell, no
  // slot spent.
  bool racial = 1;
  // The slot (when not racial).
  meurpg.rules.v1.SlotChoice slot = 2;
  // The level it is cast at, and the damage dice: 2d10 plus 1d10 for each level
  // above the 1st.
  int32 level = 3;
  int32 dice_count = 4;
  // Uses left of the Infernal Legacy.
  int32 uses_left = 5;
}

// HellishRebukeSavePrompt is the second step, for the master: the aggressor's
// saving throw when it is an NPC.
message HellishRebukeSavePrompt {
  string aggressor_label = 1;
  int32 save_dc = 2;
  int32 save_bonus = 3;
  bool bonus_known = 4;
  int32 dice_count = 5;
}

message CounterspellPrompt {
  // The caster the reactor sees, and how far: never the spell or its level.
  string caster_label = 1;
  optional int32 distance_ft = 2;
  // The slots of the 3rd level or above.
  repeated meurpg.rules.v1.SlotChoice slot_options = 3;
}

message CuttingWordsPrompt {
  ReactionRollKind roll_kind = 1;
  string roller_label = 2;
  // Who the roll is against, when the reactor sees it (an attack).
  string target_label = 3;
  optional int32 distance_ft = 4;
  int32 die_sides = 5;
  int32 uses_left = 6;
}

// ManeuverReducePrompt: a melee attack hit the reactor; each option is a table maneuver
// that takes `die + flat_bonus` off the damage and spends the reaction and a use.
message ManeuverReducePrompt {
  string attacker_label = 1;
  string attack_name_pt = 2;
  // The damage the attack would do to the reactor.
  int32 damage = 3;
  repeated ManeuverReduceOption options = 4;
}

// ProtectionPrompt: the Protection fighting style. A creature the reactor sees is about
// to attack a neighbor of the reactor; using the reaction gives that attack roll
// disadvantage. The attacker is named only when the reader sees it.
message ProtectionPrompt {
  string attacker_label = 1;
  // The creature the attack is aimed at, one of the reactor's neighbors.
  string ally_label = 2;
}

message ManeuverReduceOption {
  string key = 1;
  string name_pt = 2;
  int32 die_sides = 3;
  // The ability modifier added to the die.
  int32 flat_bonus = 4;
  int32 uses_left = 5;
}

message DeflectMissilesPrompt {
  string attacker_label = 1;
  string attack_name_pt = 2;
  // The damage the attack would do to the reactor.
  int32 damage = 3;
  // 1d10 + flat_bonus (Dexterity modifier + monk level) is what comes off.
  int32 die_sides = 4;
  int32 flat_bonus = 5;
  int32 dex_mod = 6;
  int32 monk_level = 7;
}

// DeflectMissilesThrowPrompt: the damage fell to 0 and the monk caught the missile;
// throw it back for 1 ki, as part of the same reaction (RollAttack with
// catch_window_id), or keep it (AnswerReaction PASS).
message DeflectMissilesThrowPrompt {
  int32 ki_left = 1;
  int32 normal_range_ft = 2;
  int32 long_range_ft = 3;
  // The missile's name ("Arco curto"), as the screen names the throw; empty when
  // the caller does not see the attacker.
  string missile_name_pt = 4;
  // What the thrown attack adds to the d20: proficiency (whatever the monk's
  // weapon proficiencies) plus the Dexterity modifier. The damage is the
  // missile's own dice plus the Dexterity modifier, worked out by RollAttack.
  int32 attack_bonus = 5;
}

message FallingCreature {
  string combatant_id = 1;
  string label = 2;
  bool ally = 3;
  optional int32 distance_ft = 4;
}

message FeatherFallPrompt {
  // Only the creatures that fall and the reactor sees.
  repeated FallingCreature falling = 1;
  int32 max_targets = 2;
  int32 fall_ft = 3;
  repeated meurpg.rules.v1.SlotChoice slot_options = 4;
}

message ConcentrationSavePrompt {
  string spell_key = 1;
  string spell_name_pt = 2;
  // The damage that threatens it, from the source the window is for.
  int32 damage_taken = 3;
  // 10 or half the damage, whichever is higher (SRD). The master's, and the
  // player the response is rendered for (the answering member of a held roll) when the table rule "Os jogadores veem a CD dos testes de
  // resistência" is on; 0 (absent) for that player otherwise.
  int32 dc = 4;
  // What threatens it ("Bola de Fogo do Mago 1"), when the reactor sees the source.
  string source_label = 5;
  // The owner's Constitution saving throw bonus. Unknown for a basic sheet.
  int32 save_bonus = 6;
  bool bonus_known = 7;
  // True once the player left the roll to the master.
  bool handed_to_master = 8;
  // The mode of the d20 ("normal", "advantage" or "disadvantage": exhaustion 3 or more is
  // disadvantage on saving throws, SRD 5.1) and the sources in words ("Exaustão 3:
  // desvantagem"), the same ones ResolveConcentrationSave rolls with. With a mode, a roll
  // typed with physical dice takes both d20 (d20_face and second_d20_face). A source of an
  // effect the master hides reads "Outra fonte" (RN-10).
  string mode = 9;
  repeated string mode_sources_pt = 10;
}

// ContestPrompt names the contest a CONTEST window waits for: the sheet reads it
// from Encounter.contest_state.
message ContestPrompt {
  string contest_id = 1;
}

message MasterCheckPrompt {
  // What the check is about, for the master's card: "Ataque de Toren contra o
  // Goblin 2 · acertou".
  string summary_pt = 1;
  // True when an enemy has a reaction for it (the card then offers the reaction
  // next to "Sem reação"); false: "Nenhum inimigo tem uma reação para isto".
  bool enemy_can_react = 2;
}

// AnswerReactionRequest answers a window.
message AnswerReactionRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string window_id = 3;
  ReactionChoice answer = 4;
  // The slot of a spell reaction: one of the prompt's (the pact slot is `pact`).
  SpellSlot slot = 5;
  // Hellish Rebuke paid with the Infernal Legacy.
  bool use_racial = 6;
  // Feather Fall: the falling creatures to save, at most the prompt's max_targets.
  repeated string creature_ids = 7;
  // The die the answer needs, when it needs one (Counterspell's check, Cutting
  // Words' die, Deflect Missiles' die, the saving throw of Hellish Rebuke): exactly
  // one of them. `typed` is the face of the physical die.
  oneof roll {
    bool roll_in_app = 8;
    int32 typed = 9;
  }
  string idempotency_key = 10;
  // A maneuver reduction (ManeuverReducePrompt.options[].key): the one the player uses. Needed
  // to answer USE a REACTION_KIND_MANEUVER_REDUCE window; the roll is the maneuver's die.
  string maneuver_key = 11;
}

// MarkReactionRollingRequest marks a window as being rolled.
message MarkReactionRollingRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string window_id = 3;
}

message MarkReactionRollingResponse {
  Encounter encounter = 1;
}

message AnswerReactionResponse {
  Encounter encounter = 1;
  // What the answer did, for the answerer (the master's `by_master` answer too). Unset while the Counterspell's check waits
  // for a question.
  ReactionResult result = 2;
  // Set instead of `result` when the d20 of a Counterspell's check waits for a question: the halfling's Lucky about a 1, or
  // the Bardic Inspiration die the reactor holds (AnswerHeldRoll answers it). The d20 was rolled and kept; the window stays
  // open and no slot or reaction is spent. The master is asked too when he answers for the player, and answers after the
  // player's first 10 s.
  HeldRollOffer held_roll_offer = 3;
}

// ReactionResult is what an answered window did, read by the reactor and the
// master. Never sent to anybody else.
message ReactionResult {
  ReactionKind kind = 1;
  // True when the master answered.
  bool by_master = 2;
  // False for PASS.
  bool used = 3;
  oneof result {
    ShieldResult shield = 20;
    UncannyDodgeResult uncanny_dodge = 21;
    HellishRebukeResult hellish_rebuke = 22;
    CounterspellResult counterspell = 23;
    CuttingWordsResult cutting_words = 24;
    DeflectMissilesResult deflect_missiles = 25;
    FeatherFallResult feather_fall = 26;
    ManeuverReduceResult maneuver_reduce = 27;
    ProtectionResult protection = 28;
  }
  // The window the answer asked one more thing of (a second step), if any.
  string next_window_id = 30;
}

message ShieldResult {
  // The new armor class stopped the attack (or took the Magic Missile away).
  bool stopped = 1;
}

message UncannyDodgeResult {
  int32 damage_before = 1;
  int32 damage_after = 2;
}

message HellishRebukeResult {
  // The aggressor's save: only the reactor and the master.
  DiceRoll save = 1;
  int32 save_dc = 2;
  bool saved = 3;
  int32 damage = 4;
  int32 level = 5;
  bool racial = 6;
}

message CounterspellResult {
  bool countered = 1;
  // What was cast, revealed now that it happened (SRD): to the reactor and the master.
  string spell_key = 2;
  string spell_name_pt = 3;
  int32 spell_level = 4;
  // The ability check, when the spell was above the slot.
  DiceRoll check = 5;
  int32 check_dc = 6;
}

message CuttingWordsResult {
  // The die subtracted.
  DiceRoll die = 1;
  // False for a creature that cannot hear the bard or is immune to charm: "sem
  // efeito", the same words as when the master chooses not to apply it.
  bool effective = 2;
  // What the roll became: only "acertou" / "errou" for a player (no total, no AC);
  // the master reads the numbers in the log.
  AttackOutcome outcome = 3;
  ReactionRollKind roll_kind = 4;
}

// ProtectionResult: the attack roll that was held now has disadvantage. The result
// never says what the roll became.
message ProtectionResult {}

message ManeuverReduceResult {
  string maneuver_key = 1;
  string name_pt = 2;
  DiceRoll reduction = 3;
  int32 damage_before = 4;
  int32 damage_after = 5;
}

message DeflectMissilesResult {
  DiceRoll reduction = 1;
  int32 damage_before = 2;
  int32 damage_after = 3;
  bool caught = 4;
  bool throw_back_available = 5;
}

message FeatherFallResult {
  // The creatures that take no fall damage.
  repeated string saved_ids = 1;
}

message ResolveConcentrationSaveRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string window_id = 3;
  oneof roll {
    // The app rolls the d20 (with the owner's Constitution saving throw bonus).
    bool roll_in_app = 4;
    // The face of a physical d20, 1 to 20.
    int32 d20_face = 5;
    // The owner leaves the roll to the master (a player only).
    bool hand_to_master = 6;
    // The master keeps the concentration without a roll (an NPC's, or a player who
    // does not answer; the master only).
    bool keep = 7;
  }
  string idempotency_key = 8;
  // The faces of the dice an effect adds to the saving throw (Bênção, Perdição), in the order
  // of the effects, when the roll is a physical d20 (`d20_face`): one for each, 1 to the die's
  // faces. With the app's dice the server rolls them.
  repeated int32 extra_die_faces = 100;
  // With a physical d20 and disadvantage (exhaustion 3 or more, SRD 5.1) or advantage on the
  // saving throw, the second d20; `d20_face` is the first.
  optional int32 second_d20_face = 101;
  // A table maneuver (a superiority_die effect of applies "save") the player adds to this roll:
  // its key, one of Maneuver.key of the character's derived sheet. The die is rolled with the
  // roll (in the app, or its face is the last of `extra_die_faces` with physical dice) and one use
  // of its resource is spent when the roll is written. Refused with `invalid_argument` for a
  // maneuver the character has not or that does not go on this roll, and with a resource
  // blocked reason NO_USES_LEFT when no use is left. Empty adds none.
  string maneuver_key = 102;
}

message ResolveConcentrationSaveResponse {
  Encounter encounter = 1;
  // Unset for `hand_to_master`, `keep` and an offer.
  ConcentrationSaveResult result = 2;
  // Set instead of `result` when the roller's player holds a Bardic Inspiration die: the
  // d20 is rolled and kept, the window stays open and nothing is written, and
  // ResourceService.AnswerOutsideInspiration settles the save (SRD 5.1). The master's roll
  // never asks.
  // Deprecated (E4-9): the question is `held_roll_offer` (answered with AnswerHeldRoll). This field is still served, for a
  // tab opened before the one question existed; it will go with the old answer RPCs.
  OutsideInspirationOffer inspiration_offer = 3 [deprecated = true];
  // Set instead of `result`, like `inspiration_offer`, when the roller is the player's own
  // halfling and a d20 shows a 1: the window stays open, and ResourceService.AnswerOutsideLucky
  // rolls it again or keeps the 1 (the die's question, if any, comes after it).
  // Deprecated (E4-9): the question is `held_roll_offer` (answered with AnswerHeldRoll). This field is still served, for a
  // tab opened before the one question existed; it will go with the old answer RPCs.
  LuckyOffer lucky_offer = 4 [deprecated = true];

  // The question the roll asks now, in the one shape every held roll has (HeldRollOffer), set beside
  // the deprecated `inspiration_offer` and `lucky_offer`: set instead of the result, when the
  // roll waits for an answer (AnswerHeldRoll). Whoever may answer gets it; nobody else does (RN-10).
  HeldRollOffer held_roll_offer = 5;
}

message ConcentrationSaveResult {
  DiceRoll save = 1;
  // The save's DC: the master's, and the player the response is rendered for (the
  // answering member of a held roll) when the table rule "Os
  // jogadores veem a CD dos testes de resistência" is on; 0 (absent) otherwise.
  int32 dc = 2;
  bool kept = 3;
  string spell_key = 4;
  string spell_name_pt = 5;
  // The Bardic Inspiration die the player added after the d20, already in the total of `save`.
  repeated BonusDie bonus_dice = 6;
}

// RequestRollModeRequest asks the master for a better mode for an attack.
message RequestRollModeRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  // The combatant that attacks, the attack and the target.
  string attacker_id = 3;
  string attack_key = 4;
  string target_id = 5;
  // The mode asked for (ADVANTAGE, or NORMAL where the suggestion was DISADVANTAGE)
  // and the reason, 1 to 120 characters on one line.
  RollMode roll_mode = 6;
  string reason = 7;
  string idempotency_key = 8;
}

// RequestRollModeResponse returns the combat and the request.
message RequestRollModeResponse {
  Encounter encounter = 1;
  RollModeRequest request = 2;
}

// AnswerRollModeRequestRequest is the master's decision.
message AnswerRollModeRequestRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string request_id = 3;
  // The mode the attack rolls with: the one asked for to approve, the suggested one
  // to refuse, or any other.
  RollMode decided_mode = 4;
  string idempotency_key = 5;
}

// AnswerRollModeRequestResponse returns the combat.
message AnswerRollModeRequestResponse {
  Encounter encounter = 1;
}

// CancelRollModeRequestRequest takes a request back.
message CancelRollModeRequestRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string request_id = 3;
  string idempotency_key = 4;
}

// CancelRollModeRequestResponse returns the combat.
message CancelRollModeRequestResponse {
  Encounter encounter = 1;
}

// RemoveDamagePartRequest takes an extra out of a rolled damage.
message RemoveDamagePartRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string pending_damage_id = 3;
  // The part's key ("sneak-attack").
  string part_key = 4;
  // 1 to 120 characters on one line.
  string reason = 5;
  string idempotency_key = 6;
}

// RemoveDamagePartResponse returns the combat and the damage after the change.
message RemoveDamagePartResponse {
  Encounter encounter = 1;
  PendingDamage pending_damage = 2;
}

// AnswerRageEndRequest answers whether the rage ends.
message AnswerRageEndRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  // True: let the rage end and end the turn. False: the turn goes on.
  bool end_rage = 4;
  string idempotency_key = 5;
}

// AnswerRageEndResponse returns the combat.
message AnswerRageEndResponse {
  Encounter encounter = 1;
}

// EndRageRequest ends a rage with a bonus action.
message EndRageRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  string idempotency_key = 4;
}

// EndRageResponse returns the combat.
message EndRageResponse {
  Encounter encounter = 1;
}
