syntax = "proto3";

// The charges of magic items and the ammunition of a character at the table (SRD 5.1, "Magic Items" and
// "Weapons"). What a sheet holds is read with the character (SheetMagicItem and SheetAmmunition, in
// characters.proto); this file is what the table does with it: spend the charges of a wand, roll the d20 the
// last charge asks for, let the master correct a count, set the pieces of ammunition a character carries and
// take back half of what a combat fired.
//
// Charges and ammunition are the master's and the owning player's alone (RN-10): no other player reads them,
// and no other player's log or stream carries a word of the lines they leave.
package meurpg.play.v1;

import "meurpg/characters/v1/characters.proto";
import "meurpg/play/v1/combat.proto";
import "meurpg/play/v1/play.proto";

// ChargesService runs the charges of the magic items and the ammunition of a campaign's characters.
//
// Every method needs a valid session cookie and fails with `unauthenticated` without one. For a campaign
// the caller is not a member of, and for a character that is not in the campaign, methods answer `not_found`.
// A rule's refusal is `failed_precondition` with a CharacterBlocked detail (characters.proto) or a
// ChargesBlocked detail. Every method that writes an event carries an idempotency key; the same key with
// another request is `invalid_argument`.
service ChargesService {
  // SpendCharges spends charges of a magic item of a character's sheet, as the wand's, staff's or ring's text
  // says it is used. The character's player or the master; it works on a locked sheet, with the game session
  // open, in a combat and out of one, and it is never an action of the turn (the cast or the attack that uses
  // the item spends the turn). In a running combat that has the character in it, the call also writes a line of
  // the combat log (ITEM_CHARGE_SPENT) that only the master and the owner read.
  //
  // Spending the last charge of an item that is lost at once destroys it (the response's `item.lost`). An item
  // that rolls a d20 for its last charge waits for RollLastCharge (`item.last_roll_pending`).
  //
  // Errors: `permission_denied` for another player's character, `not_found` for a character that is not in the
  // campaign; `invalid_argument` for an amount below 1 or an entry that holds no charges; `failed_precondition`
  // with NO_OPEN_SESSION, with CharacterBlocked CHARACTER_DEAD, ITEM_DESTROYED, ITEM_NO_CHARGES (none left, or
  // the master has not set the count of an item whose start the SRD rolls) and CHARGES_NOT_ENOUGH.
  rpc SpendCharges(SpendChargesRequest) returns (SpendChargesResponse);

  // RollLastCharge rolls the d20 an item asks for when its last charge went (SRD 5.1: a 1 destroys the wand,
  // and a 20 on some items gives charges back). It works only while `item.last_roll_pending` is true. The
  // character's player or the master. The d20 follows the table's rule for dice (RN-18): the app rolls it, or
  // the player types the face of a real die; a 20 on an item that regains charges needs its die rolled the
  // same way (`typed_regain_face` for a typed roll). In a running combat that has the character in it the call
  // also writes a line (ITEM_LAST_CHARGE_ROLLED) that only the master and the owner read.
  //
  // Errors: as SpendCharges; `invalid_argument` for no roll, a d20 outside 1 to 20 or an item that waits for no
  // roll; `failed_precondition` with ChargesBlocked REGAIN_FACE_NEEDED for a typed 20 without the regain die's
  // face; EncounterBlocked WRONG_DICE_MODE for a way of rolling the campaign does not allow the player.
  rpc RollLastCharge(RollLastChargeRequest) returns (RollLastChargeResponse);

  // SetCharges is the master's correction of an item's charges: the charges left (0 to the item's maximum, which
  // is also how a rolled start gets its count) and whether and how the item was lost. It ends a roll the item
  // waited for. It writes no combat log line. Master only.
  //
  // Errors: `permission_denied` for a player; `not_found` for a character or an entry that is not there;
  // `invalid_argument` for a count out of range, an unknown loss or an entry that holds no charges.
  rpc SetCharges(SetChargesRequest) returns (SetChargesResponse);

  // SetAmmunition sets the pieces a character holds of one kind of ammunition (the catalog's arrows, bolts,
  // sling bullets and blowgun needles). The owner may while the sheet is open to editing (a draft, or waiting for
  // the master's approval), the master at any time; a player after the sheet locked is refused. It needs no open
  // game session, as the sheet's own edits need none, and writes no event.
  //
  // Errors: `permission_denied` for a player who may not (another player's character, or the owner after the
  // lock); `not_found` for a character that is not in the campaign; `invalid_argument` for a key that
  // is not a kind of ammunition or a quantity outside 0 to 9999.
  rpc SetAmmunition(SetAmmunitionRequest) returns (SetAmmunitionResponse);

  // RecoverAmmunition takes back half, rounded down, of the pieces each kind of ammunition fired in the
  // character's last combat, once the combat is over (SRD 5.1, "Weapons": a minute spent searching the
  // battlefield). It works once for each combat. The character's player or the master. It writes the session
  // event `ammunition_recovered`.
  //
  // Errors: `permission_denied` as SpendCharges; `invalid_argument` when the character fired nothing in its last
  // combat (or fought none); `failed_precondition` with ChargesBlocked COMBAT_RUNNING while the character's
  // latest combat is not ended, and ALREADY_RECOVERED once the pieces were taken back.
  rpc RecoverAmmunition(RecoverAmmunitionRequest) returns (RecoverAmmunitionResponse);

  // Dawn is the master's "Amanhecer": a new day dawns for the table and the magic items of every character of the
  // campaign recharge as their text says (SRD 5.1). Items that regain charges at dawn regain them (all, or the dice
  // the item rolls, up to the maximum; the app rolls the dice, also on a table of real dice), and an item that
  // waits for a number of dawns after its last charge counts this one and regains them all on the last. An item
  // that is lost or waits for its last d20 is left as it is. One `item_charges_restored` event is written for each
  // item that regained charges, and an item at its maximum writes nothing. A long rest with
  // TakeRestRequest.restore_dawn does the same in the rest's transaction. Master only; needs an open game session.
  //
  // Errors: `permission_denied` for a player; `failed_precondition` with NO_OPEN_SESSION; `invalid_argument` for an
  // idempotency key that is not a UUID or one reused for another request.
  rpc Dawn(DawnRequest) returns (DawnResponse);

  // UseConsumable uses up one unit of a consumable of a character's sheet (a potion, a scroll or another single-use
  // item of the catalog): the sheet entry (one entry is one unit) is removed, the use is written as the session event
  // `consumable_used` and, in a running combat, as the log line CONSUMABLE_USED, and the response says what happened. A
  // healing potion restores hit points with the dice of its text, and a resistance potion gives one hour of resistance
  // to its damage type; every other consumable only spends the unit and returns its SRD text, with no automatic effect
  // (a spell scroll is not cast). The receiver is the user, or `target_character_id` for an item given to another
  // character. Only a potion is an action, and every potion is, one that is only text included: in a running combat it
  // costs the user's action (the extra action of Haste does not pay for it) and needs the user's turn and, when it is
  // given, a receiver within 5 feet; out of a combat and in one that has not begun it costs no turn and needs no
  // adjacency, and any other consumable never does: a scroll, and an oil of the SRD's potion category, which takes a
  // minute or ten to apply and is spent and logged as text for the master to judge. A creature with three failed death
  // saves is dead and receives nothing, for every reader and also at a table that hides death saves; the refusal spends
  // nothing. A consumable event ends the undo chain. The user's
  // player (or the master, for any character) may use it. The dice follow the table's rule (RN-18). A character with no
  // hit points of its own outside a combat (an NPC) spends the unit and tells nothing automatic: the master narrates it.
  //
  // Errors: `permission_denied` for a character that is not the caller's (a player); `not_found` for a character or a
  // receiver that is not there (an NPC, a reserved character or one of another campaign is not a receiver);
  // `invalid_argument` for an entry that is not a consumable, an idempotency key that is not a UUID or one reused for
  // another request, and a roll the request does not carry; `failed_precondition` with NO_OPEN_SESSION, CharacterBlocked
  // CHARACTER_DEAD, and EncounterBlocked: ITEM_GONE for an entry that is no longer on the sheet, COMBATANT_DOWN for a
  // user at 0 hit points (it may still receive), TARGET_DEAD for a receiver with three failed death saves, and for a
  // potion in a running combat NOT_YOUR_TURN, ACTION_USED and the other reasons of an action, and TARGET_NOT_ADJACENT
  // for a receiver beyond 5 feet or out of the combat. The response carries the receiver's vitals to the master and to
  // the receiver's own player only.
  rpc UseConsumable(UseConsumableRequest) returns (UseConsumableResponse);

  // ListConsumableTargets lists who the character may give the consumable to, which is who the use would accept: for a
  // potion (every one of them, one that is only text included) in a running combat, the player's characters of the combat
  // that are adjacent (5 feet) to the user's combatant, with the distance (a creature that is not a player's character is
  // never listed, so a hidden one never is), and, when the user does not fight in it, the characters that do not fight
  // either; for any other consumable (a scroll, an oil), or with no running combat, the other characters of the party that
  // are not dead. The list follows the state word a player already reads: a creature is down at 0 hit points and on its
  // feet above, whatever its death saves, and a confirmed death is never listed.
  // The master's list leaves out a creature with three failed death saves. The master reads the list of the character it
  // acts for, and it is the one that character's player would get, except for that creature. Read only.
  //
  // Errors: `permission_denied` for a character that is not the caller's (a player); `not_found` for a character that
  // is not there; `invalid_argument` for an entry that is no consumable; `failed_precondition` with EncounterBlocked
  // ITEM_GONE for an entry that is no longer on the sheet and CharacterBlocked CHARACTER_DEAD for a dead user.
  rpc ListConsumableTargets(ListConsumableTargetsRequest) returns (ListConsumableTargetsResponse);

  // ReadScroll reads the spell on a Spell Scroll of a character's sheet (SRD 5.1, "Spell Scroll"), the step before the cast. The
  // spell must be on the scroll, of the scroll's level, on at the table, and on the list of a class the reader casts from. When its
  // level is above the highest the reader casts (pact slots included) the reader first makes an ability check with their
  // spellcasting ability against DC 10 plus the spell's level: d20 plus the modifier, rolled by the app (roll_in_app) or a physical
  // d20's face typed (d20_face), by the table's rule (RN-18); a read that needs no check takes no roll and ignores one.
  //
  // A read that needs no check, or whose check passed, spends nothing: it is written as the session event `scroll_read`, the pass
  // the cast of the scroll's spell uses. The pass lapses when the reader reads again (a scroll, whatever the result) and when the
  // reader's turn ends or the combat ends. A failed check spends the scroll's unit and the casting time's economy (in a running
  // combat: the action, the bonus action or the reaction; nothing out of one), with no effect: it is written as the session event
  // `consumable_used` and, in a running combat, as the log line CONSUMABLE_USED with the outcome SCROLL_FAILED. Both events close
  // the undo chain. A read is refused, with nothing spent, when the reader could not then cast the spell: in a running combat
  // when it is not the reader's turn or the economy of the spell's casting time is already spent (the master has the last word on
  // the economy, as for a cast). The master and the character's player may read; the roll is the master's own for an NPC.
  //
  // Errors: `permission_denied` for a character that is not the caller's (a player); `not_found` for a character that is not
  // there; `invalid_argument` for an entry that is no Spell Scroll, an idempotency key that is not a UUID or one reused for another
  // request, a d20 face outside 1 to 20, and a read that needs a check with no roll; `failed_precondition` with NO_OPEN_SESSION,
  // CharacterBlocked CHARACTER_DEAD, and EncounterBlocked: ITEM_GONE for an entry that is no longer on the sheet, COMBATANT_DOWN
  // for a reader at 0 hit points, SCROLL_NO_SPELL, SCROLL_SPELL_OFF (never naming the spell to a player), SCROLL_SPELL_NOT_ON_LIST,
  // WRONG_DICE_MODE, and in a running combat NOT_YOUR_TURN, ACTION_USED, BONUS_ACTION_USED, REACTION_USED and
  // BONUS_ACTION_SPELL_LIMIT.
  rpc ReadScroll(ReadScrollRequest) returns (ReadScrollResponse);
}

// ChargesBlockedReason is why a charges or ammunition call was refused with `failed_precondition`.
enum ChargesBlockedReason {
  CHARGES_BLOCKED_REASON_UNSPECIFIED = 0;
  // A 20 on the item's last-charge d20 regains charges and the roll was typed without the face of the die that
  // counts them (`needed` is the die's size).
  CHARGES_BLOCKED_REASON_REGAIN_FACE_NEEDED = 1;
  // The character's latest combat is not over: the pieces are taken back after it ends.
  CHARGES_BLOCKED_REASON_COMBAT_RUNNING = 2;
  // The pieces fired in the character's last combat were already taken back.
  CHARGES_BLOCKED_REASON_ALREADY_RECOVERED = 3;
}

// ChargesBlocked is the detail of ChargesService's `failed_precondition` for a rule of its own.
message ChargesBlocked {
  ChargesBlockedReason reason = 1;
  // REGAIN_FACE_NEEDED: the size of the die to type.
  int32 needed = 2;
}

message SpendChargesRequest {
  string campaign_id = 1;
  string character_id = 2;
  // The id of the item on the sheet (SheetMagicItem.id).
  string entry_id = 3;
  // The charges to spend, at least 1.
  int32 amount = 4;
  string idempotency_key = 5;
}

message SpendChargesResponse {
  // The item as it stands now: its charges left, whether it was lost and whether it waits for its d20.
  meurpg.characters.v1.SheetMagicItem item = 1;
}

message RollLastChargeRequest {
  string campaign_id = 1;
  string character_id = 2;
  string entry_id = 3;
  string idempotency_key = 4;
  // How the d20 comes (RN-18): the app rolls it, or the player typed the face of a real die. Required: one of
  // them.
  oneof roll {
    bool roll_in_app = 5;
    int32 d20_face = 6;
  }
  // The face of the die that counts the charges a 20 gives back, for a typed roll only (an app roll rolls it on
  // the server). It is needed only when the d20 is a 20 on an item that regains charges: the call is refused with
  // ChargesBlocked REGAIN_FACE_NEEDED when it is missing, and `invalid_argument` when it is outside the die.
  int32 typed_regain_face = 7;
}

message RollLastChargeResponse {
  // The item after the roll.
  meurpg.characters.v1.SheetMagicItem item = 1;
  // The d20 rolled or typed.
  int32 d20 = 2;
  // The charges a 20 gave back (0 for any other face), already counted in `item.charges_left`.
  int32 regained = 3;
  // How the roll lost the item (ITEM_LOSS_UNSPECIFIED when it did not).
  meurpg.characters.v1.ItemLoss lost = 4;
  // The face of the regain die rolled or typed, 0 when none was needed.
  int32 regain_face = 5;
}

message SetChargesRequest {
  string campaign_id = 1;
  string character_id = 2;
  string entry_id = 3;
  // The charges left, 0 to the item's maximum.
  int32 charges_left = 4;
  // How the item was lost; ITEM_LOSS_UNSPECIFIED when it is not (this also brings a lost item back).
  meurpg.characters.v1.ItemLoss lost = 5;
  string idempotency_key = 6;
}

message SetChargesResponse {
  meurpg.characters.v1.SheetMagicItem item = 1;
}

message SetAmmunitionRequest {
  string campaign_id = 1;
  string character_id = 2;
  // The catalog key of the ammunition, such as "equipment:arrow".
  string ammo_key = 3;
  // The pieces the character holds, 0 to 9999.
  int32 quantity = 4;
}

message SetAmmunitionResponse {
  meurpg.characters.v1.SheetAmmunition ammunition = 1;
}

message RecoverAmmunitionRequest {
  string campaign_id = 1;
  string character_id = 2;
  string idempotency_key = 3;
}

message RecoverAmmunitionResponse {
  // The kinds the recovery changed, with the pieces the character holds now.
  repeated meurpg.characters.v1.SheetAmmunition ammunition = 1;
}

message DawnRequest {
  string campaign_id = 1;
  string idempotency_key = 2;
}

message DawnResponse {
  // The items that regained charges, in the order of the characters and of their sheets. A retry with the same
  // key answers with the items as they stand now.
  repeated DawnRestored restored = 1;
}

// DawnRestored is one item a dawn gave charges back to.
message DawnRestored {
  string character_id = 1;
  // The item after the dawn.
  meurpg.characters.v1.SheetMagicItem item = 2;
  // The charges it regained.
  int32 regained = 3;
}

message UseConsumableRequest {
  string campaign_id = 1;
  // The character that uses the consumable: the one whose sheet holds it.
  string character_id = 2;
  // The id of the entry on the sheet (SheetMagicItem.id).
  string entry_id = 3;
  // The character that receives the effect, when it is not the user. Empty for the user.
  string target_character_id = 4;
  string idempotency_key = 5;
  // How the healing dice come (RN-18), for a healing potion only: the app rolls them, or the player typed the faces of
  // real dice, one for each die of the potion. Ignored by every other consumable.
  bool roll_in_app = 6;
  repeated int32 typed_faces = 7;
}

message UseConsumableResponse {
  // The entry that was used up (SheetMagicItem.id).
  string entry_id = 1;
  // The catalog key and the name, in Portuguese when the content has it, of the item used.
  string item_key = 2;
  string item_name_pt = 3;
  ConsumableUseOutcome outcome = 4;
  // The item's text, in Portuguese when the content has it, else the SRD's in English: what the table applies for a
  // consumable the app carries out no effect for (TEXT_ONLY).
  repeated string text = 5;
  // HEALED: the dice, the faces rolled or typed, the total and the hit points regained.
  string dice_text = 6;
  repeated int32 faces = 7;
  int32 roll_total = 8;
  int32 healed = 9;
  // RESISTANCE: the damage type's key.
  string damage_type_key = 10;
  // The character that received the effect.
  string target_character_id = 11;
  // The vitals of the characters the use changed (the receiver).
  repeated CharacterVitals vitals = 12;
}

message ReadScrollRequest {
  string campaign_id = 1;
  // The character that reads the scroll: the one whose sheet holds it.
  string character_id = 2;
  // The id of the scroll's entry on the sheet (SheetMagicItem.id).
  string entry_id = 3;
  string idempotency_key = 4;
  // How the check's d20 comes (RN-18), for a read that needs a check only: the app rolls it, or the player typed the face of a
  // real die.
  oneof roll {
    bool roll_in_app = 5;
    int32 d20_face = 6;
  }
}

message ReadScrollResponse {
  ScrollReading reading = 1;
}

// ScrollReading is what a reading of a Spell Scroll came to, as the reader reads it (the character's player and the master).
message ScrollReading {
  // The scroll's entry on the sheet (SheetMagicItem.id).
  string entry_id = 1;
  ScrollReadOutcome outcome = 2;
  // The spell the scroll holds: its catalog key and its name in Portuguese.
  string spell_key = 3;
  string spell_name_pt = 4;
  // The scroll's level, 0 for a cantrip, and the level the spell is cast at (the spell's own).
  int32 scroll_level = 5;
  int32 cast_level = 6;
  // The check, on PASSED and FAILED only: its DC (10 plus the spell's level), the d20 face, the spellcasting modifier and the
  // total (d20 plus modifier). 0 when no check was made.
  int32 check_dc = 7;
  int32 d20 = 8;
  int32 modifier = 9;
  int32 total = 10;
  // The unit left the sheet: true on FAILED, false on the other outcomes.
  bool entry_gone = 11;
}

// ScrollReadOutcome is what the reading of a Spell Scroll came to.
enum ScrollReadOutcome {
  SCROLL_READ_OUTCOME_UNSPECIFIED = 0;
  // The spell's level is one the reader casts: no check, and the read stands until the cast, the reader's next read or the end of
  // the reader's turn.
  SCROLL_READ_OUTCOME_NO_CHECK_NEEDED = 1;
  // The check passed: the read stands as above.
  SCROLL_READ_OUTCOME_PASSED = 2;
  // The check failed: the scroll came apart with no effect, and the casting time's economy was spent.
  SCROLL_READ_OUTCOME_FAILED = 3;
}

message ListConsumableTargetsRequest {
  string campaign_id = 1;
  // The character that holds the consumable (the user).
  string character_id = 2;
  // The id of the entry on the sheet (SheetMagicItem.id).
  string entry_id = 3;
}

message ListConsumableTargetsResponse {
  repeated ConsumableTarget targets = 1;
  // The user's character is a combatant of a combat that is running (not in setup) in the campaign's open session. The same
  // test sets the target states and the reach of a potion, so the answer never disagrees with them. The web reads it instead
  // of reading the combat. Read by the character's player and the master.
  bool in_combat = 2;
}

// ConsumableTarget is a character the consumable may be given to.
message ConsumableTarget {
  string character_id = 1;
  string name = 2;
  // The distance from the user's combatant, in feet; 0 when the list has no distance (no running combat, or a user that
  // does not fight in it).
  int32 distance_ft = 3;
  // How the character stands: set for a combatant of a running combat, UNSPECIFIED for a character outside one (the hit
  // points of a player's character are no other player's to read there).
  ConsumableTargetState state = 4;
  // Whether the character may receive it (true for every listed character).
  bool may_receive = 5;
}

// ConsumableTargetState is how a possible receiver stands, as every player at the table may see it.
enum ConsumableTargetState {
  // Not told: the character is outside a running combat.
  CONSUMABLE_TARGET_STATE_UNSPECIFIED = 0;
  // On its feet: above 0 hit points.
  CONSUMABLE_TARGET_STATE_OK = 1;
  // At 0 hit points (unconscious): it cannot act, and a potion given to it wakes it.
  CONSUMABLE_TARGET_STATE_DOWN = 2;
}
