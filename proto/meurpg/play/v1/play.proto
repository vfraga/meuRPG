syntax = "proto3";

// Package meurpg.play.v1 is about playing a campaign at the table: starting,
// ending and listing game sessions, which locks the players' sheets
// (RN-01), and the live session: the notice that a session is
// open (RN-06), the session's live stream (ADR-0005), the characters'
// vitals, which the master corrects during the session (RN-02), the
// session's current map (the maps themselves are meurpg.maps.v1), and the
// gallery image the master shows the players (MR-028). Combat has its own
// service (combat.proto, CombatService: MR-013), with its attacks, actions
// and log.
package meurpg.play.v1;

import "google/protobuf/timestamp.proto";
import "meurpg/campaigns/v1/campaigns.proto";
import "meurpg/play/v1/combat.proto";
import "meurpg/play/v1/free_dice.proto";
import "meurpg/play/v1/scene.proto";
import "meurpg/play/v1/session_messages.proto";
import "meurpg/play/v1/summary.proto";
import "meurpg/play/v1/traps.proto";
import "meurpg/rules/v1/rules.proto";

// PlayService runs a campaign's game sessions and the live session.
//
// Every method needs a valid session cookie and fails with `unauthenticated`
// without one. For a campaign the caller is not a member of, methods answer
// `not_found`, exactly as for a campaign that does not exist. A player
// calling a method only the master may call gets `permission_denied`. See
// ADR-0011. An ID that is not a UUID is answered like an ID that does not
// exist.
//
// When the campaign has no open game session, the live-session methods
// (GetLiveSession, WatchGameSession, AdjustCharacterVitals, SetCurrentMap,
// SetShownImage, OpenScene, CloseScene, GetOpenScene, RollSceneCheck) fail
// with `failed_precondition` and a GameSessionBlocked detail whose reason is
// NO_OPEN_SESSION, so the app can show "Nenhuma sessão em andamento".
//
// Errors every method can return, besides those listed on each method:
//   - `unauthenticated`: no valid session cookie.
//   - `unavailable`: the database did not answer; the app may try again.
//   - `aborted`: the database kept reporting a conflicting transaction
//     after the server's retries; the app may try again.
//
// Responses carry `Cache-Control: no-store`, because they describe the
// caller's campaigns. Reads that carry a campaign ID are IDEMPOTENT and
// POST-only: a GET would put the ID in the URL, and URLs end up in the
// platform's request logs (docs/privacy.md). ListOpenGameSessions,
// whose request is empty, is NO_SIDE_EFFECTS and may use GET.
service PlayService {
  // StartGameSession opens the campaign's next game session. Only the
  // campaign's master may call it.
  //
  // In the same transaction, it locks the sheets of the campaign's player
  // characters that are alive and still drafts (RN-01): from then on, only
  // the master edits them. That includes characters created after an
  // earlier session, such as a replacement for a dead character: they lock
  // at the first session that starts after they were created. NPCs never
  // lock. It also ends every permission the master gave players to edit a
  // story (CharacterService.SetStoryEditing).
  //
  // A campaign has at most one open session. Not idempotent: calling it
  // again while the session is open fails with `failed_precondition`.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a
  //     member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: the campaign already has an open session
  //     (GameSessionBlocked, SESSION_ALREADY_OPEN). End it first.
  //
  // Safe to retry when the request carries an idempotency_key: a second call with the same key and
  // the same request returns what the first one made and makes nothing; the same key with another
  // request is `invalid_argument`. Without a key the call is not deduplicated.
  rpc StartGameSession(StartGameSessionRequest) returns (StartGameSessionResponse);

  // EndGameSession ends one of the campaign's game sessions. Only the
  // campaign's master may call it. Ending a session that already ended is
  // not an error: it returns the session as it is, with its first
  // ended_at. Ending a session never unlocks a sheet.
  //
  // Ending the open session sends `session_ended` on every
  // WatchGameSession stream of the campaign, which then ends.
  //
  // Errors:
  //   - `not_found`: the session is not in this campaign, the campaign does
  //     not exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  rpc EndGameSession(EndGameSessionRequest) returns (EndGameSessionResponse);

  // GetSessionSummary tells how an ended session went: "Resumo da sessão"
  // (MR-032, question 64). It sums the combats' highlights across the whole
  // session (the same categories and rules as CombatService.
  // GetCombatHighlights, per character), counts the combats and the scenes
  // opened, and adds "Testes passados fora do combate": the checks the
  // players rolled in scenes that showed their DC (`show_dc`) at the time of
  // the roll, on actions that had a DC. A roll made while the DC was hidden
  // never enters any count, for anyone (RN-20): the scene did not tell the
  // players it was a pass or a fail, and the summary must not either.
  //
  // Only an ended session has a summary: a session still open is refused
  // (GameSessionBlocked, SESSION_NOT_ENDED), because its numbers keep moving
  // and each combat already has its own highlights. The app calls it after
  // `session_ended` (every member's stream gets it, with the session's id). It
  // answers for any ended session of the campaign, though the app has no
  // screen for an older one yet.
  //
  // What each one gets (RN-20): every member gets the session's times and the
  // categories with their winners and numbers, without the number tried.
  // The master also gets the counts (combats, scenes, checks passed and
  // tried) and the table with every player's numbers. A player also gets
  // their own result (`mine`) and never another player's. No NPC is ever
  // named. Any member may call it.
  //
  // Errors:
  //   - `not_found`: the session is not in this campaign (or the id is not a
  //     UUID), the campaign does not exist, or the caller is not a member of
  //     it.
  //   - `failed_precondition`: the session has not ended (GameSessionBlocked,
  //     SESSION_NOT_ENDED).
  rpc GetSessionSummary(GetSessionSummaryRequest) returns (GetSessionSummaryResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListGameSessions lists the campaign's game sessions, newest first. Any
  // member may call it. The list is not paginated.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a
  //     member of it.
  rpc ListGameSessions(ListGameSessionsRequest) returns (ListGameSessionsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListOpenGameSessions lists the open game sessions of every campaign the
  // caller is an active member of, as master or player, newest first. It is
  // the in-app notice that a session started (RN-06): the app calls it
  // about every 30 seconds while its tab is visible and the user is signed
  // in, and once when the tab comes back into view. A pending member
  // (RN-15) is not a member, so their campaigns never show up here. Anyone
  // signed in may call it; the list is not paginated.
  rpc ListOpenGameSessions(ListOpenGameSessionsRequest) returns (ListOpenGameSessionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetLiveSession returns the campaign's open game session and the vitals
  // the caller may see (RN-02): the master gets every living player
  // character of the campaign (not the dead ones, nor one waiting for
  // approval); a player gets only their own living character, or none. It
  // is the live session's snapshot: the app reads it after
  // WatchGameSession's `ready` event, and again after every reconnection,
  // so a missed event never leaves the screen stale. It also names the
  // session's current map (SetCurrentMap), which the app reads with
  // meurpg.maps.v1.MapService.GetMap, and the image the master shows
  // (SetShownImage). Any member may call it.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a
  //     member of it (a pending member neither). The app shows "Peça um
  //     convite ao mestre", without the campaign's name.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION).
  rpc GetLiveSession(GetLiveSessionRequest) returns (GetLiveSessionResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // WatchGameSession streams the live changes of the campaign's open game
  // session to one member (ADR-0005). Any member may call it.
  //
  // The first message is always `ready`, sent once the server has
  // subscribed the caller: only then does the app read the snapshot
  // (GetLiveSession), so no change falls between the snapshot and the
  // stream. A change can also arrive before the snapshot answers; the
  // vitals' `revision` tells which is newer. Then:
  //   - `heartbeat` every 25 seconds, so the app can tell a dead stream
  //     (nothing for about 60 seconds) and proxies don't close an idle one;
  //   - `vitals_changed` when the master corrects a character's vitals,
  //     sent only to the master and to that character's player;
  //   - `current_map_changed` when the master sets the session's current
  //     map, or it is deleted; sent to everyone;
  //   - `map_changed` when something the member sees on a map changed (a
  //     point, a token's state, the map's name, image or revealed state);
  //     the app reads the map again (MapService.GetMap). A player gets it
  //     only when the change touches something they see, before or after
  //     it (RN-10): a change to hidden things reaches only the master;
  //   - `token_moved` when the master moves a token: to everyone when the
  //     token is visible on a map the players see, only to the master
  //     otherwise. On a map with the fog of war on, only a player
  //     character's token goes to the players: an NPC's move reaches them
  //     only as `vision_changed`, never with its square;
  //   - `vision_changed` on a map with the fog of war on: what the player
  //     sees or remembers changed, or an NPC moved on a square they see; a
  //     hint, and the app reads MapService.GetMapVision and the map again.
  //     Sent only to the players it touches, and not queued again while one
  //     waits in the stream's queue; the master gets it when a sight zone or
  //     a Wild Shape changes, whether or not a player's view moved;
  //   - `shown_image_changed` when the master shows an image, stops showing
  //     it, deletes it, or changes who sees it. A player gets it only when
  //     what they see changed: the image, for a player who sees it now, and
  //     no image, for a player who saw one and does not any more; a player
  //     outside the image's audience, who saw nothing before, gets nothing.
  //     The master gets every one, with the audience;
  //   - `left_images_changed` when the list of images left with the players
  //     changed (an image left, taken back or deleted); a hint, sent to the
  //     master and to the players the image was left with;
  //   - `encounter_changed` when anything changes in the combat; a hint,
  //     sent to everyone, and the app reads the combat again
  //     (CombatService.GetEncounter);
  //   - `turn_changed` when the turn passes: the round and who is on turn,
  //     as each member may see it (a player sees a hidden combatant's turn
  //     as the master's);
  //   - `combatant_moved` when a combatant moves on the grid: to the master
  //     always, and to a player only for a combatant they may see;
  //   - `combat_log_changed` when a line of the combat log appeared, changed
  //     or went away; a hint, and the app reads the log again
  //     (CombatService.ListCombatLog). The master gets every one; a player
  //     only those that touch a line they may see;
  //   - `content_changed` when the table's content changed (an entry written,
  //     archived or brought back, or an option switched on or off); a hint with
  //     no content, sent to everyone, and each app reads the content again with
  //     its own role (ContentService.ListContent);
  //   - `puzzle_changed` when a puzzle of the session was shown, hidden, reset, got a
  //     hint or was played; a hint with no content, sent to everyone, and the app
  //     reads the puzzle again (PuzzleService.GetPuzzleRun);
  //   - `xp_changed` when the campaign's XP changed (an award, an undo, a
  //     milestone, or a character going up a level); a hint with no content,
  //     sent to everyone, and the app reads ProgressionService again;
  //   - `scene_changed` when the open scene changed (opened, closed, or one
  //     of its actions or its point changed); a hint, and the app reads it
  //     again (GetOpenScene). Sent to the master and to the players in the
  //     scene (everyone, when the scene is open to the whole table), except a
  //     change only the master reads (the clues, the hooks, and a hidden
  //     action that stays hidden), which reaches the master alone. When the
  //     master changes who is in (OpenScene, SetSceneAudience), the players
  //     who came in and the players who went out get it too, so the first
  //     read the scene and the second read "no scene";
  //   - `scene_check_rolled` when a character rolled an action of the open
  //     scene; sent only to the master and to the roller, with no number;
  //   - `stage_changed` when the stage changed (an NPC came in or went out,
  //     the speaker changed, an NPC was shown or hidden, or the scene
  //     closed); a hint, sent to everyone, and the app reads the open scene
  //     again (GetOpenScene). Sent to the master and to the players in the
  //     scene, as `scene_changed`. A change only the master reads (a hidden
  //     NPC put on the stage or taken off it) reaches the master alone;
  //   - `notes_changed` when the master revealed a clue to a player; sent
  //     only to the players who got it, and the app reads their notes again
  //     (NotesService.ListNotes);
  //   - `creatures_changed` when a character's creatures changed outside a
  //     combat; sent only to the master and the creatures' owner, and the app
  //     reads them again (CharacterService.ListCharacterCreatures);
  //   - `trap_noticed` when a player's character noticed a trap by passing
  //     near it; sent only to that player, never to the master or another
  //     player (RN-10);
  //   - `session_ended` when the master ends the session; the stream then
  //     ends without an error.
  //
  // About every 60 seconds the server checks again, in the database, that
  // the caller is still signed in and still a member: if not, the stream
  // ends with the same error a call would get (`unauthenticated` or
  // `not_found`). A stream lasts at most 10 minutes and then ends without
  // an error; it also ends without an error when the server restarts. A
  // stream that cannot keep up (the app stopped reading) ends with
  // `unavailable`.
  //
  // The app reconnects after any end that is not an error below, with
  // backoff (1 s, 2 s, 4 s, up to 30 s, with jitter), and only while the
  // tab is visible; after each reconnection it reads the snapshot again.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a
  //     member of it (a pending member neither).
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION).
  //   - `unavailable` on an open stream: the caller opened a 5th stream on
  //     this campaign (more than a few tabs and devices), and this one, their
  //     oldest, made room for it. It is usually the stream of a page that went
  //     away and was not noticed yet; if the page is still open, the app
  //     reconnects with its backoff, as after any transient end. Opening a
  //     stream is never refused for the count.
  //   - `unavailable` on an open stream: the server instance stopped
  //     receiving calls (a deploy moved the traffic to another revision).
  //     It is transient: the app reconnects, now to the active revision, and
  //     reads the snapshot again.
  rpc WatchGameSession(WatchGameSessionRequest) returns (stream WatchGameSessionResponse);

  // AdjustCharacterVitals is the master's correction of a player
  // character's vitals during the session (RN-02: the master has the final
  // word). Only the campaign's master may call it, and only while the
  // campaign has an open session. The character must be a living player
  // character of the campaign.
  //
  // Each value set in the request replaces the current one; unset values
  // stay as they are. At least one must be set. The change and a
  // session_events row are written together, then `vitals_changed` goes to
  // the master's and the character's player's streams.
  //
  // The class and race resources' used counts (resources_used: Retomar o
  // fôlego, Surto de ação...) are corrected here too: the app counts a use
  // when the combat spends it and the master brings it back (rests come
  // later). Healing a character above 0 hit points also resets the death
  // saves of its combatant in the session's combat (RN-03), and a character
  // set to 0 is "Caído" there.
  //
  // Calling again with the same idempotency_key (a retry) changes nothing
  // and returns the character's current vitals.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, the caller is not a
  //     member of it, or the character is not a living player character of
  //     the campaign (an NPC, a dead character, one waiting for approval).
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION).
  //   - `invalid_argument`: nothing to change, an idempotency_key that is
  //     not a UUID or was already used for another character, or a value
  //     outside 0 to its maximum. The message names the field, such as
  //     `spell_slots_used[0].used`.
  //   - `aborted`: expected_revision is absent or is not the revision of the
  //     character's vitals now. Nothing is written.
  rpc AdjustCharacterVitals(AdjustCharacterVitalsRequest) returns (AdjustCharacterVitalsResponse);

  // NudgePlayer is the master's "Chamar a atenção": it makes the player of one
  // character feel an alert on their own screen (vibration, a chime, a shake
  // and, in a hidden tab, "● Sua vez" in the title, as when the turn comes to
  // them) and read "O mestre está chamando você.". Only the campaign's master
  // may call it, and only while the campaign has an open session. The
  // character must be a living player character of the campaign with a player.
  //
  // It is ephemeral: it writes nothing (no session event, no log line) and
  // only the `calling_you` event goes, to that player's streams alone. A
  // player that is not connected simply misses it. At most one nudge per
  // character every 10 seconds, kept in the server's memory.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, the caller is not a member
  //     of it, or the character is not a living player character of the
  //     campaign with a player (an NPC, a dead character, one waiting for
  //     approval, one whose player left).
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION).
  //   - `resource_exhausted`: the character was nudged in the last 10 seconds.
  rpc NudgePlayer(NudgePlayerRequest) returns (NudgePlayerResponse);

  // SendSessionMessage sends a line to the conversation of the open session
  // (MR-051, RN-36). The master speaks as the narrator or as an NPC of the
  // campaign, and may attach a gallery image and choose any set of the
  // campaign's players as readers (empty: the whole table). A player speaks
  // as their own living character (RN-18) or out of character, and chooses
  // everyone or only the master. The master and the author always read the
  // line.
  //
  // The line is stored, then `session_message_added` goes to each reader's
  // streams and the master's, and to nobody else: whoever is not a reader
  // gets no event, no count and no trace of it (RN-10). An image that is a
  // fog map's background is attached as its copy, as "mostrar imagem" does.
  // The idempotency key is required: the same key and request returns the
  // first line and sends nothing again.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist or the caller is not an
  //     active member; also an NPC or character that is not the caller's to
  //     speak as, a reader who is not a player of the campaign, an image that
  //     is not in the campaign's gallery.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION).
  //   - `permission_denied`: a player tried a master's kind, an image or
  //     readers; the master tried only_master.
  //   - `invalid_argument`: empty or over-long text, a missing key or kind.
  //   - `resource_exhausted`: too many lines in a short time, per user.
  rpc SendSessionMessage(SendSessionMessageRequest) returns (SendSessionMessageResponse);

  // ListSessionMessages reads a session's lines the caller may read (MR-051,
  // RN-36), oldest first within the page, the newest page by default.
  // Opening the live session reads it, and a reconnection reads the gap. The
  // lines of a session the caller may not read at all are never counted or
  // hinted at.
  //
  // Errors:
  //   - `not_found`: the campaign, the session or `before_id` does not exist
  //     for the caller (a line the caller may not read included).
  //   - `failed_precondition`: no game_session_id and no open session.
  rpc ListSessionMessages(ListSessionMessagesRequest) returns (ListSessionMessagesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // SignalMasterTyping tells the players the master is writing (MR-051): a
  // content-free `master_typing` event to the players' streams, which the app
  // shows as "O mestre está escrevendo…" for a few seconds. Only the master,
  // only with a session open. Calls closer than two seconds from the last of
  // the campaign are answered and send nothing. Nothing is stored.
  //
  // Errors:
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: no open session.
  rpc SignalMasterTyping(SignalMasterTypingRequest) returns (SignalMasterTypingResponse);

  // RollFreeDice rolls dice for the caller with the server's dice, outside every
  // game rule (MR-052): 1 to 20 dice of 4, 6, 8, 10, 12, 20 or 100 sides, plus a
  // modifier from -20 to +20, and advantage or disadvantage on a single d20 only
  // (two d20, the higher or the lower counts, the other is marked discarded). It
  // needs an open session and any member of the campaign. The table's dice mode
  // (RN-18) does not apply: the app always rolls, and the log marks it
  // "Rolagem livre".
  //
  // The roll is stored as a session event (the log line is in `FreeRoll.log_text`)
  // and `free_roll_rolled` goes to every stream of the campaign. The master may
  // ask for `secret` ("Só eu"): that roll is stored for the master alone and
  // reaches no stream, no list, no session summary and no count of any player
  // (RN-10). At most 20 rolls in a burst and one more every 3 seconds, per user.
  // The idempotency key is required.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist or the caller is not an active
  //     member.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION).
  //   - `permission_denied`: a player asked for `secret`.
  //   - `invalid_argument`: sides, count or modifier out of range, advantage or
  //     disadvantage on anything but one d20, a missing or over-long key, or a
  //     key used for another request.
  //   - `resource_exhausted`: too many rolls in a short time (Retry-After).
  rpc RollFreeDice(RollFreeDiceRequest) returns (RollFreeDiceResponse);

  // ListFreeRolls reads the free rolls of the open session the caller may read
  // (MR-052, RN-10): the table's, newest first, and the caller's own. A player
  // never gets a secret roll, nor a count or a hint of one.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist or the caller is not an active
  //     member.
  //   - `failed_precondition`: no open session.
  rpc ListFreeRolls(ListFreeRollsRequest) returns (ListFreeRollsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // SetCurrentMap chooses the map the session shows at the table, or clears
  // it. Only the campaign's master may call it, and only while the campaign
  // has an open session. The map must be one of the campaign's
  // (meurpg.maps.v1.MapService), and setting it also reveals it to the
  // players (RN-10): a player always sees the current map. Setting the same
  // map again is fine.
  //
  // Every WatchGameSession stream of the campaign then gets
  // `current_map_changed`, and GetLiveSession returns the new map. A new
  // session starts without a current map.
  //
  // Errors:
  //   - `not_found`: the map is not in this campaign, the campaign does not
  //     exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION).
  rpc SetCurrentMap(SetCurrentMapRequest) returns (SetCurrentMapResponse);

  // SetShownImage shows the players an image of the campaign's gallery, or
  // stops showing it (MR-028): a handout, such as a portrait, a letter or a
  // scene. Only the campaign's master may call it, and only while the
  // campaign has an open session. One image at a time; showing another
  // replaces it. It is apart from the current map: the players may see
  // both.
  //
  // It reveals nothing else: a player learns the image's ID only while it
  // is shown (GetLiveSession, `shown_image_changed`), never the gallery.
  // `shown_image_changed` goes to the streams of the audience (below). A new
  // session starts showing nothing; deleting the image
  // (GalleryService.DeleteGalleryImage) stops showing it.
  //
  // The image has an AUDIENCE (`audience`, ImageAudience; MR-028, RN-10):
  //   - the whole table: every member. It is the only audience while no scene
  //     is open, or the open scene is open to everyone: the image behaves as an
  //     image shown with no scene;
  //   - the scene's players: the players in the scene open to only some
  //     players (OpenScene, SetSceneAudience), and the master. It is the
  //     default while such a scene is open, and it follows who is in the scene
  //     while that scene stays open. When the scene closes, another is opened,
  //     or the scene opens to everyone, the image stays with the players who were
  //     in at that moment (it becomes "chosen players" with them) and nobody
  //     else receives it;
  //   - chosen players: the players named, whoever they are.
  // A player outside the audience gets the image nowhere: not in
  // GetLiveSession, not in `shown_image_changed`, not through the image route
  // (GET /images/{id} answers 404), not in the left list, and the summary
  // never names it. The master changes the audience while the image is shown
  // with SetShownImageAudience.
  //
  // An image that is the background of a map with the fog of war on is never
  // sent to a player (RN-10): the session then shows a copy of it, a new gallery
  // image with the same bytes (named "... (névoa)"), and the shown image's ID in
  // the response and in GetLiveSession is the copy's. The copy takes a place in
  // the campaign's gallery: `resource_exhausted` when it is full.
  //
  // `keep` is the "Deixar com os jogadores" switch of the image shown. With
  // it on, when the master stops showing the image, shows another one or
  // ends the session, the image is left with the players
  // (ListLeftImages) instead of being taken away, and the streams get
  // `left_images_changed`. The master sets it by calling again with the
  // same image_id and the new `keep`, which sends no event: the players
  // never learn the switch. It is off for every image newly shown unless
  // the call says otherwise. The image is left only with the players of its
  // audience at that moment (a fixed set, or everyone for the whole table).
  // An image left again, with another audience, keeps the widest: whoever
  // had it still has it, and the players of this leaving have it too. Only
  // TakeBackLeftImage narrows it.
  //
  // Errors:
  //   - `not_found`: the image is not in the campaign's gallery, the
  //     campaign does not exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION).
  //   - `resource_exhausted`: the image is a fog map's background and the
  //     gallery is full, so it cannot be copied.
  //   - `invalid_argument`: the audience is malformed (see ImageAudience), or
  //     names someone who is not a player of the campaign.
  //   - `failed_precondition` with SceneBlocked SCENE_NOT_PARTIAL: the
  //     audience asked is the scene's players and no scene open to only some
  //     players is open.
  rpc SetShownImage(SetShownImageRequest) returns (SetShownImageResponse);

  // SetShownImageAudience changes who sees the image that is shown now,
  // while it is shown (MR-028): "Mostrar a toda a mesa" is the whole table,
  // "Mudar quem vê" is a set of chosen players, and the scene's players is the
  // default of a scene open to only some players. Only the campaign's master
  // may call it. The kind IMAGE_AUDIENCE_KIND_UNSPECIFIED is refused. The
  // same audience again changes nothing.
  //
  // Narrowing takes the image away at once from the players who are out of
  // the new audience: GetLiveSession no longer returns it to them, the image
  // route answers them 404, they get `shown_image_changed` with no image (the
  // update they get when an image stops being shown), and the players who
  // stay get nothing. Widening sends `shown_image_changed` with the image to
  // the players who came in. The audience of an image left with the players
  // (TakeBackLeftImage) is not changed here.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, the caller is not a member
  //     of it, or no image is shown.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: the audience is malformed, or names someone who is
  //     not a player of the campaign.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION), or SceneBlocked SCENE_NOT_PARTIAL (see SetShownImage).
  rpc SetShownImageAudience(SetShownImageAudienceRequest) returns (SetShownImageAudienceResponse);

  // ListLeftImages returns the images the master left with the players
  // (SetShownImage's `keep`), in the order they were left. Any active
  // member may call it, in or out of a session: the left images belong to
  // the campaign, not to a session. They stay until the master takes them
  // back (TakeBackLeftImage), also after the session ends, so the list
  // lives in the campaign (campaign_left_images) and not in the session,
  // which would take the images away from the players when it ends. A
  // player gets their files (GET /images/{id}) while the image is on this
  // list and they are in its audience (RN-10): a player gets only the images
  // that were left with them, and the master gets every one, each with its
  // `audience`.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a
  //     member of it (a pending member neither).
  rpc ListLeftImages(ListLeftImagesRequest) returns (ListLeftImagesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // TakeBackLeftImage takes an image back from the players ("Tirar"): it
  // leaves the list, and the players can no longer fetch it. The image
  // stays in the gallery. Only the campaign's master may call it, in or out
  // of a session. The master and the players the image was left with get
  // `left_images_changed`. Taking back an image that is not on the list is
  // `not_found`, so a second call (another tab) says so.
  //
  // Errors:
  //   - `not_found`: the image is not on the campaign's left list, the
  //     campaign does not exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  rpc TakeBackLeftImage(TakeBackLeftImageRequest) returns (TakeBackLeftImageResponse);

  // OpenScene opens an RP scene in the session (MR-015, D7): the master
  // picks a SCENE point of the campaign's maps and every member sees it,
  // live, with the point's name and description and its actions, if it has
  // any (a scene with no actions opens too, question 63); each player with
  // their own character's bonus (GetOpenScene). The master also gets the
  // point's hooks and clues. Only the campaign's master may call it, and
  // only while the campaign has an open session. One scene at a time:
  // opening another replaces the first. The point may be hidden: opening it
  // reveals nothing, it stays hidden on the map (RN-10), but the group has
  // now "discovered" the scene (MR-030). Opening the scene that is already
  // open changes nothing; closing it and opening it again starts the rolls
  // afresh. The master and the scene's players get `scene_changed`, and a
  // `scene_opened` event goes to the history.
  //
  // The scene may be open to only some players (`audience`): the default is
  // the whole table, a later joiner included. A player outside the audience
  // gets no scene at all, exactly as when none is open: GetOpenScene answers
  // them with no scene, RollSceneCheck is refused as with no open scene, and
  // the stream tells them nothing but, when they were in the scene before
  // this call, a `scene_changed` so that they read "no scene". The master
  // changes who is in later with SetSceneAudience.
  //
  // Errors:
  //   - `not_found`: the point is not a SCENE point of the campaign's maps,
  //     the campaign does not exist, or the caller is not a member of it.
  //   - `invalid_argument`: an account of `audience` is not a player of the
  //     campaign, or the audience is malformed (see SceneAudience).
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION).
  rpc OpenScene(OpenSceneRequest) returns (OpenSceneResponse);

  // SetSceneAudience changes the players the open scene is open to, while it
  // is open (MR-015, RN-10). Only the campaign's master may call it. A player
  // who comes in reads the scene at once (they get `scene_changed`); a player
  // who goes out loses it at once: GetOpenScene answers them as if none were
  // open, RollSceneCheck is refused as with no open scene, and they get
  // `scene_changed` so that they read it. The players who stay, and the
  // master, get `scene_changed` too (the master's other screens read who is
  // in). The rolls already made stay with the opening, and come back to a
  // player who comes in again. An image shown to the scene's players follows
  // the change (SetShownImage). With the same audience nothing changes.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist or the caller is not a member
  //     of it.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: no audience, or a malformed one (see
  //     SceneAudience), or an account that is not a player of the campaign.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION), or no scene is open (SceneBlocked NO_OPEN_SCENE).
  rpc SetSceneAudience(SetSceneAudienceRequest) returns (SetSceneAudienceResponse);

  // SetScenePlayersMayJoin turns the switch "Os jogadores podem entrar" of the open scene (MR-015, RN-10), off by
  // default and set back to off when the scene closes or another opens. Only the master may call it, and only
  // for a scene open to only some players (a scene open to everyone has nobody to let in:
  // SceneBlocked SCENE_NOT_PARTIAL). With it on, every player out of the scene reads GetOpenScene as a scene
  // with only `name` and `joinable` (nothing else of it), and may call JoinScene; with it off they read no
  // scene. Every player gets `scene_changed` when the switch changes, so the prompt appears or goes. The same
  // value changes nothing.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: no open session (GameSessionBlocked, NO_OPEN_SESSION), no scene (SceneBlocked
  //     NO_OPEN_SCENE) or a scene open to everyone (SceneBlocked SCENE_NOT_PARTIAL).
  rpc SetScenePlayersMayJoin(SetScenePlayersMayJoinRequest) returns (SetScenePlayersMayJoinResponse);

  // JoinScene adds the caller to the players of the open scene, when the master lets players join. The caller
  // then reads the scene as any member does, and gets `scene_changed`; the master sees who joined and how
  // (ScenePlayer.joined_by_self), and an image shown to the scene's players reaches them. A player already in
  // the scene gets the scene and nothing changes. It is refused as when no scene is open (SceneBlocked
  // NO_OPEN_SCENE) when the switch is off, so a refusal never says a scene exists.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist or the caller is not a member of it.
  //   - `permission_denied`: the caller is the master.
  //   - `failed_precondition`: no open session (GameSessionBlocked, NO_OPEN_SESSION), or no scene to join
  //     (SceneBlocked NO_OPEN_SCENE).
  rpc JoinScene(JoinSceneRequest) returns (JoinSceneResponse);

  // CloseScene closes the open scene, asking nothing. Only the campaign's
  // master may call it. With no scene open it changes nothing. Every stream
  // gets `scene_changed`, and a `scene_closed` event goes to the history.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a
  //     member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION).
  rpc CloseScene(CloseSceneRequest) returns (CloseSceneResponse);

  // GetOpenScene returns the scene open in the session, and the rolls made
  // in it, newest first (the scene log, MR-015). Any member may call it; the
  // app reads it after `ready` and after every `scene_changed` and
  // `scene_check_rolled`. What each one gets (RN-20):
  //   - the master: the actions with their DCs and attempt limits, and every
  //     roll with whether it passed and how many attempts its character has
  //     left;
  //   - a player: the actions with each one's attempt limit and how many
  //     attempts their own living character has left, their bonus and
  //     passive value, and only their own rolls. When the master turned the
  //     scene's `show_dc` on, the actions also carry their DCs and the rolls
  //     whether they passed; when it is off, neither. A player never gets an
  //     action the master hid, nor the rolls made on it, nor a stage NPC the
  //     master hid (RN-10); the master gets them marked `hidden`.
  // The scene is unset when none is open, and for a player who is out of a
  // scene open to only some players: nothing tells them one is open (RN-10).
  // The master also gets `audience`, who is in and who is out.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a
  //     member of it.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION).
  rpc GetOpenScene(GetOpenSceneRequest) returns (GetOpenSceneResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RollSceneCheck rolls an action of the open scene for the caller's own
  // living character (MR-015, RN-18): the d20 plus the character's bonus
  // from the sheet. The server rolls the d20, or takes the face of a real
  // die (1 to 20), as the campaign's dice setting allows. A character rolls
  // each action as many times as the action's `max_attempts` allows (1 by
  // default, 1 to 5, or unlimited) while the scene is open; the master may
  // grant one more attempt (GrantSceneAttempt), or close and open the scene
  // again, which resets every count. The answer is the roll with its total;
  // the DC, and whether it passed, come with it only when the scene shows its
  // DC (`show_dc`), and stay with the master otherwise. The master gets
  // `scene_check_rolled` on the stream, and so does the roller; nobody else
  // does. A `scene_check_rolled` event goes to the history (ids and numbers
  // only). Only a player may call it.
  //
  // Errors:
  //   - `invalid_argument`: neither roll_in_app nor d20_face is set;
  //     roll_in_app is false; d20_face is not 1 to 20; the idempotency key
  //     is not a UUID.
  //   - `not_found`: the action is not one of the open scene's, or it is one
  //     the master hid (the very same error: the refusal never says the action
  //     is there), the campaign does not exist, or the caller is not a member
  //     of it.
  //   - `permission_denied`: the caller is the master.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION); or SceneBlocked: NO_OPEN_SCENE, ALREADY_ROLLED (no
  //     attempt left), WRONG_DICE_MODE, NO_CHARACTER; or ResourceBlocked
  //     INSPIRATION_PENDING (an earlier roll waits for its answer).
  //
  // A character that holds a Bardic Inspiration die (given outside a combat) gets
  // `inspiration_offer` in place of `roll`: the d20 is rolled and kept, nothing is
  // written, and ResourceService.AnswerOutsideInspiration settles it.
  rpc RollSceneCheck(RollSceneCheckRequest) returns (RollSceneCheckResponse);

  // SearchForTraps is the player's "Procurar armadilhas" (MR-035, D5, question
  // 71): the caller's living character rolls Wisdom (Perception) against each trap's
  // DC to notice it, or Intelligence (Investigation) against its DC to find it
  // (RN-18: the app rolls the d20, or the player types a real die, as the
  // campaign's dice setting allows). The server rolls against every armed trap
  // within 3 m of the character's square whose square the character sees (with the
  // fog, what it sees; without it, every square), that the character does not
  // know yet. A pass reveals the trap to that character alone (the master's log
  // gets `trap_searched`, with the roll and what it found, never the DC to a
  // player). The answer reads the same when no trap is there and when the roll
  // fell short.
  //
  // Outside a combat it costs nothing. While a combat runs on the map it is the
  // SRD's Search action: only on the character's own turn, and it spends the
  // action (ACTION_USED when it is spent already, NOT_YOUR_TURN, TRAP_SEARCH_NOT_NOW
  // before the combat starts). Outside a combat a player may search again whenever
  // they like.
  //
  // Errors:
  //   - `invalid_argument`: skill unspecified; neither roll_in_app nor d20_face is
  //     set; roll_in_app is false; d20_face is not 1 to 20; the key is not a UUID.
  //   - `not_found`: the campaign does not exist, or the caller is not a member.
  //   - `permission_denied`: the caller is the master.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION); SceneBlocked NO_CHARACTER (the caller has no living
  //     character) or WRONG_DICE_MODE; EncounterBlocked TRAP_NOT_ON_MAP,
  //     TRAP_SEARCH_NOT_NOW, NOT_YOUR_TURN, ACTION_USED, and NEEDS_A_MAP while a
  //     combat without a map (THEATRE mode, RN-25) is open: traps do not exist
  //     there.
  rpc SearchForTraps(SearchForTrapsRequest) returns (SearchForTrapsResponse);

  // FireTrap is the master firing a trap by hand (MR-035, D5): the trap's
  // "Manual" trigger, or any trap whenever he decides. Only during a session. The
  // server rolls the trap's attack and damage and each caught creature's saving
  // throw with its bonus, as it does for spell saves (see TrapFiring). The trap
  // becomes "Disparada" and visible to everyone who sees the map; a `trap_triggered`
  // event goes into the history. In a combat that runs on the map the damage on a
  // combatant that is an NPC or a creature lands at once and the conditions go on
  // the combatants; the damage on a player's character is a PendingDamage that waits
  // for the master (RN-02), and CombatService.UndoLastAction takes the whole firing
  // back. Outside a combat the damage on a player's character waits as a
  // TrapDamage, an NPC's has only a log line and the conditions are a reminder.
  // Only the campaign's master may call it.
  //
  // Errors:
  //   - `invalid_argument`: a target is not valid for the map; the key is not a UUID.
  //   - `not_found`: the point is not a trap of this map, the campaign does not
  //     exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: no open session; EncounterBlocked TRAP_NOT_ARMED, and
  //     NEEDS_A_MAP while a combat without a map (THEATRE mode, RN-25) is open:
  //     traps do not exist there.
  rpc FireTrap(FireTrapRequest) returns (FireTrapResponse);

  // ListTrapActivity reads what traps did in the open session outside a combat (MR-035,
  // RN-10): the firings, with each creature's attack, saving throw and damage (the
  // conditions are a reminder), the searches and the traps a character noticed by passing
  // near them (TrapActivity.notice). The master gets all of it; a player
  // only the lines of their own characters, with their own d20 and "passou" or
  // "falhou", never a DC and never a trap their characters do not know. In a combat the
  // same is in the combat log. Any member may call it. A player's search, and a firing
  // outside a combat, send the master a `map_changed` hint with no content. A long session
  // lists its newest 500 events, oldest first.
  //
  // Errors: `not_found` (the campaign does not exist, or the caller is not a member),
  // `failed_precondition` (no open session).
  rpc ListTrapActivity(ListTrapActivityRequest) returns (ListTrapActivityResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListTrapDamages lists the trap damages that wait for the master (MR-035, RN-02):
  // the open combat's, and every one outside a combat, from any session of the
  // campaign, until the master applies or discards it (a combat that ends turns its
  // waiting damage into one of these). Only the campaign's master may call it, with or
  // without an open session.
  //
  // Errors: `not_found` (the campaign does not exist, or the caller is not a
  // member), `permission_denied` (a player).
  rpc ListTrapDamages(ListTrapDamagesRequest) returns (ListTrapDamagesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ApplyTrapDamage applies a trap damage that is not in a combat to the
  // character's vitals: temporary hit points first, never below 0, as in a combat
  // (RN-02). The master may change the amount first. A damage in a combat is
  // applied with CombatService.ApplyPendingDamage. Only the master may call it.
  //
  // Errors: `invalid_argument` (amount outside 0 to 1000, key), `not_found` (the
  // damage is not the session's, or the campaign), `permission_denied`,
  // `failed_precondition` (EncounterBlocked DAMAGE_RESOLVED when it was applied or
  // discarded already). It works with no session open (the damage outlives its session);
  // a key reused for another damage is `invalid_argument`.
  rpc ApplyTrapDamage(ApplyTrapDamageRequest) returns (ApplyTrapDamageResponse);

  // DiscardTrapDamage drops a trap damage that is not in a combat, applying
  // nothing. Same errors as ApplyTrapDamage.
  rpc DiscardTrapDamage(DiscardTrapDamageRequest) returns (DiscardTrapDamageResponse);

  // GrantSceneAttempt gives one character one more attempt at one action of
  // the open scene: "Dar mais uma tentativa" (MR-015, question 55). Only the
  // campaign's master may call it, and only while a scene is open. The
  // attempt lasts for this opening of the scene: closing and opening it again
  // resets it with every other count. The grant is a `scene_attempt_granted`
  // event in the history (ids only) and the streams get `scene_changed`, the
  // same content-free hint as any change to the scene: the player reads the
  // scene again and finds `attempts_left` raised. On an unlimited action it
  // changes nothing and writes no event. A retry with the same
  // idempotency_key changes nothing more. The answer is the open scene as the
  // master sees it.
  //
  // Errors:
  //   - `invalid_argument`: the idempotency key is not a UUID.
  //   - `not_found`: the action is not one of the open scene's, the character
  //     is not a living player character of the campaign (or an ID is not a
  //     UUID), the campaign does not exist, or the caller is not a member of
  //     it.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION); or SceneBlocked: NO_OPEN_SCENE.
  rpc GrantSceneAttempt(GrantSceneAttemptRequest) returns (GrantSceneAttemptResponse);

  // PutOnStage puts an NPC "em cena" (MR-031, D7): its name and portrait
  // appear to every member under the open scene, after the NPCs already
  // there. Only the campaign's master may call it, and only while a scene is
  // open. Any living NPC of the campaign will do, hidden in a combat or not
  // (putting it on stage reveals nothing in the combat). At most 4 NPCs are
  // on the stage at once. An NPC that is on the stage already changes
  // nothing (SetStageNpcHidden changes whether the players see it). With
  // `hidden` the NPC goes on the stage hidden from the players: it counts for
  // the limit of 4, the master reads it marked `hidden`, and no player ever
  // receives it (not in GetOpenScene, not its portrait), nor a `stage_changed`
  // for it: only the master's stream hears of it. Otherwise every stream gets
  // `stage_changed`. A `stage_changed` event goes to the history (ids only).
  //
  // Errors:
  //   - `not_found`: the character is not a living NPC of the campaign (or
  //     character_id is not a UUID), the campaign does not exist, or the
  //     caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION); or SceneBlocked: NO_OPEN_SCENE, STAGE_FULL.
  rpc PutOnStage(PutOnStageRequest) returns (PutOnStageResponse);

  // TakeOffStage takes an NPC off the stage at once. An NPC that is not on
  // it changes nothing. Only the campaign's master may call it, and only
  // while the session is open (the stage is empty without a scene). Taking
  // off an NPC the players see sends `stage_changed` to every stream; taking
  // off a hidden one, to the master's alone: the players never knew it.
  //
  // Errors:
  //   - `not_found`: character_id is not a UUID, the campaign does not exist,
  //     or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION).
  rpc TakeOffStage(TakeOffStageRequest) returns (TakeOffStageResponse);

  // SetStageNpcHidden turns an NPC on the stage between "Os jogadores veem"
  // (hidden false) and "Escondida dos jogadores" (hidden true). Hiding the
  // NPC that speaks takes the floor from it. Only the campaign's master may
  // call it, and only while the session is open. The answer is the stage as
  // the master reads it. Showing or hiding sends `stage_changed` to every
  // stream, so the players read the scene again and the NPC appears or is
  // gone from their stage: nothing tells them that it was hidden rather than
  // taken off. Setting what it already is changes nothing, writes nothing
  // and tells nobody. A `stage_changed` event goes to the history (ids only).
  //
  // Errors:
  //   - `not_found`: the NPC is not on the stage (or character_id is not a
  //     UUID), the campaign does not exist, or the caller is not a member of
  //     it.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION).
  rpc SetStageNpcHidden(SetStageNpcHiddenRequest) returns (SetStageNpcHiddenResponse);

  // SetSpeaker marks which NPC on the stage is speaking, or none (an empty
  // character_id). One at most: marking another takes the mark off the
  // first. Marking the one that already speaks changes nothing. Marking a
  // hidden NPC shows it to the players in the same call ("Dar a fala"): the
  // master's tap means that it speaks now. Only the campaign's master may
  // call it. Every stream gets `stage_changed`.
  //
  // Errors:
  //   - `not_found`: the NPC is not on the stage (or character_id is set and
  //     is not a UUID), the campaign does not exist, or the caller is not a
  //     member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION).
  rpc SetSpeaker(SetSpeakerRequest) returns (SetSpeakerResponse);

  // CastSummon casts a spell that summons creatures outside a combat (MR-037):
  // Convocar Familiar (1 hour, a ritual: no slot is spent),
  // Animar Mortos (1 minute: it spends the slot) and Conjurar Animais
  // (1 action). The caster is a player's character; its player casts for it,
  // and the master for anyone. The spell must be one the character has (a
  // ritual one from its spellbook when cast as a ritual), the slot a free one
  // of at least the spell's circle, and the choice what rules.SummonOptions
  // offers for that slot and character. The slot is spent through the vitals
  // (RN-02); the creatures are created and listed on the character
  // (CharacterService.ListCharacterCreatures). A new familiar replaces the old
  // one (the SRD allows one at a time), which is dismissed. Creatures of one
  // casting share a `summon_group_id`. Nothing is rolled, so there is no dice
  // mode to follow (RN-18); the initiative is rolled when a combat starts.
  //
  // The owner and the master get `creatures_changed`, the caster's player and
  // the master `vitals_changed` when a slot was spent, and a
  // `creature_summoned` event (ids and keys only) goes to the history.
  //
  // A casting while the caster is a combatant of a combat that is not ended is
  // refused: the combat has CastSpell, with the initiative.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist or the caller is not a member
  //     of it, or the character is not a living player's character of the
  //     campaign that the caller may cast for.
  //   - `permission_denied`: the caller is a player and the character is not
  //     theirs.
  //   - `invalid_argument`: the spell does not summon or is not one of the
  //     character's, the slot does not fit, ritual is set for a spell that is
  //     not a ritual or the character cannot cast rituals, a name is not 1 to
  //     40 characters.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION); EncounterBlocked: SUMMON_CHOICE_INVALID,
  //     NO_SLOT, SUMMON_IN_COMBAT.
  rpc CastSummon(CastSummonRequest) returns (CastSummonResponse);

  // AssumeWildShape turns a druid into a beast (MR-037, D7): during an
  // open session, in a combat or out of it. It spends one use of the Forma
  // Selvagem resource (2 per short rest) and, in a combat, the character's
  // action, on its turn (the master may act again with the action used, as in
  // TakeAction). The beast must be one ListWildShapeForms
  // (meurpg.characters.v1.CharacterService) lists. The character takes the
  // beast's armor class, hit points (a pool of its own: CharacterVitals.wild_shape),
  // speeds, size, Strength, Dexterity and Constitution, attacks and senses, and
  // keeps Intelligence, Wisdom, Charisma and its proficiencies; it cannot cast
  // spells (CastSpell and CastSummon are refused with WILD_SHAPE_NO_SPELLS). The
  // form lasts until the beast falls to 0 (the damage left over goes to the
  // character), until LeaveWildShape, or until the master ends it; the app does not
  // count its hours.
  //
  // The character's player may call it for their own character, and the master for
  // any player's character. A `wild_shape_started` event (the beast's key, ids and
  // numbers only) goes to the history. The master's undo of the action in a combat
  // ends the form and gives the use and the action back. `vitals_changed` goes to
  // the master and the player; in a combat `encounter_changed` goes to everyone.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist or the caller is not a member
  //     of it, or the character is not a living player's character of the
  //     campaign that the caller may see.
  //   - `permission_denied`: the caller is a player and the character is not
  //     theirs.
  //   - `invalid_argument`: beast_key is not an SRD beast, or idempotency_key is
  //     not a UUID.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION); EncounterBlocked: WILD_SHAPE_BEAST_NOT_ALLOWED (not one
  //     of the beasts the level allows, or no Wild Shape), ALREADY_IN_WILD_SHAPE,
  //     NO_USES, and in a combat the turn gates (NOT_ACTIVE, the turn is not
  //     the character's, the action is used).
  rpc AssumeWildShape(AssumeWildShapeRequest) returns (AssumeWildShapeResponse);

  // LeaveWildShape takes the druid back to its own shape ("Voltar à forma
  // normal"): a bonus action in a combat, on its turn (the master's costs
  // nothing). The beast's hit points are lost; the character keeps its own as they
  // were. A `wild_shape_ended` event (reason "left") goes to the history; the
  // master's undo of the action in a combat puts the form back. Same callers,
  // streams and errors as AssumeWildShape, with NOT_IN_WILD_SHAPE for a character
  // that is in its own shape.
  rpc LeaveWildShape(LeaveWildShapeRequest) returns (LeaveWildShapeResponse);

  // StartFamiliarSight starts "Ver pelos olhos do familiar" (MR-036, D6):
  // the character's player sees what the character's familiar sees, with the
  // familiar's senses (an owl's darkvision, a bat's blindsight), on a map with the
  // fog of war on, and the character counts as blind and deaf until it stops
  // (a reminder: in a combat the app gives the combatant the blinded and
  // deafened conditions, and takes them away at the end). The familiar (a
  // creature with source familiar) must be on the same map as the character and
  // within 30 m (20 squares) when it starts, and the vision keeps only while it
  // stays within 30 m. Out of a combat it lasts until StopFamiliarSight. In a
  // combat it costs the character's action, on its turn, and ends at the start of
  // the character's next turn, or earlier if the player stops it (the action is
  // not given back); the master's undo of the start takes it back and returns the
  // action. A `familiar_sight` event (ids only) goes to the history, and
  // `vision_changed` to the players the map's view changed for.
  //
  // The player may call it for their own character, and the master for any
  // player's character. Errors: as AssumeWildShape, with EncounterBlocked
  // FAMILIAR_SIGHT_BLOCKED and the cause in `familiar_sight_reason` (NO_MAP in a
  // combat without a map, RN-25).
  rpc StartFamiliarSight(StartFamiliarSightRequest) returns (StartFamiliarSightResponse);

  // StopFamiliarSight ends "Ver pelos olhos do familiar" before its time: the
  // player looks through their own character's eyes again and the conditions go
  // away. It costs nothing and refunds nothing. Same callers, streams and errors
  // as StartFamiliarSight, with FAMILIAR_SIGHT_BLOCKED / NOT_SEEING when the
  // character is not looking through its familiar.
  rpc StopFamiliarSight(StopFamiliarSightRequest) returns (StopFamiliarSightResponse);
}

// AssumeWildShapeRequest turns a druid into a beast.
message AssumeWildShapeRequest {
  string campaign_id = 1;
  // The druid: a player's character (a UUID).
  string character_id = 2;
  // The beast, an SRD creature's key from ListWildShapeForms ("monster:wolf").
  string beast_key = 3;
  // A UUID the app generates once for this change and sends again on a retry.
  string idempotency_key = 4;
}

// AssumeWildShapeResponse returns the character's vitals, with the form, and the
// combat when the character is in one.
message AssumeWildShapeResponse {
  // The character's vitals after: the form (wild_shape) and the use spent.
  CharacterVitals vitals = 1;
  // The combat as the caller sees it, when the character is a combatant of one
  // that is not ended; unset otherwise.
  Encounter encounter = 2;
}

// LeaveWildShapeRequest takes a druid out of its beast form.
message LeaveWildShapeRequest {
  string campaign_id = 1;
  // The druid: a player's character (a UUID).
  string character_id = 2;
  // A UUID the app generates once for this change and sends again on a retry.
  string idempotency_key = 3;
}

// LeaveWildShapeResponse returns the character's vitals and the combat.
message LeaveWildShapeResponse {
  // The character's vitals after: no form.
  CharacterVitals vitals = 1;
  // The combat as the caller sees it, when the character is in one.
  Encounter encounter = 2;
}

// StartFamiliarSightRequest starts looking through the familiar's eyes.
message StartFamiliarSightRequest {
  string campaign_id = 1;
  // The character whose familiar it is: a player's character (a UUID).
  string character_id = 2;
  // A UUID the app generates once for this change and sends again on a retry.
  string idempotency_key = 3;
}

// StartFamiliarSightResponse returns the character's vitals, with the sight, and
// the combat when the character is in one.
message StartFamiliarSightResponse {
  CharacterVitals vitals = 1;
  Encounter encounter = 2;
}

// StopFamiliarSightRequest stops looking through the familiar's eyes.
message StopFamiliarSightRequest {
  string campaign_id = 1;
  string character_id = 2;
  // A UUID the app generates once for this change and sends again on a retry.
  string idempotency_key = 3;
}

// StopFamiliarSightResponse returns the character's vitals and the combat.
message StopFamiliarSightResponse {
  CharacterVitals vitals = 1;
  Encounter encounter = 2;
}

// CastSummonRequest casts a summoning spell outside a combat.
message CastSummonRequest {
  string campaign_id = 1;
  // The caster: a player's character (a UUID).
  string character_id = 2;
  // The spell, "spell:find-familiar", "spell:animate-dead" or
  // "spell:conjure-animals".
  string spell_key = 3;
  // True: cast as a ritual, spending no slot (Convocar Familiar, by a
  // character that casts rituals). False: cast with `slot`.
  bool ritual = 4;
  // The slot, for a cast that is not a ritual.
  SpellSlot slot = 5;
  // What it brings.
  SummonChoice summon = 6;
  // A UUID the app generates once for this casting and sends again on a retry.
  string idempotency_key = 7;
  // The feature that gives the summon (its key, SummonSpellOptions.granted_by): the casting spends a use of
  // the feature's resource, and is neither a ritual nor cast with a slot. Empty for the character's own spells.
  string granted_by = 8;
}

// CastSummonResponse returns what the casting made.
message CastSummonResponse {
  // The creatures created (UUIDs; CharacterService.ListCharacterCreatures has
  // them), in the order of `summon.creature_keys`.
  repeated string creature_ids = 1;
  // The creatures a new familiar replaced and dismissed (UUIDs), if any.
  repeated string dismissed_creature_ids = 2;
  // The caster's vitals after the slot or the use was spent; unset for a ritual.
  CharacterVitals vitals = 3;
}

// GameSessionBlockedReason says why PlayService refused a call with
// `failed_precondition`.
enum GameSessionBlockedReason {
  GAME_SESSION_BLOCKED_REASON_UNSPECIFIED = 0;
  // The campaign has no open game session.
  GAME_SESSION_BLOCKED_REASON_NO_OPEN_SESSION = 1;
  // StartGameSession: the campaign already has an open session.
  GAME_SESSION_BLOCKED_REASON_SESSION_ALREADY_OPEN = 2;
  // GetSessionSummary: the session has not ended. The summary is the closing
  // page: its numbers keep moving until the master ends the session.
  GAME_SESSION_BLOCKED_REASON_SESSION_NOT_ENDED = 3;
}

// GameSessionBlocked is the error detail of PlayService's
// `failed_precondition`, so the app can show a clear message.
message GameSessionBlocked {
  GameSessionBlockedReason reason = 1;
}

// GameSession is one game session of a campaign: one evening at the table.
// It holds only IDs and times.
message GameSession {
  // Stable game session ID (a UUID).
  string id = 1;
  // The campaign it belongs to (a UUID).
  string campaign_id = 2;
  // The session's number in the campaign, counting from 1.
  int32 session_number = 3;
  // When the master started it.
  google.protobuf.Timestamp started_at = 4;
  // When the master ended it. Unset while the session is open.
  google.protobuf.Timestamp ended_at = 5;
}

// StartGameSessionRequest names the campaign.
message StartGameSessionRequest {
  string campaign_id = 1;
  // Optional. 1 to 64 characters, chosen once by the app for this action: a retry with the
  // same key and the same request returns what the first call made instead of making another.
  // The key is unique in the campaign; the same key with another request is `invalid_argument`.
  // Empty: the call is not deduplicated.
  string idempotency_key = 2;
}

// StartGameSessionResponse returns the new session.
message StartGameSessionResponse {
  // The new, open session.
  GameSession game_session = 1;
  // How many player sheets this start locked (RN-01). 0 when every living
  // player character was already locked.
  int32 locked_sheet_count = 2;
}

// EndGameSessionRequest names the session to end.
message EndGameSessionRequest {
  string campaign_id = 1;
  string game_session_id = 2;
}

// EndGameSessionResponse returns the ended session.
message EndGameSessionResponse {
  GameSession game_session = 1;
}

// ListGameSessionsRequest names a campaign.
message ListGameSessionsRequest {
  string campaign_id = 1;
}

// ListGameSessionsResponse lists the campaign's sessions.
message ListGameSessionsResponse {
  repeated GameSession game_sessions = 1;
}

// ListOpenGameSessionsRequest is empty: the caller is the signed-in user.
message ListOpenGameSessionsRequest {}

// ListOpenGameSessionsResponse lists the open sessions of the caller's
// campaigns.
message ListOpenGameSessionsResponse {
  repeated OpenGameSession open_game_sessions = 1;
}

// OpenGameSession is an open session of one of the caller's campaigns.
message OpenGameSession {
  // The open session.
  GameSession game_session = 1;
  // The campaign's name, as the master typed it, for the notice ("A sessão
  // 3 de Mirathel começou").
  string campaign_name = 2;
  // The caller's role in the campaign.
  meurpg.campaigns.v1.Role my_role = 3;
}

// GetLiveSessionRequest names the campaign.
message GetLiveSessionRequest {
  string campaign_id = 1;
}

// GetLiveSessionResponse is the live session's snapshot.
message GetLiveSessionResponse {
  // The campaign's open session.
  GameSession game_session = 1;
  // The vitals the caller may see, oldest character first: every living
  // player character's for the master; only their own character's for a
  // player (empty if they have no living character).
  repeated CharacterVitals vitals = 2;
  // The session's current map (a UUID; meurpg.maps.v1.MapService.GetMap
  // reads it), which every member may see. Empty while the master has not
  // chosen one.
  string current_map_id = 3;
  // The image the master shows the players (SetShownImage). Unset while
  // nothing is shown, and for a player outside the image's audience. The
  // master gets it with its `audience`.
  ShownImage shown_image = 4;
  // Whether the "Deixar com os jogadores" switch is on for the image shown
  // (SetShownImage's `keep`). Set only for the master: it is theirs to
  // decide, so a player always gets false.
  bool shown_image_keep = 5;
}

// ShownImage is a gallery image the master shows the players during a
// session, or leaves with them (MR-028), with what the app needs to show
// it. A player may fetch its files while it is shown or left, unless it is the
// background of a map with the fog of war on (the session then shows a copy of
// it, whose ID this is); the master always may.
message ShownImage {
  // The gallery image's ID (a UUID).
  string id = 1;
  // The image's name in the gallery, shown as its caption.
  string name = 2;
  // Its size in pixels.
  int32 width = 3;
  int32 height = 4;
  // Where to fetch it: "/images/{id}".
  string url = 5;
  // Where to fetch its thumbnail (480 pixels on the longer side):
  // "/images/{id}/thumb".
  string thumbnail_url = 6;
  // Who sees the image. Only the master gets it (on the shown image and on
  // each left image); it is always unset for a player.
  ImageAudience audience = 7;
}

// ImageAudienceKind says who sees a shown or left image.
enum ImageAudienceKind {
  // In a request: the default. The scene's players while a scene open to only
  // some players is open, the whole table otherwise. Never in an answer.
  IMAGE_AUDIENCE_KIND_UNSPECIFIED = 0;
  // Every member. The only kind while no scene is open or the open scene is
  // open to everyone ("Mostrar a toda a mesa").
  IMAGE_AUDIENCE_KIND_WHOLE_TABLE = 1;
  // The players in the scene open to only some players, and the master. It
  // follows who is in that scene while it stays open.
  IMAGE_AUDIENCE_KIND_SCENE_PLAYERS = 2;
  // The players named in `user_ids`, and the master ("Mudar quem vê"). It is
  // also what the scene's players become when the scene stops being the
  // image's: the players who were in at that moment.
  IMAGE_AUDIENCE_KIND_CHOSEN_PLAYERS = 3;
}

// ImageAudience is who sees a shown image or an image left with the players
// (MR-028, RN-10). A player outside it never receives the image: not in a
// read, not on the stream, not through the image route.
message ImageAudience {
  ImageAudienceKind kind = 1;
  // CHOSEN_PLAYERS in a request: the accounts (a UUID each) of players of the
  // campaign, at least one, repeats ignored. Empty for the other kinds in a
  // request. In the master's answers: for CHOSEN_PLAYERS the players chosen,
  // for SCENE_PLAYERS the players who are in the scene now, for WHOLE_TABLE
  // empty.
  repeated string user_ids = 2;
}

// CharacterVitals are a player character's live numbers (RN-02): hit
// points, spell slots, hit dice. The maximums come from the sheet (the same
// numbers as DerivedSheet); the current values are the master's
// corrections, clamped to the maximums. A character nobody has adjusted yet
// is fresh: full hit points, nothing used, revision 0.
message CharacterVitals {
  // The character (a UUID).
  string character_id = 1;
  // The character's name.
  string name = 2;
  // The account ID of the character's player (a UUID). Empty when the
  // player deleted their account and the character stayed with the master
  // (RN-16).
  string player_user_id = 3;
  // Current hit points, 0 to hit_points_max. 0 means unconscious.
  int32 hit_points_current = 4;
  // Maximum hit points, from the sheet (DerivedSheet.hit_points_max).
  int32 hit_points_max = 5;
  // Temporary hit points, 0 or more. They are not part of the maximum.
  int32 hit_points_temporary = 6;
  // Spell slots per spell level, only the levels where the character has
  // slots, lowest first. Pact magic slots are apart (pact_slots).
  repeated SpellSlotUsage spell_slots = 7;
  // Pact magic slots (warlock). Unset when the character has none.
  PactSlotUsage pact_slots = 8;
  // The character's hit dice, largest die first, such as 2d10 and 1d8.
  repeated meurpg.rules.v1.HitDice hit_dice = 9;
  // How many hit dice the character has in all: the sum of hit_dice's
  // counts, the character's level.
  int32 hit_dice_total = 10;
  // How many of them are used, 0 to hit_dice_total: the sum of
  // hit_dice_used_by_die.
  int32 hit_dice_used = 11;
  // Goes up by one on every correction; 0 while nobody has adjusted the
  // character. Of two copies of the same character's vitals, the one with
  // the larger revision is newer.
  int32 revision = 12;
  // When the master last corrected them. Unset while revision is 0.
  google.protobuf.Timestamp updated_at = 13;
  // The uses spent of the character's class and race resources (Retomar o
  // fôlego, Surto de ação, Fúria...), one entry for each resource the sheet
  // has at its level, in sheet order. The totals come from the sheet; the
  // used counts last until the master corrects them (rests come later).
  repeated ResourceUsage resources = 14;
  // The beast the character is in now, for a druid in Wild Shape (MR-037);
  // unset in the character's own shape. While it is set, the numbers
  // above are the character's own, waiting: the beast has a pool of its own
  // (wild_shape), takes the damage and the healing, and the character takes
  // what is left over when the beast falls to 0.
  WildShapeState wild_shape = 15;
  // What the character sees through, when the player is looking through the
  // familiar's eyes (MR-036); unset otherwise. While it is set the character
  // counts as blind and deaf.
  FamiliarSightState familiar_sight = 16;
  // The hit points Ajuda adds to the maximum (5 at the 2nd spell level, 5 more for each level
  // above), kept until the master ends the spell (CombatService.EndCombatEffect) or a long
  // rest; 0 without it. `hit_points_max` already counts them, and the sheet's own
  // maximum is `hit_points_max - hit_points_max_bonus`. Two Ajudas keep the stronger.
  // Healing goes up to the effective maximum.
  int32 hit_points_max_bonus = 17;
  // How many hit dice of each size are used (die size to count, such as 10 to 2
  // for two d10 spent), only the sizes with something spent. Hit dice of different
  // sizes are kept apart (SRD 5.1, "Multiclassing"): a short rest spends them by
  // size and a long rest gives them back by size.
  map<int32, int32> hit_dice_used_by_die = 30;
  // The level of exhaustion, 0 to 6 (SRD 5.1, Conditions): the master sets it
  // (CombatEffectService.SetExhaustion) and a long rest with food takes one off. From
  // level 4 on, `hit_points_max` is already half of the sheet's.
  int32 exhaustion_level = 100;
  // The base armor class an effect that lasts gives the character while it lasts (Mage Armor:
  // 13 + Dexterity, SRD 5.1); 0 without one. The session's panels show the better of it and
  // the sheet's armor class.
  int32 armor_class_base = 101;
  // The combined level of spell slots the wizard's Arcane Recovery gives back (half
  // the WIZARD level, rounded up; SRD 5.1, Wizard). 0: the character has no wizard
  // level. Whether the use is left is the `arcane_recovery` resource.
  int32 arcane_recovery_allowance = 102;
  // The temporary states that are on for the character (a table feature's `state`
  // effect: a stance, a form), with the rounds left of each. Only the master and the
  // character's player read them, like the rest of the vitals. A combat starts and ends
  // them with TakeAction (the same card as a granted action); a round of the owner's
  // turn counts down `rounds_left`; a rest, an incapacity and the end of a combat end
  // the ones that say so; the master's correction ends one by hand.
  repeated ActiveState active_states = 103;
  // The combined level of spell slots the Circle of the Land druid's Natural Recovery
  // gives back (half the DRUID level, rounded up; SRD 5.1, Druid 2). 0: the character
  // does not have the feature. Whether the use is left is the `natural_recovery` resource.
  int32 natural_recovery_allowance = 104;
}

// ActiveState is a temporary state that is on for a character. The numbers about the
// state itself (its name, duration and ways to end) come from the sheet's content at the
// time of the read, so a state the content no longer defines is not listed.
message ActiveState {
  // The state's key, as in meurpg.rules.v1.DerivedState.key.
  string key = 1;
  // The Portuguese name of the feature that defines it.
  string name_pt = 2;
  // The effect's text for the sheet, in Portuguese; may be empty.
  string text_pt = 3;
  // How many rounds it lasts in all, and how many are left; both 0 for a state that lasts
  // until it ends.
  int32 duration_rounds = 4;
  int32 rounds_left = 5;
  // How it ends besides its duration: "dismiss", "incapacitated", "short_rest", "long_rest".
  repeated string ends_on = 6;
}

// WildShapeState is a druid's Wild Shape form (MR-037). Like the character's
// hit points, its numbers are the master's and the character's player's.
message WildShapeState {
  // The beast's content key ("monster:wolf"); the stat block is
  // meurpg.rules.v1.ContentService.GetCreature.
  string beast_key = 1;
  // Its Portuguese name ("Lobo").
  string beast_name_pt = 2;
  // The beast's current hit points, 1 to hit_points_max (at 0 the form ends).
  int32 hit_points_current = 3;
  // The beast's maximum hit points, from its stat block.
  int32 hit_points_max = 4;
}

// FamiliarSightState says a player is looking through their familiar's eyes
// (MR-036, "Ver pelos olhos do familiar").
message FamiliarSightState {
  // The familiar (a creature ID, as CharacterService.ListCharacterCreatures
  // lists it).
  string creature_id = 1;
  // True when it was started in a combat: it ends by itself at the start of the
  // character's next turn. False outside a combat: it lasts until the player
  // stops it (StopFamiliarSight).
  bool in_combat = 2;
  // The conditions the start gave the character's combatant ("condition:blinded",
  // "condition:deafened"), which the end takes away again. Empty outside a
  // combat, and for a condition the combatant already had.
  repeated string conditions_given = 3;
}

// ResourceUsage is how many uses of one resource are spent (RN-02).
message ResourceUsage {
  // The resource, as in rules.v1.Resource.key ("second_wind").
  string key = 1;
  // Its Portuguese name ("Retomar o Fôlego").
  string name_pt = 2;
  // How many uses the sheet gives at the character's level.
  int32 total = 3;
  // How many are spent, 0 to total.
  int32 used = 4;
  // When it comes back: a rules.v1.Recharge.
  meurpg.rules.v1.Recharge recharge = 5;
}

// SpellSlotUsage is one spell level's slots.
message SpellSlotUsage {
  // The spell level, 1 to 9.
  int32 level = 1;
  // How many slots of this level the character has: the sheet's, plus the ones
  // Flexible Casting created.
  int32 total = 2;
  // How many of them are used, 0 to total.
  int32 used = 3;
  // How many of the slots in `total` Flexible Casting created (SRD 5.1, Sorcerer):
  // they vanish on a long rest. 0 for a character that created none.
  int32 created = 10;
}

// PactSlotUsage is a warlock's pact magic slots: all of one level.
message PactSlotUsage {
  // The level of every pact slot, 1 to 5.
  int32 slot_level = 1;
  // How many pact slots the character has (from the sheet).
  int32 total = 2;
  // How many of them are used, 0 to total.
  int32 used = 3;
}

// WatchGameSessionRequest names the campaign.
message WatchGameSessionRequest {
  string campaign_id = 1;
}

// WatchGameSessionResponse is one event of the live session's stream.
message WatchGameSessionResponse {
  oneof event {
    // Always the first event: the server subscribed the caller. The app
    // reads the snapshot (GetLiveSession) now.
    Ready ready = 1;
    // Sent every 25 seconds, to show the stream is alive.
    Heartbeat heartbeat = 2;
    // The master corrected a character's vitals.
    VitalsChanged vitals_changed = 3;
    // The master ended the session. The stream ends after it.
    SessionEnded session_ended = 4;
    // The session's current map changed.
    CurrentMapChanged current_map_changed = 5;
    // Something the member sees on a map changed.
    MapChanged map_changed = 6;
    // The master moved a token.
    TokenMoved token_moved = 7;
    // The master showed an image, or stopped showing it.
    ShownImageChanged shown_image_changed = 8;
    // The images left with the players changed.
    LeftImagesChanged left_images_changed = 9;
    // Something changed in the combat: read it again (CombatService).
    EncounterChanged encounter_changed = 10;
    // The turn passed to another combatant.
    TurnChanged turn_changed = 11;
    // A combatant moved on the grid.
    CombatantMoved combatant_moved = 12;
    // The combat log changed: read it again (CombatService.ListCombatLog).
    CombatLogChanged combat_log_changed = 13;
    // The campaign's XP changed (an award, an undo or a milestone): read
    // ProgressionService again. Everyone in the session gets it.
    XpChanged xp_changed = 14;
    // The open scene changed: opened, closed, or one of its actions or its
    // point changed, or who is in it changed. Read it again (GetOpenScene).
    // The master and the players in the scene get it (everyone, when the scene
    // is open to the whole table), and the players who just went in or out;
    // a change only the master reads (the clues and the hooks, MR-029)
    // reaches the master alone.
    SceneChanged scene_changed = 15;
    // A check was rolled in the open scene. Only the master and the roller
    // get it.
    SceneCheckRolled scene_check_rolled = 16;
    // The stage changed: an NPC came in or went out, or the speaker changed,
    // or the scene closed and emptied it. Read the open scene again
    // (GetOpenScene). The master and the players in the scene get it.
    StageChanged stage_changed = 17;
    // The master revealed a clue to this player: read their notes again
    // (NotesService.ListNotes). Only the players who got it get it.
    NotesChanged notes_changed = 18;
    // What the player sees of a map with the fog of war on changed: read
    // MapService.GetMapVision and the map again. Only the players it concerns get it.
    VisionChanged vision_changed = 19;
    // A character's creatures changed outside a combat: one was summoned, given,
    // renamed, dismissed or had its hit points corrected, or a combat ended
    // and wrote them back. Read them again (CharacterService.ListCharacterCreatures).
    // Only the master and the creatures' owner get it; during a combat
    // `encounter_changed` covers the creatures.
    CreaturesChanged creatures_changed = 20;
    // The caller's character noticed a trap by passing near it (MR-035, D5): show
    // "Você notou uma armadilha." and read the map again. Only the player whose
    // character noticed it gets it; no other player, and the master never, hears of
    // it (RN-10).
    TrapNoticed trap_noticed = 21;
    // A puzzle of the session changed: the master showed it, hid it, put it back at
    // its start, released a hint, or a player moved or solved it (MR-038, RN-27).
    // Read it again (PuzzleService.GetPuzzleRun for a player, GetMasterPuzzleRun for
    // the master; ListShownPuzzles when the puzzle is not on screen yet). A hint with
    // no content: the solution, the minimum and the hints never travel on the stream.
    // Everyone gets it, and one that waits in a stream's queue is not queued twice.
    PuzzleChanged puzzle_changed = 22;
    // The table's content changed (the master wrote an entry, archived or brought
    // one back, or switched options on or off in "Opções para os jogadores"): read
    // the content again, each as your own role (ContentService.ListContent, and
    // TableContentService.ListTableEntries where the screen has the entries in full)
    // and, on an open sheet, the character again ("A classe mudou"). A hint with no
    // content (RN-10): the entry, the key and what changed never travel on the
    // stream. Everyone in the session gets it, and one that waits in a stream's
    // queue is not queued twice; at most one goes out per campaign every 250 ms, and
    // the last change is never left unannounced.
    ContentChanged content_changed = 23;
    // A player's area spell hit hidden creatures and the table asks the master
    // whether they appear (CombatService.ResolveHiddenReveal). Only the master
    // gets it; no player's stream ever carries it (RN-10).
    HiddenHitPending hidden_hit_pending = 24;
    // A reaction window opened for the one who answers it, and for the master (PM-04):
    // a hint with the window's id; the app reads the combat again for the prompt.
    // No other player gets it (RN-10): they read the change of `reaction_wait`.
    ReactionWindowOpened reaction_window_opened = 25;
    // A window was answered or closed by itself, for the reactor and the master:
    // the id and the sentence the app shows ("Queda Suave fechou. Você já usou a
    // sua reação."), written for each of the two.
    ReactionWindowClosed reaction_window_closed = 26;
    // A spell cast outside a combat changed (CastingService): it started, finished, ended
    // or failed. Read it again (CastingService.ListSpellCasts). A hint with no content
    // (RN-10): it names no caster, spell or target. The master gets every one; a
    // player gets it only for a cast they may see, and a cast by an NPC that is not on
    // the stage reaches the master alone.
    SpellCastsChanged spell_casts_changed = 27;
    // A group check was asked, answered or closed (ContestService): read it again
    // (GetGroupCheck), each as your own role. A hint with no content (RN-10): the skill,
    // the DC and the rolls never travel on the stream.
    GroupCheckChanged group_check_changed = 40;
    // A Revivify cast outside a combat was asked, or the master answered it: read
    // RevivifyService.ListRevivifyRequests again. A hint with no content. Only the master
    // and the caster's player get it (RN-10).
    RevivifyChanged revivify_changed = 28;
    // The master asked for changes on a pending character: read the character again
    // (CharacterService.GetCharacter). A hint with no reason: the reason is read, never
    // streamed. Only the master and the character's owner get it.
    CharacterChangesRequested character_changes_requested = 29;
    // The owner sent a pending character again. As above: read it again. Only the master
    // and the owner.
    CharacterResubmitted character_resubmitted = 30;
    // A dead character lives again (ReviveCharacter, or Revivify): read it again, and the
    // vitals. The master and the character's owner get it; the table reads the line of
    // the log.
    CharacterRevived character_revived = 31;
    // The master is calling the player (NudgePlayer): shake, chime and say it. Sent only to
    // the character's player, never stored.
    CallingYou calling_you = 41;
    // A question of a held roll was asked, answered or dropped: read ResourceService.ListHeldRolls again
    // (and the combat, for a combatant's roll). A hint with no content (RN-10): the roll, the d20 and the
    // die never travel on the stream. Only the master and the roller's player get it.
    HeldRollsChanged held_rolls_changed = 42;
    // A line of the conversation was added (MR-051, RN-36). Sent to the line's
    // readers' streams and the master's, and to nobody else.
    SessionMessageAdded session_message_added = 43;
    // The master is writing (MR-051). Content-free, to the players only.
    MasterTyping master_typing = 44;
    // Someone rolled with the free dice roller (MR-052): the roll itself, for the
    // dice on the screen and the log. Every stream of the campaign gets it,
    // except for a secret roll, which nobody hears of.
    FreeRollRolled free_roll_rolled = 45;
    // The master applied the damage of an attack to a player's character (RN-02): to that character's player only,
    // so the sheet says whose blow it was, whether or not the attacker is hidden and its line is in the log.
    AttackHit attack_hit = 46;
    // The table screen changed: the master's choice, or whether a TV tab is connected.
    // Only the master gets it; no player's stream does (RN-10). The master's app reads
    // TableScreenService.GetTableScreen again.
    TableScreenChanged table_screen_changed = 47;
  }

  // TableScreenChanged tells the master's panel that the TV at the table changed. Only the master's
  // streams get it. The TV tabs are counted in memory in each server instance, like the live streams: with
  // more than one instance a tab is counted by the instance that holds it. It names no item of the stage.
  message TableScreenChanged {
    // True while at least one TV tab holds a stream ("Aberta"). Meaningful only when `presence_known`.
    bool open = 1;
    // When the last TV tab lost its stream ("Sem conexão desde 21:14"). Unset while a tab is open or
    // when none ever connected. Meaningful only when `presence_known`.
    google.protobuf.Timestamp lost_at = 2;
    // The revision of the master's choice (SetTableScreen), so the panel reads it again only when it
    // is newer than the one it holds.
    int32 choice_revision = 3;
    // True when a TV tab connected or left and `open` and `lost_at` were counted for this event; false
    // when the event is only a change of the choice, and the panel keeps the presence it last heard.
    bool presence_known = 4;
  }

  // AttackHit is the attack damage that landed on a player's character, as that player reads it: who hit (empty when the
  // attacker is hidden: the app says "Alguém"), how much and of what type. `id` is the pending damage, so a hit is said once.
  // It says nothing of the hit points: those come with VitalsChanged.
  message AttackHit {
    // The pending damage that was applied (a UUID).
    string id = 1;
    // The attacker's name; empty when it is hidden from this player.
    string actor_label = 2;
    // What landed after the target's resistances and the master's last word, as the master settled it.
    int32 amount = 3;
    // The damage type in Portuguese, lower case ("cortante", "fogo"); empty when the hit has none.
    string damage_type_pt = 4;
  }

  // FreeRollRolled carries a table roll of the free dice roller, whole.
  message FreeRollRolled {
    FreeRoll roll = 1;
  }

  // SessionMessageAdded carries the line itself to its readers.
  message SessionMessageAdded {
    SessionMessage message = 1;
  }

  // MasterTyping says the master is writing. It carries no text.
  message MasterTyping {
    // How long the app shows the hint without another one, in seconds.
    int32 expires_in_seconds = 1;
  }

  // CallingYou is the master's nudge. It carries nothing: the app writes the line.
  message CallingYou {}

  // HiddenHitPending says a question waits for the master in a combat. It names
  // no creature: the master reads Encounter.pending_hidden_reveals.
  message HiddenHitPending {
    // The combat (a UUID).
    string encounter_id = 1;
    // The question (a UUID).
    string pending_reveal_id = 2;
  }

  // ReactionWindowOpened is the hint that a reaction window waits for its reactor.
  message ReactionWindowOpened {
    string encounter_id = 1;
    string window_id = 2;
  }

  // ReactionWindowClosed says a window is no longer open.
  message ReactionWindowClosed {
    string encounter_id = 1;
    string window_id = 2;
    // True when it closed by itself, with `text_pt` as the reason (only the
    // reactor's own reason, never that another reactor acted); false when it was
    // answered, and then `text_pt` is empty.
    bool closed_by_itself = 3;
    string text_pt = 4;
  }

  // SpellCastsChanged is the content-free hint that the casts outside a combat changed.
  message SpellCastsChanged {}

  // GroupCheckChanged is the content-free hint that the group check changed.
  message GroupCheckChanged {}
  // RevivifyChanged is the content-free hint that the casts of Revivify outside a combat
  // changed.
  message RevivifyChanged {}
  // HeldRollsChanged is the content-free hint that the questions of the held rolls changed.
  message HeldRollsChanged {}

  // CharacterChangesRequested is the hint that the master asked for changes.
  message CharacterChangesRequested {
    // The character (a UUID).
    string character_id = 1;
  }

  // CharacterResubmitted is the hint that a player sent their character again.
  message CharacterResubmitted {
    // The character (a UUID).
    string character_id = 1;
  }

  // CharacterRevived is the hint that a dead character lives again.
  message CharacterRevived {
    // The character (a UUID).
    string character_id = 1;
  }

  // ContentChanged is the content-free hint that the table's content changed.
  message ContentChanged {}

  // PuzzleChanged is the content-free hint that a puzzle of the session changed.
  message PuzzleChanged {
    // The puzzle (a UUID).
    string puzzle_id = 1;
  }

  // TrapNoticed is the hint that a player's character passively noticed a trap. It
  // names the trap to the one player who now knows it (the map read shows it to them
  // alone); it carries no DC and no position, and no other member ever gets it.
  message TrapNoticed {
    // The map the trap is on (a UUID).
    string map_id = 1;
    // The trap's point (a UUID), readable now with MapService.GetMap.
    string point_id = 2;
  }

  // VisionChanged is a hint for one player on a map with the fog of war on: what
  // their character sees, or remembers, changed, or an NPC moved on a square they
  // see; the app reads MapService.GetMapVision and the map again
  // (GetMap, GetMapLayers). It carries no square and no creature, so it tells
  // the player nothing the reads do not. It is sent only to the players it
  // touches, and at most once while one is still waiting in the stream's queue.
  // The master also gets it when a sight zone or a Wild Shape changes, whether
  // or not a player's view moved; his light warning reads the same scene.
  message VisionChanged {
    // The map (a UUID), which the player sees.
    string map_id = 1;
  }

  // CreaturesChanged carries nothing: it names no creature and no character, so
  // it tells the master and the owner only that their lists changed.
  message CreaturesChanged {}

  // StageChanged carries nothing: it names no NPC, so a player's stream
  // learns nothing but that the stage moved. The app reads the scene again
  // (GetOpenScene), which gives each member only what they may see (RN-20).
  message StageChanged {}

  // NotesChanged carries nothing: it says a clue arrived in the player's
  // notes, and the app reads them again (meurpg.notes.v1.NotesService). It
  // names no clue and no scene. Only the player who received it gets it,
  // never the master or another player. A player who is offline reads the
  // clue on the next ListNotes.
  message NotesChanged {}

  // SceneChanged carries nothing: it says the open scene changed, and the
  // app reads it again (GetOpenScene), which filters it for the caller. It
  // names no scene, so a player's stream never learns of one they were not
  // shown.
  message SceneChanged {}

  // SceneCheckRolled says a character rolled an action of the open scene;
  // the app reads the scene again (GetOpenScene). It carries no number: the
  // total reaches the master through the read, and the DC never leaves the
  // server.
  message SceneCheckRolled {
    // The action rolled (a UUID).
    string action_id = 1;
  }

  // Ready is the stream's first event.
  message Ready {
    // The session being watched.
    GameSession game_session = 1;
  }

  // Heartbeat carries nothing.
  message Heartbeat {}

  // VitalsChanged carries a character's new vitals. Only the master and the
  // character's player get it. Apply it only if its revision is larger
  // than the one on screen.
  message VitalsChanged {
    CharacterVitals vitals = 1;
  }

  // SessionEnded says the watched session ended. The app then reads the
  // session's summary (GetSessionSummary) with the session's id: that is how
  // a player's app knows the summary is there. Nothing about it travels on
  // the stream.
  message SessionEnded {
    // The session, with its ended_at.
    GameSession game_session = 1;
  }

  // CurrentMapChanged says the session shows another map now. Everyone
  // gets it; the app reads the map (MapService.GetMap).
  message CurrentMapChanged {
    // The new current map (a UUID), which every member may see. Empty when
    // the session has no current map anymore (the master cleared it, or
    // deleted the map).
    string map_id = 1;
  }

  // MapChanged is a hint: something the member sees on this map changed,
  // so the app reads the map again (MapService.GetMap). It carries no
  // content, so a hidden point's name or description never travels on a
  // player's stream. After a change that hides the map, GetMap answers
  // `not_found` to a player: the app leaves the map. A map_changed for a
  // map the app does not list yet (just revealed, or created) means the
  // list changed too: read it again (MapService.ListMaps).
  message MapChanged {
    // The map (a UUID).
    string map_id = 1;
  }

  // ShownImageChanged carries the image the master shows now, as the
  // receiving member sees it: the master gets it with the audience; a player
  // who sees it gets the image; a player who has just stopped seeing it
  // (narrowed out, or the master stopped showing it) gets none; a player who
  // never saw it gets nothing.
  message ShownImageChanged {
    // The image shown now. Unset when the master stopped showing it, or
    // deleted it, or the receiver is out of its audience now.
    ShownImage image = 1;
  }

  // LeftImagesChanged is a hint, with no content: the list of images left
  // with the players changed, so the app reads it again (ListLeftImages).
  // The master and the players the image was left with get it.
  message LeftImagesChanged {}
  // EncounterChanged is a hint: the combat changed, so the app reads it again
  // (CombatService.GetEncounter). It carries no content, so a hidden
  // combatant never travels on a player's stream (RN-10). Everyone gets it,
  // also when the change only touched hidden things. One exception: the
  // opportunity offers a move makes (MoveCombatantResponse.provoked) are told
  // only to the master, the mover's player and the reactors' players.
  message EncounterChanged {
    // The combat (a UUID).
    string encounter_id = 1;
    // Its revision after the change. Read again when it is larger than the
    // one on screen. On a map with the fog of war a player's copy says 0 ("read
    // it again"): the master's number goes up for everything that happens, and
    // a player who got it could count the moves out of their sight.
    int32 revision = 2;
    // How the combat is played (RN-25): the same for the whole combat. A screen
    // that reads the hint of a combat it has not read yet knows at once whether
    // to draw a map or a list. Never UNSPECIFIED.
    EncounterMode mode = 3;
  }

  // TurnChanged says whose turn it is now. Each member gets their own copy:
  // a player never learns which hidden combatant is on turn, nor, on a map with
  // the fog of war, which NPC they do not see.
  message TurnChanged {
    // The combat (a UUID).
    string encounter_id = 1;
    // The round, counting from 1.
    int32 round = 2;
    // The combatant on turn (a UUID). Empty for a player when the one on
    // turn is hidden from them: then master_turn is true.
    string current_combatant_id = 3;
    // True when the one on turn is a combatant the member may not see: the
    // app shows "Vez do mestre". Always false for the master.
    bool master_turn = 4;
    // The combat's revision (Encounter.revision) with the turn changed, for the
    // master only: a screen that already holds a newer combat ignores this event
    // instead of going back. A player's copy says 0 ("no number to compare"): what
    // their reads count is not the master's number.
    int32 revision = 5;
  }

  // CombatantMoved is a combatant's new square. A player's stream only gets
  // it for a combatant they may see: on a map with the fog of war, an NPC only
  // when the player's character sees its new square (the other players get
  // `encounter_changed`, so one who saw it leave reads the combat again). A
  // combatant the app does not know yet means: read the combat again.
  message CombatantMoved {
    // The combat (a UUID).
    string encounter_id = 1;
    // The combatant (a UUID).
    string combatant_id = 2;
    // Its new square, from 0, from the top left of the grid.
    int32 col = 3;
    int32 row = 4;
  }

  // CombatLogChanged is a hint: an entry of the combat log appeared,
  // changed or went away, so the app reads it again
  // (CombatService.ListCombatLog). It carries no content. The master gets
  // every one; a player only the ones that touch an entry they may see, so a
  // hidden combatant's action never even pings a player's stream (RN-10). On a
  // map with the fog of war, a line goes only to the players who could see it
  // when it happened.
  message CombatLogChanged {
    // The combat (a UUID).
    string encounter_id = 1;
  }

  // XpChanged says the campaign's XP or levels changed: an award was given, the
  // last one undone, a milestone marked (ProgressionService), or a player's
  // character went up a level (CharacterService.LevelUpCharacter, MR-040: the
  // level on the sheet and `can_level_up` change, and the master reads "O que
  // mudou", ListLevelUps). It carries no content
  // (the XP of the other characters is not the player's business until they
  // read it, where it is allowed): the app reads GetCampaignExperience and
  // ListXPAwards again. Everyone in the session gets it, the master and every
  // player; the character's own sheet comes with `can_level_up` on its next
  // read.
  message XpChanged {}

  // TokenMoved is a token's new position. A token the app does not know
  // yet (it may have missed a `map_changed`) means: read the map again.
  message TokenMoved {
    // The map (a UUID).
    string map_id = 1;
    // The character whose token moved (a UUID).
    string character_id = 2;
    // The new position, in basis points of the image's width and height
    // (0 to 10000).
    int32 x_bp = 3;
    int32 y_bp = 4;
  }
}

// NudgePlayerRequest is the master's call for a player's attention.
message NudgePlayerRequest {
  // The campaign (a UUID).
  string campaign_id = 1;
  // The player character to call (a UUID).
  string character_id = 2;
}

// NudgePlayerResponse is empty: the nudge is delivered, or the call fails.
message NudgePlayerResponse {}

// AdjustCharacterVitalsRequest is the master's correction. Every value set
// replaces the current one; unset values stay as they are.
message AdjustCharacterVitalsRequest {
  string campaign_id = 1;
  string character_id = 2;
  // A UUID the app generates once for this correction and sends again on a
  // retry. A second call with the same key changes nothing.
  string idempotency_key = 3;
  // New current hit points, 0 to the maximum.
  optional int32 hit_points_current = 4;
  // New temporary hit points, 0 to 999.
  optional int32 hit_points_temporary = 5;
  // New used counts of some spell levels; the other levels stay as they
  // are. Each level at most once, and only levels where the character has
  // slots.
  repeated SpellSlotsUsed spell_slots_used = 6;
  // New used count of the pact magic slots, 0 to their total. Only for a
  // character with pact slots.
  optional int32 pact_slots_used = 7;
  // New used count of hit dice, 0 to the character's total. It takes the
  // largest dice first (the way a count with no sizes is read); prefer
  // hit_dice_used_by_die. Not together with it.
  optional int32 hit_dice_used = 8;
  // New used counts of some resources; the others stay as they are. Each
  // resource at most once, and only resources the sheet has.
  repeated ResourceUsed resources_used = 9;
  // New current hit points of the beast, for a druid in Wild Shape: 1 to the
  // beast's maximum, or 0 to end the form (the character's own hit points stay as
  // they are: the master carries any leftover damage with hit_points_current).
  // `invalid_argument` when the character is not in a beast form.
  optional int32 wild_shape_hit_points_current = 10;
  // New used counts of the hit dice of some sizes (die size to count, 0 to the
  // dice of that size the character has); the other sizes stay as they are.
  // `invalid_argument` for a size the character does not have.
  map<int32, int32> hit_dice_used_by_die = 30;
  // The keys of states to end (CharacterVitals.active_states[].key), whatever the way
  // each says it ends. `invalid_argument` for a state the character does not have on.
  repeated string end_states = 11;
  // The CharacterVitals.revision the caller last read. Required: the correction is
  // written only if the character's vitals still have that revision, because every
  // value set here replaces the current one and a combat, a rest or another
  // correction may have changed it since. 0 is a revision (nobody has adjusted the
  // character yet), so an absent field is not 0: it is refused too. A retry with the
  // same idempotency_key is answered before this check. `aborted` when the revision
  // is not the character's now or the field is absent: read the vitals again.
  optional int32 expected_revision = 31;
}

// ResourceUsed sets how many uses of one resource are spent.
message ResourceUsed {
  // The resource key, as in ResourceUsage.key.
  string key = 1;
  // How many are spent, 0 to the resource's total.
  int32 used = 2;
}

// SpellSlotsUsed sets how many slots of one spell level are used.
message SpellSlotsUsed {
  // The spell level, 1 to 9.
  int32 level = 1;
  // How many are used, 0 to the level's total.
  int32 used = 2;
}

// AdjustCharacterVitalsResponse returns the character's vitals after the
// correction (or, for a repeated idempotency_key, as they are now).
message AdjustCharacterVitalsResponse {
  CharacterVitals vitals = 1;
  // Set when the correction took hit points from a character that concentrates on a spell
  // it cast outside a combat (CastingService): the Constitution saving throw DC to keep
  // concentrating, 10 or half the damage, whichever is higher (SRD 5.1, "Duration"). The
  // app only reminds; the table rolls, and the master ends the spell with
  // CastingService.EndActiveSpell when it fails. Only the master calls the correction.
  int32 concentration_dc = 2;
  // The cast being concentrated on, with `concentration_dc`.
  string concentration_cast_id = 3;
}

// SetCurrentMapRequest names the map the session shows.
message SetCurrentMapRequest {
  string campaign_id = 1;
  // A map of the campaign (a UUID), or empty to clear the current map.
  string map_id = 2;
}

// SetCurrentMapResponse returns the session's current map.
message SetCurrentMapResponse {
  // The current map (a UUID), or empty when it was cleared.
  string current_map_id = 1;
}

// SetShownImageRequest names the image the session shows.
message SetShownImageRequest {
  string campaign_id = 1;
  // An image of the campaign's gallery (a UUID), or empty to stop showing
  // it.
  string image_id = 2;
  // The "Deixar com os jogadores" switch for image_id: see SetShownImage.
  // Ignored when image_id is empty.
  bool keep = 3;
  // Who sees the image: see SetShownImage. Unset or UNSPECIFIED: the scene's
  // players while a scene open to only some players is open, the whole table
  // otherwise; for the image that is shown already, the audience it has.
  // Ignored when image_id is empty.
  ImageAudience audience = 4;
}

// SetShownImageResponse returns what the session shows now.
message SetShownImageResponse {
  // The image shown, or unset when the master stopped showing it.
  ShownImage shown_image = 1;
  // Whether "Deixar com os jogadores" is on for it: false when nothing is
  // shown.
  bool keep = 2;
}

// SetShownImageAudienceRequest names the new audience of the shown image.
message SetShownImageAudienceRequest {
  string campaign_id = 1;
  // Required, and not UNSPECIFIED: see SetShownImageAudience.
  ImageAudience audience = 2;
}

// SetShownImageAudienceResponse returns the image shown, with its audience.
message SetShownImageAudienceResponse {
  ShownImage shown_image = 1;
}

// ListLeftImagesRequest names the campaign.
message ListLeftImagesRequest {
  string campaign_id = 1;
}

// ListLeftImagesResponse is the images left with the players.
message ListLeftImagesResponse {
  // In the order the master left them, oldest first.
  repeated ShownImage images = 1;
}

