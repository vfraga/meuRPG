syntax = "proto3";

// This file is the messages of the effects that last in a combat (RN-22):
// the spells, the actions and the conditions that stay on a combatant for a
// duration (Bênção, Perdição, Velocidade, Imobilizar Pessoa, Teia, Esquivar, the
// conditions the master marks), the clock of the turns that ends them and asks
// their saving throws, and exhaustion. It is in the same package as combat.proto
// because the effects travel inside its messages: `Combatant.effects`,
// the reaction window's prompt (EffectSavePrompt) and the dice of a roll. The calls that change
// them are LastingEffectService (lasting_effects_service.proto).
package meurpg.play.v1;

import "meurpg/play/v1/combat_rolls.proto";

// EffectSourceKind is where an effect comes from.
enum EffectSourceKind {
  EFFECT_SOURCE_KIND_UNSPECIFIED = 0;
  EFFECT_SOURCE_KIND_SPELL = 1;
  // An action or a feature (Esquivar, the lethargy of a Velocidade).
  EFFECT_SOURCE_KIND_FEATURE = 2;
  // A condition the master marked: no origin, no end.
  EFFECT_SOURCE_KIND_CONDITION = 3;
  // Something the master added from the catalog without a spell.
  EFFECT_SOURCE_KIND_MASTER = 4;
}

// EffectDurationKind is how an effect ends by itself.
enum EffectDurationKind {
  EFFECT_DURATION_KIND_UNSPECIFIED = 0;
  // After a number of rounds: it ends at the start of the caster's turn that many
  // rounds after the casting.
  EFFECT_DURATION_KIND_ROUNDS = 1;
  EFFECT_DURATION_KIND_UNTIL_START_OF_TURN_OF = 2;
  EFFECT_DURATION_KIND_UNTIL_END_OF_TURN_OF = 3;
  // With the caster's concentration, and no time limit of its own.
  EFFECT_DURATION_KIND_CONCENTRATION = 4;
  EFFECT_DURATION_KIND_UNTIL_DISMISSED = 5;
  EFFECT_DURATION_KIND_LONG_REST = 6;
}

// EffectModifierKind is a change an effect makes to numbers.
enum EffectModifierKind {
  EFFECT_MODIFIER_KIND_UNSPECIFIED = 0;
  // Adds (sign +1) or subtracts (sign -1) a die to attack rolls or saving throws.
  EFFECT_MODIFIER_KIND_ROLL_DIE = 1;
  EFFECT_MODIFIER_KIND_AC_BONUS = 2;
  // The speed in percent of the normal one.
  EFFECT_MODIFIER_KIND_SPEED_MULTIPLIER = 3;
  EFFECT_MODIFIER_KIND_SAVE_ADVANTAGE = 4;
  // One more action each turn, limited to some standard actions.
  EFFECT_MODIFIER_KIND_EXTRA_ACTION = 5;
  EFFECT_MODIFIER_KIND_NO_MOVE = 6;
  EFFECT_MODIFIER_KIND_NO_ACTION = 7;
  // The creature can't take reactions (the Open Hand technique).
  EFFECT_MODIFIER_KIND_NO_REACTION = 20;
}

// EffectRollKind is a roll an effect's die touches.
enum EffectRollKind {
  EFFECT_ROLL_KIND_UNSPECIFIED = 0;
  EFFECT_ROLL_KIND_ATTACK = 1;
  EFFECT_ROLL_KIND_SAVE = 2;
}

// EffectAudience is which players read a visible effect.
enum EffectAudience {
  EFFECT_AUDIENCE_UNSPECIFIED = 0;
  // The label shows to every player who sees the combatant.
  EFFECT_AUDIENCE_ALL = 1;
  // Only the player who controls the target (and the master).
  EFFECT_AUDIENCE_OWNER = 2;
}

// EffectPhase is where in a turn something happens.
enum EffectPhase {
  EFFECT_PHASE_UNSPECIFIED = 0;
  EFFECT_PHASE_START = 1;
  EFFECT_PHASE_END = 2;
}

// EffectEndScope says what EndLastingEffect ends.
enum EffectEndScope {
  EFFECT_END_SCOPE_UNSPECIFIED = 0;
  // This effect alone (on all of its targets).
  EFFECT_END_SCOPE_THIS = 1;
  // Every effect of the casting: the whole concentration.
  EFFECT_END_SCOPE_CONCENTRATION_GROUP = 2;
}

// EffectModifier is one change an effect makes.
message EffectModifier {
  EffectModifierKind kind = 1;
  // ROLL_DIE: the faces of the die (4: a d4), its sign (1 or -1) and the rolls it
  // touches.
  int32 die = 2;
  int32 sign = 3;
  repeated EffectRollKind applies_to = 4;
  // AC_BONUS: the bonus. SPEED_MULTIPLIER: the percent.
  int32 value = 5;
  // SAVE_ADVANTAGE: the abilities ("dex").
  repeated string abilities = 6;
  // EXTRA_ACTION: the standard actions it may be ("attack", "dash"...) and how many
  // weapon attacks it makes.
  repeated string allowed_actions = 7;
  int32 max_weapon_attacks = 8;
}

// EffectEnd is the moment an effect ends: the turn of a combatant in a round.
message EffectEnd {
  int32 round = 1;
  // The combatant whose turn it is; empty: the start of the round.
  string combatant_id = 2;
  EffectPhase phase = 3;
}

// EffectSave is a saving throw an effect asks again.
message EffectSave {
  // The ability ("wis"): the only part of the saving throw a player reads when the
  // effect came from an NPC.
  string ability = 1;
  string ability_name_pt = 2;
  EffectPhase phase = 3;
  // The DC. Only the master, and the player who cast the effect (never the DC of an
  // NPC's effect on a player's surface).
  optional int32 dc = 4;
}

// EffectTrigger is damage an effect deals to a creature that starts its turn under
// it, with no saving throw.
message EffectTrigger {
  EffectPhase phase = 1;
  string dice = 2;
  string damage_type_key = 3;
  string damage_type_pt = 4;
  // How many times it may hit each creature.
  int32 max_triggers = 5;
}

// LastingEffect is one effect as the caller may read it.
message LastingEffect {
  string id = 1;
  // The casting: every effect of one concentration shares it.
  string group_id = 2;
  string encounter_id = 3;
  // The targets the caller may read: the master all; a player the ones they see and
  // may read the effect on.
  repeated string target_ids = 4;
  repeated string target_labels = 5;
  EffectSourceKind source_kind = 6;
  // The spell's or the catalog's key ("spell:bless", "effect:dodging").
  string source_key = 7;
  // Its Portuguese name ("Bênção").
  string source_name_pt = 8;
  // Who cast it (a combatant id). Empty when the caller may not read it.
  string caster_id = 9;
  // "De Tavo", "Da ação Esquivar", "Do mestre", or "De alguém que você não vê" when
  // the caster is an NPC the player does not see.
  string origin_pt = 10;
  bool concentration = 11;
  repeated string condition_keys = 12;
  repeated string condition_names_pt = 13;
  repeated EffectModifier modifiers = 14;
  EffectDurationKind duration_kind = 15;
  // When it ends on the clock, and how many rounds are left.
  optional EffectEnd ends_at = 16;
  optional int32 rounds_left = 17;
  // The clock as the card reads it ("Restam 8 rodadas: acaba no turno de Tavo, na
  // rodada 11").
  string clock_text_pt = 18;
  // The saving throws it asks at the end (end_save) or at the start (start_save) of
  // the target's turn.
  optional EffectSave end_save = 19;
  optional EffectSave start_save = 20;
  optional EffectTrigger turn_trigger = 21;
  // The short labels of the card ("+1d4 em ataques e resistências") and the lines of
  // "O que isso muda".
  repeated string tags_pt = 22;
  repeated string changes_pt = 23;
  // The ability of the Strength check that frees a creature the effect holds
  // (Teia): the player reads the ability, never the DC.
  string break_free_ability = 24;
  // Only the master: whether the players read this effect, to whom, and the label.
  bool player_visible = 25;
  EffectAudience audience = 26;
  string player_label = 27;
  // Only the master: how the effect ends by itself in words ("Até o começo do turno
  // de Toren, rodada 4, ou se ele ficar incapacitado ou com deslocamento 0.").
  string end_text_pt = 28;
  // Only the master: the label each target shows the players now ("Paralisado"), or
  // empty when they read nothing.
  string players_see_pt = 29;
}

// CatalogEffect is an effect the master may add.
message CatalogEffect {
  // "spell:bless", "effect:dodging", "condition:prone".
  string key = 1;
  string name_pt = 2;
  EffectSourceKind source_kind = 3;
  bool concentration = 4;
  // The duration the dialog starts with.
  EffectDurationKind default_duration_kind = 5;
  int32 default_rounds = 6;
  // Whether a caster makes sense for it (a spell does).
  bool has_caster = 7;
}

// TurnClockEntry is one thing the clock does, from the turn that is running on.
message TurnClockEntry {
  // The round, the combatant whose turn it is and the phase.
  int32 round = 1;
  string combatant_id = 2;
  string combatant_label = 3;
  EffectPhase phase = 4;
  // True for a saving throw, false for an effect that ends.
  bool is_save = 5;
  // The effect it concerns.
  string effect_id = 6;
  // "Teste de Sabedoria (CD 14) contra Imobilizar Pessoa, de Orla." or "Esquivando acaba."
  string text_pt = 7;
}

// ConcentrationEntry is a caster that concentrates, with the effects it holds.
message ConcentrationEntry {
  string caster_id = 1;
  string caster_label = 2;
  string spell_key = 3;
  string spell_name_pt = 4;
  repeated string effect_ids = 5;
}

// EffectSavePrompt is the question of a reaction window of kind EFFECT_SAVE (RN-22): the
// saving throw an effect asks of its target at the end (or the start) of the target's
// turn. A player reads the ability, never the DC of an NPC's effect (RN-10, RN-20);
// the master reads the DC. It is answered with LastingEffectService.RollEffectSave.
message EffectSavePrompt {
  // The effect (the state's id) and its Portuguese name ("Imobilizar Pessoa").
  string effect_id = 1;
  string source_name_pt = 2;
  // The ability of the saving throw ("wis") and its Portuguese name ("Sabedoria").
  string ability = 3;
  string ability_name_pt = 4;
  // Whether it is asked at the end or at the start of the target's turn.
  EffectPhase phase = 5;
  // The DC: only the master, and the caster's own player.
  optional int32 dc = 6;
  // The bonus of the roll for who answers, and whether the app knows it (a basic-sheet
  // NPC has none).
  int32 modifier = 7;
  bool bonus_known = 8;
  // The mode of the d20 and the sources in words ("Esquivando: vantagem").
  string mode = 9;
  repeated string mode_sources_pt = 10;
  // The dice effects add or take from the roll (Bênção, Perdição).
  repeated ExtraDie extra_dice = 11;
  // The saving throw fails by itself, with no d20 (a Strength or Dexterity save of a
  // Paralisado creature).
  bool auto_fail = 12;
  // What a pass does ("Se passar, você se liberta. Se falhar, continua Paralisada.").
  string text_pt = 13;
  // The owner left the roll to the master.
  bool handed_to_master = 14;
  // Whether the effect is the master's to skip ("Pular o teste", a table option).
  bool skippable = 15;
  // The save is the one an area a spell keeps on the map asks (Moonbeam, Spirit Guardians, Cloudkill,
  // Web, Grease, Entangle): `effect_id` is then the zone's id. `zone_reason` is "zone_enter" (the creature came
  // in, the first time on this turn), "zone_start" (it began its turn inside), "zone_cast" (it stood in the area
  // when the spell was cast) or "zone_end" (it ended its turn inside).
  string zone_id = 16;
  string zone_reason = 17;
  // What a failure does to who answers: the damage type's Portuguese name ("radiante"; empty
  // for none) and whether a pass halves it. The dice are not here.
  string damage_type_name_pt = 18;
  bool half_on_save = 19;
}

// ExtraDie is a die an effect adds to (sign 1) or takes from (sign -1) a roll.
message ExtraDie {
  // The effect's source key ("spell:bless") for who may read it; "Outra fonte" for a
  // player when the effect is hidden: the key is empty then.
  string source_key = 1;
  string source_name_pt = 2;
  int32 faces = 3;
  int32 sign = 4;
  // The face rolled, 0 before the roll.
  int32 face = 5;
}

// EffectSaveResult is what a saving throw of an effect did.
message EffectSaveResult {
  // The d20 (the face typed, for a physical die), the bonus and the total. Zero
  // when the save failed by itself.
  int32 d20 = 1;
  int32 modifier = 2;
  int32 total = 3;
  // The other d20 of a roll with advantage or disadvantage, and the one that
  // counted.
  repeated int32 d20_faces = 4;
  bool physical = 5;
  bool saved = 6;
  bool auto_fail = 7;
  // The dice the effects added, with the faces.
  repeated ExtraDie extra_dice = 8;
  // True when the master skipped the save (a table option).
  bool skipped = 9;
  // Whether the effect ended on its target because of it.
  bool effect_ended = 10;
  // "Imobilizar Pessoa acabou." and similar.
  string text_pt = 11;
  // The DC, only for the master.
  optional int32 dc = 12;
  // The Bardic Inspiration die the player added after the d20, already in `total`: its size
  // and the face rolled (both 0 when no die was added). A scalar pair, not a BonusDie,
  // because combat.proto imports this file.
  int32 inspiration_sides = 13;
  int32 inspiration_face = 14;
  // The d20 the halfling's Lucky rolled again after it showed a 1 (`source_key`
  // "trait:lucky"), as an index into `d20_faces` (or the one `d20`); `d20` and `d20_faces` hold
  // the new face. Empty when nothing was rolled again.
  repeated Reroll rerolled = 15;
}

// What a lasting effect did to a target of a spell (CastSpell).
enum LastingEffectOutcome {
  LASTING_EFFECT_OUTCOME_UNSPECIFIED = 0;
  // It took hold: the target has the effect now.
  LASTING_EFFECT_OUTCOME_APPLIED = 1;
  // The spell did nothing to this target ("A magia não teve efeito."): a player
  // reads no reason, only the master reads why (no_effect_reason_master).
  LASTING_EFFECT_OUTCOME_NO_EFFECT = 2;
}

// A reason an option of the turn is unavailable because of an effect or a
// condition; the text is already what the caller may read (RN-20).
message EffectNote {
  // "Você está Paralisada. Não age nem se move neste turno."
  string text_pt = 1;
  // Only the master: the same with the cause.
  string text_master_pt = 2;
}

// ExtraActionOption is the extra action an effect gives (Velocidade): one action a
// turn that may only be some standard actions.
message ExtraActionOption {
  bool available = 1;
  string label_pt = 2;
  // The standard actions it may be: "attack", "dash", "disengage", "hide",
  // "use-an-object".
  repeated string allowed_actions = 3;
  // "Só: Atacar (uma arma), Disparada, Desengajar, Esconder, Usar um objeto".
  string allowed_text_pt = 4;
  // The reason it is unavailable (used, or the lethargy).
  string reason_pt = 5;
}

// Effects the caller reads on a combatant, for the order list and the map.
message EffectLabel {
  string effect_id = 1;
  // "Paralisado", "Preso numa teia", or the master's free label.
  string text_pt = 2;
}

// CharacterEffect is an effect on a character that is not in a running combat, as the caller
// may read it: the master all of them; a player the ones the master leaves visible, on their own
// characters (and, for the ones for everyone, on the others they see on the stage).
message CharacterEffect {
  string id = 1;
  string character_id = 2;
  string character_name = 3;
  // The spell's or the catalog's key ("spell:bless") and its Portuguese name.
  string source_key = 4;
  string source_name_pt = 5;
  // The game time it has left, in seconds (a round is 6 seconds); absent when it lasts until
  // it is dismissed or its caster stops concentrating.
  optional int32 seconds_left = 6;
  // "dura 1 minuto", "dura 54 segundos", "dura 8 horas", "dura enquanto a conjuradora se concentrar".
  string duration_text_pt = 7;
  bool concentration = 8;
  repeated string tags_pt = 9;
  repeated string condition_names_pt = 10;
  // Only the master: whether the players read this effect, and to whom.
  bool player_visible = 11;
  EffectAudience audience = 12;
}
