syntax = "proto3";

// Package meurpg.characters.v1 is about a campaign's characters: the
// players' characters and the master's NPCs, their sheets and stories, and
// the master's private notes about them.
//
// Text fields. Lengths count characters (Unicode code points), after the
// server trims spaces at both ends. One-line fields reject control
// characters such as line breaks; multi-line fields accept line breaks and
// tabs and reject other control characters. Every free-text field is
// fiction: the app reminds people not to write real people's data there,
// and the server never logs it (docs/privacy.md). No field holds the
// player's real name or e-mail.
//
// Stored as JSON. The server stores CharacterSheet and CharacterStory in the
// database as their JSON form, with the proto field names and enum value
// names below (and those of meurpg.rules.v1.AbilityScores). Renaming or
// reusing a field or an enum value would break every stored sheet, so never
// do it: add a new field instead. buf breaking checks this.
package meurpg.characters.v1;

import "google/protobuf/timestamp.proto";
import "meurpg/rules/v1/rules.proto";

// CharacterService creates, reads and edits a campaign's characters.
//
// Every method needs a valid session cookie and fails with `unauthenticated`
// without one. Every request names the campaign, and access follows the
// caller's role in it (RN-05, ADR-0011):
//   - The campaign's master sees and edits every character of the campaign,
//     in every state. Only the master creates NPCs, marks a character dead,
//     and reads or writes the master's notes.
//   - A player sees and edits only their own characters. The sheet locks
//     for them when a game session starts (RN-01); after that, they edit
//     the story only while the master allows it (SetStoryEditing).
//   - For a campaign the caller is not a member of, every method answers
//     `not_found`, exactly as for a campaign that does not exist.
//   - A member asking for a character they may not see (another player's
//     character, or any NPC for a player) also gets `not_found`, exactly as
//     for a character that does not exist, so nobody learns which
//     characters exist.
//   - A member asking for something only the master may do gets
//     `permission_denied`.
//   - A pending member (RN-15, MR-024: someone who accepted an invite that
//     requires approval, see meurpg.campaigns.v1.AcceptInvite) is not a
//     member yet, and gets `not_found` from every method except these, which
//     let them work on their one character while they wait: CreateCharacter
//     (one player character, which starts PENDING), GetCharacter,
//     ListCharacters, UpdateCharacter and UpdateCharacterStory (only their
//     own PENDING character), PreviewCharacter (the numbers of the sheet
//     they are making), and ContentService.ListContent. Inside those
//     methods they are treated like a player.
//   - An ID that is not a UUID is answered like an ID that does not exist.
//   - The guided level-up (MR-040) is the player's own: GetLevelUpOptions and
//     PreviewLevelUp are for the master and the owning player, while the
//     character can level up; RollLevelUpHitPoints and LevelUpCharacter only
//     for the owning player (the master edits the sheet as always); and
//     ListLevelUps only for the master.
//
// Errors every method can return, besides those listed on each method:
//   - `unauthenticated`: no valid session cookie.
//   - `invalid_argument`: a field breaks its documented rules. The message
//     names the field, never its value.
//   - `unavailable`: the database did not answer; the app may try again.
//   - `aborted`: the database kept reporting a conflicting transaction
//     after the server's retries; the app may try again.
//
// Responses carry `Cache-Control: no-store`, because they describe the
// caller's characters. Reads carry IDs, so they are IDEMPOTENT and
// POST-only: a GET would put the IDs in the URL, and URLs end up in the
// platform's request logs (docs/privacy.md).
service CharacterService {
  // CreateCharacter creates a character in a campaign.
  //
  // Who may call it depends on the kind:
  //   - CHARACTER_KIND_PLAYER (MR-003): any player of the campaign, for
  //     themselves. The master gets `permission_denied`: a master is not a
  //     player of their own campaign. The character starts as a draft the
  //     player edits until the next game session starts (RN-01), even when
  //     the campaign already had sessions. A pending member (RN-15, MR-024)
  //     may create theirs too: it starts PENDING, waits for the master's
  //     ApproveCharacter or RejectCharacter, and becomes a draft when
  //     approved.
  //   - The NPC kinds, ENEMY, BOSS, MINION and STORY (MR-005): only the
  //     campaign's master, who becomes the NPC's owner (RN-04). Players get
  //     `permission_denied`. NPCs never lock.
  //
  // PLAYER, ENEMY and BOSS take a full sheet; MINION and STORY take a basic
  // sheet.
  //
  // A player has at most one living character per campaign (RN-03): they
  // create a new one only after the current one dies. Creating a second one
  // fails with `failed_precondition`, even when two calls race.
  //
  // Not idempotent: calling it twice creates two NPCs.
  //
  // Errors:
  //   - `invalid_argument`: kind is unspecified, the sheet's type does not
  //     match the kind, or a field breaks its rules (including a content key
  //     that does not exist).
  //   - `not_found`: the campaign does not exist, or the caller is not a
  //     member of it.
  //   - `permission_denied`: the caller's role may not create this kind.
  //   - `failed_precondition`: the player already has a living character in
  //     this campaign. The error carries a CharacterBlocked detail with
  //     reason LIVING_CHARACTER_EXISTS and that character's ID. Or the base
  //     scores of a player's sheet do not follow the way they say they were
  //     made, or the table does not allow that way (RN-24): an
  //     AbilityScoresRefusal detail.
  //   - `resource_exhausted`: the campaign already has 1,000 characters and
  //     NPCs, living and dead together (RN-30). A retry of a create that already
  //     went through is answered, not refused.
  //
  // The base scores of a PLAYER's full sheet are checked against
  // `ability_method` (RN-24). Nothing else is: the master's NPCs and the
  // master's later edits are free, and so is the rest of the sheet.
  //
  // Safe to retry when the request carries an idempotency_key: a second call with the same key and
  // the same request returns what the first one made and makes nothing; the same key with another
  // request is `invalid_argument`. The key is the caller's: another member sending the same key
  // makes a character of their own. Without a key the call is not deduplicated.
  rpc CreateCharacter(CreateCharacterRequest) returns (CreateCharacterResponse);

  // GetAbilityRolls returns the six sets of "4d6, drop the lowest" the server
  // stored for the caller's next new character in this campaign (RN-24), and
  // none when no roll was made yet. The same sets come back on every call until
  // CreateCharacter uses them. Only a player, or a pending member, may call it:
  // the master's NPCs are free. It only reads, but stays POST-only, because a
  // GET would put the campaign ID in the URL.
  //
  // Errors: `not_found` for a campaign the caller is not in; `permission_denied`
  // for the master.
  rpc GetAbilityRolls(GetAbilityRollsRequest) returns (GetAbilityRollsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RollAbilityScores makes the six sets of "4d6, drop the lowest" for the
  // caller's next new character, stores them, and returns them (RN-24). It is
  // idempotent: while the stored sets are not used by a CreateCharacter, a
  // second call returns the same sets (`already_rolled`), so reloading the page
  // never rerolls. After a CreateCharacter that used them, the next call makes
  // new ones.
  //
  // With physical dice (RN-18: the campaign forces them, or the player's
  // preference is physical under "cada jogador escolhe") the player types the
  // dice instead, once: `typed_dice` holds the six sets, four dice each. Without
  // `typed_dice` the server rolls. A campaign that forces the app refuses typed
  // dice, and one that forces physical dice refuses a roll without them. Typed
  // dice sent again are accepted only when they are the stored ones.
  //
  // Only a player, or a pending member, may call it.
  //
  // Errors:
  //   - `permission_denied`: the caller is the master.
  //   - `invalid_argument`: `typed_dice` is not six sets of four dice, each 1
  //     to 6.
  //   - `failed_precondition`: an AbilityScoresRefusal detail: the table does
  //     not allow 4d6 (METHOD_NOT_ALLOWED), the dice rule refuses this way of
  //     rolling (DICE_FORCED_IN_APP, DICE_FORCED_PHYSICAL), or other dice were
  //     already stored (ROLLS_ALREADY_STORED).
  rpc RollAbilityScores(RollAbilityScoresRequest) returns (RollAbilityScoresResponse);

  // CreateNpcFromCreature is the bestiary's "Criar NPC" (MR-042, RN-29): it
  // makes a named NPC with a basic sheet filled in from an SRD creature, for
  // the master who wants "Grak, o ogro" rather than a typed NPC. The sheet
  // holds the creature's armor class, average hit points, speed (the walking
  // speed, or the highest one it has when it does not walk), ability scores,
  // initiative bonus (the Dexterity modifier), size, challenge rating and XP,
  // its first three attacks, weapon or spell, with the attack bonus, the reach or
  // range and the first damage roll (a basic attack holds one damage: the
  // other damage parts, such as the dragon's extra fire, go into the sheet's
  // description as "Mordida: +2d6 fogo"; a saving throw or other rider stays in
  // the SRD stat block; an attack whose die is not a d4, d6, d8, d10 or d12, or
  // that has no damage, is left out), and `monster_key`, which links the NPC to the creature so the
  // app can show the stat block (`meurpg.rules.v1.ContentService.GetCreature`).
  // The creature in the bestiary does not change, and the NPC is a copy: the
  // master edits it as any NPC (UpdateCharacter) and the numbers do not follow
  // the creature afterwards.
  //
  // Only the campaign's master may call it, and they become the NPC's owner
  // (RN-04). The NPC is like any other the master creates: a character of the
  // campaign, never locked, hidden from the players by default (RN-10). The kind
  // is MINION ("Minion" in the app, the default the app offers) or STORY ("NPC
  // de história"): a basic sheet cannot be a full sheet's ENEMY ("Inimigo") or
  // BOSS.
  //
  // It is idempotent: idempotency_key is a UUID the app makes for the dialog.
  // Sending the same key again, for the same creature, name and kind, returns
  // the NPC the first call made and creates nothing.
  //
  // Errors:
  //   - `invalid_argument`: creature_key is not an SRD creature, kind is not
  //     MINION or STORY, name is not 1 to 80 characters on one line, the
  //     idempotency_key is not a UUID, or it was already used for another
  //     creature, name or kind.
  //   - `resource_exhausted`: the campaign already has 1,000 characters and
  //     NPCs, living and dead together (RN-30). A repeat of a call that already
  //     made its NPC is answered, not refused.
  //   - `not_found`: the campaign does not exist, or the caller is not a
  //     member of it.
  //   - `permission_denied`: the caller is a player.
  rpc CreateNpcFromCreature(CreateNpcFromCreatureRequest) returns (CreateNpcFromCreatureResponse);

  // GetCharacter returns one character with its sheet, its story, and the
  // numbers the server derives from the sheet (MR-004). The campaign's
  // master may read every character of the campaign; a player, only their
  // own, dead ones included; a pending member (MR-024), only their own
  // PENDING character. It never carries the master's notes (RN-11): those
  // come only from GetMasterNotes.
  //
  // Errors:
  //   - `not_found`: the character is not in this campaign, the caller may
  //     not see it, the campaign does not exist, or the caller is not a
  //     member of it.
  rpc GetCharacter(GetCharacterRequest) returns (GetCharacterResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListCharacters lists a campaign's characters, without their sheets.
  //
  // The master gets every character of the campaign: the players'
  // characters first, then the NPCs. Characters waiting for approval
  // (PENDING, MR-024) come in the same list, so the master sees whom to
  // approve. A player gets only their own characters, dead ones included,
  // and never an NPC; a pending member, only their own PENDING character.
  // Each group is in creation order, oldest first. The list is not
  // paginated.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a
  //     member of it.
  rpc ListCharacters(ListCharactersRequest) returns (ListCharactersResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // UpdateCharacter replaces a character's name and sheet (MR-006). It does
  // not touch the story: see UpdateCharacterStory.
  //
  // The campaign's master may edit every character of the campaign, in
  // every state. The player who owns a character may edit it only while it
  // is a draft, or while it waits for the master's approval (PENDING,
  // MR-024): once a game session starts, the sheet is locked for them
  // (RN-01), and a dead character stays as it died.
  //
  // The kind never changes, and the sheet's type must still match it.
  //
  // revision must be the revision the client last read. If the character
  // changed since, the call fails with `aborted` and changes nothing: the
  // app reloads the character and the person tries again. On success, the
  // revision goes up by one.
  //
  // When the save changes the sheet's maximum hit points, the character's
  // current hit points follow in the same transaction (RN-12): set ones gain
  // what the maximum gained, none ends above a lower maximum, and ones never
  // set stay full.
  //
  // Errors:
  //   - `invalid_argument`: revision is less than 1, the sheet's type does
  //     not match the kind, or a field breaks its rules.
  //   - `not_found`: the character is not in this campaign, the caller may
  //     not see it, the campaign does not exist, or the caller is not a
  //     member of it.
  //   - `failed_precondition`: the caller is the player and the sheet is
  //     locked or the character is dead. The error carries a
  //     CharacterBlocked detail with reason SHEET_LOCKED or CHARACTER_DEAD.
  //     This wins over a stale revision: retrying would not help.
  //   - `aborted`: revision is stale.
  rpc UpdateCharacter(UpdateCharacterRequest) returns (UpdateCharacterResponse);

  // UpdateCharacterStory replaces a character's story: personality,
  // appearance, backstory and allies.
  //
  // The story is descriptive text, not game data, so it has its own lock,
  // which the master controls (decided by Vinicius on 29/09/2026):
  //   - The campaign's master may change it in every state. Only the master
  //     edits an NPC's story.
  //   - The player who owns the character may change it while the character
  //     is a draft or pending, and afterwards (locked or dead) only while the master
  //     allows it with SetStoryEditing. That permission ends when the next
  //     game session starts.
  // Nobody ever edits the numbers the server derives from the sheet.
  //
  // revision works as in UpdateCharacter: the story and the sheet share
  // one revision, and this call also raises it by one.
  //
  // Errors:
  //   - `invalid_argument`: revision is less than 1, or a field breaks its
  //     rules.
  //   - `not_found`: the character is not in this campaign, the caller may
  //     not see it, the campaign does not exist, or the caller is not a
  //     member of it.
  //   - `failed_precondition`: the caller is the player, the character is
  //     no longer a draft, and the master has not allowed story edits. The
  //     error carries a CharacterBlocked detail with reason STORY_LOCKED.
  //     This wins over a stale revision: retrying would not help.
  //   - `aborted`: revision is stale.
  rpc UpdateCharacterStory(UpdateCharacterStoryRequest) returns (UpdateCharacterStoryResponse);

  // SetStoryEditing lets the player who owns a locked or dead character
  // edit its story again, or takes that back (decided by Vinicius on
  // 29/09/2026). Only the campaign's master may call it, and only for a
  // player character: the master always edits an NPC's story.
  //
  // The permission lasts until the master takes it back or the next game
  // session starts (PlayService.StartGameSession turns it off). While the
  // character is a draft, the player edits the story anyway.
  //
  // Setting the value it already has changes nothing and is not an error.
  // It does not change the revision.
  //
  // Errors:
  //   - `invalid_argument`: the character is an NPC.
  //   - `not_found`: the character is not in this campaign, the campaign
  //     does not exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  rpc SetStoryEditing(SetStoryEditingRequest) returns (SetStoryEditingResponse);

  // MarkCharacterDead records that a player character died (RN-03). Only
  // the campaign's master may call it.
  //
  // The character is never deleted: it stays in the lists, the player can
  // still read it, and the player may now create a new character in the
  // campaign. Only the master edits a dead character's sheet; the player
  // edits its story only when the master allows it (SetStoryEditing).
  //
  // It is idempotent: marking a dead character again changes nothing and
  // keeps the first died_at. It does not change the revision.
  //
  // Errors:
  //   - `invalid_argument`: the character is an NPC. Only player characters
  //     die; an NPC's hit points belong to each combat (RN-04).
  //   - `not_found`: the character is not in this campaign, the campaign
  //     does not exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: the character waits for the master's approval
  //     (PENDING, MR-024): approve or reject it instead. The error carries a
  //     CharacterBlocked detail with reason AWAITING_APPROVAL.
  rpc MarkCharacterDead(MarkCharacterDeadRequest) returns (MarkCharacterDeadResponse);

  // GetMasterNotes returns the master's private notes about a character
  // (RN-11). Only the campaign's master may call it. The notes never reach
  // a player, through this or any other method.
  //
  // Notes belong to the pair of campaign and character: a character used in
  // more than one campaign has separate notes in each.
  //
  // Errors:
  //   - `not_found`: the character is not in this campaign, the campaign
  //     does not exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player, whatever the
  //     character.
  rpc GetMasterNotes(GetMasterNotesRequest) returns (GetMasterNotesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // UpdateMasterNotes replaces the master's private notes about a character
  // (RN-11). Only the campaign's master may call it. Empty notes delete
  // them. The last save wins: notes have no revision.
  //
  // Errors:
  //   - `invalid_argument`: notes break their rules.
  //   - `not_found`: the character is not in this campaign, the campaign
  //     does not exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player, whatever the
  //     character.
  rpc UpdateMasterNotes(UpdateMasterNotesRequest) returns (UpdateMasterNotesResponse);

  // ApproveCharacter lets a character that waits for approval into the
  // campaign (RN-15, MR-024). Only the campaign's master may call it.
  //
  // In one transaction, the character becomes a draft (DRAFT: its player
  // edits it until the next game session starts, RN-01) and its player's
  // pending membership becomes an ordinary player membership, so from then
  // on they see the campaign like any other player. If the player deleted
  // their account while waiting, only the character changes: it stays with
  // the campaign, as in RN-16.
  //
  // It is idempotent: approving a character that is not PENDING (already
  // approved, or created by a player who needed no approval) changes nothing
  // and returns the character as it is.
  //
  // Errors:
  //   - `invalid_argument`: the character is an NPC. Only player characters
  //     wait for approval.
  //   - `not_found`: the character is not in this campaign (a rejected
  //     character is gone), the campaign does not exist, or the caller is
  //     not a member of it.
  //   - `permission_denied`: the caller is a player.
  rpc ApproveCharacter(ApproveCharacterRequest) returns (ApproveCharacterResponse);

  // RejectCharacter turns down a character that waits for approval (RN-15,
  // MR-024). Only the campaign's master may call it.
  //
  // The character never became part of the campaign, so, in one
  // transaction, it is deleted with its story (and any notes the master
  // wrote about it), and its player's pending membership is deleted too
  // (docs/privacy.md). The player sees the campaign no more, like anyone
  // who is not in it, and needs a new invite to try again. An active
  // membership is never touched.
  //
  // Errors:
  //   - `invalid_argument`: the character is an NPC.
  //   - `not_found`: the character is not in this campaign (rejecting twice
  //     gets this: the character is gone), the campaign does not exist, or
  //     the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: the character is not PENDING: once approved, a
  //     character stays in the campaign. The error carries a CharacterBlocked
  //     detail with reason NOT_PENDING.
  rpc RejectCharacter(RejectCharacterRequest) returns (RejectCharacterResponse);

  // RequestCharacterChanges is the master's "Pedir ajustes" on a character that
  // waits for approval (RN-15, MR-024): it stays PENDING and the player sees the
  // master's reason, edits the sheet and sends it again (ResubmitCharacter). Only
  // the campaign's master may call it. Nothing is deleted: the invite and the
  // pending membership stay as they are, and the master may still approve or
  // reject at any time.
  //
  // The reason is 1 to 500 characters after trimming, one block of text. It is
  // personal data of the player kept by the master: only the master and the
  // owner read it (Character.review), and the server deletes it when the
  // character is approved or rejected, when the character, the campaign or the
  // player's account is deleted (docs/privacy.md). Asking again replaces the reason
  // and the time, and the review is CHANGES_REQUESTED again.
  //
  // It carries an idempotency_key (1 to 64 characters, scoped to the caller): the
  // same key with the same request returns the first answer and tells the stream
  // nothing; the same key with another request is `invalid_argument`.
  //
  // It sends `character_changes_requested` to the master and the owner.
  //
  // Errors:
  //   - `invalid_argument`: the reason is empty or has only spaces (field
  //     "reason", InvalidField), it passes 500 characters (field "reason"), the
  //     key is not valid or was used for another request, or the character is an
  //     NPC.
  //   - `not_found`: the character is not in this campaign, the campaign does
  //     not exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: the character is not PENDING (NOT_PENDING).
  rpc RequestCharacterChanges(RequestCharacterChangesRequest) returns (RequestCharacterChangesResponse);

  // ResubmitCharacter is the owner's "Enviar de novo": the sheet is ready for
  // the master to look at again. The character stays PENDING and its review
  // becomes RESUBMITTED; the reason stays for the master's history until the
  // character is approved, rejected or deleted. Only the owning player may call it,
  // and only while a request for changes is open. Editing the sheet does not send
  // it: the player decides when they are done.
  //
  // It carries an idempotency_key like RequestCharacterChanges. It sends
  // `character_resubmitted` to the master and the owner.
  //
  // Errors:
  //   - `invalid_argument`: the key is not valid or was used for another request.
  //   - `not_found`: the character is not in this campaign, the campaign does not
  //     exist, or the caller is not its owner or a member: the same answer for
  //     both, so nobody probes a character_id.
  //   - `failed_precondition`: NOT_PENDING (the character was approved), or
  //     NO_CHANGES_REQUESTED (there is no open request: nothing was asked, or
  //     it was already sent again).
  rpc ResubmitCharacter(ResubmitCharacterRequest) returns (ResubmitCharacterResponse);

  // ReviveCharacter is the master's "Reviver" (RN-03, SRD 5.1, "Dropping to 0 Hit
  // Points"): a dead player character lives again with 1 hit point, with no death
  // save counted, and goes back to the state it had before it died (a draft or
  // locked). Spell slots, class uses and hit dice stay as they were. It is not a
  // spell: it spends nothing and has no time limit. Only the campaign's master may
  // call it.
  //
  // In a combat that is not ended where the character was a combatant, it goes back
  // to the order where it was and acts on its next turn: the SRD has no "no turn
  // this round" rule. The log says "O mestre reviveu <name>". The character's
  // `revived_at` is set; `died_at` stays as the history of the master, and a new
  // death sets it again.
  //
  // RN-03: a player has at most one living character in a campaign. If the player
  // made another one after this death, reviving is refused until the master
  // archives it or marks it dead.
  //
  // It carries an idempotency_key; the same key with the same request after a
  // success returns the character as it is.
  //
  // Errors:
  //   - `invalid_argument`: the character is an NPC, or the key is not valid or was
  //     used for another request.
  //   - `not_found`: the character is not in this campaign, the campaign does not
  //     exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: the character is not dead (NOT_DEAD), or its player
  //     already has another living character in the campaign
  //     (LIVING_CHARACTER_EXISTS: the error's CharacterBlocked names it).
  rpc ReviveCharacter(ReviveCharacterRequest) returns (ReviveCharacterResponse);

  // CreateClaimLink makes the link a player uses to take a reserved character
  // (the character the master made with CreateCharacter.for_player). Only the
  // campaign's master may call it. The app builds the link as
  // `https://<app>/claim#t=<token>`: the token is a random secret that comes back
  // once, here, and the server keeps only its SHA-256 (as for an invite). A
  // character has one live link: making another revokes the previous one, in the
  // same transaction. The link works for `validity_days` (1, 7 or 30; 0 means 7)
  // and once.
  //
  // Errors:
  //   - `invalid_argument`: `validity_days` is not 0, 1, 7 or 30, or the
  //     character is not a player character.
  //   - `not_found`: the character is not in this campaign, the campaign does not
  //     exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: the character is not reserved (a CharacterBlocked
  //     detail with reason NOT_RESERVED).
  rpc CreateClaimLink(CreateClaimLinkRequest) returns (CreateClaimLinkResponse);

  // RevokeClaimLink ends the character's live link, if it has one: whoever opens
  // it sees the generic "this link cannot be used" page. Revoking when there is no
  // live link, or twice, is not an error. Only the campaign's master may call it.
  //
  // Errors:
  //   - `not_found`, `permission_denied`: as CreateClaimLink.
  //   - `failed_precondition`: a player used the link first (a CharacterBlocked
  //     detail with reason CLAIM_LINK_USED and the player's display name), or the
  //     character is not reserved (NOT_RESERVED).
  rpc RevokeClaimLink(RevokeClaimLinkRequest) returns (RevokeClaimLinkResponse);

  // ReturnCharacterToReserve takes a character a player claimed through a link
  // back: it has no owner again and is reserved (invisible to the players), and
  // its link is gone. The player stays a member of the campaign. Only the
  // campaign's master may call it. Safe to repeat: a character that is reserved
  // already is answered with `failed_precondition` NOT_CLAIMED, which the app
  // reads as done.
  //
  // Errors:
  //   - `not_found`, `permission_denied`: as CreateClaimLink.
  //   - `failed_precondition`: NOT_CLAIMED (the character did not come from a link,
  //     is reserved already, or is dead) or CHARACTER_IN_COMBAT.
  rpc ReturnCharacterToReserve(ReturnCharacterToReserveRequest) returns (ReturnCharacterToReserveResponse);

  // DeleteReservedCharacter deletes a reserved character, with its story and its
  // notes, and its live link (the same transaction). Only the campaign's master
  // may call it, and only for a reserved character: a character with an owner
  // never goes this way (RN-03). Deleting twice is `not_found`.
  //
  // Errors:
  //   - `not_found`, `permission_denied`: as CreateClaimLink.
  //   - `failed_precondition`: the character is not reserved (NOT_RESERVED).
  rpc DeleteReservedCharacter(DeleteReservedCharacterRequest) returns (DeleteReservedCharacterResponse);

  // PreviewClaim says which character a claim link is for, to the signed-in person
  // who opened it, so they can decide before ClaimCharacter. It shows only what
  // the public card shows: the name, race, class and level, who sent the link and
  // from which campaign. It changes nothing, and it is never called before sign-in:
  // the page asks only after the person has a session.
  //
  // `token` is the link's secret, in the request body only. Empty, it means the
  // link the person signed in with (the sign-in intent `character_claim` keeps it
  // for 10 minutes; signing in never claims).
  //
  // Errors:
  //   - `unauthenticated`: no session.
  //   - `not_found`: the link is invalid, expired, used or revoked, or its character
  //     is gone. One fixed message for all of them (the same code, the same
  //     sentence): nobody learns which.
  //   - `resource_exhausted`: too many tries by this person or from this address.
  rpc PreviewClaim(PreviewClaimRequest) returns (PreviewClaimResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ClaimCharacter makes the signed-in person the owner of the reserved character
  // the link is for, and a member of its campaign (no approval step; a pending
  // join request is closed). The link is spent. Only this call claims: signing in
  // with a link never does.
  //
  // `token` as in PreviewClaim. Claiming again with the link the same person
  // used is `not_found`, like any used link.
  //
  // Errors:
  //   - `unauthenticated`, `not_found`, `resource_exhausted`: as PreviewClaim. A
  //     claim that loses a race with a revoke or with another claim is the same
  //     `not_found`.
  //   - `failed_precondition`: a CharacterBlocked detail with reason
  //     LIVING_CHARACTER_EXISTS (RN-03: the person already has a living character
  //     in the campaign; the detail names it), or CLAIM_OWN_LINK (the caller is the
  //     campaign's master).
  rpc ClaimCharacter(ClaimCharacterRequest) returns (ClaimCharacterResponse);

  // GetLevelUpOptions says what the next level of one of the character's
  // classes gives, so the app can draw the guided level-up (MR-040, RN-12):
  // the ability increase, the hit die, the new cantrips and spells, the
  // subclass and the new feature options, and the numbers that change by
  // themselves. It names the choices, never makes them: nothing is stored.
  //
  // Who may call it: the master, and the owning player, while
  // Character.can_level_up is true. Anyone else asking about a character they
  // cannot see gets `not_found`.
  //
  // Errors:
  //   - `not_found`: the character is not in this campaign, or the caller may
  //     not see it.
  //   - `failed_precondition`: the character cannot level up now. The error
  //     carries a CharacterBlocked detail with reason CANNOT_LEVEL_UP (it is
  //     not marked for a milestone and has too little XP, it is at level 20,
  //     or it is an NPC), CHARACTER_DEAD or AWAITING_APPROVAL.
  //   - `invalid_argument`: class_key is not a class of the content.
  //   - `failed_precondition` with a LevelUpRefusal: class_key is a class the
  //     character does not have and the character may not take it (the
  //     MULTICLASS_PREREQUISITE reasons, MAX_LEVEL, ARCHIVED_CHOICE or
  //     SWITCHED_OFF_CHOICE).
  rpc GetLevelUpOptions(GetLevelUpOptionsRequest) returns (GetLevelUpOptionsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // PreviewLevelUp tells what the sheet would be like with these choices,
  // without saving anything: the Summary step of the guided level-up
  // ("Resumo", before and after). The server derives the new numbers (the web
  // has no rules engine), so the app also reads here the prepared-spell maximum
  // that an ability increase changes. The choices may be incomplete: the
  // answer then carries the first refusal (LevelUpRefusal) next to the sheet
  // as far as the choices go, so the app knows which step is missing.
  //
  // Who may call it, and the errors, are those of GetLevelUpOptions. A choice
  // that LevelUpCharacter would answer `invalid_argument` to (an unknown key,
  // a list too long) is `invalid_argument` here too.
  rpc PreviewLevelUp(PreviewLevelUpRequest) returns (PreviewLevelUpResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // PreviewCharacter derives the numbers of a sheet that is being created or
  // edited, and writes nothing: the character editor's "Pontos de vida" box
  // shows the server's maximum (the dice, the Constitution modifier and the
  // "hp.max" effects, such as Dwarven Toughness) instead of adding it up in the
  // browser, which has no rules engine. The sheet is the one CreateCharacter and
  // UpdateCharacter take; the fields that do not change the numbers (name,
  // portrait, story, idempotency key) are not part of the request.
  //
  // It accepts exactly the callers and sheets that the save it previews
  // accepts, so a preview never shows a sheet the save would refuse and never
  // tells anyone more than the save would. Without a character_id, what
  // CreateCharacter checks: a member or a pending member; a player previews
  // only a PLAYER sheet and the master only an NPC kind; the sheet's own rules,
  // the sheet that fits the kind, a new choice of an archived table entry
  // refused, and a choice the table switched off refused for a player. With a
  // character_id, what UpdateCharacter checks: the caller sees the character,
  // may edit its sheet now (RN-01) and the sheet fits the character's kind; an
  // archived or switched-off choice is judged against the stored sheet, so a
  // choice the character already has stays. The ability method (RN-24) is not
  // checked here: the save does it.
  //
  // Errors:
  //   - `not_found`: the character is not in this campaign or the caller may
  //     not see it.
  //   - `permission_denied`: a player previews an NPC kind, or the master a
  //     PLAYER sheet.
  //   - `invalid_argument`: the sheet, or the kind, breaks the rules of the
  //     save.
  //   - `failed_precondition`: with the CharacterBlocked detail, the character's
  //     sheet is locked for the caller (RN-01), or a new choice is archived or
  //     switched off (the same detail as the save).
  rpc PreviewCharacter(PreviewCharacterRequest) returns (PreviewCharacterResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // PreviewChoices answers which choices a sheet asks the player to make (a Fighting
  // Style, a Draconic Ancestry, the warlock's Pact Boon and invocations, a favored
  // enemy, a terrain, the half-elf's two +1, a bonus cantrip...), how many picks each
  // takes, which are made, and what each option asks for and gives. It writes nothing.
  //
  // The browser never decides a rule: this is where the "Escolhas" step of the
  // character editor, the locked sheet's "Completar escolhas pendentes" and the
  // level-up's catch-up read the options, the prerequisites (a warlock level, a
  // cantrip, a Pact Boon), the numbers a pick gives (the breath weapon's DC) and which
  // choice is still open. It also says where the spell pickers get the spells that
  // are not on the class list (the patron's, the Magical Secrets).
  //
  // Who may call it, the sheet it takes and the errors are those of PreviewCharacter;
  // with a character_id and no sheet, the character's stored sheet is the one read.
  // A basic sheet has no choices (`invalid_argument`).
  rpc PreviewChoices(PreviewChoicesRequest) returns (PreviewChoicesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // CompleteCharacterChoices makes the choices a sheet left open, on a sheet that is
  // locked for the player (RN-01) as well as on a draft: it writes only the picks of
  // the choices that are open, and nothing else changes. What is chosen never becomes
  // a field again: a choice already made is `CHOICE_ALREADY_MADE`, and the Pact Boon
  // is never swapped. A pick that changes numbers (a half-elf's +1 in Constitution
  // raises the hit points) is recomputed by the sheet, and the master gets the line
  // "<name> completou <choice>" in the log.
  //
  // For the owning player and for the master. The master may complete the choices of
  // any character; a player only their own. Not for a dead character (the master edits
  // its sheet with UpdateCharacter).
  //
  // Errors:
  //   - `not_found`: the character is not in this campaign or the caller may not see it
  //     (the same for a player who does not own it and for a stranger).
  //   - `aborted`: the revision is not the character's now.
  //   - `invalid_argument`: more than 50 picks, an empty choice key, an option key
  //     that is not a content key, or a text over 40 characters.
  //   - `failed_precondition`: with a ChoiceRefusal detail: CHOICE_NOT_OPEN for a
  //     pick that names a choice the sheet does not have, CHOICE_ALREADY_MADE for one
  //     with nothing left to pick, CHOICE_NOT_OFFERED for an option the choice does not
  //     list or more picks than it has left, PREREQUISITE_UNMET for an option that
  //     asks for what the sheet lacks, CHOICES_MISSING for a text a pick needs and
  //     lacks (the humanoid favored enemy's two races); or with a CharacterBlocked
  //     detail: CHARACTER_DEAD.
  rpc CompleteCharacterChoices(CompleteCharacterChoicesRequest) returns (CompleteCharacterChoicesResponse);

  // GetCampaignOpenChoices lists the player characters of the campaign that have
  // choices still open, with a label for each, for the master's warning before a
  // session starts (the sheets lock then). Only the master's.
  //
  // Errors:
  //   - `not_found`: the caller is not the campaign's master, whether the campaign
  //     exists or not: a player and a stranger learn nothing.
  rpc GetCampaignOpenChoices(GetCampaignOpenChoicesRequest) returns (GetCampaignOpenChoicesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RollLevelUpHitPoints rolls the hit die of the class's next level, on the
  // server, and keeps the result for this character, class and level:
  // calling it again returns the same roll (it is not a reroll), so the
  // result stays on record (RN-18). LevelUpCharacter takes it back with the
  // method ROLLED_IN_APP. A roll that was never used (the player left the
  // flow) is still there when they come back.
  //
  // Only the owning player may call it: the master keeps the editor.
  //
  // Errors:
  //   - `not_found`: the character is not in this campaign, or the caller may
  //     not see it.
  //   - `permission_denied`: the caller is the master.
  //   - `failed_precondition`: the character cannot level up now (a
  //     CharacterBlocked detail with CANNOT_LEVEL_UP, CHARACTER_DEAD or
  //     AWAITING_APPROVAL), or the campaign makes everybody roll physical dice
  //     (a CharacterBlocked detail with DICE_FORCED_PHYSICAL).
  //   - `invalid_argument`: idempotency_key is not a UUID, or class_key is not
  //     a class of the character.
  rpc RollLevelUpHitPoints(RollLevelUpHitPointsRequest) returns (RollLevelUpHitPointsResponse);

  // LevelUpCharacter takes the character up a level with the player's choices
  // (MR-040, RN-01's exception, RN-12). It works on a locked sheet: the
  // server builds the new sheet from the stored one and the choices (the
  // client never sends the whole sheet), refuses everything the level does
  // not allow, and saves it all at once, keeping the record of the level-up
  // for the master (ListLevelUps). The rest of the sheet stays locked.
  //
  // What it does not cover, the master does in the sheet editor
  // (UpdateCharacter): the features listed in LevelUpOptions.master_adds
  // (Mystic Arcanum, Spell Mastery, Signature Spells, Additional Magical
  // Secrets, favored enemies and terrains); swapping a spell known for
  // another, which the SRD lets Bards, Rangers, Sorcerers and Warlocks do when
  // they level up (a level-up only adds spells, never removes one); and
  // custom subclasses. A class the character does not have is multiclassing
  // (SRD 5.1, "Multiclassing"): LevelUpChoices.class_key names it, and it joins the
  // sheet at level 1 if the character meets the prerequisites.
  //
  // Who may call it: only the owning player, and only while
  // Character.can_level_up is true. The master keeps the sheet editor
  // (UpdateCharacter). Afterwards can_level_up goes away by itself: the
  // milestone mark's level has passed, or the XP does not reach the next level.
  // Every session stream of the campaign gets `xp_changed`
  // (WatchGameSessionResponse), so the sheets and the master's list read
  // again.
  //
  // Errors:
  //   - `not_found`: the character is not in this campaign, or the caller may
  //     not see it.
  //   - `permission_denied`: the caller is the master.
  //   - `invalid_argument`: a choice is malformed (an unknown content key, a
  //     list too long, no hit points method, a typed value that is not a
  //     number).
  //   - `aborted`: revision is not the character's current one (the master
  //     changed the sheet, or an XP award came in); read it and try again.
  //   - `failed_precondition`, with one of two details:
  //     - CharacterBlocked: CANNOT_LEVEL_UP, CHARACTER_DEAD,
  //       AWAITING_APPROVAL, or DICE_FORCED_IN_APP (a typed die result in a
  //       campaign where everybody rolls in the app);
  //     - LevelUpRefusal: the choices break a rule of the level (the field
  //       and a reason code), or the in-app roll was never made.
  //
  // A character whose current hit points are set gains the same amount the
  // maximum gained (RN-12), so a wound stays a wound; one whose hit points were
  // never set stays full.
  rpc LevelUpCharacter(LevelUpCharacterRequest) returns (LevelUpCharacterResponse);

  // ListLevelUps lists the level-ups of the campaign, newest first, a page
  // at a time (page_size up to 50, page_token): the master's "O que mudou"
  // (MR-040). Each carries what the player
  // chose and when. With character_id, only that character's. The master is
  // told by the stream (`xp_changed`) and reads here; there is no approval
  // and no veto: the master can still edit the sheet as always.
  //
  // Only the master may call it.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a
  //     member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: page_size is not 1 to 50, or page_token is not one
  //     this list gave.
  rpc ListLevelUps(ListLevelUpsRequest) returns (ListLevelUpsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListCharacterCreatures lists a character's creatures that are still with
  // it (MR-037): its familiar, the animals and undead it summoned that
  // the table has not dismissed, the creatures the master gave. They live
  // from one session to the next until the player or the master dismisses
  // them (the app does not count a spell's duration). Each is a kind of
  // creature from the SRD (monster_key; the stat block is
  // ContentService.GetCreature), a name, where it came from, what it may do on
  // its own and its hit points, which the master corrects (RN-02) and a combat
  // writes back when it ends.
  //
  // The master reads any character's, and the player their own character's;
  // another player's creatures, and with them their hit points, are
  // `not_found` for everyone else, as the character itself is (RN-20).
  //
  // Errors:
  //   - `not_found`: the campaign or the character does not exist, or the
  //     caller may not see the character (or character_id is not a UUID).
  //   - `invalid_argument`: the character is an NPC (only a player's character
  //     has creatures).
  rpc ListCharacterCreatures(ListCharacterCreaturesRequest) returns (ListCharacterCreaturesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListWildShapeForms lists the beasts a druid's Wild Shape allows now
  // (MR-037): the SRD beasts of the challenge rating, without the fly
  // or swim speed, that the character's Wild Shape features give at its level
  // (level 2: up to 1/4, no fly or swim; 4: up to 1/2, no fly; 8: up to 1),
  // sorted by Portuguese name. Empty for a character without Wild Shape. The
  // stat blocks are ContentService.GetCreature; AssumeWildShape
  // (meurpg.play.v1.PlayService) takes one of these.
  //
  // The master reads any character's and the player their own; for everyone
  // else the character is `not_found`, as always.
  //
  // Errors:
  //   - `not_found`: the campaign or the character does not exist, or the
  //     caller may not see the character (or character_id is not a UUID).
  //   - `invalid_argument`: the character is an NPC.
  rpc ListWildShapeForms(ListWildShapeFormsRequest) returns (ListWildShapeFormsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // GiveCreature gives a character a creature (MR-037): any SRD creature, for a
  // hireling, a pet or a house rule, whatever the character's class. The
  // creature starts at full hit points, acts as any creature in a combat
  // (`CREATURE_ATTACK_FULL`) and has source `CREATURE_SOURCE_MASTER`. A
  // character has at most 40 creatures at a time. Only the master may call it.
  // A `creature_summoned` event goes to the history while a session is open.
  //
  // The owner's player and the master get `creatures_changed`; a creature
  // given during a combat does not join it: the master adds it with the
  // combat's own tools after the combat, or the next combat takes it.
  //
  // Errors:
  //   - `not_found`: the campaign or the character does not exist, or the
  //     caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: the character is an NPC or is dead, monster_key is
  //     not an SRD creature, or name is not 1 to 40 characters on one line.
  //   - `failed_precondition` (CharacterBlocked): CREATURE_LIMIT.
  //
  // Safe to retry when the request carries an idempotency_key: a second call with the same key and
  // the same request returns what the first one made and makes nothing; the same key with another
  // request is `invalid_argument`. Without a key the call is not deduplicated.
  rpc GiveCreature(GiveCreatureRequest) returns (GiveCreatureResponse);

  // RenameCreature changes a creature's name. The character's player and the
  // master may. The name is free text by a player: 1 to 40 characters on one
  // line.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist or the caller is not a member
  //     of it, or the creature is not one the caller may see (another
  //     player's, dismissed, or not a UUID).
  //   - `invalid_argument`: name is not 1 to 40 characters on one line.
  rpc RenameCreature(RenameCreatureRequest) returns (RenameCreatureResponse);

  // DismissCreature sends a creature away ("Dispensar"): it leaves the
  // character's list and any combat it is in, and a `creature_dismissed` event
  // goes to the history while a session is open. The character's player and the
  // master may. Dismissing a creature that is gone already changes nothing.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist or the caller is not a member
  //     of it, or the creature is not one the caller may see (another player's,
  //     or not a UUID).
  rpc DismissCreature(DismissCreatureRequest) returns (DismissCreatureResponse);

  // AdjustCreatureHitPoints is the master's correction of a creature's hit
  // points outside a combat (RN-02): damage, healing, or the number itself.
  // Only the master may call it. A creature taken to 0 is dismissed. In a
  // combat the master uses CombatService.AdjustCombatantHitPoints instead.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist or the caller is not a member
  //     of it, or the creature does not exist.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: no change is set, or a value is outside 0 to its
  //     maximum (damage and heal: 0 to 9999).
  //   - `failed_precondition` (CharacterBlocked): CREATURE_IN_COMBAT.
  rpc AdjustCreatureHitPoints(AdjustCreatureHitPointsRequest) returns (AdjustCreatureHitPointsResponse);

  // GetSummonOptions says what a character can summon from its sheet (MR-037),
  // for the "Criaturas" panel's casting sheet: the summoning spells
  // it can cast (Convocar Familiar, Animar Mortos, Conjurar Animais), how
  // (as a ritual, with a slot, or both), what each one may bring at each circle
  // it can use, the slots it has, and what a casting would send away. The
  // server works all of it out (the spell on the sheet, prepared or in the
  // spellbook, the Pact of the Chain, the slot's circle and counts), so the app
  // keeps no copy of these rules; `PlayService.CastSummon` still checks every
  // choice. Spells the character cannot cast are not listed. A character with
  // no full sheet lists nothing.
  //
  // The owner's player and the master read it; another player gets `not_found`,
  // as for ListCharacterCreatures (RN-20). It carries no hit points.
  //
  // Errors:
  //   - `not_found`: the campaign or the character does not exist, or the
  //     caller may not see the character (or character_id is not a UUID).
  //   - `invalid_argument`: the character is an NPC (only a player's character
  //     has creatures).
  rpc GetSummonOptions(GetSummonOptionsRequest) returns (GetSummonOptionsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// CharacterKind is what a character is for. The kind never changes after
// the character is created.
enum CharacterKind {
  CHARACTER_KIND_UNSPECIFIED = 0;
  // A player's character ("personagem do jogador"). Full sheet.
  CHARACTER_KIND_PLAYER = 1;
  // An enemy NPC ("inimigo"). Full sheet.
  CHARACTER_KIND_ENEMY = 2;
  // A boss NPC ("boss"). Full sheet.
  CHARACTER_KIND_BOSS = 3;
  // A minion NPC ("minion"): a weak enemy. Basic sheet.
  CHARACTER_KIND_MINION = 4;
  // A story NPC ("NPC de história"): someone the group meets. Basic sheet.
  CHARACTER_KIND_STORY = 5;
}

// CharacterState is where a character is in its life cycle
// (docs/product/rules.md#character-lifecycle). The server computes it
// on every read.
//
// NPCs are always DRAFT: they never lock and never die, so the app shows no
// state for them.
enum CharacterState {
  CHARACTER_STATE_UNSPECIFIED = 0;
  // "Rascunho": no game session has started since the character was
  // created, so its player edits the whole sheet.
  CHARACTER_STATE_DRAFT = 1;
  // "Travada": a game session started after the character was created
  // (RN-01). Only the master edits the sheet; the player edits the story
  // only while the master allows it (SetStoryEditing).
  CHARACTER_STATE_LOCKED = 2;
  // "Morto": the master marked the character dead (RN-03). It stays in the
  // campaign; only the master edits its sheet.
  CHARACTER_STATE_DEAD = 3;
  // "Pendente de aprovação" (RN-15, MR-024): created by a pending member,
  // who joined through an invite that requires approval. The player edits
  // the whole sheet and the story, but the character is not part of the
  // campaign yet: a game session does not lock it, and it cannot die. The
  // master's ApproveCharacter makes it a DRAFT; RejectCharacter deletes it.
  CHARACTER_STATE_PENDING = 4;
}

// Character is a character as its reader may see it. It never carries the
// master's notes (RN-11).
message Character {
  // Stable character ID (a UUID).
  string id = 1;
  // The campaign the character belongs to (a UUID).
  string campaign_id = 2;
  CharacterKind kind = 3;
  CharacterState state = 4;
  // The character's name.
  string name = 5;
  // The account ID (a UUID) of the player who owns the character. Empty for
  // NPCs, and for a player character whose player deleted their account: it
  // stays with the campaign (RN-16).
  string player_user_id = 6;
  // The display name of that player (IdentityService.UpdateProfile). Empty
  // when player_user_id is empty or the player has not chosen one.
  string player_display_name = 7;
  // The game data: full or basic, depending on the kind.
  CharacterSheet sheet = 8;
  // The descriptive text. It has its own lock: see UpdateCharacterStory.
  CharacterStory story = 9;
  // The numbers the server derives from a full sheet (MR-004). Unset for a
  // basic sheet.
  meurpg.rules.v1.DerivedSheet derived = 10;
  // Goes up by one every time the name, the sheet or the story change.
  // Send it back in UpdateCharacter and UpdateCharacterStory. Locking and
  // death do not change it: they have their own times below.
  int32 revision = 11;
  // When the sheet locked for the player (RN-01). Unset while it is a
  // draft, and always unset for NPCs.
  google.protobuf.Timestamp sheet_locked_at = 12;
  // When the master marked the character dead. Unset while it lives.
  google.protobuf.Timestamp died_at = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  // Whether the caller may call UpdateCharacter now: always for the master;
  // for the owning player, only while the state is DRAFT or PENDING.
  bool can_edit = 16;
  // Whether the caller may call UpdateCharacterStory now: always for the
  // master; for the owning player, while the state is DRAFT or PENDING, or
  // while story_editing_allowed is true.
  bool can_edit_story = 17;
  // Whether the caller may call MarkCharacterDead: the master, for a player
  // character that is not dead yet.
  bool can_mark_dead = 18;
  // Whether the caller may call GetMasterNotes and UpdateMasterNotes: the
  // master.
  bool can_access_master_notes = 19;
  // Whether the master currently lets the owning player edit the story of
  // this locked or dead character (SetStoryEditing). Always false for NPCs.
  bool story_editing_allowed = 20;
  // Whether the caller may call SetStoryEditing: the master, for a player
  // character.
  bool can_set_story_editing = 21;
  // Whether the caller may call ApproveCharacter and RejectCharacter now:
  // the master, for a PENDING character (MR-024).
  bool can_approve = 22;
  // Whether the character can go up a level now (RN-12, MR-016): its XP
  // reached the next level's, or the master marked a milestone and its level
  // on the sheet has not gone up since. Only the master and the owning player
  // get it; always false for anyone else, for NPCs, for a dead character and
  // at level 20. The tag goes away when the level goes up. The owning player
  // goes up with the guided level-up (GetLevelUpOptions, LevelUpCharacter),
  // even on a locked sheet; the master raises the level in the sheet editor
  // (UpdateCharacter).
  bool can_level_up = 23;
  // Why can_level_up is true: XP, or a MILESTONE. Unspecified when it is
  // false.
  LevelUpReason level_up_reason = 24;
  // Whether the character is reserved: a player character the master made for a
  // player to claim (ClaimCharacter), with no owner yet. A reserved character is
  // invisible to every player, in every read and every stream event, until it is
  // claimed (RN-10); only the master reads it. `player_user_id` is empty while it
  // is reserved.
  bool reserved = 25;
  // Where the master's review of a PENDING character stands, with his reason
  // (RequestCharacterChanges). Only the master and the owning player get it;
  // unset for everyone else, for NPCs and for a character that is not PENDING.
  CharacterReview review = 26;
  // Whether the caller may call RequestCharacterChanges now: the master, for a
  // PENDING character.
  bool can_request_changes = 27;
  // Whether the caller may call ResubmitCharacter now: the owning player, for a
  // PENDING character whose review is CHANGES_REQUESTED.
  bool can_resubmit = 28;
  // Whether the caller may call ReviveCharacter now (the master, for a dead player
  // character). It does not look at RN-03: the call says LIVING_CHARACTER_EXISTS.
  bool can_revive = 29;
  // When the master last revived the character (ReviveCharacter, or Revivify).
  // Only the master and the owning player get it; unset if it never was.
  google.protobuf.Timestamp revived_at = 30;
  // The combat round in which the master confirmed the death, and the combat
  // (a UUID). Unset when the death was marked outside a combat. Only the master
  // and the owning player; while the character is dead.
  optional int32 death_round = 31;
  string death_encounter_id = 32;
  // The master's switch "Revivificar não funciona nesta morte" (old age, missing
  // body parts: SRD 5.1, Revivify). While it is on, the character is not offered
  // as a target of the spell. Only the master gets it: a player never reads why a
  // creature cannot be revived (RN-10).
  bool revivify_blocked = 33;
}

// Review is where the master's review of a character that waits for approval
// stands (RN-15). The state of the character itself stays PENDING in all of them.
enum Review {
  REVIEW_UNSPECIFIED = 0;
  // Nothing was asked: the master has not looked at it, or looked and asked for
  // nothing.
  REVIEW_AWAITING = 1;
  // The master asked for changes (RequestCharacterChanges) and the player has not
  // sent the sheet again.
  REVIEW_CHANGES_REQUESTED = 2;
  // The player sent the sheet again (ResubmitCharacter).
  REVIEW_RESUBMITTED = 3;
}

// CharacterReview is the master's request for changes and where it stands. It is
// personal data: only the master and the owning player read it, and the server
// deletes it when the character is approved, rejected or deleted, when the player
// leaves or deletes their account and when the campaign is deleted.
message CharacterReview {
  Review status = 1;
  // What the master asked, 1 to 500 characters. Empty in REVIEW_AWAITING.
  string reason = 2;
  // When he asked (the last time, if he asked more than once). Unset in
  // REVIEW_AWAITING.
  google.protobuf.Timestamp requested_at = 3;
  // When the player sent the sheet again. Unset until REVIEW_RESUBMITTED.
  google.protobuf.Timestamp resubmitted_at = 4;
}

// LevelUpReason is why a character can go up a level.
enum LevelUpReason {
  LEVEL_UP_REASON_UNSPECIFIED = 0;
  // The sheet's XP reached the next level's XP (Character.derived.next_level_xp).
  LEVEL_UP_REASON_XP = 1;
  // The master marked a milestone (ProgressionService.MarkMilestone).
  LEVEL_UP_REASON_MILESTONE = 2;
}

// CharacterSummary is a character as a list shows it: no sheet, no story.
message CharacterSummary {
  // Stable character ID (a UUID).
  string id = 1;
  CharacterKind kind = 2;
  CharacterState state = 3;
  string name = 4;
  // As in Character.
  string player_user_id = 5;
  // As in Character.
  string player_display_name = 6;
  // Classes and levels in Portuguese, such as "Mago 3" or
  // "Guerreiro 2 / Mago 1". Empty for a basic sheet.
  string class_summary = 7;
  // The subrace's Portuguese name if the sheet has one, otherwise the
  // race's, such as "Gnomo das Rochas". Empty for a basic sheet.
  string race_name_pt = 8;
  google.protobuf.Timestamp created_at = 9;
  // An NPC's portrait as a URL ("/images/<id>"; "/images/<id>/thumb" is its
  // thumbnail), as Combatant.portrait_url, or empty for none and for a
  // player's character. Only the master lists NPCs, so only the master gets
  // it (MR-031): the app draws "Pôr em cena" with it, with no read of each
  // sheet.
  string portrait_url = 10;
  // The choices this player character's sheet still lacks (skills, cantrips and
  // spells), each with how many are missing. Only the master gets it, and only
  // for a living player character whose sheet is not locked yet, which is the
  // one that starting a game session locks (RN-01); empty otherwise, and for a
  // complete sheet.
  repeated OpenChoice open_choices = 11;
  // Whether the character is reserved (Character.reserved). Only the master's
  // list holds a reserved character, so only the master reads true.
  bool reserved = 12;
  // The state of the character's claim link, for the master's list of reserved
  // characters. UNSPECIFIED for everyone else, for an NPC and for a character
  // that was never reserved.
  ClaimState claim_state = 13;
  // When the link stops working: set for SENT and EXPIRED.
  google.protobuf.Timestamp claim_expires_at = 14;
  // For USED: the display name of the player who claimed the character (empty if
  // they have none, or deleted the account).
  string claimed_by_display_name = 15;

  // How many selections of the character's choices are still open (a Fighting Style,
  // an invocation...). Set only for the master and the owning player, never 0 for
  // anyone else: for another player it is unset, because how many choices a
  // character lacks is not their information (RN-10).
  optional int32 pending_choice_count = 16;
  // Where the master's review of a PENDING character stands (Character.review), without
  // the reason: REVIEW_AWAITING, REVIEW_CHANGES_REQUESTED or REVIEW_RESUBMITTED, so the
  // list can say "Ajustes pedidos". Only the master and the owning player get it;
  // unspecified for any other character and for anyone else.
  Review review_status = 17;
}

// OpenChoiceKind is what a sheet has not picked yet.
enum OpenChoiceKind {
  OPEN_CHOICE_KIND_UNSPECIFIED = 0;
  // Skills the class gives.
  OPEN_CHOICE_KIND_SKILLS = 1;
  // Cantrips the class knows.
  OPEN_CHOICE_KIND_CANTRIPS = 2;
  // Spells a caster that learns a fixed number knows.
  OPEN_CHOICE_KIND_SPELLS_KNOWN = 3;
  // Spells a caster that prepares spells prepares.
  OPEN_CHOICE_KIND_SPELLS_PREPARED = 4;
  // Skills still to double with Expertise (the rogue's and the bard's).
  OPEN_CHOICE_KIND_EXPERTISE = 5;
  // Tool proficiencies a trait lets the player pick (the dwarf's), not yet listed on the sheet.
  OPEN_CHOICE_KIND_TOOLS = 6;
  // Languages the race, a trait or the background let the player pick, not yet listed on the sheet.
  OPEN_CHOICE_KIND_LANGUAGES = 7;
}

// OpenChoice is a choice a sheet has not made yet.
message OpenChoice {
  OpenChoiceKind kind = 1;
  // How many picks are left, at least 1.
  int32 missing = 2;
}

// ClaimState is where a reserved character's claim link stands (the master's
// list). A character the player claimed keeps USED while the player owns it; a
// character the master gave back to the reserve starts with NONE again.
enum ClaimState {
  CLAIM_STATE_UNSPECIFIED = 0;
  // No link was made, or the character went back to the reserve.
  CLAIM_STATE_NONE = 1;
  // A link works until `claim_expires_at`.
  CLAIM_STATE_SENT = 2;
  // The link ran out before anyone used it.
  CLAIM_STATE_EXPIRED = 3;
  // The master revoked the link.
  CLAIM_STATE_REVOKED = 4;
  // A player claimed the character through the link.
  CLAIM_STATE_USED = 5;
}

// CharacterBlockedReason says why a character cannot be changed now.
enum CharacterBlockedReason {
  CHARACTER_BLOCKED_REASON_UNSPECIFIED = 0;
  // The sheet is locked for the player: a game session has started
  // (RN-01). Only the master edits it now.
  CHARACTER_BLOCKED_REASON_SHEET_LOCKED = 1;
  // The character is dead (RN-03). Only the master edits its sheet.
  CHARACTER_BLOCKED_REASON_CHARACTER_DEAD = 2;
  // The player already has a living character in this campaign (RN-03).
  // They create a new one only after it dies.
  CHARACTER_BLOCKED_REASON_LIVING_CHARACTER_EXISTS = 3;
  // The character is no longer a draft, and the master has not allowed its
  // player to edit the story (SetStoryEditing).
  CHARACTER_BLOCKED_REASON_STORY_LOCKED = 4;
  // RejectCharacter on a character that does not wait for approval (MR-024):
  // once approved, a character stays in the campaign.
  CHARACTER_BLOCKED_REASON_NOT_PENDING = 5;
  // MarkCharacterDead on a character that still waits for the master's
  // approval (MR-024): approve or reject it instead.
  CHARACTER_BLOCKED_REASON_AWAITING_APPROVAL = 6;
  // A guided level-up call (GetLevelUpOptions, PreviewLevelUp,
  // RollLevelUpHitPoints, LevelUpCharacter) on a character that cannot level
  // up now (can_level_up is false): not marked for a milestone, or too little
  // XP, or at level 20, or an NPC.
  CHARACTER_BLOCKED_REASON_CANNOT_LEVEL_UP = 7;
  // RollLevelUpHitPoints in a campaign where everybody rolls physical dice
  // (RN-18): type the result of the real die instead (LevelUpCharacter with
  // ROLLED_PHYSICAL).
  CHARACTER_BLOCKED_REASON_DICE_FORCED_PHYSICAL = 8;
  // LevelUpCharacter with ROLLED_PHYSICAL in a campaign where everybody rolls
  // in the app (RN-18): use RollLevelUpHitPoints.
  CHARACTER_BLOCKED_REASON_DICE_FORCED_IN_APP = 9;
  // AdjustCreatureHitPoints on a creature that is in a combat that is not
  // ended: the hit points are the combatant's now (AdjustCombatantHitPoints).
  CHARACTER_BLOCKED_REASON_CREATURE_IN_COMBAT = 10;
  // GiveCreature, or a summon, for a character that has 40 creatures already.
  CHARACTER_BLOCKED_REASON_CREATURE_LIMIT = 11;
  // RollLevelUpHitPoints in a campaign whose rule is that everybody takes the
  // average (RN-24, HIT_POINTS_RULE_AVERAGE).
  CHARACTER_BLOCKED_REASON_HIT_POINTS_AVERAGE_ONLY = 12;
  // CreateCharacter or UpdateCharacter picks a table entry the master archived
  // (RN-23): `content_key` says which. A sheet that already has it keeps it; only
  // a new choice is refused.
  CHARACTER_BLOCKED_REASON_ARCHIVED_CONTENT = 13;
  // A sheet that uses the table's own content ("...@mesa") cannot go to another
  // campaign (ADR-0018, section 10; the copy of MR-021 and the reuse of NPCs in
  // MR-022): `content_key` is one of the keys.
  CHARACTER_BLOCKED_REASON_TABLE_CONTENT_STAYS = 14;
  // CreateCharacter or UpdateCharacter by a player picks an option the master
  // switched off in "Opções para os jogadores" (RN-23), or the subclass of an off
  // class or the subrace of an off race when the sheet lacks that class or race:
  // `content_key` says which. A sheet that already has it keeps it, and one that
  // has an off class or race may still pick its subclass or subrace (the child's
  // own switch decides); only a new choice is refused. The master is not refused:
  // the switch hides an option from the players, not from any sheet the master
  // edits (an NPC, or a player's sheet, which then keeps the option).
  CHARACTER_BLOCKED_REASON_SWITCHED_OFF_CONTENT = 15;
  // CreateClaimLink, RevokeClaimLink or DeleteReservedCharacter on a character
  // that is not reserved (it has an owner): the master gives a claimed character
  // back to the reserve first (ReturnCharacterToReserve).
  CHARACTER_BLOCKED_REASON_NOT_RESERVED = 16;
  // RevokeClaimLink on a link a player used already, maybe a moment before (the
  // two race for the same row, and one wins): `player_display_name` says who.
  CHARACTER_BLOCKED_REASON_CLAIM_LINK_USED = 17;
  // ReturnCharacterToReserve on a character no link brought to its player (one
  // the player made, or one that is reserved already), or one that is dead.
  CHARACTER_BLOCKED_REASON_NOT_CLAIMED = 18;
  // ReturnCharacterToReserve on a character that is a combatant of the open
  // combat: the master ends the combat first.
  CHARACTER_BLOCKED_REASON_CHARACTER_IN_COMBAT = 19;
  // ClaimCharacter by the master of the campaign, who owns the link: it is
  // for a player.
  CHARACTER_BLOCKED_REASON_CLAIM_OWN_LINK = 20;
  // MarkCharacterDead or SetStoryEditing on a reserved character: it has no
  // player yet, so there is nothing of a player's to change.
  CHARACTER_BLOCKED_REASON_RESERVED = 21;
  // ResubmitCharacter on a character that has no open request for changes: the
  // master asked nothing, or the player already sent the sheet again.
  CHARACTER_BLOCKED_REASON_NO_CHANGES_REQUESTED = 22;
  // ReviveCharacter on a character that is not dead.
  CHARACTER_BLOCKED_REASON_NOT_DEAD = 23;
}

// CharacterBlocked is the error detail of CharacterService's
// `failed_precondition`, so the app can show a clear message.
message CharacterBlocked {
  CharacterBlockedReason reason = 1;
  // The character that blocks the call: the one being edited, or, for
  // LIVING_CHARACTER_EXISTS, the player's living character, so the app can
  // link to it.
  string character_id = 2;
  // For ARCHIVED_CONTENT, SWITCHED_OFF_CONTENT and TABLE_CONTENT_STAYS, the content key that
  // blocks the call; empty otherwise.
  string content_key = 3;
  // For CLAIM_LINK_USED, the display name of the player who used the link.
  string player_display_name = 4;
  // For LIVING_CHARACTER_EXISTS on ClaimCharacter, the name of the player's living
  // character (character_id is its ID), so the app can name it.
  string character_name = 5;
  // For LIVING_CHARACTER_EXISTS on ClaimCharacter, the campaign the claim is for (the
  // living character's too), so the app can link to that character's sheet.
  string campaign_id = 6;
  // For LIVING_CHARACTER_EXISTS on ReviveCharacter: the name of that living
  // character (character_id is its id), so the master reads "Davi já tem outro
  // personagem vivo: Nuvem". Empty otherwise.
  string living_character_name = 7;
}

// InvalidField is the error detail of CharacterService's `invalid_argument` for a
// request field that breaks its rules, so the app can say which field without
// reading the message. `field` is the request field's name ("name",
// "idempotency_key", "creature_key", "kind"...), or a path inside the sheet
// ("sheet.basic.armor_class").
message InvalidField {
  string field = 1;
}

// CharacterSheet is a character's game data: a full sheet for PLAYER, ENEMY
// and BOSS, a basic sheet for MINION and STORY.
message CharacterSheet {
  // Exactly one must be set, and it must match the kind.
  oneof content {
    FullSheet full = 1;
    BasicSheet basic = 2;
  }
}

// FullSheet holds a character's choices, in the layout of the official
// sheet (MR-004). It holds choices, never computed numbers: the server
// derives those (rules.v1.DerivedSheet). Rules content is referenced by
// content key (see ContentService.ListContent), never by name.
//
// The server checks only what cannot make sense at all: ranges, existing
// keys, a subrace of another race. Choices the rules would not allow, such
// as too many skills, are saved and reported in DerivedSheet.issues: the
// app is an assistant, not a judge.
message FullSheet {
  // Base ability scores, before any bonus: each 1 to 30, all six required.
  meurpg.rules.v1.AbilityScores base_scores = 1;
  // Content key of the race. Required.
  string race_key = 2;
  // Content key of a subrace of race_key, or empty.
  string subrace_key = 3;
  // The character's classes: 1 to 12 entries, no class twice, levels adding
  // up to 1 to 20. The first one is the starting class, which gives the
  // saving throws. A sheet may be made multiclassed from the start (a new
  // character that joins at the group's level, Mage 3 and Cleric 1): each class
  // takes its own subclass, the table's included, once its level reaches the
  // class's subclass level. CreateCharacter accepts it: the SRD's multiclass
  // prerequisites of every class (the first too) are issues of the sheet, never a
  // refusal; the hit points follow the table's rule over the levels after the
  // first of all the classes together; and the spell slots follow the multiclass
  // spellcaster table (a third caster's subclass counts a third of its levels).
  repeated ClassLevel classes = 4;
  // The background. Unset while none is chosen, which shows an issue.
  oneof background {
    // Content key of a background.
    string background_key = 5;
    // A background that is not in the rules content, described by the
    // player.
    CustomBackground custom_background = 6;
  }
  // Skills the player chose: the class's skill choices and any others the
  // table allows. At most 18 skill keys, no repeats. The skills the race or
  // background grant are added by the server; listing them here too is
  // harmless.
  repeated string skill_proficiency_keys = 7;
  // Skills with expertise, which doubles the proficiency bonus (Bard,
  // Rogue). At most 18 skill keys, no repeats. A skill here that is not
  // proficient shows an issue.
  repeated string expertise_skill_keys = 8;
  // Bonuses added by hand on top of the race's and subrace's fixed ones,
  // such as the increases a race lets the player choose (the Half-Elf's two
  // +1), an ability score improvement or a magic item: each -10 to +10.
  // Unset means no bonus.
  meurpg.rules.v1.AbilityScores extra_ability_bonuses = 9;
  // How the hit points grow with each level.
  HitPoints hit_points = 10;
  // Content key of the body armor worn, or empty for none.
  string armor_key = 11;
  // Whether the character carries a shield.
  bool shield = 12;
  // Content keys of the weapons carried, which become attacks: at most 20,
  // no repeats.
  repeated string weapon_keys = 13;
  // Content keys of the cantrips (level 0 spells) known: at most 30, no
  // repeats.
  repeated string cantrip_keys = 14;
  // Content keys of the spells known (levels 1 to 9): the spellbook of a
  // Wizard, or the spells of a Bard, Ranger, Sorcerer or Warlock. At most
  // 200, no repeats.
  repeated string known_spell_keys = 15;
  // Content keys of the spells prepared for the day (levels 1 to 9), for a
  // Cleric, Druid, Paladin or Wizard. At most 100, no repeats.
  repeated string prepared_spell_keys = 16;
  // Equipment and treasure as free text: at most 100 items.
  repeated Item equipment = 17;
  Coins coins = 18;
  // Languages the player adds, as free text: the ones the master adds beyond
  // the race's and the picks. The languages a race, a trait or a background
  // lets the player pick are choices (feature_choice_keys, written
  // "<owner key>#language=<language key>"), and DerivedSheet.languages lists
  // the race's, the picks and these. A sheet from before the picks answers
  // the ones it is owed with what is written here. At most 20, each 1 to 40
  // characters, one line.
  repeated string languages = 19;
  // Tool proficiencies the player adds, as free text. The tools a trait,
  // background or feature lets the player pick are choices
  // (feature_choice_keys, written "<owner key>#tool=<proficiency key>"); the
  // sheet's proficiencies list them with these. A sheet from before the picks
  // answers the ones it is owed with what is written here. At most 20, each 1
  // to 40 characters, one line.
  repeated string tool_proficiencies = 20;
  // Experience points: 0 to 1,000,000. The master's XP awards add to it, even
  // after the sheet locked (ProgressionService.AwardXP; RN-01 stops the
  // player, not the master's gift).
  int32 experience_points = 21;
  Alignment alignment = 22;
  // Features and traits the rules content does not have, in the player's
  // own words, such as those of a subclass from another book. 0 to 5,000
  // characters, multi-line. Part of the game data: it locks with the sheet.
  string custom_features_text = 23;
  // Options chosen for features and traits that offer them, as content
  // keys: a fighting style ("feature:fighter-fighting-style-defense"), a
  // dragon ancestry ("trait:draconic-ancestry-red"), an eldritch
  // invocation, a metamagic. An option applies only while the character
  // has the feature or trait it belongs to; otherwise it shows as an issue.
  // At most 100.
  //
  // A pick that is not a feature or a trait is written "<choice key>=<value key>":
  // the favored enemy's type and language ("feature:favored-enemy-1-type=creature-type:giant"),
  // a terrain ("...=terrain:forest"), the half-elf's abilities
  // ("race:half-elf#abilities=ability:dex") and the spells a feature grants
  // ("feature:pact-of-the-tome#cantrips=spell:guidance"). A feat of the player's choice
  // (a `choice` effect with choice "feat" on a trait, feature, background or feat) is
  // "<owner key>#feat=<feat key>" ("trait:talento@mesa#feat=feat:grappler"); it applies like
  // a feat in feat_keys for as long as the owner is on the sheet, and is never also in
  // feat_keys. Which choice asks for it,
  // and the exact string to store, come from PreviewChoices (ChoiceOption.stored_key).
  repeated string feature_choice_keys = 24;
  // The challenge rating ("ND") of an enemy or a boss: "0", "1/8", "1/4",
  // "1/2" or "1" to "30" (the SRD's list, in ContentService.ListContent), or
  // empty for none. Only the master's NPCs have one: a player character's
  // sheet with a rating is `invalid_argument`. The server stores it as sent;
  // the editor fills xp_value from it (MR-016).
  string challenge_rating = 25;
  // The XP the NPC gives when it is defeated ("XP ao derrotar"): 0 to
  // 1,000,000. The master's own number, usually the one that goes with the
  // challenge rating. A player character's sheet with a value above 0 is
  // `invalid_argument`. It never reaches a player (RN-20); the end-of-combat
  // XP adds the defeated NPCs' values (ProgressionService.AwardXP).
  int32 xp_value = 26;
  // The NPC's portrait: an image of the campaign's gallery (a UUID, MR-031),
  // shown on its card and, while the master has it on the stage, to the whole
  // table. Empty for none (the app draws the initials). An image of another
  // campaign, or one that does not exist, is `invalid_argument`, and so is a
  // value on a player's character. The server keeps it as sent; deleting the
  // gallery image clears it.
  string portrait_image_id = 27;
  // How the base scores were made (RN-24), kept by the server: set by
  // CreateCharacter from `ability_method` for a player's sheet, and never taken
  // from the client afterwards (a value sent in CreateCharacter or UpdateCharacter is
  // ignored). While the sheet is the player's draft, a player's UpdateCharacter
  // that changes the base scores is checked against it. Unset for NPCs, for
  // sheets made before the rules and for an unspecified `ability_method`.
  AbilityOrigin ability_origin = 28;
  // The campaign's content revision (the table's own content, RN-23) of the rules
  // content this sheet was last saved with. The server sets it on every save and
  // ignores what the client sends. A table entry that changed after it, and that
  // gave the sheet a new issue since, shows "A classe mudou"
  // (DerivedSheet.changed_content). 0 when the table had no content.
  int32 content_revision = 29;
  // The issues the sheet had when it was last saved ("code|field|message" of each,
  // sorted), set by the server and ignored from the client: what "A classe mudou"
  // compares against, so an issue the sheet already had is never blamed on a change.
  // An issue that was flagged and still stands is left out, so a save never clears
  // it; only fixing what it says does.
  repeated string known_issues = 30;
  // For each table entry the sheet is still flagged for (a changed entry with an
  // unresolved issue tied to it), the content revision the sheet was last known to
  // fit it at. Set by the server and ignored from the client; an entry not here
  // uses `content_revision`.
  map<string, int32> content_baselines = 31;
  // The feats the character took (MR-025), as content keys: "feat:grappler" or a
  // table's "feat:<slug>@mesa". Feats are an optional rule of the game (the
  // table's rule "Talentos"): a feat is taken in place of an Ability Score
  // Improvement by the guided level-up, or by the master in the sheet editor. A feat
  // applies like a feature: its effects reach the derived sheet and the sheet lists
  // it with the features. The abilities a feat raises are in extra_ability_bonuses.
  // A feat a race, background or feature grants to choose is not here: it is in
  // feature_choice_keys ("<owner key>#feat=<feat key>"). At most 100.
  repeated string feat_keys = 32;
  // For a feat taken in the guided level-up, the key of the Ability Score Improvement
  // feature it replaced (feat key to feature key). Set by the level-up; an entry for a feat
  // the sheet does not have is dropped on save. The sheet then lists the feat at that level and not the improvement. A feat the
  // master added has none.
  map<string, string> feat_slots = 33;
  // The free text some choices take: the two humanoid races of a favored enemy, by
  // "<choice key>#<n>" ("feature:favored-enemy-1-type#1"). At most 12 entries, each 1
  // to 40 characters, one line. The rules never read the text.
  map<string, string> feature_choice_text = 34;
  // A College of Lore bard's "Perguntar" setting for Cutting Words: on which rolls
  // of an enemy the combat asks whether to use it. Unspecified is ONLY_ATTACKS.
  CuttingWordsAsk cutting_words_ask = 40;
  // The size the player picked among the ones the race offers (Race.sizes: "Small" or
  // "Medium"); empty is the race's own size. A size the race does not offer is an issue
  // of the sheet (`race_size`), and the race's own counts.
  string size = 41;
}

// CuttingWordsAsk is when the combat asks a bard to use Cutting Words.
enum CuttingWordsAsk {
  CUTTING_WORDS_ASK_UNSPECIFIED = 0;
  // On every roll of an enemy the bard sees within 60 ft: attacks, checks and
  // damage ("em todos os testes do inimigo").
  CUTTING_WORDS_ASK_ALL = 1;
  // Only on attack rolls ("só em ataques"). The default.
  CUTTING_WORDS_ASK_ONLY_ATTACKS = 2;
  // Never ("nunca").
  CUTTING_WORDS_ASK_NEVER = 3;
}

// AbilityOrigin is the way a player made a sheet's base scores, as the server
// recorded it at creation.
message AbilityOrigin {
  // Never UNSPECIFIED.
  AbilityMethod method = 1;
  // With ROLLED_4D6: the six stored sets the scores come from (the stored rolls
  // are consumed by the creation, so the sheet keeps them).
  repeated AbilityRollSet rolls = 2;
  // With ROLLED_4D6: true when the player typed the dice (physical dice), false
  // when the server rolled them.
  bool typed = 3;
}

// ClassLevel is one class of a character and its level in it.
message ClassLevel {
  // Content key of the class. Required.
  string class_key = 1;
  // Levels in this class: 1 to 20.
  int32 level = 2;
  // The subclass. Unset while none is chosen.
  oneof subclass {
    // Content key of a subclass of class_key.
    string subclass_key = 3;
    // The name of a subclass that is not in the rules content: 1 to 40
    // characters, one line. It shows on the sheet but has no effect on the
    // numbers; its features go in FullSheet.custom_features_text.
    string custom_subclass_name = 4;
  }
}

// CustomBackground is a background the player describes (the editor's "Outro"),
// for one that is not in the rules content, such as the Sage. It follows the SRD
// 5.1 rule "Customizing a Background" (question 82): a name, two skills, two
// tools or languages in any mix, a feature and the equipment. The sheet's numbers
// use all of it (rules.v1.DerivedSheet): the skills, the tool proficiencies, the
// languages and the feature. What is missing shows an issue, never an error.
message CustomBackground {
  // The background's name: 1 to 40 characters, one line.
  string name = 1;
  // Content keys of the skills it grants: at most 2, no repeats. Fewer than
  // 2 shows an issue.
  repeated string skill_keys = 2;
  // Content keys of the tools ("proficiency:thieves-tools") and languages
  // ("language:elvish") it grants, in any mix: at most 2 in all, no repeats.
  // Fewer than 2 shows an issue.
  repeated string proficiency_keys = 3;
  // The feature the player writes: a name of at most 40 characters, one line,
  // and a text of at most 1000 characters. Both empty shows an issue.
  string feature_name = 4;
  string feature_text = 5;
  // The equipment, as a text of at most 500 characters. Empty shows an issue.
  string equipment = 6;
}

// HitPointsMethod is how a character's maximum hit points grow after the
// first level. The first level always takes the hit die's maximum.
enum HitPointsMethod {
  // Read as AVERAGE.
  HIT_POINTS_METHOD_UNSPECIFIED = 0;
  // The fixed value for each level: half the die plus one, such as 4 for a
  // d6.
  HIT_POINTS_METHOD_AVERAGE = 1;
  // The rolls in HitPoints.rolls.
  HIT_POINTS_METHOD_ROLLED = 2;
}

// HitPoints is how the maximum hit points were decided.
message HitPoints {
  HitPointsMethod method = 1;
  // Only with ROLLED: the hit die rolled at each level after the first, in
  // the order of FullSheet.classes (every level of the first class, then
  // the next class). At most 19 rolls, each 1 to 12. A level without a roll
  // uses the average, and a roll above its die shows an issue.
  repeated int32 rolls = 2;
}

// Item is one line of equipment, as free text.
message Item {
  // What it is, such as "Grimório" or "Corda de cânhamo (15 m)": 1 to 100
  // characters, one line.
  string name = 1;
  // How many: 1 to 9,999. 0 means 1.
  int32 quantity = 2;
}

// Coins is the character's money, per coin. Each 0 to 1,000,000.
message Coins {
  // Copper pieces ("peças de cobre", PC).
  int32 copper = 1;
  // Silver pieces ("peças de prata", PP).
  int32 silver = 2;
  // Electrum pieces ("peças de electrum", PE).
  int32 electrum = 3;
  // Gold pieces ("peças de ouro", PO).
  int32 gold = 4;
  // Platinum pieces ("peças de platina", PL).
  int32 platinum = 5;
}

// Alignment is the character's moral and ethical outlook.
enum Alignment {
  // Not chosen.
  ALIGNMENT_UNSPECIFIED = 0;
  // "Leal e bom".
  ALIGNMENT_LAWFUL_GOOD = 1;
  // "Neutro e bom".
  ALIGNMENT_NEUTRAL_GOOD = 2;
  // "Caótico e bom".
  ALIGNMENT_CHAOTIC_GOOD = 3;
  // "Leal e neutro".
  ALIGNMENT_LAWFUL_NEUTRAL = 4;
  // "Neutro".
  ALIGNMENT_NEUTRAL = 5;
  // "Caótico e neutro".
  ALIGNMENT_CHAOTIC_NEUTRAL = 6;
  // "Leal e mau".
  ALIGNMENT_LAWFUL_EVIL = 7;
  // "Neutro e mau".
  ALIGNMENT_NEUTRAL_EVIL = 8;
  // "Caótico e mau".
  ALIGNMENT_CHAOTIC_EVIL = 9;
}

// BasicSheet is the short sheet of a minion or a story NPC: only what a
// combat or a scene needs, typed by the master. In combat it rolls
// initiative with initiative_bonus and attacks with its attacks.
message BasicSheet {
  // Maximum hit points: 1 to 9,999.
  int32 hit_points_max = 1;
  // Armor class: 1 to 40.
  int32 armor_class = 2;
  // Walking speed in feet: 0 to 300. The app shows it in metres
  // (5 ft = 1.5 m).
  int32 speed_ft = 3;
  // Legacy, read only for sheets saved before the attacks list existed. When the server
  // reads such a sheet and can turn damage into an attack, it moves both
  // fields into attacks and clears them here. A write that has attacks
  // clears them. The attack bonus of the old main attack: -10 to +30.
  int32 attack_bonus = 4;
  // Legacy, read only for sheets saved before the attacks list existed (see attack_bonus).
  // The old free text damage, such as "1d6+2 cortante": 0 to 40 characters,
  // one line. It stays only while it could not become an attack.
  string damage = 5;
  // Who or what it is: 0 to 2,000 characters, multi-line.
  string description = 6;
  // The number added to the d20 when it rolls initiative: -10 to +20.
  int32 initiative_bonus = 7;
  // Its attacks: 0 to 3.
  repeated BasicAttack attacks = 8;
  // The challenge rating ("ND"): "0", "1/8", "1/4", "1/2" or "1" to "30", or
  // empty for none. As FullSheet.challenge_rating.
  string challenge_rating = 9;
  // The XP the NPC gives when it is defeated: 0 to 1,000,000. As
  // FullSheet.xp_value.
  int32 xp_value = 10;
  // The NPC's portrait, as FullSheet.portrait_image_id.
  string portrait_image_id = 11;
  // The NPC's size (MR-034, RN-21): decides whether it may pass a creature it
  // is hostile to and share a square with another. Unset (or UNSPECIFIED) means
  // Medium. Shown nowhere new yet: the combat reads it.
  meurpg.rules.v1.CreatureSize size = 12;
  // The SRD creature the NPC was made from (CreateNpcFromCreature, MR-042), such
  // as "monster:ogre"; empty for an NPC the master typed. Only the server
  // writes it: CreateCharacter and UpdateCharacter ignore what they receive
  // and an update keeps the saved one, so the link survives the master's edits.
  string monster_key = 13;
  // The creature's ability scores, each 1 to 30, or unset for an NPC the master
  // typed. Like monster_key, only CreateNpcFromCreature writes it and an update
  // keeps the saved one. It is only stored: the combat does not read it, and no
  // screen shows it yet.
  meurpg.rules.v1.AbilityScores ability_scores = 14;
  // True for the NPC the app makes by itself for a creature the master puts in
  // a combat as monsters (AddMonsters, RN-29): one per campaign and creature,
  // reused by every combat, never in the master's list of characters, and never
  // a participant, a stage NPC or a token. The monsters are copies of it in the
  // combat, each with its own hit points and name. Only the server writes it: a
  // create or an update ignores what it receives and an update keeps the saved
  // one.
  bool combat_only = 15;
}

// BasicAttack is one attack of a basic sheet, with real dice: the d20 plus
// attack_bonus against the target's armor class, then, on a hit,
// damage_dice_count d damage_dice_sides plus damage_bonus.
message BasicAttack {
  // What the attack is called, such as "Cimitarra": 1 to 40 characters,
  // one line.
  string name = 1;
  // The number added to the d20: -10 to +20.
  int32 attack_bonus = 2;
  // How many damage dice: 1 to 20.
  int32 damage_dice_count = 3;
  // The faces of each damage die: 4, 6, 8, 10 or 12.
  int32 damage_dice_sides = 4;
  // The number added to the damage: -20 to +40.
  int32 damage_bonus = 5;
  // The kind of damage. Required: not DAMAGE_TYPE_UNSPECIFIED.
  DamageType damage_type = 6;
  // The reach or range in feet: 0 to 600. 0 is a melee attack with the
  // normal reach of 5 ft (1.5 m). The app does not edit it yet.
  int32 range_ft = 7;
}

// DamageType is a kind of damage of the SRD 5.1.
enum DamageType {
  DAMAGE_TYPE_UNSPECIFIED = 0;
  DAMAGE_TYPE_ACID = 1;
  DAMAGE_TYPE_BLUDGEONING = 2;
  DAMAGE_TYPE_COLD = 3;
  DAMAGE_TYPE_FIRE = 4;
  DAMAGE_TYPE_FORCE = 5;
  DAMAGE_TYPE_LIGHTNING = 6;
  DAMAGE_TYPE_NECROTIC = 7;
  DAMAGE_TYPE_PIERCING = 8;
  DAMAGE_TYPE_POISON = 9;
  DAMAGE_TYPE_PSYCHIC = 10;
  DAMAGE_TYPE_RADIANT = 11;
  DAMAGE_TYPE_SLASHING = 12;
  DAMAGE_TYPE_THUNDER = 13;
}

// CharacterStory is a character's descriptive text: personality,
// appearance, backstory and allies. It has its own lock, which the master
// controls (see UpdateCharacterStory and SetStoryEditing). Every field is
// optional.
message CharacterStory {
  Personality personality = 1;
  Appearance appearance = 2;
  // The character's backstory ("história"): 0 to 10,000 characters,
  // multi-line.
  string backstory = 3;
  // Allies and organizations ("aliados e organizações"): 0 to 2,000
  // characters, multi-line.
  string allies = 4;
}

// Personality is the four personality boxes of the official sheet. Each is 0
// to 1,000 characters, multi-line.
message Personality {
  // Personality traits ("traços de personalidade").
  string traits = 1;
  // Ideals ("ideais").
  string ideals = 2;
  // Bonds ("vínculos").
  string bonds = 3;
  // Flaws ("defeitos").
  string flaws = 4;
}

// Appearance is how the character looks. The short fields are free text,
// such as "1,05 m": 0 to 40 characters each, one line.
message Appearance {
  // Age ("idade").
  string age = 1;
  // Height ("altura").
  string height = 2;
  // Weight ("peso").
  string weight = 3;
  // Eyes ("olhos").
  string eyes = 4;
  // Skin ("pele").
  string skin = 5;
  // Hair ("cabelo").
  string hair = 6;
  // Anything else about how the character looks: 0 to 2,000 characters,
  // multi-line.
  string description = 7;
}

// CreateCharacterRequest describes the new character.
message CreateCharacterRequest {
  string campaign_id = 1;
  // Required. It decides who may create the character and which sheet it
  // takes.
  CharacterKind kind = 2;
  // 1 to 80 characters, one line.
  string name = 3;
  // Required: full for PLAYER, ENEMY and BOSS; basic for MINION and STORY.
  CharacterSheet sheet = 4;
  // Optional; unset means an empty story.
  CharacterStory story = 5;
  // How the base scores of a PLAYER's sheet were made (RN-24); the server
  // checks them against it and against what the table allows. Unspecified is
  // the client that shipped before the rules: it is accepted, with only the
  // sheet's own ranges checked, while the table allows every way, and refused
  // (METHOD_NOT_ALLOWED) once the master switched one off. That leniency goes away
  // once the web sends the method: then an unspecified method is refused. An
  // unknown value is `invalid_argument`. Ignored for an NPC.
  AbilityMethod ability_method = 6;
  // Optional. 1 to 64 characters, chosen once by the app for this action: a retry with the
  // same key and the same request returns what the first call made instead of making another.
  // The key is unique in the campaign; the same key with another request is `invalid_argument`.
  // Empty: the call is not deduplicated. It must be a UUID.
  string idempotency_key = 7;
  // Only the master may send it, with kind PLAYER: the character is made for a
  // player to claim (ClaimCharacter), saved as reserved, with no owner and no
  // approval step. The sheet's rules are the master's (the table's ability-score
  // method and hit-point rule are not checked, as for any sheet the master edits).
  // From a player, or with another kind, it is `invalid_argument`.
  bool for_player = 8;
}

// PreviewCharacterRequest is a sheet to derive without saving it.
message PreviewCharacterRequest {
  string campaign_id = 1;
  // The character being edited. Empty when creating.
  string character_id = 2;
  // Required when creating (it decides who may preview and which sheet fits).
  // With a character_id the character's own kind is used and this is ignored.
  CharacterKind kind = 3;
  // Required: full for PLAYER, ENEMY and BOSS; basic for MINION and STORY.
  CharacterSheet sheet = 4;
  // As CreateCharacterRequest.for_player: the master previews the sheet of a
  // reserved character, which the master's rules allow.
  bool for_player = 5;
}

// PreviewCharacterResponse is what the sheet would be once saved.
message PreviewCharacterResponse {
  // The derived sheet, as Character.derived would carry it after the save.
  meurpg.rules.v1.DerivedSheet derived = 1;
}

// CreateCharacterResponse returns the new character.
message CreateCharacterResponse {
  // The new character, with revision 1.
  Character character = 1;
}

// AbilityMethod is how a player made the base scores of a new sheet (RN-24). The
// standard array, the point buy and 4d6 come from the SRD 5.2.1 (the 2024 rules,
// CC BY 4.0, p. 20, the same numbers as 2014); the app labels them "SRD 5.2.1
// (regras de 2024)".
enum AbilityMethod {
  // Not said (a client from before the rules): see
  // CreateCharacterRequest.ability_method.
  ABILITY_METHOD_UNSPECIFIED = 0;
  // The six scores are 15, 14, 13, 12, 10 and 8, each given to one ability.
  ABILITY_METHOD_STANDARD_ARRAY = 1;
  // Each score is 8 to 15 and the cost of the six is at most 27 points (8 = 0,
  // 9 = 1, 10 = 2, 11 = 3, 12 = 4, 13 = 5, 14 = 7, 15 = 9).
  ABILITY_METHOD_POINT_BUY = 2;
  // The six scores are the results of the sets stored by RollAbilityScores,
  // each used once, in any order.
  ABILITY_METHOD_ROLLED_4D6 = 3;
  // Each score is typed, 3 to 18, before the race's bonus.
  ABILITY_METHOD_TYPED = 4;
}

// AbilityScoresRefusalReason says why the ability scores of a new sheet, or a
// roll of them, are refused, so the app shows its own copy for each.
enum AbilityScoresRefusalReason {
  ABILITY_SCORES_REFUSAL_REASON_UNSPECIFIED = 0;
  // The table does not allow this method (RN-24).
  ABILITY_SCORES_REFUSAL_REASON_METHOD_NOT_ALLOWED = 1;
  // STANDARD_ARRAY, but the scores are not 15, 14, 13, 12, 10 and 8, each once.
  ABILITY_SCORES_REFUSAL_REASON_NOT_STANDARD_ARRAY = 2;
  // POINT_BUY, but a score is outside 8 to 15 or more than 27 points are spent.
  ABILITY_SCORES_REFUSAL_REASON_BAD_POINT_BUY = 3;
  // ROLLED_4D6, but no sets are stored (call RollAbilityScores first).
  ABILITY_SCORES_REFUSAL_REASON_NO_ROLLS_STORED = 4;
  // ROLLED_4D6, but the scores are not the six stored results, each once.
  ABILITY_SCORES_REFUSAL_REASON_NOT_THE_ROLLS = 5;
  // TYPED, but a score is outside 3 to 18.
  ABILITY_SCORES_REFUSAL_REASON_TYPED_OUT_OF_RANGE = 6;
  // RollAbilityScores with typed dice, in a campaign where everybody rolls in the
  // app (RN-18).
  ABILITY_SCORES_REFUSAL_REASON_DICE_FORCED_IN_APP = 7;
  // RollAbilityScores without typed dice, in a campaign where everybody rolls
  // physical dice (RN-18).
  ABILITY_SCORES_REFUSAL_REASON_DICE_FORCED_PHYSICAL = 8;
  // RollAbilityScores with typed dice, when other sets are already stored: the
  // dice are typed once.
  ABILITY_SCORES_REFUSAL_REASON_ROLLS_ALREADY_STORED = 9;
  // The manual ability bonuses (`extra_ability_bonuses`) add up, in their positive
  // values, to more than the race lets the player place (the half-elf's +1 to two
  // abilities, a table race's choice) plus 2 for each Ability Score Improvement the
  // classes reached: they would get around the way the scores were made. Negative
  // values are free; the master's edits too.
  ABILITY_SCORES_REFUSAL_REASON_EXTRA_BONUSES = 10;
}

// AbilityScoresRefusal is the error detail of the `failed_precondition` of
// CreateCharacter and RollAbilityScores that concerns the ability scores.
message AbilityScoresRefusal {
  AbilityScoresRefusalReason reason = 1;
  // The method the call used, for the reasons about a method.
  AbilityMethod method = 2;
}

// AbilityRollSet is one roll of "4d6, drop the lowest": four dice.
message AbilityRollSet {
  // The four dice, each 1 to 6. The lowest is the one that is dropped (the
  // first, when several are the lowest).
  repeated int32 dice = 1;
  // The result: the dice added without the lowest, 3 to 18.
  int32 total = 2;
}

// AbilityRolls are the six sets stored for a player's next new character.
message AbilityRolls {
  // Six sets, in the order they were rolled or typed.
  repeated AbilityRollSet sets = 1;
  // True when the player typed the dice (physical dice); false when the server
  // rolled them.
  bool typed = 2;
  // When they were rolled or typed.
  google.protobuf.Timestamp rolled_at = 3;
}

// GetAbilityRollsRequest names the campaign.
message GetAbilityRollsRequest {
  string campaign_id = 1;
}

// GetAbilityRollsResponse returns the stored sets.
message GetAbilityRollsResponse {
  // Unset when no sets are stored.
  AbilityRolls rolls = 1;
}

// RollAbilityScoresRequest asks for the sets, typed or rolled by the server.
message RollAbilityScoresRequest {
  string campaign_id = 1;
  // Physical dice: the six sets the player typed, four dice each, 1 to 6. Empty
  // for the server to roll.
  repeated AbilityRollSet typed_dice = 2;
}

// RollAbilityScoresResponse returns the stored sets.
message RollAbilityScoresResponse {
  AbilityRolls rolls = 1;
  // True when the sets were stored before this call and are returned as they
  // were.
  bool already_rolled = 2;
}

// CreateNpcFromCreatureRequest names the creature, the NPC's own name and
// role, and carries the idempotency key of the dialog.
message CreateNpcFromCreatureRequest {
  string campaign_id = 1;
  // Content key of the SRD creature, such as "monster:ogre".
  string creature_key = 2;
  // The master's name for the NPC, 1 to 80 characters, one line ("Grak, o
  // ogro").
  string name = 3;
  // CHARACTER_KIND_MINION or CHARACTER_KIND_STORY.
  CharacterKind kind = 4;
  // A UUID the app makes once per dialog, so a retry does not create a second
  // NPC.
  string idempotency_key = 5;
}

// CreateNpcFromCreatureResponse returns the NPC, new or the one an earlier call
// with the same key made.
message CreateNpcFromCreatureResponse {
  // The NPC, with its derived numbers as for CreateCharacter.
  Character character = 1;
}

// GetCharacterRequest names a character of a campaign.
message GetCharacterRequest {
  string campaign_id = 1;
  string character_id = 2;
}

// GetCharacterResponse returns the character.
message GetCharacterResponse {
  Character character = 1;
}

// ListCharactersRequest names a campaign.
message ListCharactersRequest {
  string campaign_id = 1;
}

// ListCharactersResponse lists the characters the caller may see.
message ListCharactersResponse {
  repeated CharacterSummary characters = 1;
}

// UpdateCharacterRequest carries the character's new name and sheet. Both
// replace the saved ones completely.
message UpdateCharacterRequest {
  string campaign_id = 1;
  string character_id = 2;
  // The revision the client last read (Character.revision).
  int32 revision = 3;
  // 1 to 80 characters, one line.
  string name = 4;
  // Required, of the type the kind takes.
  CharacterSheet sheet = 5;
}

// UpdateCharacterResponse returns the character as saved.
message UpdateCharacterResponse {
  // The character, with the new revision and derived numbers.
  Character character = 1;
}

// UpdateCharacterStoryRequest carries the character's new story, which
// replaces the saved one completely.
message UpdateCharacterStoryRequest {
  string campaign_id = 1;
  string character_id = 2;
  // The revision the client last read (Character.revision).
  int32 revision = 3;
  // Unset means an empty story.
  CharacterStory story = 4;
}

// UpdateCharacterStoryResponse returns the character as saved.
message UpdateCharacterStoryResponse {
  // The character, with the new revision.
  Character character = 1;
}

// SetStoryEditingRequest says whether the player may edit a character's
// story.
message SetStoryEditingRequest {
  string campaign_id = 1;
  string character_id = 2;
  // true lets the owning player edit the story until the next game session
  // starts; false takes that back.
  bool allowed = 3;
}

// SetStoryEditingResponse returns the character as saved.
message SetStoryEditingResponse {
  // The character, with story_editing_allowed as set.
  Character character = 1;
}

// MarkCharacterDeadRequest names the character that died.
message MarkCharacterDeadRequest {
  string campaign_id = 1;
  string character_id = 2;
}

// MarkCharacterDeadResponse returns the dead character.
message MarkCharacterDeadResponse {
  // The character, with state DEAD and died_at set.
  Character character = 1;
}

// GetMasterNotesRequest names a character of a campaign.
message GetMasterNotesRequest {
  string campaign_id = 1;
  string character_id = 2;
}

// GetMasterNotesResponse returns the master's notes about the character.
message GetMasterNotesResponse {
  // The notes. Empty when the master has written none.
  string notes = 1;
  // When the notes were last saved. Unset when there are none.
  google.protobuf.Timestamp updated_at = 2;
}

// UpdateMasterNotesRequest carries the new notes, which replace the saved
// ones completely.
message UpdateMasterNotesRequest {
  string campaign_id = 1;
  string character_id = 2;
  // 0 to 20,000 characters, multi-line. Empty (or only spaces) deletes the
  // notes.
  string notes = 3;
}

// UpdateMasterNotesResponse returns the notes as saved.
message UpdateMasterNotesResponse {
  // The notes as saved. Empty when they were deleted.
  string notes = 1;
  // When they were saved. Unset when they were deleted.
  google.protobuf.Timestamp updated_at = 2;
}

// ApproveCharacterRequest names the character to approve.
message ApproveCharacterRequest {
  string campaign_id = 1;
  string character_id = 2;
}

// ApproveCharacterResponse returns the approved character.
message ApproveCharacterResponse {
  // The character, now DRAFT (or as it was, if it was not PENDING).
  Character character = 1;
}

// RejectCharacterRequest names the character to reject.
message RejectCharacterRequest {
  string campaign_id = 1;
  string character_id = 2;
}

// RejectCharacterResponse is empty: the character is gone.
message RejectCharacterResponse {}

// RequestCharacterChangesRequest names the pending character and says what the
// master wants changed.
message RequestCharacterChangesRequest {
  string campaign_id = 1;
  string character_id = 2;
  // 1 to 500 characters after trimming, line breaks allowed.
  string reason = 3;
  // 1 to 64 characters, required.
  string idempotency_key = 4;
}

// RequestCharacterChangesResponse returns the character, still PENDING, with its
// review CHANGES_REQUESTED.
message RequestCharacterChangesResponse {
  Character character = 1;
}

// ResubmitCharacterRequest names the character the player sends again.
message ResubmitCharacterRequest {
  string campaign_id = 1;
  string character_id = 2;
  // 1 to 64 characters, required.
  string idempotency_key = 3;
}

// ResubmitCharacterResponse returns the character, still PENDING, with its review
// RESUBMITTED.
message ResubmitCharacterResponse {
  Character character = 1;
}

// ReviveCharacterRequest names the dead character to bring back.
message ReviveCharacterRequest {
  string campaign_id = 1;
  string character_id = 2;
  // 1 to 64 characters, required.
  string idempotency_key = 3;
}

// ReviveCharacterResponse returns the character alive again.
message ReviveCharacterResponse {
  Character character = 1;
}

// CreateClaimLinkRequest names the reserved character to make a link for.
message CreateClaimLinkRequest {
  string campaign_id = 1;
  string character_id = 2;
  // How long the link works: 1, 7 or 30 days. 0 means 7. It cannot change after
  // the link is made.
  int32 validity_days = 3;
}

// CreateClaimLinkResponse carries the link's secret, once.
message CreateClaimLinkResponse {
  // The secret of the link, 43 URL-safe characters. The app builds
  // `<origin>/claim#t=<token>`. The server never shows it again.
  string token = 1;
  // When the link stops working.
  google.protobuf.Timestamp expires_at = 2;
}

// RevokeClaimLinkRequest names the character whose live link ends.
message RevokeClaimLinkRequest {
  string campaign_id = 1;
  string character_id = 2;
}

// RevokeClaimLinkResponse is empty: the character has no live link.
message RevokeClaimLinkResponse {}

// ReturnCharacterToReserveRequest names the claimed character to take back.
message ReturnCharacterToReserveRequest {
  string campaign_id = 1;
  string character_id = 2;
}

// ReturnCharacterToReserveResponse returns the character as it is now.
message ReturnCharacterToReserveResponse {
  // The character, reserved and with no owner.
  Character character = 1;
}

// DeleteReservedCharacterRequest names the reserved character to delete.
message DeleteReservedCharacterRequest {
  string campaign_id = 1;
  string character_id = 2;
}

// DeleteReservedCharacterResponse is empty: the character is gone.
message DeleteReservedCharacterResponse {}

// PreviewClaimRequest carries the link's secret.
message PreviewClaimRequest {
  // The secret from the link's fragment, in the body only. Empty means the link
  // the person signed in with.
  string token = 1;
}

// ClaimCard is what the public card of a reserved character shows to someone who
// holds its link.
message ClaimCard {
  // The character's name.
  string character_name = 1;
  // The race's Portuguese name (the subrace's if the sheet has one), such as
  // "Humano". Empty for a sheet without one.
  string race_name_pt = 2;
  // Classes and levels in Portuguese, such as "Monge 5".
  string class_summary = 3;
  // The campaign's name.
  string campaign_name = 4;
  // The display name of whoever made the link (the master); empty if they have none.
  string sent_by_display_name = 5;
}

// PreviewClaimResponse is the card of the character the link is for.
message PreviewClaimResponse {
  ClaimCard card = 1;
  // True when the caller is the campaign's master, who owns the link: the app
  // says the link is for a player, and the card is left empty.
  bool own_link = 2;
}

// ClaimCharacterRequest carries the link's secret.
message ClaimCharacterRequest {
  // As PreviewClaimRequest.token.
  string token = 1;
}

// ClaimCharacterResponse says what the person took.
message ClaimCharacterResponse {
  string campaign_id = 1;
  string campaign_name = 2;
  string character_id = 3;
  string character_name = 4;
}

// GetLevelUpOptionsRequest names the character to level up.
message GetLevelUpOptionsRequest {
  string campaign_id = 1;
  string character_id = 2;
  // The class that gains the level: one the character has, or one it does not
  // have yet (multiclassing: the options are those of the class's level 1, and
  // is_new_class is true; LevelUpOptions.class_choices lists them all). Empty
  // means the character's first class. A class of the content that the character
  // may not take is `failed_precondition` with the reason in LevelUpRefusal; one
  // the content does not have is `invalid_argument`.
  string class_key = 3;
}

// GetLevelUpOptionsResponse is what the next level gives.
message GetLevelUpOptionsResponse {
  LevelUpOptions options = 1;
}

// LevelUpNamedKey is a content key with its Portuguese name.
message LevelUpNamedKey {
  string key = 1;
  string name_pt = 2;
}

// LevelUpSpellsKind says where the new spells of a level go.
enum LevelUpSpellsKind {
  LEVEL_UP_SPELLS_KIND_UNSPECIFIED = 0;
  // The Wizard's spellbook: two new spells per level, in
  // FullSheet.known_spell_keys. The spells to prepare come from it.
  LEVEL_UP_SPELLS_KIND_SPELLBOOK = 1;
  // Bard, Ranger, Sorcerer and Warlock: the new spells the class table gives,
  // in FullSheet.known_spell_keys.
  LEVEL_UP_SPELLS_KIND_KNOWN = 2;
}

// LevelUpDiceRule is what the campaign's dice setting makes the player do
// with the hit die (RN-18).
enum LevelUpDiceRule {
  LEVEL_UP_DICE_RULE_UNSPECIFIED = 0;
  // Each player chooses, on every roll: roll in the app, or type the result of
  // a physical die. The player's saved preference is only the default the
  // screen highlights.
  LEVEL_UP_DICE_RULE_PLAYER_CHOOSES = 1;
  // Everybody rolls in the app: ROLLED_PHYSICAL is refused.
  LEVEL_UP_DICE_RULE_FORCED_IN_APP = 2;
  // Everybody rolls physical dice: RollLevelUpHitPoints is refused.
  LEVEL_UP_DICE_RULE_FORCED_PHYSICAL = 3;
}

// LevelUpOptions is what the next level of one class gives, in data the
// guided level-up draws. A step with nothing to choose does not exist: the
// app skips a step whose counts are zero and whose lists are empty.
//
// Steps and their data: "Habilidades" (ability_score_improvement), "Vida"
// (hit_die, hit_point_average, dice_rule, kept_hit_point_roll), "Magias"
// (cantrips, spells, prepares), and the steps for the subclass
// (subclass_due), the feature options (feature_choices), the skills and
// expertise. "Resumo" is PreviewLevelUp. The numbers of the sheet that change
// by themselves (slots, proficiency bonus, features) are only shown.
message LevelUpOptions {
  // The class that gains the level, and its Portuguese name.
  string class_key = 1;
  string class_name_pt = 2;
  // The class's level before and after, and the character's total level
  // before and after.
  int32 from_level = 3;
  int32 to_level = 4;
  int32 total_from_level = 5;
  int32 total_to_level = 6;

  // The class's hit die (8 for a d8) and the fixed gain: half the die plus
  // one, before the Constitution modifier (the sheet adds the modifier, and
  // never less than 1 in all). The hit points of the new level are one of:
  // the average, a roll of the die in the app (RollLevelUpHitPoints), or the
  // result of a physical die typed in (1 to hit_die).
  int32 hit_die = 7;
  int32 hit_point_average = 8;
  // What the campaign's dice setting allows. With PLAYER_CHOOSES, the
  // player's own preference (the campaign's dice_preference) tells which
  // option the screen highlights.
  LevelUpDiceRule dice_rule = 9;
  // The roll the server already made and kept for this level, 0 for none: a
  // player who comes back sees the same roll.
  int32 kept_hit_point_roll = 10;

  // True at an Ability Score Improvement level: +2 in one ability or +1 in
  // two, none above 20 (LevelUpChoices.ability_increase). The SRD 5.1 has no
  // feats.
  bool ability_score_improvement = 11;

  // True when the class picks its subclass at this level: one of subclasses
  // (LevelUpChoices.subclass_key).
  bool subclass_due = 12;
  repeated LevelUpSubclass subclasses = 13;

  // How many new cantrips to add (LevelUpChoices.cantrip_keys), from the list
  // of spell_list_class_key.
  int32 cantrips = 14;
  // How many new spells to add (LevelUpChoices.known_spell_keys): to the
  // spellbook or to the spells known (spells_kind says which), from the list
  // of spell_list_class_key, each up to max_spell_level.
  int32 spells = 15;
  LevelUpSpellsKind spells_kind = 16;
  // The class whose spell list the new cantrips and spells come from (empty
  // when the class casts nothing yet), and the highest spell level it can
  // cast at the new level.
  string spell_list_class_key = 17;
  int32 max_spell_level = 18;
  // True for a class that prepares spells (Cleric, Druid, Paladin, Wizard):
  // the player may prepare more, up to the new maximum
  // (LevelUpChoices.prepared_spell_keys, none removed). prepared_max is the
  // maximum now; prepared_max_after is the one at the new level with the
  // abilities as they are today. An ability increase can raise it again, so
  // the app reads the final number in PreviewLevelUp
  // (DerivedSheet.spellcasting).
  bool prepares = 19;
  int32 prepared_max = 20;
  int32 prepared_max_after = 21;

  // The options the new features offer (a fighting style, a metamagic), for
  // the class's own features and, when the subclass is already chosen, the
  // subclass's (LevelUpChoices.feature_choice_keys).
  repeated LevelUpFeatureChoice feature_choices = 22;
  // How many new skills (LevelUpChoices.skill_proficiency_keys) and how many
  // new expertise (LevelUpChoices.expertise_skill_keys) the new level gives.
  int32 skill_choices = 23;
  int32 expertise_choices = 24;

  // What changes by itself: the proficiency bonus, the spell slots per
  // circle (9 entries, the 1st circle first) and the warlock's pact slots,
  // before and after, and the class features the level gives.
  int32 proficiency_bonus_before = 25;
  int32 proficiency_bonus_after = 26;
  repeated int32 spell_slots_before = 27;
  repeated int32 spell_slots_after = 28;
  meurpg.rules.v1.PactMagic pact_magic_before = 29;
  meurpg.rules.v1.PactMagic pact_magic_after = 30;
  repeated LevelUpNamedKey new_features = 31;

  // How many of `spells` may come from any class's list, not only
  // spell_list_class_key's: the Bard's Magical Secrets (2 at levels 10, 14 and
  // 18). They must still be of a circle the class can cast. 0 for every
  // other level.
  int32 any_class_spells = 32;
  // The features of this level whose choice the guided level-up does not
  // cover, so the app tells the player "o mestre acrescenta pelo editor":
  // the Warlock's Mystic Arcanum (levels 11, 13, 15 and 17), the Wizard's Spell
  // Mastery (18) and Signature Spells (20), the College of Lore's Additional
  // Magical Secrets (6), and the Ranger's favored enemies and terrains. They
  // are part of the level (new_features lists them too); only their choice is
  // the master's.
  repeated LevelUpNamedKey master_adds = 33;
  // The class of the kept roll, when there is one (kept_hit_point_roll is the
  // roll for the character's next total level, whichever class rolled it). A
  // roll kept for another class cannot be rolled again nor used for this
  // class: RollLevelUpHitPoints and LevelUpCharacter answer
  // HIT_POINT_ROLL_OTHER_CLASS.
  string kept_hit_point_roll_class_key = 34;
  // Which hit points methods the table allows (RN-24). With ROLL_ONLY the
  // average is refused (LevelUpCharacter with AVERAGE answers HIT_POINTS_RULE);
  // with AVERAGE_ONLY the rolls are refused (RollLevelUpHitPoints answers
  // HIT_POINTS_AVERAGE_ONLY, and ROLLED_IN_APP and ROLLED_PHYSICAL answer
  // HIT_POINTS_RULE). Independent of dice_rule, which says where a roll happens.
  LevelUpHitPointsRule hit_points_rule = 35;
  // At a level with an Ability Score Improvement, when the table uses feats (its
  // rule "Talentos"): the feats the player may take in place of the increase, each
  // with whether the character qualifies at the new level and what it lacks when
  // not (meurpg.rules.v1.FeatOption). Retired feats are left out, and so are the
  // ones the master switched off for a player. Empty at the other levels and where
  // the table does not use feats. A feat taken is LevelUpChoices.feat_key; the
  // abilities it raises, LevelUpChoices.ability_increase.
  repeated meurpg.rules.v1.FeatOption feats = 36;
  // The choices an earlier level left open (a Fighting Style the sheet never picked):
  // the guided level-up asks for them first, and LevelUpCharacter refuses the level
  // without them (LATE_CHOICE_MISSING). Their picks go in
  // LevelUpChoices.late_choice_keys. Only the choices with selections left are here.
  repeated ChoiceGroup late_choices = 41;
  // The new level's choices that are not options of a feature: a favored enemy and its
  // language, a terrain, a Mystic Arcanum, a Spell Mastery, a Signature Spell. Their
  // picks go in LevelUpChoices.feature_choice_keys (and feature_choice_text).
  repeated ChoiceGroup new_choices = 42;
  // True for a warlock that knows an invocation: at each level of the class one may be
  // replaced by another (LevelUpChoices.swap_invocation_key).
  bool can_swap_invocation = 43;
  // The groups of picks the level may swap one in (a cantrip, a fighting style, a
  // metamagic option, an invocation, a pact boon), at a level with an Ability Score
  // Improvement, when the table plays with the rule "Trocar uma escolha no aumento de
  // atributo" (TableRules.pick_swap_allowed). Empty at the other levels and where the
  // rule is off. The swap is LevelUpChoices.swap_pick; the warlock's own invocation
  // swap stays can_swap_invocation.
  repeated LevelUpSwapGroup swap_groups = 44;

  // Multiclassing (SRD 5.1, "Multiclassing"). is_new_class says the character
  // does not have class_key: the level is the class's first (from_level 0), the hit
  // die gives its average and never the maximum, and everything above is the
  // class's level 1 (cantrips, spells and prepared spells are the class's own
  // numbers, not the total level's).
  bool is_new_class = 37;
  // The ways the level can go, always set: the classes the character has (their
  // next level), then the other classes of the content sorted by name, each with
  // its prerequisite and whether it is open. A class the master archived or
  // switched off is not listed to a player.
  repeated LevelUpClassChoice class_choices = 38;
  // For a new class: the armor, weapon and tool proficiencies its multiclass table
  // gives, each marked when the character already has it; and the picks the table
  // asks for (a skill; the Bard's instrument). The skill goes in
  // LevelUpChoices.skill_proficiency_keys, the instrument in instrument_key.
  repeated LevelUpProficiencyGain proficiency_gains = 39;
  repeated LevelUpProficiencyChoice proficiency_choices = 40;
}

// LevelUpPrerequisite is one ability a class asks for to be taken as one of
// several classes, with the character's final score.
message LevelUpPrerequisite {
  meurpg.rules.v1.Ability ability = 1;
  int32 minimum = 2;
  int32 have = 3;
  bool met = 4;
}

// LevelUpClassUnavailable says why a class is not open as the next level.
enum LevelUpClassUnavailable {
  LEVEL_UP_CLASS_UNAVAILABLE_UNSPECIFIED = 0;
  // The character, or the class, is at level 20.
  LEVEL_UP_CLASS_UNAVAILABLE_MAX_LEVEL = 1;
  // The new class asks for an ability the character does not have at 13.
  LEVEL_UP_CLASS_UNAVAILABLE_PREREQUISITE = 2;
  // A class the character already has asks for an ability the character does not
  // have at 13, which closes every new class.
  LEVEL_UP_CLASS_UNAVAILABLE_PREREQUISITE_CURRENT = 3;
}

// LevelUpClassChoice is a class the next level can go to: one the character has or
// a new one (SRD 5.1, "Multiclassing").
message LevelUpClassChoice {
  string class_key = 1;
  string name_pt = 2;
  // True for a class the character does not have.
  bool is_new = 3;
  // The class's level before and after the level: 5 and 6, or 0 and 1 for a new
  // class.
  int32 from_level = 4;
  int32 to_level = 5;
  // The Portuguese name of the subclass the character has in the class, and
  // whether the class picks its subclass at to_level.
  string subclass_name_pt = 6;
  bool subclass_due = 7;
  // What the class asks for as one of several classes: every ability here, or
  // just one of them when prerequisite_any_of (the Fighter's Strength or
  // Dexterity). For a class the character has, what a new class asks of it.
  repeated LevelUpPrerequisite prerequisites = 8;
  bool prerequisite_any_of = 9;
  bool prerequisite_met = 10;
  // True when the level can go to this class now; otherwise unavailable says why.
  bool available = 11;
  LevelUpClassUnavailable unavailable = 12;
}

// LevelUpProficiencyGain is a proficiency a new class gives (the multiclass table).
message LevelUpProficiencyGain {
  string key = 1;
  string name_pt = 2;
  // "armor", "weapon", "tool" or "other".
  string kind = 3;
  bool already_have = 4;
}

// LevelUpProficiencyKind is what a pick of the multiclass table is.
enum LevelUpProficiencyKind {
  LEVEL_UP_PROFICIENCY_KIND_UNSPECIFIED = 0;
  LEVEL_UP_PROFICIENCY_KIND_SKILL = 1;
  LEVEL_UP_PROFICIENCY_KIND_INSTRUMENT = 2;
}

// LevelUpProficiencyChoice is "choose `count` of `from`" among the proficiencies of a
// new class: a skill from its list, or the Bard's musical instrument.
message LevelUpProficiencyChoice {
  LevelUpProficiencyKind kind = 1;
  int32 count = 2;
  repeated LevelUpProficiencyOption from = 3;
}

// LevelUpProficiencyOption is an option of a pick, marked when the character
// already has it (the server refuses it: PROFICIENCY_CHOICE or INSTRUMENT_CHOICE).
message LevelUpProficiencyOption {
  string key = 1;
  string name_pt = 2;
  bool already_have = 3;
}

// LevelUpHitPointsRule is which methods of deciding a level's hit points the
// table allows (RN-24).
enum LevelUpHitPointsRule {
  LEVEL_UP_HIT_POINTS_RULE_UNSPECIFIED = 0;
  // The player chooses between rolling and the average (the default).
  LEVEL_UP_HIT_POINTS_RULE_PLAYER_CHOOSES = 1;
  // Everybody rolls; the average is refused.
  LEVEL_UP_HIT_POINTS_RULE_ROLL_ONLY = 2;
  // Everybody takes the average; a roll is refused.
  LEVEL_UP_HIT_POINTS_RULE_AVERAGE_ONLY = 3;
}

// LevelUpSubclass is a subclass the player may pick at this level, with the
// options its features at the new level offer.
message LevelUpSubclass {
  string key = 1;
  string name_pt = 2;
  // Shown once the subclass is picked: choose them with the subclass.
  repeated LevelUpFeatureChoice feature_choices = 3;
  // What this subclass adds to the level's counts, which are not in
  // LevelUpOptions' own until it is chosen: new cantrips (the Circle of the
  // Land's bonus cantrip, from the druid list), new skills (the College of
  // Lore's three) and new expertise. Add them to cantrips, skill_choices and
  // expertise_choices once the player picks it.
  int32 cantrips = 4;
  int32 skill_choices = 5;
  int32 expertise_choices = 6;
  // The table retired this subclass (RN-23). Only the master receives an archived
  // subclass; the server leaves it out for players, unless their own sheet has it.
  // Choosing one is refused with ARCHIVED_CHOICE.
  bool archived = 7;
  // The master switched this subclass off for the players (RN-23): its own switch;
  // an off class does not mark its subclasses here, because the offer is for a
  // character that already has the class. The server leaves it out for players,
  // unless their own sheet has it, and refuses it with SWITCHED_OFF_CHOICE.
  bool off = 14;
  // What a third caster's subclass (the table's only) adds: how many spells it
  // knows from this level (the first row of its table, or the rise over the level
  // before when the subclass is picked later), where they go, the class whose list
  // they come from and the highest circle they may have. All zero for a subclass
  // that does not cast. Add `spells` to the level's spells and read them from
  // `spell_list_class_key`, up to `max_spell_level`, once the player picks it
  // (slice 10.3).
  int32 spells = 8;
  LevelUpSpellsKind spells_kind = 9;
  string spell_list_class_key = 10;
  int32 max_spell_level = 11;
  // A third caster's subclass that prepares its spells (instead of knowing them):
  // `prepares` is true and `prepared_max_after` is how many it may prepare at the new
  // level once the subclass is chosen (the level-up's own prepared_max_after only
  // counts it after the pick).
  bool prepares = 12;
  int32 prepared_max_after = 13;
}

// LevelUpFeatureChoice is "choose `choose` of `options`" for a feature the
// character gains at the new level.
message LevelUpFeatureChoice {
  // The feature that offers the options, such as "feature:metamagic-1".
  LevelUpNamedKey feature = 1;
  // The subclass the feature belongs to, or empty for a class feature.
  string subclass_key = 2;
  // How many options to choose.
  int32 choose = 3;
  // The options the character does not have yet and can take now, as content keys.
  repeated LevelUpNamedKey options = 4;
  // The options it cannot take now (an invocation whose prerequisite is unmet), with
  // why. They stay on the screen, blocked.
  repeated LevelUpBlockedOption blocked = 5;
}

// LevelUpSwapGroup is a group of picks one of which the level may swap for another.
message LevelUpSwapGroup {
  // The group: "cantrip", "fighting_style", "metamagic", "invocation" or "pact_boon".
  string group = 1;
  string name_pt = 2;
  // The picks the character has in the group, which it may give up.
  repeated LevelUpNamedKey picks = 3;
  // What it may take instead: the pool of the group (the SRD's and the table's options)
  // without the picks it has. Prerequisites are checked when the level is taken.
  repeated LevelUpNamedKey pool = 4;
}

// LevelUpPickSwap is the swap asked for: from_key, a pick of the group, becomes to_key.
message LevelUpPickSwap {
  string group = 1;
  string from_key = 2;
  string to_key = 3;
}

// LevelUpBlockedOption is an option of a feature that the character cannot take now.
message LevelUpBlockedOption {
  LevelUpNamedKey option = 1;
  // What is missing, in Portuguese, such as "Exige o nível 9 de Bruxo. Você está no 5.".
  string reason_pt = 2;
}

// LevelUpHitPointsMethod is how the hit points of the new level are decided.
enum LevelUpHitPointsMethod {
  LEVEL_UP_HIT_POINTS_METHOD_UNSPECIFIED = 0;
  // The average: half the die plus one.
  LEVEL_UP_HIT_POINTS_METHOD_AVERAGE = 1;
  // The roll the server made and kept (RollLevelUpHitPoints).
  LEVEL_UP_HIT_POINTS_METHOD_ROLLED_IN_APP = 2;
  // The result of a physical die, typed in: LevelUpHitPoints.value, 1 to the
  // hit die.
  LEVEL_UP_HIT_POINTS_METHOD_ROLLED_PHYSICAL = 3;
}

// LevelUpHitPoints is the hit points of the new level.
message LevelUpHitPoints {
  LevelUpHitPointsMethod method = 1;
  // With ROLLED_PHYSICAL, the typed result of the die: 1 to the hit die. The
  // server ignores it for the other methods and fills it in the record
  // (ListLevelUps) with the number the level took: the average, or the roll.
  int32 value = 2;
}

// LevelUpChoices is what the player chose for one level up. The lists hold
// only what is new, never the sheet's whole lists: the server adds them to the
// stored sheet. The same message is what ListLevelUps shows the master.
message LevelUpChoices {
  // The class that gains the level: one the character has, or a new one
  // (multiclassing), which joins the sheet at level 1 as its last class.
  string class_key = 1;
  // The ability increase at an Ability Score Improvement level: +2 in one
  // ability, or +1 in two, as AbilityScores fields; the others 0 or unset.
  // The sheet keeps it in extra_ability_bonuses. Unset for none.
  meurpg.rules.v1.AbilityScores ability_increase = 2;
  // The subclass, when the class picks it at this level.
  string subclass_key = 3;
  // The new cantrips, spells known (or spellbook) and prepared spells. At most
  // 30, 30 and 100 entries.
  repeated string cantrip_keys = 4;
  repeated string known_spell_keys = 5;
  repeated string prepared_spell_keys = 6;
  // The options the new features offer, the new skills, and the new
  // expertise. At most 100 entries each.
  repeated string feature_choice_keys = 7;
  repeated string skill_proficiency_keys = 8;
  repeated string expertise_skill_keys = 9;
  // The hit points of the level. Required.
  LevelUpHitPoints hit_points = 10;
  // The feat taken in place of the Ability Score Improvement, when the table uses
  // feats (its rule "Talentos") and the character meets its prerequisite. With a
  // feat, `ability_increase` is the increase the feat gives (its `increase`:
  // `count` different abilities of its list, `value` each, none above 20) and is
  // unset when the feat gives none. A feat that raises every ability it lists needs no
  // `ability_increase`: the server applies it, stopping at 20 (one that is not exactly that
  // is refused). Empty for none.
  string feat_key = 11;
  // The musical instrument (a proficiency key, such as "proficiency:lute") that a
  // Bard taken as a new class lets the player pick; the sheet lists its name among
  // tool_proficiencies. Empty for a class that asks for none.
  string instrument_key = 12;
  // The picks of the choices an earlier level left open (LevelUpOptions.late_choices),
  // written like feature_choice_keys. At most 100.
  repeated string late_choice_keys = 13;
  // The free text of the picks (the humanoid races of a favored enemy), as
  // FullSheet.feature_choice_text. At most 12 entries.
  map<string, string> feature_choice_text = 14;
  // An Eldritch Invocation the warlock gives up for another one in feature_choice_keys:
  // at most one at each level (SRD 5.1, Warlock). Never the Pact Boon.
  string swap_invocation_key = 15;
  // One pick given up for another of the same group, at a level with an Ability Score
  // Improvement, when the table allows it (TableRules.pick_swap_allowed). Unset for none.
  LevelUpPickSwap swap_pick = 16;
}

// LevelUpRefusalReason says why the rules refuse a set of choices, so the app
// shows its own Portuguese copy for each; never parse a message.
enum LevelUpRefusalReason {
  LEVEL_UP_REFUSAL_REASON_UNSPECIFIED = 0;
  // Not exactly one class of the character gaining one level (a new class is
  // multiclassing, which stays in the sheet editor).
  LEVEL_UP_REFUSAL_REASON_CLASS = 1;
  // The character is already level 20.
  LEVEL_UP_REFUSAL_REASON_MAX_LEVEL = 2;
  // A field the level does not change would differ (name, race, base scores,
  // equipment...): it stays locked (RN-01). `field` says which.
  LEVEL_UP_REFUSAL_REASON_LOCKED_FIELD = 3;
  // An ability increase at a level that has none.
  LEVEL_UP_REFUSAL_REASON_ABILITY_NOT_DUE = 4;
  // The increase is not +2 in one ability or +1 in two.
  LEVEL_UP_REFUSAL_REASON_ABILITY_SHAPE = 5;
  // The increase would take an ability above 20.
  LEVEL_UP_REFUSAL_REASON_ABILITY_ABOVE_20 = 6;
  // The hit points are out of range: the die result is not 1 to the hit die.
  LEVEL_UP_REFUSAL_REASON_HIT_POINTS = 7;
  // A subclass chosen when none is due, or none chosen when one is due, or one
  // that is not the class's.
  LEVEL_UP_REFUSAL_REASON_SUBCLASS = 8;
  // Not exactly the number of new cantrips the level gives.
  LEVEL_UP_REFUSAL_REASON_CANTRIPS = 9;
  // Not exactly the number of new spells the level gives.
  LEVEL_UP_REFUSAL_REASON_SPELLS = 10;
  // Prepared spells removed, or added by a class that does not prepare.
  LEVEL_UP_REFUSAL_REASON_PREPARED = 11;
  // Not exactly the options the new features offer.
  LEVEL_UP_REFUSAL_REASON_FEATURE_CHOICE = 12;
  // Not exactly the new skills the level gives.
  LEVEL_UP_REFUSAL_REASON_SKILLS = 13;
  // Not exactly the new expertise the level gives.
  LEVEL_UP_REFUSAL_REASON_EXPERTISE = 14;
  // The new sheet would have a problem that the old one did not: a spell off
  // the class's list or above the highest circle, more prepared spells than
  // the new maximum... `issue_code` is the Issue code (meurpg.rules.v1.Issue)
  // and `field` the sheet field.
  LEVEL_UP_REFUSAL_REASON_SHEET_ISSUE = 15;
  // The method ROLLED_IN_APP, but the server has no kept roll for this level:
  // call RollLevelUpHitPoints first.
  LEVEL_UP_REFUSAL_REASON_HIT_POINT_ROLL_MISSING = 16;
  // The kept roll was made for another class of the character (a multiclass
  // character gets one roll per level, so it cannot roll a d6 and a d12 for the
  // same level and keep the better). RollLevelUpHitPoints for the other class,
  // and LevelUpCharacter with ROLLED_IN_APP, are refused.
  LEVEL_UP_REFUSAL_REASON_HIT_POINT_ROLL_OTHER_CLASS = 17;
  // The stored sheet does not pass today's rules by itself (a key the content
  // no longer has, a value out of range), so no choice could fix it: the app
  // says "peça ao mestre para corrigir a ficha", and the master edits it.
  // `field` is the sheet field.
  LEVEL_UP_REFUSAL_REASON_SHEET_NEEDS_MASTER = 18;
  // The hit points method is one the table's rule does not allow (RN-24): the
  // average where everybody rolls, or a roll where everybody takes the average.
  // `field` is "choices.hit_points.method".
  LEVEL_UP_REFUSAL_REASON_HIT_POINTS_RULE = 19;
  // A choice of the level is a table entry the master archived (a subclass, a
  // spell...): it is not a new choice any more (RN-23). `field` is the sheet field.
  LEVEL_UP_REFUSAL_REASON_ARCHIVED_CHOICE = 20;
  // A choice of the level, made by a player, is an option the master switched off
  // (RN-23: a subclass, a spell, the class of a multiclass...). `field` is the
  // sheet field. The master is not refused. PreviewLevelUp answers this and
  // ARCHIVED_CHOICE with no `after`.
  LEVEL_UP_REFUSAL_REASON_SWITCHED_OFF_CHOICE = 21;
  // A feat at a level without an Ability Score Improvement, a feat the content does
  // not have, more than one, or one removed. `field` is "full.feat_keys".
  LEVEL_UP_REFUSAL_REASON_FEAT = 22;
  // The character does not meet the feat's prerequisite.
  LEVEL_UP_REFUSAL_REASON_FEAT_PREREQUISITE = 23;
  // A feat, but the table does not use feats (its rule "Talentos"). `field` is
  // "choices.feat_key".
  LEVEL_UP_REFUSAL_REASON_FEATS_NOT_ALLOWED = 24;
  // The new class asks for an ability the character does not have at 13
  // (SRD 5.1, "Multiclassing", "Prerequisites"): class_key, ability, minimum and
  // have say which. A player only; the master's editor may go past it, with the
  // sheet's multiclass_prerequisite issue.
  LEVEL_UP_REFUSAL_REASON_MULTICLASS_PREREQUISITE = 25;
  // A class the character already has asks for an ability the character does not
  // have at 13, so it takes no new class: class_key is the class it has, and
  // ability, minimum and have the missing score.
  LEVEL_UP_REFUSAL_REASON_MULTICLASS_PREREQUISITE_CURRENT = 26;
  // The skill a new class's multiclass table asks for is missing, repeated, one
  // the character already has, or not on the class's list.
  LEVEL_UP_REFUSAL_REASON_PROFICIENCY_CHOICE = 27;
  // The Bard's instrument is missing, unknown, or one the character already has;
  // or an instrument was sent for a class that asks for none.
  LEVEL_UP_REFUSAL_REASON_INSTRUMENT_CHOICE = 28;
  // A choice an earlier level left open is still open (LevelUpOptions.late_choices).
  // `field` is "full.feature_choice_keys".
  LEVEL_UP_REFUSAL_REASON_LATE_CHOICE_MISSING = 29;
  // A swap of a pick was asked where the table does not use the rule, at a level with
  // no Ability Score Improvement, or for a pick or pool option the group does not offer.
  // `field` is "choices.swap_pick".
  LEVEL_UP_REFUSAL_REASON_SWAP_NOT_ALLOWED = 30;
}

// LevelUpRefusal is the first rule the choices break: the sheet field and a
// reason code. It is the detail of LevelUpCharacter's `failed_precondition`,
// and PreviewLevelUp returns it as data.
message LevelUpRefusal {
  // The sheet field, with the CharacterSheet field names, such as
  // "full.extra_ability_bonuses" or "full.cantrip_keys".
  string field = 1;
  LevelUpRefusalReason reason = 2;
  // With SHEET_ISSUE: the Issue code, such as "spell_count" or "spell_level".
  string issue_code = 3;
  // With the MULTICLASS_PREREQUISITE reasons: the class, the ability the
  // character lacks, the score the class asks for and the one the character has.
  // For an "or" prerequisite (the Fighter's), the ability closest to the minimum.
  string class_key = 4;
  meurpg.rules.v1.Ability ability = 5;
  int32 minimum = 6;
  int32 have = 7;
}

// PreviewLevelUpRequest asks for the sheet with the choices applied.
message PreviewLevelUpRequest {
  string campaign_id = 1;
  string character_id = 2;
  // The choices so far, possibly incomplete. A hit points method left
  // UNSPECIFIED previews with the average.
  LevelUpChoices choices = 3;
}

// PreviewLevelUpResponse is the sheet the choices would make.
message PreviewLevelUpResponse {
  // Unset when the choices include one the master archived or, for a player, switched
  // off, whatever the refusal is: such an option is never built into a sheet a player
  // reads.
  // The derived numbers after the level up, as far as the choices go. The
  // app compares it with Character.derived: level, abilities, hit points, hit
  // dice, spell save DC and attack bonus, saves, skills, passive scores,
  // cantrips, slots, prepared spells.
  meurpg.rules.v1.DerivedSheet after = 1;
  // The first rule the choices break, unset when LevelUpCharacter would
  // accept them. An incomplete step shows here (for example CANTRIPS while
  // the new cantrip is not picked).
  LevelUpRefusal refusal = 2;
  // Set when the sheet has more than one class after the level (a new class, or a
  // level of the second): what the summary says about multiclassing. Unset with
  // `after`.
  LevelUpMulticlassSummary multiclass_summary = 3;
}

// LevelUpMulticlassException is one of the exceptions of SRD 5.1, "Multiclassing",
// "Class Features", that the level meets.
enum LevelUpMulticlassException {
  LEVEL_UP_MULTICLASS_EXCEPTION_UNSPECIFIED = 0;
  // The level's Extra Attack does not add to the attacks the character already makes.
  LEVEL_UP_MULTICLASS_EXCEPTION_EXTRA_ATTACK = 1;
  // The level's Channel Divinity gives effects, not uses.
  LEVEL_UP_MULTICLASS_EXCEPTION_CHANNEL_DIVINITY = 2;
  // The level's Unarmored Defense is the second one: the character does not gain it.
  LEVEL_UP_MULTICLASS_EXCEPTION_UNARMORED_DEFENSE = 3;
}

// LevelUpMulticlassSummary is what the summary of a level up on a multiclass sheet
// says beyond the derived numbers: the caster level of the multiclass spellcaster
// table, the proficiencies the level gives, and the exceptions it meets.
message LevelUpMulticlassSummary {
  // The class the level adds to the sheet; empty when the level goes to a class the
  // character already has.
  string new_class_key = 1;
  // The levels in the multiclass spellcaster table (SRD 5.1, "Multiclassing",
  // "Spell Slots") before and after: all the levels of Bard, Cleric, Druid,
  // Sorcerer and Wizard, half (rounded down) of Paladin and Ranger, a third of the
  // Fighter's and Rogue's casting subclasses. Pact Magic does not count.
  int32 caster_level_before = 2;
  int32 caster_level_after = 3;
  // True when more than one class has the Spellcasting feature, so that table gives
  // slots_after; otherwise the slots are those of the one casting class.
  bool slots_by_table = 4;
  // The spell slots per circle after the level (9 entries, the 1st circle first),
  // and the hit dice after it, by die.
  repeated int32 slots_after = 5;
  repeated meurpg.rules.v1.HitDice hit_dice_after = 6;
  // The armor, weapon and tool proficiencies the sheet has after the level and not
  // before, then the skills picked and the instrument (key empty, the name as the
  // sheet lists it).
  repeated LevelUpNamedKey proficiencies_gained = 7;
  repeated LevelUpMulticlassException exceptions = 8;
}

// RollLevelUpHitPointsRequest names the character, and the class if it has
// several.
message RollLevelUpHitPointsRequest {
  string campaign_id = 1;
  string character_id = 2;
  // As in GetLevelUpOptionsRequest.
  string class_key = 3;
  // A UUID the app generates once for the tap, and sends again on a retry.
  // The roll is kept per character, class and level whatever the key, so a
  // second call with another key returns the same roll too.
  string idempotency_key = 4;
}

// RollLevelUpHitPointsResponse is the kept roll.
message RollLevelUpHitPointsResponse {
  // The class's hit die (8 for a d8) and the result, 1 to die.
  int32 die = 1;
  int32 value = 2;
  // False when this call rolled; true when the roll was already there.
  bool already_rolled = 3;
}

// LevelUpCharacterRequest is the guided level-up's "Confirmar o nível N".
message LevelUpCharacterRequest {
  string campaign_id = 1;
  string character_id = 2;
  // The character's revision as the app read it (Character.revision). A
  // different one is `aborted`.
  int32 revision = 3;
  LevelUpChoices choices = 4;
}

// LevelUpCharacterResponse returns the leveled-up character.
message LevelUpCharacterResponse {
  // The character with its new sheet, revision and derived numbers.
  // can_level_up is already false when this was the level it could take.
  Character character = 1;
}

// ListLevelUpsRequest asks for a campaign's level-ups.
message ListLevelUpsRequest {
  string campaign_id = 1;
  // Only this character's level-ups. Empty for the campaign's.
  string character_id = 2;
  // At most this many level-ups: 1 to 50, 20 when 0.
  int32 page_size = 3;
  // The next_page_token of the previous page, to read the next one.
  string page_token = 4;
}

// ListLevelUpsResponse is the master's "O que mudou".
message ListLevelUpsResponse {
  // Newest first.
  repeated LevelUp level_ups = 1;
  // Pass it as page_token to read the next page; empty on the last one.
  string next_page_token = 2;
}

// LevelUp is the record of one guided level-up.
message LevelUp {
  string id = 1;
  string character_id = 2;
  // The character's current name, and its player's display name (empty when
  // the player has not chosen one or left).
  string character_name = 3;
  string player_display_name = 4;
  // The class that gained the level, and its Portuguese name.
  string class_key = 5;
  string class_name_pt = 6;
  // The character's total level before and after ("Subiu para o nível 4").
  int32 from_level = 7;
  int32 to_level = 8;
  // What the player chose. hit_points.value is the number the level took.
  LevelUpChoices choices = 9;
  // The Portuguese name of every content key in choices (spells, features,
  // subclass), by key.
  map<string, string> names_pt = 10;
  // When the player confirmed.
  google.protobuf.Timestamp created_at = 11;
}

// CreatureSource is where a creature came from.
enum CreatureSource {
  CREATURE_SOURCE_UNSPECIFIED = 0;
  // Convocar Familiar: at most one at a time.
  CREATURE_SOURCE_FAMILIAR = 1;
  // Animar Mortos: skeletons and zombies.
  CREATURE_SOURCE_ANIMATE_DEAD = 2;
  // Conjurar Animais: animals that last while the caster concentrates.
  CREATURE_SOURCE_CONJURE_ANIMALS = 3;
  // Given by the master (GiveCreature).
  CREATURE_SOURCE_MASTER = 4;
}

// CharacterCreature is a creature that belongs to a character (MR-037).
message CharacterCreature {
  // Stable ID (a UUID).
  string id = 1;
  // The character it belongs to (a UUID).
  string character_id = 2;
  // The creature it is: an SRD creature, "monster:wolf", or a table creature,
  // "creature:lobo-da-mesa@mesa". The stat block is
  // meurpg.rules.v1.ContentService.GetCreature; the Portuguese name of the
  // kind is below.
  string monster_key = 3;
  // The creature kind's Portuguese name ("Lobo atroz").
  string monster_name_pt = 4;
  // What the table calls it, 1 to 40 characters ("Nanquim").
  string name = 5;
  // Where it came from.
  CreatureSource source = 6;
  // What it may do on its own in a combat (meurpg.play.v1.CreatureAttack, as
  // its number: 1 none, 2 reaction, 3 full). A number, not the enum, so this
  // file does not import the combat's.
  int32 attack = 7;
  // Creatures of one casting share it (a UUID); they share one initiative roll.
  string summon_group_id = 8;
  // Whether it lasts only while the caster concentrates (Conjurar Animais).
  bool depends_on_concentration = 9;
  // Its hit points: only the master and its owner's player get them here.
  int32 hit_points_current = 10;
  int32 hit_points_max = 11;
  // When it was created (the creatures of one casting a microsecond apart, in
  // the order of the casting).
  google.protobuf.Timestamp created_at = 12;
  // Its armor class, worked out from the creature's stat block in the campaign's content
  // (so a table creature's adjusted armor class shows). Like its hit points, only the master and
  // its owner's player get it here; 0 when the creature is not in the content.
  int32 armor_class = 13;
}

// ListCharacterCreaturesRequest names a character.
message ListCharacterCreaturesRequest {
  // The campaign (a UUID).
  string campaign_id = 1;
  // A player's character of the campaign (a UUID).
  string character_id = 2;
}

// ListCharacterCreaturesResponse lists the character's creatures.
message ListCharacterCreaturesResponse {
  // Oldest first. Dismissed creatures are not listed.
  repeated CharacterCreature creatures = 1;
}

// GiveCreatureRequest gives a creature to a character.
message GiveCreatureRequest {
  // The campaign (a UUID).
  string campaign_id = 1;
  // A player's character (a UUID).
  string character_id = 2;
  // An SRD creature's key, "monster:wolf" (ContentService.ListCreatures).
  string monster_key = 3;
  // What to call it, 1 to 40 characters on one line; blank takes the
  // creature's Portuguese name.
  string name = 4;
  // Optional. 1 to 64 characters, chosen once by the app for this action: a retry with the
  // same key and the same request returns what the first call made instead of making another.
  // The key is unique in the campaign; the same key with another request is `invalid_argument`.
  // Empty: the call is not deduplicated. It must be a UUID.
  string idempotency_key = 5;
}

// GiveCreatureResponse returns the new creature.
message GiveCreatureResponse {
  CharacterCreature creature = 1;
}

// RenameCreatureRequest renames a creature.
message RenameCreatureRequest {
  // The campaign (a UUID).
  string campaign_id = 1;
  // The creature (a UUID). If it is in a combat that is not ended, its combatant
  // takes the new name there too.
  string creature_id = 2;
  // The new name: 1 to 40 characters on one line.
  string name = 3;
}

// RenameCreatureResponse returns the creature with its new name.
message RenameCreatureResponse {
  CharacterCreature creature = 1;
}

// DismissCreatureRequest sends a creature away.
message DismissCreatureRequest {
  // The campaign (a UUID).
  string campaign_id = 1;
  // The creature (a UUID).
  string creature_id = 2;
}

// DismissCreatureResponse is empty: the creature is gone from the list.
message DismissCreatureResponse {}

// AdjustCreatureHitPointsRequest corrects a creature's hit points.
message AdjustCreatureHitPointsRequest {
  // The campaign (a UUID).
  string campaign_id = 1;
  // The creature (a UUID).
  string creature_id = 2;
  // Exactly one.
  oneof change {
    // Damage taken: 0 to 9999; the hit points stop at 0.
    int32 damage = 3;
    // Healing: 0 to 9999; the hit points stop at the maximum.
    int32 heal = 4;
    // The hit points themselves, 0 to the maximum.
    int32 hit_points = 5;
  }
}

// AdjustCreatureHitPointsResponse returns the creature after the correction.
// A creature taken to 0 is dismissed: it is unset then.
message AdjustCreatureHitPointsResponse {
  CharacterCreature creature = 1;
}

// ListWildShapeFormsRequest names a character.
message ListWildShapeFormsRequest {
  // The campaign (a UUID).
  string campaign_id = 1;
  // A player's character of the campaign (a UUID).
  string character_id = 2;
}

// ListWildShapeFormsResponse lists the beasts the character may become.
message ListWildShapeFormsResponse {
  // The beasts, by Portuguese name; empty when the character has no Wild Shape.
  repeated meurpg.rules.v1.CreatureSummary forms = 1;
  // The limit that decided the list: the highest challenge rating ("1/4"), and
  // whether the fly and the swim speed are left out. Empty and false when there
  // is no Wild Shape.
  string max_cr = 2;
  bool no_fly = 3;
  bool no_swim = 4;
}

// GetSummonOptionsRequest names a character.
message GetSummonOptionsRequest {
  // The campaign (a UUID).
  string campaign_id = 1;
  // A player's character of the campaign (a UUID).
  string character_id = 2;
}

// GetSummonOptionsResponse is what the character can summon.
message GetSummonOptionsResponse {
  // The summoning spells the character can cast, lowest circle first.
  repeated SummonSpellOptions spells = 1;
  // The character's spell slots, lowest circle first, pact magic slots
  // (`pact`) included: the casting sheet's "Espaço de magia a gastar".
  repeated SummonSlot slots = 2;
}

// SummonSpellOptions is one summoning spell the character can cast.
message SummonSpellOptions {
  // The spell, "spell:find-familiar", "spell:animate-dead" or
  // "spell:conjure-animals".
  string spell_key = 1;
  // Its Portuguese name ("Convocar Familiar").
  string name_pt = 2;
  // The spell's own circle, 1 to 9.
  int32 level = 3;
  // How long it takes, in Portuguese ("1 hora", "1 minuto", "1 ação").
  string casting_time_pt = 4;
  // Whether the spell is a ritual and whether it needs concentration.
  bool ritual = 5;
  bool concentration = 6;
  // Whether this character can cast it as a ritual (no slot): a wizard from the
  // spellbook, another caster from its prepared list, a warlock with the Pact
  // of the Chain for Convocar Familiar. Always false for a spell that is not a
  // ritual.
  bool can_ritual = 7;
  // Whether this character can cast it with a slot: the spell is on the sheet and
  // ready (prepared, or a spell its class knows).
  bool can_cast_with_slot = 8;
  // What it may bring at each circle the character can cast it at: the spell's own
  // circle when `can_ritual`, and each circle of a slot the character has
  // from the spell's up. Lowest first.
  repeated SummonCircle circles = 9;
  // What a casting would send away: the character's familiar for Encontrar
  // Familiar, and the creatures a previous concentration holds for a spell that
  // needs concentration (a new casting ends it, RN-22). Empty when nothing goes.
  repeated ReplacedCreature replaces = 10;
}

// SummonCircle is what a spell may bring at one circle.
message SummonCircle {
  // The circle of the slot (the spell's own for a ritual), 1 to 9.
  int32 circle = 1;
  // The options, in the order `SummonChoice.option` counts them from 0.
  repeated SummonOption options = 2;
}

// SummonOption is one thing a casting may summon: `count` creatures, each one
// of `forms`, or, when there are no forms, any creature of `type` whose
// challenge rating is `max_cr` or lower. A casting picks the kind of each
// creature on its own (`SummonChoice.creature_keys`), so a mixed set (two
// skeletons and a zombie) is allowed.
message SummonOption {
  // How many creatures, already counting the circle (Conjurar Animais doubles at
  // the 5th, Animar Mortos adds two for each circle above the 3rd).
  int32 count = 1;
  // The creatures a casting may choose from. Empty when `type` and `max_cr`
  // say it.
  repeated SummonForm forms = 2;
  // The SRD's creature type ("beast") and the highest challenge rating ("1/2")
  // of an option with no forms: the creatures come from
  // ContentService.ListCreatures with these filters.
  string type = 3;
  string max_cr = 4;
  // What a creature of this option may do on its own in a combat
  // (meurpg.play.v1.CreatureAttack, as its number: 1 none, 2 reaction, 3 full).
  // For an option with forms, each form says its own.
  int32 attack = 5;
}

// SummonForm is a creature a casting may choose.
message SummonForm {
  // The SRD creature, "monster:raven" (ContentService.GetCreature).
  string monster_key = 1;
  // Its Portuguese name ("Corvo").
  string name_pt = 2;
  // What it may do on its own in a combat, as SummonOption.attack.
  int32 attack = 3;
}

// SummonSlot is one circle of the character's spell slots.
message SummonSlot {
  // The circle, 1 to 9 (the pact slots' level for pact magic).
  int32 level = 1;
  // True for a warlock's pact magic slots: they are all one circle and are cast
  // with `SpellSlot.pact`.
  bool pact = 2;
  // How many of this circle the character has, and how many are free.
  int32 total = 3;
  int32 free = 4;
}

// ReplacedCreature is a creature a casting would send away.
message ReplacedCreature {
  // The creature (a UUID) and the name the table gave it.
  string id = 1;
  string name = 2;
  // The SRD creature kind, "monster:dire-wolf", and its Portuguese name.
  string monster_key = 3;
  string monster_name_pt = 4;
}

// ChoiceOrigin says where a group of choices comes from.
enum ChoiceOrigin {
  CHOICE_ORIGIN_UNSPECIFIED = 0;
  // The race, or the subrace.
  CHOICE_ORIGIN_RACE = 1;
  // A class.
  CHOICE_ORIGIN_CLASS = 2;
  // A class's subclass.
  CHOICE_ORIGIN_SUBCLASS = 3;
  // The background (a background that grants a feat of the player's choice).
  CHOICE_ORIGIN_BACKGROUND = 4;
  // A feat the sheet has, when it grants another feat to choose.
  CHOICE_ORIGIN_FEAT = 5;
}

// ChoiceKind says how a choice is made, so the app draws the right control.
enum ChoiceKind {
  CHOICE_KIND_UNSPECIFIED = 0;
  // Options of a feature or trait, or a fixed list (a terrain): a group of radio
  // buttons for one pick, of check boxes for several.
  CHOICE_KIND_OPTIONS = 1;
  // Abilities (the half-elf's +1 to two).
  CHOICE_KIND_ABILITIES = 2;
  // The type of a favored enemy; the option with needs_text takes the two humanoid
  // races as text.
  CHOICE_KIND_ENEMY = 3;
  // A language, or none.
  CHOICE_KIND_LANGUAGE = 4;
  // Spells (a bonus cantrip, the Pact of the Tome's cantrips, an arcanum).
  CHOICE_KIND_SPELLS = 5;
}

// ChoicePrerequisiteKind is what an option asks for.
enum ChoicePrerequisiteKind {
  CHOICE_PREREQUISITE_KIND_UNSPECIFIED = 0;
  // A level of the class.
  CHOICE_PREREQUISITE_KIND_LEVEL = 1;
  // A cantrip the sheet knows.
  CHOICE_PREREQUISITE_KIND_SPELL = 2;
  // A Pact Boon.
  CHOICE_PREREQUISITE_KIND_FEATURE = 3;
  // Not a prerequisite of the option: another choice of the sheet already took it
  // (a style, a terrain or an enemy is taken once).
  CHOICE_PREREQUISITE_KIND_TAKEN = 4;
}

// ChoicePrerequisite is one thing an option asks for.
message ChoicePrerequisite {
  ChoicePrerequisiteKind kind = 1;
  // The spell or feature key required; empty for a level.
  string key = 2;
  // The class level required; 0 for the others.
  int32 level = 3;
  bool met = 4;
  // What is missing, in Portuguese; empty when met.
  string reason_pt = 5;
  // The Portuguese name of the spell or the feature required ("Rajada Mística");
  // empty for a level.
  string name_pt = 6;
}

// ChoiceCircleSpell is a spell a Land druid's terrain gives, at a druid level.
message ChoiceCircleSpell {
  int32 level = 1;
  string spell_key = 2;
  string name_pt = 3;
  // True when the druid's level is at least `level`.
  bool reached = 4;
}

// ChoiceOption is one option of a choice.
message ChoiceOption {
  // The option's own key ("feature:fighter-fighting-style-defense", "terrain:forest",
  // "ability:dex", "spell:guidance", "language:none").
  string key = 1;
  // What the sheet stores for it in feature_choice_keys: the key itself for an option
  // of a feature or trait, "<choice key>=<key>" for the others.
  string stored_key = 2;
  string name_pt = 3;
  // The rule in one line, in Portuguese; empty when the name says it all.
  string summary_pt = 4;
  repeated ChoicePrerequisite prerequisites = 5;
  // Why the option cannot be taken now, in one sentence; empty when it can. The option
  // stays in the list, blocked, with this reason.
  string reason_pt = 6;
  // The spells a Land druid's terrain gives.
  repeated ChoiceCircleSpell circle_spells = 7;
  // For a spell: its circle (0 for a cantrip), school and the classes whose list has
  // it, in Portuguese.
  int32 spell_level = 8;
  string school_pt = 9;
  repeated string classes_pt = 10;
  // True for the option that takes free text (the two humanoid races).
  bool needs_text = 11;
}

// Choice is one thing the sheet asks the player to pick.
message Choice {
  // Identifies the choice on the sheet: the feature or trait it answers, with "#<part>"
  // when a feature asks for several things. CompleteCharacterChoices names it.
  string key = 1;
  // The feature, trait or race it belongs to.
  string feature_key = 2;
  ChoiceKind kind = 3;
  // The title ("Estilo de Luta"), the part of a feature that asks for several things
  // ("Tipo de inimigo", "Idioma que falam"), and how a sentence about what is
  // missing calls it ("Estilo de Luta (Guerreiro, nível 1)").
  string title_pt = 4;
  string part_pt = 5;
  string label_pt = 6;
  // A line of help under the title.
  string hint_pt = 7;
  // The class level the choice came at; 0 for a race's.
  int32 level = 8;
  // How many selections it takes.
  int32 picks = 9;
  // The selections made, as option keys, in the order of the options.
  repeated string picked = 10;
  // The free texts of the humanoid favored enemy; empty for every other choice.
  repeated string texts = 11;
  repeated ChoiceOption options = 12;
  // What the picks give, with the numbers of this sheet (the breath weapon with its
  // DC, the abilities' new scores); empty while nothing is picked.
  string result_pt = 13;
  // The picked options whose prerequisites are not met, and the picks past what the
  // choice takes or that it does not offer.
  repeated string unmet = 14;
  repeated string overflow = 15;
  // How many selections are still to make.
  int32 missing = 16;
  // True for the choices that only warn while open: the languages and the tools a race,
  // a trait, a background or a feature lets the player pick. They count as pending (the
  // step marks them, a locked sheet and the master's list count them) but a player's sheet
  // is saved with them open, as it always was (RN-33).
  bool advisory = 17;
}

// ChoiceGroup is the choices one source asks at one level.
message ChoiceGroup {
  ChoiceOrigin origin = 1;
  // The race, subrace, class or subclass key and its Portuguese name.
  string source_key = 2;
  string source_name_pt = 3;
  // The class level of the group; 0 for a race.
  int32 level = 4;
  repeated Choice choices = 5;
  // The class's Portuguese name for a class or a subclass group ("Patrulheiro" for
  // the Hunter); empty for a race.
  string class_name_pt = 6;
}

// ChoiceSpellSource is where a casting class's spell picker finds the spells that are
// not on the class list.
message ChoiceSpellSource {
  string class_key = 1;
  // The spells the patron adds to the class list (The Fiend's Expanded Spell List),
  // with the class level they come at; the picker marks them "Do patrono".
  repeated ChoicePatronSpell patron_spells = 2;
  // How many known spells may come from any class's list (the Bard's Magical
  // Secrets, 2 each at levels 10, 14 and 18; the College of Lore's Additional Magical
  // Secrets, 2 at level 6, which are beyond the number of spells known).
  int32 secrets = 3;
  // Of those, how many are beyond the number of spells known.
  int32 secrets_beyond_known = 4;
  // The highest circle of a secret: the highest the class casts.
  int32 secrets_max_spell_level = 5;
}

// ChoicePatronSpell is a spell the patron adds to the class list.
message ChoicePatronSpell {
  string spell_key = 1;
  int32 class_level = 2;
}

// PreviewChoicesRequest is the sheet whose choices to read.
message PreviewChoicesRequest {
  string campaign_id = 1;
  // The character being edited or completed. Empty when creating.
  string character_id = 2;
  // Required when creating; ignored with a character_id.
  CharacterKind kind = 3;
  // The draft the editor builds. With a character_id it may be left out: the stored
  // sheet is read.
  CharacterSheet sheet = 4;
}

// PreviewChoicesResponse is the choices the sheet asks.
message PreviewChoicesResponse {
  // The groups, the race first, then each class from its lowest level, a class before its
  // subclass at the same level. Empty when the sheet asks nothing (a human rogue 1): the
  // editor has no step for it.
  repeated ChoiceGroup groups = 1;
  // "Escolhas feitas: done de total": every selection counts (a favored enemy's type
  // and language are two, each invocation one).
  int32 done = 2;
  int32 total = 3;
  // The picks the sheet stores that no choice of it offers.
  repeated string not_offered = 4;
  // For each casting class, the spells outside its list.
  repeated ChoiceSpellSource spell_sources = 5;
}

// ChoicePick is the player's answer to one choice.
message ChoicePick {
  // Choice.key.
  string choice_key = 1;
  // The option keys picked (ChoiceOption.key).
  repeated string option_keys = 2;
  // The free texts, in order, for the option that takes them.
  repeated string texts = 3;
}

// CompleteCharacterChoicesRequest answers the open choices of a character.
message CompleteCharacterChoicesRequest {
  string campaign_id = 1;
  string character_id = 2;
  // The character's revision as the app read it. A different one is `aborted`.
  int32 expected_revision = 3;
  // The picks, one for each open choice the player answers. At most 50.
  repeated ChoicePick picks = 4;
}

// CompleteCharacterChoicesResponse returns the character with the choices made.
message CompleteCharacterChoicesResponse {
  // The character with its new revision and derived numbers.
  Character character = 1;
}

// ChoiceRefusalReason says why the rules refuse a pick, so the app shows its own copy.
enum ChoiceRefusalReason {
  CHOICE_REFUSAL_REASON_UNSPECIFIED = 0;
  // CreateCharacter or UpdateCharacter of a player's character with a choice still
  // open. The master's NPCs and the master's edits of a locked sheet are not refused.
  CHOICE_REFUSAL_REASON_CHOICES_MISSING = 1;
  // An option whose prerequisite is not met (a level, a cantrip, a Pact Boon).
  CHOICE_REFUSAL_REASON_PREREQUISITE_UNMET = 2;
  // A pick that no choice of the sheet offers, or past the number a choice takes.
  CHOICE_REFUSAL_REASON_CHOICE_NOT_OFFERED = 3;
  // CompleteCharacterChoices on a choice that is already made.
  CHOICE_REFUSAL_REASON_CHOICE_ALREADY_MADE = 4;
  // CompleteCharacterChoices on a choice the sheet does not have open.
  CHOICE_REFUSAL_REASON_CHOICE_NOT_OPEN = 5;
}

// ChoiceIssue is one pick the rules refuse.
message ChoiceIssue {
  // The sheet field ("sheet.full.feature_choice_keys").
  string field = 1;
  // Choice.key, when the issue is about a choice.
  string choice_key = 2;
  // The option key it is about, when it is about one.
  string option_key = 3;
  // How many selections were made and how many the choice takes.
  int32 picked = 4;
  int32 required = 5;
  // How the choice is called in a sentence ("Estilo de Luta (Guerreiro, nível 1)").
  string label_pt = 6;
}

// ChoiceRefusal is the error detail of `failed_precondition` for a pick the rules
// refuse: CreateCharacter, UpdateCharacter and CompleteCharacterChoices.
message ChoiceRefusal {
  ChoiceRefusalReason reason = 1;
  repeated ChoiceIssue issues = 2;
}

// GetCampaignOpenChoicesRequest names the campaign.
message GetCampaignOpenChoicesRequest {
  string campaign_id = 1;
}

// GetCampaignOpenChoicesResponse lists the characters with choices still open.
message GetCampaignOpenChoicesResponse {
  repeated OpenChoicesCharacter characters = 1;
}

// OpenChoicesCharacter is a living player character with choices still open.
message OpenChoicesCharacter {
  string character_id = 1;
  string name = 2;
  // How many selections are open.
  int32 pending_count = 3;
  // What is open, in Portuguese, one label for each choice ("Estilo de Luta
  // (Patrulheiro, nível 2)").
  repeated string labels_pt = 4;
}
