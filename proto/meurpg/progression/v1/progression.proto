syntax = "proto3";

// Package meurpg.progression.v1 is about how the characters grow (MR-016,
// RN-09, RN-12): the XP the master gives the party, the milestones the master
// marks, the history of both, and who can go up a level.
package meurpg.progression.v1;

import "google/protobuf/timestamp.proto";
import "meurpg/campaigns/v1/campaigns.proto";
import "meurpg/characters/v1/characters.proto";

// ProgressionService gives experience to the party and keeps its history.
//
// How the campaign levels (RN-09) is set when it is created
// (campaigns.v1.XpMode), and the service follows it:
//   - ENEMIES: the master gives the XP of a combat's defeated NPCs
//     (XP_AWARD_MODE_ENEMIES) or any amount the master wants (MANUAL).
//   - GOLD: the master gives 1 XP per gold piece the group found (GOLD), or
//     any amount (MANUAL).
//   - MILESTONES: there is no XP to count. The master writes the campaign's
//     milestones ahead of time (AddMilestone), marks one reached
//     (MarkMilestoneReached) and every character the master picks "can level
//     up". A milestone that was not planned is still marked with
//     MarkMilestone.
// A call that does not fit the campaign's mode is `failed_precondition`
// (XPBlocked, MODE_NOT_ALLOWED).
//
// An award adds each character's share to the XP on its sheet
// (characters.v1.FullSheet.experience_points) in the same transaction, even
// when the sheet is locked (RN-01): the master's gift is not the player's
// edit. When the campaign has an open session, the award is also a
// session_events row and every WatchGameSession stream gets `xp_changed`
// (ADR-0007). The XP of a character is never typed by the player after the
// sheet locked: only awards change it.
//
// Who may call what: the master gives, marks, plans milestones and undoes;
// every member of the campaign reads the history and everyone's XP (question
// 50). The XP an NPC gives never reaches a player (RN-20), and a planned
// milestone that was not reached is the master's alone: ListMilestones gives
// a player only the reached ones.
//
// Every method needs a valid session cookie and fails with `unauthenticated`
// without one. For a campaign the caller is not a member of (a pending member
// neither, RN-15), methods answer `not_found`, exactly as for a campaign that
// does not exist; a player calling a method only the master may call gets
// `permission_denied`. An ID that is not a UUID is answered like an ID that
// does not exist, except in a list of characters, where it is
// `invalid_argument`.
//
// Every write takes an idempotency_key, a UUID the app generates once for the
// action and sends again on a retry: a second call with the same key changes
// nothing and answers with what the first one did.
//
// Errors every method can return, besides those listed on each method:
//   - `unauthenticated`: no valid session cookie.
//   - `invalid_argument`: a field breaks its documented rules. The message
//     names the field, never its value.
//   - `unavailable`: the database did not answer; the app may try again.
//   - `aborted`: the database kept reporting a conflicting transaction after
//     the server's retries; the app may try again.
//
// Responses carry `Cache-Control: no-store`. Every request carries a campaign
// ID, so reads are IDEMPOTENT and POST-only: a GET would put the ID in the URL,
// and URLs end up in the platform's request logs (docs/privacy.md).
service ProgressionService {
  // AwardXP gives experience to some characters of the campaign. Only the
  // master may call it.
  //
  // The total is the sum of the defeated NPCs' XP (ENEMIES: the encounter must
  // be ENDED, and it can be given once, unless the award is undone), the gold
  // (GOLD: 1 XP per gold piece), or the amount (MANUAL). Each character gets
  // total / number of characters, rounded down (question 46): the XP that
  // does not split is lost, and the response says how much (`lost_xp`).
  // Their sheets' XP goes up, to at most 1,000,000.
  //
  // character_ids are living player characters of the campaign, with no
  // repeat. A sheet's XP is a number the master may also set by hand on the
  // sheet; the award only adds to it.
  //
  // "Voltar à cidade" (MR-041, RN-09): a GOLD award may name the treasures
  // the party found (treasure_point_ids, from ListTreasuresToConvert) instead
  // of a typed `gold`. The server sums their PO itself (1 XP per PO), splits
  // as above and, in the same transaction, links each treasure to the award:
  // a treasure is converted once, even when two awards race. Undoing the award
  // (UndoLastXPAward) frees them again. The award, the history and the
  // `xp_awarded` event carry the treasures (their IDs and PO).
  //
  // Errors:
  //   - `not_found`: the campaign, or the encounter, does not exist, or the
  //     caller is not a member; a treasure that is not a treasure of the
  //     campaign.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: no characters, a repeat, an ID that is not a UUID,
  //     a reason outside 1 to 120 characters, a field that does not go with
  //     the mode (a gold amount for ENEMIES), or an amount or gold outside 1
  //     to 1,000,000; treasure_point_ids with a mode other than GOLD, with
  //     `gold`, or with a repeat or more than 100 treasures.
  //   - `failed_precondition` (XPBlocked): MODE_NOT_ALLOWED, ENCOUNTER_NOT_ENDED,
  //     ALREADY_AWARDED, NOTHING_TO_GIVE (the total is 0, or too small to give
  //     each one 1 XP), CHARACTER_NOT_ELIGIBLE (a dead or pending character,
  //     an NPC, or another campaign's), TREASURE_NOT_FOUND_YET and
  //     TREASURE_ALREADY_CONVERTED (`treasure_point_id` says which), and
  //     TREASURES_OVER_LIMIT (worth more than 1,000,000 PO together).
  rpc AwardXP(AwardXPRequest) returns (AwardXPResponse);

  // ListTreasuresToConvert lists the campaign's treasures that were found and
  // not converted yet, for "Voltar à cidade" (MR-041): oldest find first. Only
  // the master may call it: the list is the input of AwardXP's
  // treasure_point_ids. It lists them in every XP mode (the treasures belong to
  // the map), but only a GOLD campaign converts them.
  //
  // At most 100 treasures come (the most one conversion takes), the oldest
  // finds; `total` says how many there are.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a member.
  //   - `permission_denied`: the caller is a player.
  rpc ListTreasuresToConvert(ListTreasuresToConvertRequest) returns (ListTreasuresToConvertResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // MarkMilestone marks a milestone: the characters it names "can level up"
  // (RN-12, question 48), and no XP is counted. Only the master may call it,
  // and only in a MILESTONES campaign. The mark lasts until the character's
  // level on the sheet goes up (GetCharacter's `can_level_up`).
  //
  // Errors: as AwardXP, with MODE_NOT_ALLOWED for a campaign that counts XP.
  rpc MarkMilestone(MarkMilestoneRequest) returns (MarkMilestoneResponse);

  // ListMilestones lists the campaign's milestones (MR-016, question 45): the
  // planned ones, in the master's order, and the reached ones, among them
  // those marked off the list (MarkMilestone), last, oldest first. The master
  // gets every milestone; a player gets only the reached ones, with when and
  // for whom, like the XP history (question 50), and never learns that others
  // are planned. A campaign that counts XP has none. Any member may call it.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a member.
  rpc ListMilestones(ListMilestonesRequest) returns (ListMilestonesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // AddMilestone writes one more milestone in the campaign's list, last. Only
  // the master may call it, and only in a MILESTONES campaign. The master's
  // list is saved one change at a time, like the scene clues
  // (maps.v1.MapService.AddSceneClue).
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a member.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: text is empty or longer than 120 characters.
  //   - `failed_precondition` (XPBlocked): MODE_NOT_ALLOWED, for a campaign
  //     that counts XP.
  //   - `resource_exhausted`: the campaign already has 100 milestones (the
  //     reached ones count).
  //
  // Safe to retry when the request carries an idempotency_key: a second call with the same key and
  // the same request returns what the first one made and makes nothing; the same key with another
  // request is `invalid_argument`. Without a key the call is not deduplicated.
  rpc AddMilestone(AddMilestoneRequest) returns (AddMilestoneResponse);

  // UpdateMilestone changes the text of a milestone that is still planned.
  // Only the master may call it. A reached milestone keeps the text it was
  // marked with: it is never edited.
  //
  // Errors:
  //   - `not_found`: the milestone is not in this campaign, the campaign does
  //     not exist, or the caller is not a member.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: text is empty or longer than 120 characters.
  //   - `failed_precondition` (XPBlocked): MILESTONE_ALREADY_REACHED, or
  //     MODE_NOT_ALLOWED for a campaign that counts XP (as every milestone
  //     write: AddMilestone, UpdateMilestone, MoveMilestone, RemoveMilestone,
  //     MarkMilestoneReached and GiveMilestoneTo).
  rpc UpdateMilestone(UpdateMilestoneRequest) returns (UpdateMilestoneResponse);

  // MoveMilestone moves a planned milestone one place up or down among the
  // planned ones (the reached ones are skipped, and keep their place for when
  // an undo makes them planned again). Moving the first one up, or the last
  // one down, changes nothing. Only the master may call it.
  //
  // Errors:
  //   - `invalid_argument`: direction is unspecified.
  //   - `not_found`, `permission_denied`, `failed_precondition`: as
  //     UpdateMilestone.
  rpc MoveMilestone(MoveMilestoneRequest) returns (MoveMilestoneResponse);

  // RemoveMilestone takes a planned milestone off the list, with no
  // confirmation from the server (the app asks). Only the master may call it.
  // A reached milestone is never removed, only undone (UndoLastXPAward), and
  // one that was reached once and undone is not removed either: its awards
  // stay in the history, which is never rewritten (ADR-0007), so the refusal
  // is MILESTONE_HAS_HISTORY.
  //
  // Errors: as UpdateMilestone, without `invalid_argument`, and
  // `failed_precondition` (XPBlocked) MILESTONE_HAS_HISTORY.
  rpc RemoveMilestone(RemoveMilestoneRequest) returns (RemoveMilestoneResponse);

  // MarkMilestoneReached marks a planned milestone reached: the characters it
  // names "can level up" (RN-12), as with MarkMilestone, and the award is
  // linked to the milestone, with the milestone's text as its reason. Only the
  // master may call it, and only in a MILESTONES campaign. Milestones may be
  // reached in any order. A milestone is reached once: to give it to someone
  // else, GiveMilestoneTo. When the campaign has an open session, the
  // award is also a session event and the streams get `xp_changed`.
  //
  // A retried idempotency_key must carry the same milestone and characters:
  // otherwise `invalid_argument`.
  //
  // Errors: as MarkMilestone, and:
  //   - `not_found`: the milestone is not in this campaign.
  //   - `failed_precondition` (XPBlocked): MILESTONE_ALREADY_REACHED.
  rpc MarkMilestoneReached(MarkMilestoneReachedRequest) returns (MarkMilestoneReachedResponse);

  // GiveMilestoneTo gives a milestone that was already reached to characters
  // that were left out or arrived late ("Dar a mais alguém"): a new award on
  // those characters, linked to the same milestone, recorded in the history
  // with its own date. The milestone stays one. Only the master may call it.
  //
  // Errors: as MarkMilestoneReached, with MILESTONE_NOT_REACHED instead of
  // MILESTONE_ALREADY_REACHED, and CHARACTER_ALREADY_MARKED for a character
  // that already has this milestone.
  rpc GiveMilestoneTo(GiveMilestoneToRequest) returns (GiveMilestoneToResponse);

  // UndoLastXPAward takes back the latest award that is not undone: every
  // share is subtracted from its character's sheet (never below 0), or the
  // milestone's marks are cleared. Only the master may call it. The award stays
  // in the history, marked as undone, with who undid it and when: the history
  // is never rewritten (ADR-0007). Only the last one can be undone: to take
  // back an earlier one, undo the later ones first.
  //
  // For a planned milestone (MarkMilestoneReached, GiveMilestoneTo), undoing
  // its only mark makes it planned again, in the same place of the list;
  // undoing a "Dar a mais alguém" mark takes the milestone off those
  // characters only, and it stays reached for the others.
  //
  // For a "Voltar à cidade" award (AwardXP with treasure_point_ids), undoing it
  // also frees its treasures, in the same transaction: they are "found, not
  // converted" again. A treasure converted by an award that is no longer the
  // last stays converted until that award is undone.
  //
  // expected_award_id, when set, is the award the app shows as the last one: if
  // another is the last now, the call changes nothing and fails with `aborted`.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a member.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition` (XPBlocked): NOTHING_TO_UNDO.
  //   - `aborted`: expected_award_id is not the last award.
  rpc UndoLastXPAward(UndoLastXPAwardRequest) returns (UndoLastXPAwardResponse);

  // ListXPAwards lists the campaign's awards, newest first, undone ones
  // included. Any member may call it (question 50).
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a member.
  rpc ListXPAwards(ListXPAwardsRequest) returns (ListXPAwardsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // GetCampaignExperience returns each living player character with its XP,
  // level, the XP of the next level and whether it can level up (RN-12). Any
  // member may call it.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a member.
  rpc GetCampaignExperience(GetCampaignExperienceRequest) returns (GetCampaignExperienceResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// XPAwardMode is where an award's XP came from.
enum XPAwardMode {
  XP_AWARD_MODE_UNSPECIFIED = 0;
  // The XP of the defeated NPCs of an ended combat.
  XP_AWARD_MODE_ENEMIES = 1;
  // 1 XP per gold piece the group found.
  XP_AWARD_MODE_GOLD = 2;
  // An amount the master typed, at any time.
  XP_AWARD_MODE_MANUAL = 3;
  // A milestone: no XP, the characters can level up.
  XP_AWARD_MODE_MILESTONE = 4;
}

// XPBlockedReason says why an XP call cannot be done now.
enum XPBlockedReason {
  XP_BLOCKED_REASON_UNSPECIFIED = 0;
  // The campaign's XP mode does not take this: ENEMIES campaigns take
  // ENEMIES and MANUAL awards, GOLD campaigns GOLD and MANUAL, and
  // MILESTONES campaigns only MarkMilestone.
  XP_BLOCKED_REASON_MODE_NOT_ALLOWED = 1;
  // An ENEMIES award for a combat that has not ended.
  XP_BLOCKED_REASON_ENCOUNTER_NOT_ENDED = 2;
  // The combat's XP was already given (and not undone).
  XP_BLOCKED_REASON_ALREADY_AWARDED = 3;
  // There is no XP to give: the total is 0, or each one would get 0.
  XP_BLOCKED_REASON_NOTHING_TO_GIVE = 4;
  // UndoLastXPAward with no award to undo.
  XP_BLOCKED_REASON_NOTHING_TO_UNDO = 5;
  // A character that is not a living player character of the campaign.
  XP_BLOCKED_REASON_CHARACTER_NOT_ELIGIBLE = 6;
  // The milestone was already reached (MarkMilestoneReached), or is reached
  // and so cannot be edited, moved or removed.
  XP_BLOCKED_REASON_MILESTONE_ALREADY_REACHED = 7;
  // GiveMilestoneTo for a milestone that is not reached.
  XP_BLOCKED_REASON_MILESTONE_NOT_REACHED = 8;
  // GiveMilestoneTo for a character that already has the milestone (in
  // `character_id`).
  XP_BLOCKED_REASON_CHARACTER_ALREADY_MARKED = 9;
  // RemoveMilestone for a milestone that was reached before (all its marks
  // undone): its awards stay in the history, which is never rewritten, so
  // the milestone stays too, planned again.
  XP_BLOCKED_REASON_MILESTONE_HAS_HISTORY = 10;
  // AwardXP with a treasure the party has not found (or whose find the master
  // unmarked): `treasure_point_id` says which.
  XP_BLOCKED_REASON_TREASURE_NOT_FOUND_YET = 11;
  // AwardXP with a treasure that an award that is not undone already
  // converted: `treasure_point_id` says which. It is free again when that
  // award is the last one and the master undoes it.
  XP_BLOCKED_REASON_TREASURE_ALREADY_CONVERTED = 12;
  // AwardXP with treasures worth more than 1,000,000 PO together (a sheet
  // holds at most that much XP): convert fewer of them.
  XP_BLOCKED_REASON_TREASURES_OVER_LIMIT = 13;
}

// XPBlocked is the error detail of ProgressionService's
// `failed_precondition`, so the app can show a clear message.
message XPBlocked {
  XPBlockedReason reason = 1;
  // For CHARACTER_NOT_ELIGIBLE and CHARACTER_ALREADY_MARKED, the character (a
  // UUID).
  string character_id = 2;
  // For MODE_NOT_ALLOWED, the campaign's XP mode.
  meurpg.campaigns.v1.XpMode xp_mode = 3;
  // For TREASURE_NOT_FOUND_YET and TREASURE_ALREADY_CONVERTED, the treasure's
  // point (a UUID).
  string treasure_point_id = 4;
}

// XPShare is what one character got from an award.
message XPShare {
  // The character (a UUID).
  string character_id = 1;
  // Its name now.
  string character_name = 2;
  // The XP it got; 0 for a milestone.
  int32 xp = 3;
}

// XPAward is one entry of the XP history.
message XPAward {
  // Stable award ID (a UUID).
  string id = 1;
  XPAwardMode mode = 2;
  // What the master wrote: 1 to 120 characters. Every member reads it.
  string reason = 3;
  // The master who gave it (a UUID), empty if that account was deleted, and
  // that master's display name.
  string given_by_user_id = 4;
  string given_by_display_name = 5;
  google.protobuf.Timestamp created_at = 6;
  // The combat of an ENEMIES award (a UUID) and its name; empty for the rest,
  // and for a combat that was deleted.
  string encounter_id = 7;
  string encounter_name = 8;
  // The gold of a GOLD award; 0 for the rest.
  int32 gold = 9;
  // The XP that was split: 0 for a milestone.
  int32 total_xp = 10;
  // Who got what, in the order of the characters' creation. For a milestone,
  // the characters marked, with 0 XP each.
  repeated XPShare shares = 11;
  // Whether the master undid it, when and who (that master's display name).
  bool undone = 12;
  google.protobuf.Timestamp undone_at = 13;
  string undone_by_display_name = 14;
  // Whether the caller may undo it now: the master, for the latest award that
  // is not undone.
  bool can_undo = 15;
  // The treasures a "Voltar à cidade" award converted, in a stable order (by
  // ID); empty for the rest. Only the master gets the list (RN-10: a player
  // never learns which treasures, nor each one's PO, only how many and the
  // total). The list stays after an undo (the history is never rewritten),
  // though the treasures are free again then.
  repeated XPAwardTreasure treasures = 16;
  // How many treasures the award converted, for everyone who reads the
  // history; `gold` is their PO together ("Voltar à cidade: 3 tesouros,
  // 420 PO"). 0 for an award that converted none.
  int32 treasure_count = 17;
}

// XPAwardTreasure is one treasure converted by an award: IDs and numbers only.
message XPAwardTreasure {
  // The treasure's map point (a UUID).
  string point_id = 1;
  // Its worth when it was converted, in gold pieces.
  int32 value_po = 2;
}

message AwardXPRequest {
  string campaign_id = 1;
  // ENEMIES, GOLD or MANUAL (not MILESTONE: see MarkMilestone).
  XPAwardMode mode = 2;
  // What happened, 1 to 120 characters, one line.
  string reason = 3;
  // ENEMIES only: the ended combat (a UUID).
  string encounter_id = 4;
  // MANUAL only: the XP to split, 1 to 1,000,000.
  int32 amount = 5;
  // GOLD only: the gold pieces the group found, 1 to 1,000,000. Empty (0) when
  // treasure_point_ids is sent.
  int32 gold = 6;
  // Who gets it: 1 to 40 living player characters of the campaign (UUIDs), no
  // repeat.
  repeated string character_ids = 7;
  // A UUID the app generates once for this award and sends again on a retry.
  string idempotency_key = 8;
  // GOLD only, "Voltar à cidade" (MR-041): the found treasures to convert, 1
  // to 100 map point IDs (UUIDs) from ListTreasuresToConvert, no repeat.
  // `gold` must then be empty: the server sums the treasures' PO. Only in a
  // campaign that levels by gold.
  repeated string treasure_point_ids = 9;
}

message AwardXPResponse {
  // The award, as the history shows it.
  XPAward award = 1;
  // What each character got.
  int32 xp_each = 2;
  // The XP that did not split among the characters (total modulo their number).
  int32 lost_xp = 3;
  // The treasures the award converted (the same list as award.treasures; the
  // master is the only caller of AwardXP); empty when it converted none.
  repeated XPAwardTreasure treasures = 4;
}

// ListTreasuresToConvertRequest names the campaign.
message ListTreasuresToConvertRequest {
  string campaign_id = 1;
}

// ListTreasuresToConvertResponse is the list "Voltar à cidade" shows.
message ListTreasuresToConvertResponse {
  // The treasures found and not converted, the oldest find first.
  repeated TreasureToConvert treasures = 1;
  // How many treasures are found and not converted in all, which may be more
  // than the list holds (it stops at 100): the screen says when there are
  // more.
  int32 total = 2;
}

// TreasureToConvert is a treasure the party found that no award converted.
message TreasureToConvert {
  // The treasure's map point (a UUID): what AwardXP's treasure_point_ids take.
  string point_id = 1;
  // The map it is on (a UUID) and that map's name.
  string map_id = 2;
  string map_name = 3;
  // The treasure's own name.
  string name = 4;
  // Its worth, in gold pieces: 1 XP each when converted.
  int32 value_po = 5;
  // When the master marked it found.
  google.protobuf.Timestamp found_at = 6;
  // The characters that found it, by name.
  repeated TreasureFinder found_by = 7;
  // Whether it was found while a game session was open. One found outside a
  // session can be converted, but it counts in no session summary ("Mais
  // tesouro encontrado").
  bool found_in_session = 8;
}

// TreasureFinder is a character that found a treasure.
message TreasureFinder {
  // The character (a UUID) and its name now.
  string character_id = 1;
  string character_name = 2;
}

message MarkMilestoneRequest {
  string campaign_id = 1;
  // What happened, 1 to 120 characters, one line.
  string reason = 2;
  // Who is marked: 1 to 40 living player characters of the campaign (UUIDs),
  // no repeat.
  repeated string character_ids = 3;
  // A UUID the app generates once and sends again on a retry.
  string idempotency_key = 4;
}

message MarkMilestoneResponse {
  XPAward award = 1;
}

message UndoLastXPAwardRequest {
  string campaign_id = 1;
  // A UUID the app generates once and sends again on a retry.
  string idempotency_key = 2;
  // The award the app shows as the last one (a UUID), or empty.
  string expected_award_id = 3;
}

message UndoLastXPAwardResponse {
  // The award that was undone, as the history shows it now.
  XPAward award = 1;
}

message ListXPAwardsRequest {
  string campaign_id = 1;
  // How many awards to return: 1 to 50; unset or 0 means 20.
  int32 page_size = 2;
  // The next_page_token of the previous page; empty for the first. It is
  // opaque.
  string page_token = 3;
}

message ListXPAwardsResponse {
  // The awards, newest first.
  repeated XPAward awards = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message GetCampaignExperienceRequest {
  string campaign_id = 1;
}

message GetCampaignExperienceResponse {
  // How the campaign levels (RN-09). With MILESTONES, the XP numbers below are
  // not used: only can_level_up is.
  meurpg.campaigns.v1.XpMode xp_mode = 1;
  // The living player characters, oldest first.
  repeated CharacterExperience characters = 2;
}

// CharacterExperience is one character's progress.
message CharacterExperience {
  // The character (a UUID) and its name.
  string character_id = 1;
  string name = 2;
  // Its player (a UUID) and display name; empty for a character whose player
  // deleted the account (RN-16).
  string player_user_id = 3;
  string player_display_name = 4;
  // The total level (1 to 20).
  int32 level = 5;
  // The XP on the sheet: 0 to 1,000,000.
  int32 experience_points = 6;
  // The XP that reaches the next level; 0 at level 20.
  int32 next_level_xp = 7;
  // Whether it can level up now (RN-12), and why.
  bool can_level_up = 8;
  meurpg.characters.v1.LevelUpReason level_up_reason = 9;
}

// MilestoneDirection says where MoveMilestone moves a milestone.
enum MilestoneDirection {
  MILESTONE_DIRECTION_UNSPECIFIED = 0;
  // Toward the start of the list.
  MILESTONE_DIRECTION_UP = 1;
  // Toward the end of the list.
  MILESTONE_DIRECTION_DOWN = 2;
}

// Milestone is a milestone of a MILESTONES campaign, planned or reached
// (MR-016).
message Milestone {
  // Stable milestone ID (a UUID).
  string id = 1;
  // What the master wrote: 1 to 120 characters, one line. For a reached
  // milestone, it is the reason of its awards.
  string text = 2;
  // Whether at least one mark of it is not undone.
  bool reached = 3;
  // When it was first marked, among the marks that are not undone; unset for
  // a planned milestone.
  google.protobuf.Timestamp reached_at = 4;
  // The marks that are not undone, oldest first: the first one is the
  // milestone's being reached, each later one a "Dar a mais alguém". Each has
  // who it was given to, who gave it, when and whether the master may undo it
  // now. Empty for a planned milestone.
  repeated XPAward marks = 5;
  // Whether this is a milestone marked off the list (MarkMilestone, "Registrar
  // um marco fora da lista"): it was never planned, it has one mark, and `id`
  // is that mark's award ID, not a planned milestone's: no call that takes a
  // milestone_id accepts it, and it cannot be given to more characters.
  bool off_list = 6;
  // Whether any award, an undone one included, names this milestone: it was
  // reached once, so RemoveMilestone refuses it (MILESTONE_HAS_HISTORY). True
  // for every reached milestone, and for a planned one whose marks were all
  // undone; false for a milestone never reached and for one marked off the list.
  bool has_history = 7;
}

message ListMilestonesRequest {
  string campaign_id = 1;
}

message ListMilestonesResponse {
  // The master gets every milestone, in the master's order; a player gets the
  // reached ones only, in that order too.
  repeated Milestone milestones = 1;
}

message AddMilestoneRequest {
  string campaign_id = 1;
  // Required: 1 to 120 characters, one line.
  string text = 2;
  // Optional. 1 to 64 characters, chosen once by the app for this action: a retry with the
  // same key and the same request returns what the first call made instead of making another.
  // The key is unique in the campaign; the same key with another request is `invalid_argument`.
  // Empty: the call is not deduplicated.
  string idempotency_key = 3;
}

message AddMilestoneResponse {
  // The new milestone.
  Milestone milestone = 1;
  // Every milestone of the campaign, in order, with the new one last.
  repeated Milestone milestones = 2;
}

message UpdateMilestoneRequest {
  string campaign_id = 1;
  string milestone_id = 2;
  // Required: 1 to 120 characters, one line.
  string text = 3;
}

message UpdateMilestoneResponse {
  // The changed milestone.
  Milestone milestone = 1;
  // Every milestone of the campaign, in order.
  repeated Milestone milestones = 2;
}

message MoveMilestoneRequest {
  string campaign_id = 1;
  string milestone_id = 2;
  // Required.
  MilestoneDirection direction = 3;
}

message MoveMilestoneResponse {
  // Every milestone of the campaign, in the new order.
  repeated Milestone milestones = 1;
}

message RemoveMilestoneRequest {
  string campaign_id = 1;
  string milestone_id = 2;
}

message RemoveMilestoneResponse {
  // The milestones that are left, in order.
  repeated Milestone milestones = 1;
}

message MarkMilestoneReachedRequest {
  string campaign_id = 1;
  string milestone_id = 2;
  // Who levels up: 1 to 40 living player characters of the campaign (UUIDs),
  // no repeat.
  repeated string character_ids = 3;
  // A UUID the app generates once and sends again on a retry.
  string idempotency_key = 4;
}

message MarkMilestoneReachedResponse {
  // The milestone, reached now.
  Milestone milestone = 1;
  // The mark just made, as the history shows it.
  XPAward award = 2;
}

message GiveMilestoneToRequest {
  string campaign_id = 1;
  string milestone_id = 2;
  // Who gets it: 1 to 40 living player characters of the campaign (UUIDs), no
  // repeat, none of them with this milestone already.
  repeated string character_ids = 3;
  // A UUID the app generates once and sends again on a retry.
  string idempotency_key = 4;
}

message GiveMilestoneToResponse {
  // The milestone, with the new mark last.
  Milestone milestone = 1;
  // The mark just made, as the history shows it.
  XPAward award = 2;
}
