syntax = "proto3";

// The table's own rules content (MR-025, MR-025, RN-23, ADR-0018): the classes,
// subclasses, races, subraces, backgrounds, spells, feats, options, class features
// and creatures that the master writes for one campaign, and the content pack that carries them from one campaign to
// another (ExportTableContent, ImportTableContent). The RPCs are TableContentService's, below; the catalog the
// character editor builds from is ContentService.ListContent (rules.proto).
//
// One typed message per kind, each mapping one to one onto the fields the rules
// engine takes (package rules, Overlay). The server checks all of them with the
// loaders and checks of the SRD content, so a table entry is as sure as an SRD
// one; what it refuses comes back as an `invalid_argument` with a field violation
// per error (TableContentViolation).
//
// Keys. An entry's key is "<kind>:<slug>@mesa", such as
// "class:cavaleiro-runico@mesa". The server makes the slug from the Portuguese
// name when the entry is created, and the key never changes after that, not even
// when the name does: sheets store the key. The features of a class or subclass,
// the traits of a race and the feature of a background have keys too, made by the
// server and kept while the feature exists (see TableFeature.key).
//
// What a table entry never does: run code. A feature's effects come from a closed
// menu (TableEffect), and a feature with no effects is text only.
//
// Names, texts and effects are in Portuguese; distances are in feet.
package meurpg.rules.v1;

import "google/protobuf/timestamp.proto";
import "meurpg/rules/v1/rules.proto";

// TableContentKind says what an entry is.
enum TableContentKind {
  TABLE_CONTENT_KIND_UNSPECIFIED = 0;
  // A class: the contract of ADR-0018, section 8.
  TABLE_CONTENT_KIND_CLASS = 1;
  // A subclass of an SRD class or of a table class.
  TABLE_CONTENT_KIND_SUBCLASS = 2;
  // A race.
  TABLE_CONTENT_KIND_RACE = 3;
  // A subrace of an SRD race or of a table race.
  TABLE_CONTENT_KIND_SUBRACE = 4;
  // A background.
  TABLE_CONTENT_KIND_BACKGROUND = 5;
  // A spell.
  TABLE_CONTENT_KIND_SPELL = 6;
  // A feat: an optional rule of the game, taken in place of an Ability Score
  // Improvement when the table's rule "Talentos" allows it (MR-025).
  TABLE_CONTENT_KIND_FEAT = 7;
  // An option of one of the SRD's option sets (an Eldritch Invocation, a Metamagic
  // option, a fighting style, a Pact Boon...), written by the master. The choice of
  // that set offers it next to the SRD's options (MR-025).
  TABLE_CONTENT_KIND_OPTION = 8;
  // An optional feature of a class (SRD or the table's), at a class level: every
  // character of the class has it from that level, and it may take the place of a
  // feature the class has (MR-025).
  TABLE_CONTENT_KIND_CLASS_FEATURE = 9;
  // A creature: an SRD creature with a few adjustments (hit points, armor class, a
  // damage bonus, extra traits). The creature list and sheet (for the master and for a
  // player whose character holds it), giving it to a character, combat and "Criar NPC"
  // read it by its own key. Summoning spells, Wild Shape and the encounter tools offer
  // SRD creatures only.
  TABLE_CONTENT_KIND_CREATURE = 10;
}

// TableEntry is one entry of the table's content, as ListTableEntries and the
// writes return it: what every entry has, and the kind's message in `body`.
message TableEntry {
  // "<kind>:<slug>@mesa". Immutable.
  string key = 1;
  TableContentKind kind = 2;
  // The Portuguese name. The same as the body's name_pt.
  string name_pt = 3;
  // The master retired the entry (ArchiveTableEntry): sheets that use it keep
  // working, but it is not offered as a new choice. Players never receive an
  // archived entry.
  bool archived = 4;
  // The campaign's content revision at the entry's last change. UpdateTableEntry
  // takes it back as `expected_revision`, so two masters editing at once cannot
  // overwrite each other.
  int32 revision = 5;
  google.protobuf.Timestamp created_at = 6;
  // When the entry last changed: its creation or its last edit. Archiving and
  // unarchiving do not move it, nor `revision`.
  google.protobuf.Timestamp updated_at = 7;
  // How many characters of the campaign use the entry (race, subrace, class,
  // subclass, background, or as a known, prepared or cantrip spell). Filled for
  // the master only; 0 for a player.
  int32 characters_using = 8;
  // When the master archived the entry; unset while it is not archived.
  google.protobuf.Timestamp archived_at = 9;
  // The master switched the entry off for the players (SetOptionSwitches): the
  // master reads it with this mark; a player never receives an off entry (RN-23).
  bool off = 16;
  // The entry itself. Exactly one is set, the one of `kind`.
  oneof body {
    TableClass table_class = 10;
    TableSubclass table_subclass = 11;
    TableRace table_race = 12;
    TableSubrace table_subrace = 13;
    TableBackground table_background = 14;
    TableSpell table_spell = 15;
    TableFeat table_feat = 17;
    TableOption table_option = 18;
    TableClassFeature table_class_feature = 19;
    TableCreature table_creature = 20;
  }
}

// TableEffect is one effect of a feature, from the closed menu: what the engine
// computes with, never code. `type` is "modifier", "proficiency", "resource",
// "sense", "roll_mode", "grant_action", "extra_attack", "ranged_attack", "choice", "ability_increase",
// "superiority_die", "extra_damage", "ambush", "resistance", "state", "weapon_rule", "pseudo_weapon",
// "breathes_water", "granted_spell", "on_event" or "note"; "ability_increase" is a feat's alone.
// "breathes_water" has no field of its own (`when` and `text_pt` only): the character breathes underwater. Only the fields of the type are
// read, and a field the type does not use is refused. A feature with no effects is text only and always valid. Formulas ("value",
// "when", "max") use level(), classLevel("<class>"), mod("int"), score("int"),
// prof(), floor, ceil, min and max, and must compile; a formula has at most 1024 bytes and 256 nodes. The modifiers of the
// "speed.fly", "speed.swim", "speed.climb" and "speed.burrow" targets may also call speedwalk(), the walking speed after the
// modifiers.
message TableEffect {
  string type = 1;
  // modifier: what changes ("ac.base", "ac", "hp.max", "speed.walk", "speed.fly", "speed.swim",
  // "speed.climb", "speed.burrow", "initiative", "attack.weapon.melee", "attack.weapon.ranged",
  // "damage.weapon.melee", "damage.weapon.ranged", "skill.<skill>",
  // "save.<ability>"), how ("add", "max" or "set") and the formula.
  string target = 2;
  string mode = 3;
  string value = 4;
  // A Bool formula; the effect applies only while it is true. It may read a state of the
  // same entry with active("name"), which is true while that state is on (see `state`).
  string when = 5;
  // Makes an effect situational ("against:magic"): the engine shows it as a
  // reminder and the master decides.
  repeated string tags = 6;
  // proficiency: a skill key, "skill:*", "save.<ability>", "initiative" or a
  // proficiency key ("proficiency:heavy-armor"), and the level ("half", "full" or
  // "expertise"; empty is "full").
  string proficiency = 7;
  string level = 8;
  // roll_mode: "advantage" or "disadvantage" on the `targets` ("save.int",
  // "skill.stealth").
  string roll = 9;
  repeated string targets = 10;
  // sense: "darkvision", "blindsight", "tremorsense" or "truesight", and its range.
  string sense = 11;
  int32 range_ft = 12;
  // resource: a name for the resource, the formula of its maximum and when it
  // comes back ("short_rest", "long_rest", "dawn", "none", "initiative",
  // "restore_one_on_short_rest" or "restore_one_on_long_rest"). The last three:
  // "initiative" gives back one use when the owner rolls initiative, only if none is
  // left; "restore_one_on_short_rest" gives back one use on a short rest and all of
  // them on a long rest; "restore_one_on_long_rest" gives back one use on a long rest
  // and none on a short one.
  string resource = 13;
  string max = 14;
  string recharge = 15;
  // choice: what the player chooses ("skill", "expertise", "cantrip", "spell",
  // "language", "tool", "feature" or "feat"), how many, and from which keys (for
  // "feat": feat keys of the SRD or the table; empty is any feat). For
  // extra_attack, `count` is how many attacks the Attack action makes. For
  // ability_increase, `count` is how many different abilities the player picks,
  // `from` the abilities to pick from ("str", "dex", "con", "int", "wis", "cha")
  // and `value` how much each goes up, "1" or "2": never above 20 (SRD 5.1, Ability
  // Score Improvement). The sheet keeps the result as manual ability bonuses.
  string choice = 16;
  int32 count = 17;
  repeated string from = 18;
  // grant_action: "action", "bonus_action", "reaction", "free" or "movement". The
  // action may also name in `resource` a resource effect of the same entry (or of
  // its class) to spend: each use spends `cost` of it (1 when empty), and the action is off while fewer are left.
  string economy = 19;
  // note: spells the feature grants (a race that knows a cantrip).
  repeated string spells = 20;
  // The text for the sheet, in Portuguese, when a note, a resource or an action
  // needs one. "{value}" is the value with its sign, "{n}" without it.
  string text_pt = 21;
  // superiority_die: a die an option (a maneuver) adds to a roll, spent from the
  // resource named in `resource` (one use each; the entry or its class defines it).
  // `value` is the die's sides (a formula), `applies` where it goes: "damage" (a
  // weapon attack that hit), "attack" (an attack roll), "grapple" (the Athletics
  // check of a grapple; `economy` may be "bonus_action") or "reduce_melee_damage"
  // (a reaction, `economy` "reaction", when a melee attack hits the character: the
  // damage drops by the die plus the modifier of `ability`). `text_pt` is the rider the
  // master reads. Added later: older clients leave both empty.
  // ranged_attack also uses `applies`, for which attacks it changes: "spell" (the
  // attack roll of a spell that needs one) or "weapon" (a ranged weapon attack, and a
  // thrown weapon used at range).
  string applies = 22;
  string ability = 23;
  // ranged_attack (a table feat that makes its owner a sharper shot; the SRD has none):
  // half and three-quarters cover give the target no bonus to its armor class against
  // the attacks of `applies` (total cover still makes it untargetable).
  bool ignore_cover = 24;
  // ranged_attack, "spell" only: 2 or 3, how many times its range a spell that needs an
  // attack roll and has a range in feet reaches; the largest the character has counts.
  // 0 leaves the range as it is.
  int32 range_multiplier = 25;
  // ranged_attack, "weapon" only: attacking beyond the normal range, up to the long
  // range, gives the roll no disadvantage. A ranged_attack effect sets at least one of
  // ignore_cover, range_multiplier and no_long_range_disadvantage.
  bool no_long_range_disadvantage = 26;
  // resistance: resistance, immunity or vulnerability to damage types (SRD 5.1,
  // "Damage Resistance and Vulnerability"). The types are either `damage_types` (the
  // SRD's "damage-type:" keys, such as "damage-type:cold", or one of the closed words
  // "all" for every type and "nonmagical_bps" for the bludgeoning, piercing and slashing
  // damage of attacks that are not magical; "all" is alone in the list, no key is
  // listed twice) or every type but `except` (a "damage-type:" key); exactly one of
  // the two is set. `kind` is "resist" (half the damage, the default when empty),
  // "immune" (none) or "vulnerable" (double). Immunity wins over resistance, resistance
  // is applied before vulnerability, and the same kind from two sources counts once.
  // `while` is empty (always) or "rage" (for as long as the character is raging). The
  // effect has no `when` and no `tags`. An attack the sheet or the stat block does not
  // mark as magical counts as nonmagical.
  //
  // `while` is the state gate, shared by the effects that hold only while a state is on:
  // resistance, roll_mode, extra_damage, weapon_rule and pseudo_weapon. On resistance it
  // is empty, "rage" or the `state_name` of a state of the same entry; on the others it is
  // optional and names a state of the same entry (never "rage"): the effect applies only
  // while that state is on. A name no state effect of the entry defines is refused.
  string except = 27;
  string while = 28;
  // extra_damage: damage added to a weapon hit when `applies` holds. `value` is the
  // fixed part (a formula) and may be empty when dice are set; `dice` is a formula for
  // how many dice, `dice_sides` their sides (4, 6, 8, 10 or 12), set together.
  // `damage_type` is a "damage-type:" key of the SRD; empty is the weapon's own type.
  // `weapon` is "any" (the default), "melee" or "ranged"; `frequency` is
  // "once_per_turn" (the default) or "each_hit". A critical hit doubles the dice
  // unless `no_crit_doubling` is set, which needs dice. The fixed part is never doubled.
  string dice = 44;
  int32 dice_sides = 45;
  string damage_type = 46;
  string weapon = 47;
  string frequency = 48;
  bool no_crit_doubling = 49;
  // spell_modifier: cast options the feature offers for the spells it fits.
  // `applies_to` is "damage_spell" (a spell that deals damage), "cantrip", an SRD school
  // key ("school:evocation") or an SRD damage type key ("damage-type:fire"): the spells
  // whose school or one of whose damage types it is. `spell_change` is the one change:
  // "damage_type_swap" (`from` lists the damage types it swaps among: the damage of one
  // of them becomes another of them, which the caster picks at the cast),
  // "bonus_damage" (`value` is the fixed damage added, a formula; `damage_type` its type,
  // empty is the spell's own) or "extra_dice_per_slot_over" (`count` more dice of the
  // spell's damage die for each slot level above the spell's own). `resource`, when set,
  // names a resource effect of the same entry or its class: using the option spends `cost`
  // uses (a formula, empty is 1; the cost field of grant_action), and the caster ticks it on the cast sheet. Without a resource, bonus_damage and
  // extra_dice_per_slot_over are always on and damage_type_swap is a free choice.
  string applies_to = 50;
  string spell_change = 51;
  // proficiency, level "expertise" on a skill ("skill:*" is every skill) only: the
  // skill is doubled only where the character already has its proficiency from
  // another source when the sheet is worked out (the race, the background, the
  // sheet's picks or another feature); the effect never gives the proficiency itself.
  // Empty or false doubles the skill whether or not the character is proficient.
  bool only_proficient = 29;
  // granted_spell: a spell the entry gives the character apart from the lists of its
  // classes. `spell` is an SRD key or a spell of the same table; `ability` is "int",
  // "wis", "cha" or "choice" (the player picks one of the three once, when the entry
  // is taken) and gives the spell attack bonus and the save DC (8 + proficiency + the
  // modifier). `from_level` is a formula, the level the grant starts at (1 when empty):
  // the class level for a class or subclass feature, the character level for anything
  // else. `uses` is empty or "at_will" for no limit, or the name of a resource effect of
  // the same entry (or its class), of which every cast spends one. `also_with_slot`
  // lets the character cast it with a spell slot too, `ritual_only` limits it to the
  // ritual way (a spell with the ritual tag; not with also_with_slot) and
  // `counts_as_known` lists it among the known spells without using any of the
  // class's picks. A leveled spell cast through the grant is cast at its own level;
  // the material components are not waived. Required: `spell` and `ability`.
  string spell = 30;
  string from_level = 31;
  string uses = 32;
  bool also_with_slot = 33;
  bool ritual_only = 34;
  bool counts_as_known = 35;
  // grant_action and on_event: how many uses of `resource` each use of the action (or
  // each run of the hook) spends, a formula (level(), prof(), mod(...)); empty is 1,
  // and it needs `resource`. The action is off, and the hook does not run, while fewer
  // are left. Never above the resource's maximum: an entry whose cost the resource can
  // never pay is refused. For on_event, `resource` is the resource the hook spends.
  string cost = 36;
  // grant_action: the most the player may spend on one use, a formula, never below
  // `cost`. Set, the player chooses at use how many to spend, from `cost` to
  // `cost_max` (or what is left); the server reads that number in the same
  // transaction as the use and refuses one outside the range. Empty is a fixed cost.
  string cost_max = 37;
  // grant_action with `cost_max`: what each point spent above `cost` adds to the
  // result. Dice ("1d6", the same sides as `heal`) add to `heal`; a flat formula
  // adds to `temp_hp` (or to `heal` when the action has no temp_hp). The result of
  // spending `n` points is the base result plus this value `n - cost` times.
  string value_per_point = 38;
  // grant_action and on_event: hit points regained, dice ("1d6", "2d4+2"), at least one
  // die. For grant_action the target is the owner or one creature chosen at use (the
  // owner and one ally); `ability` adds that ability's modifier. The heal follows the
  // rules of the spells: it never passes the maximum and a dead creature is not
  // healed. For on_event the target is the owner.
  string heal = 39;
  // grant_action and on_event: temporary hit points, a formula. They do not stack:
  // the target keeps the larger of what it had and this.
  string temp_hp = 40;
  // on_event: when the hook runs, on the OWNER only: "short_rest" and "long_rest"
  // (when the owner finishes the rest), "death_save_failed" (when one of the owner's
  // death saves fails) or "drop_to_zero" (when the owner drops to 0 hit points).
  string event = 41;
  // on_event: the name of a resource of the entry (or of its class) whose uses the
  // hook gives back, as many as `value` (an Int formula; empty is 1), never more than
  // are spent, so the same event handled twice restores once.
  string restore = 42;
  // on_event: hit points regained as a percentage of the maximum (1 to 100, rounded
  // down, at least 1), instead of `heal`; the two are not both set.
  int32 heal_percent_max = 43;
  repeated string damage_types = 52;
  string kind = 53;
  // condition_immunity: the keys of the conditions ("condition:poisoned", one of the 15
  // of the SRD) the character takes none of: no spell, trap or blow puts them on it.
  repeated string conditions = 54;
  // roll_mode: the saving throws (the `targets` are "save.<ability>" or "save.all")
  // against being this condition ("condition:frightened") get the roll mode of `roll`.
  // It has no `tags`: the condition is the situation, and the app applies the mode.
  string against_condition = 55;
  // state: a temporary state the feature switches on and off (a stance for 1 minute, a
  // form that lasts until a long rest). `state_name` names it within the entry, like a
  // resource (1 to 40 characters of a-z, 0-9 and _; at most 8 states in an entry).
  // `duration_rounds` is a formula for how many rounds it lasts (empty or 0: until it
  // ends; at most 14400, 24 hours); `ends_on` lists the other ways it ends: "dismiss"
  // (the player ends it), "incapacitated" (0 hit points or an incapacitating
  // condition), "short_rest" (a short or long rest) and "long_rest". A state needs a
  // duration or at least one `ends_on`. `resource` is a resource of the entry or its
  // class that each start spends one use of, and `economy` ("action", "bonus_action" or
  // "free") what starting it costs; ending it is free. The sheet shows an action with
  // Ativar and Encerrar. The other effects of the entry hold only while it is on, by
  // their `while` or by a `when` that calls active("state_name").
  string state_name = 56;
  string duration_rounds = 57;
  repeated string ends_on = 58;
  // weapon_rule: changes the weapon lines `weapon` chooses: "any", "melee", "ranged",
  // "finesse", "magic" (lines the sheet marks as magical) or "named" (the weapon whose
  // Portuguese name is `weapon_name`, ignoring case and accents; required for "named",
  // refused for the others). `attack_ability` and `damage_ability` offer another ability
  // for the attack roll and for the damage ("str", "dex", "con", "int", "wis", "cha"): the
  // best of the line's own and the offered ones applies. `attack_bonus` and `damage_bonus`
  // add, from -5 to 10. `reach_ft` makes a melee reach longer (5 to 60, in steps of 5; not
  // for "ranged"). The rule must change something. pseudo_weapon: `weapon` is "melee" or
  // "ranged" and these are the fields of the attack line the feature gives: `attack_name`
  // (1 to 40 characters), `damage_dice` (plain dice, 1 to 10 of d4, d6, d8, d10 or d12),
  // `damage_type` (a "damage-type:" key of the SRD), `ability` (the ability it attacks and
  // hurts with), `reach_ft` for a melee one (5 to 60, default 5) and `range_ft`, required, for
  // a ranged one (5 to 300, in steps of 5). It counts as a weapon the character is
  // proficient with, is never an item, and the weapon rules change it like any weapon.
  string weapon_name = 59;
  string attack_ability = 60;
  string damage_ability = 61;
  int32 attack_bonus = 62;
  int32 damage_bonus = 63;
  int32 reach_ft = 64;
  string attack_name = 65;
  string damage_dice = 66;
  // wild_shape: changes the druid's Wild Shape. `max_cr` is the highest challenge rating of
  // the beasts ("0", "1/8", "1/4", "1/2" or a whole number up to 30) or `max_cr_from` an Int
  // formula for a whole one from the level (such as "floor(level() / 3)"); not both.
  // `no_fly` and `no_swim` leave out the beasts with those speeds. `form_cost` is an Int
  // formula for the uses of the Wild Shape resource one change of form costs (empty is 1)
  // and `magical_attacks` makes the beast form's attacks count as magical. The effect must
  // set one of the four. The character takes the highest rating (with the limits of the
  // effect that gives it), the lowest cost, and magical attacks if any effect gives them.
  string max_cr = 67;
  string max_cr_from = 68;
  string form_cost = 69;
  bool magical_attacks = 70;
  bool no_fly = 71;
  bool no_swim = 72;
  // grant_action: the action turns the uses it spends (`resource` and `cost`) into a spell
  // slot of the level this Int formula gives (1 to 9). The slot is free until the next long
  // rest, like a slot Flexible Casting makes. It needs `resource` and takes no heal, no
  // temp_hp and no cost_max.
  string gives_slot = 73;
  // grant_action: the action spends a spell slot, at the level the player picks at use
  // (`spend`, 1 to 9, a level with a free slot), and heals: `heal` at level 1 plus
  // `value_per_point` (dice, the same sides) for each level above 1. It needs `heal` and
  // takes no resource, no cost, no cost_max and no temp_hp.
  bool spends_slot = 74;
  // slot_recovery: the character takes back expended spell slots after a short rest, as the
  // wizard's Arcane Recovery does. A feature has one. `resource` is the resource whose use each
  // recovery spends (an SRD resource, or one a resource effect of the entry or its class
  // defines, which gives the uses and the rest they come back on), `recover_max_level` an Int formula for the highest level of a slot it takes
  // back (1 to 9) and `recover_levels` an Int formula for the combined level of the slots
  // (a level 2 slot counts 2). Both are required.
  string recover_max_level = 75;
  string recover_levels = 76;
}

// TableFeature is a class or subclass feature, a race or subrace trait, or a
// background's feature.
message TableFeature {
  // The feature's key ("feature:class-guardiao-3f9a1c--vigor@mesa": the kind, the start of the
  // entry's slug, a short hash of the whole entry key and the feature's own name; or "trait:...",
  // "background-feature:..."). The server makes it when the feature is new (leave
  // it empty) and the editor sends it back on every update: a feature that keeps
  // its key keeps the choices sheets made on it. An empty key at a level where an
  // existing feature has the same name takes that feature's key.
  string key = 1;
  string name_pt = 2;
  // The text, one paragraph per entry.
  repeated string desc_pt = 3;
  repeated TableEffect effects = 4;
  // The option list of a class or subclass feature (a table's maneuvers): options the
  // player picks, each with a name, a text and effects of its own. An option is never
  // gained by a level row: it applies only while the character has picked it and the
  // feature is theirs. The server makes the option keys like the feature keys
  // ("feature:<stem>--<option name>@mesa"; leave them empty for a new option, send
  // them back on every update). A `choice` effect of kind "feature" on this feature
  // with an empty `from` offers all of these options; on another feature of the same
  // entry, `from` may list the keys of these options (a later level's "2 more").
  // Options do not nest, and only a class or subclass feature has them. At most 60.
  repeated TableFeature options = 5;
}

// TableFeat is a feat (MR-025): an optional rule of the game that a character takes
// in place of an Ability Score Improvement when the table's rule "Talentos" allows
// it. The key is "feat:<slug>@mesa". The effects belong to the feat itself (it has
// no features of its own), come from the same closed menu as a feature's, and may
// include one `ability_increase`, which only a feat has.
message TableFeat {
  string name_pt = 1;
  // The text, one paragraph per entry.
  repeated string desc_pt = 2;
  // What the feat asks of a character; unset asks nothing.
  FeatPrerequisite prerequisite = 3;
  // At most 20, and at most one ability_increase.
  repeated TableEffect effects = 4;
}

// TableOption is an option the master adds to an option set of the SRD, as a table
// entry "option:<set>:<slug>@mesa". The text and the effects are the feature the
// character gets when it picks the option; `set` says which choice offers it.
message TableOption {
  string name_pt = 1;
  // The text, one paragraph per entry.
  repeated string desc_pt = 2;
  // The option set: one of the closed list "option_set_names" of GetEffectMenu ("invocation",
  // "metamagic", "fighting_style", "pact_boon", "hunters_prey", "defensive_tactics",
  // "multiattack", "superior_hunters_defense" or "table_feature"). It never changes after the
  // entry is created: it is in the key. The set "table_feature" joins the options of a table
  // class or subclass feature (a table's maneuvers), named by `offered_by`.
  string set = 3;
  // What the option asks of the character; unset asks nothing. An option whose
  // prerequisite is not met is listed in the choice, disabled, with what it lacks.
  OptionPrerequisite prerequisite = 4;
  // At most 20.
  repeated TableEffect effects = 5;
  // The key of the table feature whose option list this option joins; required for the set
  // "table_feature" and refused for any other. The feature is a class or subclass feature of
  // the table that has options (its own list, so it has a choice of features).
  string offered_by = 6;
}

// OptionPrerequisite is what a table option asks for. Every one that is set must hold.
message OptionPrerequisite {
  // A level in one class, SRD or the table's.
  OptionClassLevel class_level = 1;
  // Other options the character has already picked, SRD options or the table's. At most 10.
  repeated string requires_option_keys = 2;
  // A Pact Boon the character has (an SRD one, or a table option of the set "pact_boon").
  string requires_pact = 3;
  // A spell the character knows (a cantrip, a known or a prepared spell).
  string requires_spell_key = 4;
}

// OptionClassLevel is "level N in class X".
message OptionClassLevel {
  string class_key = 1;
  // 1 to 20.
  int32 level = 2;
}

// TableClassFeature is a feature the master adds to a class, as a table entry
// "classfeature:<slug>@mesa": it is in the class's row of `level`, like a feature of
// the class's own table, so the sheet, the level-up and play read it where they read
// the class's features. A table class's own features go in its rows; this is for a
// class the table does not own (an SRD class) and for what the master wants to switch
// on and off by itself.
message TableClassFeature {
  string name_pt = 1;
  // The text, one paragraph per entry.
  repeated string desc_pt = 2;
  // The class that has it: an SRD class or a table class. Never changes.
  string class_key = 3;
  // The class level it comes at, 1 to 20.
  int32 level = 4;
  // A feature of the same class that it takes the place of (an SRD feature, or another
  // table class feature), which the character no longer has: its effects, its choices
  // and its line on the sheet are gone. The replaced feature comes at the level of this
  // one or later (a character never loses what it already had). Empty replaces nothing.
  string replaces_feature_key = 5;
  // At most 20. A `choice` effect asks the player at the level, like any feature's.
  repeated TableEffect effects = 6;
}

// TableCreature is a creature the master adds as a table entry "creature:<slug>@mesa":
// an SRD creature (`base_key`) with a few adjustments. The creature has everything the
// base has (abilities, speeds, senses, actions, reactions) except what is adjusted here.
// Once the entry exists it has a creature's key: the creature list and sheet (for the
// master and for a player whose character holds it), giving it to a character, combat and
// "Criar NPC" read it by that key. Summoning spells, Wild Shape and the encounter tools
// offer SRD creatures only.
// The web app has no editor for creatures: they are created through the API or a content pack.
message TableCreature {
  string name_pt = 1;
  // The SRD creature it is made from ("monster:wolf"). It must exist, and it is always an
  // SRD creature: a table creature is never the base of another. Never changes.
  string base_key = 2;
  // The creature's maximum hit points, 1 to 9999. 0 keeps the base's. The hit dice of the
  // base stay as they are.
  int32 hit_points = 3;
  // The creature's armor class, 1 to 40. 0 keeps the base's. The kind and the notes the SRD
  // gives for the base's armor class (natural armor, worn armor, a spell) are left out.
  int32 armor_class = 4;
  // A whole number from -10 to 30 added once to the damage of every attack action of the
  // creature (to the first damage part of each), so a Multiattack's attacks each get it.
  // 0 adds nothing. A flat damage stops at 0; dice that end in "+MOD" are left as they are.
  // The text of the action is the base's and does not show it.
  int32 damage_bonus = 5;
  // Traits added after the base's special abilities, as text only: at most 10. A trait
  // may not be named as one of the base's traits or actions (compared by the letters a to z and digits of the name,
  // ignoring case), and may not be named "Magic Weapons",
  // "Spellcasting" or "Innate Spellcasting" (ignoring case): the engine reads those names.
  repeated TableCreatureTrait traits = 6;
}

// TableCreatureTrait is a trait of a table creature: a name and a text, no effects.
message TableCreatureTrait {
  // 1 to 80 characters, on one line.
  string name_pt = 1;
  // 1 to 4000 characters.
  string text_pt = 2;
}

// TableCasting is how a class, or a third caster's subclass, casts.
message TableCasting {
  // "full", "half" or "pact" for a class; "third" for a subclass.
  string kind = 1;
  Ability ability = 2;
  // "known" or "prepared".
  string preparation = 3;
  // The class whose spell list it casts from: an SRD class or a table class that
  // has its own list. Empty for a class is its own list (the spells that name
  // it); required for a third caster.
  string list_from = 4;
  // A formula for how many spells a class that prepares may prepare. Empty is the
  // ability modifier plus the class level (half of it for a half caster), at
  // least 1.
  string prepared_max = 5;
  // The class level casting starts at; 0 is 1 (2 for half, 3 for third).
  int32 start_level = 6;
  // Whether it casts rituals.
  bool ritual = 7;
  // SRD spells ("spell:cure-wounds") on the class's own list, next to the table
  // spells that name the class. Only a class whose list_from is empty has them;
  // a third caster's subclass and a class that does not cast have none. Each is
  // a spell of the SRD, named once, and a class names at most 400.
  repeated string srd_spell_keys = 8;
}

// TableClassLevel is one row of a class's 20-level table.
message TableClassLevel {
  // The proficiency bonus at this level; 0 is the SRD's.
  int32 prof_bonus = 1;
  // The features gained at this level.
  repeated TableFeature features = 2;
  // The casting columns of the row; all zero for a class that does not cast.
  int32 cantrips_known = 3;
  int32 spells_known = 4;
  // The spell slots by circle, 1st first: nine entries, or none. Pact magic has
  // exactly one entry that is not zero.
  repeated int32 slots = 5;
}

// TableClass is a class.
message TableClass {
  string name_pt = 1;
  // 6, 8, 10 or 12.
  int32 hit_die = 2;
  // The two saving throws of a character who starts in this class.
  repeated Ability saving_throws = 3;
  // "Choose `skill_choose` skills from `skill_from`" at level 1 (SRD skill keys).
  int32 skill_choose = 4;
  repeated string skill_from = 5;
  // Armor, weapon and tool proficiency keys of a character who starts in it
  // ("proficiency:light-armor").
  repeated string proficiencies = 6;
  // The multiclass prerequisites: every ability here with a score above 0 must be
  // met, or, with `any_of`, one of its abilities instead. A score of 0 means
  // "not asked".
  AbilityScores minimums = 7;
  AbilityScores any_of = 8;
  // What taking this class as a later class gives.
  repeated string multiclass_proficiencies = 9;
  int32 multiclass_skill_choose = 10;
  // The class level the subclass is chosen at, 1 to 20; 0 is 3.
  int32 subclass_level = 11;
  // The levels with an Ability Score Improvement; empty is 4, 8, 12, 16 and 19.
  // The server writes the features.
  repeated int32 asi_levels = 12;
  // How the class casts; unset for a class that does not.
  TableCasting casting = 13;
  // The class table: exactly 20 rows, level 1 first.
  repeated TableClassLevel levels = 14;
}

// TableAlwaysPrepared is a spell a subclass always has prepared from a class
// level (a domain's, an oath's); it does not count against the prepared limit.
message TableAlwaysPrepared {
  int32 class_level = 1;
  // A spell key, of the SRD or the table.
  string spell_key = 2;
}

// TableSubclassLevel is a subclass's features at one class level and, for a third
// caster, the casting columns there.
message TableSubclassLevel {
  // The class level, 1 to 20. Rows are in ascending order.
  int32 level = 1;
  repeated TableFeature features = 2;
  int32 cantrips_known = 3;
  int32 spells_known = 4;
  repeated int32 slots = 5;
}

// TableSubclass is a subclass.
message TableSubclass {
  string name_pt = 1;
  // The parent class's key. Immutable.
  string class_key = 2;
  // The class level the choice happens at: the parent's, or 0 for "the parent's".
  int32 level = 3;
  repeated string desc_pt = 4;
  repeated TableSubclassLevel levels = 5;
  // Makes the subclass a third caster ("third"); the parent class must not cast.
  // Its levels need a row, with the casting columns, for every level from the
  // start level to 20.
  TableCasting casting = 6;
  repeated TableAlwaysPrepared always_prepared = 7;
  // The spells of always_prepared are not given: they join the class's spell list
  // to choose from, as a warlock patron's expanded list does, and count against
  // the spells known or prepared. It needs always_prepared to have spells; a
  // subclass without spells that sets it is refused.
  bool spells_expanded = 8;
}

// TableRace is a race.
message TableRace {
  string name_pt = 1;
  // "Tiny", "Small", "Medium" or "Large".
  string size = 2;
  int32 speed_ft = 3;
  // The fixed ability bonuses.
  AbilityScores ability_bonuses = 4;
  // Bonuses the player places on abilities of their choice, such as [2, 1] for "+2
  // and +1 to your choice"; each goes on a different ability.
  // A single set of such bonuses; `choice_bonus_sets` holds several. A race has one or
  // the other, never both. Each bonus is 1 to 4 here.
  repeated int32 choice_bonuses = 5;
  // 0, or the range of the darkvision, in feet.
  int32 darkvision_ft = 6;
  // SRD language keys always known, and how many more are chosen.
  repeated string languages = 7;
  int32 language_choices = 8;
  repeated TableFeature traits = 9;
  // Alternative sets of bonuses to place ("+2 and +1, or +1, +1 and +1"): the player
  // picks one set at creation, in the choices of the sheet (`feature_choice_keys`), and
  // each of its bonuses goes on a different ability (`choice_bonuses` is the same picker
  // for a single set); until the picks fill the set the sheet has the issue
  // `race_bonus`, and a new player's sheet is not saved. At most 4 sets, each of 1 to 6 bonuses of +1 or +2, no two the same; the
  // race has `choice_bonuses` or this, never both.
  repeated BonusSet choice_bonus_sets = 10;
  // The sizes the player picks one from: "Small", "Medium", or both, once each. `size`
  // is the default (and one of them); the character creator asks only when there are
  // two. Empty means the race has only `size`.
  repeated string sizes = 11;
}

// TableSubrace is a subrace.
message TableSubrace {
  string name_pt = 1;
  // The parent race's key. Immutable.
  string race_key = 2;
  AbilityScores ability_bonuses = 3;
  repeated TableFeature traits = 4;
}

// TableBackground is a background: two skills, tools and languages, and a feature
// that is a text.
message TableBackground {
  string name_pt = 1;
  // The two skills it gives (SRD skill keys).
  repeated string skills = 2;
  // Tool proficiency keys ("proficiency:thieves-tools").
  repeated string tools = 3;
  int32 language_choices = 4;
  // The equipment, as a text.
  string equipment_pt = 5;
  TableFeature feature = 6;
}

// TableSpellTargetKind says whom a table spell reaches.
enum TableSpellTargetKind {
  TABLE_SPELL_TARGET_KIND_UNSPECIFIED = 0;
  // One creature.
  TABLE_SPELL_TARGET_KIND_CREATURE = 1;
  // Several creatures: `count`, and `per_slot_level` more for each circle above
  // the spell's own.
  TABLE_SPELL_TARGET_KIND_CREATURES = 2;
  // An area: `shape` and `size_ft`. In combat the caster picks the creatures it
  // catches; the map does not draw it.
  TABLE_SPELL_TARGET_KIND_AREA = 3;
  // Only the caster ("Só quem conjura"); the range must be SELF.
  TABLE_SPELL_TARGET_KIND_SELF = 4;
}

// TableAreaShape is the shape of an area spell.
enum TableAreaShape {
  TABLE_AREA_SHAPE_UNSPECIFIED = 0;
  // The size is the length.
  TABLE_AREA_SHAPE_CONE = 1;
  // The size is the side.
  TABLE_AREA_SHAPE_CUBE = 2;
  // The size is the radius.
  TABLE_AREA_SHAPE_CYLINDER = 3;
  // The size is the length.
  TABLE_AREA_SHAPE_LINE = 4;
  // The size is the radius.
  TABLE_AREA_SHAPE_SPHERE = 5;
}

// TableSpellTarget is whom a table spell reaches (required).
message TableSpellTarget {
  TableSpellTargetKind kind = 1;
  // CREATURES: how many at the spell's own circle (2 or more), and how many more
  // for each circle above it. CREATURE: only `per_slot_level`, how many more for
  // each circle above ("uma criatura, mais uma por nível", as Hold Person).
  int32 count = 2;
  int32 per_slot_level = 3;
  // AREA: the shape and the size, in feet, in steps of 5 (1,5 m); 5 to 300.
  TableAreaShape shape = 4;
  int32 size_ft = 5;
}

// TableSpellCastingTime is how long a table spell takes to cast. An action, a bonus
// action or a reaction takes 1; minutes and hours 1 to 60.
message TableSpellCastingTime {
  CastingTimeUnit unit = 1;
  int32 amount = 2;
  // A reaction's trigger, in Portuguese ("quando você sofre dano"); only for a
  // reaction.
  string trigger_pt = 3;
}

// TableSpellRange is a table spell's range: SELF ("Pessoal"), TOUCH ("Toque"), SIGHT,
// UNLIMITED or RANGED with a distance. Special is not allowed. SELF only goes with a
// target of SELF or an AREA that comes out of the caster; a spell that picks one or
// several creatures has a distance or TOUCH.
message TableSpellRange {
  SpellRangeKind kind = 1;
  // For RANGED: 5 to 5280, in steps of 5.
  int32 distance_ft = 2;
}

// TableSpellDuration is a table spell's duration. Special is not allowed.
message TableSpellDuration {
  SpellDurationKind kind = 1;
  // For TIMED: 1 to 999 of a unit.
  int32 amount = 2;
  SpellDurationUnit unit = 3;
  // Writes "up to"; a concentration spell always has it.
  bool up_to = 4;
}

// TableSpellComponents says which components a table spell has.
message TableSpellComponents {
  bool verbal = 1;
  bool somatic = 2;
  bool material = 3;
  // Describes the material; goes with `material`, and only with it.
  string material_pt = 4;
}

// TableSpellDamage is one damage type of a table spell. The dice are plain dice
// ("8d6", "1d6"), the extra ones of the same die as `dice`.
message TableSpellDamage {
  // An SRD damage type key ("damage-type:fire").
  string damage_type_key = 1;
  // The damage at the spell's own level (a leveled spell) or at level 1 (a cantrip).
  string dice = 2;
  // The extra dice for each slot level above the spell's own (a leveled spell).
  string per_slot_level = 3;
  // The extra dice at each cantrip tier: levels 5, 11 and 17 (a cantrip).
  string per_tier = 4;
}

// TableSpellHeal is a table spell's healing.
message TableSpellHeal {
  string dice = 1;
  string per_slot_level = 2;
  // Adds the spellcasting modifier.
  bool adds_modifier = 3;
}

// TableSpell is a spell. Its details become the SpellDetails of the SRD's spells,
// so the combat that resolves an SRD spell resolves this one.
message TableSpell {
  string name_pt = 1;
  // 0 (a cantrip) to 9.
  int32 level = 2;
  // An SRD school key ("school:evocation").
  string school_key = 3;
  TableSpellCastingTime casting_time = 4;
  TableSpellRange range = 5;
  TableSpellDuration duration = 6;
  TableSpellComponents components = 7;
  // Needs a timed duration. A ritual needs a level of 1 or more.
  bool concentration = 8;
  bool ritual = 9;
  // The classes (SRD or table) whose list has the spell.
  repeated string class_keys = 10;
  repeated string desc_pt = 11;
  repeated string higher_level_pt = 12;
  TableSpellTarget target = 13;
  // "melee", "ranged" or empty (no spell attack). Not together with `save`.
  string attack = 14;
  // The saving throw it asks for: NONE or HALF on a success. Unset for none.
  SpellSave save = 15;
  repeated TableSpellDamage damage = 16;
  TableSpellHeal heal = 17;
  // The area the spell keeps on the map while it lasts: a creature that comes into it, or begins its
  // turn in it, is hit as `save` and `damage` say (a spell with no `save` just deals the damage).
  // Unset: the spell does nothing of the kind. Needs an AREA target of a sphere, a cylinder or a cube,
  // exactly one damage type, a timed duration or a concentration, and no attack and no heal.
  TableSpellZone zone = 18;
}

// TableSpellZone is what a table spell leaves on the map (the areas of Moonbeam or Spirit Guardians,
// for the table's own spells). Its shape and size are the spell's target, the damage and the save are
// the spell's, its time is the spell's duration.
message TableSpellZone {
  // When the area catches a creature (required).
  TableZoneTrigger trigger = 1;
  // The area is centered on the caster and goes where the caster goes. It needs the range Self; without
  // it the area is placed at a point within range and stays there.
  bool follows_caster = 2;
}

// TableZoneTrigger is when a table spell's area catches a creature.
enum TableZoneTrigger {
  TABLE_ZONE_TRIGGER_UNSPECIFIED = 0;
  // When the creature begins its turn in the area.
  TABLE_ZONE_TRIGGER_START_OF_TURN = 1;
  // When the creature comes into the area, the first time on a turn.
  TABLE_ZONE_TRIGGER_FIRST_ENTRY = 2;
  // Both.
  TABLE_ZONE_TRIGGER_BOTH = 3;
}

// TableContentViolation is one thing the server refused in a write: the path of
// the field in the request's body and a stable reason code. The app writes the
// Portuguese text from the code; nobody parses `message`.
message TableContentViolation {
  // The path of the field the editor draws, with the body's field names and its
  // own indexes ("table_class.levels[4].slots[2]",
  // "table_class.levels[4].features[0].effects[1].value",
  // "table_subclass.always_prepared[1].spell_key",
  // "table_class.casting.list_from"): one field per rule, so the editor marks the
  // input and not the whole entry. Empty for the content as a whole. A formula that
  // does not compile is at the effect's `value`, `when` or `max`, and a field the
  // effect's type does not read (GetEffectMenu) is at that field.
  string field = 1;
  // One of: "limit" (a count, a size or a budget is over its limit), "bad_key",
  // "duplicate_key", "reserved_key", "bad_name", "bad_text", "dangling_reference"
  // (a reference does not exist), "forbidden_effect", "bad_formula", "bad_table",
  // "bad_casting", "bad_value", "overlay" (the content as a whole), "immutable"
  // (a key, kind or parent changed, or a spell crossing between cantrip and
  // leveled), "duplicate_name" (another entry of the kind has the name), "unknown_field" (ImportTableContent:
  // a field the message does not have) and
  // "size_limit" (64 KiB of data). The 1000-entry limit is "limit", with an empty
  // field. In ImportTableContent a violation about the pack itself is at a field
  // that starts with "pack": "pack" (over 3 MiB: "size_limit"), "pack.format" and
  // "pack.version" ("bad_value"), "pack.entries[3].key" ("bad_key" for a key that is
  // not "<kind>:<slug>@mesa" of the entry's kind, "duplicate_key" for one that
  // repeats) and "pack.entries[3].body" ("bad_value": no body, or one of another
  // kind than the key's).
  string reason = 2;
  // English, for logs and tests.
  string message = 3;
  // The entry the violation is about, when it is not the one being written.
  string key = 4;
}

// TableContentRefusal is the error detail of `invalid_argument` on a
// TableContentService write the rules refused. Nothing was changed.
message TableContentRefusal {
  repeated TableContentViolation violations = 1;
}

// TableContentBlockedReason says why a TableContentService write cannot be done now.
enum TableContentBlockedReason {
  TABLE_CONTENT_BLOCKED_REASON_UNSPECIFIED = 0;
  // The entry changed since the editor read it (`expected_revision` is stale).
  // The app says "Esta entrada mudou enquanto você editava". It comes as
  // `aborted`, like a stale sheet, with this detail.
  TABLE_CONTENT_BLOCKED_REASON_STALE = 1;
  // ArchiveTableEntry on an entry that is already archived. (An archived entry
  // can still be edited: it is only not offered as a new choice.)
  TABLE_CONTENT_BLOCKED_REASON_ARCHIVED = 2;
  // UnarchiveTableEntry on an entry that is not archived.
  TABLE_CONTENT_BLOCKED_REASON_NOT_ARCHIVED = 3;
}

// TableContentBlocked is the error detail of TableContentService's
// `failed_precondition` and `aborted`.
message TableContentBlocked {
  TableContentBlockedReason reason = 1;
  // The entry's key.
  string key = 2;
}

// AffectedCharacter is a character of the campaign that uses an entry which was
// just changed and now has issues on its sheet (the master's list in "A classe
// mudou").
message AffectedCharacter {
  string character_id = 1;
  // The character's name, and the display name of its player (empty for an NPC).
  string name = 2;
  string player_display_name = 3;
  // How many new issues, tied to this entry, its sheet has now (issues the sheet
  // did not have when it was last saved, and that depend on the entry).
  int32 issues = 4;
}

// TableContentService reads and writes the table's own content (MR-025, RN-23,
// ADR-0018). The catalog the character editor builds sheets from is
// ContentService.ListContent, which already includes the table's entries; this
// service is for the entries in full and for the master's writes.
//
// Every method needs a valid session cookie and fails with `unauthenticated`
// without one. For a campaign the caller is not a member of, methods answer
// `not_found`, exactly as for a campaign that does not exist (ADR-0011). An ID
// that is not a UUID is answered like an ID that does not exist. Responses carry
// `Cache-Control: no-store`. Reads carry a campaign ID, so they are IDEMPOTENT
// and POST-only (docs/privacy.md).
service TableContentService {
  // ListTableEntries returns the table's entries in full, sorted by kind and
  // Portuguese name, for the editors and for what a player reads of an option
  // (the class numbers and effects, question 83). Any active member of the
  // campaign may call it; a pending member gets `not_found` (they only need the
  // catalog). The master gets every entry, archived and off ones included, with
  // `characters_using` and the `off` mark; a player gets the ones that are not
  // archived and not off (nor the subclass of an off or archived class, nor the
  // subrace of an off or archived race, unless their own sheet uses it), and never
  // sees a count. A reference inside an entry to something a player may not see (a
  // class, a granted spell) is left out of what a player receives.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not an active
  //     member of it.
  rpc ListTableEntries(ListTableEntriesRequest) returns (ListTableEntriesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // CreateTableEntry adds an entry to the table's own content (MR-025, RN-23).
  // Only the master. The server makes the key from the name (unique in the
  // campaign, never changing) and the keys of the features inside. The whole
  // campaign's content is checked with the rules engine before anything is
  // written; a refusal changes nothing. The content revision goes up. The change
  // is live at once, for locked sheets too.
  //
  // Errors:
  //   - `permission_denied`: the caller is not the campaign's master.
  //   - `not_found`: the campaign does not exist, or the caller is not a member.
  //   - `invalid_argument`: a TableContentRefusal detail lists every violation
  //     (the 1000-entry and 64 KiB limits included).
  //
  // Safe to retry when the request carries an idempotency_key: a second call with the same key and
  // the same request returns what the first one made and makes nothing; the same key with another
  // request is `invalid_argument`. Without a key the call is not deduplicated.
  rpc CreateTableEntry(CreateTableEntryRequest) returns (CreateTableEntryResponse) {}

  // UpdateTableEntry replaces an entry's body. The kind, the key and the parent
  // (a subclass's class, a subrace's race) never change. Only the master.
  // `expected_revision` must be the entry's `revision`, or the call is `aborted`
  // with a TableContentBlocked STALE detail. An archived entry can be edited, and
  // stays archived. Everything else is as CreateTableEntry. A spell never crosses
  // between cantrip and leveled (`level` is an `immutable` violation when it would),
  // because a sheet keeps cantrips and leveled spells in different lists. Sheets
  // that use the entry recalculate at once; the ones that end with new issues show
  // "A classe mudou" (DerivedSheet.changed_content), and the response says which.
  //
  // Errors: as CreateTableEntry, plus `not_found` for an unknown key.
  rpc UpdateTableEntry(UpdateTableEntryRequest) returns (UpdateTableEntryResponse) {}

  // ArchiveTableEntry retires an entry: nothing is deleted. Sheets that use it
  // keep working; it is no longer offered as a new choice, and a new sheet, an
  // edit or a level-up that picks it is refused. Only the master. Archiving an
  // archived entry is `failed_precondition` (TableContentBlocked ARCHIVED).
  //
  // Errors: `permission_denied`, `not_found`, `failed_precondition`.
  rpc ArchiveTableEntry(ArchiveTableEntryRequest) returns (ArchiveTableEntryResponse) {}

  // UnarchiveTableEntry brings an archived entry back. The campaign's content is
  // checked again (an entry cannot come back if something it needs is gone).
  // Only the master.
  //
  // Errors: `permission_denied`, `not_found`, `failed_precondition` (NOT_ARCHIVED),
  // `invalid_argument` (a TableContentRefusal).
  rpc UnarchiveTableEntry(UnarchiveTableEntryRequest) returns (UnarchiveTableEntryResponse) {}

  // ExportTableContent returns the campaign's own entries as one content pack
  // (MR-025): the file the master keeps and imports into another campaign, or back
  // into this one. Only the master. Every entry is in it, archived ones included,
  // as a TableEntry with its `key`, `kind`, `name_pt` and its body; what the server
  // manages (revision, timestamps, the count of characters, `off` and `archived`)
  // is left out, and so is every switch: a pack carries content, not a campaign's
  // choices about it. The features keep their keys, so a pack imported back keeps
  // the choices sheets made. The pack is the file the app saves as
  // "<campanha>-conteudo.json", in proto JSON.
  //
  // Errors: `permission_denied`, `not_found`.
  rpc ExportTableContent(ExportTableContentRequest) returns (ExportTableContentResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ImportTableContent loads a content pack into the campaign (MR-025). Only the
  // master. A pack is untrusted input: every entry goes through the rules that
  // CreateTableEntry and UpdateTableEntry apply, with the same violations, and
  // nothing in it is run.
  //
  // With PREVIEW nothing is written: the answer says, for each entry, whether it
  // would be new, updated (and which fields change), unchanged or refused (every
  // violation with its field), and the totals. With APPLY everything is written in
  // one transaction, all or nothing: an entry of the pack whose key the campaign has
  // is updated, keeping its features' keys (and its archived mark and its switch);
  // a key the campaign does not have is created, with the pack's key. An entry that
  // is refused makes APPLY `invalid_argument` with a TableContentRefusal that lists
  // every violation, each with the entry's key, and writes nothing. The content
  // revision goes up once for the whole import, the live content is the new one for
  // every request and sheet, the sheets that use an updated entry recalculate (the
  // answer lists the ones left with issues), and the campaign's session gets
  // `content_changed`. An import that changes nothing writes nothing and does not
  // raise the revision. A new entry is on for the players, as a hand-made one; the
  // import never switches anything off or on.
  //
  // The limits are the ones of the editors, checked on the whole campaign: 1000
  // entries, 64 KiB of data per entry; and the pack itself is at most 3 MiB (in
  // proto JSON), has `format` "meurpg.table-content" and `version` 1, and every key
  // is "<kind>:<slug>@mesa" of its entry's kind, without repeats. The
  // violation reasons of a pack are in TableContentViolation.
  //
  // Errors: `permission_denied`, `not_found`; `invalid_argument` with a
  // TableContentRefusal for a pack the rules refuse (APPLY; PREVIEW answers it as
  // data, except for the pack-level violations, which are `invalid_argument` in
  // both modes).
  //
  // Safe to retry when the request carries an idempotency_key (APPLY): a second call
  // with the same key and the same request returns what the first one answered and
  // writes nothing; the same key with another request is `invalid_argument`. Without
  // a key the call is not deduplicated. PREVIEW ignores the key.
  rpc ImportTableContent(ImportTableContentRequest) returns (ImportTableContentResponse) {}

  // ListOptionSwitches is the master's "Opções para os jogadores" (MR-025, RN-23):
  // every class, subclass, race, subrace, background, spell and feat of the campaign, the
  // SRD's and the table's, each with its on/off state and how many of the
  // campaign's player characters use it, sorted by kind and Portuguese name. It is
  // what the screen draws "o que cada jogador vê" from. Only the master; what a
  // player reads is ContentService.ListContent and ListTableEntries.
  //
  // Errors: `permission_denied`, `not_found`.
  rpc ListOptionSwitches(ListOptionSwitchesRequest) returns (ListOptionSwitchesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // SetOptionSwitches turns options off or on for the players, SRD and table
  // entries alike, in one transaction (up to 700 at once). Everything is on by
  // default. An off option is treated as an archived one for the players, in every
  // read (the catalog, ListTableEntries, ListSpells, GetSpellDetails, the level-up
  // options, the references inside other entries): they never receive it, and the
  // subclasses of an off class and the subraces of an off race go with it. A sheet
  // that already has it keeps working, and an unrelated edit is never refused; a
  // player's new choice of it is refused (CharacterBlocked SWITCHED_OFF_CONTENT,
  // LevelUpRefusal SWITCHED_OFF_CHOICE). The master sees everything, with `off`.
  //
  // A call that changes something raises the campaign's content revision and sends
  // the live hint `content_changed` to the campaign's session (RN-10). A call that
  // changes nothing (everything already in the state asked) changes nothing and
  // sends nothing. Only the master.
  //
  // Errors:
  //   - `permission_denied`, `not_found`;
  //   - `invalid_argument`: no switch at all, more than 700, a key that is not a
  //     class, subclass, race, subrace, background, spell or feat of the campaign's
  //     content, or the same key twice.
  //
  // An archived table entry can be switched like any other (it stays hidden from
  // the players either way); a call whose switches are all in the state asked is
  // not an error: it answers OK with `changed` 0.
  rpc SetOptionSwitches(SetOptionSwitchesRequest) returns (SetOptionSwitchesResponse) {}

  // GetClassTableDefaults gives the numbers the class editor starts from (MR-025,
  // ADR-0018, section 8): the SRD's proficiency bonus by level, the Ability Score
  // Improvement levels, and the 20-row table of each way of casting (none, full,
  // half, pact and a subclass's third caster, each preparing or knowing its
  // spells), with the slots, the cantrips and the spells known of the SRD's own
  // class tables. The browser computes none of it: the master edits from these
  // rows and the writes come back through CreateTableEntry and UpdateTableEntry,
  // which check them as they check any edit. Only the master.
  //
  // Errors: `permission_denied`, `not_found`.
  rpc GetClassTableDefaults(GetClassTableDefaultsRequest) returns (GetClassTableDefaultsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // GetEffectMenu gives the closed menu of what a table feature may do, as data
  // (MR-025, ADR-0018, section 4): the effect types and the fields of each, every
  // closed list a field takes (modifier targets, modes, proficiencies, roll modes
  // and targets, senses, recharges, granted-action economies, choice kinds, skills,
  // languages, tools) with Portuguese names, the SRD option sets a choice may
  // offer (fighting styles and the like), the formula helpers and the classes
  // `classLevel` takes, and the limits. The class editor builds its pickers from
  // it and hard-codes none of them; whatever it offers, TableContentService
  // accepts. Only the master.
  //
  // Errors: `permission_denied`, `not_found`.
  rpc GetEffectMenu(GetEffectMenuRequest) returns (GetEffectMenuResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// ListTableEntriesRequest names a campaign.
message ListTableEntriesRequest {
  string campaign_id = 1;
}

// ListTableEntriesResponse carries the table's entries.
message ListTableEntriesResponse {
  repeated TableEntry entries = 1;
  // The campaign's content revision, 0 while the table has no content of its own.
  int32 table_revision = 2;
  // The content version the revision makes, such as "srd51@0123456789ab+fx.12+mesa.7".
  string content_version = 3;
}

// CreateTableEntryRequest adds an entry.
message CreateTableEntryRequest {
  string campaign_id = 1;
  // The entry. Exactly one, which gives the kind. The feature keys are left
  // empty; the key of the entry is made by the server from the body's name_pt.
  oneof body {
    TableClass table_class = 10;
    TableSubclass table_subclass = 11;
    TableRace table_race = 12;
    TableSubrace table_subrace = 13;
    TableBackground table_background = 14;
    TableSpell table_spell = 15;
    TableFeat table_feat = 17;
    TableOption table_option = 18;
    TableClassFeature table_class_feature = 19;
    TableCreature table_creature = 20;
  }
  // Optional. 1 to 64 characters, chosen once by the app for this action: a retry with the
  // same key and the same request returns what the first call made instead of making another.
  // The key is unique in the campaign; the same key with another request is `invalid_argument`.
  // Empty: the call is not deduplicated.
  string idempotency_key = 16;
}

// CreateTableEntryResponse returns the new entry.
message CreateTableEntryResponse {
  // The entry as stored: the key, the keys of the features and the revision.
  TableEntry entry = 1;
  // The campaign's new content revision.
  int32 table_revision = 2;
}

// UpdateTableEntryRequest replaces an entry's body.
message UpdateTableEntryRequest {
  string campaign_id = 1;
  // The entry's key.
  string key = 2;
  // The entry's `revision` as the editor read it.
  int32 expected_revision = 3;
  // The new body: the kind of the key, its parent unchanged. The features keep
  // the keys the editor read; a new feature has none.
  oneof body {
    TableClass table_class = 10;
    TableSubclass table_subclass = 11;
    TableRace table_race = 12;
    TableSubrace table_subrace = 13;
    TableBackground table_background = 14;
    TableSpell table_spell = 15;
    TableFeat table_feat = 17;
    TableOption table_option = 18;
    TableClassFeature table_class_feature = 19;
    TableCreature table_creature = 20;
  }
}

// UpdateTableEntryResponse returns the entry as stored.
message UpdateTableEntryResponse {
  TableEntry entry = 1;
  int32 table_revision = 2;
  // The characters that use the entry and have issues on their sheets with the
  // new rules (never the ones without), for the master's "Fichas com aviso".
  repeated AffectedCharacter affected_characters = 3;
}

// ArchiveTableEntryRequest names an entry.
message ArchiveTableEntryRequest {
  string campaign_id = 1;
  string key = 2;
}

// ArchiveTableEntryResponse returns the archived entry.
message ArchiveTableEntryResponse {
  TableEntry entry = 1;
  int32 table_revision = 2;
}

// UnarchiveTableEntryRequest names an entry.
message UnarchiveTableEntryRequest {
  string campaign_id = 1;
  string key = 2;
}

// UnarchiveTableEntryResponse returns the entry that came back.
message UnarchiveTableEntryResponse {
  TableEntry entry = 1;
  int32 table_revision = 2;
}

// TableContentPack is a campaign's own content as a file (MR-025):
// {"format": "meurpg.table-content", "version": 1, "name": "...", "entries": [...]}
// in proto JSON. It carries no campaign, user or date: it can be shared and
// imported anywhere.
message TableContentPack {
  // Always "meurpg.table-content". ImportTableContent refuses another.
  string format = 1;
  // 1. ImportTableContent refuses another.
  int32 version = 2;
  // A label for the pack: the campaign's name when exported. 0 to 80 characters on
  // one line; kept by nothing, shown in the preview.
  string name = 3;
  // The entries. At most 1000. Each has `key`, `kind`, `name_pt` and its body; the
  // other fields of TableEntry are left out of an export and ignored in an import.
  repeated TableEntry entries = 4;
}

// ExportTableContentRequest names a campaign.
message ExportTableContentRequest {
  string campaign_id = 1;
}

// ExportTableContentResponse carries the pack.
message ExportTableContentResponse {
  TableContentPack pack = 1;
}

// TableImportMode says whether ImportTableContent writes.
enum TableImportMode {
  TABLE_IMPORT_MODE_UNSPECIFIED = 0;
  // Check the pack and say what an import would do; write nothing.
  TABLE_IMPORT_MODE_PREVIEW = 1;
  // Write the pack, all or nothing.
  TABLE_IMPORT_MODE_APPLY = 2;
}

// ImportTableContentRequest carries a pack and what to do with it.
message ImportTableContentRequest {
  string campaign_id = 1;
  // The pack as a message. Required unless `pack_json` is set.
  TableContentPack pack = 2;
  // Required.
  TableImportMode mode = 3;
  // Optional, for APPLY. 1 to 64 characters, chosen once by the app for this action:
  // a retry with the same key and the same request returns what the first call
  // answered instead of importing again. The key is unique in the campaign; the same
  // key with another request is `invalid_argument`.
  string idempotency_key = 4;
  // The pack file as the master has it, in proto JSON. Prefer it to `pack`: the server
  // reads it strictly, and a field it does not know (a misspelled "proficiency" for
  // "proficiency_key") is a violation of its entry at the path of the field (reason
  // "unknown_field"), never dropped. When set, `pack` must be unset. The 3 MiB limit is
  // this field's size.
  bytes pack_json = 5;
}

// TableImportStatus is what an import does with one entry of the pack.
enum TableImportStatus {
  TABLE_IMPORT_STATUS_UNSPECIFIED = 0;
  // The campaign has no entry with this key: it is created.
  TABLE_IMPORT_STATUS_NEW = 1;
  // The campaign has the entry and the pack's differs: it is replaced, keeping the
  // keys of its features.
  TABLE_IMPORT_STATUS_UPDATED = 2;
  // The campaign has the same entry: nothing changes.
  TABLE_IMPORT_STATUS_UNCHANGED = 3;
  // The rules refuse the entry. An import with a refused entry writes nothing.
  TABLE_IMPORT_STATUS_REFUSED = 4;
}

// TableImportEntry is the outcome for one entry of the pack, in the pack's order.
message TableImportEntry {
  string key = 1;
  TableContentKind kind = 2;
  string name_pt = 3;
  TableImportStatus status = 4;
  // UPDATED: what changes, as the paths of the entry's fields that differ: "name_pt"
  // and the body's top-level fields ("table_class.levels", "table_race.speed_ft").
  repeated string changed_fields = 5;
  // REFUSED: every violation, with the same fields and reasons as CreateTableEntry
  // (the `key` of each is this entry's, or another entry's the write would break).
  repeated TableContentViolation violations = 6;
}

// TableImportTotals counts the entries of a pack by outcome.
message TableImportTotals {
  int32 new = 1;
  int32 updated = 2;
  int32 unchanged = 3;
  int32 refused = 4;
}

// ImportTableContentResponse says what the import did, or with PREVIEW would do.
message ImportTableContentResponse {
  // The mode of the request.
  TableImportMode mode = 1;
  // The pack's label.
  string pack_name = 2;
  // One per entry of the pack, in its order.
  repeated TableImportEntry entries = 3;
  TableImportTotals totals = 4;
  // The campaign's content revision: after an APPLY that changed something, the new
  // one; otherwise the current one.
  int32 table_revision = 5;
  // APPLY: the characters that use an updated entry and have issues on their sheets
  // with the new rules (never the ones without).
  repeated AffectedCharacter affected_characters = 6;
}

// OptionSwitch is the state asked for one option.
message OptionSwitch {
  // The option's content key: "class:wizard", "subclass:evocation",
  // "race:gnome@..." (a table key ends in "@mesa").
  string key = 1;
  // True turns it off for the players, false turns it back on.
  bool off = 2;
}

// ListOptionSwitchesRequest names a campaign.
message ListOptionSwitchesRequest {
  string campaign_id = 1;
}

// OptionSwitchEntry is one option in the master's list.
message OptionSwitchEntry {
  string key = 1;
  // The kind of the option (class, subclass, race, subrace, background, spell, feat,
  // option, class feature, creature).
  TableContentKind kind = 2;
  string name_pt = 3;
  // True for the table's own entry ("@mesa"), false for the SRD's.
  bool table = 4;
  // The option's own switch. A subclass of an off class is hidden from the players
  // too and keeps its own switch as it is (see `hidden`).
  bool off = 5;
  // The table retired the entry (only the table's entries can be).
  bool archived = 6;
  // True when the players do not receive it: archived, off, or its class or race
  // is off. What "o que cada jogador vê" shows.
  bool hidden = 7;
  // The class (for a subclass) or the race (for a subrace) it belongs to; empty for
  // the other kinds.
  string parent_key = 8;
  // The spell's circle, 0 for a cantrip; 0 for the other kinds.
  int32 level = 9;
  // How many of the campaign's player characters use it (a race, subrace, class,
  // subclass, background, or a cantrip, known or prepared spell); a character counts
  // once.
  int32 characters_using = 10;
}

// ListOptionSwitchesResponse carries the master's list.
message ListOptionSwitchesResponse {
  repeated OptionSwitchEntry options = 1;
  // The campaign's content revision, 0 while nothing was written.
  int32 table_revision = 2;
}

// SetOptionSwitchesRequest asks for the state of some options.
message SetOptionSwitchesRequest {
  string campaign_id = 1;
  // At least one, at most 700; a key once.
  repeated OptionSwitch switches = 2;
}

// SetOptionSwitchesResponse says what changed.
message SetOptionSwitchesResponse {
  // The campaign's content revision after the call (the same as before when
  // nothing changed).
  int32 table_revision = 1;
  // How many options changed state.
  int32 changed = 2;
  // The options that changed, as ListOptionSwitches gives them.
  repeated OptionSwitchEntry options = 3;
}

// GetClassTableDefaultsRequest names a campaign.
message GetClassTableDefaultsRequest {
  string campaign_id = 1;
}

// GetClassTableDefaultsResponse carries the defaults of the 20-level table.
message GetClassTableDefaultsResponse {
  // The proficiency bonus by level, 20 entries, level 1 first: +2 at levels 1 to 4
  // up to +6 at 17 to 20. A TableClassLevel with a `prof_bonus` of 0 means this.
  repeated int32 prof_bonus = 1;
  // The levels with an Ability Score Improvement (4, 8, 12, 16 and 19): what an
  // empty TableClass.asi_levels means.
  repeated int32 asi_levels = 2;
  // The class level the subclass is chosen at when TableClass.subclass_level is 0 (3).
  int32 subclass_level = 3;
  // One table per way of casting, in this order: none, then full, half, pact and
  // third, each with the ways of preparing it offers.
  repeated CastingTableDefault tables = 4;
}

// CastingTableDefault is the default 20-level table of one way of casting.
message CastingTableDefault {
  // "" for a class that does not cast, "full", "half" or "pact" for a class, and
  // "third" for the casting of a subclass (TableCasting.kind).
  string kind = 1;
  // "known" or "prepared" (TableCasting.preparation); empty for a class that does
  // not cast.
  string preparation = 2;
  // The class level casting starts at by default: 1 for a full caster and for pact
  // magic, 2 for a half caster, 3 for a third caster; 0 for a class that does not
  // cast. The rows before it have the casting columns at zero.
  int32 start_level = 3;
  // The SRD class whose table the numbers are ("class:cleric", "class:paladin"...);
  // empty for the third caster, whose slots are the full table at a third of the
  // level, rounded up.
  string reference_class_key = 4;
  // The 20 rows, level 1 first, ready to be the `levels` of a TableClass (the
  // features are empty). A subclass takes the rows from `start_level` on.
  repeated TableClassLevel rows = 5;
}

// GetEffectMenuRequest names a campaign (its classes are in the menu).
message GetEffectMenuRequest {
  string campaign_id = 1;
}

// GetEffectMenuResponse carries the closed menu of effects.
message GetEffectMenuResponse {
  // The effect types, in the picker's order. "Só texto" is a feature with none.
  repeated EffectMenuType types = 1;
  // The closed lists the types' fields point at (EffectMenuField.list).
  repeated EffectMenuList lists = 2;
  // The SRD features that offer options: what a `choice` effect of kind "feature"
  // may list in `from`.
  repeated EffectOptionSet option_sets = 3;
  // The functions a formula may call.
  repeated FormulaHelper helpers = 4;
  // What `classLevel("...")` takes: the SRD's classes and the campaign's, by their
  // key without "class:".
  repeated string class_indexes = 5;
  // The most features one class or subclass has, and the most effects one feature
  // has, and the most tags one effect has.
  int32 max_features_per_class = 6;
  int32 max_effects_per_feature = 7;
  int32 max_tags_per_effect = 8;
  // The attacks an extra_attack effect may make, from and to.
  int32 extra_attack_min = 9;
  int32 extra_attack_max = 10;
}

// EffectMenuType is one effect type of the menu.
message EffectMenuType {
  // TableEffect.type.
  string type = 1;
  // The picker's label and its one-line explanation, in Portuguese.
  string name_pt = 2;
  string hint_pt = 3;
  // The fields the type reads, in the order the editor shows them. Any other field
  // of TableEffect set on this type is refused when the entry is written (a
  // TableContentViolation of reason "bad_value" at that field); one that is already
  // stored is ignored. `when`, `tags` and `text_pt` are accepted on every type, and
  // are listed only where they are usual. A note's `value` (a number shown in
  // `text_pt`) needs a `text_pt` to show it in. What `from` takes depends on the
  // kind of choice: for "feature", the keys of one EffectOptionSet; for "skill" and
  // "expertise", skill keys (`skills`); for "language", language keys (`languages`);
  // for "tool", tool keys (`tools`); for "cantrip" and "spell", a spell list: SRD
  // class keys (`class:wizard`) whose list the player picks from (ClassIndexes
  // lists them). Empty `from` is any of the kind.
  repeated EffectMenuField fields = 4;
  // Only a feat has this effect (ability_increase): the editor of a feature leaves
  // it out.
  bool feat_only = 5;
}

// EffectMenuField is a field of an effect type.
message EffectMenuField {
  // The name of the TableEffect field ("target", "range_ft", "text_pt"...).
  string name = 1;
  // The effect is refused without it.
  bool required = 2;
  // How the editor asks: "formula" (an Int formula), "condition" (a Bool formula),
  // "text", "number", "choice" (one value of `list`), "choices" (several), "cards" (one
  // value of a short `list`, shown as radio cards with their hints), "tags",
  // "resource_ref" (the name of a resource effect the entry defines; the editor lists
  // the ones it has), "state_ref" (the name of a state effect the entry defines, or one
  // of `list` when it has one: "rage" for a resistance) or "yes_no" (a switch: true or false).
  string kind = 3;
  // The EffectMenuList the value comes from, when it is a closed list; empty for a
  // free value. For a `choice` effect's `from` the list depends on the kind chosen:
  // skills (`skills`), languages (`languages`), tools (`tools`) or, for "feature",
  // the keys of an option set.
  string list = 4;
  // The bounds of a number; 0 when there is none.
  int32 min = 5;
  int32 max = 6;
  // The editor shows the field even when it is optional and empty, never folded with
  // the rarer ones: what the effect does lies in it (ranged_attack's switches, none of
  // them required alone).
  bool always_shown = 7;
}

// EffectMenuValue is a value of a closed list.
message EffectMenuValue {
  // What the effect stores ("add", "skill.stealth", "long_rest"...).
  string key = 1;
  string name_pt = 2;
  // A short explanation where the name alone does not say; often empty.
  string hint_pt = 3;
}

// EffectMenuList is a closed list a field takes.
message EffectMenuList {
  // "modifier_targets", "modifier_modes", "proficiency_targets",
  // "proficiency_levels", "roll_modes", "roll_targets", "senses", "recharges",
  // "economies", "choice_kinds", "skills", "languages", "tools", "tag_prefixes",
  // "abilities" (the six abilities, for an ability_increase's `from`),
  // "ability_increase_amounts" (its `value`: "1" or "2"), "state_ends" (a state's
  // `ends_on`), "state_economies" (its `economy`), "weapon_filters" (a weapon_rule's
  // `weapon`) or "weapon_kinds" (a pseudo_weapon's).
  string name = 1;
  repeated EffectMenuValue values = 2;
}

// EffectOptionSet is an SRD feature that offers options, such as a fighting style.
message EffectOptionSet {
  // The offering feature's key and its Portuguese name.
  string key = 1;
  string name_pt = 2;
  // How many the SRD lets the character pick; 0 when it depends on the level (the
  // eldritch invocations).
  int32 choose = 3;
  repeated EffectMenuValue options = 4;
}

// FormulaHelper is a function a formula may call.
message FormulaHelper {
  // How it is written: `mod("<habilidade>")`.
  string call = 1;
  // What it gives: "number", "text" or "yes/no".
  string returns = 2;
  // What it is for, in Portuguese.
  string hint_pt = 3;
}
