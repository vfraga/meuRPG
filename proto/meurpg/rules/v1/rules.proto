syntax = "proto3";

// Package meurpg.rules.v1 is about the game rules: the rules content a
// character is built from (races, classes, skills, spells...) and the
// numbers the server derives from a character's choices (ADR-0008).
//
// Rules content comes from the System Reference Document 5.1 (SRD 5.1),
// under the Creative Commons Attribution 4.0 license. Content.attribution
// carries the attribution text the app must show.
//
// Conventions used in every message of this package:
//   - Content keys. Every piece of rules content has a stable key made of
//     its type and an ID, such as "race:gnome", "subrace:rock-gnome",
//     "class:wizard", "subclass:evocation", "background:acolyte",
//     "skill:arcana", "equipment:leather-armor", "spell:fire-bolt",
//     "feature:arcane-recovery" or "trait:darkvision". Sheets store these
//     keys, never names, so a name can be fixed without touching any sheet.
//   - Names. `name` is the English name from the SRD, such as "Fire Bolt";
//     `name_pt` is our own Portuguese name, such as "Raio de Fogo".
//     `description` is the SRD's English text. Every other text the server
//     writes for people (hints, issues, damage types) is in Portuguese.
//   - Units. Distances are in feet (fields ending in `_ft`), as in the SRD;
//     the app converts them for display.
package meurpg.rules.v1;

import "google/protobuf/timestamp.proto";

// ContentService lists the rules content that a campaign's characters can
// be built from.
//
// Every method needs a valid session cookie and fails with `unauthenticated`
// without one. For a campaign the caller is not a member of, methods answer
// `not_found`, exactly as for a campaign that does not exist (ADR-0011). An
// ID that is not a UUID is answered like an ID that does not exist. A
// database that does not answer gives `unavailable`; the app may try again.
//
// Responses carry `Cache-Control: no-store`. Reads carry a campaign ID, so
// they are IDEMPOTENT and POST-only: a GET would put the ID in the URL, and
// URLs end up in the platform's request logs (docs/privacy.md).
service ContentService {
  // ListContent returns the catalog the character editor offers: races,
  // subraces, classes, subclasses, backgrounds, skills, armor, weapons and
  // spells, each with its key and names. Any member of the campaign may call
  // it, and so may a pending member (RN-15, MR-024), who needs it to create
  // their character while they wait for the master's approval.
  //
  // The catalog is the campaign's own (MR-025, RN-23): the SRD 5.1 content plus
  // the table's classes, subclasses, races, subraces, backgrounds and spells,
  // with `content_version` "srd51@...+fx.N+mesa.<revision>" ("+mesa" only once the
  // table has content). A player never receives an archived entry (the master's
  // drafts and retired entries) nor an option the master switched off in "Opções
  // para os jogadores" (SRD or table, with the subclasses of an off class and the
  // subraces of an off race); a master receives them, with the `archived` and
  // `off` marks. The entries in full, and how many characters use each, are
  // TableContentService.ListTableEntries.
  //
  // With `character_id` (a player editing or levelling their own sheet), the
  // entries that sheet uses come back even when the master archived or switched
  // them off, still marked `archived` or `off`: the editor can show the current
  // value and keep what the sheet has, and never offers it as a new choice. Only
  // the caller's own sheet counts, never another player's; the master's catalog
  // has them all anyway, so for the master it changes nothing.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a
  //     member of it; with `character_id`, also a character that is not the
  //     caller's own sheet in this campaign. A pending member may name their
  //     own draft (they edit it while they wait for the master).
  rpc ListContent(ListContentRequest) returns (ListContentResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // GetSpellDetails returns everything the SRD says about one spell,
  // structured: casting time, range, components, duration, attack or saving
  // throw, damage and healing by level, and the English description. It is
  // what the spell's "?" dialog shows; ListContent keeps spells light on
  // purpose. Same access as ListContent: any member of the campaign, a
  // pending member included.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, the caller is not a
  //     member of it, or no spell has that key.
  rpc GetSpellDetails(GetSpellDetailsRequest) returns (GetSpellDetailsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListSpells is the players' "Magias" page (MR-045): every spell of the table,
  // the SRD's and the master's together, found by name and filtered by class,
  // circle and school, sorted by Portuguese name. ListContent has the whole
  // catalog but lets a pending member in and leaves the search and the filters to
  // the app; this is the page's own read: the same list, the same rules, one
  // place. A row is the light `Spell`; one spell in full is GetSpellDetails.
  //
  // A player never receives an archived table spell, nor an archived class's
  // key in `class_keys`; the master receives the archived ones, with the
  // `archived` mark (RN-23). The master's switches "Opções para os jogadores"
  // (TableContentService.SetOptionSwitches) leave out of a player's list the
  // spells that are off, and the off classes from `class_keys`; the master gets
  // them with the `off` mark.
  //
  // `character_id` is "Só as que posso aprender": the spells on the list of one
  // of the character's casting classes up to the highest circle that class
  // casts (cantrips included), the lists of a table class and of a third
  // caster's subclass too, so a multiclass character gets each class's list by
  // its own level.
  //
  // Only an active member may ask: a pending member (RN-15) gets `not_found`, as
  // for ListCreatures.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, the caller is not an active
  //     member of it, or `character_id` is not a character the caller may see
  //     in it.
  //   - `invalid_argument`: query is longer than 100 characters, a level is
  //     not 0 to 9, a filter list has more than 20 entries, page_size is not 1
  //     to 400, or page_token is not one this list gave for these same filters.
  //   - `failed_precondition`: `character_id` is a character with a basic
  //     sheet (an NPC), which has no casting classes.
  rpc ListSpells(ListSpellsRequest) returns (ListSpellsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListCreatures searches the SRD's 334 creatures (MR-037): the master's "Dar
  // uma criatura", the Wild Shape list, the summon choices. It filters by
  // part of the name (Portuguese or English, ignoring case and accents), by
  // creature type, by size, by challenge rating (lowest and highest) and by
  // speeds, sorts by Portuguese name, and answers a page at a time (page_size 1
  // to 400, 50 by default, page_token; 400 holds the whole bestiary). Every row has the Portuguese and the
  // English name, size, type, challenge rating, XP, armor class and average
  // hit points (the bestiary's row, MR-042). The creatures are public SRD rules, the same for
  // every campaign; only an active member of the campaign may ask, and a
  // pending member (RN-15) gets `not_found` on purpose: a player waiting for
  // approval needs no creature to build its character.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not an
  //     active member of it.
  //   - `invalid_argument`: min_cr or max_cr is not one of the SRD's challenge
  //     ratings, min_cr is above max_cr, size is not a creature size, query is
  //     longer than 100 characters, page_size is not 1 to 400, or page_token is
  //     not one this list gave for these same filters.
  rpc ListCreatures(ListCreaturesRequest) returns (ListCreaturesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // GetCreature returns one creature's stat block, for the screen that shows
  // it: armor class, hit points, speeds, abilities, saves and skills, damage
  // resistances, senses, challenge rating, traits, actions with their attack
  // bonus, damage and saving throw, reactions and legendary actions. Labels
  // are in Portuguese; the text of the traits and actions is the SRD's
  // English, as for spells. Same access as ListCreatures.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, the caller is not an active
  //     member of it, or no creature has that key.
  rpc GetCreature(GetCreatureRequest) returns (GetCreatureResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListTrapPresets returns the SRD's eight sample traps (MR-035), in our
  // words and with the SRD's numbers, to fill the master's trap form, and the
  // SRD's tables of how severe a trap is (the form's hint: "Revés: CD 10 a 11,
  // bônus de ataque +3 a +5"). A preset only fills the form: the master edits
  // anything, and the trap on the map keeps its own copy of the numbers. The
  // content is the same for every campaign. Any active member may call it; a
  // pending member (RN-15) gets `not_found`, as for ListCreatures.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not an
  //     active member of it.
  rpc ListTrapPresets(ListTrapPresetsRequest) returns (ListTrapPresetsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListLightPresets returns the SRD's sources of light with their radii
  // (MR-036): Vela, Tocha, Lâmpada, Lanterna coberta, the spell Luz, Chama
  // Contínua and Luz do Dia. They fill the master's light form and the light a
  // character carries (MapService.SetCarriedLight takes a preset's key). Same
  // access as ListTrapPresets.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not an
  //     active member of it.
  rpc ListLightPresets(ListLightPresetsRequest) returns (ListLightPresetsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// ListTrapPresetsRequest names a campaign.
message ListTrapPresetsRequest {
  string campaign_id = 1;
}

// ListTrapPresetsResponse carries the presets and the severity tables.
message ListTrapPresetsResponse {
  // The eight sample traps, in the SRD's order.
  repeated TrapPreset presets = 1;
  // Revés, Perigosa and Mortal, with the save DCs and attack bonuses that suit
  // each ("Trap Save DCs and Attack Bonuses").
  repeated TrapSeverity severities = 2;
  // The damage that suits each severity at four ranges of character levels
  // ("Damage Severity by Level").
  repeated TrapDamageRow damage_by_level = 3;
}

// ListLightPresetsRequest names a campaign.
message ListLightPresetsRequest {
  string campaign_id = 1;
}

// ListLightPresetsResponse carries the light presets.
message ListLightPresetsResponse {
  repeated LightPreset presets = 1;
}

// LightPreset is a source of light the SRD describes.
message LightPreset {
  // The preset's key, "light:torch".
  string key = 1;
  // Its Portuguese name ("Tocha").
  string name_pt = 2;
  // The radius of its bright light, in feet (multiples of 5).
  int32 bright_ft = 3;
  // How much further its dim light goes past the bright light, in feet
  // (multiples of 5): "bright light in a 20-foot radius and dim light for an
  // additional 20 feet" is 20 and 20.
  int32 dim_ft = 4;
  // How long it lasts, as text for the master ("1 hora", "8 horas").
  string duration_pt = 5;
}

// TrapTrigger says what fires a trap.
enum TrapTrigger {
  TRAP_TRIGGER_UNSPECIFIED = 0;
  // "Ao entrar na área": a player character or its creature entering the
  // area fires it (a pressure plate, a trip wire, a false floor). NPCs never
  // fire it by themselves.
  TRAP_TRIGGER_ENTER = 1;
  // "Manual": the master fires it (a chest opened, a door).
  TRAP_TRIGGER_MANUAL = 2;
}

// TrapTargets says whom a trap's effect reaches.
enum TrapTargets {
  TRAP_TARGETS_UNSPECIFIED = 0;
  // Every creature in the trap's area.
  TRAP_TARGETS_AREA = 1;
  // The master picks who is caught, because the effect comes from somewhere
  // else (a statue's cone, a rolling sphere) or hits at random (darts).
  TRAP_TARGETS_MANUAL = 2;
}

// TrapSaveApplies says whom a trap's saving throw is asked of.
enum TrapSaveApplies {
  TRAP_SAVE_APPLIES_UNSPECIFIED = 0;
  // Each creature the trap caught.
  TRAP_SAVE_APPLIES_CAUGHT = 1;
  // Each creature one of the trap's attacks hit; the effect needs an attack.
  TRAP_SAVE_APPLIES_HIT = 2;
}

// TrapPassOutcome says what a creature that passes the saving throw takes.
enum TrapPassOutcome {
  TRAP_PASS_OUTCOME_UNSPECIFIED = 0;
  // Half the damage the failure would have done.
  TRAP_PASS_OUTCOME_HALF = 1;
  // Nothing.
  TRAP_PASS_OUTCOME_NONE = 2;
}

// TrapDamage is damage of one type.
message TrapDamage {
  // The dice, such as "2d6" (1 to 20 dice of d4, d6, d8, d10 or d12), or a flat
  // number ("1", 1 to 100) such as the poison needle's.
  string dice = 1;
  // The damage type's key, "damage-type:poison".
  string damage_type_key = 2;
  // The damage type's Portuguese name ("veneno"). Output only: ignored on input.
  string damage_type_pt = 3;
}

// TrapCondition is a condition a trap gives, with how long it lasts.
message TrapCondition {
  // The condition's key, "condition:restrained".
  string condition_key = 1;
  // Its Portuguese name ("Impedido"). Output only: ignored on input.
  string condition_pt = 2;
  // How long it lasts, as text for the master ("1 hora"), 0 to 60 characters;
  // empty for none.
  string duration_pt = 3;
}

// TrapAttack is a trap that attacks: `count` attacks with a bonus, each
// against one target. A hit does the damage.
message TrapAttack {
  // The attack bonus, 0 to 20.
  int32 bonus = 1;
  // How many attacks, 1 to 10.
  int32 count = 2;
  // The damage of one hit.
  TrapDamage damage = 3;
}

// TrapOnFail is what a creature that fails the saving throw takes: damage
// and/or a condition.
message TrapOnFail {
  // Up to 4 damage parts.
  repeated TrapDamage damage = 1;
  // A condition, or unset for none.
  TrapCondition condition = 2;
}

// TrapSaveEffect is the saving throw of a trap.
message TrapSaveEffect {
  // The ability of the save. Required.
  Ability ability = 1;
  // The difficulty class, 1 to 30.
  int32 dc = 2;
  // Whom it is asked of. Required.
  TrapSaveApplies applies_to = 3;
  // What a failure does: damage and/or a condition (at least one).
  TrapOnFail on_fail = 4;
  // What a pass does. Required. HALF needs damage on a failure.
  TrapPassOutcome on_pass = 5;
}

// TrapEffect is what a trap does, in parts, any of them (the empty effect is
// "só descrição"). The same shape is the preset's and the trap on the map's:
// creating a trap from a preset copies it, and everything stays editable.
message TrapEffect {
  // An attack roll, or unset for none.
  TrapAttack attack = 1;
  // Damage that always lands on every creature caught, with no roll to avoid it
  // (a pit's fall); up to 4 parts.
  repeated TrapDamage damage = 2;
  // Conditions given to every creature caught; up to 4.
  repeated TrapCondition conditions = 3;
  // A saving throw, or unset for none.
  TrapSaveEffect save = 4;
  // Whom the effect reaches. Unspecified on input means AREA.
  TrapTargets targets = 5;
}

// TrapPreset is a sample trap the master can start from.
message TrapPreset {
  // The preset's key, "trap:simple-pit".
  string key = 1;
  // Its Portuguese name ("Fosso simples").
  string name_pt = 2;
  // "mechanical" or "magic".
  string kind = 3;
  // The preset's text, in our own words, for the point's description.
  string description_pt = 4;
  // The DC to notice it (Wisdom (Perception), passive or active); 0 when the
  // SRD gives none (the poison needle).
  int32 notice_dc = 5;
  // The DC to find it by searching (Intelligence (Investigation)).
  int32 find_dc = 6;
  // True when the SRD gives no DC to find this trap, only to spot it, so
  // find_dc is ours (the DC to spot, reused).
  bool find_dc_is_ours = 7;
  // What fires it.
  TrapTrigger trigger = 8;
  // The side, in squares, of the block around the trap's square that fires it:
  // 1 (the square alone) to 4.
  int32 area_size = 9;
  // The depth of a pit in feet, 0 for a trap that is not a pit. The fall damage
  // is already in effect.damage.
  int32 fall_ft = 10;
  // What it does, in parts: the copy a new trap starts from.
  TrapEffect effect = 11;
}

// TrapSeverity is one row of the SRD's "Trap Save DCs and Attack Bonuses".
message TrapSeverity {
  // "setback", "dangerous" or "deadly".
  string key = 1;
  // "Revés", "Perigosa" or "Mortal".
  string name_pt = 2;
  // The saving throw DCs that suit this severity, lowest and highest.
  int32 save_dc_min = 3;
  int32 save_dc_max = 4;
  // The attack bonuses that suit this severity, lowest and highest.
  int32 attack_bonus_min = 5;
  int32 attack_bonus_max = 6;
}

// TrapDamageRow is one row of the SRD's "Damage Severity by Level": the damage
// that suits characters of levels from_level to to_level.
message TrapDamageRow {
  // The character levels the row covers, lowest and highest.
  int32 from_level = 1;
  int32 to_level = 2;
  // The damage dice that suit each severity, such as "2d10".
  string setback = 3;
  string dangerous = 4;
  string deadly = 5;
}

// Ability is one of the six ability scores.
enum Ability {
  ABILITY_UNSPECIFIED = 0;
  // Strength ("Força", FOR).
  ABILITY_STRENGTH = 1;
  // Dexterity ("Destreza", DES).
  ABILITY_DEXTERITY = 2;
  // Constitution ("Constituição", CON).
  ABILITY_CONSTITUTION = 3;
  // Intelligence ("Inteligência", INT).
  ABILITY_INTELLIGENCE = 4;
  // Wisdom ("Sabedoria", SAB).
  ABILITY_WISDOM = 5;
  // Charisma ("Carisma", CAR).
  ABILITY_CHARISMA = 6;
}

// AbilityScores holds one number per ability. The field that uses it says
// what the numbers mean and their range: base scores, or bonuses.
//
// Sheets are stored as JSON with these field names, so they never change.
message AbilityScores {
  int32 strength = 1;
  int32 dexterity = 2;
  int32 constitution = 3;
  int32 intelligence = 4;
  int32 wisdom = 5;
  int32 charisma = 6;
}

// ProficiencyLevel is how much of the proficiency bonus a check adds.
enum ProficiencyLevel {
  PROFICIENCY_LEVEL_UNSPECIFIED = 0;
  // Not proficient: adds nothing.
  PROFICIENCY_LEVEL_NONE = 1;
  // Half the proficiency bonus, rounded down (the Bard's Jack of All
  // Trades).
  PROFICIENCY_LEVEL_HALF = 2;
  // The proficiency bonus.
  PROFICIENCY_LEVEL_PROFICIENT = 3;
  // Twice the proficiency bonus (expertise).
  PROFICIENCY_LEVEL_EXPERTISE = 4;
}

// DerivedSheet is everything the server computes from a character's full
// sheet (MR-004): the app shows these numbers as they come and never
// computes a rule itself.
//
// Derived numbers are never stored: the server computes them again on every
// read, from the sheet and the current rules content. A newer content
// version can therefore change a number on a locked sheet; content_version
// says which content produced these numbers.
//
// Computing never fails. A choice the rules do not recognise, such as a key
// that no longer exists or too many skills, is skipped and reported in
// `issues`: the app is an assistant, not a judge, and the master has the
// final word.
message DerivedSheet {
  // Which rules content produced these numbers, such as
  // "srd51@0123456789ab+fx.1".
  string content_version = 1;

  // The race's Portuguese name. Empty if the sheet has no known race.
  string race_name_pt = 2;
  // The subrace's Portuguese name. Empty if the sheet has none.
  string subrace_name_pt = 3;
  // The background's Portuguese name, or the name of a custom background as
  // the player typed it. Empty if the sheet has none.
  string background_name_pt = 4;
  // The character's classes, in the sheet's order.
  repeated DerivedClass classes = 5;
  // The sum of all class levels, 1 to 20.
  int32 total_level = 6;
  // The proficiency bonus for total_level, such as 2.
  int32 proficiency_bonus = 7;

  // The six abilities, in the order strength, dexterity, constitution,
  // intelligence, wisdom, charisma.
  repeated DerivedAbility abilities = 8;
  // The six saving throws, in the same order as abilities.
  repeated SavingThrow saving_throws = 9;
  // The 18 skills, sorted by their Portuguese name.
  repeated DerivedSkill skills = 10;
  // 10 + the Perception bonus.
  int32 passive_perception = 11;
  // 10 + the Investigation bonus.
  int32 passive_investigation = 12;
  // 10 + the Insight bonus.
  int32 passive_insight = 13;
  // The initiative bonus.
  int32 initiative = 14;

  // Armor class with the armor and shield on the sheet. Spells that change
  // it, such as Mage Armor, are not counted: they belong to the game
  // session.
  int32 armor_class = 15;
  // How armor_class was computed, in Portuguese, such as "Sem armadura" or
  // "Armadura de couro + escudo".
  string armor_class_description = 16;
  // Maximum hit points.
  int32 hit_points_max = 17;
  // Hit dice by die size, largest die first. Several entries only for a
  // character with classes of different hit dice.
  repeated HitDice hit_dice = 18;
  // Walking speed, in feet.
  int32 speed_walk_ft = 19;
  // Special senses, such as darkvision.
  repeated Sense senses = 20;

  // One entry per class that casts spells. Empty for a character that casts
  // no spells.
  repeated Spellcasting spellcasting = 21;
  // Spell slots per spell level, ascending, only levels with at least one
  // slot. With more than one casting class, this comes from the
  // multiclass spellcaster table. Warlock slots are in pact_magic instead.
  repeated SpellSlots spell_slots = 22;
  // The Warlock's pact magic slots. Unset for other characters.
  PactMagic pact_magic = 23;
  // The character's cantrips and spells, cantrips first, then by level and
  // Portuguese name.
  repeated CharacterSpell spells = 24;

  // Attacks, as the official sheet lists them: the weapons carried, then
  // the cantrips that deal damage.
  repeated Attack attacks = 25;
  // Class features, racial traits and background features the character
  // has at its level.
  repeated Feature features = 26;
  // Languages the race and background grant, as Portuguese names. The
  // languages the player typed on the sheet are not repeated here.
  repeated string languages = 27;
  // Armor, weapon and tool proficiencies the race, classes and background
  // grant.
  Proficiencies proficiencies = 28;

  // Situational reminders the numbers above cannot express, such as
  // advantage on some saving throws against magic.
  repeated Hint hints = 29;
  // Choices on the sheet that the rules do not accept, or that were
  // skipped. Empty when everything checks out.
  repeated Issue issues = 30;

  // Use-limited features at the character's level (Second Wind, Ki, Rage).
  // The session counts the uses (RN-02).
  repeated Resource resources = 31;
  // Actions the character's features grant, with their action economy.
  repeated Action actions = 32;
  // The actions everyone has: Attack, Cast a Spell, Dash, Disengage, Dodge,
  // Help, Hide, Ready, Search, Use an Object.
  repeated Action standard_actions = 33;

  // The XP that reaches the next level (SRD "Character Advancement": 300
  // for level 2, 900 for level 3, 2,700 for level 4...), 0 at level 20 or
  // when the sheet has no class yet. The sheet and the campaign's group list
  // compare it with FullSheet.experience_points to show "Pode subir de
  // nível" (RN-12).
  int32 next_level_xp = 34;

  // The other speeds, in feet, 0 for none. A character has none of them
  // today; a creature, or a druid in Wild Shape, may fly, swim, climb or
  // burrow. speed_walk_ft stays the walking speed.
  int32 speed_fly_ft = 35;
  int32 speed_swim_ft = 36;
  int32 speed_climb_ft = 37;
  int32 speed_burrow_ft = 38;
  // True for a flying creature that hovers (a ghost).
  bool hover = 39;
  // A creature's actions that ask for a saving throw (a breath, a bite that
  // knocks prone), with their DC. Empty for a character.
  repeated SaveAction save_actions = 40;
  // The table's entries this sheet uses that changed after the sheet was last
  // saved and that gave the sheet new issues since (RN-23, question 80: a change
  // applies at once). The numbers above already use the new rules. It is worked out
  // on every read, from the sheet's own issues, so it goes away by itself when no
  // such issue remains (saving the sheet does not clear it); a change that left
  // the sheet with no new issue tied to the entry shows nothing. Each entry is also an issue with code
  // "table_content_changed", for the banner "A classe mudou".
  repeated ChangedContent changed_content = 41;
  // The background's equipment as text: a table background's (RN-23) or the one
  // the player wrote for a custom background (SRD 5.1 "Customizing a
  // Background"). Empty for an SRD background and for a sheet without one.
  string background_equipment_pt = 42;
  // What the "hp.max" effects add to hit_points_max: hit_points_max minus what
  // the hit dice and the Constitution modifier give (the floor of one hit
  // point per level included). Dwarven Toughness adds one per level; a table's
  // effect may subtract, so it can be negative. Zero for a creature and for a
  // beast form (Wild Shape). The character editor adds it to the per-level
  // rows it shows, so the box never copies effect maths.
  int32 hit_points_from_effects = 43;
}

// ChangedContent is a table entry a sheet uses that changed after the sheet was
// last saved, and what no longer fits the sheet because of it. Never who changed
// it nor the history of its edits.
message ChangedContent {
  // The entry's key ("class:guardiao-do-vale@mesa") and its Portuguese name.
  string key = 1;
  string name_pt = 2;
  // The sheet field that holds the key, with the CharacterSheet field names
  // ("full.classes[0].class_key").
  string field = 3;
  // The content revision the entry changed at, and the one the sheet was last known
  // to fit it at.
  int32 revision = 4;
  int32 saved_revision = 5;
  // When the entry last changed (an archive is not a change).
  google.protobuf.Timestamp changed_at = 6;
  // The sentences of the sheet's new issues, in Portuguese, as a change reads. A
  // sentence names the class or subclass it is about only when that is this entry
  // ("Guardião do Vale agora dá 2 perícias no nível 1; esta ficha tem 3."); about any
  // other it is told without a name, with the first letter in capitals ("Agora dá 4
  // perícias no nível 1; esta ficha tem 5." for an SRD class whose count moved
  // because a table race changed). The kinds: the skill count (or, with other
  // sources, "O total de perícias para escolher agora é 4; esta ficha tem 5."); the
  // spell counts, "Mago agora conhece 3 truques; esta ficha tem 4." (also "conhece N
  // magias" and "prepara N magias", naming the subclass for a third caster; with
  // several casters, "O total de truques conhecidos agora é 3; esta ficha tem 4.");
  // the subclass level, "Guardião do Vale agora escolhe a subclasse no nível 5; esta
  // ficha tem nível 3 nela."; the multiclass prerequisite, "Guardião do Vale agora
  // pede outras habilidades para multiclasse; os desta ficha não cumprem."; and an
  // option the entry's feature stopped offering, "Guardião do Vale agora não oferece
  // a escolha Estilo de Luta: Defesa; ela não vale mais nesta ficha." Any other issue
  // tied to the entry is told with its own sentence in `issues`. What no longer
  // matches, for the sheet of what changed.
  repeated string messages = 7;
}

// SaveAction is a creature's action that asks for a saving throw.
message SaveAction {
  // "<creature key>#<action>", such as "monster:wolf#bite": the key of the
  // Attack of the same action, when it also attacks.
  string key = 1;
  // The action's English name, such as "Bite".
  string name = 2;
  // The ability of the save the target makes.
  Ability ability = 3;
  // The difficulty class.
  int32 dc = 4;
  // What a success does.
  SpellSaveSuccess on_success = 5;
  // The SRD's limit ("Recharge 5-6", "3/day"), empty when there is none.
  string usage = 6;
  // The SRD's text of the action, in English.
  string text = 7;
}

// Resource is a use-limited feature, such as Second Wind or a monk's ki.
message Resource {
  // The resource's name in the rules content, such as "second_wind".
  string key = 1;
  // The Portuguese name, such as "Retomar o Fôlego".
  string name_pt = 2;
  // How many uses, at the character's level. A barbarian's unlimited rage
  // is 99.
  int32 max = 3;
  // When the uses come back.
  Recharge recharge = 4;
  // Content key of the feature or trait that grants it.
  string source_key = 5;
}

// Recharge says when a Resource's uses come back.
enum Recharge {
  RECHARGE_UNSPECIFIED = 0;
  RECHARGE_SHORT_REST = 1;
  RECHARGE_LONG_REST = 2;
  // At dawn, as for some magic items.
  RECHARGE_DAWN = 3;
  // Never on its own: the master decides.
  RECHARGE_NONE = 4;
}

// Action is something a character does on their turn.
message Action {
  // The feature's content key ("feature:second-wind") for a feature action,
  // or "standard:dash" and the like for a standard one.
  string key = 1;
  // The Portuguese name, such as "Retomar o Fôlego" or "Disparada".
  string name_pt = 2;
  ActionEconomy economy = 3;
  // The key of the Resource each use spends. Empty when it spends none.
  string resource_key = 4;
  // Content key of the feature or trait that grants it. Empty for a
  // standard action.
  string source_key = 5;
}

// ActionEconomy is the part of the turn an action costs.
enum ActionEconomy {
  ACTION_ECONOMY_UNSPECIFIED = 0;
  ACTION_ECONOMY_ACTION = 1;
  ACTION_ECONOMY_BONUS_ACTION = 2;
  ACTION_ECONOMY_REACTION = 3;
  // Costs nothing, such as a free object interaction.
  ACTION_ECONOMY_FREE = 4;
  // Part of the movement.
  ACTION_ECONOMY_MOVEMENT = 5;
}

// DiceFormula is a damage or healing roll as numbers: 1d8+3 is count 1,
// sides 8, bonus 3. The server never rolls; the dice come from the player
// or from the app (RN-18).
message DiceFormula {
  // How many dice. 0 for a flat number.
  int32 count = 1;
  // The die: 8 for a d8.
  int32 sides = 2;
  // Added to the dice. Negative for a penalty.
  int32 bonus = 3;
  // The SRD adds the caster's spellcasting modifier on top ("1d8 + MOD").
  bool adds_modifier = 4;
}

// DerivedClass is one of a character's classes, with names resolved.
message DerivedClass {
  // Content key of the class, such as "class:wizard".
  string class_key = 1;
  // The class's Portuguese name, such as "Mago". Empty if the key is not
  // known.
  string name_pt = 2;
  // Levels in this class, 1 to 20.
  int32 level = 3;
  // The subclass's Portuguese name, or the name of a custom subclass as
  // typed. Empty if none was chosen.
  string subclass_name_pt = 4;
}

// DerivedAbility is one ability, from the base score to the modifier.
message DerivedAbility {
  Ability ability = 1;
  // The ability's Portuguese name, such as "Inteligência".
  string name_pt = 2;
  // The base score from the sheet.
  int32 base = 3;
  // Everything added to the base: race, subrace and the sheet's manual
  // bonuses. Can be negative.
  int32 bonus = 4;
  // base + bonus.
  int32 score = 5;
  // The modifier for score, such as +4 for 18.
  int32 modifier = 6;
}

// SavingThrow is one of the six saving throws.
message SavingThrow {
  Ability ability = 1;
  // The ability's Portuguese name.
  string name_pt = 2;
  // Whether the character is proficient in it: from the starting class
  // (the first on the sheet), or from a feature.
  bool proficient = 3;
  // The total bonus to add to the d20.
  int32 bonus = 4;
}

// DerivedSkill is one skill with the character's bonus.
message DerivedSkill {
  // Content key of the skill, such as "skill:arcana".
  string key = 1;
  // The skill's Portuguese name, such as "Arcanismo".
  string name_pt = 2;
  // The ability the skill uses.
  Ability ability = 3;
  ProficiencyLevel proficiency = 4;
  // The total bonus to add to the d20.
  int32 bonus = 5;
}

// HitDice is a number of hit dice of one size, such as 3d6.
message HitDice {
  // Faces of the die: 6, 8, 10 or 12.
  int32 faces = 1;
  // How many dice.
  int32 count = 2;
}

// Sense is a special sense, such as darkvision.
message Sense {
  // Content key of what grants it, such as "trait:darkvision".
  string key = 1;
  // The sense's Portuguese name, such as "Visão no escuro".
  string name_pt = 2;
  // Range in feet, such as 60.
  int32 range_ft = 3;
  // Which sense it is: "darkvision", "blindsight", "tremorsense" or
  // "truesight". Use it, not `key` (which names what grants the sense: a trait,
  // or the creature's key for a creature's sense), to tell senses apart.
  string sense = 4;
}

// Spellcasting is what one casting class gives the character.
message Spellcasting {
  // Content key of the class, such as "class:wizard".
  string class_key = 1;
  // The class's Portuguese name.
  string class_name_pt = 2;
  // The ability the class casts with.
  Ability ability = 3;
  // The spell save DC: 8 + proficiency bonus + ability modifier.
  int32 save_dc = 4;
  // The spell attack bonus: proficiency bonus + ability modifier.
  int32 attack_bonus = 5;
  // How many cantrips the class knows at its level. 0 if it has none.
  int32 cantrips_known = 6;
  // How many spells the class knows at its level, for classes that learn a
  // fixed number (Bard, Ranger, Sorcerer, Warlock). 0 for the others.
  int32 spells_known = 7;
  // How many spells the character can prepare each day, for classes that
  // prepare spells (Cleric, Druid, Paladin, Wizard). 0 for the others.
  int32 prepared_max = 8;
}

// SpellSlots is how many slots the character has of one spell level.
message SpellSlots {
  // Spell level, 1 to 9.
  int32 level = 1;
  // How many slots of that level.
  int32 count = 2;
}

// PactMagic is the Warlock's pact magic: a few slots, all of one level,
// recovered on a short rest.
message PactMagic {
  // The level of every pact slot, 1 to 5.
  int32 slot_level = 1;
  // How many pact slots.
  int32 count = 2;
}

// CharacterSpell is a spell on the character's sheet.
message CharacterSpell {
  Spell spell = 1;
  // Whether the character can cast it today: every cantrip, every spell of
  // a class that knows its spells, and the spells on the sheet's prepared
  // list.
  bool prepared = 2;
}

// Attack is an attack with a weapon on the sheet.
message Attack {
  // Content key of the weapon or the spell, such as "equipment:quarterstaff"
  // or "spell:fire-bolt".
  string key = 1;
  // The English name.
  string name = 2;
  // The Portuguese name, such as "Bordão".
  string name_pt = 3;
  // The attack bonus to add to the d20. 0 for a spell that asks for a
  // saving throw instead: see save_dc.
  int32 attack_bonus = 4;
  // The damage dice with the modifier, such as "1d6+1".
  string damage = 5;
  // The damage type in Portuguese, such as "concussão".
  string damage_type_pt = 6;
  AttackKind kind = 7;
  // For a spell that asks for a saving throw: the DC and the ability of
  // the save. Unset otherwise.
  int32 save_dc = 8;
  Ability save_ability = 9;
  // The two-handed damage of a versatile weapon, such as "1d8+1". Empty
  // otherwise.
  string versatile_damage = 10;
  // The reach or normal range, and the long range of a ranged or thrown
  // weapon or a spell, in feet. long_range_ft is 0 when there is none.
  int32 range_ft = 11;
  int32 long_range_ft = 12;
  // `damage` and `versatile_damage` as numbers, for rolling and adding up.
  // Unset when there are no damage dice.
  DiceFormula damage_dice = 13;
  DiceFormula versatile_damage_dice = 14;
  // Content key of the damage type, such as "damage-type:slashing".
  string damage_type_key = 15;
  // True for a weapon the SRD lists as a melee weapon, thrown or not (a dagger,
  // a spear, a handaxe), and for a basic sheet's attack that reaches 5 ft or
  // less; false for a ranged weapon and for a spell. An opportunity attack is
  // a melee attack.
  bool melee = 16;
  // For a creature's attack: the whole action as the SRD wrote it, in English
  // (the attack, the damage parts after the first, a saving throw, a rider).
  // The engine rolls the to-hit and the first damage part; the master reads the
  // rest in this text. Empty for a character's weapon or cantrip.
  string notes = 17;
  // How many attack rolls the attack makes in one action, each with its own
  // damage roll: Eldritch Blast fires 1, 2, 3 or 4 beams at warlock levels
  // 1, 5, 11 and 17. 1 for the other cantrips; 0 (unset) for a weapon and for a
  // creature's attack.
  int32 beams = 18;
  // For a cantrip (kind SPELL): the plain dice it rolls at the character's level,
  // such as "3d8" for Sacred Flame at level 11, without the damage modifier. The
  // spell's details carry the whole table by level for any caster, so the app
  // reads the caster's row here instead of choosing one. Empty for a weapon and
  // for a creature's attack.
  string spell_dice = 19;
}

// AttackKind says whether an attack is a weapon or a spell.
enum AttackKind {
  ATTACK_KIND_UNSPECIFIED = 0;
  // A weapon the character carries.
  ATTACK_KIND_WEAPON = 1;
  // A cantrip that deals damage, at the character's level.
  ATTACK_KIND_SPELL = 2;
}

// Feature is a class feature, racial trait or background feature.
message Feature {
  // Content key, such as "feature:arcane-recovery" or "trait:darkvision".
  string key = 1;
  // English name from the SRD.
  string name = 2;
  // Portuguese name.
  string name_pt = 3;
  // Where it comes from, in Portuguese, such as "Mago 1" or "Gnomo".
  string source_pt = 4;
  // The SRD's English text.
  string description = 5;
}

// Proficiencies lists armor, weapon and tool proficiencies, as Portuguese
// names such as "Armaduras leves" or "Adagas".
message Proficiencies {
  repeated string armor = 1;
  repeated string weapons = 2;
  repeated string tools = 3;
}

// Hint is a reminder the numbers cannot express, because it depends on the
// situation. The server never applies it on its own: the master decides.
message Hint {
  // Content key of the feature or trait that gives it, such as
  // "trait:gnome-cunning".
  string source_key = 1;
  // The reminder in Portuguese, such as "Vantagem em testes de resistência
  // de INT, SAB e CAR contra magia".
  string text = 2;
}

// Issue is a choice on the sheet that the rules do not accept, such as a
// skill the class cannot choose, too many cantrips, or a content key that no
// longer exists. The numbers are computed without it.
message Issue {
  // A stable code for the kind of problem, in lower_snake_case, such as
  // "unknown_key" or "too_many_cantrips".
  string code = 1;
  // Which field of the sheet has the problem, as a path with the proto
  // field names, such as "full.classes[0].subclass_key". Empty when the
  // problem is not about one field.
  string field = 2;
  // What is wrong, in Portuguese, for the app to show.
  string message = 3;
}

// Content is the rules content a campaign's characters can be built from.
// Every list is sorted by Portuguese name, except abilities.
message Content {
  // Which version of the content this is, such as
  // "srd51@0123456789ab+fx.1". Versions never change in place.
  string content_version = 1;
  // The attribution text of the SRD 5.1 license, which the app must show
  // on its credits page, exactly as given.
  string attribution = 2;
  // The six abilities, in the order strength to charisma.
  repeated AbilityInfo abilities = 3;
  repeated Race races = 4;
  repeated Subrace subraces = 5;
  repeated CharacterClass classes = 6;
  repeated Subclass subclasses = 7;
  repeated Background backgrounds = 8;
  repeated Skill skills = 9;
  // Body armor only. A shield is a yes/no on the sheet.
  repeated Armor armor = 10;
  repeated Weapon weapons = 11;
  repeated Spell spells = 12;
  // The SRD's 34 challenge ratings ("ND") with their XP, in order from 0
  // to 30. The NPC editor offers them as a picker that fills in the XP the
  // creature gives when defeated (MR-016); the master may type another
  // value.
  repeated ChallengeRating challenge_ratings = 13;
  // The SRD's languages, with their Portuguese names, so a player reads "Comum" and
  // never "language:common" (a race's languages, a background's).
  repeated NamedKey languages = 14;
  // The SRD's proficiencies a table entry may name: tools, armor, weapons and the
  // rest (the same values the master's GetEffectMenu lists carry).
  repeated NamedKey proficiencies = 15;
  // The SRD's damage types, with their Portuguese names ("damage-type:fire").
  repeated NamedKey damage_types = 16;
  // The SRD's experience needed to reach each level: the first entry is level 1
  // (0 XP), the last level 20. The editor starts a character made above level 1
  // at its level's XP in a campaign that levels by XP.
  repeated int32 level_xp = 17;
}

// NamedKey is a content key with its Portuguese name.
message NamedKey {
  // Content key, such as "language:common" or "proficiency:thieves-tools".
  string key = 1;
  string name_pt = 2;
  // What the key is, so a screen can offer the tools and the languages apart
  // without reading the key. Unspecified for a damage type.
  NamedKeyKind kind = 3;
}

// NamedKeyKind is what a NamedKey names.
enum NamedKeyKind {
  NAMED_KEY_KIND_UNSPECIFIED = 0;
  // A tool proficiency, such as "proficiency:thieves-tools".
  NAMED_KEY_KIND_TOOL = 1;
  NAMED_KEY_KIND_ARMOR = 2;
  NAMED_KEY_KIND_WEAPON = 3;
  NAMED_KEY_KIND_SKILL = 4;
  NAMED_KEY_KIND_SAVING_THROW = 5;
  // A language, such as "language:elvish".
  NAMED_KEY_KIND_LANGUAGE = 6;
  // Anything else the SRD lists as a proficiency (a vehicle, an herbalism kit).
  NAMED_KEY_KIND_OTHER = 7;
}

// ChallengeRating is one row of the SRD's "Experience Points by Challenge
// Rating" table.
message ChallengeRating {
  // "0", "1/8", "1/4", "1/2", "1" ... "30". The app writes it "ND 1/4".
  string rating = 1;
  // The XP a creature of this rating gives when defeated. Rating "0" is 10
  // here; a creature with no attack gives 0, which the master types.
  int32 xp = 2;
}

// AbilityInfo names one ability.
message AbilityInfo {
  Ability ability = 1;
  // English name, such as "Intelligence".
  string name = 2;
  // Portuguese name, such as "Inteligência".
  string name_pt = 3;
  // Portuguese abbreviation, such as "INT".
  string abbreviation_pt = 4;
}

// Race is a race from the rules content.
message Race {
  // Content key, such as "race:gnome".
  string key = 1;
  string name = 2;
  string name_pt = 3;
  // Walking speed in feet, such as 25.
  int32 speed_ft = 4;
  // The race's fixed ability score increases, such as +2 intelligence.
  // Increases the player chooses, such as the Half-Elf's two +1, are not
  // here: the sheet records them as extra bonuses.
  AbilityScores ability_bonuses = 5;
  // The table retired it (RN-23): a master sees it, a player never does.
  bool archived = 6;
  // The bonuses the player places on abilities of their choice, such as [2, 1]
  // for "+2 and +1 to your choice"; empty for the SRD's races.
  repeated int32 choice_bonuses = 7;
  // The master switched it off for the players ("Opções para os jogadores", RN-23):
  // a master sees it with this mark, a player never receives it. Every `off`
  // below is the same. A sheet that already has it keeps it.
  bool off = 8;
  // Content keys of the skills the race gives, such as the half-orc's
  // "skill:intimidation". The player does not choose them and they are not a
  // class pick: a pick on the same skill adds nothing.
  repeated string skill_keys = 9;
}

// Subrace is a subrace of one race.
message Subrace {
  // Content key, such as "subrace:rock-gnome".
  string key = 1;
  string name = 2;
  string name_pt = 3;
  // Content key of the race it belongs to, such as "race:gnome".
  string race_key = 4;
  // The subrace's ability score increases, added to the race's.
  AbilityScores ability_bonuses = 5;
  // The table retired it (see Race.archived).
  bool archived = 6;
  // Switched off for the players (see Race.off). Its own switch: a subrace of an
  // off race is hidden from the players too, and keeps this mark false.
  bool off = 7;
  // Content keys of the skills the subrace gives, added to the race's (see
  // Race.skill_keys).
  repeated string skill_keys = 8;
}

// CharacterClass is a class from the rules content.
message CharacterClass {
  // Content key, such as "class:wizard".
  string key = 1;
  string name = 2;
  string name_pt = 3;
  // Faces of the hit die: 6, 8, 10 or 12.
  int32 hit_die = 4;
  // The two saving throws the class is proficient in.
  repeated Ability saving_throws = 5;
  // The skills a character of this class chooses at level 1.
  SkillChoice skill_choice = 6;
  // The class level at which the character chooses a subclass, such as 2
  // for the Wizard.
  int32 subclass_level = 7;
  // How the class casts spells. Unset for a class that never casts.
  ClassSpellcasting spellcasting = 8;
  // The table retired it (see Race.archived).
  bool archived = 9;
  // Switched off for the players (see Race.off): its subclasses are hidden too.
  bool off = 10;
}

// SkillChoice is "choose `count` skills from this list".
message SkillChoice {
  // How many skills to choose.
  int32 count = 1;
  // Content keys of the skills to choose from.
  repeated string skill_keys = 2;
}

// SpellPreparation is how a class decides which spells it can cast.
enum SpellPreparation {
  SPELL_PREPARATION_UNSPECIFIED = 0;
  // The class knows a fixed number of spells and can cast any of them
  // (Bard, Ranger, Sorcerer, Warlock). The sheet uses known_spell_keys.
  SPELL_PREPARATION_KNOWN = 1;
  // The class prepares spells each day from its whole spell list (Cleric,
  // Druid, Paladin). The sheet uses prepared_spell_keys.
  SPELL_PREPARATION_PREPARED = 2;
  // The class keeps spells in a spellbook and prepares some of them each
  // day (Wizard). The sheet uses both known_spell_keys (the spellbook) and
  // prepared_spell_keys.
  SPELL_PREPARATION_SPELLBOOK = 3;
}

// ClassSpellcasting describes a casting class.
message ClassSpellcasting {
  // The ability the class casts with.
  Ability ability = 1;
  // The class level at which spellcasting starts: 1 for most classes, 2
  // for the Paladin and the Ranger.
  int32 first_level = 2;
  SpellPreparation preparation = 3;
  // The highest spell circle (1 to 9) the class can cast at each class
  // level, from the class table's spell slots. Index 0 is class level 1 and
  // index 19 is level 20, so there are 20 entries. 0 means no leveled spells
  // yet (Paladin and Ranger at level 1; cantrips are never gated by level).
  // The Warlock's entry is its pact slot circle. Clients use it to list only
  // the spells the character can take; the server still validates on save.
  repeated int32 max_spell_level_by_level = 4;
  // The class whose spell list a table class reuses ("class:cleric"); empty is the
  // class's own list (the spells that name it).
  string list_class_key = 5;
}

// Subclass is a subclass of one class.
message Subclass {
  // Content key, such as "subclass:evocation".
  string key = 1;
  string name = 2;
  string name_pt = 3;
  // Content key of the class it belongs to, such as "class:wizard".
  string class_key = 4;
  // The table retired it (see Race.archived).
  bool archived = 5;
  // Set for a subclass that casts on its own (a third caster, the table's only).
  SubclassSpellcasting spellcasting = 6;
  // Switched off for the players (see Subrace.off): its own switch.
  bool off = 7;
  // The spells the subclass always has prepared, from a class level (a domain's,
  // an oath's); they do not count against the prepared limit. Without the ones
  // that depend on a feature's choice (the Circle of the Land's terrain).
  repeated SubclassAlwaysPrepared always_prepared = 8;
}

// SubclassAlwaysPrepared is a spell a subclass always prepares from a class level.
message SubclassAlwaysPrepared {
  // Content key of the spell.
  string spell_key = 1;
  // The class level the subclass has it from.
  int32 class_level = 2;
}

// SubclassSpellcasting is how a third caster's subclass casts.
message SubclassSpellcasting {
  Ability ability = 1;
  SpellPreparation preparation = 2;
  // The class whose spell list it casts from.
  string list_class_key = 3;
  // The class level casting starts at.
  int32 first_level = 4;
  // The highest circle at each class level, 20 entries, as
  // ClassSpellcasting.max_spell_level_by_level.
  repeated int32 max_spell_level_by_level = 5;
}

// Background is a background from the rules content.
message Background {
  // Content key, such as "background:acolyte".
  string key = 1;
  string name = 2;
  string name_pt = 3;
  // Content keys of the skills the background grants. The player does not
  // choose them and they are not a class pick: a pick on the same skill adds
  // nothing.
  repeated string skill_keys = 4;
  // The table retired it (see Race.archived).
  bool archived = 5;
  // A table background's equipment text; empty for the SRD's.
  string equipment_pt = 6;
  // Switched off for the players (see Race.off).
  bool off = 7;
}

// Skill is one of the 18 skills.
message Skill {
  // Content key, such as "skill:arcana".
  string key = 1;
  string name = 2;
  string name_pt = 3;
  // The ability the skill uses.
  Ability ability = 4;
}

// ArmorCategory is the weight class of body armor.
enum ArmorCategory {
  ARMOR_CATEGORY_UNSPECIFIED = 0;
  ARMOR_CATEGORY_LIGHT = 1;
  ARMOR_CATEGORY_MEDIUM = 2;
  ARMOR_CATEGORY_HEAVY = 3;
}

// Armor is a suit of body armor.
message Armor {
  // Content key, such as "equipment:leather-armor".
  string key = 1;
  string name = 2;
  string name_pt = 3;
  ArmorCategory category = 4;
}

// WeaponCategory says whether a weapon is simple or martial.
enum WeaponCategory {
  WEAPON_CATEGORY_UNSPECIFIED = 0;
  WEAPON_CATEGORY_SIMPLE = 1;
  WEAPON_CATEGORY_MARTIAL = 2;
}

// Weapon is a weapon from the rules content.
message Weapon {
  // Content key, such as "equipment:quarterstaff".
  string key = 1;
  string name = 2;
  string name_pt = 3;
  WeaponCategory category = 4;
  // True for a ranged weapon, false for a melee one.
  bool ranged = 5;
}

// Spell is a spell from the rules content.
message Spell {
  // Content key, such as "spell:fire-bolt".
  string key = 1;
  string name = 2;
  string name_pt = 3;
  // Spell level, 0 to 9; 0 is a cantrip.
  int32 level = 4;
  // Content key of the school of magic, such as "school:evocation".
  string school_key = 5;
  // The school's Portuguese name, such as "Evocação".
  string school_name_pt = 6;
  // Content keys of the classes whose spell list has this spell.
  repeated string class_keys = 7;
  // Whether it can be cast as a ritual.
  bool ritual = 8;
  // Whether it needs concentration.
  bool concentration = 9;
  // The table retired it (see Race.archived).
  bool archived = 10;
  // Switched off for the players (see Race.off).
  bool off = 11;
}

// ListContentRequest names a campaign.
message ListContentRequest {
  string campaign_id = 1;
  // A character of the caller's own in the campaign: the entries it uses are in
  // the catalog even when archived or switched off (see the RPC). Empty for the
  // plain catalog.
  string character_id = 2;
}

// ListContentResponse returns the campaign's rules content.
message ListContentResponse {
  // The catalog. For a player, without the archived entries and without what the
  // master switched off (and without the subclasses of an off class and the
  // subraces of an off race).
  Content content = 1;
  // The campaign's content revision (0 while the table has no content of its
  // own). It is in `content.content_version` too, after "+mesa.". The table's
  // entries in full, for the editors, are
  // TableContentService.ListTableEntries.
  int32 table_revision = 2;
}

// GetSpellDetailsRequest names a spell. The campaign is there for access
// (and, later, for the table's own spells).
message GetSpellDetailsRequest {
  string campaign_id = 1;
  // Content key of the spell, such as "spell:fire-bolt".
  string spell_key = 2;
}

// ListSpellsRequest names a campaign and the filters. Every filter is optional
// and they add up: a spell passes all of them.
message ListSpellsRequest {
  string campaign_id = 1;
  // Part of the spell's Portuguese or English name, ignoring case and accents
  // ("maos", "burning"), up to 100 characters. Empty for any.
  string query = 2;
  // A class key ("class:wizard", or a table class) to read the spells of its
  // list, or the key of a third caster's subclass, whose list is the class it
  // casts from. Empty for any. A key that has no list gives an empty list.
  string class_key = 3;
  // The circles to list, 0 (cantrips) to 9. Empty for all.
  repeated int32 levels = 4;
  // School keys ("school:evocation"). Empty for all.
  repeated string school_keys = 5;
  // "Só as que posso aprender" for this character (see the RPC).
  string character_id = 6;
  // How many rows to return, 1 to 400; 0 means 100. The page asks for 400; a
  // longer list (the SRD's 319 spells and up to 300 of the table's) comes in
  // pages, with next_page_token.
  int32 page_size = 7;
  // The next_page_token of the previous page; empty for the first.
  string page_token = 8;
}

// ListSpellsResponse is one page of spells, sorted by Portuguese name.
message ListSpellsResponse {
  repeated Spell spells = 1;
  // Pass it as page_token to read the next page. Empty on the last page.
  string next_page_token = 2;
  // How many spells pass the filters, over all the pages ("73 magias").
  int32 total = 3;
  // The campaign's content version, as in ListContentResponse.content.content_version.
  string content_version = 4;
}

// GetSpellDetailsResponse returns one spell, in full.
message GetSpellDetailsResponse {
  SpellDetails spell = 1;
}

// SpellDetails is everything the SRD says about a spell, structured. Values
// are in the SRD's units (feet, rounds, English); the app writes them in
// Portuguese ("60 ft" is "18 m", "1 action" is "1 ação"). Whatever does not
// fit a structure is kept in the `raw` field exactly as the SRD wrote it.
message SpellDetails {
  // The light entry ListContent returns: key, names, level, school, classes,
  // ritual and concentration.
  Spell spell = 1;
  SpellCastingTime casting_time = 2;
  SpellRange range = 3;
  SpellComponents components = 4;
  SpellDuration duration = 5;
  // Whether the spell needs an attack roll.
  SpellAttackType attack_type = 6;
  // The saving throw the spell asks for. Unset when it asks for none.
  SpellSave save = 7;
  // The damage, one entry per damage type (Ice Storm has two).
  repeated SpellDamage damage = 8;
  // Healing by the level of the slot, such as {1: "1d8 + MOD"}. Empty when
  // the spell does not heal.
  map<int32, string> heal_by_slot_level = 9;
  // The SRD's English description, one paragraph per entry.
  repeated string description = 10;
  // The SRD's "At Higher Levels" paragraphs, in English. Empty when the
  // spell has none.
  repeated string higher_level = 11;
  // What a spell that reads hit points does (Sono, Leque Cromático, Palavra de
  // Poder, Estabilizar, Cura Completa). Unset for any other spell.
  // These are public spell rules, like the rest of the message: every member
  // gets them, and the app reads them instead of keeping a copy of the table.
  SpellHitPointEffect hit_point_effect = 12;
  // Whom the spell reaches: one creature, several, an area or only the caster.
  // A table spell's is the master's; an SRD spell's is worked out from the
  // 5e-database's structured area (Mãos Flamejantes: a cone of 15 ft) and, for the
  // rest, from the text of the SRD.
  SpellTarget target = 13;
  // What the caster picks among the `damage` types; unspecified when nothing.
  SpellDamageChoice damage_choice = 14;
}

// SpellTargetKind says whom a spell reaches.
enum SpellTargetKind {
  SPELL_TARGET_KIND_UNSPECIFIED = 0;
  // One creature ("Uma criatura"). `per_slot_level` more for each circle above
  // the spell's own, when the text says "an additional creature".
  SPELL_TARGET_KIND_CREATURE = 1;
  // Several creatures ("Várias criaturas"): `count` of them at the spell's own
  // circle and `per_slot_level` more for each circle above it. A `count` of 0 is an
  // SRD spell whose text says how many ("up to three creatures"): the caster picks
  // any number and the master judges.
  SPELL_TARGET_KIND_CREATURES = 2;
  // Every creature in an area (`shape` and `size_ft`). In combat the caster picks
  // the creatures it catches; the map does not draw it.
  SPELL_TARGET_KIND_AREA = 3;
  // Only the caster ("Só quem conjura").
  SPELL_TARGET_KIND_SELF = 4;
  // No creature at all: a point, an object or a place (Olho Arcano, Luz). An SRD
  // spell's only. There is nobody to pick.
  SPELL_TARGET_KIND_NONE = 5;
}

// SpellAreaShape is the shape of a spell's area.
enum SpellAreaShape {
  SPELL_AREA_SHAPE_UNSPECIFIED = 0;
  // The size is the length.
  SPELL_AREA_SHAPE_CONE = 1;
  // The size is the side.
  SPELL_AREA_SHAPE_CUBE = 2;
  // The size is the radius.
  SPELL_AREA_SHAPE_CYLINDER = 3;
  // The size is the length.
  SPELL_AREA_SHAPE_LINE = 4;
  // The size is the radius.
  SPELL_AREA_SHAPE_SPHERE = 5;
}

// SpellTarget is whom a spell reaches.
message SpellTarget {
  SpellTargetKind kind = 1;
  // CREATURES: how many at the spell's own circle; 0 when the SRD's text says it.
  int32 count = 2;
  // CREATURE and CREATURES: how many more for each circle above the spell's own.
  int32 per_slot_level = 3;
  // AREA: the shape and the size in feet (the SRD's 15 ft cone is 4,5 m).
  SpellAreaShape shape = 4;
  int32 size_ft = 5;
  // The target as the "Magias" page writes it, in the table's units: "Uma
  // criatura", "Várias criaturas", "Só quem conjura", "Nenhuma criatura" or
  // "Cone de 4,5 m". For some SRD spells it is our own words (hand-written, in
  // effects/spell_targets.json) where the database's area would mislead.
  string label_pt = 6;
}

// SpellHitPointEffectKind is how a spell that reads hit points works.
enum SpellHitPointEffectKind {
  SPELL_HIT_POINT_EFFECT_KIND_UNSPECIFIED = 0;
  // A pool of dice is rolled and the creatures are affected in ascending order
  // of current hit points (Sono, Leque Cromático).
  SPELL_HIT_POINT_EFFECT_KIND_POOL = 1;
  // A creature at or below a number of hit points is affected (Palavra de Poder).
  SPELL_HIT_POINT_EFFECT_KIND_THRESHOLD = 2;
  // Works only on a creature at 0 hit points (Estabilizar).
  SPELL_HIT_POINT_EFFECT_KIND_ZERO_HP = 3;
  // A fixed heal that also ends conditions (Cura Completa).
  SPELL_HIT_POINT_EFFECT_KIND_FLAT_HEAL = 4;
  // The creatures gain temporary hit points: dice plus a fixed amount, which are
  // not healing (Vitalidade Falsa).
  SPELL_HIT_POINT_EFFECT_KIND_TEMP_HP = 5;
  // The creatures' maximum and current hit points both rise by a fixed amount,
  // which is not healing (Ajuda).
  SPELL_HIT_POINT_EFFECT_KIND_MAX_HP = 6;
}

// SpellHitPointEffect is the rule of a spell that reads hit points, from
// effects/spells.json, at the spell's own circle and what each circle above adds.
message SpellHitPointEffect {
  SpellHitPointEffectKind kind = 1;
  // A pool: the dice at the spell's own circle (5d8) and how many dice each
  // circle above adds (2). 0 for any other kind.
  int32 pool_dice_count = 2;
  int32 pool_dice_sides = 3;
  int32 pool_dice_per_level = 4;
  // The condition given to each creature affected ("condition:unconscious").
  // Empty when none is given (a kill, a stabilise, a heal).
  string condition_key = 5;
  // A threshold: the most hit points a creature may have to be affected.
  int32 threshold = 6;
  // A threshold that kills instead of giving a condition.
  bool dies = 7;
  // A flat heal: the amount at the spell's own circle and what each circle above adds.
  int32 heal_amount = 8;
  int32 heal_per_level = 9;
  // Temporary hit points: the dice are pool_dice_count/pool_dice_sides (1d4).
  // Maximum hit points: the amount raised at the spell's own circle and what
  // each circle above adds. 0 for any other kind.
  int32 amount = 10;
  int32 amount_per_level = 11;
}

// SpellCastingTime is "1 action", "1 bonus action", "10 minutes"...
message SpellCastingTime {
  // The number: 1 for "1 action", 10 for "10 minutes".
  int32 amount = 1;
  CastingTimeUnit unit = 2;
  // For a reaction, when it is cast, in English ("which you take when you
  // are hit..."). Empty when the SRD data has none.
  string trigger = 3;
  // The SRD's text, such as "1 action".
  string raw = 4;
}

enum CastingTimeUnit {
  CASTING_TIME_UNIT_UNSPECIFIED = 0;
  CASTING_TIME_UNIT_ACTION = 1;
  CASTING_TIME_UNIT_BONUS_ACTION = 2;
  CASTING_TIME_UNIT_REACTION = 3;
  CASTING_TIME_UNIT_MINUTE = 4;
  CASTING_TIME_UNIT_HOUR = 5;
}

// SpellRange is how far a spell reaches.
message SpellRange {
  SpellRangeKind kind = 1;
  // Distance in feet, for SPELL_RANGE_KIND_RANGED. 0 otherwise.
  int32 distance_ft = 2;
  // The SRD's text, such as "120 feet".
  string raw = 3;
}

enum SpellRangeKind {
  SPELL_RANGE_KIND_UNSPECIFIED = 0;
  SPELL_RANGE_KIND_SELF = 1;
  SPELL_RANGE_KIND_TOUCH = 2;
  // A distance, in distance_ft.
  SPELL_RANGE_KIND_RANGED = 3;
  SPELL_RANGE_KIND_SIGHT = 4;
  SPELL_RANGE_KIND_UNLIMITED = 5;
  // The SRD says "Special": read `raw` and the description.
  SPELL_RANGE_KIND_SPECIAL = 6;
}

// SpellComponents are the verbal, somatic and material components.
message SpellComponents {
  bool verbal = 1;
  bool somatic = 2;
  bool material = 3;
  // What the material component is, in English. Empty without one.
  string material_text = 4;
}

// SpellDuration is how long a spell lasts.
message SpellDuration {
  SpellDurationKind kind = 1;
  // For SPELL_DURATION_KIND_TIMED: "8 hours" is amount 8, unit HOUR.
  int32 amount = 2;
  SpellDurationUnit unit = 3;
  // "Up to 1 minute": the spell may end sooner.
  bool up_to = 4;
  // The caster must keep concentrating.
  bool concentration = 5;
  // The SRD's text, such as "Up to 1 minute".
  string raw = 6;
}

enum SpellDurationKind {
  SPELL_DURATION_KIND_UNSPECIFIED = 0;
  SPELL_DURATION_KIND_INSTANTANEOUS = 1;
  // A length of time, in amount and unit.
  SPELL_DURATION_KIND_TIMED = 2;
  SPELL_DURATION_KIND_UNTIL_DISPELLED = 3;
  // The SRD says "Special": read `raw` and the description.
  SPELL_DURATION_KIND_SPECIAL = 4;
}

enum SpellDurationUnit {
  SPELL_DURATION_UNIT_UNSPECIFIED = 0;
  SPELL_DURATION_UNIT_ROUND = 1;
  SPELL_DURATION_UNIT_MINUTE = 2;
  SPELL_DURATION_UNIT_HOUR = 3;
  SPELL_DURATION_UNIT_DAY = 4;
}

// SpellAttackType says whether a spell needs an attack roll.
enum SpellAttackType {
  SPELL_ATTACK_TYPE_UNSPECIFIED = 0;
  SPELL_ATTACK_TYPE_NONE = 1;
  SPELL_ATTACK_TYPE_MELEE = 2;
  SPELL_ATTACK_TYPE_RANGED = 3;
}

// SpellSave is a saving throw a spell asks for.
message SpellSave {
  // The ability of the saving throw.
  Ability ability = 1;
  SpellSaveSuccess on_success = 2;
}

// SpellSaveSuccess says what a successful saving throw does.
enum SpellSaveSuccess {
  SPELL_SAVE_SUCCESS_UNSPECIFIED = 0;
  // The target takes no effect.
  SPELL_SAVE_SUCCESS_NONE = 1;
  // The target takes half the damage.
  SPELL_SAVE_SUCCESS_HALF = 2;
  // Something else: read the description.
  SPELL_SAVE_SUCCESS_OTHER = 3;
}

// SpellDamageChoice says what the caster picks among the damage types of a
// spell that lists more than one.
enum SpellDamageChoice {
  // Nothing to pick: every type is dealt as listed (Ice Storm).
  SPELL_DAMAGE_CHOICE_UNSPECIFIED = 0;
  // Every type is dealt and the dice a higher slot adds go to the type the
  // caster picks; each type's `by_slot_level` is its dice when it is the picked
  // one, the others staying at the spell's own circle (Coluna de Chamas).
  SPELL_DAMAGE_CHOICE_SCALE = 1;
  // Only the picked type is dealt (Guardiões Espirituais).
  SPELL_DAMAGE_CHOICE_ALTERNATIVE = 2;
}

// SpellDamage is one damage type of a spell, with its dice by level. The
// dice are the SRD's text ("8d6"); where the SRD gives a formula that is not
// plain dice, the text is kept as is.
message SpellDamage {
  // Content key of the damage type, such as "damage-type:fire".
  string damage_type_key = 1;
  // The Portuguese name, such as "fogo".
  string damage_type_pt = 2;
  // The dice by the level of the slot the spell is cast with, such as
  // {3: "8d6", 4: "9d6"}. Empty for a cantrip.
  map<int32, string> by_slot_level = 3;
  // The dice by the character's level, for cantrips: they grow at levels 5,
  // 11 and 17, such as {1: "1d10", 5: "2d10"}. Empty for other spells.
  map<int32, string> by_character_level = 4;
}

// TurnOptions is everything a character can do now: "Sua vez" (MR-014). The
// server works it out on every read from the sheet, what the character used
// this turn and what they spent since the last rest. It is never stored.
// A disabled option carries a reason code, never text: the app maps each
// code to Portuguese.
message TurnOptions {
  TurnEconomy economy = 1;
  // Weapon attacks and damaging cantrips, each with its to-hit and damage.
  repeated AttackOption attacks = 2;
  // The prepared spells that are not already an attack (cantrips that deal
  // damage are in `attacks`).
  repeated SpellOption spells = 3;
  // The actions everyone has.
  repeated ActionOption standard_actions = 4;
  // The actions the character's features grant.
  repeated ActionOption feature_actions = 5;
  // How far and how high it can jump (MR-034). Unset for a combatant with no
  // Strength on its sheet (a basic-sheet NPC): the master moves it by hand.
  JumpLimits jumps = 6;
}

// TurnEconomy is the state of the turn's action economy.
message TurnEconomy {
  EconomyState action = 1;
  EconomyState bonus_action = 2;
  EconomyState reaction = 3;
  MovementLeft movement = 4;
  // How many attacks the Attack action makes: 1, or 2 with Extra Attack. At
  // least 1.
  int32 attacks_per_action = 5;
  // How many of them remain this turn: all of them while the action is free,
  // the rest after the first attack spent it, 0 when something else spent the
  // action. The attacks stay enabled while this is above 0.
  int32 attacks_left = 6;
}

// EconomyState says whether an action, bonus action or reaction is spent.
message EconomyState {
  bool used = 1;
  bool available = 2;
}

// MovementLeft is the walking left in the turn, in feet.
message MovementLeft {
  // The speed for this turn: doubled after the Dash action. For a creature
  // with a fly speed, the best of its speeds.
  int32 speed_ft = 1;
  int32 used_ft = 2;
  int32 left_ft = 3;
  // The same three in tenths of a foot, which is what the server keeps and
  // charges (RN-21: a move costs the exact length of its straight line, so a
  // diagonal step is 7.1 ft, 71 here). The `_ft` fields above are these
  // rounded down, for older clients.
  int32 speed_dft = 4;
  int32 used_dft = 5;
  int32 left_dft = 6;
}

// JumpLimits is how far and how high the combatant can jump this turn, in tenths
// of a foot (SRD 5.1, RN-21): a long jump of as many feet as its Strength score
// with a running start and half that standing; a high jump of 3 feet plus its
// Strength modifier with a running start and half that standing. A running start
// is a move of at least 10 ft on foot right before, in the same turn
// (`running_start`). The jump costs as many feet of movement as it covers.
message JumpLimits {
  // The long jump with and without a running start.
  int32 long_running_dft = 1;
  int32 long_standing_dft = 2;
  // The high jump with and without a running start. Never below 0.
  int32 high_running_dft = 3;
  int32 high_standing_dft = 4;
  // True when the move this combatant made just before, this turn, was 10 ft or
  // more on foot: a jump now may use the running numbers.
  bool running_start = 5;
}

// CreatureSize is a creature's size in the SRD's order. It decides whether a
// combatant may pass a hostile creature (two sizes apart) and share a square
// (only Tiny with Tiny); every combatant still occupies one square, Large or
// not. UNSPECIFIED counts as MEDIUM.
enum CreatureSize {
  CREATURE_SIZE_UNSPECIFIED = 0;
  CREATURE_SIZE_TINY = 1;
  CREATURE_SIZE_SMALL = 2;
  CREATURE_SIZE_MEDIUM = 3;
  CREATURE_SIZE_LARGE = 4;
  CREATURE_SIZE_HUGE = 5;
  CREATURE_SIZE_GARGANTUAN = 6;
}

// DisabledReason says why an option cannot be used now.
message DisabledReason {
  DisabledReasonCode code = 1;
  // For DISABLED_REASON_CODE_NO_SLOT: the lowest slot level that would do.
  int32 min_level = 2;
  // For DISABLED_REASON_CODE_NO_USES: when the uses come back.
  Recharge recharge = 3;
}

enum DisabledReasonCode {
  DISABLED_REASON_CODE_UNSPECIFIED = 0;
  // The action, bonus action or reaction the option needs is already spent.
  DISABLED_REASON_CODE_ACTION_USED = 1;
  DISABLED_REASON_CODE_BONUS_ACTION_USED = 2;
  DISABLED_REASON_CODE_REACTION_USED = 3;
  // No free slot at the spell's level or above (see min_level).
  DISABLED_REASON_CODE_NO_SLOT = 4;
  // The feature's uses are spent (see recharge).
  DISABLED_REASON_CODE_NO_USES = 5;
  // Shield: cast only when an attack hits the caster.
  DISABLED_REASON_CODE_REACTION_ONLY_WHEN_HIT = 6;
  // Another reaction spell: cast only when its trigger happens.
  DISABLED_REASON_CODE_REACTION_ONLY = 7;
  // The casting time is a minute or more, too long for a fight.
  DISABLED_REASON_CODE_CASTING_TIME_TOO_LONG = 8;
  // CombatService.GetTurnOptions: the combatant is not the one on turn
  // ("fora da vez"). Every option of a combatant off turn carries it.
  DISABLED_REASON_CODE_NOT_YOUR_TURN = 9;
  // CombatService.GetTurnOptions: the combat is not running (still being set
  // up, or already over).
  DISABLED_REASON_CODE_COMBAT_NOT_ACTIVE = 10;
  // CombatService.GetTurnOptions: a player's character at 0 hit points
  // ("Caído"): it makes death saves (CombatService.RollDeathSave) instead of
  // acting.
  DISABLED_REASON_CODE_COMBATANT_DOWN = 11;
  // CombatService.GetTurnOptions: the combatant is out of the fight
  // ("Derrotado").
  DISABLED_REASON_CODE_COMBATANT_DEFEATED = 12;
  // An attack: the Attack action made all its attacks this turn (Extra
  // Attack). With a single attack per action the code is ACTION_USED.
  DISABLED_REASON_CODE_ATTACKS_USED = 13;
  // A feature that can be used once per turn (Action Surge, even at fighter
  // level 17 with two uses) was already used in this turn.
  DISABLED_REASON_CODE_ALREADY_USED_THIS_TURN = 14;
  // A spell: a spell cast with a bonus action leaves no other spell for the turn
  // except a cantrip with a casting time of 1 action, in either order (the
  // character cast a bonus action spell, or this is one and a spell was cast).
  DISABLED_REASON_CODE_BONUS_ACTION_SPELL_LIMIT = 15;
  // Flurry of Blows: it comes right after the Attack action, taken with a weapon
  // or an unarmed strike, and that action has not been taken yet this turn.
  DISABLED_REASON_CODE_ATTACK_ACTION_FIRST = 16;
}

// BonusAttackRule is the rule that makes an attack a bonus action attack right
// now (SRD 5.1: Two-Weapon Fighting, Martial Arts, Flurry of Blows). All of them
// follow the Attack action.
enum BonusAttackRule {
  // The attack is not a bonus action attack now: it is made with the Attack
  // action.
  BONUS_ATTACK_RULE_UNSPECIFIED = 0;
  // The off-hand attack of Two-Weapon Fighting: a light melee weapon after the
  // Attack action with a light melee weapon. Its damage leaves out a positive
  // ability modifier, unless the character has the fighting style; the
  // `attack.damage` of the option is the damage the server rolls.
  BONUS_ATTACK_RULE_OFF_HAND = 1;
  // The Martial Arts unarmed strike, after the Attack action with an unarmed
  // strike or a monk weapon.
  BONUS_ATTACK_RULE_MARTIAL_ARTS = 2;
  // One of the two unarmed strikes of Flurry of Blows, whose bonus action is
  // already spent (see AttackOption.bonus_attacks_left).
  BONUS_ATTACK_RULE_FLURRY_OF_BLOWS = 3;
}

// AttackOption is an attack the character can make.
message AttackOption {
  Attack attack = 1;
  bool enabled = 2;
  // Set when `enabled` is false.
  DisabledReason reason = 3;
  // The rule that makes this attack a bonus action attack right now. Such an
  // attack is enabled even when `economy.attacks_left` is 0, and has targets
  // like any other; the bonus action is its cost, except for Flurry of Blows,
  // which spent it already. When the bonus action is spent, `reason` is
  // BONUS_ACTION_USED and this stays set. UNSPECIFIED (none) while an attack of the Attack
  // action is left (Extra Attack comes first) and when no rule applies.
  BonusAttackRule bonus_rule = 4;
  // For BONUS_ATTACK_RULE_FLURRY_OF_BLOWS: how many unarmed strikes of Flurry of
  // Blows are left this turn.
  int32 bonus_attacks_left = 5;
  // For BONUS_ATTACK_RULE_OFF_HAND: the damage in `attack` leaves out the ability
  // modifier (a positive one, and the character has no Two-Weapon Fighting style).
  bool bonus_drops_modifier = 6;
  // For a cantrip that fires several beams in one cast (Eldritch Blast): how many
  // beams are still to fire after the ones this cast made, while at least one
  // beam was fired. The option stays enabled while this is above 0, though the
  // action is spent. 0 for every other attack, and before the first beam.
  int32 beams_left = 7;
}

// SpellOption is a spell the character can cast.
message SpellOption {
  Spell spell = 1;
  // What casting costs. ACTION_ECONOMY_UNSPECIFIED for a casting time too
  // long for a fight.
  ActionEconomy economy = 2;
  bool enabled = 3;
  // Set when `enabled` is false.
  DisabledReason reason = 4;
  // The slots it can be cast with: at least the spell's level, with a free
  // slot. Empty for a cantrip, and for a spell with no free slot.
  repeated SlotChoice slots = 5;
}

// SlotChoice is a spell slot a spell can be cast with.
message SlotChoice {
  // The slot level, 1 to 9.
  int32 level = 1;
  // Whether it is a Warlock's pact magic slot.
  bool pact = 2;
  // How many slots of this kind are free, so the app can warn about the
  // last one.
  int32 free = 3;
}

// ActionOption is a standard or feature action the character can take.
message ActionOption {
  Action action = 1;
  bool enabled = 2;
  // Set when `enabled` is false.
  DisabledReason reason = 3;
  // Uses left of the action's resource. 0 when it has none.
  int32 uses_left = 4;
}

// ListCreaturesRequest names a campaign (for access) and the filters. Every
// filter is optional; the filters add up (a creature must pass all of them).
message ListCreaturesRequest {
  string campaign_id = 1;
  // Part of the creature's Portuguese or English name, ignoring case and
  // accents, such as "lobo", up to 100 characters. Empty for any.
  string query = 2;
  // The SRD's creature type, such as "beast", "undead" or "dragon". Empty for
  // any; a type that no creature has gives an empty list.
  string type = 3;
  // The highest challenge rating, one of the SRD's: "0", "1/8", "1/4", "1/2",
  // "1" to "30". Empty for any.
  string max_cr = 4;
  // Leave out the creatures with a fly speed, or with a swim speed (the Wild
  // Shape rules).
  bool no_fly = 5;
  bool no_swim = 6;
  // How many rows to return, 1 to 400; 0 means 50. The bestiary asks for 400,
  // which is all of the 334 creatures at once.
  int32 page_size = 7;
  // The next_page_token of the previous page; empty for the first. It is
  // only good for the same filters: with other ones, the call fails with
  // `invalid_argument`.
  string page_token = 8;
  // Only the creatures of this size. UNSPECIFIED (the default) means any size.
  CreatureSize size = 9;
  // The lowest challenge rating, one of the SRD's like max_cr. Empty for no
  // lower limit. With max_cr, min_cr must not be the higher one.
  string min_cr = 10;
}

// ListCreaturesResponse is one page of creatures, sorted by Portuguese name.
message ListCreaturesResponse {
  // The creatures of this page.
  repeated CreatureSummary creatures = 1;
  // Pass it as page_token to read the next page. Empty on the last page.
  string next_page_token = 2;
  // How many creatures pass the filters, over all the pages.
  int32 total = 3;
}

// CreatureSummary is a creature as a list row shows it.
message CreatureSummary {
  // Content key, such as "monster:wolf".
  string key = 1;
  // The SRD's English name ("Dire Wolf") and our Portuguese one ("Lobo atroz").
  string name = 2;
  string name_pt = 3;
  // The SRD's size word ("Large") and its Portuguese name ("Grande"). The
  // sizes are Tiny, Small, Medium, Large, Huge and Gargantuan.
  string size = 4;
  string size_pt = 5;
  // The SRD's type ("beast") and its Portuguese name ("fera"). The subtype is
  // the SRD's tag ("goblinoid"), empty when there is none.
  string type = 6;
  string type_pt = 7;
  string subtype = 8;
  // The challenge rating: "0", "1/8", "1/4", "1/2", "1" to "30".
  string challenge_rating = 9;
  // The XP the creature gives when defeated, by its challenge rating.
  int32 xp = 10;
  // Whether the stat block has a fly or a swim speed.
  bool can_fly = 11;
  bool can_swim = 12;
  // The armor class and the average hit points, for the bestiary's row ("CA 13
  // · PV 11"). The English name is `name`.
  int32 armor_class = 13;
  int32 hit_points = 14;
}

// GetCreatureRequest names a creature.
message GetCreatureRequest {
  // The campaign, for access.
  string campaign_id = 1;
  // Content key of the creature, such as "monster:wolf".
  string key = 2;
}

// GetCreatureResponse returns one stat block.
message GetCreatureResponse {
  // The creature's stat block.
  Creature creature = 1;
}

// Creature is a stat block of the SRD 5.1. Distances are in feet. The names of
// traits and actions and their text are the SRD's English; the labels are
// Portuguese.
message Creature {
  // The list row: names, size, type, challenge rating and XP.
  CreatureSummary summary = 1;
  // The SRD's alignment text, such as "neutral evil".
  string alignment = 2;
  // Armor class, where it comes from in Portuguese ("Armadura natural", "Sem
  // armadura"), and the SRD's note ("armor scraps"), empty when there is none.
  // The note names what the creature wears ("armadura de couro, escudo") and
  // its other armor classes ("15 com Armadura Arcana").
  int32 armor_class = 3;
  string armor_class_label_pt = 4;
  string armor_class_note = 5;
  // The average hit points, the hit dice ("2d8") and the dice with the bonus
  // ("2d8+2").
  int32 hit_points = 6;
  string hit_dice = 7;
  string hit_points_roll = 8;
  // The speeds, 0 for none; hover is true for a flying creature that hovers.
  int32 speed_walk_ft = 9;
  int32 speed_fly_ft = 10;
  int32 speed_swim_ft = 11;
  int32 speed_climb_ft = 12;
  int32 speed_burrow_ft = 13;
  bool hover = 14;
  // The six abilities, in the order strength to charisma.
  repeated CreatureAbilityScore abilities = 15;
  // The saving throw and skill bonuses the stat block lists (the total
  // bonus). The ones it does not list are the ability modifier.
  repeated CreatureBonus saving_throws = 16;
  repeated CreatureBonus skills = 17;
  // Damage the creature takes double, half or none of.
  repeated CreatureDamageModifier vulnerabilities = 18;
  repeated CreatureDamageModifier resistances = 19;
  repeated CreatureDamageModifier immunities = 20;
  // The conditions it can't suffer, such as "condition:poisoned", "Envenenado".
  repeated CreatureNamedKey condition_immunities = 21;
  // Special senses with their range, such as darkvision 60 ft.
  repeated Sense senses = 22;
  // 10 + the Perception bonus, as the stat block says.
  int32 passive_perception = 23;
  // The SRD's text, in English, such as "Common, Goblin". Empty for none.
  string languages = 24;
  // The proficiency bonus, such as 2.
  int32 proficiency_bonus = 25;
  // Traits (the SRD's "special abilities"), actions, reactions and legendary
  // actions.
  repeated CreatureTrait traits = 26;
  repeated CreatureAction actions = 27;
  repeated CreatureTrait reactions = 28;
  repeated CreatureTrait legendary_actions = 29;
  // The names, in Portuguese when the content has one, of the attacks the
  // bestiary's "Criar NPC" copies to the NPC's basic sheet (MR-042): at most
  // three, in the order the sheet gets them. GetCreature fills it with the same
  // function CreateNpcFromCreature builds the sheet with, so the dialog and the
  // NPC can never differ. Empty when no attack fits a basic sheet.
  repeated string npc_attack_names = 30;
}

// CreatureAbilityScore is one ability of a stat block.
message CreatureAbilityScore {
  // Which ability.
  Ability ability = 1;
  // The Portuguese name, such as "Força".
  string name_pt = 2;
  // The ability score, 1 to 30.
  int32 score = 3;
  // floor((score - 10) / 2).
  int32 modifier = 4;
}

// CreatureBonus is a saving throw or skill bonus of a stat block.
message CreatureBonus {
  // The ability ("ABILITY_DEXTERITY") for a saving throw, or the skill's
  // ability for a skill.
  Ability ability = 1;
  // Content key of the skill ("skill:stealth"); empty for a saving throw.
  string key = 2;
  // The Portuguese name ("Furtividade", "Destreza").
  string name_pt = 3;
  // The total bonus to add to the d20.
  int32 bonus = 4;
}

// CreatureNamedKey is a content key with its Portuguese name.
message CreatureNamedKey {
  // Content key, such as "damage-type:fire" or "condition:poisoned".
  string key = 1;
  // Its Portuguese name, such as "Fogo".
  string name_pt = 2;
}

// CreatureDamageModifier is one entry of a vulnerability, resistance or
// immunity list.
message CreatureDamageModifier {
  // The damage types it names, such as "damage-type:fire", "Fogo". Empty when
  // the SRD names none ("damage from spells").
  repeated CreatureNamedKey types = 1;
  // The rest of the SRD's text, in English ("from nonmagical weapons"); the
  // whole text when it names no damage type.
  string note = 2;
}

// CreatureTrait is a trait, a reaction or a legendary action: a name and text.
message CreatureTrait {
  // The SRD's English name, such as "Pack Tactics".
  string name = 1;
  // The SRD's English text.
  string text = 2;
  // The SRD's limit ("3/day", "Recharge 5-6"); empty when there is none.
  string usage = 3;
}

// CreatureAction is an action of a stat block.
message CreatureAction {
  // The action's English name, such as "Bite".
  string name = 1;
  // The SRD's English text.
  string text = 2;
  // The SRD's limit ("Recharge 5-6"); empty when there is none.
  string usage = 3;
  // Whether it is an attack roll, and the bonus to add to the d20.
  bool has_attack = 4;
  int32 attack_bonus = 5;
  // The damage parts, in the SRD's order. When the SRD offers a choice (a
  // longsword's one or two hands), the first option; the text has the rest.
  repeated CreatureDamagePart damage = 6;
  // The saving throw the action asks for. Unset when it asks for none.
  CreatureSave save = 7;
  // For the Multiattack action: the routines, of which the creature makes
  // one. Empty for any other action.
  repeated CreatureMultiattackRoutine multiattack = 8;
  // The action's Portuguese name ("Mordida") for the attacks a character can have
  // through a creature; empty when the content has none, and the screen then shows
  // the English `name` as it is.
  string name_pt = 9;
}

// CreatureDamagePart is one damage roll of an action.
message CreatureDamagePart {
  // The dice, such as "2d4+2", or a flat "1".
  string dice = 1;
  // Content key of the damage type and its Portuguese name ("perfurante").
  string damage_type_key = 2;
  string damage_type_pt = 3;
}

// CreatureSave is a saving throw an action asks for.
message CreatureSave {
  // The ability of the saving throw. When the text offers two ("Strength or
  // Dexterity"), the first; the action's text has both.
  Ability ability = 1;
  // The difficulty class.
  int32 dc = 2;
  // What a success does; OTHER when the text says neither "nothing" nor "half".
  SpellSaveSuccess on_success = 3;
}

// CreatureMultiattackRoutine is one way to spend a Multiattack: these attacks.
message CreatureMultiattackRoutine {
  // The attacks of the routine, in the SRD's order.
  repeated CreatureAttackCount attacks = 1;
}

// CreatureAttackCount is "Bite x1" in a Multiattack.
message CreatureAttackCount {
  // The name of an action of the same stat block, such as "Claw".
  string name = 1;
  // How many times; at least 1. When the SRD gives words instead of a number
  // (the hydra's "Number of Heads", the violet fungus's "1d4"), see count_text.
  int32 count = 2;
  // "melee", "ranged", "ability" or "magic".
  string kind = 3;
  // The SRD's words for a count that is not a number, empty otherwise.
  string count_text = 4;
}
