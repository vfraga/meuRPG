// SetCarriedLightRequest names the character and the light.
message SetCarriedLightRequest {
  string campaign_id = 1;
  string map_id = 2;
  // The character (a UUID) whose token carries the light.
  string character_id = 3;
  // A light preset's key ("light:torch"), or empty for none.
  string light_key = 4;
}

// SetCarriedLightResponse returns the token as the caller sees it.
message SetCarriedLightResponse {
  MapToken token = 1;
}

// GetMapVisionRequest names a map of a campaign.
message GetMapVisionRequest {
  string campaign_id = 1;
  string map_id = 2;
  // "Ver como": a living player character of the campaign (a UUID). The master
  // then gets the view of that character's player. A player may not send it
  // (`permission_denied`). Empty for the caller's own view, or, for the master,
  // everything seen.
  string as_character_id = 3;
}

// GetMapVisionResponse is what the caller sees of a map's squares. The states
// are packed, four bits a square, two squares to a byte, row-major as the layers
// are (square n = row * grid_columns + col): square n is the low four bits of
// byte n / 2 when n is even and the high four bits when n is odd. Unused bits of
// the last byte are 0. The values (VisionState in the app):
//
//	0 unseen: nothing is known of the square (draw it black);
//	1 a wall seen because a square next to it is seen;
//	2 seen in grey: in the dark, by darkvision or blindsight;
//	3 seen in dim light (penumbra);
//	4 seen in bright light;
//	5 remembered: seen before and not now (draw it darkened, without creatures).
//
// A square's value is exactly one, the one that applies now; a wall seen now is
// 1, and a wall seen before is 5.
message GetMapVisionResponse {
  // The map's grid, as in Map.
  int32 grid_columns = 1;
  int32 grid_rows = 2;
  // The packed states, ceil(squares / 2) bytes.
  bytes states = 3;
  // A number of the states: it changes whenever any square's state changes, and
  // the app compares it with the one it holds to know whether to redraw.
  int32 revision = 4;
  // False when no living player character of the viewer has a token on this map
  // (and "Visão do grupo" has none to lend): the player sees only the remembered
  // part, and the app says "Seu personagem não está neste mapa". True for the
  // master without as_character_id, and on a map without fog.
  bool character_on_map = 5;
  // Whether the map has the fog of war on. When false every square reads 4
  // (bright), as the master sees them.
  bool fog_enabled = 6;
  // "Visão do grupo" is on for this map: the view is the union of every player
  // character's.
  bool group_vision = 7;
  // The path of the viewer's image tiles (MR-036, RN-10): a player on a map with
  // the fog on never receives the image whole, only its tiles of tile_squares x
  // tile_squares squares, each with the pixels of the squares they see or
  // remember and solid black elsewhere. A tile is GET <tiles_path><tx>/<ty>?r=<revision>
  // (same origin, with the session cookie; the master adds &as=<character ID>
  // to read as a player). The tile's pixels never change except by gaining squares:
  // the app fetches a tile again only when its revision changed. A tile with no
  // square the viewer knows is not in `tiles` and answers 404. Empty for the master
  // (who reads the whole image), on a map without the fog, and while images are off.
  string tiles_path = 8;
  // How many squares a tile is on each side: 16.
  int32 tile_squares = 9;
  // The tiles that exist for the viewer, in row-major order.
  repeated MapTile tiles = 10;
}

// MapTile is one tile of a map's image for a viewer on a map with the fog on.
message MapTile {
  // The tile's column and row, from 0: it covers the squares from column
  // tx * tile_squares and row ty * tile_squares, up to the grid's edge.
  int32 tx = 1;
  int32 ty = 2;
  // A number of the squares of this tile the viewer knows. It is the `r` of the
  // tile's URL, and the tile's ETag: it changes when the tile gains a square
  // (and when the map's image or grid changes).
  int32 revision = 3;
}

// ForgetMapVisionRequest names a map of a campaign.
message ForgetMapVisionRequest {
  string campaign_id = 1;
  string map_id = 2;
}

// ForgetMapVisionResponse is empty.
message ForgetMapVisionResponse {}
