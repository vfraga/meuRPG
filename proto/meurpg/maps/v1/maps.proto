syntax = "proto3";

package meurpg.maps.v1;

import "google/protobuf/timestamp.proto";
import "meurpg/characters/v1/characters.proto";
import "meurpg/rules/v1/rules.proto";

// MapService keeps a campaign's maps (MR-008, MR-009, MR-012): an image of
// the gallery with points of interest and tokens on top of it.
//
// Who sees what (RN-10) is decided on the server, and a player never
// receives a hidden thing, not even its ID:
//   - A map is hidden until the master reveals it (SetMapRevealed), and a
//     new map starts hidden. A player sees a map when it is revealed or
//     when it is the current map of the campaign's open game session
//     (PlayService.SetCurrentMap, which also reveals it). Any other map is
//     `not_found` for them, exactly as a map that does not exist.
//   - A point is hidden until the master reveals it, and a new point starts
//     hidden. A player gets only the revealed points of a map they see.
//   - A token is visible or hidden. A player's character starts visible and
//     an NPC hidden; a player gets only the visible tokens.
//   - A submap point leads to its target map for a player only when they
//     may see that map too; otherwise it has no target for them.
//   - The master sees everything, with each thing's state.
//
// Only the campaign's master changes maps, points and tokens; any member
// reads them, filtered as above. While a game session is open, every change
// also reaches the members watching it (PlayService.WatchGameSession):
// `map_changed` and `token_moved`, under the same rules, so a player's
// stream never mentions a hidden thing either.
//
// Etapa 9 adds, on the same rules (RN-10):
//   - Four painted layers on a map with a grid (PaintMapCells, GetMapLayers):
//     difficult terrain, walls, cover and light. The master gets all four. A
//     player gets walls, difficult terrain and cover (visible things) of a
//     map they see, never the light, and, while the map has the fog of war on,
//     only the squares their character sees or remembers.
//   - The fog of war's settings (SetMapFog): off by default, per map. While a
//     map has the fog on, a player receives only what their own character sees
//     now or has seen (RN-10): no image id, URL or thumbnail, only the points
//     whose squares they see or remember, a player character's token always but
//     an NPC's only on a square seen now, and the layers filtered the same way
//     (GetMapVision says what is seen). The master reads everything, and may
//     read as a player's character ("Ver como", as_character_id).
//   - Three more kinds of point. A TRAP is sent to a player only once it was
//     revealed to their character (RevealTrap, or found by them in play), was
//     triggered, or the master revealed it to everyone; and then without its
//     DCs, effect or preset, which only the master ever receives. A TREASURE
//     follows the reveal rule and becomes visible to everyone, with its
//     description and value, once found (MarkTreasureFound). A LIGHT is never
//     sent to a player: they see its light, not the point.
//   - The light a character carries (SetCarriedLight).
//
// Positions (x_bp, y_bp) are basis points of the map image's width and
// height: 0 is the left (top) edge, 10000 the right (bottom) edge, 5000 the
// middle. They do not depend on the image's size in pixels.
//
// Text fields. Lengths count characters (Unicode code points), after the
// server trims spaces at both ends. Names are one line, 1 to 80 characters,
// with no control characters. A point's description is 0 to 2,000
// characters and may have line breaks and tabs, but no other control
// characters. Every text is fiction the master writes: the server never
// logs it (docs/privacy.md).
//
// Every method needs a valid session cookie and fails with `unauthenticated`
// without one. For a campaign the caller is not a member of (a pending
// member neither, RN-15), methods answer `not_found`, exactly as for a
// campaign that does not exist; a player calling a method only the master
// may call gets `permission_denied`. See ADR-0011. An ID that is not a UUID
// is answered like an ID that does not exist.
//
// Errors every method can return, besides those listed on each method:
//   - `unauthenticated`: no valid session cookie.
//   - `invalid_argument`: a field breaks its documented rules. The message
//     names the field, never its value.
//   - `unavailable`: the database did not answer; the app may try again.
//   - `aborted`: the database kept reporting a conflicting transaction
//     after the server's retries; the app may try again.
//
// Responses carry `Cache-Control: no-store`. Every request carries a
// campaign ID, so reads are IDEMPOTENT and POST-only: a GET would put the
// IDs in the URL, and URLs end up in the platform's request logs
// (docs/privacy.md).
service MapService {
  // ListMaps lists the campaign's maps the caller may see, oldest first:
  // every map for the master, each with its state; for a player, only the
  // revealed maps and the session's current map. Any member may call it.
  // The list is not paginated: a campaign has at most 200 maps.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a
  //     member of it.
  rpc ListMaps(ListMapsRequest) returns (ListMapsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // GetMap returns one map with its points and tokens, as the caller may
  // see them: the master gets every point and token, each with its state; a
  // player gets only the revealed points and the visible tokens. Any member
  // may call it. The app calls it again whenever the live session says the
  // map changed (`map_changed`, `current_map_changed`).
  //
  // On a map with the fog of war on, a player gets a filtered map: the image
  // without an id, URL or thumbnail (image_withheld), the points whose square
  // (any square of its area) they see now or remember, every player
  // character's token and an NPC's only on a square they see now, and the
  // counts of what they receive. The master may send as_character_id to get
  // exactly what that character's player would get ("Ver como").
  //
  // Errors:
  //   - `not_found`: the map is not in this campaign, or the caller is a
  //     player and the map is hidden from them; the campaign does not
  //     exist, or the caller is not a member of it. With as_character_id: the
  //     character is not a living player character of the campaign.
  //   - `permission_denied`: a player sent as_character_id.
  rpc GetMap(GetMapRequest) returns (GetMapResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // CreateMap creates a map from an image of the campaign's gallery. Only
  // the campaign's master may call it. The map starts hidden, without
  // points or tokens. An image that is the background of a map with the fog on
  // is copied, and the new map gets the copy (the Map in the response carries its
  // ID), because a fog map's image is its own.
  //
  // Errors:
  //   - `invalid_argument`: the name breaks its rules, or image_id is not an
  //     image of the campaign's gallery (it may have been deleted in
  //     another tab).
  //   - `not_found`: the campaign does not exist, or the caller is not a
  //     member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `resource_exhausted`: the campaign already has 200 maps.
  //
  // Safe to retry when the request carries an idempotency_key: a second call with the same key and
  // the same request returns what the first one made and makes nothing; the same key with another
  // request is `invalid_argument`. Without a key the call is not deduplicated.
  rpc CreateMap(CreateMapRequest) returns (CreateMapResponse);

  // UpdateMap renames a map or changes its image. Only the campaign's
  // master may call it. The points and tokens keep their positions, which
  // are relative to the image's size.
  //
  // revision must be the revision the client last read. If the map's name
  // or image changed since, the call fails with `aborted` and changes
  // nothing: the app reloads the map and the master tries again. On
  // success, the revision goes up by one.
  //
  // A different image clears the map's painted layers (PaintMapCells), like
  // other grid columns do, and is refused while a combat that is not ended runs
  // on the map; the same image again changes nothing. A new image that is also
  // used another way (or is the background of a map with the fog on, for a map
  // without fog) is copied first, as SetMapFog does, and the map gets the copy:
  // the Map in the response carries the copy's ID.
  //
  // Errors:
  //   - `resource_exhausted`: the image needs a copy and the gallery is full.
  //   - `invalid_argument`: nothing to change, revision less than 1, the
  //     name breaks its rules, or image_id is not an image of the
  //     campaign's gallery, or it is another image and, on a map with a grid,
  //     the grid the rules would use for its proportions (drawn rows times the
  //     square_factor) is over 400 rows (SetMapGrid's limit).
  //   - `failed_precondition` (MapBlocked COMBAT_RUNNING): image_id is another
  //     image and a combat runs on the map.
  //   - `not_found`: the map is not in this campaign, the campaign does not
  //     exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `aborted`: revision is stale.
  rpc UpdateMap(UpdateMapRequest) returns (UpdateMapResponse);

  // DeleteMap deletes a map with its points and tokens. Only the campaign's
  // master may call it. It cannot be undone. The gallery image stays.
  // Submap points of other maps that led to it lose their target, and if
  // it was the session's current map, the session has no current map
  // anymore (`current_map_changed` with an empty map_id). A map that holds a
  // treasure that was found or turned into XP cannot be deleted, and neither
  // can the map a combat that has not ended runs on (the fog of war's filter
  // and the fight's terrain stand on it).
  //
  // Errors:
  //   - `failed_precondition` (MapBlocked TREASURE_FOUND or
  //     TREASURE_CONVERTED): the map holds such a treasure; unmark it first.
  //   - `failed_precondition` (MapBlocked COMBAT_RUNNING): a combat that has not
  //     ended runs on the map.
  //   - `not_found`: the map is not in this campaign (or was already
  //     deleted), the campaign does not exist, or the caller is not a member
  //     of it.
  //   - `permission_denied`: the caller is a player.
  rpc DeleteMap(DeleteMapRequest) returns (DeleteMapResponse);

  // SetMapRevealed shows a map to the players, or hides it again (RN-10).
  // Only the campaign's master may call it. Revealing a revealed map, or
  // hiding a hidden one, changes nothing. Hiding the session's current map
  // does not take it away from the players while it stays current.
  //
  // Errors:
  //   - `not_found`: the map is not in this campaign, the campaign does not
  //     exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  rpc SetMapRevealed(SetMapRevealedRequest) returns (SetMapRevealedResponse);

  // SetMapGrid sets the battle grid of a map, or clears it (MR-013, RN-21), and
  // calibrates it (MR-025, RN-25). The rules count in squares of 1.5 m (5 ft) on
  // every map; a drawing made with bigger squares says how many of them each
  // square of the drawing is worth (square_factor: 1 is 1.5 m, 2 is 3 m, 3 is
  // 4.5 m...). `columns` counts the squares of the DRAWING across the image's
  // width and the rows follow the image's proportions; the grid the rules use
  // (grid_columns and grid_rows on the Map, and the size of every layer) is the
  // drawing's times the factor. A combat can only start on a map with a grid
  // (PlayService/CombatService.StartEncounter).
  //
  // What the painted layers do. The same columns and factor change nothing. The
  // same columns with a factor that is a MULTIPLE of the old one (1 to 2, 1 to 3,
  // 2 to 4, 2 to 6...) keep everything, scaled: each painted square of the walls,
  // the difficult terrain, the cover, the light and the doors, and each square
  // a player remembers seeing, becomes a block of (new/old) x (new/old) squares
  // (a door is the whole drawn square, so a door becomes a doorway as wide as
  // the old square). Tokens and points are positions in the image and do not
  // move; a trap's area_size stays in squares of 1.5 m. Any other change (other
  // columns, a smaller factor, a factor that is not a multiple, or setting a
  // grid on a map that has none) clears the layers and what the players
  // remember, as a grid change always did: the app asks first. Removing the grid
  // (0) also turns the fog of war off. Both ways the layers' revision goes up
  // when anything changed, and a player who sees the map gets `map_changed`.
  // Either is refused while a combat that is not ended runs on the map (the
  // combatants stand on squares of the old grid).
  //
  // Errors:
  //   - `invalid_argument`: columns is neither 0 nor between 4 and 200;
  //     square_factor is not between 0 and 20; or the grid the rules would use
  //     (columns x factor across, rows x factor down) is over 200 x 400
  //     squares (the message names the limit); or square_factor is above 1
  //     with no columns (columns 0 with factor 0 or 1 clears the grid).
  //   - `failed_precondition` (MapBlocked COMBAT_RUNNING): the columns or the
  //     factor would change while a combat runs on the map.
  //   - `not_found`: the map is not in this campaign, the campaign does not
  //     exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  rpc SetMapGrid(SetMapGridRequest) returns (SetMapGridResponse);

  // CreateMapPoint puts a point of interest on a map (MR-008). Only the
  // campaign's master may call it. The point starts hidden. A TRAP needs its
  // `trap`, a LIGHT its `light` and a TREASURE may carry `treasure_value_po`
  // (0 when unset); each field is refused on any other kind. A trap's numbers
  // are checked against the rules content (DCs 1 to 30, an area of 1 to 4
  // squares, dice of d4 to d12, damage types and conditions that exist).
  //
  // Errors:
  //   - `invalid_argument`: a field breaks its rules; kind is unspecified;
  //     target_map_id is set on a point that is neither a SUBMAP nor a
  //     BATTLE, is the point's own map, or is not a map of the campaign.
  //   - `not_found`: the map is not in this campaign, the campaign does not
  //     exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `resource_exhausted`: the map already has 200 points.
  //
  // Safe to retry when the request carries an idempotency_key: a second call with the same key and
  // the same request returns what the first one made and makes nothing; the same key with another
  // request is `invalid_argument`. Without a key the call is not deduplicated.
  rpc CreateMapPoint(CreateMapPointRequest) returns (CreateMapPointResponse);

  // UpdateMapPoint changes a point: each field set in the request replaces
  // the current value, and unset fields stay as they are. Moving a point is
  // an update of x_bp and y_bp. Only the campaign's master may call it.
  // Changing the kind to anything but SUBMAP or BATTLE removes the target,
  // and changing it from SCENE removes the point's scene actions, clues, hooks
  // and "Mostrar a CD" switch (show_dc). Turning show_dc on or off while the
  // point is the open scene sends `scene_changed` to every stream.
  //
  // Errors:
  //   - `invalid_argument`: nothing to change; a field breaks its rules;
  //     target_map_id is set on a point that is neither a SUBMAP nor a
  //     BATTLE (after the change), is the point's own map, or is not a map
  //     of the campaign.
  //   - `not_found`: the point is not on this map, the map is not in this
  //     campaign, the campaign does not exist, or the caller is not a
  //     member of it.
  //   - `permission_denied`: the caller is a player.
  rpc UpdateMapPoint(UpdateMapPointRequest) returns (UpdateMapPointResponse);

  // DeleteMapPoint deletes a point. Only the campaign's master may call it.
  // It cannot be undone. A TREASURE that was found, or turned into XP, cannot
  // be deleted: unmark it first, so a session's summary never loses it silently.
  //
  // Errors:
  //   - `failed_precondition` (MapBlocked TREASURE_FOUND or
  //     TREASURE_CONVERTED): the point is such a treasure.
  //   - `not_found`: the point is not on this map (or was already deleted),
  //     the map is not in this campaign, the campaign does not exist, or
  //     the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  rpc DeleteMapPoint(DeleteMapPointRequest) returns (DeleteMapPointResponse);

  // SetMapPointRevealed shows a point to the players, or hides it again
  // (RN-10, MR-009). Only the campaign's master may call it. The players see
  // it only on a map they see. Revealing a SCENE point also makes the scene
  // "discovered" (MR-030): the group may tag notes with it from then on, even
  // if the point is hidden again later.
  //
  // Errors:
  //   - `not_found`: the point is not on this map, the map is not in this
  //     campaign, the campaign does not exist, or the caller is not a
  //     member of it.
  //   - `permission_denied`: the caller is a player.
  rpc SetMapPointRevealed(SetMapPointRevealedRequest) returns (SetMapPointRevealedResponse);

  // AddSceneAction puts one more check on a SCENE point (MR-015): a skill
  // check, an ability check or a saving throw, with an optional name and an
  // optional DC and how many attempts each player has (max_attempts, 1 by
  // default). Actions save one by one, as the master edits them: there is
  // no "save all". Only the campaign's master may call it. The action goes
  // last. When the point is the scene open in the session, the streams get
  // `scene_changed`.
  //
  // Errors:
  //   - `invalid_argument`: the point is not a SCENE point; key is not a
  //     skill, an ability check or a saving throw of the rules ("skill:
  //     investigation", "ability:str", "save:wis": never an attack, a spell
  //     or a feature); name is longer than 60 characters; dc is not 1 to
  //     30; max_attempts is not 0 to 5.
  //   - `not_found`: the point is not on this map, the map is not in this
  //     campaign, the campaign does not exist, or the caller is not a
  //     member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `resource_exhausted`: the point already has 20 actions.
  //
  // Safe to retry when the request carries an idempotency_key: a second call with the same key and
  // the same request returns what the first one made and makes nothing; the same key with another
  // request is `invalid_argument`. Without a key the call is not deduplicated.
  rpc AddSceneAction(AddSceneActionRequest) returns (AddSceneActionResponse);

  // UpdateSceneAction changes one action of a SCENE point: each field set
  // in the request replaces the current value. Only the campaign's master
  // may call it.
  //
  // Errors:
  //   - `invalid_argument`: nothing to change; a field breaks the rules
  //     AddSceneAction lists.
  //   - `not_found`: the action is not on this point, the point is not on
  //     this map, the map is not in this campaign, the campaign does not
  //     exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  rpc UpdateSceneAction(UpdateSceneActionRequest) returns (UpdateSceneActionResponse);

  // MoveSceneAction moves one action a place up or down in its point's
  // list. Moving the first one up, or the last one down, changes nothing.
  // Only the campaign's master may call it.
  //
  // Errors:
  //   - `invalid_argument`: direction is unspecified.
  //   - `not_found`: as UpdateSceneAction.
  //   - `permission_denied`: the caller is a player.
  rpc MoveSceneAction(MoveSceneActionRequest) returns (MoveSceneActionResponse);

  // RemoveSceneAction takes one action off a SCENE point, with no
  // confirmation: the rolls already made stay in the session's history.
  // Only the campaign's master may call it.
  //
  // Errors:
  //   - `not_found`: as UpdateSceneAction.
  //   - `permission_denied`: the caller is a player.
  rpc RemoveSceneAction(RemoveSceneActionRequest) returns (RemoveSceneActionResponse);

  // AddSceneClue puts one more clue on a SCENE point (MR-029): a short text
  // the master prepared, to reveal to players during the session
  // (RevealSceneClue). Clues save one by one, like the actions. Only the
  // campaign's master may call it. The clue goes last. A player never
  // receives a clue that was not revealed to them (RN-20). The streams of the
  // master get `map_changed` and, when the point is the open scene,
  // `scene_changed`; the players' streams get nothing.
  //
  // Errors:
  //   - `invalid_argument`: the point is not a SCENE point; text is empty or
  //     longer than 500 characters.
  //   - `not_found`: the point is not on this map, the map is not in this
  //     campaign, the campaign does not exist, or the caller is not a
  //     member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `resource_exhausted`: the point already has 30 clues.
  //
  // Safe to retry when the request carries an idempotency_key: a second call with the same key and
  // the same request returns what the first one made and makes nothing; the same key with another
  // request is `invalid_argument`. Without a key the call is not deduplicated.
  rpc AddSceneClue(AddSceneClueRequest) returns (AddSceneClueResponse);

  // UpdateSceneClue changes the text of one clue of a SCENE point. What
  // players already received keeps the text they were given. Only the
  // campaign's master may call it.
  //
  // Errors:
  //   - `invalid_argument`: text is empty or longer than 500 characters.
  //   - `not_found`: the clue is not on this point, the point is not on this
  //     map, the map is not in this campaign, the campaign does not exist,
  //     or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  rpc UpdateSceneClue(UpdateSceneClueRequest) returns (UpdateSceneClueResponse);

  // MoveSceneClue moves one clue a place up or down in its point's list.
  // Moving the first one up, or the last one down, changes nothing. Only the
  // campaign's master may call it.
  //
  // Errors:
  //   - `invalid_argument`: direction is unspecified.
  //   - `not_found`: as UpdateSceneClue.
  //   - `permission_denied`: the caller is a player.
  rpc MoveSceneClue(MoveSceneClueRequest) returns (MoveSceneClueResponse);

  // RemoveSceneClue takes one clue off a SCENE point, with no confirmation:
  // the players who already received it keep it in their notes, with the
  // text they were given. Only the campaign's master may call it.
  //
  // Errors:
  //   - `not_found`: as UpdateSceneClue.
  //   - `permission_denied`: the caller is a player.
  rpc RemoveSceneClue(RemoveSceneClueRequest) returns (RemoveSceneClueResponse);

  // RevealSceneClue gives a clue to the players the master chose (MR-029,
  // question 59: the app sends every player character checked by default).
  // Each one gets it once: revealing again to a player who has it changes
  // nothing, and there is no way to take it back. The clue lands in the
  // player's notes (meurpg.notes.v1.NotesService.ListNotes) as "Pista do
  // mestre", tagged with the scene once the group has discovered it, whether
  // or not they are online. Only the campaign's master may call it, with or
  // without an open session.
  //
  // While a session is open, a `clue_revealed` event goes into its history
  // (IDs only, never the text), the streams of the players who got it now
  // receive `notes_changed`, and the master's, `scene_changed` when the
  // point is the open scene. No other player's stream hears of it.
  //
  // Errors:
  //   - `invalid_argument`: character_ids is empty or has more than 50.
  //   - `not_found`: the clue is not in this campaign, or one of the
  //     characters is not a living player character of it, or has no
  //     player, or the campaign does not exist, or the caller is not a
  //     member of it.
  //   - `permission_denied`: the caller is a player.
  rpc RevealSceneClue(RevealSceneClueRequest) returns (RevealSceneClueResponse);

  // PlaceMapToken puts a character's token on a map, or moves it there if
  // it is already on the map (MR-012). Only the campaign's master may call
  // it. The character must be a living character of the campaign: a
  // player's (not dead, not waiting for approval) or an NPC. A new token of
  // a player's character starts visible; a new NPC token starts hidden
  // (question 31 for Samuel). Moving keeps the token's state.
  //
  // During a session, a move reaches the watching members as `token_moved`:
  // everyone when the token is visible on a map the players see, only the
  // master otherwise. A new token reaches them as `map_changed`.
  //
  // Errors:
  //   - `not_found`: the character is not a living character of the
  //     campaign (or the creature is not one of its live creatures), the map
  //     is not in this campaign, the campaign does not exist, or the caller is
  //     not a member of it.
  //   - `invalid_argument`: both or neither of character_id and creature_id.
  //   - `permission_denied`: the caller is a player.
  rpc PlaceMapToken(PlaceMapTokenRequest) returns (PlaceMapTokenResponse);

  // SetMapTokenHidden hides a token from the players, or shows it again
  // (RN-10). Only the campaign's master may call it.
  //
  // Errors:
  //   - `not_found`: the character has no token on this map, the map is not
  //     in this campaign, the campaign does not exist, or the caller is not
  //     a member of it.
  //   - `permission_denied`: the caller is a player.
  rpc SetMapTokenHidden(SetMapTokenHiddenRequest) returns (SetMapTokenHiddenResponse);

  // RemoveMapToken takes a character's token off a map. Only the
  // campaign's master may call it.
  //
  // Errors:
  //   - `not_found`: the character has no token on this map, the map is not
  //     in this campaign, the campaign does not exist, or the caller is not
  //     a member of it.
  //   - `permission_denied`: the caller is a player.
  rpc RemoveMapToken(RemoveMapTokenRequest) returns (RemoveMapTokenResponse);

  // PaintMapCells paints squares of one layer of a map's grid (MR-034,
  // MR-036): difficult terrain, walls, cover or light, one value for a batch of
  // squares. Only the campaign's master may call it. The last write wins, with
  // no revision to send: painting is dragged, and a batch that repeats what is
  // there changes nothing (and bumps nothing). Send at most 400 squares a call.
  // On a calibrated map (square_factor above 1) a DOORS square is the whole
  // square of the drawing: painting one square paints its factor x factor block
  // (`changed` counts the squares of the rules' grid that changed). The other
  // layers are painted square by square.
  //
  // A change bumps Map.layers_revision, sends `map_changed` to the master and,
  // when players may read the layers (a map they see, with no fog), to them,
  // at most once a second for a map; the app then reads GetMapLayers again.
  //
  // Errors:
  //   - `invalid_argument`: layer is unspecified, value is not valid for the
  //     layer (terrain and wall: 0 or 1; cover: 0 to 2; light: 0 to 3), squares
  //     is empty or has more than 400, or a square is outside the map's grid.
  //   - `failed_precondition` (MapBlocked NO_GRID): the map has no grid.
  //   - `not_found`: the map is not in this campaign, the campaign does not
  //     exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  rpc PaintMapCells(PaintMapCellsRequest) returns (PaintMapCellsResponse);

  // GetMapLayers returns the painted layers of a map as packed bytes, in the
  // byte layout described on GetMapLayersResponse. Any member may call it. The
  // master gets all four layers. A player of a map they see gets the difficult
  // terrain, walls and cover, never the light; and, while the map has the fog
  // of war on, only the squares their character sees now or remembers, plus the
  // walls next to a seen square (fog_withheld is then true: this is a filtered
  // view). The master may send as_character_id to read as that character's
  // player would ("Ver como").
  //
  // Errors:
  //   - `not_found`: the map is not in this campaign, or is hidden from the
  //     caller (a player), the campaign does not exist, or the caller is not a
  //     member of it. With as_character_id: the character is not a living
  //     player character of the campaign.
  //   - `permission_denied`: a player sent as_character_id.
  rpc GetMapLayers(GetMapLayersRequest) returns (GetMapLayersResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // SetMapFog changes the fog of war's settings of a map (MR-036, D6): whether
  // it is on, the base light of a square nobody lit, and "Visão do grupo". Each
  // field set replaces the current value. Only the campaign's master may call
  // it. Turning the fog off keeps the painted layers. The fog needs a grid, and
  // removing the grid (SetMapGrid with 0 columns) turns it off. A player who
  // sees the map gets `map_changed`.
  //
  // A map's image is its own while the fog is on (a player never receives it).
  // Turning the fog on therefore copies the image when something else uses it (the
  // background of another map, an image left with the players, the one shown in
  // the session, an NPC's portrait): the copy is a new gallery image with the same
  // bytes, named "... (névoa)", and it becomes the map's image, so the Map in the
  // response carries the copy's ID. The other uses keep the original. The copy
  // takes a place in the campaign's gallery.
  //
  // Errors:
  //   - `invalid_argument`: nothing to change.
  //   - `resource_exhausted`: the fog needs a copy of the image and the gallery
  //     is full.
  //   - `failed_precondition` (MapBlocked NO_GRID): fog_enabled is true and the
  //     map has no grid.
  //   - `not_found`: the map is not in this campaign, the campaign does not
  //     exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  rpc SetMapFog(SetMapFogRequest) returns (SetMapFogResponse);

  // GetMapVision returns what the caller sees of a map with the fog of war on,
  // square by square, packed as GetMapVisionResponse describes (MR-036, D6). A
  // player gets their own character's view (the union of every player
  // character's, with "Visão do grupo" on), plus the squares their character
  // saw before and remembers. The master, without as_character_id, gets every
  // square seen; with it, the view of that character's player ("Ver como"). A
  // map without the fog on answers every square seen. The app reads it again
  // when the stream says `vision_changed`, and compares `revision` to know
  // whether anything changed.
  //
  // Errors:
  //   - `not_found`: the map is not in this campaign, or is hidden from the
  //     caller (a player), the campaign does not exist, or the caller is not a
  //     member of it. With as_character_id: the character is not a living
  //     player character of the campaign.
  //   - `permission_denied`: a player sent as_character_id.
  //   - `failed_precondition` (MapBlocked NO_GRID): the map has no grid.
  rpc GetMapVision(GetMapVisionRequest) returns (GetMapVisionResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ForgetMapVision clears every player's memory of what they saw on the map
  // ("Esquecer o que foi visto"): afterwards the remembered part is empty and
  // each player has only what their character sees now. Only the campaign's
  // master may call it. Changing the map's grid or image does the same. A
  // player watching the session gets `vision_changed`.
  //
  // Errors:
  //   - `not_found`: the map is not in this campaign, the campaign does not
  //     exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  rpc ForgetMapVision(ForgetMapVisionRequest) returns (ForgetMapVisionResponse);

  // RevealTrap shows a TRAP point to the players the master chose: some
  // characters (their players get the trap, and nobody else does) or everyone
  // (the same as revealing the point, SetMapPointRevealed). Only the campaign's
  // master may call it, with or without an open session. Revealing again to a
  // character who already knows changes nothing; there is no way to take it
  // back.
  //
  // With an open session a `trap_revealed` event goes into its history (IDs
  // only), and the streams of the players who now see the trap, and the
  // master's, get `map_changed`.
  //
  // Errors:
  //   - `invalid_argument`: the point is not a TRAP; character_ids is empty
  //     and all is false, or both are set, or it has more than 50.
  //   - `not_found`: the point is not on this map, the map is not in this
  //     campaign, one of the characters is not a living player character of the
  //     campaign with a player, the campaign does not exist, or the caller is
  //     not a member of it.
  //   - `permission_denied`: the caller is a player.
  rpc RevealTrap(RevealTrapRequest) returns (RevealTrapResponse);

  // GetTrapNoticers is the master's "Quem notaria" on a trap's card (MR-035, D5):
  // each living player character of the campaign with its passive Perception,
  // and whether the light penalty applies at the trap's squares as that character
  // sees them now (dim light, or darkness seen through darkvision, takes 5 from a
  // passive check; dim light within darkvision counts as bright). The server
  // works it out, so the browser does no rules math. Only the campaign's master
  // may call it; a player never gets a trap's DCs (RN-10).
  //
  // Errors:
  //   - `invalid_argument`: the point is not a TRAP.
  //   - `not_found`: the point is not on this map, the map is not in this
  //     campaign, the campaign does not exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  rpc GetTrapNoticers(GetTrapNoticersRequest) returns (GetTrapNoticersResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // DisarmTrap marks a trap "Desarmada" (MR-035, D5): the master calls it after
  // the table resolved the thieves' tools check (the app rolls nothing). A
  // disarmed trap never fires again until the master arms it again
  // (UpdateMapPoint). With an open session a `trap_disarmed` event goes into its
  // history (IDs only). A trap that is not revealed to everyone stays hidden from
  // the players who do not know it; one that is public tells everyone who sees
  // the map (`map_changed`). Disarming a trap that is already disarmed changes
  // nothing. Only the campaign's master may call it.
  //
  // Errors:
  //   - `invalid_argument`: the point is not a TRAP.
  //   - `not_found`: the point is not on this map, the map is not in this
  //     campaign, the campaign does not exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  rpc DisarmTrap(DisarmTrapRequest) returns (DisarmTrapResponse);

  // MarkTreasureFound marks a TREASURE point found, by one or more characters
  // (MR-041, D8). Only the campaign's master may call it, with or without an
  // open session. A found treasure is visible to everyone who sees the map,
  // with its description, its value and who found it, even if the master never
  // revealed the point. Marking a treasure that is already found replaces who
  // found it and keeps when. During an open session the treasure remembers the
  // session (the session's summary counts it) and a `treasure_found` event
  // (IDs and the PO only) goes into its history; outside one, it counts in no
  // session's summary.
  //
  // Errors:
  //   - `invalid_argument`: the point is not a TREASURE; character_ids is empty
  //     or has more than 50.
  //   - `failed_precondition` (MapBlocked TREASURE_CONVERTED): the treasure
  //     was already turned into XP (slice 9.11).
  //   - `not_found`: the point is not on this map, the map is not in this
  //     campaign, one of the characters is not a living player character of the
  //     campaign, the campaign does not exist, or the caller is not a member of
  //     it.
  //   - `permission_denied`: the caller is a player.
  rpc MarkTreasureFound(MarkTreasureFoundRequest) returns (MarkTreasureFoundResponse);

  // UnmarkTreasureFound takes the "found" mark off a TREASURE point: it goes back
  // to the reveal rule. Only the campaign's master may call it. Unmarking a
  // treasure that is not found changes nothing. With an open session a
  // `treasure_unfound` event goes into its history.
  //
  // Errors:
  //   - `invalid_argument`: the point is not a TREASURE.
  //   - `failed_precondition` (MapBlocked TREASURE_CONVERTED): the treasure
  //     was already turned into XP.
  //   - `not_found`: the point is not on this map, the map is not in this
  //     campaign, the campaign does not exist, or the caller is not a member of
  //     it.
  //   - `permission_denied`: the caller is a player.
  rpc UnmarkTreasureFound(UnmarkTreasureFoundRequest) returns (UnmarkTreasureFoundResponse);

  // SetCarriedLight sets the light a character carries on a map (MR-036, D6): a
  // light preset's key (ContentService.ListLightPresets), or empty for none. A
  // player may set it for their own character, the master for anyone; any other
  // call is refused. It rides on the character's token, so the character needs
  // one on the map. The token (MapToken.carried_light) tells it to the master
  // and the character's own player only; the other players see its light, in
  // what GetMapVision gives them. On a map with the fog of war on a player's own
  // character is always on the map for them, so they may set its light even if the
  // master hid its token.
  //
  // Errors:
  //   - `invalid_argument`: light_key is not empty and is not a light preset's
  //     key.
  //   - `not_found`: the character has no token on this map, is not a living
  //     character of the campaign, or is an NPC and the caller is a player; the
  //     map is not in this campaign; the campaign does not exist, or the caller
  //     is not a member of it.
  //   - `permission_denied`: the caller is a player and the character is
  //     another player's.
  rpc SetCarriedLight(SetCarriedLightRequest) returns (SetCarriedLightResponse);
}

// MapPointKind is what a point of interest leads to.
enum MapPointKind {
  MAP_POINT_KIND_UNSPECIFIED = 0;
  // "Batalha": an encounter. It may name the map where the fight happens
  // (the point's target map, like a submap): starting the combat from the
  // point (CombatService.StartEncounter) then makes that map the session's
  // current map.
  MAP_POINT_KIND_BATTLE = 1;
  // "Submapa": another map, such as a building inside a region (the
  // point's target map).
  MAP_POINT_KIND_SUBMAP = 2;
  // "Cena de RP": a role-play scene. The master opens it in the session
  // (PlayService.OpenScene); it may have actions, clues and hooks.
  MAP_POINT_KIND_SCENE = 3;
  // "Armadilha" (MR-035): a trap, master only until found. It carries a
  // TrapSpec.
  MAP_POINT_KIND_TRAP = 4;
  // "Tesouro" (MR-041): treasure with a value in gold pieces. Its description is
  // what is inside; players read it once the treasure is found.
  MAP_POINT_KIND_TREASURE = 5;
  // "Luz": a light source (MR-036). A player never receives it: they see its
  // light. It carries a LightSpec.
  MAP_POINT_KIND_LIGHT = 6;
}

// MapLayer is one of the five layers painted on a map's grid.
enum MapLayer {
  MAP_LAYER_UNSPECIFIED = 0;
  // "Terreno difícil": one bit a square (0 clear, 1 difficult).
  MAP_LAYER_DIFFICULT_TERRAIN = 1;
  // "Parede": one bit a square. Walls block movement, sight and light.
  MAP_LAYER_WALL = 2;
  // "Cobertura": two bits a square (0 none, 1 half, 2 three-quarters).
  MAP_LAYER_COVER = 3;
  // "Luz": two bits a square, a LightLevel (0 not painted, 1 to 3).
  MAP_LAYER_LIGHT = 4;
  // "Portas": four bits a square, a DoorState (0 none, 1 open, 2 closed, 3
  // locked, 4 barred, 5 secret; RN-26). A closed, locked or secret door blocks
  // movement, sight and light like a wall (a move opens a closed one); a barred
  // one blocks movement only. A player never receives the layer as painted:
  // see GetMapLayersResponse.doors.
  MAP_LAYER_DOORS = 5;
}

// DoorState is what a square of the doors layer holds (RN-26). The numbers are
// what MapLayer.MAP_LAYER_DOORS stores and what PaintMapCellsRequest.value
// carries for it.
enum DoorState {
  // No door: also what painting 0 does (it clears the square).
  DOOR_STATE_UNSPECIFIED = 0;
  // "Aberta": nothing blocks.
  DOOR_STATE_OPEN = 1;
  // "Fechada": blocks sight, light and cover like a wall; a creature that
  // moves into the square opens it.
  DOOR_STATE_CLOSED = 2;
  // "Trancada": closed and it does not open: a move that enters it stops
  // before. A player never receives this value: it reads as CLOSED until the
  // master opens it (the player learns it is locked by trying).
  DOOR_STATE_LOCKED = 3;
  // "Grade": blocks movement but not sight or light (a portcullis, bars).
  DOOR_STATE_BARRED = 4;
  // "Secreta": a wall to everyone who has not found it. A player never
  // receives it, nor a door there: their wall layer has a wall on the square.
  // Painting it CLOSED reveals it.
  DOOR_STATE_SECRET = 5;
}

// LightLevel is how lit a square is.
enum LightLevel {
  // As a map's base light: never returned. As a painted value: not painted
  // (clears the square, which then takes the map's base light).
  LIGHT_LEVEL_UNSPECIFIED = 0;
  // "Escuro".
  LIGHT_LEVEL_DARK = 1;
  // "Penumbra".
  LIGHT_LEVEL_DIM = 2;
  // "Claro".
  LIGHT_LEVEL_BRIGHT = 3;
}

// TrapState is where a trap is in play.
enum TrapState {
  TRAP_STATE_UNSPECIFIED = 0;
  // "Armada".
  TRAP_STATE_ARMED = 1;
  // "Disparada": everyone who sees the map sees a trap that was triggered, and
  // keeps seeing it after the master disarms it or arms it again.
  TRAP_STATE_TRIGGERED = 2;
  // "Desarmada": reads as such to whoever sees the trap.
  TRAP_STATE_DISARMED = 3;
}

// TrapRevealHow says how a character came to know a trap.
enum TrapRevealHow {
  TRAP_REVEAL_HOW_UNSPECIFIED = 0;
  // Their passive Perception caught it (slice 9.8).
  TRAP_REVEAL_HOW_NOTICED = 1;
  // They searched and found it (slice 9.8).
  TRAP_REVEAL_HOW_SEARCHED = 2;
  // The master revealed it to them (RevealTrap).
  TRAP_REVEAL_HOW_MASTER = 3;
}

// MapBlockedReason says why a map call was refused with `failed_precondition`.
enum MapBlockedReason {
  MAP_BLOCKED_REASON_UNSPECIFIED = 0;
  // The map has no grid: painting and the fog need one.
  MAP_BLOCKED_REASON_NO_GRID = 1;
  // A combat is running on the map: its grid and its image cannot change, since
  // that clears the painted layers the fight stands on.
  MAP_BLOCKED_REASON_COMBAT_RUNNING = 2;
  // The treasure was already turned into XP (slice 9.11): its value and its
  // found mark cannot change.
  MAP_BLOCKED_REASON_TREASURE_CONVERTED = 3;
  // The treasure was found: it cannot be deleted, nor its map, until the master
  // unmarks it (UnmarkTreasureFound), so a session's summary never loses it
  // silently.
  MAP_BLOCKED_REASON_TREASURE_FOUND = 4;
  // The map is no longer the generated dungeon's (DungeonService.RedrawDungeonMap):
  // its image is not the one the generator drew (the master put another image on the
  // map), its grid or the image's size changed, or its layers were cleared (a new image
  // or grid does that). A redraw would draw from layers that are not the dungeon's, or
  // change the size the layers are measured by, so it is refused.
  MAP_BLOCKED_REASON_IMAGE_CHANGED = 5;
}

// MapBlocked is the error detail of MapService's `failed_precondition`, so the
// app can say why.
message MapBlocked {
  // Why the call was refused.
  MapBlockedReason reason = 1;
}

// Map is a map as the caller may see it.
message Map {
  // Stable map ID (a UUID).
  string id = 1;
  // The campaign it belongs to (a UUID).
  string campaign_id = 2;
  // The map's name, 1 to 80 characters, one line. The players read it.
  string name = 3;
  // The image under the map.
  MapImage image = 4;
  // Whether the master revealed the map (SetMapRevealed). A player also
  // sees a hidden map while it is the session's current map; then this is
  // false and current is true.
  bool revealed = 5;
  // Whether it is the current map of the campaign's open game session
  // (PlayService.SetCurrentMap). False when no session is open.
  bool current = 6;
  // How many points the caller sees on the map: all of them for the
  // master, the revealed ones for a player (on a map with the fog of war on,
  // only those whose squares the player sees or remembers: the count is of the
  // points the player receives).
  int32 point_count = 7;
  // The maps with a submap point that leads here, as the caller may see
  // them ("Submapa de Mirathel e arredores"); empty for a map no point
  // leads to ("Mapa principal"). For a player, only the maps they see,
  // through revealed points. Oldest map first.
  repeated MapRef parent_maps = 8;
  // Goes up by one every time the name or the image change. Send it back
  // in UpdateMap.
  int32 revision = 9;
  google.protobuf.Timestamp created_at = 10;
  // The last change to the map itself: its name, image, revealed state or
  // grid. Points and tokens have their own times.
  google.protobuf.Timestamp updated_at = 11;
  // The battle grid (SetMapGrid): how many squares of 1.5 m (5 ft) fit
  // across the image's width, 4 to 200. 0 when the map has no grid. This is
  // the grid the rules use, calibration included (MR-025): drawn_columns *
  // square_factor. Every layer is sized by it.
  int32 grid_columns = 12;
  // How many rows of squares the grid has: drawn_rows * square_factor, 1 to
  // 400. 0 when the map has no grid.
  int32 grid_rows = 13;
  // Whether the fog of war is on (SetMapFog, or the table's rule "névoa nos mapas
  // novos", RN-24, which comes on when the map's first grid is set: a map created
  // while the rule is on has no fog until then, because the fog is made of the
  // grid's squares). Every viewer gets it: a player needs to know the map has
  // fog. False for a map without a grid.
  bool fog_enabled = 14;
  // The light of a square nobody lit and the master did not paint: DARK, DIM or
  // BRIGHT, DARK by default. Only the master gets it; UNSPECIFIED for a player.
  LightLevel base_light = 15;
  // "Visão do grupo": everyone sees what any player character sees. Every
  // viewer gets it. Off by default.
  bool group_vision = 16;
  // Goes up by one every time a painted layer changes or is cleared (a grid or
  // image change clears them). Compare it with the copy of the layers the app
  // holds. Apart from `revision` on purpose: painting never makes UpdateMap's
  // revision stale. The master's number also counts the painted light, which no
  // player reads; a player's counts the other layers only, and is 0 on a map
  // with the fog of war on (the layers are withheld from them).
  int32 layers_revision = 17;
  // True when the image was left out because the map has the fog of war on and
  // the caller is a player: image.id, image.url and image.thumbnail_url are then
  // empty (only the size stays, to lay the map out), and the app draws what the
  // server sends square by square instead (GetMapVision). Always false for the
  // master.
  bool image_withheld = 18;
  // The squares of the DRAWING across the image's width (MR-025, RN-25):
  // grid_columns / square_factor, what SetMapGrid's `columns` set. 4 to 200;
  // 0 when the map has no grid. The app draws the drawing's own lines on it.
  int32 drawn_columns = 30;
  // The squares of the drawing down the image's height: round(drawn_columns *
  // image height / image width), 1 to 400. grid_rows is this times
  // square_factor. 0 when the map has no grid.
  int32 drawn_rows = 31;
  // How many squares of 1.5 m each square of the drawing is worth: 1 (1.5 m,
  // the default), 2 (3 m), 3 (4.5 m)... up to 20. 1 when the map has no grid.
  int32 square_factor = 32;
  // Whether the map was made by DungeonService.CreateDungeonMap, so the master's
  // app may read its rooms (GetDungeonRooms) and offer "Redesenhar". Only the master
  // gets it; always false for a player.
  bool generated_dungeon = 33;
}

// MapImage is the image under a map: a gallery image. Any active member of
// the campaign may fetch it (see GalleryService); a player only learns its
// ID through a map they may see.
message MapImage {
  // The gallery image's ID (a UUID).
  string id = 1;
  // Where to fetch it: "/images/{id}".
  string url = 2;
  // Where to fetch its thumbnail (480 pixels on the longer side):
  // "/images/{id}/thumb".
  string thumbnail_url = 3;
  // Its size in pixels, so the app can lay the map out before the image
  // arrives.
  int32 width = 4;
  int32 height = 5;
  // The gallery image's name ("Imagem: Mapa de Mirathel"). Only the master
  // gets it: the gallery is the master's preparation. Empty for a player.
  string name = 6;
}

// MapRef names a map: enough to link to it.
message MapRef {
  // The map's ID (a UUID).
  string id = 1;
  // The map's name.
  string name = 2;
}

// MapPoint is a point of interest on a map.
message MapPoint {
  // Stable point ID (a UUID).
  string id = 1;
  // The map it is on (a UUID).
  string map_id = 2;
  MapPointKind kind = 3;
  // 1 to 80 characters, one line. The players read it once the point is
  // revealed.
  string name = 4;
  // What the players read when they open the point: 0 to 2,000 characters,
  // with line breaks.
  string description = 5;
  // The point's position, in basis points of the image's width and
  // height (0 to 10000).
  int32 x_bp = 6;
  int32 y_bp = 7;
  // Where a SUBMAP point leads: the app offers "Abrir <name>"; or, for a
  // BATTLE point, the map where the fight happens. Unset when the point has
  // no target (its map was deleted, or the master has not chosen one),
  // and, for a player, when the target map is hidden from them: then the
  // point only shows its description.
  MapRef target_map = 8;
  // Whether the master revealed the point. Always true for a player, who
  // never receives a hidden point.
  bool revealed = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  // The checks of a SCENE point (MR-015), in the order the master put them;
  // empty for any other kind. The master gets each one with its DC; a player
  // gets the DC only when the master turned `show_dc` on for the scene
  // (RN-20), and only for a point they see (RN-10).
  repeated SceneAction scene_actions = 12;
  // "Ganchos e anotações" (MR-029): the master's private Markdown text on a
  // SCENE point, 0 to 4,000 characters. Only the master gets it: a player
  // always gets it empty (RN-20).
  string hooks = 13;
  // The clues of a SCENE point (MR-029), in the order the master put them,
  // each with who has it. Only the master gets them: a player always gets
  // none, not even the revealed ones (those are in their notes).
  repeated SceneClue clues = 14;
  // "Mostrar a CD aos jogadores" (MR-015, question 52): whether the scene
  // shows its actions' DCs to the players, and whether a player sees if
  // their own rolls passed. Only a SCENE point has it; false for any other
  // kind and by default. The master changes it with UpdateMapPoint (or
  // CreateMapPoint) and always sees the DCs, on or off. Everyone gets this
  // flag: a player's copy is true exactly when their `scene_actions` carry
  // DCs.
  bool show_dc = 15;
  // The trap's data (a TRAP point). The master gets it whole. A player gets only
  // area_size and state: never the preset, the DCs, the trigger or the effect
  // (RN-10).
  TrapSpec trap = 16;
  // A TREASURE's value in gold pieces, 0 to 1,000,000. The master always gets
  // it; a player only once the treasure is found.
  int32 treasure_value_po = 17;
  // A LIGHT's source (a LIGHT point). Only the master gets it: a player never
  // receives a light point.
  LightSpec light = 18;
  // When a TREASURE was marked found; unset while it is not. Everyone who sees
  // the treasure gets it.
  google.protobuf.Timestamp treasure_found_at = 19;
  // Who found a found TREASURE, in the order the characters are listed
  // elsewhere: players' characters first, oldest first (not the order the master
  // picked them). A found treasure's finders go to everyone who sees it
  // ("Encontrado por Brisa").
  repeated TreasureFinder treasure_found_by = 20;
  // Whether an XP award turned a found TREASURE into XP (slice 9.11). Only the
  // master gets it.
  bool treasure_converted = 21;
  // Who knows a TRAP, besides the master, as the master sees it: the characters
  // it was revealed to, oldest first. Empty for a player, and for any other kind.
  repeated TrapReveal trap_revealed_to = 22;
  // True when the map has the fog of war on, the caller is a player and none of
  // the point's squares is seen now: it is in the remembered part, which the app
  // draws darkened. Always false for the master and on a map without fog.
  bool remembered = 23;
  // Set on a generated dungeon's stair (DungeonService.CreateDungeonMap): which way it
  // goes. A stair is a submap point with no target, and the app draws it as a stair, with
  // its arrow and the label "Escada para cima" or "Escada para baixo", never as a submap.
  // It goes to whoever receives the point, so a player gets it only for a revealed point
  // on a square they see. UNSPECIFIED for every other point.
  StairDirection stairs = 24;
}

// StairDirection is which way a generated dungeon's stair goes.
enum StairDirection {
  STAIR_DIRECTION_UNSPECIFIED = 0;
  STAIR_DIRECTION_UP = 1;
  STAIR_DIRECTION_DOWN = 2;
}

// TrapSpec is what a TRAP point is: how to notice and find it, where and how it
// fires, what it does, and where it is in play.
message TrapSpec {
  // The key of the preset it was made from ("trap:simple-pit"), or empty for a
  // custom trap. Informational: the numbers below are the trap's own copy.
  string preset_key = 1;
  // The DC to notice it (passive or active Perception), 1 to 30, or 0 when only
  // a search finds it (the SRD's poison needle).
  int32 notice_dc = 2;
  // The DC to find it by searching (Investigation), 1 to 30. Required.
  int32 find_dc = 3;
  // The side, in squares, of the block around the point's square that fires the
  // trap: 1 (the square alone) to 4. Required.
  int32 area_size = 4;
  // What fires it. Required.
  meurpg.rules.v1.TrapTrigger trigger = 5;
  // What it does, in parts. Required; an empty effect is "só descrição".
  meurpg.rules.v1.TrapEffect effect = 6;
  // Where it is in play. Unspecified means ARMED on a new trap and "keep the
  // current state" on an update, so an edit that does not mention it never
  // re-arms a trap. The master may change it (UpdateMapPoint); the live game
  // changes it too (slice 9.8).
  TrapState state = 7;
}

// LightSpec is what a LIGHT point is.
message LightSpec {
  // The key of the preset it was made from ("light:torch"), or empty for a
  // custom light. A key sent with both radii at 0 takes the preset's radii (a
  // new light is made by sending only the key); a key sent with radii keeps the
  // master's own copy of them, and the key then only says where it started.
  // An unknown key is invalid_argument.
  string preset_key = 1;
  // The radius of its bright light, in feet: 0 to 120, a multiple of 5.
  int32 bright_ft = 2;
  // How much further its dim light goes, in feet: 0 to 120, a multiple of 5.
  // Both radii may not be 0, unless a preset key supplies them.
  int32 dim_ft = 3;
}

// TreasureFinder is a character who found a treasure.
message TreasureFinder {
  // The character (a UUID).
  string character_id = 1;
  // The character's name; empty when the character no longer lives.
  string character_name = 2;
}

// TrapReveal is a character the master revealed a trap to, or who found it.
message TrapReveal {
  // The character (a UUID).
  string character_id = 1;
  // The character's name; empty when the character no longer lives.
  string character_name = 2;
  // How they came to know it.
  TrapRevealHow how = 3;
  // When they came to know it.
  google.protobuf.Timestamp at = 4;
}

// SceneClue is a clue the master prepared on an RP scene (MR-029), as the
// master sees it. A player never receives this message.
message SceneClue {
  // Stable clue ID (a UUID).
  string id = 1;
  // The clue's text, 1 to 500 characters, with no line breaks.
  string text = 2;
  // The players it was revealed to, oldest first; empty for "Ninguém ainda".
  // Compare with the campaign's player characters for "Todos".
  repeated ClueRecipient revealed_to = 3;
}

// ClueRecipient is a player the master revealed a clue to.
message ClueRecipient {
  // The character the master picked (a UUID).
  string character_id = 1;
  // The character's name; empty when the character no longer lives.
  string character_name = 2;
  // When the clue was revealed to them.
  google.protobuf.Timestamp revealed_at = 3;
}

// SceneAction is one check of an RP scene (MR-015): a skill check, an
// ability check or a saving throw. The player's own bonus is not here: it
// comes with the open scene (PlayService.GetOpenScene), worked out from
// their sheet.
message SceneAction {
  // Stable action ID (a UUID).
  string id = 1;
  // What is rolled: "skill:investigation", "ability:str" or "save:wis".
  string key = 2;
  // What the master called it ("Convencer o guarda"), 0 to 60 characters;
  // empty for none, and then the app shows check_name.
  string name = 3;
  // The check's name in Portuguese: "Investigação", "Teste de Força",
  // "Teste de resistência de Sabedoria".
  string check_name = 4;
  // The difficulty class, 1 to 30; 0 means none. The master always receives
  // it; a player only when the scene's `show_dc` is on (RN-20), and then
  // 0 still means none.
  int32 dc = 5;
  // How many times each player's character may roll this action while the
  // scene stays open (MR-015, question 55): 1 to 5, and 0 means unlimited (the
  // server stops at 200 rolls per character in one opening).
  // New actions have 1. Closing the scene and opening it again starts every
  // count afresh. Every viewer gets it; the open scene
  // (PlayService.GetOpenScene) also says how many a player has left.
  int32 max_attempts = 6;
}

// MapToken is a character's token on a map.
message MapToken {
  // The map it is on (a UUID).
  string map_id = 1;
  // The character (a UUID). A player sees the ID of every character whose
  // token they see; it opens nothing else (CharacterService still answers
  // `not_found` for a character that is not theirs).
  string character_id = 2;
  // The character's name, for the token's initial and its label.
  string name = 3;
  // What the character is: a player's character or an NPC kind.
  meurpg.characters.v1.CharacterKind kind = 4;
  // Whether the character is the caller's own: the app draws "(você)".
  bool mine = 5;
  // The token's position, in basis points of the image's width and
  // height (0 to 10000).
  int32 x_bp = 6;
  int32 y_bp = 7;
  // Whether the master hid the token. Always false for a player, who never
  // receives a hidden token.
  bool hidden = 8;
  // When it was placed, moved, hidden or shown last.
  google.protobuf.Timestamp updated_at = 9;
  // The light the character carries: a light preset's key ("light:torch"), or
  // empty for none. Only the master and the character's own player get it
  // (SetCarriedLight); the other players learn of it from what they see.
  string carried_light = 10;
  // The creature this token is, for the token of a character's creature (a
  // familiar, a summoned animal, a gift of the master; MR-037, Etapa 9): the ID
  // CharacterService.ListCharacterCreatures lists (a UUID). Empty for a
  // character's own token. Then `character_id` is the creature's owner (a
  // player's character, so the party knows whose it is), `name` is the creature's
  // name, `kind` is unspecified, `hidden` is always false and `carried_light`
  // empty. A creature's token is a party token: on a map with the fog of war on,
  // no player is kept from it, as from a player's character's.
  string creature_id = 15;
}

// ListMapsRequest names a campaign.
message ListMapsRequest {
  string campaign_id = 1;
}

// ListMapsResponse lists the maps the caller may see, oldest first.
message ListMapsResponse {
  repeated Map maps = 1;
}

// GetMapRequest names a map of a campaign.
message GetMapRequest {
  string campaign_id = 1;
  string map_id = 2;
  // "Ver como": a living player character of the campaign (a UUID). The master
  // then gets what that character's player would get on the map. A player may
  // not send it (`permission_denied`). Empty for the caller's own view.
  string as_character_id = 3;
}

// GetMapResponse is a map with what the caller may see on it.
message GetMapResponse {
  Map map = 1;
  // The points, oldest first: every point for the master, only the
  // revealed ones for a player.
  repeated MapPoint points = 2;
  // The tokens of living characters: players' characters first, then
  // NPCs, each group oldest first. Every token for the master, only the
  // visible ones for a player. A character who died stays on the map, but
  // its token is not listed.
  repeated MapToken tokens = 3;
}

// CreateMapRequest carries the new map.
message CreateMapRequest {
  string campaign_id = 1;
  // 1 to 80 characters, one line.
  string name = 2;
  // An image of the campaign's gallery (a UUID).
  string image_id = 3;
  // Optional. 1 to 64 characters, chosen once by the app for this action: a retry with the
  // same key and the same request returns what the first call made instead of making another.
  // The key is unique in the campaign; the same key with another request is `invalid_argument`.
  // Empty: the call is not deduplicated.
  string idempotency_key = 4;
}

// CreateMapResponse returns the new, hidden map.
message CreateMapResponse {
  Map map = 1;
}

// UpdateMapRequest carries the map's new name, image, or both. At least
// one must be set.
message UpdateMapRequest {
  string campaign_id = 1;
  string map_id = 2;
  // The revision the client last read (Map.revision).
  int32 revision = 3;
  // The new name: 1 to 80 characters, one line.
  optional string name = 4;
  // The new image: an image of the campaign's gallery (a UUID).
  optional string image_id = 5;
}

// UpdateMapResponse returns the map as saved.
message UpdateMapResponse {
  // The map, with the new revision.
  Map map = 1;
}

// DeleteMapRequest names the map to delete.
message DeleteMapRequest {
  string campaign_id = 1;
  string map_id = 2;
}

// DeleteMapResponse is empty: the map is gone.
message DeleteMapResponse {}

// SetMapRevealedRequest says whether the players may see a map.
message SetMapRevealedRequest {
  string campaign_id = 1;
  string map_id = 2;
  // True reveals the map; false hides it.
  bool revealed = 3;
}

// SetMapRevealedResponse returns the map as it is now.
message SetMapRevealedResponse {
  Map map = 1;
}

// SetMapGridRequest sets a map's battle grid.
message SetMapGridRequest {
  string campaign_id = 1;
  string map_id = 2;
  // How many squares of the DRAWING fit across the image's width: 4 to 200, or
  // 0 to clear the grid. With square_factor 1 (or unset) they are squares of
  // 1.5 m, as before the calibration existed.
  int32 columns = 3;
  // How many squares of 1.5 m each square of the drawing is worth (MR-025,
  // RN-25): 1 (1.5 m), 2 (3 m), 3 (4.5 m)... up to 20. 0 reads as 1, so a
  // caller that never heard of the calibration keeps its behaviour. The rules'
  // grid, columns x square_factor across, must stay within 200 x 400 squares.
  int32 square_factor = 4;
}

// SetMapGridResponse returns the map as it is now.
message SetMapGridResponse {
  // The map, with grid_columns, grid_rows, drawn_columns and square_factor.
  Map map = 1;
}

// CreateMapPointRequest carries the new point.
message CreateMapPointRequest {
  string campaign_id = 1;
  string map_id = 2;
  // Required.
  MapPointKind kind = 3;
  // 1 to 80 characters, one line.
  string name = 4;
  // 0 to 2,000 characters, with line breaks.
  string description = 5;
  // The position, 0 to 10000 each.
  int32 x_bp = 6;
  int32 y_bp = 7;
  // Only for a SUBMAP or a BATTLE point, and optional there: another map of
  // the campaign (a UUID). Empty for none.
  string target_map_id = 8;
  // Only for a SCENE point: the master's hooks, 0 to 4,000 characters, with
  // line breaks. Any other kind with hooks is `invalid_argument`.
  string hooks = 9;
  // Only for a SCENE point: true shows the scene's DCs to the players
  // (MapPoint.show_dc). Any other kind with it true is `invalid_argument`.
  bool show_dc = 10;
  // Required for a TRAP point, and `invalid_argument` on any other kind. Set
  // the preset's key to start from a preset: the numbers still come from here.
  TrapSpec trap = 11;
  // A TREASURE's value in gold pieces: 0 to 1,000,000. Any other kind with it
  // set is `invalid_argument`.
  optional int32 treasure_value_po = 12;
  // Required for a LIGHT point, and `invalid_argument` on any other kind. When
  // preset_key is set and both radii are 0, the radii are the preset's.
  LightSpec light = 13;
  // Optional. 1 to 64 characters, chosen once by the app for this action: a retry with the
  // same key and the same request returns what the first call made instead of making another.
  // The key is unique in the campaign; the same key with another request is `invalid_argument`.
  // Empty: the call is not deduplicated.
  string idempotency_key = 14;
}

// CreateMapPointResponse returns the new, hidden point.
message CreateMapPointResponse {
  MapPoint point = 1;
}

// UpdateMapPointRequest carries the fields to change. Each field set
// replaces the current value; unset fields stay as they are. At least one
// must be set.
message UpdateMapPointRequest {
  string campaign_id = 1;
  string map_id = 2;
  string point_id = 3;
  // The new kind; not UNSPECIFIED. Anything but SUBMAP or BATTLE removes
  // the target.
  optional MapPointKind kind = 4;
  // 1 to 80 characters, one line.
  optional string name = 5;
  // 0 to 2,000 characters, with line breaks.
  optional string description = 6;
  // The new position, 0 to 10000 each. Moving a point sets both.
  optional int32 x_bp = 7;
  optional int32 y_bp = 8;
  // A SUBMAP or BATTLE point's new target: another map of the campaign (a
  // UUID), or empty to remove it.
  optional string target_map_id = 9;
  // Reveals (true) or hides (false) the point, as SetMapPointRevealed
  // does, so the editor saves everything in one call.
  optional bool revealed = 10;
  // The new hooks of a SCENE point (MR-029), 0 to 4,000 characters; empty
  // clears them. The point must be a SCENE point after the change.
  optional string hooks = 11;
  // Turns "Mostrar a CD aos jogadores" on or off (MapPoint.show_dc). The point
  // must be a SCENE point after the change to turn it on; a point that stops
  // being a scene loses it. When the point is the open scene, every stream
  // gets `scene_changed`: the players read the scene again with or without the
  // DCs.
  optional bool show_dc = 12;
  // Replaces the whole trap (every field; an unspecified state keeps the
  // current one). The point must be a
  // TRAP after the change; a point that becomes a TRAP needs it.
  optional TrapSpec trap = 13;
  // A TREASURE's new value, 0 to 1,000,000. Refused with MapBlocked
  // TREASURE_CONVERTED once the treasure was turned into XP. The point must be
  // a TREASURE after the change; one that becomes a TREASURE starts with 0 when
  // this is unset.
  optional int32 treasure_value_po = 14;
  // Replaces the whole light. The point must be a LIGHT after the change; a
  // point that becomes a LIGHT needs it.
  optional LightSpec light = 15;
}

// UpdateMapPointResponse returns the point as saved.
message UpdateMapPointResponse {
  MapPoint point = 1;
}

// DeleteMapPointRequest names the point to delete.
message DeleteMapPointRequest {
  string campaign_id = 1;
  string map_id = 2;
  string point_id = 3;
}

// DeleteMapPointResponse is empty: the point is gone.
message DeleteMapPointResponse {}

// SetMapPointRevealedRequest says whether the players may see a point.
message SetMapPointRevealedRequest {
  string campaign_id = 1;
  string map_id = 2;
  string point_id = 3;
  // True reveals the point; false hides it.
  bool revealed = 4;
}

// SetMapPointRevealedResponse returns the point as it is now.
message SetMapPointRevealedResponse {
  MapPoint point = 1;
}

// PlaceMapTokenRequest puts a character's token at a position.
message PlaceMapTokenRequest {
  string campaign_id = 1;
  string map_id = 2;
  // A living character of the campaign (a UUID). Leave it empty to place a
  // creature's token with `creature_id`.
  string character_id = 3;
  // The position, 0 to 10000 each.
  int32 x_bp = 4;
  int32 y_bp = 5;
  // A creature of a character of the campaign that is still with its owner (a
  // UUID; MR-037): its token is placed, or moved if it is already on the map.
  // Exactly one of `character_id` and `creature_id` is set. A creature's token
  // is a party token and is never hidden (SetMapTokenHidden does not take one).
  string creature_id = 6;
}

// PlaceMapTokenResponse returns the token as it is now.
message PlaceMapTokenResponse {
  MapToken token = 1;
}

// SetMapTokenHiddenRequest says whether the players may see a token.
message SetMapTokenHiddenRequest {
  string campaign_id = 1;
  string map_id = 2;
  string character_id = 3;
  // True hides the token; false shows it.
  bool hidden = 4;
}

// SetMapTokenHiddenResponse returns the token as it is now.
message SetMapTokenHiddenResponse {
  MapToken token = 1;
}

// RemoveMapTokenRequest names the token to take off the map.
message RemoveMapTokenRequest {
  string campaign_id = 1;
  string map_id = 2;
  // The character whose token to take off, or empty for a creature's.
  string character_id = 3;
  // The creature whose token to take off (a UUID). Exactly one of
  // `character_id` and `creature_id` is set.
  string creature_id = 4;
}

// RemoveMapTokenResponse is empty: the token is gone.
message RemoveMapTokenResponse {}

// AddSceneActionRequest carries the new action.
message AddSceneActionRequest {
  string campaign_id = 1;
  string map_id = 2;
  string point_id = 3;
  // Required: "skill:investigation", "ability:str" or "save:wis".
  string key = 4;
  // 0 to 60 characters, one line; empty for none.
  string name = 5;
  // 1 to 30; 0 for none.
  int32 dc = 6;
  // How many times each player's character may roll it while the scene is
  // open: 1 to 5, or 0 for unlimited. Unset means 1.
  optional int32 max_attempts = 7;
  // Optional. 1 to 64 characters, chosen once by the app for this action: a retry with the
  // same key and the same request returns what the first call made instead of making another.
  // The key is unique in the campaign; the same key with another request is `invalid_argument`.
  // Empty: the call is not deduplicated.
  string idempotency_key = 8;
}

// AddSceneActionResponse returns the point's actions as they are now.
message AddSceneActionResponse {
  // The new action.
  SceneAction action = 1;
  // Every action of the point, in order, with the new one last.
  repeated SceneAction actions = 2;
}

// UpdateSceneActionRequest carries the fields to change. Each field set
// replaces the current value; unset fields stay as they are. At least one
// must be set.
message UpdateSceneActionRequest {
  string campaign_id = 1;
  string map_id = 2;
  string point_id = 3;
  string action_id = 4;
  // The new check, as AddSceneActionRequest's key.
  optional string key = 5;
  // The new name, 0 to 60 characters; empty removes it.
  optional string name = 6;
  // The new DC, 1 to 30; 0 removes it.
  optional int32 dc = 7;
  // The new limit of attempts per player, 1 to 5, or 0 for unlimited. Lowering
  // it below what someone already used leaves them without attempts in the
  // open scene; nothing is erased, and a raise gives attempts back.
  optional int32 max_attempts = 8;
}

// UpdateSceneActionResponse returns the point's actions as they are now.
message UpdateSceneActionResponse {
  // The changed action.
  SceneAction action = 1;
  // Every action of the point, in order.
  repeated SceneAction actions = 2;
}

// SceneActionDirection says which way MoveSceneAction moves an action.
enum SceneActionDirection {
  SCENE_ACTION_DIRECTION_UNSPECIFIED = 0;
  // Toward the start of the list.
