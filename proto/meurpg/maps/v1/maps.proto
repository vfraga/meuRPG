// MapSquare is a square of a map's grid: col counts from the left edge and row
// from the top, both from 0.
message MapSquare {
  // The column, 0 to grid_columns - 1.
  int32 col = 1;
  // The row, 0 to grid_rows - 1.
  int32 row = 2;
}

// PaintMapCellsRequest paints a batch of squares of one layer.
message PaintMapCellsRequest {
  string campaign_id = 1;
  string map_id = 2;
  // Required: which layer.
  MapLayer layer = 3;
  // The value to paint: for DIFFICULT_TERRAIN and WALL, 0 clears and 1 sets; for
  // COVER, 0 none, 1 half, 2 three-quarters; for LIGHT, a LightLevel (0 clears,
  // 1 dark, 2 dim, 3 bright); for DOORS, a DoorState (0 clears, 1 to 5). The
  // master toggles a door in play the same way: painting a square OPEN or CLOSED.
  int32 value = 4;
  // The squares, 1 to 400, each inside the map's grid. A repeated square is
  // painted once.
  repeated MapSquare squares = 5;
}

// PaintMapCellsResponse says what the painting did.
message PaintMapCellsResponse {
  // The map's layers_revision after the call; unchanged when no square changed.
  int32 layers_revision = 1;
  // How many squares changed value. 0 for a batch that repeated what was there.
  int32 changed = 2;
}

// GetMapLayersRequest names a map of a campaign.
message GetMapLayersRequest {
  string campaign_id = 1;
  string map_id = 2;
  // "Ver como", as in GetMapRequest: the master reads the layers as that
  // character's player would. A player may not send it.
  string as_character_id = 3;
}

// GetMapLayersResponse is the layers the caller may read, packed as package
// rules/grid describes (the web decodes the same layout). Squares are numbered
// row-major, n = row * grid_columns + col, from the top-left corner.
// A one-bit layer (walls, terrain) is ceil(n / 8) bytes, square n being bit n % 8
// (least significant first) of byte n / 8. A two-bit layer (cover, light) is
// ceil(n / 4) bytes, square n being bits 2 * (n % 4) and 2 * (n % 4) + 1 of byte
// n / 4. A layer with nothing painted is empty (zero bytes), not a run of zeros.
message GetMapLayersResponse {
  // The map's grid, as in Map; 0 and 0 for a map without a grid (every layer is
  // then empty).
  int32 grid_columns = 1;
  int32 grid_rows = 2;
  // Map.layers_revision at the time of the read. For a player on a map with the
  // fog of war on it is a number of what they receive (it changes only when the
  // filtered layers change, never when the master paints something they do not
  // see), not the map's counter.
  int32 layers_revision = 3;
  // The difficult terrain, one bit a square.
  bytes difficult_terrain = 4;
  // The walls, one bit a square.
  bytes wall = 5;
  // The cover (0 none, 1 half, 2 three-quarters), two bits a square.
  bytes cover = 6;
  // The painted light (a LightLevel), two bits a square. Only the master gets
  // it: always empty for a player.
  bytes light = 7;
  // True when the layers are a filtered view, because the map has the fog of war
  // on and the caller is a player (or the master "Ver como"): the squares they
  // neither see now nor remember are left out (a wall next to a square seen now
  // is kept), and the empty layers mean "nothing you know", not "nothing
  // painted". The light layer is never sent.
  bool fog_withheld = 8;
  // The doors (a DoorState), four bits a square: square n is the low nibble of
  // byte n/2 when n is even and the high nibble when odd (row-major, n = row ×
  // grid_columns + col); ceil(squares/2) bytes, empty when no door is painted.
  // The master gets it as painted. A player gets what they know of it: LOCKED
  // reads as CLOSED (they find out by trying) and a SECRET door is left out
  // (the wall layer has a wall there instead), and on a map with the fog of war
  // only the squares they see now or remember. Nothing a player receives says a
  // door is locked or secret before they try it or the master reveals it.
  bytes doors = 9;
}

// SetMapFogRequest carries the fog settings to change. Each field set replaces
// the current value; at least one must be set.
message SetMapFogRequest {
  string campaign_id = 1;
  string map_id = 2;
  // Turns the fog of war on or off. On needs a grid.
  optional bool fog_enabled = 3;
  // The base light: DARK, DIM or BRIGHT (UNSPECIFIED is `invalid_argument`).
  optional LightLevel base_light = 4;
  // Turns "Visão do grupo" on or off.
  optional bool group_vision = 5;
}

// SetMapFogResponse returns the map as it is now.
message SetMapFogResponse {
  Map map = 1;
}

// RevealTrapRequest says who learns of a trap.
message RevealTrapRequest {
  string campaign_id = 1;
  string map_id = 2;
  string point_id = 3;
  // The player characters (UUIDs) whose players get the trap: 1 to 50. Empty
  // when all is true.
  repeated string character_ids = 4;
  // Reveal it to everyone (it sets the point's revealed state). Not together
  // with character_ids.
  bool all = 5;
}

// RevealTrapResponse returns the point as the master sees it.
message RevealTrapResponse {
  MapPoint point = 1;
}

// GetTrapNoticersRequest names a trap.
message GetTrapNoticersRequest {
  string campaign_id = 1;
  string map_id = 2;
  string point_id = 3;
}

// GetTrapNoticersResponse says who would notice the trap by passing near it.
message GetTrapNoticersResponse {
  // Every living player character of the campaign that has a player, oldest
  // first.
  repeated TrapNoticer noticers = 1;
  // The trap's DC to notice it (passive Perception), 0 when only a search finds it.
  int32 notice_dc = 2;
}

// TrapNoticer is one player character on the trap's card.
message TrapNoticer {
  string character_id = 1;
  string character_name = 2;
  // Its passive Perception from the derived sheet.
  int32 passive_perception = 3;
  // The light penalty at the trap's squares as the character sees them now: 0 or
  // -5. 0 as well when the character does not see them.
  int32 light_penalty = 4;
  // The character stands on this map (a token, or a combatant while a combat runs
  // on it).
  bool on_map = 5;
  // It is within 3 m of the trap's area.
  bool in_range = 6;
  // It sees at least one square of the trap's area now.
  bool sees = 7;
  // It would notice the trap standing there: in range, seeing it, and
  // passive_perception + light_penalty reaches the DC. False for a trap with no
  // DC to notice.
  bool would_notice = 8;
  // It already knows the trap (noticed, found, revealed by the master, or the trap
  // is public).
  bool knows = 9;
  // Its passive_perception plus light_penalty reaches the DC to notice (false for
  // a trap with no such DC), whether or not the character is on the map, within 3 m
  // or sees the squares. The screen says "Se chegar a 3 m: nota" for a character out
  // of range from it; the browser never compares the numbers itself.
  bool passes_dc = 10;
}

// DisarmTrapRequest names the trap.
message DisarmTrapRequest {
  string campaign_id = 1;
  string map_id = 2;
  string point_id = 3;
}

// DisarmTrapResponse returns the point as the master sees it.
message DisarmTrapResponse {
  MapPoint point = 1;
}

