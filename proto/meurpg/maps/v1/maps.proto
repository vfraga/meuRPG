// MoveSceneActionResponse returns the point's actions in their new order.
message MoveSceneActionResponse {
  repeated SceneAction actions = 1;
}

// RemoveSceneActionRequest names the action to remove.
message RemoveSceneActionRequest {
  string campaign_id = 1;
  string map_id = 2;
  string point_id = 3;
  string action_id = 4;
}

// RemoveSceneActionResponse returns the point's remaining actions.
message RemoveSceneActionResponse {
  repeated SceneAction actions = 1;
}

// AddSceneClueRequest carries the new clue.
message AddSceneClueRequest {
  string campaign_id = 1;
  string map_id = 2;
  string point_id = 3;
  // Required: 1 to 500 characters, one line.
  string text = 4;
  // Optional. 1 to 64 characters, chosen once by the app for this action: a retry with the
  // same key and the same request returns what the first call made instead of making another.
  // The key is unique in the campaign; the same key with another request is `invalid_argument`.
  // Empty: the call is not deduplicated.
  string idempotency_key = 5;
}

// AddSceneClueResponse returns the point's clues as they are now.
