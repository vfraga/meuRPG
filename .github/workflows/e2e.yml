# Acceptance tests: Playwright against the local stack (deploy/local/compose.yaml),
# which signs in through devidp, a development-only OpenID Connect provider,
# instead of Google. See CONTRIBUTING.md ("Testes ponta a ponta").
#
# Every third-party action is pinned by full commit SHA (not by tag), because
# a moving tag can be repointed by whoever controls the action's repo. The
# `# vX.Y.Z` comment is for humans; GitHub Actions trusts the SHA.
name: e2e

on:
  # No paths filter: the `plan` job selects, so a train (refactor/train-*) always runs the full gate.
  pull_request:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "proto/**"
      - "web/**"
      - "e2e/**"
      - "deploy/local/**"
      - ".dockerignore"
      - "Makefile"
      - ".github/workflows/e2e.yml"
      - ".github/scripts/e2e-no-retries.sh"
      - ".github/scripts/e2e-shards.mjs"
      - ".github/scripts/e2e-list-reporter.mjs"
      - ".github/scripts/flake.mjs"
      - ".github/actions/build-e2e-images/**"
      - ".github/actions/start-e2e-stack/**"
      - ".node-version"
      - "!**/*.md"
  # The nightly run and a manual run test everything, with no path filter
  # (03:00 in São Paulo).
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Only a pull request's runs cancel each other (a newer push makes the older
# run pointless). A push to main always runs to the end, so every merge
# leaves a complete signal instead of cancelling the previous merge's run.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: read the repo, nothing else. Uploading an artifact needs
# no extra permission.
permissions:
  contents: read

env:
  # How many runners the plain tests and the @a11y tests are split across: the `plan` job's matrix and the lint job's
  # check of the lists both read them.
  PLAIN_SHARDS: 3
  A11Y_SHARDS: 6
  # The plain shard that migrates from an empty database (the others restore the backup).
  FRESH_SHARD: 1

jobs:
  # Chooses what runs (docs/ci.md, "What runs when"). `run`: the workflow at all, for a change to what it judges. The
  # plain shards then always run; the slow accessibility (@a11y) shards run on a train (refactor/train-*), main, the
  # nightly and manual runs, and on a pull request only when it touches what they scan: the web app, the tests or the
  # stack. Other pull requests get the fast signal. On a fork only pull requests and manual runs run.
  plan:
    name: plan (which shards run)
    if: ${{ github.repository == 'PuraFome/meuRPG' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      # Only a pull request that is not a train is judged by its files, so only it needs the history and the diff.
      # Main, the schedule, a manual run and a train (a branch of this repository) are answered here, without a checkout.
      DIFF: ${{ github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'refactor/train-') && github.event.pull_request.head.repo.full_name == github.repository) }}
    outputs:
      run: ${{ steps.all.outputs.run || steps.run.outputs.selected }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Everything is selected
        id: all
        if: env.DIFF != 'true'
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "a11y=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: env.DIFF == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the diff against the base branch needs it.
          fetch-depth: 0

      - name: Is this workflow selected
        id: run
        if: env.DIFF == 'true'
        uses: ./.github/actions/select
        with:
          pattern: '^(backend/|proto/|web/|e2e/|deploy/local/|\.dockerignore$|Makefile$|\.github/workflows/e2e\.yml$|\.github/scripts/(e2e-no-retries\.sh|e2e-shards\.mjs|e2e-list-reporter\.mjs|flake\.mjs)$|\.github/actions/(build-e2e-images|start-e2e-stack)/|\.node-version$)'
          ignore-md: "true"

      - name: Are the accessibility shards selected
        id: a11y
        if: env.DIFF == 'true'
        uses: ./.github/actions/select
        with:
          pattern: '^(web/|e2e/|deploy/local/|\.github/workflows/e2e\.yml$|\.github/scripts/e2e-(shards|list-reporter)\.mjs$|\.node-version$)'

      - name: Choose the shards
        id: plan
        env:
          A11Y: ${{ steps.all.outputs.a11y || steps.a11y.outputs.selected }}
        run: |
          matrix=$(jq -nc --argjson a11y "$A11Y" --argjson plain "$PLAIN_SHARDS" --argjson slow "$A11Y_SHARDS" --argjson freshShard "$FRESH_SHARD" '
            [range(1; $plain + 1) | {part: "\(.)/\($plain)", grep: "--grep-invert @a11y", shard: "\(.)/\($plain)", fresh: (. == $freshShard), fresh_shard: $freshShard}]
            + (if $a11y then [range(1; $slow + 1) | {part: "a11y \(.)/\($slow)", grep: "--grep @a11y", shard: "\(.)/\($slow)"}] else [] end)
            | {include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  # Lints the Playwright tests (a missing `await` is the classic flake) and
  # type-checks them, without Docker, so a mistake fails in about a minute
  # instead of after the images and shards. ESLint is a ratchet:
  # e2e/eslint-suppressions.json lists the old violations, so only a NEW one
  # fails. It has its own small package (e2e/lint) because ESLint's TypeScript
  # support needs TypeScript 5.x, while the tests type-check with TypeScript 7.
  lint:
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' }}
    name: lint and typecheck
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "npm"
          cache-dependency-path: |
            e2e/package-lock.json
            e2e/lint/package-lock.json

      - name: Install e2e dependencies (no install scripts)
        working-directory: e2e
        run: npm ci --ignore-scripts

      - name: Install lint dependencies (no install scripts)
        working-directory: e2e
        run: npm run lint:install

      - name: Typecheck
        working-directory: e2e
        run: npm run typecheck

      - name: Lint
        working-directory: e2e
        run: npm run lint

      - name: Test the lint rule (bad fixture fails, fixed one passes)
        working-directory: e2e
        run: npm run lint:test

      - name: Check that the tests are not retried
        # A retry hides a flaky test: the config keeps `retries: 0` (docs/ci.md, "Flaky tests").
        run: .github/scripts/e2e-no-retries.sh

      - name: Check that the shard lists hold every test once
        # The counts are the plan job's (the workflow's env). Each list is read back through Playwright's own --test-list.
        working-directory: e2e
        run: |
          node ../.github/scripts/e2e-shards.mjs check "$PLAIN_SHARDS" --fresh-shard="$FRESH_SHARD" --grep-invert @a11y
          node ../.github/scripts/e2e-shards.mjs check "$A11Y_SHARDS" --grep @a11y

  # Builds the two images once (the production image and devidp) and hands them
  # to the shards, which used to build them four times over (124 to 162 s each,
  # 07/10/2026). The layers are cached across runs in the GitHub Actions cache,
  # so a change that only touches Go or web code reuses the dependency layers.
  # It also fails fast on a broken Dockerfile, before any shard starts, and it
  # is the Dockerfile smoke test the backend workflow's go job used to do.
  image:
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' }}
    name: images (production image and devidp)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Docker Hub mirror, VERSION=dev, the tars straight to disk and the layer cache: all in the composite action,
      # shared with the workflows that test a ref of their own (flake-check, repeat-changed, nightly-hunt).
      - name: Build and upload the images
        uses: ./.github/actions/build-e2e-images
        with:
          artifact: e2e-images
          cache-write: "true"

  # Migrates an empty CockroachDB once and backs it up (BACKUP to a folder, uploaded as an artifact), so the shards
  # RESTORE it instead of each running every migration. It runs beside `image`, not inside it: `migrate` is built here
  # from the same checkout, because the image's exists only after the image build, so neither job waits for the other.
  # One shard (the `fresh` one, plain 1/3) migrates from an empty database and does not need this job, so a broken
  # migration still fails e2e whatever happens here.
  database:
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' }}
    name: database (migrated once, backed up)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # The files of every `docker compose` call of the job. compose.ci-db.yaml needs E2E_DB_DIR (set by the first step
      # that starts CockroachDB), so a step that runs before it cannot use compose.
      COMPOSE_FILE: deploy/local/compose.yaml:deploy/local/compose.ci.yaml:deploy/local/compose.ci-db.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build migrate
        working-directory: backend
        run: go build -o "$RUNNER_TEMP/migrate" ./cmd/migrate

      - name: Start CockroachDB
        run: |
          # compose.ci-db.yaml mounts this folder into CockroachDB, for BACKUP.
          echo "E2E_DB_DIR=$RUNNER_TEMP/database" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/database"
          E2E_DB_DIR="$RUNNER_TEMP/database" docker compose up --detach --wait cockroach

      - name: Migrate and back up
        env:
          DATABASE_URL: postgresql://root@127.0.0.1:26257/meurpg?sslmode=disable
        run: |
          "$RUNNER_TEMP/migrate" up
          docker compose exec -T cockroach \
            cockroach sql --insecure --host=localhost:26257 -e "BACKUP DATABASE meurpg INTO 'nodelocal://1/e2e'"
          # CockroachDB runs as root: the runner needs to read the files to upload them.
          sudo chown -R "$(id -u):$(id -g)" "$E2E_DB_DIR"

      - name: Show the database log
        # E2E_DB_DIR exists once "Start CockroachDB" began: an earlier failure has no database to show.
        if: ${{ failure() && env.E2E_DB_DIR != '' }}
        run: docker compose logs --no-color

      - name: Upload the migrated database
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-database
          path: ${{ runner.temp }}/database
          retention-days: 1
          if-no-files-found: error

  e2e:
    # The suite is split across nine runners, each with its own stack: six for the @a11y tests, the axe scans
    # being the long ones, and three for the rest. Each runner gets a list of tests balanced by measured time
    # (docs/ci.md, "End to end").
    name: playwright ${{ matrix.part }} (local stack with devidp)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Waits for `database` but does not depend on its success: the `fresh` shard migrates from an empty database and runs
    # even when the backup failed. The shards that restore it then fail at the download, with the artifact's name.
    needs: [image, database, plan]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' && needs.image.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The images and the local stack (compose.ci.yaml keeps CockroachDB in memory; compose.ci-images.yaml points the
      # services at the loaded images, --no-build), started in the background while Node, the e2e dependencies (no
      # install scripts) and Chromium for the exact @playwright/test version the lockfile pins install.
      - name: Note when the shard's setup starts
        id: setup
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Start the local stack (CockroachDB, migrations, devidp, API)
        id: stack
        uses: ./.github/actions/start-e2e-stack
        with:
          artifact: e2e-images
          # The `fresh` shard migrates from an empty database; the others restore the one the `database` job migrated.
          database-artifact: ${{ !matrix.fresh && 'e2e-database' || '' }}
          npm-cache: npm

      - name: Type-check the tests
        working-directory: e2e
        run: npm run typecheck

      - name: Check that the production image has no devidp
        # The api service runs the image the `image` job built from
        # backend/Dockerfile, the production image. devidp signs anyone in
        # without a password and must only ever exist in its own image (deploy/local/devidp.Dockerfile).
        # One runner checks it: they all run the same image.
        if: matrix.fresh
        env:
          COMPOSE_FILE: ${{ steps.stack.outputs.compose-file }}
          E2E_DB_DIR: ${{ steps.stack.outputs.database-dir }}
        run: |
          container=$(docker compose ps --quiet api)
          files=$(docker cp "$container:/app" - | tar -t)
          if ! grep -qx 'app/api' <<<"$files"; then
            echo "::error::/app/api not found; this check no longer matches the image layout." >&2
            exit 1
          fi
          if grep -q 'devidp' <<<"$files"; then
            echo "::error::The production image contains devidp:" >&2
            grep 'devidp' <<<"$files" >&2
            exit 1
          fi
          echo "The production image has only:"
          grep -v '^app/web/.' <<<"$files"

      - name: Choose this shard's tests
        # The tests are split by measured time (e2e/timings.json), not by Playwright's own --shard, which counts
        # tests: the accessibility scans are the long ones. Every shard computes the same split from the same
        # files, so each test is in exactly one list. A test the file does not know still runs. The fresh shard
        # is given fewer tests: its setup (the migrations, the devidp check) takes longer than the others'.
        # What the setup took goes in the timing artifact, to refresh that cost (docs/ci.md).
        working-directory: e2e
        env:
          GREP: ${{ matrix.grep }}
          SHARD: ${{ matrix.shard }}
          FRESH_FLAG: ${{ matrix.fresh_shard && format('--fresh-shard={0}', matrix.fresh_shard) || '' }}
          FRESH: ${{ matrix.fresh || false }}
          STARTED: ${{ steps.setup.outputs.started }}
        run: |
          # GREP holds several flags, so it is word-split on purpose.
          # shellcheck disable=SC2086
          node ../.github/scripts/e2e-shards.mjs setup "$FRESH" "$STARTED" $GREP | tee "$RUNNER_TEMP/e2e-setup.json"
          # FRESH_FLAG and GREP hold flags, so they are word-split on purpose.
          # shellcheck disable=SC2086
          node ../.github/scripts/e2e-shards.mjs list "$SHARD" $FRESH_FLAG $GREP > "$RUNNER_TEMP/tests.txt"
          wc -l < "$RUNNER_TEMP/tests.txt"

      - name: Run the Playwright tests
        # CI=true makes the config use Playwright's Chromium instead of an
        # installed Google Chrome. The global setup waits for /readyz. Each
        # runner runs its list. The JSON report is the timing of this shard,
        # for refreshing e2e/timings.json.
        working-directory: e2e
        env:
          GREP: ${{ matrix.grep }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/e2e-timing.json
        run: |
          # GREP holds several flags, so it is word-split on purpose.
          # shellcheck disable=SC2086
          npx playwright test $GREP --test-list "$RUNNER_TEMP/tests.txt"

      - name: Upload the timing of the tests
        # A help for refreshing e2e/timings.json: when it fails, the shard stays green if its tests passed.
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-timing-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/e2e-timing.json
            ${{ runner.temp }}/e2e-setup.json
          retention-days: 14
          if-no-files-found: warn

      - name: Show and save the stack logs
        # The backend log (the api container) next to the report: a test that fails on a page that never showed a
        # change needs the server's side of it (did the stream push the revision?). One read feeds the job page
        # and the file, which the report artifact keeps.
        # Not when the action failed before it started the stack: it prints its own log, and there are no files to name.
        if: ${{ failure() && steps.stack.outputs.compose-file != '' }}
        env:
          COMPOSE_FILE: ${{ steps.stack.outputs.compose-file }}
          E2E_DB_DIR: ${{ steps.stack.outputs.database-dir }}
        run: |
          mkdir -p e2e/stack-logs
          docker compose logs --no-color --timestamps | tee e2e/stack-logs/stack.log

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/stack-logs/
          retention-days: 7
          if-no-files-found: ignore

  # Opens (or adds to) a GitHub issue when a run outside a pull request fails,
  # so a red main or nightly does not go unnoticed.
  report:
    name: report (issue when main is red)
    needs: [lint, image, database, plan, e2e]
    # Only the upstream repository has issues: a fork's red main (synced from upstream) has nowhere to report.
    if: ${{ always() && github.repository == 'PuraFome/meuRPG' && github.event_name != 'pull_request' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/ci-red-report.sh
