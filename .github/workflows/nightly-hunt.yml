# The nightly hunt for flaky tests (docs/ci.md, "Flaky tests"). The gate runs every test once, in file order, on a quiet
# runner; this workflow runs them in a random order, and the Go ones three times and with the race detector, to find the
# test that only fails then: one that depends on another's leftovers, on the order, or on a race.
#
# - Playwright: the whole suite with `--shuffle <seed>`. The seed is printed in the plan job and in the summary, and sits
#   in the issue, so the same order can be replayed (dispatch this workflow with that seed).
# - Go: the go-db groups with `-shuffle=on -count=3 -race`, through gotestsum --jsonfile (never --rerun-fails: a rerun
#   hides the flake). The JSON is kept as an artifact: it is also where the per-test timings come from.
# - A failure opens or updates a `ci-red` issue with the test, its signature and the seed.
#
# It runs on the upstream repository only (the fork has no issues, and its runners are for flake-check).
#
# Every third-party action is pinned by full commit SHA; the `# vX.Y.Z` comment is for humans.
name: nightly-hunt

on:
  # 04:30 in São Paulo, after the 03:00 runs of the other workflows.
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Playwright shuffle seed to replay (empty: a new one)"
        type: string
        required: false

concurrency:
  group: nightly-hunt
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Pinned: a moving tool would change what the hunt finds. Dependabot does not track `go install`, so update by hand.
  GOTESTSUM_VERSION: v1.13.0
  SEED_INPUT: ${{ inputs.seed }}

jobs:
  plan:
    name: plan (the seed and the shards)
    if: ${{ github.repository == 'PuraFome/meuRPG' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      seed: ${{ steps.plan.outputs.seed }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Choose the seed and the shards
        id: plan
        run: |
          seed="$SEED_INPUT"
          if [ -z "$seed" ]; then seed=$(( (RANDOM * 32768 + RANDOM) % 2000000000 + 1 )); fi
          if ! [[ "$seed" =~ ^[0-9]+$ ]]; then echo "::error::the seed must be a number" >&2; exit 1; fi
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          # The shards of e2e.yml, all of them (the a11y ones too), each with the seed.
          matrix=$(jq -nc --arg seed "$seed" '
            [range(1; 4) | {part: "\(.)/3", args: "--grep-invert @a11y --shard=\(.)/3"}]
            + [range(1; 7) | {part: "a11y \(.)/6", args: "--grep @a11y --shard=\(.)/6"}]
            | map(. + {args: (.args + " --shuffle " + $seed)})
            | {include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Playwright shuffle seed: $seed"
          echo "Playwright shuffle seed: **$seed**" >> "$GITHUB_STEP_SUMMARY"

  image:
    name: images (production image and devidp)
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the images
        uses: ./.github/actions/build-e2e-images
        with:
          artifact: nightly-images

  playwright:
    name: playwright ${{ matrix.part }} (shuffled)
    needs: [plan, image]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the stack
        uses: ./.github/actions/start-e2e-stack
        with:
          artifact: nightly-images

      - name: Run the shuffled tests
        id: run
        working-directory: e2e
        env:
          CI: "true"
          PART_ARGS: ${{ matrix.args }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright.json
        run: |
          echo "playwright test $PART_ARGS"
          set +e
          # PART_ARGS holds several flags, so it is word-split on purpose.
          # shellcheck disable=SC2086
          npx playwright test $PART_ARGS --global-timeout=2400000
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Count the failures
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PART: ${{ matrix.part }}
          PART_ARGS: ${{ matrix.args }}
          RAW: ${{ runner.temp }}/playwright.json
        run: |
          mkdir -p result
          node .github/scripts/flake.mjs parse playwright "$RAW" --side nightly --replay "cd e2e && CI=true npx playwright test $PART_ARGS (with the stack up: make up)" > result/result.json
          cat result/result.json

      - name: Keep the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-result-playwright-${{ strategy.job-index }}
          path: result/result.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload the Playwright report
        if: ${{ failure() || steps.run.outputs.code != '0' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-playwright-report-${{ strategy.job-index }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Show the stack logs
        if: ${{ failure() || steps.run.outputs.code != '0' }}
        run: docker compose -f deploy/local/compose.yaml -f deploy/local/compose.ci.yaml -f deploy/local/compose.ci-images.yaml logs --no-color

      - name: Fail when a test failed
        if: ${{ !cancelled() && steps.run.outputs.code != '0' }}
        env:
          CODE: ${{ steps.run.outputs.code }}
        run: |
          echo "::error::playwright exited with code $CODE"
          exit 1

  go:
    name: go ${{ matrix.group }} (shuffled, 3 times, -race)
    needs: plan
    runs-on: ubuntu-26.04
    # -count=3 triples the groups' time of the gate (30 minutes at -count=1).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: [play-1, play-2, play-3, play-4, play-5, play-6, maps, characters, rules-1, rules-2, rules-3, dungeon, leak-1, leak-2, rest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install gotestsum (pinned)
        run: go install "gotest.tools/gotestsum@${GOTESTSUM_VERSION}"

      - name: Start CockroachDB (as the go-db jobs do)
        run: .github/scripts/start-cockroach.sh

      - name: Run the group shuffled
        id: run
        working-directory: backend
        env:
          MEURPG_TEST_DATABASE_URL: postgresql://root@localhost:26257/defaultdb?sslmode=disable
          MEURPG_REQUIRE_DB: "1"
          GROUP: ${{ matrix.group }}
        run: |
          mapfile -t packages < <(../.github/scripts/go-db-shard.sh "$GROUP")
          run_regex=$(../.github/scripts/go-db-shard.sh --run "$GROUP")
          run_args=()
          if [ -n "$run_regex" ]; then run_args=(-run "$run_regex"); fi
          set +e
          # No --rerun-fails: a test that fails is a finding, not a thing to run again.
          "$(go env GOPATH)/bin/gotestsum" --jsonfile "$RUNNER_TEMP/go-$GROUP.json" --format testname -- \
            -race -shuffle=on -count=3 -timeout 100m "${run_args[@]}" "${packages[@]}"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Count the failures
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          mkdir -p result
          # The script lists the packages with `go list`, which needs backend's go.mod.
          run_regex=$(cd backend && ../.github/scripts/go-db-shard.sh --run "$GROUP")
          node .github/scripts/flake.mjs parse go "$RUNNER_TEMP/go-$GROUP.json" --side nightly --count 3 --run "$run_regex" > result/result.json
          cat result/result.json

      - name: Keep the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-result-go-${{ matrix.group }}
          path: result/result.json
          retention-days: 7
          if-no-files-found: error

      - name: Keep the JSON of the run (failures, and the time of every test)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-go-json-${{ matrix.group }}
          path: ${{ runner.temp }}/go-${{ matrix.group }}.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail when a test failed
        if: ${{ !cancelled() && steps.run.outputs.code != '0' }}
        env:
          CODE: ${{ steps.run.outputs.code }}
        run: |
          echo "::error::gotestsum exited with code $CODE"
          exit 1

  # Opens (or adds to) a ci-red issue when the hunt found a failure, with the test, the signature and the seed.
  report:
    name: report (issue when the hunt finds a failure)
    needs: [plan, image, playwright, go]
    if: ${{ always() && github.repository == 'PuraFome/meuRPG' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Download the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-result-*
          path: results

      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
          SEED: ${{ needs.plan.outputs.seed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # With no failed test in the results (the stack never came up, a runner died) the issue still says the run failed.
          if ! node .github/scripts/flake.mjs issue results --sha "$SHA" --run-url "$RUN_URL" --seed "$SEED" > body.md; then
            printf 'A caça noturna a testes instáveis falhou na main, sem um teste que apareça nos resultados (a pilha não subiu, ou um runner caiu).\n\nCommit: %s\nExecução: %s\nSemente do Playwright: %s\n' "$SHA" "$RUN_URL" "$SEED" > body.md
          fi
          TITLE="CI vermelho: caça noturna a testes instáveis" .github/scripts/ci-red-report.sh body.md
