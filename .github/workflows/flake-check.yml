# flake-check: does a test fail without the train, and does the train make it fail more often?
#
# Run by hand (workflow_dispatch) on the fork (vfraga/meuRPG), so it never competes with a train's gate for the
# upstream runners. The fork holds a train branch only once it is pushed there: `git push fork refactor/train-<n>`
# before the dispatch. It runs one test, many times, on the head ref and on the
# base ref, each side on its own runners, and writes the counts and the first error line of each failure to the job
# summary and to the `flake-check` artifact. See docs/ci.md, "Flaky tests", for how to dispatch it and read it.
#
# The head is the ref the run is dispatched on (`--ref <train branch>`), the base is the default branch: there are no
# ref inputs, so the run never checks out a ref it was handed as text. The workflow file and the tools are the head's.
#
# Every third-party action is pinned by full commit SHA; the `# vX.Y.Z` comment is for humans.
name: flake-check

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "playwright or go"
        type: choice
        options: [playwright, go]
        required: true
      test:
        description: "Playwright: the --grep (a title or a regex). Go: the -run regex"
        type: string
        required: true
      package:
        description: "Go only: the package, relative to backend/ (for example ./internal/play)"
        type: string
        required: false
      runs:
        description: "Runs per side (rounded up to a multiple of runners)"
        type: string
        default: "30"
      runners:
        description: "Runners per side"
        type: string
        default: "5"

permissions:
  contents: read

env:
  # The inputs reach the steps only through the environment, never through ${{ }} in a script.
  KIND: ${{ inputs.kind }}
  TEST: ${{ inputs.test }}
  PACKAGE: ${{ inputs.package }}
  HEAD_REF: ${{ github.ref_name }}
  BASE_REF: ${{ github.event.repository.default_branch }}
  RUNS: ${{ inputs.runs }}
  RUNNERS: ${{ inputs.runners }}

jobs:
  # Checks the inputs and makes the matrix: side × runner, each runner repeating the test runs/runners times.
  plan:
    name: plan (the matrix)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check the inputs and make the matrix
        id: plan
        run: |
          fail() { echo "::error::$1" >&2; exit 1; }
          [[ "$KIND" == playwright || "$KIND" == go ]] || fail "kind must be playwright or go"
          [[ -n "$TEST" ]] || fail "test is empty"
          # Digits only before any arithmetic: $(( )) would evaluate an expression (or a variable name) as code.
          [[ "$RUNS" =~ ^[0-9]{1,3}$ ]] || fail "runs must be a number from 1 to 500"
          [[ "$RUNNERS" =~ ^[0-9]{1,2}$ ]] || fail "runners must be a number from 1 to 20"
          RUNS=$((10#$RUNS)); RUNNERS=$((10#$RUNNERS))
          [[ "$RUNS" -ge 1 && "$RUNS" -le 500 ]] || fail "runs must be a number from 1 to 500"
          [[ "$RUNNERS" -ge 1 && "$RUNNERS" -le 20 ]] || fail "runners must be a number from 1 to 20"
          if [[ "$KIND" == go ]]; then
            [[ "$PACKAGE" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ ]] || fail "a Go test needs its package (for example ./internal/play)"
          fi
          repeats=$(( (RUNS + RUNNERS - 1) / RUNNERS ))
          matrix=$(jq -nc --argjson runners "$RUNNERS" --argjson repeats "$repeats" '
            ["head", "base"]
            | [.[] as $side | range(1; $runners + 1) | {side: $side, runner: ., repeats: $repeats}]
            | {include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          {
            echo "Each side: $RUNNERS runner(s) × $repeats run(s) = $((RUNNERS * repeats)) runs (asked: $RUNS)."
          } >> "$GITHUB_STEP_SUMMARY"

  # Playwright: the images of each side, built once from that side's ref.
  images:
    name: images (${{ matrix.side }})
    needs: plan
    if: ${{ inputs.kind == 'playwright' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      matrix:
        side: [head, base]
    steps:
      - name: Checkout the tools (this workflow's own ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      # The head is the ref the run was dispatched on (no `ref:`: github.ref), the base the default branch. Neither
      # comes from an input, so a dispatch cannot make this run code from a ref of its choosing in main's context.
      - name: Checkout the head (the ref this run was dispatched on)
        if: ${{ matrix.side == 'head' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: code

      - name: Checkout the base (the default branch)
        if: ${{ matrix.side == 'base' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          path: code

      - name: Build the images
        uses: ./.github/actions/build-e2e-images
        with:
          code-dir: code
          artifact: flake-images-${{ matrix.side }}

  playwright:
    name: playwright ${{ matrix.side }} ${{ matrix.runner }}
    needs: [plan, images]
    if: ${{ inputs.kind == 'playwright' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout the tools (this workflow's own ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      # The head is the ref the run was dispatched on (no `ref:`: github.ref), the base the default branch. Neither
      # comes from an input, so a dispatch cannot make this run code from a ref of its choosing in main's context.
      - name: Checkout the head (the ref this run was dispatched on)
        if: ${{ matrix.side == 'head' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: code

      - name: Checkout the base (the default branch)
        if: ${{ matrix.side == 'base' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          path: code

      - name: Start the stack of this ref
        uses: ./.github/actions/start-e2e-stack
        with:
          code-dir: code
          artifact: flake-images-${{ matrix.side }}

      - name: Run the test
        # The runs are the measure: a failing test does not fail the step. A stack that never came up is counted too
        # (the global setup's error is a failure of "(the run)" in the summary).
        working-directory: code/e2e
        env:
          CI: "true"
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright.json
          REPEATS: ${{ matrix.repeats }}
        run: |
          set +e
          # The ref under test must not retry either: a retried failure would count as a pass.
          (cd ../.. && .github/scripts/e2e-no-retries.sh code/e2e/playwright.config.ts) || exit 1
          npx playwright test --grep="$TEST" --repeat-each="$REPEATS" --global-timeout=2100000
          echo "playwright exit code: $?"

      - name: Count the runs
        shell: bash
        env:
          SIDE: ${{ matrix.side }}
          RUNNER: ${{ matrix.runner }}
          RAW: ${{ runner.temp }}/playwright.json
        run: |
          mkdir -p result
          node .github/scripts/flake.mjs parse playwright "$RAW" --side "$SIDE" --runner "$RUNNER" | tee result/result.json

      - name: Keep the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-result-${{ matrix.side }}-${{ matrix.runner }}
          path: result/result.json
          retention-days: 7
          if-no-files-found: error

      - name: Save the stack logs
        # The backend log next to the traces: a repeat that fails because the page never showed a change needs the
        # server's side of it. Saved on every run (a flaky test fails inside a green job), shown only on failure.
        if: ${{ !cancelled() }}
        working-directory: code
        run: |
          mkdir -p e2e/stack-logs
          docker compose -f deploy/local/compose.yaml -f deploy/local/compose.ci.yaml -f deploy/local/compose.ci-images.yaml logs --no-color --timestamps > e2e/stack-logs/stack.log

      - name: Keep the traces of the failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-traces-${{ matrix.side }}-${{ matrix.runner }}
          path: |
            code/e2e/test-results/
            code/e2e/playwright-report/
            code/e2e/stack-logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Show the stack logs
        if: failure()
        working-directory: code
        run: cat e2e/stack-logs/stack.log || true

  go:
    name: go ${{ matrix.side }} ${{ matrix.runner }}
    needs: plan
    if: ${{ inputs.kind == 'go' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout the tools (this workflow's own ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      # The head is the ref the run was dispatched on (no `ref:`: github.ref), the base the default branch. Neither
      # comes from an input, so a dispatch cannot make this run code from a ref of its choosing in main's context.
      - name: Checkout the head (the ref this run was dispatched on)
        if: ${{ matrix.side == 'head' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: code

      - name: Checkout the base (the default branch)
        if: ${{ matrix.side == 'base' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          path: code

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: code/backend/go.mod
          # No cache: this workflow runs refs that are not main's, and must not write (or poison) a cache.
          cache: false

      - name: Start CockroachDB (as the go-db jobs do)
        run: .github/scripts/start-cockroach.sh

      - name: Run the test
        # -race and -count as in the gate. A failing test does not fail the step: the runs are the measure.
        working-directory: code/backend
        env:
          MEURPG_TEST_DATABASE_URL: postgresql://root@localhost:26257/defaultdb?sslmode=disable
          MEURPG_REQUIRE_DB: "1"
          REPEATS: ${{ matrix.repeats }}
        run: |
          set +e
          go test -race -json -timeout 35m -count="$REPEATS" -run "$TEST" "$PACKAGE" > "$RUNNER_TEMP/go.jsonl"
          echo "go test exit code: $?"

      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Count the runs
        shell: bash
        env:
          SIDE: ${{ matrix.side }}
          RUNNER: ${{ matrix.runner }}
        run: |
          mkdir -p result
          node .github/scripts/flake.mjs parse go "$RUNNER_TEMP/go.jsonl" --side "$SIDE" --runner "$RUNNER" | tee result/result.json

      - name: Keep the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-result-${{ matrix.side }}-${{ matrix.runner }}
          path: result/result.json
          retention-days: 7
          if-no-files-found: error

      - name: Keep the log of the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-log-${{ matrix.side }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/go.jsonl
          retention-days: 7
          if-no-files-found: ignore

  summary:
    name: summary (head against base)
    needs: [plan, playwright, go]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout the tools (this workflow's own ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Download the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flake-result-*
          path: results

      - name: Write the summary
        shell: bash
        run: |
          node .github/scripts/flake.mjs aggregate results --kind "$KIND" --test "$TEST" --head "$HEAD_REF" --base "$BASE_REF" --runs "$RUNS" --runners "$RUNNERS" --json flake-check.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the counts and signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-check
          path: flake-check.json
          retention-days: 30
