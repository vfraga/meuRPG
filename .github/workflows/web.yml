# CI for the Angular frontend (web/), served by the Go backend on the same
# origin (see docs/architecture.md#web-app-web).
#
# Every third-party action is pinned by full commit SHA (not by tag) so a
# moving tag can't silently change what runs in CI. The `# vX.Y.Z` comment
# is for humans only; GitHub Actions trusts the SHA.
name: web

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      - ".node-version"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      - ".node-version"

# Only a pull request's runs cancel each other (a newer push makes the older
# run pointless). A push to main always runs to the end, so every merge
# leaves a complete signal instead of cancelling the previous merge's run.
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    name: test and build
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      # Verified locally on 2026-09-29: `npm ci --ignore-scripts` installs
      # cleanly and both `npm test` and `npm run build` still work with it,
      # so we never run install scripts from third-party packages in CI.
      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      # ESLint is a ratchet: eslint-suppressions.json lists the violations that
      # existed when it was introduced, so this step fails only on a NEW one.
      - name: Lint
        run: npm run lint

      # Prettier formats the TypeScript, SCSS and JSON (not the Angular
      # templates: see web/.prettierignore). `npm run format` fixes it.
      - name: Formatting (Prettier)
        run: npm run format:check

      # The layer rules (core, shared, pages, shell) and the import cycles, with a ratchet like the lint
      # (.dependency-cruiser-known-violations.json, empty today: any violation fails). About 4 s.
      - name: Import rules (dependency-cruiser)
        run: npm run depcruise

      # The verdict: the plain run, where the setup file (src/test-setup.ts)
      # resets the stubbed globals and the clock after every test.
      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

  # The coverage run, in its own job so it can never cancel or skip the build
  # and runs in parallel with it (v8 instrumentation makes it slower than the
  # plain run, and it once ate the 15 minutes of "test and build"). It is
  # blocking: the floor (lines 89, statements 88, branches 84, functions 83,
  # today's numbers rounded down) is `coverageThresholds` in web/angular.json,
  # and the builder exits with an error under it. Raise the floor when the
  # numbers rise; never lower it to get green.
  coverage:
    name: coverage
    timeout-minutes: 25
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      # Verified locally on 2026-09-29: `npm ci --ignore-scripts` installs
      # cleanly and both `npm test` and `npm run build` still work with it,
      # so we never run install scripts from third-party packages in CI.
      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      # With --coverage the setup file (src/test-setup.ts) runs once per
      # worker, not once per spec file, so its own spec (test-setup.spec.ts) is
      # left out. Under the floor in angular.json the step fails.
      - name: Measure coverage (floor)
        run: npx ng test --watch=false --coverage --exclude src/test-setup.spec.ts

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f coverage/web/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/web/coverage-summary.json").total;
              const rows = ["lines", "statements", "functions", "branches"].map(
                (k) => "| " + k + " | " + t[k].pct + "% | " + t[k].covered + " / " + t[k].total + " |",
              );
              console.log(["### Web unit test coverage", "", "| | % | covered / total |", "| --- | --- | --- |"].concat(rows).join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-coverage
          path: web/coverage/
          retention-days: 7
          if-no-files-found: ignore
