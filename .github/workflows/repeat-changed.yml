# Repeats the tests a pull request changes, and a sample of the tests that use a helper it changes, many times (docs/ci.md,
# "Repeat of the changed tests"). A new or edited test that is flaky fails here, before it is merged, instead of
# holding a later train. It runs next to the gate, not in front of it.
#
# .github/scripts/flake-targets.mjs maps the diff to the tests; .github/scripts/repeat-changed.sh runs them within a time
# budget (a failure fails the job; running out of time passes and the job summary says what did not run).
#
# Every third-party action is pinned by full commit SHA; the `# vX.Y.Z` comment is for humans.
name: repeat-changed

on:
  pull_request:
    paths:
      - "e2e/**"
      - "backend/**"
      - ".github/workflows/repeat-changed.yml"
      - ".github/scripts/flake*.mjs"
      - ".github/scripts/repeat-changed.sh"
      - ".github/scripts/cockroach-only.sh"
      - ".github/scripts/start-*.sh"
      - ".github/actions/**"

concurrency:
  group: repeat-changed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # How long the tests of a job may run, in seconds: with the images (about 5 minutes) and the set-up, the job ends about
  # when the gate (the e2e shards, about 25 minutes) does.
  BUDGET_SECONDS: "900"
  REPEATS: "10"

jobs:
  targets:
    name: targets (which tests changed)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      playwright: ${{ steps.map.outputs.playwright }}
      go: ${{ steps.map.outputs.go }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the diff against the base branch needs it.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install TypeScript (the compiler API reads the specs; no install scripts)
        working-directory: e2e/lint
        run: npm ci --ignore-scripts

      - name: Map the diff to tests
        id: map
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          node .github/scripts/flake-targets.mjs --base "origin/${BASE_REF}" | tee targets.json
          echo "playwright=$(jq '.playwright | length > 0' targets.json)" >> "$GITHUB_OUTPUT"
          echo "go=$(jq '.go | length > 0' targets.json)" >> "$GITHUB_OUTPUT"
          {
            echo "## Tests to repeat"
            echo
            jq -r '.playwright[] | "- Playwright: \(.title) (\(.why))"' targets.json
            jq -r '.go[] | "- Go: \(.pkg) \(.test) (\(.why))"' targets.json
            jq -r '.notes[] | "- note: \(.)"' targets.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the targets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repeat-targets
          path: targets.json
          retention-days: 1

  images:
    name: images (the stack of this pull request)
    needs: targets
    if: ${{ needs.targets.outputs.playwright == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the images
        uses: ./.github/actions/build-e2e-images
        with:
          artifact: repeat-images

  playwright:
    name: repeat the changed Playwright tests (both themes)
    needs: [targets, images]
    if: ${{ needs.targets.outputs.playwright == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the stack
        uses: ./.github/actions/start-e2e-stack
        with:
          artifact: repeat-images

      - name: Download the targets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repeat-targets

      - name: Repeat
        working-directory: e2e
        env:
          CI: "true"
          RESET_STACK_CMD: >-
            docker compose -f ../deploy/local/compose.yaml -f ../deploy/local/compose.ci.yaml -f ../deploy/local/compose.ci-images.yaml
            up -d --no-build --no-deps --wait --force-recreate api
        run: ../.github/scripts/repeat-changed.sh playwright ../targets.json

      - name: Show the stack logs
        if: failure()
        run: docker compose -f deploy/local/compose.yaml -f deploy/local/compose.ci.yaml -f deploy/local/compose.ci-images.yaml logs --no-color

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repeat-playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/kept/
          retention-days: 7
          if-no-files-found: ignore

  go:
    name: repeat the changed Go tests (-race)
    needs: targets
    if: ${{ needs.targets.outputs.go == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Start the test database (the same one the go-db jobs use)
        id: db
        uses: ./.github/actions/test-database

      - name: Download the targets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repeat-targets

      - name: Repeat
        working-directory: backend
        env:
          MEURPG_TEST_DATABASE_URL: ${{ steps.db.outputs.url }}
          MEURPG_REQUIRE_DB: "1"
          DATABASE: ${{ steps.db.outputs.database }}
        run: |
          # On PostgreSQL the tests that need CockroachDB itself are not repeated (backend/cockroach-only-tests.txt).
          if [ "$DATABASE" = postgres ]; then GO_SKIP=$(../.github/scripts/cockroach-only.sh skip-regex); export GO_SKIP; fi
          ../.github/scripts/repeat-changed.sh go ../targets.json
