# CI for the Go backend and the Protobuf/Connect contracts it is generated from.
#
# Every third-party action is pinned by full commit SHA (not by tag), because
# a moving tag can be repointed by whoever controls the action's repo. The
# `# vX.Y.Z` comment next to each SHA is just for humans; only the SHA is
# actually trusted by GitHub Actions.
name: backend

on:
  # No paths filter: the `changes` job selects, so a train (refactor/train-*) always runs the full gate.
  pull_request:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "proto/**"
      - "web/**"
      - "Makefile"
      - ".github/workflows/backend.yml"
      - ".github/scripts/go-db-shard.sh"
      - ".github/scripts/cockroach-only.sh"
      - ".github/scripts/start-cockroach.sh"
      - ".github/scripts/start-postgres.sh"
      - ".github/actions/test-database/**"
      - ".github/scripts/go-coverage.sh"
      - ".github/scripts/go-complexity.sh"
      - ".github/scripts/nolint-cap.sh"
      - ".github/nolint-cap"
      - ".node-version"
  # The nightly run and a manual run test everything, with no path filter
  # (03:00 in São Paulo).
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Cancel a still-running run for the same PR when a new commit lands, so we
# don't waste runners on outdated code. A push to main never cancels: every
# merge leaves a complete signal instead of cancelling the previous merge's run.
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this workflow only reads the repo, it never pushes,
# comments, or touches packages/deployments.
permissions:
  contents: read

jobs:
  # Decides what runs (docs/ci.md, "What runs when"). `run`: the workflow at all, for a change to what it judges; `go`:
  # the Go jobs, which a web-only change (that still reaches the proto job for its generated TypeScript) skips. A
  # train (refactor/train-*), main, the nightly and manual runs always run everything. On a fork only pull requests
  # and manual runs run.
  changes:
    name: changes (what runs)
    if: ${{ github.repository == 'PuraFome/meuRPG' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      # Only a pull request that is not a train is judged by its files, so only it needs the history and the diff.
      # Main, the schedule, a manual run and a train (a branch of this repository) are answered here, without a checkout.
      DIFF: ${{ github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'refactor/train-') && github.event.pull_request.head.repo.full_name == github.repository) }}
    outputs:
      run: ${{ steps.all.outputs.run || steps.run.outputs.selected }}
      go: ${{ steps.all.outputs.go || steps.go.outputs.selected }}
    steps:
      - name: Everything is selected
        id: all
        if: env.DIFF != 'true'
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: env.DIFF == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the diff against the base branch needs it.
          fetch-depth: 0

      - name: Is this workflow selected
        id: run
        if: env.DIFF == 'true'
        uses: ./.github/actions/select
        with:
          pattern: '^(backend/|proto/|web/|Makefile$|\.github/workflows/backend\.yml$|\.github/scripts/(go-(db-shard|coverage|complexity)|nolint-cap|cockroach-only|start-(cockroach|postgres))\.sh$|\.github/actions/test-database/|\.github/nolint-cap$|\.node-version$)'

      - name: Do the Go jobs run
        id: go
        if: env.DIFF == 'true'
        uses: ./.github/actions/select
        with:
          pattern: '^(backend/|proto/|Makefile$|\.github/workflows/backend\.yml$|\.github/scripts/(go-(db-shard|coverage|complexity)|nolint-cap|cockroach-only|start-(cockroach|postgres))\.sh$|\.github/actions/test-database/|\.github/nolint-cap$)'

  proto:
    name: proto (lint, breaking, generate)
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (buf generate shells out to Go tool plugins)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install buf
        # setup_only: install the pinned buf CLI and nothing else. The steps
        # below run lint, format and breaking explicitly, so each one shows
        # up as its own step in the logs.
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: "1.73.0"
          setup_only: true

      - name: buf lint
        working-directory: proto
        run: buf lint

      - name: buf format check
        working-directory: proto
        run: buf format --diff --exit-code

      - name: buf breaking (against main)
        working-directory: proto
        run: buf breaking --against 'https://github.com/${{ github.repository }}.git#branch=main,subdir=proto'

      - name: Download backend Go module dependencies
        working-directory: backend
        run: go mod download

      - name: Set up Node (buf generate's TypeScript plugin runs from web/node_modules)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies (no install scripts)
        working-directory: web
        run: npm ci --ignore-scripts

      - name: buf generate
        working-directory: proto
        run: buf generate

      - name: Verify generated code is up to date
        run: |
          # sqlc regenerates the query code (backend/internal/*/*db), with
          # the version pinned in the Makefile.
          make sqlc
          # Catches both changes to tracked generated files and any brand
          # new generated file that wasn't committed: Go and TypeScript from
          # buf, Go from sqlc. Nothing else under backend/ changes in CI.
          git diff --exit-code -- backend web/src/gen
          if [ -n "$(git status --porcelain -- backend web/src/gen)" ]; then
            echo "::error::generated code is not committed. Run 'make proto sqlc' and commit the result." >&2
            git status --porcelain -- backend web/src/gen
            exit 1
          fi

  go:
    # No `go test` here: go-db runs every package (the pure ones too, with
    # -race), so a test run in this job only repeated it. This job is the
    # fast, database-free check: lint and the complexity limits. The image
    # build moved to the e2e workflow, which builds it once and runs it. The
    # module boundaries are a test (internal/archtest), so go-db's "rest"
    # group runs them. Known vulnerabilities are the govulncheck job.
    name: go (lint)
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the lint ratchet below needs the merge base of
          # the branch and main (a shallow clone has none).
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Choose what the linters judge (the ratchet)
        # The linters added on 07/10/2026 (complexity, magic values, test
        # helpers...) have a backlog of old findings that nobody can fix in
        # one PR. They are enforced on what a change ADDS: on a pull request,
        # the lines changed since the merge base with the base branch; on a
        # push to main, the lines of the pushed commits (before..after), so
        # main is never judged as a whole. `make lint-all` shows the backlog.
        id: ratchet
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "args=--new-from-merge-base=origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "args=--new-from-rev=$BEFORE" >> "$GITHUB_OUTPUT"
          else
            echo "args=--new-from-rev=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: backend
          args: ${{ steps.ratchet.outputs.args }}

      - name: No function over the complexity limits (cyclomatic > 15, cognitive > 15, maintainability < 20)
        # The ratchet above judges a function only when its `func` line
        # changes; this judges every body, so no hand-written function of
        # backend/ may pass a limit, old or new. It runs even when
        # golangci-lint found something, so one push shows both. Uses the
        # golangci-lint the step above put on PATH (for maintidx); the first
        # `go run` of gocyclo and gocognit downloads and builds them.
        if: ${{ !cancelled() }}
        run: ../.github/scripts/go-complexity.sh

      - name: No more //nolint directives than the committed cap
        # A suppression is a debt that only goes down: the count of //nolint
        # in backend/ (tests included, generated files left out) may not pass
        # the number in .github/nolint-cap. A lower count passes; raising the
        # number is an edit the reviewer sees.
        if: ${{ !cancelled() }}
        run: ../.github/scripts/nolint-cap.sh

  # The known vulnerabilities that the Go code actually calls (Dependabot and
  # osv-scan flag every vulnerable module, called or not). It runs on the same
  # triggers as the other Go jobs, and nightly because a vulnerability is
  # published against code that did not change. A called vulnerability fails it.
  govulncheck:
    name: govulncheck (called vulnerabilities)
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: govulncheck
        # Invoked directly (rather than golang/govulncheck-action) so the
        # govulncheck version itself is pinned: the action installs
        # govulncheck@latest, which is a moving target.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # The packages are split into groups (.github/scripts/go-db-shard.sh), each
  # on its own runner with its own CockroachDB, so the wall time is the
  # slowest group's, not the sum. 07/10/2026, one runner: 1105 s of go test.
  # 10/10/2026, four groups: 18 min for "rest" and "play", which was one
  # package of 920 s. Now play is split by test (play-1 to play-3), and the
  # CPU-bound pure packages (pure), leaktest (leak) and campaigns plus
  # campaignpackage (camp) have runners of their own, so they stop fighting
  # for four vCPUs. "rest" is still the catch-all for a new package.
  go-db-shard:
    name: go-db ${{ matrix.group }} (tests against CockroachDB)
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [play-1, play-2, play-3, maps, characters, pure, leak, camp, rest]
    defaults:
      run:
        working-directory: backend
    env:
      # The same image, pinned by the same digest, as deploy/local/compose.yaml,
      # pulled from Cockroach Labs' own registry on Google Cloud instead of
      # Docker Hub, whose anonymous pull limit GitHub's shared runners hit.
      # A digest names the bytes, so the registry does not change the image.
      # Keep the digest in sync with compose.yaml and compose.ci.yaml.
      COCKROACH_IMAGE: us-docker.pkg.dev/cockroach-cloud-images/cockroachdb/cockroach:v26.2.8@sha256:1ad58b6a69928691e0c9289b847dcb35ac25108c6ead23fcabf47e37b9195e9a
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Check that the groups cover every package
        # Cheap (a `go list`). A new package falls into "rest" on its own;
        # this fails if a package named in a group was renamed or deleted.
        run: |
          ../.github/scripts/go-db-shard.sh --check
          ../.github/scripts/cockroach-only.sh check-names

      - name: Start the test database
        # PostgreSQL in a preflight, CockroachDB in a train, on main, in the nightly run and in a manual run: the action
        # decides (docs/ci.md, "Which database the tests run on"). It starts the same single node, insecure, in memory
        # CockroachDB this job always had (.github/scripts/start-cockroach.sh), or a PostgreSQL 17 with SERIALIZABLE
        # by default and durability off (.github/scripts/start-postgres.sh).
        id: db
        uses: ./.github/actions/test-database

      - name: go test -race (this group, with the database)
        # With MEURPG_TEST_DATABASE_URL set, the integration tests
        # (migrations, stores, the 40001 retry) run instead of being skipped.
        # Each test creates and drops its own database.
        # -timeout: each package gets 25 minutes, under the job's 30. Go's
        # default is 10 minutes per package; play and maps took 7 to 10
        # minutes sharing one CockroachDB with every other package (04 and
        # 07/10/2026). Each group now has its own database, so they have room.
        # MEURPG_REQUIRE_DB=1: a missing URL fails the tests instead of
        # skipping them (about a thousand would skip and the job stay green).
        # On PostgreSQL the tests that need CockroachDB itself (backend/cockroach-only-tests.txt) are left out by name
        # and printed here; they run in the CockroachDB runs. A test outside the list that needs CockroachDB fails.
        env:
          MEURPG_TEST_DATABASE_URL: ${{ steps.db.outputs.url }}
          MEURPG_REQUIRE_DB: "1"
          GROUP: ${{ matrix.group }}
          DATABASE: ${{ steps.db.outputs.database }}
        run: |
          # -coverpkg=./... counts what the integration tests cover in OTHER
          # packages too (a store tested through its service); -covermode=
          # atomic is the only mode that is safe with -race.
          # A play part runs only its tests: -run '^(TestA|TestB)$'. The
          # packages and the regex are read into arrays, never word-split.
          mapfile -t packages < <(../.github/scripts/go-db-shard.sh "$GROUP")
          run_regex=$(../.github/scripts/go-db-shard.sh --run "$GROUP")
          run_args=()
          if [ -n "$run_regex" ]; then run_args=(-run "$run_regex"); fi
          if [ "$DATABASE" = postgres ]; then
            echo "On PostgreSQL these tests are left out; they run on CockroachDB:"
            ../.github/scripts/cockroach-only.sh show
            run_args+=(-skip "$(../.github/scripts/cockroach-only.sh skip-regex)")
          fi
          go test -race -timeout 25m -covermode=atomic -coverpkg=./... \
            -coverprofile="cover-$GROUP.out" \
            "${run_args[@]}" "${packages[@]}"

      - name: Keep this group's coverage profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-cover-${{ matrix.group }}
          path: backend/cover-${{ matrix.group }}.out
          if-no-files-found: ignore
          retention-days: 3


  # The list of the tests that need CockroachDB itself (backend/cockroach-only-tests.txt) is true: every listed test
  # exists, and every one of them fails on PostgreSQL, so a test that stops needing CockroachDB leaves the list. The
  # other half of the rule, a test outside the list that needs CockroachDB, fails in the groups above. Only on
  # PostgreSQL there is something to check; in the CockroachDB runs the job ends after the names.
  cockroach-only-list:
    name: go-db cockroach-only list (the listed tests fail on PostgreSQL)
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Check the names
        run: .github/scripts/cockroach-only.sh check-names

      - name: Pick the database
        id: db
        uses: ./.github/actions/test-database
        with:
          start: "false"

      - name: Start PostgreSQL
        if: ${{ steps.db.outputs.database == 'postgres' }}
        run: .github/scripts/start-postgres.sh

      - name: Run the listed tests on PostgreSQL
        if: ${{ steps.db.outputs.database == 'postgres' }}
        env:
          MEURPG_TEST_DATABASE_URL: ${{ steps.db.outputs.url }}
        run: .github/scripts/cockroach-only.sh check-list

  # One stable check for the whole matrix: the name below is the old job's, so
  # a branch protection rule can require it however the groups change. The
  # matrix jobs' own names carry the group.
  go-db:
    name: go (integration tests against CockroachDB)
    needs: [changes, go-db-shard, cockroach-only-list]
    # Not on a fork's push: `changes` is skipped there, and a skipped `changes` would fail the check below.
    if: ${{ always() && (github.repository == 'PuraFome/meuRPG' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every group passed
        # The groups are skipped on purpose when the change has no Go in it;
        # that is a pass. A failed `changes` job is not: nothing was judged.
        env:
          CHANGES: ${{ needs.changes.result }}
          GO: ${{ needs.changes.outputs.go }}
          RESULT: ${{ needs.go-db-shard.result }}
          LIST: ${{ needs.cockroach-only-list.result }}
        run: |
          echo "changes: $CHANGES, go: $GO, go-db groups: $RESULT, cockroach-only list: $LIST"
          [ "$CHANGES" = success ] || exit 1
          if [ "$GO" = true ]; then
            [ "$RESULT" = success ] && [ "$LIST" = success ]
          else
            [ "$RESULT" = skipped ] && [ "$LIST" = skipped ]
          fi

  # Merges the groups' coverage profiles into one total and a per-package
  # table in the job summary (no upload to any outside service), and holds
  # the pure rules packages to a floor. Runs only when every group passed:
  # the floor is judged on a full set of profiles, never on a partial one.
  go-coverage:
    name: go (coverage)
    needs: [changes, go-db-shard]
    if: ${{ needs.go-db-shard.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download the groups' profiles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: go-cover-*
          path: backend/cover
          merge-multiple: true

      - name: Merge, report and check the floor
        run: ../.github/scripts/go-coverage.sh cover/cover-*.out

  # Opens (or adds to) a GitHub issue when a run outside a pull request fails,
  # so a red main or nightly does not go unnoticed.
  report:
    name: report (issue when main is red)
    needs: [proto, changes, go, govulncheck, go-db-shard, go-db, go-coverage]
    # Only the upstream repository has issues: a fork's red main (synced from upstream) has nowhere to report.
    if: ${{ always() && github.repository == 'PuraFome/meuRPG' && github.event_name != 'pull_request' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/ci-red-report.sh
