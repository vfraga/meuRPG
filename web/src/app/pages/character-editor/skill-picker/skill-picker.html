<p class="skills__summary" aria-live="polite">{{ summary() }}</p>
<div class="skills" role="group" aria-label="Perícias">
  @for (column of columns(); track $index; let first = $first) {
    <div class="skills__column">
      <div class="skill skill--head" [class.skill--head-repeat]="!first" aria-hidden="true">
        <span>Perícia</span>
        <span class="skill__ability">Habilidade</span>
        <span class="skill__expertise">Especialização</span>
      </div>
      @for (skill of column; track skill.key) {
        <div class="skill">
          <mat-checkbox
            class="skill__name"
            [checked]="isProficient(skill.key)"
            [disabled]="granted().has(skill.key)"
            (change)="toggleSkill.emit(skill.key)"
          >
            {{ skill.namePt }}
            @if (granted().get(skill.key); as source) {
              <span class="skill__source">{{ source }}</span>
            }
          </mat-checkbox>
          <span class="skill__ability">{{ abilityAbbreviation(skill.ability) }}</span>
          <mat-checkbox
            class="skill__expertise"
            [checked]="expertise().has(skill.key)"
            [disabled]="!isProficient(skill.key)"
            [aria-label]="'Especialização em ' + skill.namePt"
            (change)="toggleExpertise.emit(skill.key)"
          />
        </div>
      }
    </div>
  }
</div>
