<section class="mr-panel content" aria-labelledby="content-heading">
  <app-panel-head icon="menu_book" title="Conteúdo da mesa" titleId="content-heading" />

  @let s = state();
  @switch (s.status) {
    @case ('loading') {
      <p class="content__text" role="status">Carregando o conteúdo...</p>
    }
    @case ('error') {
      <div class="mr-notice mr-notice--danger" role="alert">
        <mat-icon aria-hidden="true">error</mat-icon>
        <p>{{ s.message }}</p>
      </div>
    }
    @case ('ready') {
      @if (s.leftOut > 0) {
        <div class="mr-notice mr-notice--danger">
          <mat-icon aria-hidden="true">error_outline</mat-icon>
          <p>
            <strong>{{ leftOut() }}</strong>
            <a class="content__link" [routerLink]="['/campaigns', campaignId(), 'content']">Ver o conteúdo da mesa</a>
          </p>
        </div>
      }
      <p class="content__text">
        {{ counts() || 'Nada criado ainda.' }} O SRD continua valendo.
      </p>
    }
  }
  <div>
    <app-panel-action
      label="Abrir o conteúdo"
      [underline]="true"
      [link]="['/campaigns', campaignId(), 'content']"
    />
  </div>
</section>
