<a class="skip-link" href="#main" (click)="skipToContent($event)">Pular para o conteúdo</a>

<header class="app-bar">
  <a class="app-bar__brand" routerLink="/">MeuRPG</a>

  @if (liveSession(); as live) {
    <a
      class="app-bar__live app-bar__live--phone"
      [routerLink]="['/campaigns', live.campaignId, 'session']"
      [attr.aria-label]="liveLabel(live)"
      ><app-live-pill
    /></a>
  }

  <ng-container #notesSlot />

  <button
    type="button"
    class="app-bar__toggle"
    aria-controls="app-bar-menu"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="menuOpen() ? 'Fechar o menu' : 'Abrir o menu'"
    (click)="toggleMenu()"
  >
    <mat-icon aria-hidden="true">{{ menuOpen() ? 'close' : 'menu' }}</mat-icon>
  </button>

  <div id="app-bar-menu" class="app-bar__menu" [class.app-bar__menu--open]="menuOpen()">
    <nav class="app-bar__nav" aria-label="Principal">
      <a
        class="app-bar__link"
        routerLink="/"
        routerLinkActive="app-bar__link--active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        >Início</a
      >
      <a
        class="app-bar__link"
        routerLink="/campaigns"
        routerLinkActive="app-bar__link--active"
        ariaCurrentWhenActive="page"
        >Minhas campanhas</a
      >
    </nav>
    <ng-container #notesSlot />
    @if (liveSession(); as live) {
      <a
        class="app-bar__live app-bar__live--wide"
        [routerLink]="['/campaigns', live.campaignId, 'session']"
        [attr.aria-label]="liveLabel(live)"
        ><app-live-pill
      /></a>
    }
    <app-user-menu class="app-bar__user" />
  </div>
</header>

<main id="main" class="app-content" tabindex="-1" #main>
  <app-live-notice [url]="url()" />
  @if (navigating()) {
    <p class="app-loading" role="status">Abrindo a página...</p>
  }
  <router-outlet />
</main>

<app-footer />

<!-- The dice overlay is the only thing in the shell that needs the generated rules and contest code (about 70 kB), and nothing
     rolls before a page that can roll has loaded (the chunk is requested when the browser is idle, right after the first screen). -->
@defer (on idle) {
  <app-roll-overlay />
}
