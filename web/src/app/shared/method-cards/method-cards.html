<div class="cards" role="group" aria-label="Jeitos de fazer as habilidades">
  @for (c of cards(); track c.key) {
    <label class="card" [class.card--on]="rules()[c.key]">
      <input type="checkbox" class="mr-visually-hidden" [checked]="rules()[c.key]" (change)="toggle(c.key)" />
      <span class="box" aria-hidden="true">
        @if (rules()[c.key]) {
          <mat-icon>check</mat-icon>
        }
      </span>
      <span class="text">
        <span class="title">{{ c.title }}</span>
        <span class="desc">{{ c.text }}</span>
        @if (c.srd) {
          <span class="srd">{{ label }}</span>
        }
      </span>
    </label>
  }
</div>
